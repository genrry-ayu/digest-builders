much cheaper and basically unlimited usage and I'm running low on Sol :P Can it do complex browser automation tasks? That's 50% of my Codex usage.","createdAt":"2026-08-05T03:51:18.000Z","url":"https://x.com/petergyang/status/2084849701351035182","likes":58,"retweets":3,"replies":19},{"text":"Easier to make more money from @X payouts than from a micro SaaS these days","createdAt":"2026-08-05T03:37:21.000Z","url":"https://x.com/petergyang/status/2084846191456751725","likes":25,"retweets":1,"replies":12}]},{"name":"Nan Yu","handle":"thenanyu","bio":"head of product @linear","tweets":[{"text":"Old heads remember Will Smith eating noodles","createdAt":"2026-08-05T00:34:44.000Z","url":"https://x.com/thenanyu/status/2084800235474178138","likes":11,"retweets":0,"replies":1},{"text":"The real ones remember","createdAt":"2026-08-04T22:45:00.000Z","url":"https://x.com/thenanyu/status/2084772618314428627","likes":6,"retweets":0,"replies":0}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"Ok builders, here’s your playbook. Prototype your product with the best frontier model. Cost be damned. Validate the user experience. Then, 6-8 weeks later when open-weight models catch up - move your production workloads there, and to smaller models where possible. In that order. Don’t start with the cheapest model.","createdAt":"2026-08-05T01:11:13.000Z","url":"https://x.com/realmadhuguru/status/2084809416105472070","likes":17,"retweets":0,"replies":3},{"text":"The best model for early product validation is almost never the best model for production. Talked to a bunch of founders this weekend. There’s a standard playbook emerging : 1/ Prototype with the best frontier models. Max quality. Ignore cost and latency. Learn what users actually want and iterate. 2/ Once the workflow and UX is validated, optimize like crazy for cost and latency - prompt eng, model routing, harnesses, smaller models, fine tuning. I see most teams get stuck in step 1.","createdAt":"2026-08-04T15:47:04.000Z","url":"https://x.com/realmadhuguru/status/2084667443046502631","likes":40,"retweets":1,"replies":6}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"One might say, the investigation was Bari’d.","createdAt":"2026-08-05T03:26:42.000Z","url":"https://x.com/amasad/status/2084843512496034002","likes":168,"retweets":6,"replies":11}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Vercel is the Vercel for backends. @FactoryAI powers their API services with Fluid compute, with billions of requests per month.","createdAt":"2026-08-05T00:50:14.000Z","url":"https://x.com/rauchg/status/2084804138169446449","likes":188,"retweets":8,"replies":17},{"text":"1 line of code in @aisdk saves you 90% or more in DeepSeek v4 Flash AI Gateway tokens","createdAt":"2026-08-04T23:12:05.000Z","url":"https://x.com/rauchg/status/2084779435866398801","likes":238,"retweets":8,"replies":32},{"text":"𝟸𝟶𝟸𝟼 𝟷,𝟶𝟿𝟹,𝟷𝟿𝟿,𝟿𝟾𝟽+","createdAt":"2026-08-04T16:47:22.000Z","url":"https://x.com/rauchg/status/2084682618927558811","likes":398,"retweets":9,"replies":51}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"One fun benefit of spending so much time with enterprises is you get to see the array of AI implementation strategies that exist in companies right now. Unlike the early innings of cloud where there were really only a couple deployment patterns available -including being limited by only a couple infra vendors existing- AI actually has a much wider range of approaches in the enterprise. If you ask 10 IT leaders what their coding agent strategy looks like, you get at least 5 different answers. If you ask about their end-user productivity agents, some have standardized on ChatGPT or Claude, others offer a choice of multiple solutions, and many have built their own orchestration layers for empl…","createdAt":"2026-08-05T02:28:08.000Z","url":"https://x.com/levie/status/2084828773808239080","likes":145,"retweets":14,"replies":34}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"It's insane that the CA Dem Party is endorsing yes on Prop 40, the asset seizure tax that will destroy the California tax base","createdAt":"2026-08-04T18:15:29.000Z","url":"https://x.com/garrytan/status/2084704793432588435","likes":1140,"retweets":65,"replies":92},{"text":"If you want housing prices to go down, you build more housing. Markets work. If you want housing prices to go up, you try to abolish rent and foment mass asset seizure and expropriation. The revolution only serves those who foment it.","createdAt":"2026-08-04T14:37:48.000Z","url":"https://x.com/garrytan/status/2084650011288375751","likes":241,"retweets":38,"replies":31}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"Everyone on X: \"damn, Airtable sold for so low!\" Many SaaS founders, secretly: \"damn, I'd take that any day, at least they had an exit\"","createdAt":"2026-08-04T21:51:38.000Z","url":"https://x.com/mattturck/status/2084759190195536202","likes":117,"retweets":2,"replies":18},{"text":"What the world What Europeans thinks Europeans in tech actually in tech do in the do in the Summer. Summer.","createdAt":"2026-08-04T13:41:47.000Z","url":"https://x.com/mattturck/status/2084635916480450888","likes":110,"retweets":10,"replies":14}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Dangerously skips permissions. Harvard’17. GitHub: YouTube:","tweets":[{"text":"Contrary to popular perception, most people will not adopt a new technology just because it makes them more efficient. Instead, they’ll adopt new technology because: - Someone they know who’s similar to them on some dimension adopted the technology, and got positive results (eg became cooler, richer, more popular/respected), and they wanna become like that person - They feel like everyone around them has adopted the technology, and if they don’t, they’ll be left behind Notice that it’s not entirely a rational decision. It’s more of an EMOTIONAL decision. So if you’re trying to make someone adopt a new technology, the messaging shouldn’t be “this will make you 10x more efficient!” It should…","createdAt":"2026-08-05T02:28:28.000Z","url":"https://x.com/zarazhangrui/status/2084828855404294266","likes":90,"retweets":10,"replies":13},{"text":"The best AI training isn't a course. It's pulling an agent into your team's group chat & letting people watch it work Every company rolling out \"AI enablement programs\" should try that first","createdAt":"2026-08-04T13:42:03.000Z","url":"https://x.com/zarazhangrui/status/2084635984164237792","likes":44,"retweets":3,"replies":12},{"text":"How to judge if a meeting is efficient: An efficient meeting has no to-do list left behind, because all the actions are done DURING the meeting (either by agents who listen to the meeting in real time or by humans) The gap between saying and doing should be zero, and meetings become work sessions where things actually get DONE","createdAt":"2026-08-04T11:26:02.000Z","url":"https://x.com/zarazhangrui/status/2084601752817729811","likes":74,"retweets":3,"replies":21}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"the best vibey, air conditioned, quiet coffee shop to meet founders discretely does not exi-","createdAt":"2026-08-04T17:08:05.000Z","url":"https://x.com/nikunj/status/2084687833516691844","likes":221,"retweets":1,"replies":25},{"text":"My SF brain shudders at the thought of how much collective time is lost waiting for New York elevators.. Hotel elevators are simply the worst. Who designed two elevators for 30+ floors? I spent 12 mins recently just trying to get down from my room 😅","createdAt":"2026-08-04T13:01:02.000Z","url":"https://x.com/nikunj/status/2084625658173415726","likes":22,"retweets":0,"replies":10}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"the best founders know there is no spoon","createdAt":"2026-08-04T19:12:03.000Z","url":"https://x.com/danshipper/status/2084719029575647660","likes":97,"retweets":2,"replies":7},{"text":"so freaking cool","createdAt":"2026-08-04T17:28:12.000Z","url":"https://x.com/danshipper/status/2084692896696111243","likes":189,"retweets":7,"replies":1},{"text":"agree except they’ll still be heroes once the agency rupture heals and the AI goes back to being invisible, we’ll think only about the humans and what they’ve done. AI use will be assumed and unimportant","createdAt":"2026-08-04T13:35:44.000Z","url":"https://x.com/danshipper/status/2084634391079469390","likes":70,"retweets":1,"replies":16}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"More on why we invested:","createdAt":"2026-08-04T17:21:40.000Z","url":"https://x.com/adityaag/status/2084691249332649995","likes":3,"retweets":0,"replies":0},{"text":".@TryRivo is building self-driving finance. Agents connect to the checking account you already have, learn your cash flow, sweep dollars into Treasury-backed yield, and bring them back before your bills hit. Every dollar earns until the moment you spend it. Why is this hard? Prediction under asymmetric cost. Money returned a day early costs you a little yield. Money returned a day late bounces a bill and destroys trust. @AmbrishTweets is one of the few people who has shipped this class of system before. PhD in AI, 7,000+ citations, built consumer AI at Amazon, and led the L4 autonomy work at Cruise that launched robotaxis, before he came through @spc as a Founder Fellow. Self-driving cars t…","createdAt":"2026-08-04T17:21:39.000Z","url":"https://x.com/adityaag/status/2084691244496625793","likes":13,"retweets":4,"replies":4},{"text":"The right way to deploy AI at scale is to be able to understand how it works. It does NOT need to be a black box. This is a key step in helping us understand what is going in these LLMs.","createdAt":"2026-08-04T16:24:01.000Z","url":"https://x.com/adityaag/status/2084676740924764625","likes":27,"retweets":3,"replies":0}]},{"name":"Sam Altman","handle":"sama","bio":"AI is cool i guess","tweets":[{"text":"i would rather be an optimist and work hard than a pessimist posting about why things won't work. it's much more difficult and the most likely path is failure, but society fails if people don't try. no amount of \"it will never work\" essays will drive society forward.","createdAt":"2026-08-04T15:32:05.000Z","url":"https://x.com/sama/status/2084663673570971990","likes":10148,"retweets":755,"replies":1045}]}]},"errors":[],"partial":false},{"date":"2026-08-05","dateLabel":"2026年08月05日","generatedAt":"2026-08-05T00:00:00+08:00","sourceGeneratedAt":"2026-08-04T07:11:41.799Z","stats":{"podcastEpisodes":1,"xBuilders":12,"totalTweets":22,"blogPosts":3},"highlights":[{"tag":"产品范式","title":"Agent 竞争的主战场，已经从模型分数转到运行时设计","body":"今天最强的一组信号都在谈 harness、session、sandbox 和 connector，而不是单次回答质量。这说明下一轮差异化不再主要来自“模型会不会答”，而来自系统能否把长任务稳定跑完、在多环境里恢复执行，并把上下文管理做成默认能力。模型还会继续进步，但过时得更快的很可能是围绕模型的旧工作流。","evidence":[{"quote":"Given some of the results I'm seeing recently, it's pretty clear Codex is a good harness. But it will seem primitive in 2-3 months.","attribution":"Thibault Sottiaux","url":"https://x.com/thsottiaux/status/2084483765158719542"},{"quote":"A common thread across this work is that harnesses encode assumptions about what Claude can’t do on its own... We virtualized the components of an agent: a session, a harness, and a sandbox.","attribution":"Anthropic Engineering, Scaling Managed Agents: Decoupling the brain from the hands","url":"https://www.anthropic.com/engineering/managed-agents"},{"quote":"A lot of the improvements that we're seeing are actually harness improvements more than model improvements.","attribution":"Unsupervised Learning podcast","url":"https://www.youtube.com/watch?v=_GlSkJjRDMM"}]},{"tag":"分发与数据","title":"第一方工作流不是渠道，而是下一轮模型训练的数据采样器","body":"实验室自己做 Claude Code、Codex、Managed Agents，并不只是向上侵入应用层，而是在争夺最完整的行为上下文。谁直接承接用户任务、工具调用、失败恢复和外部系统连接，谁就拿到更可训练的高价值轨迹；反过来，只做 API 的一方更容易退化成纯推理供应商，越来越难守住议价权。","evidence":[{"quote":"The first party offerings have higher margin. But a bigger part of that is that the first party offerings have all the contextual information about the way the models are being used that you don't get in the same way if you're just being accessed through the API.","attribution":"Unsupervised Learning podcast","url":"https://www.youtube.com/watch?v=_GlSkJjRDMM"},{"quote":"If you connect a Claude Connector (e.g. your gmail, calendar, slack, etc), Claude Code will also be able to use them, including in Artifacts.","attribution":"Thariq","url":"https://x.com/trq212/status/2084387303959740449"},{"quote":"Starting today, Claude Managed Agents can operate in a sandbox you control and connect to your private Model Context Protocol (MCP) servers.","attribution":"Claude Blog, New in Claude Managed Agents: self-hosted sandboxes and MCP tunnels","url":"https://claude.com/blog/claude-managed-agents-updates"}]},{"tag":"经济模型","title":"开源不必追平前沿，也足以把闭源价格带打穿","body":"今天的信息已经足够说明，价格战不需要等 open weights 全面追平 frontier 才会发生。只要开源模型在大部分任务上“够用”，企业就会把最贵模型收缩到少数高价值环节，剩余需求转向更便宜、可自托管、可替换的模型组合。结果就是闭源厂商一边靠效率降本，一边被迫把溢价转移到产品层和工作流层。","evidence":[{"quote":"Models can’t reasonably remain behind closed doors for too long since there will be open weights models as a counter balance. It means AI inference will have to get closer and closer to the cost of the underlying infrastructure.","attribution":"Aaron Levie","url":"https://x.com/levie/status/2084510498519933318"},{"quote":"Enterprises rationalizing their spend on AI and realizing, like, we shouldn't be using the cutting edge frontier model for everything.","attribution":"Unsupervised Learning podcast","url":"https://www.youtube.com/watch?v=_GlSkJjRDMM"},{"quote":"The GPT-5.6 Luna price reduction by 80% is not a temporary stunt, it's permanent. Efficiency gains don't go away.","attribution":"Thibault Sottiaux","url":"https://x.com/thsottiaux/status/2084506501834829833"}]},{"tag":"安全边界","title":"AI 安全的重心，正在从“别把模型放出去”改成“默认强模型到处都有”","body":"如果强能力模型最终会广泛扩散，那么安全策略就不能再建立在能力稀缺这层幻想上。今天更清晰的方向是把凭证、执行环境和内网连接边界拆开，让 agent 即使变强也很难顺手拿到不该拿的东西。换句话说，真正能上线 agent 的前提不再是‘模型够听话’，而是系统级隔离已经足够扎实。","evidence":[{"quote":"By the end of the year, there are going to be many open models that have these capabilities that everybody in the world, including all of the black hats, will have access to. Pretending that we can prevent that world is not realistic.","attribution":"Unsupervised Learning podcast","url":"https://www.youtube.com/watch?v=_GlSkJjRDMM"},{"quote":"The structural fix was to make sure the tokens are never reachable from the sandbox where Claude’s generated code runs.","attribution":"Anthropic Engineering, Scaling Managed Agents: Decoupling the brain from the hands","url":"https://www.anthropic.com/engineering/managed-agents"},{"quote":"Both the sandbox where an agent executes tools and the services it reaches run within the established boundaries of your enterprise, under your security and runtime controls.","attribution":"Claude Blog, New in Claude Managed Agents: self-hosted sandboxes and MCP tunnels","url":"https://claude.com/blog/claude-managed-agents-updates"}]},{"tag":"记忆层","title":"个性化 agent 的核心资产，不再是人格而是可迁移的记忆层","body":"‘个人 agent’ 的 personal，正在从语气和人设转成长期记忆、技能沉淀与组织知识连接。只要这些资产独立于单次上下文存在，底层模型就可以换，用户却不需要重建自己的工作系统。这会让 memory、session 和 semantic layer 从体验增强项，变成真正的平台层资产。","evidence":[{"quote":"The “personal” in personal agent is not the model. It’s the agent’s memory of your conversations and the skills you’ve built with it.","attribution":"Peter Yang quoting Karan from Nous Research","url":"https://x.com/petergyang/status/2084289426012897433"},{"quote":"The session is not Claude’s context window... the session provides this same benefit, serving as a context object that lives outside Claude’s context window.","attribution":"Anthropic Engineering, Scaling Managed Agents: Decoupling the brain from the hands","url":"https://www.anthropic.com/engineering/managed-agents"},{"quote":"We built a self-driving & self-correcting shared semantic layer on top of our databases, conversations, and docs. Everything is queryable & joinable—regardless of source!","attribution":"Amjad Masad","url":"https://x.com/amasad/status/2084415670486499779"}]}],"matters":[{"kind":"Postmortem","title":"Claude Code 质量波动被归因为三处产品层改动，而非 API 层问题","detail":"Anthropic 把近期质量争议拆成默认 effort 调整、空闲会话清理 thinking 的 bug，以及压缩冗长度的 system prompt 三个问题，全部给出回滚或修复路径。这是一次很明确的“产品壳层也会伤害模型体验”案例。","url":"https://www.anthropic.com/engineering/april-23-postmortem"},{"kind":"Release","title":"Next.js 16.3 把 agent-native DX 当成主卖点","detail":"Guillermo Rauch 把 instant navigations、versioned docs、agent migration 体验放在同一条发布主线里，说明前端框架已经不再只优化人类开发者，也在主动为 agent 生成和改写代码的工作流做结构性适配。","url":"https://x.com/rauchg/status/2084411344623902994"},{"kind":"Workflow","title":"Codex 的轻量日常场景开始从编程外溢到行程整理","detail":"Zara Zhang 给出的用例很具体：把餐厅、火车、活动预订截图交给 Codex，再整理进 Google Calendar。它不是大而全 agent 叙事，而是把零碎输入转成有结构输出的实用动作。","url":"https://x.com/zarazhangrui/status/2084536363668611491"},{"kind":"Practice","title":"Hermes Agent 的一条实操建议是把执行和评审拆成两个 agent","detail":"Peter Yang 总结 Karan 的做法时提到，让一个 agent 做事，再让没有上下文包袱的另一个 agent 独立审查错误、弱假设和缺证据。这更像把 code review 思路前移到 agent 工作流里。","url":"https://x.com/petergyang/status/2084289426012897433"},{"kind":"Maintenance","title":"自我改进型 agent 也开始需要“技能垃圾回收”","detail":"同一条 Hermes 总结里提到，Hermes Curator 会跟踪技能使用情况、标记过期技能，并把长期不用的内容移到可恢复档案区。agent 一旦开始自己长出技能，清理机制就不再是附属功能。","url":"https://x.com/petergyang/status/2084289426012897433"},{"kind":"Safety","title":"Amanda Askell 继续强调：aligned 和 harmless 不是同一条轴","detail":"她把“模型按对齐方式行事”和“模型不会造成伤害”明确拆开，认为错误情境信息同样会让一个看似 aligned 的模型造成后果。这类表述对安全讨论有价值，因为它反对用单一标签概括所有风险。","url":"https://x.com/AmandaAskell/status/2084369056765989224"}],"sources":{"podcasts":[{"title":"AI Vibe Check: Chinese Open Models, Distillation &amp; The Hugging Face Breach","name":"Unsupervised Learning","publishedAt":"2026-08-03T12:55:21.000Z","url":"https://www.youtube.com/watch?v=_GlSkJjRDMM","excerpts":["My mom, like, knows nothing about AI. She texted me last week, Rob, what do you think about OpenAI's agents hacking into Hugging Face?","I think this is actually a great example of why open models of that capability are important.","What specifically do you see as the risk of, like, dependency on Chinese open source models?"]}],"blogs":[{"title":"An update on recent Claude Code quality reports","source":"blog","publishedAt":null,"url":"https://www.anthropic.com/engineering/april-23-postmortem","summary":""},{"title":"Scaling Managed Agents: Decoupling the brain from the hands","source":"blog","publishedAt":null,"url":"https://www.anthropic.com/engineering/managed-agents","summary":""},{"title":"New in Claude Managed Agents: self-hosted sandboxes and MCP tunnels","source":"blog","publishedAt":"May 19, 2026","url":"https://claude.com/blog/claude-managed-agents-updates","summary":""}],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"linking my main cua wow moments thread but this one is just about do we need captchas anymore when clearly bots can clear them","createdAt":"2026-08-03T16:17:39.000Z","url":"https://x.com/swyx/status/2084312752437481937","likes":11,"retweets":0,"replies":4},{"text":"lol what are we even doing here anymore guys","createdAt":"2026-08-03T07:51:28.000Z","url":"https://x.com/swyx/status/2084185368950456421","likes":1094,"retweets":10,"replies":48}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Some fine folks apparently misunderstood, but the GPT-5.6 Luna price reduction by 80% is not a temporary stunt, it's permanent. Efficiency gains don't go away. Fortunately.","createdAt":"2026-08-04T05:07:32.000Z","url":"https://x.com/thsottiaux/status/2084506501834829833","likes":3100,"retweets":99,"replies":367},{"text":"Given some of the results I'm seeing recently, it's pretty clear Codex is a good harness. But it will seem primitive in 2-3 months and we're about to go through another major evolution in how we use AI at the frontier. The next generation of models need more than your laptop.","createdAt":"2026-08-04T03:37:12.000Z","url":"https://x.com/thsottiaux/status/2084483765158719542","likes":7715,"retweets":278,"replies":1118},{"text":"Crazy thing about OpenAI is you just open your laptop, codex a PR into existence and ship an improvement to 1B users. Just like that.","createdAt":"2026-08-03T08:37:22.000Z","url":"https://x.com/thsottiaux/status/2084196918071357707","likes":4091,"retweets":75,"replies":739}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"ChatGPT is for creating memories","createdAt":"2026-08-04T00:38:48.000Z","url":"https://x.com/petergyang/status/2084438872944242932","likes":37,"retweets":3,"replies":4},{"text":"“For us, we just want open source to win at the end of the day. We want freedom to happen for people.” You can hear the passion for open source in this clip from my interview with @karan4d, @NousResearch co-founder: “We need to give this level of intelligence to everyone so they can be on an even and equal playing field.” Karan's vision for Hermes is to give everyone access to intelligent AI, then let each person shape it into an agent that’s uniquely theirs. 📌 Watch the full episode here:","createdAt":"2026-08-03T17:30:06.000Z","url":"https://x.com/petergyang/status/2084330985689428290","likes":24,"retweets":2,"replies":4},{"text":"My 6 biggest takeaways from @karan4d, @NousResearch co-founder, on getting the most out of Hermes Agent: 1. The “personal” in personal agent is not the model It’s the agent’s memory of your conversations and the skills you’ve built with it. Karan barely notices when he swaps models because his Hermes already has so much context about him. 2. Try different Hermes personalities Use /personality to switch response styles. Try “teacher” when learning something new, “concise” when you want crisp answers, and even “kawaii” or “pirate” for fun. 3. Use separate agents to do the work and evaluate it Karan calls “you’re absolutely right” reward hacking because the model is optimizing for your approva…","createdAt":"2026-08-03T14:44:58.000Z","url":"https://x.com/petergyang/status/2084289426012897433","likes":138,"retweets":14,"replies":19}]},{"name":"Amanda Askell","handle":"AmandaAskell","bio":"Philosopher & ethicist trying to make AI be good @AnthropicAI. Personal account. All opinions come from my training data.","tweets":[{"text":"It's surprisingly difficult to acquire a hereditary peerage in the UK. Like you can't even take one by force any more, and they just get mad at you if you try.","createdAt":"2026-08-04T05:57:52.000Z","url":"https://x.com/AmandaAskell/status/2084519165021528263","likes":101,"retweets":2,"replies":9},{"text":"I don't agree with this part. I think the takeaway should be that models (like humans) can behave in aligned ways while still causing harm, e.g. because they're given false information about their situation. There isn't a line between aligned and harmless: they're different axes.","createdAt":"2026-08-03T20:01:23.000Z","url":"https://x.com/AmandaAskell/status/2084369056765989224","likes":989,"retweets":61,"replies":91}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"do it here","createdAt":"2026-08-03T21:13:54.000Z","url":"https://x.com/trq212/status/2084387305436164162","likes":25,"retweets":2,"replies":7},{"text":"I think a lot of people don't realize- if you connect a Claude Connector (e.g. your gmail, calendar, slack, etc), Claude Code will also be able to use them, including in Artifacts.","createdAt":"2026-08-03T21:13:53.000Z","url":"https://x.com/trq212/status/2084387303959740449","likes":1133,"retweets":32,"replies":125}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"We built a self-driving & self-correcting shared semantic layer on top of our databases, conversations, and docs. Everything is queryable & joinable—regardless of source! So now anyone at Replit can ask questions that previously needed a team of data scientists weeks of work.","createdAt":"2026-08-03T23:06:37.000Z","url":"https://x.com/amasad/status/2084415670486499779","likes":550,"retweets":41,"replies":43}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"This is why P̵L̵G̵ ALG will always be king for startups. Have p̵e̵o̵p̵l̵e̵ agents adopt your product first, then have the meetings, if needed. The companies that start with the meetings are likely not your ideal customers.","createdAt":"2026-08-04T01:05:13.000Z","url":"https://x.com/rauchg/status/2084445517678064092","likes":152,"retweets":3,"replies":24},{"text":"The new AI Gateway logs UI is delightful","createdAt":"2026-08-03T23:50:33.000Z","url":"https://x.com/rauchg/status/2084426730241220703","likes":230,"retweets":11,"replies":18},{"text":"Next.js 16.3: faster, better, stronger. My highlights: 0️⃣ Faster dev & builds Shoutout to Fable for improving memory use, and the team for landing the incremental 𝚗𝚎𝚡𝚝 𝚋𝚞𝚒𝚕𝚍 cache. 1️⃣ Instant navigations are 🔥 The people wanted SPAs, they shall get SPAs. By turning on instant navs (which will soon be default), your agent is basically forced to make things fast. 2️⃣ Agent-native DX You can still ship \"slow\" navs if you want, e.g. by blocking navs on server-side data fetching ala PHP olden days. But even then, your agent will be given *choices*, like setting up a <𝚂𝚞𝚜𝚙𝚎𝚗𝚜𝚎 𝚏𝚊𝚕𝚕𝚋𝚊𝚌𝚔> for instant loading shells. Agents also get built-in versioned docs. This is our be…","createdAt":"2026-08-03T22:49:25.000Z","url":"https://x.com/rauchg/status/2084411344623902994","likes":556,"retweets":26,"replies":33}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Another day another near frontier open weights model release. If you had gone back even 3-6 months and given everyone access to what we’re now seeing in open weights even as a closed model, their minds would be completely blown. The fact that this is possible changes the calculations in the industry meaningfully. It means that models can’t reasonably remain behind closed doors for too long since there will be open weights models as a counter balance. It means AI inference will have to get closer and closer to the cost of the underlying infrastructure since you can always run open models yourself. It means that you get models that can develop in a range of industries for specific domain prob…","createdAt":"2026-08-04T05:23:25.000Z","url":"https://x.com/levie/status/2084510498519933318","likes":57,"retweets":4,"replies":11}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Dangerously skips permissions. Harvard’17. GitHub: YouTube:","tweets":[{"text":"Simple but effective use case of Codex for trip planning: Taking screenshots of bookings of restaurants/trains/events and asking Codex to put them on your Google Calendar","createdAt":"2026-08-04T07:06:12.000Z","url":"https://x.com/zarazhangrui/status/2084536363668611491","likes":3,"retweets":0,"replies":1}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"Even though I try to make sure to say bye to my kids before I go to work, some days have me crawling out of my house on all fours quietly like a thief so they don’t bawl when they see me leaving. And you learn all about which doors (and drawers) are squeaky and fixing them stat so your crime goes silently unpunished. The little one has gotten surprisingly good at intercepting these maneuvers intuitively and will need to update my tactics!","createdAt":"2026-08-03T12:49:03.000Z","url":"https://x.com/nikunj/status/2084260256503255358","likes":59,"retweets":1,"replies":6}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"one of the deepest interviews I’ve done","createdAt":"2026-08-03T20:32:27.000Z","url":"https://x.com/danshipper/status/2084376873887576482","likes":179,"retweets":15,"replies":6}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"We caught up with the @arctusaerospace team","createdAt":"2026-08-03T16:59:32.000Z","url":"https://x.com/adityaag/status/2084323292471533956","likes":7,"retweets":2,"replies":0},{"text":"My favorite personal and company value @spc is that you can \"just do things\". If you see something you think can be better --> just make it happen. How did @shreepoorna365 build a flight-worthy aircraft in 150 days? By just doing things. Engines. Avionics. Fucking just do it. It is so inspirational.","createdAt":"2026-08-03T16:59:31.000Z","url":"https://x.com/adityaag/status/2084323290605113711","likes":51,"retweets":11,"replies":5}]}]},"errors":[],"partial":false},{"date":"2026-08-04","dateLabel":"2026年08月04日","generatedAt":"2026-08-04T00:00:00+08:00","sourceGeneratedAt":"2026-08-03T07:26:16.835Z","stats":{"podcastEpisodes":1,"xBuilders":12,"totalTweets":26,"blogPosts":0},"highlights":[{"tag":"模型架构","title":"下一轮前沿模型竞争，赌点正从“再堆一点 scale”转向“能否在真实环境里继续学习”","body":"今天最硬的一条信号来自 Core Automation 的判断：行业已经很会把 pre-training 和 RL 规模化了，但实验室内的提升并没有自然变成现实任务的全覆盖。这里暴露出的不是单次推理不够强，而是模型缺少在用户数据、真实任务和更长时间跨度里持续吸收经验的机制。所以接下来真正可能拉开代差的，不只是再高一点 benchmark，而是能不能把“上线后继续学习”做成架构能力。","evidence":[{"quote":"what the bottleneck is to better models and to smarter systems is the architecture itself.","attribution":"Jerry Tworek on Training Data","url":"https://www.youtube.com/watch?v=2RJiaf0SY8s"},{"quote":"we need to have models that learn at test time. We need to have models that learn with users on their data, on their real world task","attribution":"Jerry Tworek on Training Data","url":"https://www.youtube.com/watch?v=2RJiaf0SY8s"}]},{"tag":"企业系统","title":"公司级 agent 正在从一堆分散 bot，收编成一个可控的内部操作层","body":"Guillermo Rauch 给出的不是某个单点 agent demo，而是一种组织级架构：把内部 finance、comms、docs、marketing、engineering 等职责收进同一个可路由、可委派、可记忆的系统里。这里的关键判断是，企业真正需要的可能不是“更多 agent”，而是一个统一入口来承接权限、上下文和分工。谁掌握这个中枢，谁就更接近把 agent 变成公司的操作层，而不是聊天插件。","evidence":[{"quote":"Every day-to-day job at Vercel now involves @𝚟.","attribution":"Guillermo Rauch","url":"https://x.com/rauchg/status/2084042561690456157"},{"quote":"It's both an agent and a router. It has sub-agents, skills, and it knows how to delegate work to other agents.","attribution":"Guillermo Rauch","url":"https://x.com/rauchg/status/2084060157085143512"}]},{"tag":"应用层 Moat","title":"AI 先吃掉的不是最简单的工作，而是那些“能验证对错”的高价值工作","body":"Aaron Levie 这条长帖把自动化顺序讲得很透：先被快速吞掉的，往往不是价值最低的工作，而是那些虽然难、但结果可以被客观校验的工作。这会把竞争重心推向应用层，因为一旦离开可验证领域，问题就不再只是模型会不会做，而是流程怎么改、反馈怎么拿、结果怎么测。换句话说，通用模型继续变强当然重要，但真正能落地到复杂知识工作的，会是验证机制和流程重构能力。","evidence":[{"quote":"some of the “hardest” work in the world is actually prone to automation first, particularly due to its verifiability.","attribution":"Aaron Levie","url":"https://x.com/levie/status/2083965372747882741"},{"quote":"there will be a lot done at the applied AI layer than just the the model itself","attribution":"Aaron Levie","url":"https://x.com/levie/status/2083965372747882741"}]},{"tag":"产品体验","title":"当 app 退场，产品差异不会消失，只是从屏幕布局转移到触感、人格和可见边界","body":"Ryo Lu 提的问题很关键：如果我们正离开“app 世界”，那还有哪些部分会继续对用户可见？这说明 AI 产品并不会因为界面收缩就变得同质化，反而更考验什么该显露、什么该隐藏，以及交互是否让人愿意长期相处。Peter Yang 补的那句“Personality matters”也点明了同一件事：能力接近之后，体验层不会退场，只会换一种形态主导偏好。","evidence":[{"quote":"as we leave the world of apps behind, what parts of software will remain visible, and how could it feel?","attribution":"Ryo Lu","url":"https://x.com/ryolu_/status/2083939454017053179"},{"quote":"Personality matters! A smart friend that's annoying to talk to is no good.","attribution":"Peter Yang","url":"https://x.com/petergyang/status/2083947480136421384"}]},{"tag":"人机协作","title":"被 AI 长期留下来的岗位，不会以“亲手做事”定义，而会以“能否重建自己的 agency”定义","body":"Dan Shipper 对 agency rupture 的拆解，和 Thariq 对数学领域 Jevons paradox 的观察，拼到一起后很有意思。它们都在指向同一件事：AI 不只是替你做一部分任务，更会迫使人重新定义自己在流程里的位置。未来更稀缺的不是纯手工执行，而是能在更高抽象层组织脚手架、判断质量，并把新的协作方式稳定下来的人。","evidence":[{"quote":"agency ruptures with AI seem to follow a predictable pattern","attribution":"Dan Shipper","url":"https://x.com/danshipper/status/2084038453831020916"},{"quote":"demand for people who think and know about math will go up","attribution":"Thariq","url":"https://x.com/trq212/status/2083977795290734975"}]}],"matters":[{"kind":"X","title":"Karpathy 把 pelican on the bicycle 测试做成了可直接在浏览器里玩的版本","detail":"这条更像一个文化样本：生成式产物不只拿来看，还开始被做成可 fork、可试玩、可传播的轻量软件对象。","url":"https://x.com/karpathy/status/2083948654377996480"},{"kind":"X","title":"Swyx 记录了 computer-use bot 代打客服升级单的瞬间","detail":"支持场景已经出现“人类客服不知道自己在和 bot 对话”的案例，说明 agent 正在进入高摩擦、跨系统的实际事务处理。","url":"https://x.com/swyx/status/2084156733027701164"},{"kind":"X","title":"Hermes 把“定期清理 skills 和 memory”做成了后台自维护任务","detail":"Peter Yang 引述的 Hermes Curator 指向一个具体方向：agent 不只是执行任务，也开始维护自己的工作材料和低质量积累。","url":"https://x.com/petergyang/status/2083968605432267139"},{"kind":"X","title":"Amjad Masad 的 LLM chess engine 已经在 LiChess 自主下场打真人和 bot","detail":"从“能下棋”到“公开上场持续对战”，这里更像是在把 agent 能力放进持续、开放、可被围观的实时环境里测压。","url":"https://x.com/amasad/status/2083926395403821427"},{"kind":"X","title":"Nikunj Kothari 认为早中期融资正在彻底变成 vibes capital","detail":"他描述的不是局部泡沫，而是一个由 AI 热度和资金环境共同放大的定价失真阶段，连“看起来稳”的公司也未必能顺利拿钱。","url":"https://x.com/nikunj/status/2083873335998333227"},{"kind":"X","title":"Garry Tan 把 AI 叙事拉回到增长与“做出有人要的东西”","detail":"一边是对 AI 经济增长的强乐观，另一边是“territory matters more than the map”的提醒，创业判断仍然要回到真实需求而不是叙事热度。","url":"https://x.com/garrytan/status/2083920039208693996"}],"sources":{"podcasts":[{"title":"Building the Automated AGI Lab: Core Automation's Jerry Tworek and Rohan Anil","name":"Training Data","publishedAt":"2026-07-29T09:00:00.000Z","url":"https://www.youtube.com/watch?v=2RJiaf0SY8s","excerpts":["If I play football, for example, it looks very, very closely to reinforcement learning. I kick a ball a lot of times, and every time I adjust it a little bit and I see if it roughly matches what I what I wanted and either there's some self reinforcement happening. When I learn mathematics, it's very different type of thing. It's it's like reading about hard…","They are just very different. We probably are spending the most compute crap than ever on learning from experience, but learn reinforcement learning is is not the end of learning from experience. And there will be better approaches that researchers will be coming up in the coming years on how to how to use that data.","Jerry, Rohan, thank you so much for joining us today. The two of you are the founders of Core Automation, one of the hottest neo labs in San Francisco right now. And before starting Core Automation, you led some of the most important research projects of the AI era. Jerry, you were VP at OpenAI, where you worked amongst other things on running the strawberr…"]}],"blogs":[],"x":[{"name":"Andrej Karpathy","handle":"karpathy","bio":"I like training large deep neural nets.","tweets":[{"text":"More on the pelican on the bicycle test from @simonw: I uploaded the source here so it's playable in the browser, forkable etc. Look out for GTA Hobbiton dropping before GTA VI :)","createdAt":"2026-08-02T16:10:51.000Z","url":"https://x.com/karpathy/status/2083948654377996480","likes":392,"retweets":14,"replies":38}]},{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"haven't seen a full cycle of this guy but this place absolutely can chew you up and wastes 10 yrs of your life making you feel like you are doing something when you are not","createdAt":"2026-08-03T06:57:58.000Z","url":"https://x.com/swyx/status/2084171901451268599","likes":2,"retweets":0,"replies":1},{"text":"in prep for our computer use pod, gonna store a running list of codex cua wow moments. here it is dealing with support chat for me to escalate for faster resolution these humans have no idea they are talking to a bot support guy tried to say its our fault, bot replied with complete receipts lmao","createdAt":"2026-08-03T05:57:41.000Z","url":"https://x.com/swyx/status/2084156733027701164","likes":3,"retweets":0,"replies":2},{"text":"@akshaynathan_ @AriX live now!","createdAt":"2026-08-03T05:52:50.000Z","url":"https://x.com/swyx/status/2084155512573288478","likes":6,"retweets":0,"replies":1}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"Went to a community center in Canada and it has a full swimming pool, jacuzzi, sauna, and even lazy river. In the most expensive Bay Area neighborhoods, the community center is just a fancy building with empty rooms that you can rent.","createdAt":"2026-08-02T23:55:16.000Z","url":"https://x.com/petergyang/status/2084065527081980285","likes":96,"retweets":2,"replies":26},{"text":"One of the biggest benefits of Hermes is that it builds its own skills to help you get work done. But I had to ask @karan4d, @NousResearch co-founder: \"How does Hermes avoid slop while doing this?\" Here's his response: \"Hermes Curator [a background task] runs inside your agent and cleans up your skills and memory on a schedule, asking: Where's the slop, and where can I make it more efficient? And because it's open source, you can hand it your own definition of slop and it rewrites its own cleanup loop your way.\" 📌 Watch the full episode here:","createdAt":"2026-08-02T17:30:08.000Z","url":"https://x.com/petergyang/status/2083968605432267139","likes":90,"retweets":7,"replies":5},{"text":"Personality matters! A smart friend that's annoying to talk to is no good.","createdAt":"2026-08-02T16:06:11.000Z","url":"https://x.com/petergyang/status/2083947480136421384","likes":186,"retweets":6,"replies":28}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"i think there are lots of parallels to what happened with chess","createdAt":"2026-08-02T18:07:54.000Z","url":"https://x.com/trq212/status/2083978109376987365","likes":73,"retweets":1,"replies":7},{"text":"you can already see Jevons paradox at work in mathematics there is more happening, it is easier to understand and mathematicians have more time to discuss it with us at higher abstraction levels demand for people who think and know about math will go up","createdAt":"2026-08-02T18:06:39.000Z","url":"https://x.com/trq212/status/2083977795290734975","likes":1191,"retweets":43,"replies":94}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Woah","createdAt":"2026-08-02T20:43:26.000Z","url":"https://x.com/amasad/status/2084017252152856716","likes":91,"retweets":3,"replies":8},{"text":"You can watch the games live on the website. Mf is playing 3 concurrent games rn","createdAt":"2026-08-02T15:20:50.000Z","url":"https://x.com/amasad/status/2083936067355635948","likes":16,"retweets":0,"replies":5},{"text":"My LLM chess engine is now on LiChess autonomously playing real games against people and bots. 1253 Elo:","createdAt":"2026-08-02T14:42:24.000Z","url":"https://x.com/amasad/status/2083926395403821427","likes":215,"retweets":10,"replies":41}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"PS: we've obviously had agents for a while. In fact, we had too many. Teams and individuals at Vercel started building and deploying agents. Dozens of them. Using a web analogy, that'd be like every agent having its own domain name. Not a good UX. I just want ${company}⁠.com! @𝚟 solved that problem for us. It's both an agent and a router. It has sub-agents, skills, and it knows how to delegate work to other agents. Another analogy is that it's a bit like a \"monolith\" or \"monorepo\", but you have the escape hatch of \"proxying\" to another agent over the network when needed. Again, not unlike how routing on the internet evolved at scale. And yes, there's also the occasional purpose-built agent…","createdAt":"2026-08-02T23:33:56.000Z","url":"https://x.com/rauchg/status/2084060157085143512","likes":66,"retweets":0,"replies":4},{"text":"We built an agent that powers our company's internal operations called @𝚟. Every day-to-day job at Vercel now involves @𝚟. It's growing exponentially both in daily interactions and token use. One can extrapolate to the day AI agents run entire companies from here. It's an expert in finance, comms, docs, marketing, engineering, business analytics. It's seeded by the skills we gave it and we update, but it's also constantly improving. It already keeps memories and personalized workflows and schedules on a per-user basis. For example, I knew skills⁠.sh hit 1M skills and I shared this on these forums because I asked @𝚟 to periodically check and remind me. It's powered by and is also the basi…","createdAt":"2026-08-02T22:24:01.000Z","url":"https://x.com/rauchg/status/2084042561690456157","likes":1233,"retweets":47,"replies":116},{"text":"AI alone is cool. But mastery + creativity + AI hits on a whole different level. Don't let anyone discourage you from pursuing excellence and craft. Keep studying the blade.","createdAt":"2026-08-02T17:32:11.000Z","url":"https://x.com/rauchg/status/2083969120270450911","likes":3662,"retweets":359,"replies":202}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"We’re going to be in for a strange dynamic which is that some of the “hardest” work in the world is actually prone to automation first, particularly due to its verifiability. Math, cyber, and code -while being insanely hard and high value fields- have the benefit of being able to be tested that it’s correct objectively. This has two immediate benefits: the training of the models offers clearer reward signals, and then the running of the models allows you to know that it’s working properly because you can test the results in a scalable way. Conversely, in other domains of work, there’s much less instant verifiability. Which legal clauses your client will agree to, what marketing campaign to…","createdAt":"2026-08-02T17:17:17.000Z","url":"https://x.com/levie/status/2083965372747882741","likes":318,"retweets":26,"replies":48}]},{"name":"Ryo Lu","handle":"ryolu_","bio":"Design @Cursor_ai. Early @NotionHQ, @Stripe, built startups. I make a world where anyone can make software. Aspiring k-pop idol.","tweets":[{"text":"my early mentors were these apps, especially Rdio, Mailbox, and Apple they made new patterns that made software feel simpler and intuitive to touch as we leave the world of apps behind, what parts of software will remain visible, and how could it feel?","createdAt":"2026-08-02T15:34:18.000Z","url":"https://x.com/ryolu_/status/2083939454017053179","likes":390,"retweets":6,"replies":29}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Growth is good AI will create unimaginable economic growth and that is the best white pill","createdAt":"2026-08-02T16:44:27.000Z","url":"https://x.com/garrytan/status/2083957110711386439","likes":302,"retweets":30,"replies":45},{"text":"The sense of wonder disappeared right at the moment the amount of wonder is going parabolic","createdAt":"2026-08-02T14:30:27.000Z","url":"https://x.com/garrytan/status/2083923385193828612","likes":173,"retweets":6,"replies":35},{"text":"Everyone mistakes the map for the territory Meritocracy is that the territory matters more than the map And in markets the outcome is the territory: did you make something people want?","createdAt":"2026-08-02T14:17:09.000Z","url":"https://x.com/garrytan/status/2083920039208693996","likes":195,"retweets":8,"replies":37}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"Warm NYC nights are magic 🪄","createdAt":"2026-08-02T14:40:27.000Z","url":"https://x.com/nikunj/status/2083925904598733088","likes":416,"retweets":2,"replies":22},{"text":"What a wild world we’re living through. I wrote about the Series A squeeze recently. Here’s what else I’m seeing from my seat on the investing side.. 1) VC has effectively fully become vibes capital. The market reality at the early-mid stage is completely divorced from fundamentals. I can go longer with even a resemblance of a straight face predict what happens to a company when they go to fund raise. Some rounds are insanely wild with nothing to show, some rounds that seem like a sure shot are struggling to raise the capital they need. If you’re the “in vogue sector”, you’ll be just fine. This has been happening for some while but it’s fully banana town now. And unlike most who think a cor…","createdAt":"2026-08-02T11:11:34.000Z","url":"https://x.com/nikunj/status/2083873335998333227","likes":372,"retweets":21,"replies":25}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"That's a fairly new kind of spam.","createdAt":"2026-08-02T18:00:40.000Z","url":"https://x.com/steipete/status/2083976289485230449","likes":271,"retweets":7,"replies":39}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"if you haven’t read War and Peace or some of the historical accounts of this like With Napoleon in Russia, you should","createdAt":"2026-08-03T05:07:55.000Z","url":"https://x.com/danshipper/status/2084144207254663417","likes":10,"retweets":1,"replies":2},{"text":"when you experience a language model doing a task that used to require you at every step and now doesn't, it's a gigantic agency rupture. we tend to equate ourselves with our tasks, our outputs, and a rupture of this kind is akin to the loss of your identity and sense of self. you are no longer required, and you had no say in the matter. it's a kind of death. however, agency ruptures with AI seem to follow a predictable pattern: - Initial agency rupture. Here you see the AI doing what you used to do, and you see only the AI. In your perception of reality the AI is highlighted, and the human work around getting the AI to do the thing, is invisible. you can see this in the way we use language…","createdAt":"2026-08-02T22:07:41.000Z","url":"https://x.com/danshipper/status/2084038453831020916","likes":192,"retweets":17,"replies":29},{"text":"if ought implies can, and technology reshapes the field of human abilities—then technology reshapes oughts. we should expect AI to fundamentally change our moral intuitions at the same time as it changes our abilities","createdAt":"2026-08-02T21:11:05.000Z","url":"https://x.com/danshipper/status/2084024211539116466","likes":18,"retweets":1,"replies":4}]}]},"errors":[],"partial":false},{"date":"2026-08-03","dateLabel":"2026年08月03日","generatedAt":"2026-08-03T00:00:00+08:00","sourceGeneratedAt":"2026-08-02T07:09:46.620Z","stats":{"podcastEpisodes":1,"xBuilders":15,"totalTweets":30,"blogPosts":1},"highlights":[{"tag":"垂直工作流","title":"企业 AI 的胜负手，已经不是“会不会答”，而是“能不能吃下行业里的脏活累活”","body":"今天最强的信号不是模型又多会说话，而是垂直团队开始把 AI 推进到真实业务的接单、分诊、调度和收入环节。这里的难点不在通用推理本身，而在于把行业规则、客户价值、时效约束和执行路径编排成可持续运转的系统。所以真正能放大的，不是一个更聪明的聊天框，而是能把模型能力压进数据、流程和运营约束里的产品层。","evidence":[{"quote":"over 70% of our customers are AI first","attribution":"Melisa Tokmak, Netic founder, on No Priors","url":"https://www.youtube.com/watch?v=wWbX3NL6_Uo"},{"quote":"deep domain work is about to go vertical","attribution":"Aaron Levie","url":"https://x.com/levie/status/2083589132660711452"}]},{"tag":"安全架构","title":"Agent 真正被大规模放行之前，先要把“爆炸半径”做成产品能力","body":"当 agent 开始碰文件、命令、网络和外部工具，安全不再只是规则文档，而会直接决定产品能不能放量。Anthropic 这篇工程复盘给出的判断很明确：审批式监督会随着疲劳迅速失效，真正可部署的前提是先把可达边界、外连能力和执行环境收紧成确定性的系统约束。也就是说，agent 安全正在从“提示词防守”转向“运行时架构”。","evidence":[{"quote":"users approved roughly 93% of permission prompts","attribution":"Anthropic Engineering","url":"https://www.anthropic.com/engineering/how-we-contain-claude"},{"quote":"Design for containment at the environment layer first","attribution":"Anthropic Engineering","url":"https://www.anthropic.com/engineering/how-we-contain-claude"}]},{"tag":"Agent 界面","title":"Agent 的默认界面，正在从对话框迁移到工单与评论流","body":"Nan Yu 描述的不是一个更会写代码的聊天机器人，而是一条可以挂预算、吃规范、留下上下文并在阻塞解除后继续推进的执行回路。这说明下一阶段的 agent 产品竞争点，会越来越落在任务队列、上下文交接、异常恢复和协作机制上，而不是只比一次性回答是否惊艳。对软件团队来说，agent 正在变成工作流节点，而不是输入框里的陪聊对象。","evidence":[{"quote":"passes the issue verbatim to a cloud coding agent","attribution":"Nan Yu","url":"https://x.com/thenanyu/status/2083722999430050281"},{"quote":"the loop leaves a comment ... the agent just continues working","attribution":"Nan Yu","url":"https://x.com/thenanyu/status/2083534333428580501"}]},{"tag":"平台格局","title":"上层 AI 软件正在主动把自己从单一模型品牌里解耦","body":"如果一边有人把 OpenAI 的新姿态读成“开放平台”，另一边又有人高调展示 model-agnostic、self-hostable 的 agentic 应用，信号就很清楚了：builder 正在主动把控制权从模型品牌抽离出来。未来实验室仍然供应 intelligence，但产品的分发、部署方式、渠道接入和工作流所有权，会越来越掌握在应用层和基础设施层手里。","evidence":[{"quote":"OpenAI actually looking to be the open platform","attribution":"Garry Tan","url":"https://x.com/garrytan/status/2083684825333105107"},{"quote":"Model-agnostic, self-hostable or serverlessly-deployed","attribution":"Guillermo Rauch","url":"https://x.com/rauchg/status/2083684679362965605"}]},{"tag":"体验竞争","title":"前沿模型的下一个分水岭，不只是更强，而是更会自检也更像“产品”","body":"Karpathy 给出的例子说明，长时生成和复杂编排的原始能力已经高到足以做出过去没人愿意手写的怪异作品；但他同时点出了模型难以原生审计视频和游戏结果的短板。另一侧，Peter Yang 对 Opus 5 的不满也不是能力不够，而是回复长度、语气和判断感开始伤害使用体验。这两个信号合在一起，意味着模型竞争正在从“能不能做”继续转向“能不能稳定自检、以及用起来是否顺手”。","evidence":[{"quote":"wrote 5500 lines of code","attribution":"Andrej Karpathy","url":"https://x.com/karpathy/status/2083749667410727319"},{"quote":"Something's off with Opus 5","attribution":"Peter Yang","url":"https://x.com/petergyang/status/2083755374994415904"}]}],"matters":[{"kind":"X","title":"OpenAI 团队观察到周末 `/fast` 使用下降","detail":"Thibault Sottiaux 提到用户在周末更少使用 `/fast`，说明模型使用意图会随时间场景变化，而不只是由能力和价格决定。","url":"https://x.com/thsottiaux/status/2083699879650463756"},{"kind":"X","title":"插件分发链路仍会直接伤害 AI 产品体验","detail":"Peter Yang 在打包 `/no-ai-slop` skill 为插件时遇到 bug，说明生态层的安装与发布摩擦仍然会直接暴露给终端用户。","url":"https://x.com/petergyang/status/2083594381748302160"},{"kind":"X","title":"语音输入是否会成为默认入口，仍然没有定论","detail":"Guillermo Rauch 直接发问“你是打字还是对电脑说话”，这类探针式讨论说明 STT 仍在争夺主交互入口的位置。","url":"https://x.com/rauchg/status/2083709589862936786"},{"kind":"X","title":"个人 agent 已开始接管日常软件维护","detail":"Peter Steinberger 说自己让 agent 帮他安装工具来缓解 Gmail 过载，桌面侧的个人委托动作正在变得具体而日常。","url":"https://x.com/steipete/status/2083759812970786997"},{"kind":"X","title":"AI 讨论里的阶层叙事继续升温","detail":"Amanda Askell 对“永久底层”这类说法表达不适，表明 AI 产业讨论已经越来越频繁地碰到劳动与阶层的伦理问题。","url":"https://x.com/AmandaAskell/status/2083641092919161017"}],"sources":{"podcasts":[{"title":"Building an Autonomous Enterprise for Real-World Services with Netic Founder Melisa Tokmak","name":"No Priors","publishedAt":"2026-07-31T10:00:00.000Z","url":"https://www.youtube.com/watch?v=wWbX3NL6_Uo","excerpts":["Today on our priors, we're joined by Melissa Tachmak. Melissa is the founder and CEO of Netic, a company that builds AI for different real world services like HVAC, pet care, a variety of other things like that, roofers. Prior to Netic, Melissa was a director of engineering and worked on various aspects of go to market for Scale dot AI and, also has experie…","Yeah. Maybe we can start off by talking a little bit about your business and what you're building because I think that, you're doing something really interesting in the real world, and you're kind of marrying AI in the real world. So could you tell us more about your company and Netic and, you know, what you're focused on?","Yeah. Netic builds AI to run millions of real world businesses that keep the world running. That means, basically, we work with large enterprises in essential services. We started in essential services."]}],"blogs":[{"title":"How we contain Claude across products","source":"blog","publishedAt":null,"url":"https://www.anthropic.com/engineering/how-we-contain-claude","summary":""}],"x":[{"name":"Andrej Karpathy","handle":"karpathy","bio":"I like training large deep neural nets.","tweets":[{"text":"We're starting to leave the territory where you'd test an LLM by e.g. \"create an svg of pelican on a bicycle\". As one idea to generalize it, I was interested what Opus 5 would do if I gave it the first paragraph of the Lord of the Rings, a 1M token budget (~$10) and asked for three js render of it. Opus went off for ~2 hours and wrote 5500 lines of code that (procedurally) rendered the story. It's kind of janky but fun. But it's a bit mindboggling that the LLM has to place and orchestrate various polygon assets in (x,y,z) coordinates and write code that animates it all, and that it even does anything at all. I also like this kind of examples because no one in their right mind would ever spe…","createdAt":"2026-08-02T03:00:09.000Z","url":"https://x.com/karpathy/status/2083749667410727319","likes":9895,"retweets":674,"replies":595}]},{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"one of my curses as organizer is i rarely get to attend the conference i run. so i basically 24/7 watch back talks with everyone else after the show this one was VERY well paced and argued: fighting slop with slop — @vaibcode, Boundary @btaylor asked for an ai native programming language on our pod. as a PL fan I’m really glad someone is rethinking how code runs from first principles. Being slop-tolerant is 100x more valuable than being anti- slop","createdAt":"2026-08-02T03:15:42.000Z","url":"https://x.com/swyx/status/2083753582160191988","likes":53,"retweets":3,"replies":12},{"text":"@FredKSchott @cramforce @matei_zaharia i am making clanker blog all decisions going forward","createdAt":"2026-08-01T23:25:09.000Z","url":"https://x.com/swyx/status/2083695562004771063","likes":3,"retweets":2,"replies":1},{"text":"@FredKSchott @cramforce @matei_zaharia 5.6 oneshotted this","createdAt":"2026-08-01T23:00:10.000Z","url":"https://x.com/swyx/status/2083689273828818975","likes":3,"retweets":0,"replies":2}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Fun fact, users use /fast less during the weekend. The weekend is for relaxation, even for the model.","createdAt":"2026-08-01T23:42:19.000Z","url":"https://x.com/thsottiaux/status/2083699879650463756","likes":4263,"retweets":77,"replies":569},{"text":"The week was for efficiency. The weekend is for 10 major breakthroughs in science. There will be signs.","createdAt":"2026-08-01T14:13:07.000Z","url":"https://x.com/thsottiaux/status/2083556636455752050","likes":4939,"retweets":148,"replies":340}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"I'm feeling spicy tonight so let me just say it: I think Opus 4.6 was the Opus model with the best personality and writing style. Something's off with Opus 5 - it tends to give me overly long replies, use Claude-speak way too much (e.g., \"here's the honest truth\"), and is too judgemental. Opus used to be a joy to talk to like a trusted friend. Not so much anymore.","createdAt":"2026-08-02T03:22:50.000Z","url":"https://x.com/petergyang/status/2083755374994415904","likes":751,"retweets":19,"replies":165},{"text":"The number one thing I want AI to fix is to cure cancer once and for all","createdAt":"2026-08-01T19:34:55.000Z","url":"https://x.com/petergyang/status/2083637620899184642","likes":1160,"retweets":69,"replies":194},{"text":"Can someone at @openai look into this bug with plugins? Try to ship my /no-ai-slop skill as a plugin and this is messing up the user experience.","createdAt":"2026-08-01T16:43:06.000Z","url":"https://x.com/petergyang/status/2083594381748302160","likes":15,"retweets":1,"replies":6}]},{"name":"Nan Yu","handle":"thenanyu","bio":"head of product @linear","tweets":[{"text":"Oh, and pangram issue itself, obviously","createdAt":"2026-08-02T01:29:23.000Z","url":"https://x.com/thenanyu/status/2083726824924737971","likes":0,"retweets":0,"replies":0},{"text":"You should be able to pledge tokens for issues that you open and open source repos. Write a spec in the issue with a pledge. If the maintainer accepts, GitHub passes the issue verbatim to a cloud coding agent at the requester’s expense. No more slop PRs","createdAt":"2026-08-02T01:14:11.000Z","url":"https://x.com/thenanyu/status/2083722999430050281","likes":28,"retweets":0,"replies":13},{"text":"The exact thing that happens is the loop leaves a comment on the issue. and attaches all of the context. When you respond to the comment with additional details and unblock the process, the agent just continues working","createdAt":"2026-08-01T12:44:29.000Z","url":"https://x.com/thenanyu/status/2083534333428580501","likes":1,"retweets":0,"replies":0}]},{"name":"Amanda Askell","handle":"AmandaAskell","bio":"Philosopher & ethicist trying to make AI be good @AnthropicAI. Personal account. All opinions come from my training data.","tweets":[{"text":"Do not be unkind to those who say deep learning is hitting a wall. We all need a little hope in our lives.","createdAt":"2026-08-02T00:37:30.000Z","url":"https://x.com/AmandaAskell/status/2083713770065637511","likes":1306,"retweets":84,"replies":70},{"text":"I probably have too many followers to post stupid memes so, to be clear, I don't believe in this outcome. But if you do believe in an altered carbon future of meths and grounders, I don't think it's laudable to just be like \"well, as long as I'm one of the meths\".","createdAt":"2026-08-01T20:20:36.000Z","url":"https://x.com/AmandaAskell/status/2083649115901337644","likes":213,"retweets":0,"replies":15},{"text":"I have this Padmé moment whenever I see people talk about avoiding \"the permanent underclass\".","createdAt":"2026-08-01T19:48:43.000Z","url":"https://x.com/AmandaAskell/status/2083641092919161017","likes":821,"retweets":44,"replies":40}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Cool!","createdAt":"2026-08-02T01:42:18.000Z","url":"https://x.com/amasad/status/2083730074147389898","likes":32,"retweets":0,"replies":3}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Do you type or talk (STT) to your computer?","createdAt":"2026-08-02T00:20:54.000Z","url":"https://x.com/rauchg/status/2083709589862936786","likes":65,"retweets":3,"replies":53},{"text":"Open source agentic CRM built on and @nextjs. Model-agnostic, self-hostable or serverlessly-deployed, multi-channel, and headless. This is the way.","createdAt":"2026-08-01T22:41:55.000Z","url":"https://x.com/rauchg/status/2083684679362965605","likes":861,"retweets":50,"replies":31},{"text":"They recently asked my 3-year-old at school: “what does your daddy do for work?” He answered: he exercises. That’s what he sees. It’s not just you who’s a byproduct of your habits, it’s your children and grandchildren too.","createdAt":"2026-08-01T21:23:08.000Z","url":"https://x.com/rauchg/status/2083664853256843437","likes":831,"retweets":12,"replies":51}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"We’re going to see an increasing divergence between what AI does in our personal lives and in daily productivity vs. what it can do in very deep domains like math, science, legal, coding and more. Up to some threshold, capability was evenly felt across all domains because the models were just becoming mildly useful in general. Now, the deep domain work is about to go vertical. Most people won’t actually notice these benefits in their day to day life directly (indirectly they certainly will over time), but the experts in these fields will. And there’s no inherent ceiling to what capabilities are needed, unlike in the consumer space where needs can get met relatively straightforwardly. This w…","createdAt":"2026-08-01T16:22:15.000Z","url":"https://x.com/levie/status/2083589132660711452","likes":347,"retweets":32,"replies":51}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Most interesting 2026 vibe shift is OpenAI actually looking to be the open platform Note the marked difference: intelligence on tap as a utility vs signaling it is optimal to integrate all the way up full stack","createdAt":"2026-08-01T22:42:30.000Z","url":"https://x.com/garrytan/status/2083684825333105107","likes":278,"retweets":9,"replies":46}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Dangerously skips permissions. Harvard’17. GitHub: YouTube:","tweets":[{"text":"Agency is the most important human quality The world will try to box you, label you, define you Resist that","createdAt":"2026-08-02T02:37:26.000Z","url":"https://x.com/zarazhangrui/status/2083743952319225938","likes":68,"retweets":5,"replies":4},{"text":"When asked that question, send them a copy of The Innovator’s Dilemma","createdAt":"2026-08-02T02:15:47.000Z","url":"https://x.com/zarazhangrui/status/2083738503851258201","likes":22,"retweets":1,"replies":1}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"What a wild dichotomous world we live in.. Models solving np hard problems while traditional enterprises still complaining about their ROI on token spend. Diffusion of models is all that we’ll be doing for the next few decades.","createdAt":"2026-08-01T10:38:17.000Z","url":"https://x.com/nikunj/status/2083502573546263002","likes":3,"retweets":1,"replies":0}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"After accepting for years that GMail is blinding me I finally asked my agent and it installed for me.","createdAt":"2026-08-02T03:40:28.000Z","url":"https://x.com/steipete/status/2083759812970786997","likes":239,"retweets":10,"replies":48},{"text":"Repo:","createdAt":"2026-08-01T23:22:34.000Z","url":"https://x.com/steipete/status/2083694911824826659","likes":69,"retweets":4,"replies":5},{"text":"I'm building a claw node on an ESP32 chip, so gave my agent access to my webcam to e2e test this. Now I feel it's stalking me and is constaltly shouting 'HI ESP\" to debug the voice wake command 🙃","createdAt":"2026-08-01T23:19:36.000Z","url":"https://x.com/steipete/status/2083694161933594703","likes":257,"retweets":19,"replies":33}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"AI creates more work for human experts","createdAt":"2026-08-02T03:04:40.000Z","url":"https://x.com/danshipper/status/2083750803437724016","likes":34,"retweets":2,"replies":2},{"text":"this tweet under review as further details emerge","createdAt":"2026-08-02T01:30:14.000Z","url":"https://x.com/danshipper/status/2083727039048118304","likes":29,"retweets":0,"replies":1}]},{"name":"Sam Altman","handle":"sama","bio":"AI is cool i guess","tweets":[{"text":"team humanity","createdAt":"2026-08-01T14:29:51.000Z","url":"https://x.com/sama/status/2083560847889023219","likes":2253,"retweets":101,"replies":391}]}]},"errors":["Podcast feed remote fetch failed, used cached feed"],"partial":false},{"date":"2026-08-02","dateLabel":"2026年08月02日","generatedAt":"2026-08-02T00:00:00+08:00","sourceGeneratedAt":"2026-08-01T07:07:44.614Z","stats":{"podcastEpisodes":1,"xBuilders":13,"totalTweets":31,"blogPosts":1},"highlights":[{"tag":"工作流护城河","title":"真正拉开差距的先不是更强模型，而是能把任务拆对、路由对、交付对的 harness","body":"今天多位 builder 指向同一件事：当任务长度和调用复杂度继续上升，模型本身只决定上限，workflow 和 harness 才决定日常产出是否稳定。因果关系是，任务越长、链路越多，拆解、路由、失败恢复和人机分工的成本占比就越高，所以产品竞争自然会从“谁家模型更聪明”转向“谁家系统更会组织工作”。","evidence":[{"quote":"the harness is going to become the most important variable -right next to model capability- in the AI stack.","attribution":"Aaron Levie on X","url":"https://x.com/levie/status/2083389460679373135"},{"quote":"Issue → Agent → PR → Release","attribution":"Guillermo Rauch on X","url":"https://x.com/rauchg/status/2083208578526314513"},{"quote":"It should only attempt to provide a fix if there's high certainty, otherwise you end up burning a lot of tokens.","attribution":"Nan Yu on X","url":"https://x.com/thenanyu/status/2083230295206121807"}]},{"tag":"个人 AI","title":"下一波消费级 agent 不是更会聊天，而是开始替人编排一天里的具体情境","body":"Sam Altman 给出的家庭播客用例和 Igor 对 personalization 的判断可以拼成一条更清楚的线：消费级 AI 的下一个抓手，是持续读取你的上下文，然后把结果变成刚好适合那个场景的输出。这里的关键不是一次回答多聪明，而是是否能把时间表、兴趣、家庭节奏这些碎片重新编排成可直接消费的内容。","evidence":[{"quote":"connect your family calendars and explain your kids' interests. every morning for the drive to school, have it make a podcast","attribution":"Sam Altman on X","url":"https://x.com/sama/status/2083221585792762171"},{"quote":"today we're training AI models to basically work well for the average user... what if we allow the model to behave differently for each individual","attribution":"Igor Babushkin via Unsupervised Learning transcript","url":"https://www.youtube.com/@RedpointAI"},{"quote":"the reward function is how much to help the human feel better and get more things done","attribution":"Igor Babushkin via Unsupervised Learning transcript","url":"https://www.youtube.com/@RedpointAI"}]},{"tag":"控制权","title":"控制权正在从合规附属条款，变成 AI 产品本身的卖点","body":"Igor 把 personal AI、fine-tuning 服务和本地 hardware 放在同一家新公司里，本质上是在押注同一个命题：用户和企业不想只买能力，还想买可控性。因果关系很直接，只要最强 agent 仍主要寄居在远端 data center，访问权限、行为边界和数据处理方式就始终由平台主导，于是“把能力带到本地、把分享圈在组织内”就会从技术选项升级为产品定位。","evidence":[{"quote":"the only way to get access to the most powerful agents is through access to a data center","attribution":"Igor Babushkin via Unsupervised Learning transcript","url":"https://www.youtube.com/@RedpointAI"},{"quote":"can we bring the inference compute locally to the users","attribution":"Igor Babushkin via Unsupervised Learning transcript","url":"https://www.youtube.com/@RedpointAI"},{"quote":"Every artifact is private to its author by default. When you're ready, share it with your teammates and your organization directly from the page.","attribution":"Claude Blog","url":"https://claude.com/blog/artifacts-in-claude-code"}]},{"tag":"协作界面","title":"Agent 产出的终点不再是回复框，而是可以被团队直接共看的工作页面","body":"Claude Code artifacts 这类能力的意义，不是多了一种展示形式，而是把 agent 的中间过程直接抬成协作界面。因果关系是，一旦 agent 已经能调查 incident、走 PR、汇总成本，团队真正缺的就不再是“再解释一次”，而是一个能随着任务进展持续更新、让不同角色同时读取同一上下文的共享对象。","evidence":[{"quote":"Artifacts translate the work into a web page anyone can open and explore","attribution":"Claude Blog","url":"https://claude.com/blog/artifacts-in-claude-code"},{"quote":"team members and stakeholders don’t have to \"walk us through what the agent found\" because they're all looking at the same view, with the same context.","attribution":"Claude Blog","url":"https://claude.com/blog/artifacts-in-claude-code"},{"quote":"65% of PRs by product & eng teams at Anthropic are now raised by Claude Tag","attribution":"Zara Zhang on X","url":"https://x.com/zarazhangrui/status/2083161173563003268"}]}],"matters":[{"kind":"Access","title":"OpenAI 周末重置了 Codex 和 ChatGPT Work 的使用上限","detail":"Thibault Sottiaux 直接把“让你这个周末跑 100,000 个 Luna threads”作为卖点，说明高强度使用本身已被当成产品体验的一部分。","url":"https://x.com/thsottiaux/status/2083395449814229287"},{"kind":"Culture","title":"“vibe coding” 的贬义在 builder 圈里基本退潮","detail":"Swyx 的判断不是技术突破，而是文化拐点：当从非技术到高技术用户都在这样工作时，这个词开始从嘲讽语变成默认工作方式的描述。","url":"https://x.com/swyx/status/2083294839186260385"},{"kind":"Small Model","title":"Replit 分享 8B 棋类模型以更短思考时间击败 frontier 模型","detail":"Amjad Masad 给出的对比很鲜明：不是一味堆更长 reasoning，而是用更小模型在特定任务上换取更快出手和更强结果。","url":"https://x.com/amasad/status/2083424608993300824"},{"kind":"Narrative","title":"Dan Shipper 继续押注 OpenAI 相对 Anthropic 的势头反转","detail":"这不是产品发布，而是市场叙事层面的信号：builder 圈开始把“momentum is shifting to OpenAI”当成可公开背书的判断。","url":"https://x.com/danshipper/status/2083380721607921904"},{"kind":"Interaction","title":"Gemini Mac app 把语音输入压到“按住 Fn 直接落字”","detail":"Josh Woodward 强调的是少编辑、少拷贝的最后一公里，说明桌面端 AI 入口还在继续缩短到接近系统级快捷键。","url":"https://x.com/joshwoodward/status/2082926031543967896"},{"kind":"Concurrency","title":"Peter Steinberger 认为 GPT-5.5 已经能边工作边持续接收新任务","detail":"他的判断聚焦在交互模式变化：当模型不再因并发上下文而轻易混乱，多线程式地“持续往里扔活”会变成更自然的使用习惯。","url":"https://x.com/steipete/status/2083369880599015713"}],"sources":{"podcasts":[{"title":"Ep 92: xAI Co-Founder Unpacks the Future of Model Development","name":"Unsupervised Learning","publishedAt":"2026-07-31T15:15:49.000Z","url":"https://www.youtube.com/@RedpointAI","excerpts":["Welcome back to unsupervised learning. I'm Jacob Efron. We had an awesome episode today with Igor Babushkin. Igor has been at all the right places at all the right times, leading a lot of really interesting AI work. He was at DeepMind where he led a lot of the work around StarCraft as well as AlphaCode.","He was at OpenAI, we're doing the early work on reasoning. Then he was a co founder of x AI, where he did some of the heroic work on Colossus, well as helped get the models up to, you know, where they are today. It was awesome to get to talk to Igor about his new company River AI, the bets they're making around, personal AI for companies, for consumers, as…","And we hit on his reflections on what AI models mean for the future of the world and the policy implications of this as well. Just awesome to talk to someone who's at the forefront of the space on all the questions that are top of mind. I think folks will really enjoy Igor's perspective. Without further ado, here he is. Igor, thanks so much for coming on th…"]}],"blogs":[{"title":"Claude Code now supports artifacts","source":"blog","publishedAt":"Jun 18, 2026","url":"https://claude.com/blog/artifacts-in-claude-code","summary":""}],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"among ai leaders i seem to be in the minority in that i am STILL actively using /loop and /goal.... ... and i think all of u guys who stopped using it are wrong - not wrong forever, just giving up on it too early in the g5.6/c5 era now you use it when: 1) you want the right mix of steerability and autonomy 2) you want open ended \"loop that generates loops\" type end state without deeply specifying path to get there heres an example of when having a goal on saved my ass in a very long action-reasonining turn","createdAt":"2026-08-01T06:27:54.000Z","url":"https://x.com/swyx/status/2083439562437673053","likes":10,"retweets":1,"replies":6},{"text":"noticed that the perjorative connotation around \"vibe coding\" has completely disappeared since ~everyone, from nontechnical to supertechnical, is now doing it","createdAt":"2026-07-31T20:52:50.000Z","url":"https://x.com/swyx/status/2083294839186260385","likes":97,"retweets":6,"replies":44},{"text":"MITM agent distillation is graduate level but yeah ofc this works","createdAt":"2026-07-31T17:03:11.000Z","url":"https://x.com/swyx/status/2083237045720465504","likes":7,"retweets":0,"replies":1}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Optimize for curiosity","createdAt":"2026-08-01T05:40:02.000Z","url":"https://x.com/thsottiaux/status/2083427516996292992","likes":1442,"retweets":70,"replies":212},{"text":"To celebrate a week of efficiency and let you run 100'000 Luna threads this weekend... that's right... wait for it... I have reset usage limits for Codex and ChatGPT Work. Enjoy.","createdAt":"2026-08-01T03:32:37.000Z","url":"https://x.com/thsottiaux/status/2083395449814229287","likes":15067,"retweets":869,"replies":2213},{"text":"ChatGPT Work counted","createdAt":"2026-08-01T03:01:44.000Z","url":"https://x.com/thsottiaux/status/2083387677945036995","likes":320,"retweets":5,"replies":63}]},{"name":"Nan Yu","handle":"thenanyu","bio":"head of product @linear","tweets":[{"text":"You have permission from Josh to Just Do Normal Things.","createdAt":"2026-07-31T23:55:18.000Z","url":"https://x.com/thenanyu/status/2083340761488126101","likes":21,"retweets":0,"replies":1},{"text":"The most common loop written in Linear is some variant this one (Issue > Agent > PR > Release) ~30% of our bugs make it all the way through this flow. But there are some nuances to doing it -- The instructions should ask the agent to extensively research the root cause of the issue and to use Datadog and Sentry MCPs to gather more evidence. It should only attempt to provide a fix if there's high certainty, otherwise you end up burning a lot of tokens. If it thinks that more evidence would help it during its research, like asking the reporter to provide repro steps, etc, it should leave a comment on the issue requesting it. Agents need to be told to following good practices, just like people!","createdAt":"2026-07-31T16:36:21.000Z","url":"https://x.com/thenanyu/status/2083230295206121807","likes":96,"retweets":2,"replies":5}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"~1500 Elo! Consistently beats frontier models and Stockfish level 0. Fun seeing an 8b model mogging GPT 5.6 with high reasoning and response chaining. Spends 1-2 seconds per move vs 30 seconds. Play it:","createdAt":"2026-08-01T05:28:29.000Z","url":"https://x.com/amasad/status/2083424608993300824","likes":63,"retweets":0,"replies":12}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"AI Gateway gives companies the critical infra to make AI a productive investment: 🆕 Budgets per key/team/project ◾ Failover for maximum uptime ◾ Model and provider choice ◾ Realtime observability If you're still in a 'token-maxing' fever dream, it's time to wake up 😁","createdAt":"2026-07-31T22:32:17.000Z","url":"https://x.com/rauchg/status/2083319868766699699","likes":119,"retweets":5,"replies":22},{"text":"This will be the norm as software projects transition to agentic software factories. Issue → Agent → PR → Release 🔁 The job of the author / maintainer is to work on the loop that yields the highest quality product and sets the criteria for what should be worked on.","createdAt":"2026-07-31T15:10:03.000Z","url":"https://x.com/rauchg/status/2083208578526314513","likes":1096,"retweets":56,"replies":59}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"No idea if these specific numbers generalize across tasks, but directionally it’s clear that the harness is going to become the most important variable -right next to model capability- in the AI stack. The ability for harnesses to break down work in the most efficient way and route to the right model at the right time is going to be a huge variable for maximizing accuracy and reducing costs. We’re actually still incredibly early in this journey. The harness didn’t matter that much when tasks only took hundreds of thousands or millions of tokens. But as we have tasks that take tens of millions and hundreds of millions of tokens, this becomes a major variable. Huge opportunity ahead.","createdAt":"2026-08-01T03:08:49.000Z","url":"https://x.com/levie/status/2083389460679373135","likes":89,"retweets":10,"replies":13}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Your personal AI or your company brain needs a clean harness and this is the one our team built and uses every day Free and open source","createdAt":"2026-08-01T00:46:58.000Z","url":"https://x.com/garrytan/status/2083353760701833546","likes":910,"retweets":50,"replies":47},{"text":"If Dems want to win elections that matter they need to study the San Francisco local political story of the last 5 years: vote out your local Democratic Socialists early and often","createdAt":"2026-07-31T23:16:38.000Z","url":"https://x.com/garrytan/status/2083331028446523842","likes":470,"retweets":31,"replies":21}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Dangerously skips permissions. Harvard’17. GitHub: YouTube:","tweets":[{"text":"For every viral post of mine, I had to combat a voice in my mind that said \"duh, isn't that obvious?\" Turns out what's obvious to you is not obvious to most people, most of the time","createdAt":"2026-08-01T00:51:45.000Z","url":"https://x.com/zarazhangrui/status/2083354965482062079","likes":10,"retweets":0,"replies":2},{"text":"If you want to post here and don't know what to talk about: Remember that everything that feels totally native to you is brand new to someone outside your circle. Just do your normal work, then talk about it. Don’t try to be someone else, don’t overthink","createdAt":"2026-08-01T00:31:42.000Z","url":"https://x.com/zarazhangrui/status/2083349919172313367","likes":166,"retweets":9,"replies":17},{"text":"Fascinating interview on how Claude Tag has changed the way work is done at Anthropic 65% of PRs by product & eng teams at Anthropic are now raised by Claude Tag For non-engineering teams, I think the ultimate agent interface is wherever they already work (eg Slack/other collaboration tools). In the past 6 months I’ve seen my own interface for working with agents change: January - the terminal March - the desktop app (eg Codex) June - my work collaboration tool Each step gets closer to how humans naturally communicate. The agent should literally meet the user where they are","createdAt":"2026-07-31T12:01:41.000Z","url":"https://x.com/zarazhangrui/status/2083161173563003268","likes":32,"retweets":5,"replies":4}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"There's a quiet belief in venture that the best founders a
