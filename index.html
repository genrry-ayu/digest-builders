pre-training 和 RL 规模化了，但实验室内的提升并没有自然变成现实任务的全覆盖。这里暴露出的不是单次推理不够强，而是模型缺少在用户数据、真实任务和更长时间跨度里持续吸收经验的机制。所以接下来真正可能拉开代差的，不只是再高一点 benchmark，而是能不能把“上线后继续学习”做成架构能力。","evidence":[{"quote":"what the bottleneck is to better models and to smarter systems is the architecture itself.","attribution":"Jerry Tworek on Training Data","url":"https://www.youtube.com/watch?v=2RJiaf0SY8s"},{"quote":"we need to have models that learn at test time. We need to have models that learn with users on their data, on their real world task","attribution":"Jerry Tworek on Training Data","url":"https://www.youtube.com/watch?v=2RJiaf0SY8s"}]},{"tag":"企业系统","title":"公司级 agent 正在从一堆分散 bot，收编成一个可控的内部操作层","body":"Guillermo Rauch 给出的不是某个单点 agent demo，而是一种组织级架构：把内部 finance、comms、docs、marketing、engineering 等职责收进同一个可路由、可委派、可记忆的系统里。这里的关键判断是，企业真正需要的可能不是“更多 agent”，而是一个统一入口来承接权限、上下文和分工。谁掌握这个中枢，谁就更接近把 agent 变成公司的操作层，而不是聊天插件。","evidence":[{"quote":"Every day-to-day job at Vercel now involves @𝚟.","attribution":"Guillermo Rauch","url":"https://x.com/rauchg/status/2084042561690456157"},{"quote":"It's both an agent and a router. It has sub-agents, skills, and it knows how to delegate work to other agents.","attribution":"Guillermo Rauch","url":"https://x.com/rauchg/status/2084060157085143512"}]},{"tag":"应用层 Moat","title":"AI 先吃掉的不是最简单的工作，而是那些“能验证对错”的高价值工作","body":"Aaron Levie 这条长帖把自动化顺序讲得很透：先被快速吞掉的，往往不是价值最低的工作，而是那些虽然难、但结果可以被客观校验的工作。这会把竞争重心推向应用层，因为一旦离开可验证领域，问题就不再只是模型会不会做，而是流程怎么改、反馈怎么拿、结果怎么测。换句话说，通用模型继续变强当然重要，但真正能落地到复杂知识工作的，会是验证机制和流程重构能力。","evidence":[{"quote":"some of the “hardest” work in the world is actually prone to automation first, particularly due to its verifiability.","attribution":"Aaron Levie","url":"https://x.com/levie/status/2083965372747882741"},{"quote":"there will be a lot done at the applied AI layer than just the the model itself","attribution":"Aaron Levie","url":"https://x.com/levie/status/2083965372747882741"}]},{"tag":"产品体验","title":"当 app 退场，产品差异不会消失，只是从屏幕布局转移到触感、人格和可见边界","body":"Ryo Lu 提的问题很关键：如果我们正离开“app 世界”，那还有哪些部分会继续对用户可见？这说明 AI 产品并不会因为界面收缩就变得同质化，反而更考验什么该显露、什么该隐藏，以及交互是否让人愿意长期相处。Peter Yang 补的那句“Personality matters”也点明了同一件事：能力接近之后，体验层不会退场，只会换一种形态主导偏好。","evidence":[{"quote":"as we leave the world of apps behind, what parts of software will remain visible, and how could it feel?","attribution":"Ryo Lu","url":"https://x.com/ryolu_/status/2083939454017053179"},{"quote":"Personality matters! A smart friend that's annoying to talk to is no good.","attribution":"Peter Yang","url":"https://x.com/petergyang/status/2083947480136421384"}]},{"tag":"人机协作","title":"被 AI 长期留下来的岗位，不会以“亲手做事”定义，而会以“能否重建自己的 agency”定义","body":"Dan Shipper 对 agency rupture 的拆解，和 Thariq 对数学领域 Jevons paradox 的观察，拼到一起后很有意思。它们都在指向同一件事：AI 不只是替你做一部分任务，更会迫使人重新定义自己在流程里的位置。未来更稀缺的不是纯手工执行，而是能在更高抽象层组织脚手架、判断质量，并把新的协作方式稳定下来的人。","evidence":[{"quote":"agency ruptures with AI seem to follow a predictable pattern","attribution":"Dan Shipper","url":"https://x.com/danshipper/status/2084038453831020916"},{"quote":"demand for people who think and know about math will go up","attribution":"Thariq","url":"https://x.com/trq212/status/2083977795290734975"}]}],"matters":[{"kind":"X","title":"Karpathy 把 pelican on the bicycle 测试做成了可直接在浏览器里玩的版本","detail":"这条更像一个文化样本：生成式产物不只拿来看，还开始被做成可 fork、可试玩、可传播的轻量软件对象。","url":"https://x.com/karpathy/status/2083948654377996480"},{"kind":"X","title":"Swyx 记录了 computer-use bot 代打客服升级单的瞬间","detail":"支持场景已经出现“人类客服不知道自己在和 bot 对话”的案例，说明 agent 正在进入高摩擦、跨系统的实际事务处理。","url":"https://x.com/swyx/status/2084156733027701164"},{"kind":"X","title":"Hermes 把“定期清理 skills 和 memory”做成了后台自维护任务","detail":"Peter Yang 引述的 Hermes Curator 指向一个具体方向：agent 不只是执行任务，也开始维护自己的工作材料和低质量积累。","url":"https://x.com/petergyang/status/2083968605432267139"},{"kind":"X","title":"Amjad Masad 的 LLM chess engine 已经在 LiChess 自主下场打真人和 bot","detail":"从“能下棋”到“公开上场持续对战”，这里更像是在把 agent 能力放进持续、开放、可被围观的实时环境里测压。","url":"https://x.com/amasad/status/2083926395403821427"},{"kind":"X","title":"Nikunj Kothari 认为早中期融资正在彻底变成 vibes capital","detail":"他描述的不是局部泡沫，而是一个由 AI 热度和资金环境共同放大的定价失真阶段，连“看起来稳”的公司也未必能顺利拿钱。","url":"https://x.com/nikunj/status/2083873335998333227"},{"kind":"X","title":"Garry Tan 把 AI 叙事拉回到增长与“做出有人要的东西”","detail":"一边是对 AI 经济增长的强乐观，另一边是“territory matters more than the map”的提醒，创业判断仍然要回到真实需求而不是叙事热度。","url":"https://x.com/garrytan/status/2083920039208693996"}],"sources":{"podcasts":[{"title":"Building the Automated AGI Lab: Core Automation's Jerry Tworek and Rohan Anil","name":"Training Data","publishedAt":"2026-07-29T09:00:00.000Z","url":"https://www.youtube.com/watch?v=2RJiaf0SY8s","excerpts":["If I play football, for example, it looks very, very closely to reinforcement learning. I kick a ball a lot of times, and every time I adjust it a little bit and I see if it roughly matches what I what I wanted and either there's some self reinforcement happening. When I learn mathematics, it's very different type of thing. It's it's like reading about hard…","They are just very different. We probably are spending the most compute crap than ever on learning from experience, but learn reinforcement learning is is not the end of learning from experience. And there will be better approaches that researchers will be coming up in the coming years on how to how to use that data.","Jerry, Rohan, thank you so much for joining us today. The two of you are the founders of Core Automation, one of the hottest neo labs in San Francisco right now. And before starting Core Automation, you led some of the most important research projects of the AI era. Jerry, you were VP at OpenAI, where you worked amongst other things on running the strawberr…"]}],"blogs":[],"x":[{"name":"Andrej Karpathy","handle":"karpathy","bio":"I like training large deep neural nets.","tweets":[{"text":"More on the pelican on the bicycle test from @simonw: I uploaded the source here so it's playable in the browser, forkable etc. Look out for GTA Hobbiton dropping before GTA VI :)","createdAt":"2026-08-02T16:10:51.000Z","url":"https://x.com/karpathy/status/2083948654377996480","likes":392,"retweets":14,"replies":38}]},{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"haven't seen a full cycle of this guy but this place absolutely can chew you up and wastes 10 yrs of your life making you feel like you are doing something when you are not","createdAt":"2026-08-03T06:57:58.000Z","url":"https://x.com/swyx/status/2084171901451268599","likes":2,"retweets":0,"replies":1},{"text":"in prep for our computer use pod, gonna store a running list of codex cua wow moments. here it is dealing with support chat for me to escalate for faster resolution these humans have no idea they are talking to a bot support guy tried to say its our fault, bot replied with complete receipts lmao","createdAt":"2026-08-03T05:57:41.000Z","url":"https://x.com/swyx/status/2084156733027701164","likes":3,"retweets":0,"replies":2},{"text":"@akshaynathan_ @AriX live now!","createdAt":"2026-08-03T05:52:50.000Z","url":"https://x.com/swyx/status/2084155512573288478","likes":6,"retweets":0,"replies":1}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"Went to a community center in Canada and it has a full swimming pool, jacuzzi, sauna, and even lazy river. In the most expensive Bay Area neighborhoods, the community center is just a fancy building with empty rooms that you can rent.","createdAt":"2026-08-02T23:55:16.000Z","url":"https://x.com/petergyang/status/2084065527081980285","likes":96,"retweets":2,"replies":26},{"text":"One of the biggest benefits of Hermes is that it builds its own skills to help you get work done. But I had to ask @karan4d, @NousResearch co-founder: \"How does Hermes avoid slop while doing this?\" Here's his response: \"Hermes Curator [a background task] runs inside your agent and cleans up your skills and memory on a schedule, asking: Where's the slop, and where can I make it more efficient? And because it's open source, you can hand it your own definition of slop and it rewrites its own cleanup loop your way.\" 📌 Watch the full episode here:","createdAt":"2026-08-02T17:30:08.000Z","url":"https://x.com/petergyang/status/2083968605432267139","likes":90,"retweets":7,"replies":5},{"text":"Personality matters! A smart friend that's annoying to talk to is no good.","createdAt":"2026-08-02T16:06:11.000Z","url":"https://x.com/petergyang/status/2083947480136421384","likes":186,"retweets":6,"replies":28}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"i think there are lots of parallels to what happened with chess","createdAt":"2026-08-02T18:07:54.000Z","url":"https://x.com/trq212/status/2083978109376987365","likes":73,"retweets":1,"replies":7},{"text":"you can already see Jevons paradox at work in mathematics there is more happening, it is easier to understand and mathematicians have more time to discuss it with us at higher abstraction levels demand for people who think and know about math will go up","createdAt":"2026-08-02T18:06:39.000Z","url":"https://x.com/trq212/status/2083977795290734975","likes":1191,"retweets":43,"replies":94}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Woah","createdAt":"2026-08-02T20:43:26.000Z","url":"https://x.com/amasad/status/2084017252152856716","likes":91,"retweets":3,"replies":8},{"text":"You can watch the games live on the website. Mf is playing 3 concurrent games rn","createdAt":"2026-08-02T15:20:50.000Z","url":"https://x.com/amasad/status/2083936067355635948","likes":16,"retweets":0,"replies":5},{"text":"My LLM chess engine is now on LiChess autonomously playing real games against people and bots. 1253 Elo:","createdAt":"2026-08-02T14:42:24.000Z","url":"https://x.com/amasad/status/2083926395403821427","likes":215,"retweets":10,"replies":41}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"PS: we've obviously had agents for a while. In fact, we had too many. Teams and individuals at Vercel started building and deploying agents. Dozens of them. Using a web analogy, that'd be like every agent having its own domain name. Not a good UX. I just want ${company}⁠.com! @𝚟 solved that problem for us. It's both an agent and a router. It has sub-agents, skills, and it knows how to delegate work to other agents. Another analogy is that it's a bit like a \"monolith\" or \"monorepo\", but you have the escape hatch of \"proxying\" to another agent over the network when needed. Again, not unlike how routing on the internet evolved at scale. And yes, there's also the occasional purpose-built agent…","createdAt":"2026-08-02T23:33:56.000Z","url":"https://x.com/rauchg/status/2084060157085143512","likes":66,"retweets":0,"replies":4},{"text":"We built an agent that powers our company's internal operations called @𝚟. Every day-to-day job at Vercel now involves @𝚟. It's growing exponentially both in daily interactions and token use. One can extrapolate to the day AI agents run entire companies from here. It's an expert in finance, comms, docs, marketing, engineering, business analytics. It's seeded by the skills we gave it and we update, but it's also constantly improving. It already keeps memories and personalized workflows and schedules on a per-user basis. For example, I knew skills⁠.sh hit 1M skills and I shared this on these forums because I asked @𝚟 to periodically check and remind me. It's powered by and is also the basi…","createdAt":"2026-08-02T22:24:01.000Z","url":"https://x.com/rauchg/status/2084042561690456157","likes":1233,"retweets":47,"replies":116},{"text":"AI alone is cool. But mastery + creativity + AI hits on a whole different level. Don't let anyone discourage you from pursuing excellence and craft. Keep studying the blade.","createdAt":"2026-08-02T17:32:11.000Z","url":"https://x.com/rauchg/status/2083969120270450911","likes":3662,"retweets":359,"replies":202}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"We’re going to be in for a strange dynamic which is that some of the “hardest” work in the world is actually prone to automation first, particularly due to its verifiability. Math, cyber, and code -while being insanely hard and high value fields- have the benefit of being able to be tested that it’s correct objectively. This has two immediate benefits: the training of the models offers clearer reward signals, and then the running of the models allows you to know that it’s working properly because you can test the results in a scalable way. Conversely, in other domains of work, there’s much less instant verifiability. Which legal clauses your client will agree to, what marketing campaign to…","createdAt":"2026-08-02T17:17:17.000Z","url":"https://x.com/levie/status/2083965372747882741","likes":318,"retweets":26,"replies":48}]},{"name":"Ryo Lu","handle":"ryolu_","bio":"Design @Cursor_ai. Early @NotionHQ, @Stripe, built startups. I make a world where anyone can make software. Aspiring k-pop idol.","tweets":[{"text":"my early mentors were these apps, especially Rdio, Mailbox, and Apple they made new patterns that made software feel simpler and intuitive to touch as we leave the world of apps behind, what parts of software will remain visible, and how could it feel?","createdAt":"2026-08-02T15:34:18.000Z","url":"https://x.com/ryolu_/status/2083939454017053179","likes":390,"retweets":6,"replies":29}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Growth is good AI will create unimaginable economic growth and that is the best white pill","createdAt":"2026-08-02T16:44:27.000Z","url":"https://x.com/garrytan/status/2083957110711386439","likes":302,"retweets":30,"replies":45},{"text":"The sense of wonder disappeared right at the moment the amount of wonder is going parabolic","createdAt":"2026-08-02T14:30:27.000Z","url":"https://x.com/garrytan/status/2083923385193828612","likes":173,"retweets":6,"replies":35},{"text":"Everyone mistakes the map for the territory Meritocracy is that the territory matters more than the map And in markets the outcome is the territory: did you make something people want?","createdAt":"2026-08-02T14:17:09.000Z","url":"https://x.com/garrytan/status/2083920039208693996","likes":195,"retweets":8,"replies":37}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"Warm NYC nights are magic 🪄","createdAt":"2026-08-02T14:40:27.000Z","url":"https://x.com/nikunj/status/2083925904598733088","likes":416,"retweets":2,"replies":22},{"text":"What a wild world we’re living through. I wrote about the Series A squeeze recently. Here’s what else I’m seeing from my seat on the investing side.. 1) VC has effectively fully become vibes capital. The market reality at the early-mid stage is completely divorced from fundamentals. I can go longer with even a resemblance of a straight face predict what happens to a company when they go to fund raise. Some rounds are insanely wild with nothing to show, some rounds that seem like a sure shot are struggling to raise the capital they need. If you’re the “in vogue sector”, you’ll be just fine. This has been happening for some while but it’s fully banana town now. And unlike most who think a cor…","createdAt":"2026-08-02T11:11:34.000Z","url":"https://x.com/nikunj/status/2083873335998333227","likes":372,"retweets":21,"replies":25}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"That's a fairly new kind of spam.","createdAt":"2026-08-02T18:00:40.000Z","url":"https://x.com/steipete/status/2083976289485230449","likes":271,"retweets":7,"replies":39}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"if you haven’t read War and Peace or some of the historical accounts of this like With Napoleon in Russia, you should","createdAt":"2026-08-03T05:07:55.000Z","url":"https://x.com/danshipper/status/2084144207254663417","likes":10,"retweets":1,"replies":2},{"text":"when you experience a language model doing a task that used to require you at every step and now doesn't, it's a gigantic agency rupture. we tend to equate ourselves with our tasks, our outputs, and a rupture of this kind is akin to the loss of your identity and sense of self. you are no longer required, and you had no say in the matter. it's a kind of death. however, agency ruptures with AI seem to follow a predictable pattern: - Initial agency rupture. Here you see the AI doing what you used to do, and you see only the AI. In your perception of reality the AI is highlighted, and the human work around getting the AI to do the thing, is invisible. you can see this in the way we use language…","createdAt":"2026-08-02T22:07:41.000Z","url":"https://x.com/danshipper/status/2084038453831020916","likes":192,"retweets":17,"replies":29},{"text":"if ought implies can, and technology reshapes the field of human abilities—then technology reshapes oughts. we should expect AI to fundamentally change our moral intuitions at the same time as it changes our abilities","createdAt":"2026-08-02T21:11:05.000Z","url":"https://x.com/danshipper/status/2084024211539116466","likes":18,"retweets":1,"replies":4}]}]},"errors":[],"partial":false},{"date":"2026-08-03","dateLabel":"2026年08月03日","generatedAt":"2026-08-03T00:00:00+08:00","sourceGeneratedAt":"2026-08-02T07:09:46.620Z","stats":{"podcastEpisodes":1,"xBuilders":15,"totalTweets":30,"blogPosts":1},"highlights":[{"tag":"垂直工作流","title":"企业 AI 的胜负手，已经不是“会不会答”，而是“能不能吃下行业里的脏活累活”","body":"今天最强的信号不是模型又多会说话，而是垂直团队开始把 AI 推进到真实业务的接单、分诊、调度和收入环节。这里的难点不在通用推理本身，而在于把行业规则、客户价值、时效约束和执行路径编排成可持续运转的系统。所以真正能放大的，不是一个更聪明的聊天框，而是能把模型能力压进数据、流程和运营约束里的产品层。","evidence":[{"quote":"over 70% of our customers are AI first","attribution":"Melisa Tokmak, Netic founder, on No Priors","url":"https://www.youtube.com/watch?v=wWbX3NL6_Uo"},{"quote":"deep domain work is about to go vertical","attribution":"Aaron Levie","url":"https://x.com/levie/status/2083589132660711452"}]},{"tag":"安全架构","title":"Agent 真正被大规模放行之前，先要把“爆炸半径”做成产品能力","body":"当 agent 开始碰文件、命令、网络和外部工具，安全不再只是规则文档，而会直接决定产品能不能放量。Anthropic 这篇工程复盘给出的判断很明确：审批式监督会随着疲劳迅速失效，真正可部署的前提是先把可达边界、外连能力和执行环境收紧成确定性的系统约束。也就是说，agent 安全正在从“提示词防守”转向“运行时架构”。","evidence":[{"quote":"users approved roughly 93% of permission prompts","attribution":"Anthropic Engineering","url":"https://www.anthropic.com/engineering/how-we-contain-claude"},{"quote":"Design for containment at the environment layer first","attribution":"Anthropic Engineering","url":"https://www.anthropic.com/engineering/how-we-contain-claude"}]},{"tag":"Agent 界面","title":"Agent 的默认界面，正在从对话框迁移到工单与评论流","body":"Nan Yu 描述的不是一个更会写代码的聊天机器人，而是一条可以挂预算、吃规范、留下上下文并在阻塞解除后继续推进的执行回路。这说明下一阶段的 agent 产品竞争点，会越来越落在任务队列、上下文交接、异常恢复和协作机制上，而不是只比一次性回答是否惊艳。对软件团队来说，agent 正在变成工作流节点，而不是输入框里的陪聊对象。","evidence":[{"quote":"passes the issue verbatim to a cloud coding agent","attribution":"Nan Yu","url":"https://x.com/thenanyu/status/2083722999430050281"},{"quote":"the loop leaves a comment ... the agent just continues working","attribution":"Nan Yu","url":"https://x.com/thenanyu/status/2083534333428580501"}]},{"tag":"平台格局","title":"上层 AI 软件正在主动把自己从单一模型品牌里解耦","body":"如果一边有人把 OpenAI 的新姿态读成“开放平台”，另一边又有人高调展示 model-agnostic、self-hostable 的 agentic 应用，信号就很清楚了：builder 正在主动把控制权从模型品牌抽离出来。未来实验室仍然供应 intelligence，但产品的分发、部署方式、渠道接入和工作流所有权，会越来越掌握在应用层和基础设施层手里。","evidence":[{"quote":"OpenAI actually looking to be the open platform","attribution":"Garry Tan","url":"https://x.com/garrytan/status/2083684825333105107"},{"quote":"Model-agnostic, self-hostable or serverlessly-deployed","attribution":"Guillermo Rauch","url":"https://x.com/rauchg/status/2083684679362965605"}]},{"tag":"体验竞争","title":"前沿模型的下一个分水岭，不只是更强，而是更会自检也更像“产品”","body":"Karpathy 给出的例子说明，长时生成和复杂编排的原始能力已经高到足以做出过去没人愿意手写的怪异作品；但他同时点出了模型难以原生审计视频和游戏结果的短板。另一侧，Peter Yang 对 Opus 5 的不满也不是能力不够，而是回复长度、语气和判断感开始伤害使用体验。这两个信号合在一起，意味着模型竞争正在从“能不能做”继续转向“能不能稳定自检、以及用起来是否顺手”。","evidence":[{"quote":"wrote 5500 lines of code","attribution":"Andrej Karpathy","url":"https://x.com/karpathy/status/2083749667410727319"},{"quote":"Something's off with Opus 5","attribution":"Peter Yang","url":"https://x.com/petergyang/status/2083755374994415904"}]}],"matters":[{"kind":"X","title":"OpenAI 团队观察到周末 `/fast` 使用下降","detail":"Thibault Sottiaux 提到用户在周末更少使用 `/fast`，说明模型使用意图会随时间场景变化，而不只是由能力和价格决定。","url":"https://x.com/thsottiaux/status/2083699879650463756"},{"kind":"X","title":"插件分发链路仍会直接伤害 AI 产品体验","detail":"Peter Yang 在打包 `/no-ai-slop` skill 为插件时遇到 bug，说明生态层的安装与发布摩擦仍然会直接暴露给终端用户。","url":"https://x.com/petergyang/status/2083594381748302160"},{"kind":"X","title":"语音输入是否会成为默认入口，仍然没有定论","detail":"Guillermo Rauch 直接发问“你是打字还是对电脑说话”，这类探针式讨论说明 STT 仍在争夺主交互入口的位置。","url":"https://x.com/rauchg/status/2083709589862936786"},{"kind":"X","title":"个人 agent 已开始接管日常软件维护","detail":"Peter Steinberger 说自己让 agent 帮他安装工具来缓解 Gmail 过载，桌面侧的个人委托动作正在变得具体而日常。","url":"https://x.com/steipete/status/2083759812970786997"},{"kind":"X","title":"AI 讨论里的阶层叙事继续升温","detail":"Amanda Askell 对“永久底层”这类说法表达不适，表明 AI 产业讨论已经越来越频繁地碰到劳动与阶层的伦理问题。","url":"https://x.com/AmandaAskell/status/2083641092919161017"}],"sources":{"podcasts":[{"title":"Building an Autonomous Enterprise for Real-World Services with Netic Founder Melisa Tokmak","name":"No Priors","publishedAt":"2026-07-31T10:00:00.000Z","url":"https://www.youtube.com/watch?v=wWbX3NL6_Uo","excerpts":["Today on our priors, we're joined by Melissa Tachmak. Melissa is the founder and CEO of Netic, a company that builds AI for different real world services like HVAC, pet care, a variety of other things like that, roofers. Prior to Netic, Melissa was a director of engineering and worked on various aspects of go to market for Scale dot AI and, also has experie…","Yeah. Maybe we can start off by talking a little bit about your business and what you're building because I think that, you're doing something really interesting in the real world, and you're kind of marrying AI in the real world. So could you tell us more about your company and Netic and, you know, what you're focused on?","Yeah. Netic builds AI to run millions of real world businesses that keep the world running. That means, basically, we work with large enterprises in essential services. We started in essential services."]}],"blogs":[{"title":"How we contain Claude across products","source":"blog","publishedAt":null,"url":"https://www.anthropic.com/engineering/how-we-contain-claude","summary":""}],"x":[{"name":"Andrej Karpathy","handle":"karpathy","bio":"I like training large deep neural nets.","tweets":[{"text":"We're starting to leave the territory where you'd test an LLM by e.g. \"create an svg of pelican on a bicycle\". As one idea to generalize it, I was interested what Opus 5 would do if I gave it the first paragraph of the Lord of the Rings, a 1M token budget (~$10) and asked for three js render of it. Opus went off for ~2 hours and wrote 5500 lines of code that (procedurally) rendered the story. It's kind of janky but fun. But it's a bit mindboggling that the LLM has to place and orchestrate various polygon assets in (x,y,z) coordinates and write code that animates it all, and that it even does anything at all. I also like this kind of examples because no one in their right mind would ever spe…","createdAt":"20     const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    let selectedDate = new URLSearchParams(location.search).get('date') || (DIGESTS.some(d => d.date === today) ? today : DIGESTS[0]?.date);
    const esc = (v) => String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;");
    function link(url, text) { return url ? '<a href="' + esc(url) + '" target="_blank" rel="noreferrer">' + esc(text || url) + '</a>' : esc(text || ''); }
    function renderDates() {
      document.getElementById('dates').innerHTML = DIGESTS.map(d => '<button class="date-btn" aria-current="' + (d.date === selectedDate ? 'date' : 'false') + '" data-date="' + esc(d.date) + '">' + esc(d.date) + '</button>').join('');
      document.querySelectorAll('.date-btn').forEach(btn => btn.addEventListener('click', () => {
        selectedDate = btn.dataset.date;
        history.replaceState(null, '', '?date=' + selectedDate);
        render();
      }));
    }
    function renderStats(d) {
      const stats = d.stats || {};
      document.getElementById('stats').innerHTML = [
        ['播客', stats.podcastEpisodes || 0],
        ['Builders', stats.xBuilders || 0],
        ['推文', stats.totalTweets || 0],
        ['博客', stats.blogPosts || 0],
      ].map(([label, value]) => '<div class="stat"><strong>' + esc(value) + '</strong><span class="small">' + esc(label) + '</span></div>').join('');
    }
    function renderEvidence(evidence) {
      if (typeof evidence === 'string') return '<blockquote>' + esc(evidence) + '</blockquote>';
      const attribution = evidence.attribution ? '<div class="small">— ' + esc(evidence.attribution) + (evidence.url ? ' · ' + link(evidence.url, '查看原文') : '') + '</div>' : '';
      return '<blockquote>' + esc(evidence.quote || '') + attribution + '</blockquote>';
    }
    function renderHighlights(d) {
      const cards = (d.highlights || []).map(item => '<article class="card"><div class="tag">' + esc(item.tag) + '</div><h3>' + esc(item.title) + '</h3><p>' + esc(item.body) + '</p>' + ((item.evidence || []).length ? '<details><summary>查看原文依据</summary>' + item.evidence.map(renderEvidence).join('') + '</details>' : '') + '</article>').join('');
      return '<section><h2>洞察<span class="section-note">INSIGHTS / 经过判断的关键信号</span></h2><div class="grid">' + (cards || '<p class="empty">今天没有足够内容生成洞察。</p>') + '</div></section>';
    }
    function renderMatters(d) {
      const cards = (d.matters || []).map(item => '<article class="card"><div class="tag">' + esc(item.kind) + '</div><h3>' + link(item.url, item.title) + '</h3><p>' + esc(item.detail) + '</p></article>').join('');
      return '<section><h2>议题<span class="section-note">MATTERS / 值得继续追踪</span></h2><div class="grid">' + (cards || '<p class="empty">今天没有额外议题。</p>') + '</div></section>';
    }
    function renderSources(d) {
      const archive = d.archiveUrl ? '<p class="archive-link">' + link(d.archiveUrl, '查看当日完整存档 ↗') + '</p>' : '';
      const xGroups = ((d.sources || {}).x || []).map(builder => '<div class="source-group"><h3>' + esc(builder.name) + ' <span class="small">@' + esc(builder.handle) + '</span></h3><p class="small">' + esc(builder.bio) + '</p>' + (builder.tweets || []).map(tweet => '<p class="tweet">' + esc(tweet.text) + '<br>' + link(tweet.url, '原文') + ' <span class="small">likes ' + esc(tweet.likes) + ' · reposts ' + esc(tweet.retweets) + '</span></p>').join('') + '</div>').join('');
      const podcastGroups = ((d.sources || {}).podcasts || []).map(podcast => '<div class="source-group"><h3>' + link(podcast.url, podcast.title) + '</h3>' + (podcast.excerpts || []).map(e => '<blockquote>' + esc(e) + '</blockquote>').join('') + '</div>').join('');
      const blogGroups = ((d.sources || {}).blogs || []).map(blog => '<div class="source-group"><h3>' + link(blog.url, blog.title) + '</h3><p class="small">' + esc(blog.source || '') + '</p><p>' + esc(blog.summary || '') + '</p></div>').join('');
      return '<section><h2>原文<span class="section-note">SOURCES / 完整证据索引</span></h2>' + archive + '<div class="sources">' + podcastGroups + blogGroups + xGroups + '</div></section>';
    }
    function render() {
      const d = DIGESTS.find(item => item.date === selectedDate) || DIGESTS[0];
      if (!d) {
        document.getElementById('content').innerHTML = '<p class="empty">还没有 digest 数据。</p>';
        return;
      }
      selectedDate = d.date;
      renderDates();
      renderStats(d);
      document.getElementById('content').innerHTML = renderHighlights(d) + renderMatters(d) + renderSources(d);
    }
    render();
  </script>
