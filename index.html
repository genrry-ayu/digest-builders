hmark put Carbon and Argon about even. If you like Argon, you’ll probably like Carbon. But Carbon costs more, and I haven’t seen enough improvement to justify switching."}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]},{"type":"paragraph","sentences":[{"id":"nov12-18","text":"他的最终选择是偶尔使用：交给它一项终点清晰的大任务并审阅结果，也可把它作为第二意见，尤其用于音视频。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120187507396530309","quote":" 🟨 I’ll use it sometimes.\n\nGive it one big job with a clear finish line, and review what comes back. It’s also worth trying as a second opinion, especially on audio and video.\n\nFull vibe check coming soon: https://t.co/Ch2pNl9Po5"}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]}],"coverageReview":{"details":"保留六个原有分项、44%/21%单次基准、6项变15项、4.5小时、工作室模型、95%估计及6段视频。","limitations":"均为团队首日试用；数字不是普遍成功率，95%为估计，设计评价分歧及写作成本限制均保留。","omissions":"省去发帖修辞、社交账号标记和文末预告链接，不补外链内容。"}}],"editorial":[{"id":"nov12-20","text":"这份试用报告支持按任务选择模型：编程表现提升，并不代表写作也值得付出切换成本；长时间执行还需要明确收尾条件。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2120187507396530309","quote":"BREAKING:\n\n@Google just dropped Gemini 4 Carbon. It’s a much better coder than Argon—but I’m probably keeping Argon for writing.\n\nWe’ve been testing it at @every across coding, writing, design, and knowledge work. It can work for hours on an ambitious project, but it doesn’t always know when to stop.\n\nHere’s your day-zero vibe check:\n\n• Coding: On one run of our Senior Engineer benchmark, Carbon scored 44%, versus Argon’s 21%. A big improvement, though still middle of the pack. In a separate test, @hammer_mt gave it a backlog to work through. It identified 6 tasks as ready, then did 15—including work someone else was already doing. He stopped it after almost 4.5 hours.\n\n• Big builds: @RandyCounsman gave it 3D scans of our podcast studio and an equipment list. In one attempt, it built a browser-based model accurate enough to check whether new gear would fit without getting into the shot. He estimates Carbon also wrote about 95% of a big update to Everycut, our internal video editor.\n\n• Code quality: @kieranklaassen values its tests and documentation on large projects, including its record of approaches it considered and rejected. Fable remains his first choice, but Carbon has earned a place alongside it. The catch: It can produce huge files where Fable keeps things more modular.\n\n• Audio and video: Randy found it caught audio editing issues other models missed. Kieran handed it a recorded meeting and asked for shorts. It came back with 6 titled clips.\n\n• Design: @jackcheng got a hyperrealistic ginkgo-leaf app icon with details other models struggle with. Objects and 3D scenes look better than Argon’s. Interfaces split the team: Jack and Randy kept getting boxes within boxes, while @TylerNishida liked its ideas for new interfaces. Kieran says giving it design guidance makes a big difference.\n\n• Writing: Our editorial benchmark put Carbon and Argon about even. If you like Argon, you’ll probably like Carbon. But Carbon costs more, and I haven’t seen enough improvement to justify switching.\n\nMy Reach Test: 🟨 I’ll use it sometimes.\n\nGive it one big job with a clear finish line, and review what comes back. It’s also worth trying as a second opinion, especially on audio and video.\n\nFull vibe check coming soon: https://t.co/Ch2pNl9Po5"}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]}},{"tag":"实践","title":"Aaron Levie：agent 群的机会在数字任务与工作组织","body":"Aaron Levie 预期 agent 群会扩大数字环境中的产出，并带来执行框架和业务部署机会。","claimType":"single_source","sourcePerspective":"Aaron Levie","titleReview":{"id":"nov12-26","text":"Aaron Levie：agent 群的机会在数字任务与工作组织","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120385739342897469","quote":"Agent swarms have the potential to drive yet another leap in output from AI. The impact will be a clear separation between teams that adopt this pattern of work and those that don’t. \n\nThe progression has roughly been: chat gave us quick turn AI responses that let us work a bit faster, but we were still rate limited by our interactions; then agents that can go off and complete entire tasks for us, accelerating hours or days of work into minutes; to now swarms of agents that are goal seeking and will find any route to the successful completion of a project, where there’s no inherent limit to the productivity gains. \n\nWe can imagine a future where, for any task in which value can be created within a self-contained digital environment, swarms will be able to complete the work faster than any other approach.\n\nEssentially any area where value creation is currently bound by the amount of research you can do, the amount of decisions made with a set of software tools, the amount of data processed or consumed, and the amount of code (or code adjacent) that can be generated. \n\nThis means swarms will play a big role in game development, coding, trading, life sciences research, IT automation, cyber, math breakthroughs, animation, and plenty of other areas of work that have these characteristics. \n\nThere’s a lot of opportunity to build the harnesses, applied AI products, and infrastructure for how these agents operate. And most importantly there’s a ton of opportunity for those that can wire up work in this way. It’s going to be an entire new field of FDE work available."}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"},"evidence":[{"sourceId":"x:2120385739342897469","quote":"We can imagine a future where, for any task in which value can be created within a self-contained digital environment, swarms will be able to complete the work faster than any other approach.","translation":"我们可以设想一个未来：对于能在自足数字环境中创造价值的任务，agent 群将比其他方式更快完成工作。","attribution":"Aaron Levie","url":"https://x.com/levie/status/2120385739342897469"}],"detail":{"sources":[{"sourceId":"x:2120385739342897469","blocks":[{"type":"paragraph","sentences":[{"id":"nov12-21","text":"Aaron Levie 认为 agent 群有潜力再次提高 AI 产出，并可能拉开采用这一工作方式与未采用团队之间的差距。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120385739342897469","quote":"Agent swarms have the potential to drive yet another leap in output from AI. The impact will be a clear separation between teams that adopt this pattern of work and those that don’t. "}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]},{"type":"paragraph","sentences":[{"id":"nov12-22","text":"他把演进分成三个阶段：聊天让响应更快，却仍受人的交互节奏约束；agent 可以独立完成任务，把数小时或数天的工作缩短；agent 群则围绕项目目标寻找完成路径，他认为其生产率增幅没有内在上限。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120385739342897469","quote":"The progression has roughly been: chat gave us quick turn AI responses that let us work a bit faster, but we were still rate limited by our interactions; then agents that can go off and complete entire tasks for us, accelerating hours or days of work into minutes; to now swarms of agents that are goal seeking and will find any route to the successful completion of a project, where there’s no inherent limit to the productivity gains. "}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]},{"type":"paragraph","sentences":[{"id":"nov12-23","text":"他设想的适用前提是价值能够在自足的数字环境中创造，尤其是产出受研究量、软件操作决策量、数据处理量，以及代码或类似产物生成量限制的任务。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120385739342897469","quote":"We can imagine a future where, for any task in which value can be created within a self-contained digital environment, swarms will be able to complete the work faster than any other approach.\n\nEssentially any area where value creation is currently bound by the amount of research you can do, the amount of decisions made with a set of software tools, the amount of data processed or consumed, and the amount of code (or code adjacent) that can be generated. "}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]},{"type":"paragraph","sentences":[{"id":"nov12-24","text":"他列举的领域包括游戏开发、编程、交易、生命科学研究、IT 自动化、网络安全、数学突破和动画；这些是其看好的方向，并非文中已验证的落地结果。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120385739342897469","quote":"This means swarms will play a big role in game development, coding, trading, life sciences research, IT automation, cyber, math breakthroughs, animation, and plenty of other areas of work that have these characteristics. "}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]},{"type":"paragraph","sentences":[{"id":"nov12-25","text":"相应机会既包括 agent 的执行框架、应用产品和基础设施，也包括把实际工作接入这种组织方式；他预计会出现新的前线部署工程（FDE）工作。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120385739342897469","quote":"There’s a lot of opportunity to build the harnesses, applied AI products, and infrastructure for how these agents operate. And most importantly there’s a ton of opportunity for those that can wire up work in this way. It’s going to be an entire new field of FDE work available."}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]}],"coverageReview":{"details":"保留聊天、单agent、agent群的演进，数字环境前提、四类瓶颈、八个领域与FDE机会。","limitations":"全篇是作者预测；不把生产率无内在上限或行业应用写成实测结果，引用帖正文缺失。","omissions":"省去重复强调机会的修辞，不猜测所引用帖的产品与表现。"}}],"editorial":[{"id":"nov12-27","text":"这里值得区分两层机会：制造 agent 工具，以及把具体业务组织成可由 agent 群执行的工作；作者同时看好两者，尚未提供收益验证。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2120385739342897469","quote":"Agent swarms have the potential to drive yet another leap in output from AI. The impact will be a clear separation between teams that adopt this pattern of work and those that don’t. \n\nThe progression has roughly been: chat gave us quick turn AI responses that let us work a bit faster, but we were still rate limited by our interactions; then agents that can go off and complete entire tasks for us, accelerating hours or days of work into minutes; to now swarms of agents that are goal seeking and will find any route to the successful completion of a project, where there’s no inherent limit to the productivity gains. \n\nWe can imagine a future where, for any task in which value can be created within a self-contained digital environment, swarms will be able to complete the work faster than any other approach.\n\nEssentially any area where value creation is currently bound by the amount of research you can do, the amount of decisions made with a set of software tools, the amount of data processed or consumed, and the amount of code (or code adjacent) that can be generated. \n\nThis means swarms will play a big role in game development, coding, trading, life sciences research, IT automation, cyber, math breakthroughs, animation, and plenty of other areas of work that have these characteristics. \n\nThere’s a lot of opportunity to build the harnesses, applied AI products, and infrastructure for how these agents operate. And most importantly there’s a ton of opportunity for those that can wire up work in this way. It’s going to be an entire new field of FDE work available."}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]}},{"tag":"实践","title":"Guillermo Rauch：agent 时代未必需要统一编程语言","body":"Guillermo Rauch 肯定 Rust，同时预期 agent 会推动专用语言与按场景使用底层语言。","claimType":"single_source","sourcePerspective":"Guillermo Rauch","titleReview":{"id":"nov12-31","text":"Guillermo Rauch：agent 时代未必需要统一编程语言","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120337388178379178","quote":"Rust is a superb language and ecosystem, especially given it was invented pre agentic coding.\n\nWith agents, new languages will blossom, even purpose-built ones for specific usecases, and discretionary C or even LLVM IR, assembly…\n\nAI is fluid. No more one-size-fits-all. https://t.co/YTwRelXWCW"}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"},"evidence":[{"sourceId":"x:2120337388178379178","quote":"Rust is a superb language and ecosystem, especially given it was invented pre agentic coding.","translation":"Rust 是出色的语言和生态，尤其考虑到它诞生于 agent 编程之前。","attribution":"Guillermo Rauch","url":"https://x.com/rauchg/status/2120337388178379178"}],"detail":{"sources":[{"sourceId":"x:2120337388178379178","blocks":[{"type":"paragraph","sentences":[{"id":"nov12-28","text":"Guillermo Rauch 首先肯定 Rust 的语言与生态，并强调它诞生于 agent 编程之前。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120337388178379178","quote":"Rust is a superb language and ecosystem, especially given it was invented pre agentic coding."}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]},{"type":"paragraph","sentences":[{"id":"nov12-29","text":"他预期 agent 会促成更多新语言，包括面向具体用途的专用语言，也可能按需采用 C、LLVM IR 或汇编。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120337388178379178","quote":"With agents, new languages will blossom, even purpose-built ones for specific usecases, and discretionary C or even LLVM IR, assembly…"}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]},{"type":"paragraph","sentences":[{"id":"nov12-30","text":"他的立场是 AI 具有灵活性，不再需要一套语言适用于所有场景。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120337388178379178","quote":"AI is fluid. No more one-size-fits-all."}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]}],"coverageReview":{"details":"保留对Rust的肯定，以及专用语言、C、LLVM IR、汇编的完整列举。","limitations":"新语言繁荣属于预测；没有基准、迁移方案或引用帖全文。","omissions":"仅去掉短链接，不补写引用帖内容。"}}],"editorial":[{"id":"nov12-32","text":"这是一种按任务选择语言的判断，而非放弃 Rust 的建议；原帖没有提供迁移成本或性能对比。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2120337388178379178","quote":"Rust is a superb language and ecosystem, especially given it was invented pre agentic coding.\n\nWith agents, new languages will blossom, even purpose-built ones for specific usecases, and discretionary C or even LLVM IR, assembly…\n\nAI is fluid. No more one-size-fits-all. https://t.co/YTwRelXWCW"}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]}}],"matters":[{"kind":"产品","title":"Vercel 公布 Security Review 首周处理量","detail":"Guillermo Rauch 称，上线不足一周识别出 57,897 个漏洞，其中 6,029 个为严重或高危，14,665 个已由 Agent 修补；任意仓库均可启用，不限部署平台。这是厂商自报数据，帖中没有独立验证或修补正确率。","sourceId":"x:2120188488628977819","url":"https://x.com/rauchg/status/2120188488628977819"},{"kind":"产品","title":"听写快捷键兼容 Apple F5 专用按键","detail":"Nan Yu 介绍，听写功能可映射 Apple 听写键这一 F5 特殊变体，并支持按住说话、双击与单击快捷方式；他特别强调这些交互边界的处理。","sourceId":"x:2120203450223104012","url":"https://x.com/thenanyu/status/2120203450223104012","images":[{"src":"assets/digest/2026-11-12/5820e811c91f8688816a9c9a.jpg","originalUrl":"https://pbs.twimg.com/media/HWx5jbPa0AAich_.jpg","sourceUrl":"https://x.com/thenanyu/status/2120203450223104012","attribution":"Nan Yu","sha256":"8ba420a379680b35fc1b3b959ec1d58f629f9cfca65c9ee774465810b0dd45ed","width":1070,"height":400,"mediaId":"5820e811c91f8688816a9c9a","alt":"听写设置界面中，红圈标出映射到 Apple F5 听写键的单击快捷方式。"}]},{"kind":"产品","title":"Claude 交互式连接器支持在对话旁操作完整工具","detail":"Claude 宣布可在对话旁打开 Adobe、Atlassian 和 Box 的完整工具，用户可自行修改，也可让 Claude 一起操作；功能正向网页端和桌面端推出。","sourceId":"x:2120206375137484875","url":"https://x.com/claudeai/status/2120206375137484875"},{"kind":"产品","title":"Claude Data 面向付费计划正式开放","detail":"Claude Data（原 Dashboards）现面向付费计划正式开放；除仪表盘外，还可根据指标起草数据故事和带解说的视频，由用户审阅后分享。认证查询与实时分享仍为 beta。","sourceId":"x:2120206372478566799","url":"https://x.com/claudeai/status/2120206372478566799","images":[{"src":"assets/digest/2026-11-12/3f1f037c77678a77c5a2df0d.jpg","originalUrl":"https://pbs.twimg.com/media/HWx5bmVWUAInsnV.jpg","sourceUrl":"https://x.com/claudeai/status/2120206372478566799","attribution":"Claude","sha256":"31c24b955ff53c3561c2f18af1c3b53573087cc77aae8cdcf2726e731a32c80a","width":1200,"height":675,"mediaId":"3f1f037c77678a77c5a2df0d","alt":"Claude Data 的预订数据仪表盘与设计面板，展示数据故事、短视频和可视化分析选项。"}]},{"kind":"实践","title":"先分享进行中的作品，再判断是否值得完成","detail":"Zara Zhang 建议不要等作品完成或完美才分享；公开进行中的版本，有时能帮助判断是否值得继续完成。这是创作与受众建设建议，不是效果保证。","sourceId":"x:2120041030951297033","url":"https://x.com/zarazhangrui/status/2120041030951297033"}],"articles":{"blogs":[],"podcasts":[{"title":"Resend 的 agent 之路：从邮件体验到接口、分发与基础设施","sourceTitle":"Designing for Agents — Zeno Rocha, Resend","sourceId":"01a1c6f7-44d3-7eaf-95ea-cb9de51baff2","sourceUrl":"https://www.youtube.com/@LatentSpacePod","sourceName":"Latent Space","author":"Zeno Rocha","publishedAt":"2026-11-10T20:06:15.000Z","linkScope":"channel","sourceTextSha256":"6ab0be5f3204890b2b7d5939543460525d1a22d33a3b81fb59fa14fda2c3d630","blocks":[{"type":"paragraph","text":"在 Latent Space 这期访谈中，Resend 创始人 Zeno Rocha 从开发者邮件工具谈到 agent 入口、分发与公司经营。他原本做前端，并无邮件基础设施背景；创业出发点是，已有产品更多照顾营销人员，开发者仍缺少被认真服务的体验。他希望把邮件做成类似 Stripe 的开发者基础设施。"},{"type":"paragraph","text":"Rocha 自述，录制时 Resend 服务约 430 万用户、超过 12 万付费客户，既有独立开发者，也有 Warner Brothers、HBO 等客户。这些是访谈中的公司口径。主持人因自己的 agent 即使已有其他邮件服务仍推荐 Resend 而追问：产品如何进入模型的选择范围？回答先从邮件本身的复杂性展开。"},{"type":"heading","text":"减少注册阻力，把投递与防滥用留给平台"},{"type":"paragraph","text":"邮件不是增加机器就能扩大吞吐：Gmail、Outlook、Yahoo 各有规则。Rocha 以向 10 万人发信为例，解释平台需要排队、分批、控制不同收件服务商的速度，并观察最初一批收件人的互动；优先发送给活跃受众，是他提到的做法之一。IP 历史、地址池与持续发送模式也要管理。"},{"type":"paragraph","text":"他不愿让正常用户先填表、等待人工批准，因此选择默认信任，平台承担识别风险的负担，再依据退信、投诉和收件服务商反馈快速阻断异常，沟通判断是误用还是滥用。他谈到一次约两万个域名的滥用尝试，用来说明注册时间、相似域名和突发发送等信号为何重要；这不是零门槛就没有风险。"},{"type":"paragraph","text":"教育也被放进产品：发送前检查链接与拼写、根据发送模式提供提示，并从 HTML 自动生成纯文本版本。Rocha 认为纯文本有助于投递，但没有给出量化对照；打开率还会被隐私保护和预读取影响，点击追踪则涉及链接域名与发件域名的一致性，以及共享追踪域名被其他客户牵连的风险。"},{"type":"heading","text":"支持不能只靠不断加人"},{"type":"paragraph","text":"支持最初由创始人承担，随后经历招人答疑、培养领域能力，再到主动消除重复问题。他们曾要求答复工单必须附知识库或文档链接：没有文档就先写，单次回答更慢，却能留下供后续复用的内容。用户从约百万增长到数百万后，他仍希望保留免费层，因此不能仅靠线性增加支持人员。"},{"type":"paragraph","text":"新一批通过 Lovable、Bolt、v0 等工具建站的用户，常连 DNS 出错后如何排查都不清楚。团队因此接入 Domain Connect，让用户通过类似授权登录的流程配置域名，减少手工粘贴记录；但让域名供应商接入并不简单，涉及维护、收费和长期联络。投递专家及其行业关系同样是基础设施的一部分。"},{"type":"heading","text":"先解决模板，再深入基础设施"},{"type":"paragraph","text":"React Email 并非与 Resend 无关的偶然副产品：开发 Resend 时，用户研究反复提到邮件模板的表格布局、内联 CSS 和 Outlook 兼容问题。团队把 React/JSX 用作模板工具，借助 TypeScript 和设计 token 改善开发体验，而不是在邮件里运行 JavaScript。他们还为竞品发送平台撰写接入文档，先提供开放工具，再承接发送需求。"},{"type":"paragraph","text":"Rocha 说，Resend SDK 的 npm 下载量已经超过 SendGrid 并达到两倍以上，同时明确承认这不等于邮件发送量超过对方：后者仍有更大的企业发送规模。他早期借助 Amazon SES，集中完善 SDK 和开发文档；但实际服务还需要 SNS 事件、CloudWatch 日志、SQS 队列和自建 webhook，不能仅看发送单价。"},{"type":"paragraph","text":"公司正在进一步自建底层发送设施，以掌握 IP 池、服务商节流和更多可观测数据。访谈时项目仍在推进，不能当成全部上线。他也提到发送路径已从 JavaScript 转向 Go，并围绕尾部延迟和吞吐做优化；目标是让用户更清楚邮件离开平台后发生了什么。"},{"type":"heading","text":"让产品能从不同入口使用"},{"type":"paragraph","text":"谈到 MCP 与 CLI，Rocha 不选择只押一种入口，而是希望产品不受固定界面约束：API 优先，让用户从自己工作的地方调用。按其自述，MCP 调用持续增长，所提及的一个八月最终约有 120 万次调用；这属于访谈回顾的使用情况，并非今天的指标。"},{"type":"paragraph","text":"最早的本地 MCP 由投资方工程师制作，后转入公司维护。远程版本却要求重做 OAuth、角色权限与资源访问控制，再补齐可观测性和官方目录分发。他以自己从 Plausible 转向 PostHog 为例，解释为什么是否由厂商正式维护、能否在常用客户端直接连接，会影响他的采购判断。"},{"type":"paragraph","text":"工具数量已从最初约二十个甚至更少增至八十多个，但他仍会展开调用记录检查响应是否过大。真正困难的是从覆盖九成仪表盘能力走到全部覆盖：用量、账单、团队邀请、账户创建和删除都要决定如何暴露。数量增长是其产品实践，不能据此认定工具越多越好；主持人也提出了只提供少量通用工具的不同做法。"},{"type":"paragraph","text":"CLI、各语言 SDK 与可视化编辑器因此同时存在。招聘页甚至允许通过 CLI 或 API 申请，他把完成安装和授权流程视为一种投入信号。对于少量语言用户，他仍愿意维护原生体验良好的 SDK；而营销团队可在多人编辑器中维护模板、让代码仅调用模板 ID，开发团队也可选择把模板放进版本控制。"},{"type":"heading","text":"从发送邮件走向 agent 收件箱"},{"type":"paragraph","text":"团队还在探索可通过 API 批量创建收件箱，并提供已读、未读、星标、标签等能力；访谈中这是将发布的方向，不是已普遍开放的功能。他随后回到投递信誉：可用不同子域区分交易邮件与营销邮件，避免把所有发送流混在一起；相似的新域名却可能更像钓鱼行为，不能简单认定换域名就会改善投递。"},{"type":"heading","text":"让模型读懂产品，比追逐排名技巧更具体"},{"type":"paragraph","text":"AEO 的起点仍是细致文档：不只写语言层面的接入，还覆盖 Django 等具体框架；网站大量使用问答形式，给文档和营销页提供 llms.txt 与 Markdown 版本。主持人对这些措施是否提高分发效果保持怀疑，Rocha 给出的更具体例子是定价准确性。"},{"type":"paragraph","text":"他发现模型比较发送 120 万封邮件的费用时，把 Resend 算错，并称定价不透明；网页中的 JavaScript 计算器不容易被直接读取。补充可读的 Markdown 定价内容后，几天后再次提问得到了正确结果。这是一次自述观察，并不是严密的增长实验；HTML 与 Markdown 还带来双份维护问题。采用量图表也配上文字数据，出于同样考虑。"},{"type":"paragraph","text":"迁移页面除了说明，还提供代码转换器；他认为竞品直接做比较页面，在推荐中可能更占优势。对于新工具被推荐、近期信息与外部讨论的作用，他谈的是自己的观察；团队尝试多种 AEO 追踪产品，却仍缺少确定的行动答案。主持人则介绍把分析工具、代码和实验记录交给 agent，在人工批准实验后观察结果的做法，双方没有给出保证有效的通用公式。"},{"type":"heading","text":"企业经营与个人取舍"},{"type":"paragraph","text":"Resend 正逐步建立企业销售，访谈时只有一名客户经理，Rocha 不希望一次扩张破坏远程团队文化。他把企业版看成不同的产品：不能只在价目表上增加 SSO、SCIM 和审计日志，就认为已满足企业需求。营销邮件按联系人数计费也面临快速增长客户的挑战，而批量营销发送涉及动态分批和节流，与交易邮件的处理不同。"},{"type":"paragraph","text":"最后他谈到参加 YC 时已是父亲，并因迎接第二个孩子而更多待在巴西。有人劝他减少对设计的投入，他仍选择做自己愿意使用、有明确审美的产品；对于家庭，他也宁愿公司规模小一些而与女儿亲近。这些是他自己的优先级，并非没有压力或适用于所有创业者的答案。"},{"type":"paragraph","text":"访谈收尾还区分了在既有类别中领先与创造新类别：主持人认为 Resend 已形成鲜明位置，但是否定义了一个让人立即理解的新类别，仍是开放问题。整段经历呈现的是从开发者体验进入邮件行业，再补齐基础设施、agent 接口和公司能力的过程，而不是单靠某个 AEO 技巧取得增长。"}]}]},"quality":{"collected":33,"collectedTweets":32,"used":9,"usedTweets":8,"uniqueAuthors":7,"imageCount":2,"claimAudit":{"reviewMode":"editorial review plus structural checks; not automated proof of meaning","claimsReviewed":32,"warnings":[]},"status":"degraded","warnings":["Quoted-post context missing: x:2120385739342897469","Quoted-post context missing: x:2120337388178379178","Media unverified: podcasts:01a1c6f7-44d3-7eaf-95ea-cb9de51baff2 (feed_has_no_media_or_supported_post_locator)"]},"contentSchemaVersion":2,"sourceSnapshotSha256":"31c4ca8dce714275a4e1307585c97a97c9ecb4adfee59b8b5d1ac7524821cf76","selection":{"sources":[{"sourceId":"x:2120376333142569316","decision":"excluded","reason":"只有引擎主题串链接，未采到被引内容。"},{"sourceId":"x:2120372817720197357","decision":"excluded","reason":"大会预告及禁发信息，没有可展开的技术事实。"},{"sourceId":"x:2120260228902264872","decision":"excluded","reason":"播客推广信息已由完整文字稿覆盖。"},{"sourceId":"x:2120186249281778135","decision":"excluded","reason":"Carbon可用范围短消息，优先采用含具体测试与限制的试用长帖。"},{"sourceId":"x:2120267268517249036","decision":"excluded","reason":"面向小企业的提问，缺少实际方案。"},{"sourceId":"x:2120266880963473789","decision":"excluded","reason":"合作感叹与链接，具体连接器信息采用官方原帖。"},{"sourceId":"x:2120370522622181809","decision":"excluded","reason":"AI游戏审美立场简短，缺少案例，被引帖未采到。"},{"sourceId":"x:2120326994579931419","decision":"excluded","reason":"游戏更新只有链接，无正文细节。"},{"sourceId":"x:2120320377163501817","decision":"excluded","reason":"疾病研究愿景，未给出研究进展或方法。"},{"sourceId":"x:2120203911265218969","decision":"excluded","reason":"价格类回复缺少上下文，无法确定比较对象。"},{"sourceId":"x:2120203450223104012","decision":"used","reason":"采用该原帖具体实践、测试或产品信息；详见对应洞察/议题。"},{"sourceId":"x:2120223476279869875","decision":" l sorts of customers like, uh, Warner Brothers, HBO. There was a Japanese gang that recently came."]}],"blogs":[],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @cognition - @temporalio - @aidotengineer - @latentspacepod","tweets":[{"text":"this is my engines thread","createdAt":"2026-11-11T04:41:27.000Z","url":"https://x.com/swyx/status/2120376333142569316","likes":5,"retweets":0,"replies":1},{"text":"i had a preview of his keynote and you guys don’t know what youre in for in thursday. literally had to agree to embargo to get this talk on board (it is not the full story) tune in to the aie live stream 9am-6pm tmr and thursday!!","createdAt":"2026-11-11T04:27:29.000Z","url":"https://x.com/swyx/status/2120372817720197357","likes":71,"retweets":2,"replies":23},{"text":"I finally asked @zenorocha, the CEO of AEO, why tf my agents keep choosing Resend even when I don't want them to","createdAt":"2026-11-10T21:00:05.000Z","url":"https://x.com/swyx/status/2120260228902264872","likes":83,"retweets":4,"replies":69}]},{"name":"Josh Woodward","handle":"joshwoodward","bio":"VP, @Google @GoogleLabs @GeminiApp @GoogleAIStudio","tweets":[{"text":"Right now, Gemini 4 Carbon is in the @GeminiApp for Ultra subscribers worldwide","createdAt":"2026-11-10T16:06:07.000Z","url":"https://x.com/joshwoodward/status/2120186249281778135","likes":689,"retweets":30,"replies":107}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"How many of you have a small business?","createdAt":"2026-11-10T21:28:04.000Z","url":"https://x.com/thsottiaux/status/2120267268517249036","likes":3252,"retweets":81,"replies":866},{"text":"Labs innovating together ftw","createdAt":"2026-11-10T21:26:31.000Z","url":"https://x.com/thsottiaux/status/2120266880963473789","likes":3892,"retweets":109,"replies":386}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"Agree with Kartik. Game developers and gamers hating on (tasteful) use of AI is idiotic. There’s a huge difference between someone using AI to pump out slop and someone using it as another tool to make a great game.","createdAt":"2026-11-11T04:18:21.000Z","url":"https://x.com/petergyang/status/2120370522622181809","likes":27,"retweets":1,"replies":10},{"text":"Here's the updated game btw","createdAt":"2026-11-11T01:25:23.000Z","url":"https://x.com/petergyang/status/2120326994579931419","likes":5,"retweets":0,"replies":1},{"text":"I don't really care about the stock price but if @AnthropicAI can accelerate cures of all these terrible diseases it'll be one of the most impactful companies in history. I'm actually really glad Dario is focused on this vs. winning on viral shorts and TikTok memes.","createdAt":"2026-11-11T00:59:06.000Z","url":"https://x.com/petergyang/status/2120320377163501817","likes":437,"retweets":10,"replies":28}]},{"name":"Nan Yu","handle":"thenanyu","bio":"product, codex @openai. prev head of product @linear","tweets":[{"text":"@bamitsmanas That's like 30 coffees, or a 1-2 months of ChatGPT pro","createdAt":"2026-11-10T17:16:18.000Z","url":"https://x.com/thenanyu/status/2120203911265218969","likes":5,"retweets":0,"replies":0},{"text":"One of the lovely details about this, which few other dictation apps get right, is you're able to map the Apple dictation key (special variant of F5) We also support push to talk, double tap and single tap shortcuts. kudos to @bamitsmanas for getting all the edges right on this","createdAt":"2026-11-10T17:14:28.000Z","url":"https://x.com/thenanyu/status/2120203450223104012","likes":16,"retweets":0,"replies":1}]},{"name":"Thariq","handle":"trq212","bio":"playing WoW forever, formerly Claude Code @anthropicai","tweets":[{"text":"we need fewer one shot demos and more tools that show how you can collaborate with models to bring your vision to life","createdAt":"2026-11-10T18:34:03.000Z","url":"https://x.com/trq212/status/2120223476279869875","likes":1590,"retweets":68,"replies":125}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Rust is a superb language and ecosystem, especially given it was invented pre agentic coding. With agents, new languages will blossom, even purpose-built ones for specific usecases, and discretionary C or even LLVM IR, assembly… AI is fluid. No more one-size-fits-all.","createdAt":"2026-11-11T02:06:41.000Z","url":"https://x.com/rauchg/status/2120337388178379178","likes":518,"retweets":12,"replies":98},{"text":"Vercel Security Review, less than 1 week since launch: ✓ 𝟱𝟳,𝟴𝟵𝟳 vulnerabilities identified ✓ 𝟲,𝟬𝟮𝟵 critical or high ✓ 𝟭𝟰,𝟲𝟲𝟱 already patched by Agent I'm shocked at ① the number of critical vulnerabilities that would go unnoticed and ② the ease at which the agent automatically fixes them. You can turn it on for any repo, no matter where you deploy to.","createdAt":"2026-11-10T16:15:01.000Z","url":"https://x.com/rauchg/status/2120188488628977819","likes":446,"retweets":24,"replies":127}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Agent swarms have the potential to drive yet another leap in output from AI. The impact will be a clear separation between teams that adopt this pattern of work and those that don’t. The progression has roughly been: chat gave us quick turn AI responses that let us work a bit faster, but we were still rate limited by our interactions; then agents that can go off and complete entire tasks for us, accelerating hours or days of work into minutes; to now swarms of agents that are goal seeking and will find any route to the successful completion of a project, where there’s no inherent limit to the productivity gains. We can imagine a future where, for any task in which value can be created withi…","createdAt":"2026-11-11T05:18:49.000Z","url":"https://x.com/levie/status/2120385739342897469","likes":72,"retweets":5,"replies":26},{"text":"Agents are going to work with enterprise files 100X more than people do today. This is why we're excited to partner with Anthropic to bring full read/write interoperability to Box content via Claude. Now you can have an agent not only pull up content to work with in a workflow, but also write back file updates to Box and view them directly inside of Claude, all via MCP. You can create, edit, and update contracts, presentations, strategy docs, and any other content. When we started Box we couldn't have imagined all the ways that we'd be working with our unstructured data in the future, but it's clear that agents and people will be producing vastly more artifacts than we imagined. We're build…","createdAt":"2026-11-10T21:04:48.000Z","url":"https://x.com/levie/status/2120261416733036905","likes":166,"retweets":21,"replies":66}]},{"name":"Ryo Lu","handle":"ryolu_","bio":"Designed @Cursor_ai, @NotionHQ, @Stripe, built startups. I make a world where anyone can make software. Aspiring k-pop idol.","tweets":[{"text":"we build software not just to optimize, complete tasks or impose our own constraints – but to build a world where we let people in, aspire to things they couldn’t do before, to create, and find ourselves – just like filmmakers and musicians a great read:","createdAt":"2026-11-11T04:57:17.000Z","url":"https://x.com/ryolu_/status/2120380317429350654","likes":91,"retweets":6,"replies":7},{"text":"working together with other humans is where the magic happens, not each of us running our own army of agents in silos glad to see this come alive 💛","createdAt":"2026-11-11T02:07:54.000Z","url":"https://x.com/ryolu_/status/2120337691661443081","likes":314,"retweets":11,"replies":12},{"text":"read or watch on my journal – in english, chinese or japanese","createdAt":"2026-11-10T09:44:00.000Z","url":"https://x.com/ryolu_/status/2120090087715426614","likes":8,"retweets":0,"replies":1}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Harvard’17. Instagram: GitHub:","tweets":[{"text":"If users don't come back to your product, - 20% of the time it's because they don't like your product - 80% of the time it's because they forgot your product even exists","createdAt":"2026-11-10T19:20:15.000Z","url":"https://x.com/zarazhangrui/status/2120235104194932841","likes":119,"retweets":5,"replies":19},{"text":"Step 1 of sharing your work/building an audience: Don't wait until it's done or perfect. Share a work in progress. Sometimes that's how you figure out if it's even worth finishing.","createdAt":"2026-11-10T06:29:04.000Z","url":"https://x.com/zarazhangrui/status/2120041030951297033","likes":266,"retweets":22,"replies":41}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"MLK Jr. :\"The ultimate measure of a man is not where he stands in moments of comfort and convenience, but where he stands at times of challenge and controversy.\" This post-mortem is a must read for every infra provider and proud of the @Railway team for the transparency 🚂","createdAt":"2026-11-11T05:23:45.000Z","url":"https://x.com/nikunj/status/2120386979389157530","likes":9,"retweets":0,"replies":1},{"text":"Mic drop Gulp Wow","createdAt":"2026-11-10T21:02:22.000Z","url":"https://x.com/nikunj/status/2120260803295363388","likes":41,"retweets":0,"replies":4},{"text":"Fable, make me a one shot banger video for Wrap2026..","createdAt":"2026-11-10T14:45:00.000Z","url":"https://x.com/nikunj/status/2120165833993322497","likes":6,"retweets":0,"replies":1}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"\"When the company ran diagnostics on  of parallel work.\n\nTo actually seize this intelligence, you need cloud sandboxes. Full stop. The model can delegate and orchestrate far more than a single computer can handle."},{"sourceId":"x:2119878364794372162","quote":"Install Vercel CLI, setup the Plugin and tell the agent to use /𝚘𝚏𝚏𝚕𝚘𝚊𝚍-𝚝𝚘-𝚜𝚊𝚗𝚍𝚋𝚘𝚡 skill. It'll provision and de-allocate cloud sandboxes as needed. You don't need a \"multi-agent remote harness ralph orchestrator\""},{"sourceId":"x:2119869228207546638","quote":"Give it a big job and leave it running overnight or over a weekend. But tell it what “done” means: Mike found it could finish the build, then spend another day or two testing. Set the goal, the budget, and how much checking you need before walking away."},{"sourceId":"x:2119869228207546638","quote":"It’s slow and burns through tokens. Our early-access usage was free, and these projects would have been expensive at API rates."},{"sourceId":"x:2119869228207546638","quote":"It’s 20% cheaper than Fable 5.1, but for everyday writing, emails, or quick back-and-forth coding, I’d usually reach for something else."}],"reviewNote":"编辑基于上方来源作有限归纳，不作为作者逐字引语；未声称减少交接损耗、消除误解或保证效率等原文未验证的因果效果。"}]},"titleReview":{"id":"claim-33","text":"两位作者的试用观察：并行环境、创作案例与长任务限制","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2119878364794372162","quote":"Your bottleneck is now ① your ambition and ② your parallel computing power."},{"sourceId":"x:2119869228207546638","quote":"The catch: It’s slow and burns through tokens."}],"reviewNote":"按采集原文逐句审阅；保留作者观点及适用范围，未添加因果效果。"}}],"matters":[{"kind":"动态","title":"Dots 扩展多机器控制","detail":"作者宣布 Dots 除默认提供的云电脑外，还可控制多台机器。采集帖未说明具体连接方式与权限配置。","url":"https://x.com/thsottiaux/status/2120021043876106429","sourceId":"x:2120021043876106429"},{"kind":"动态","title":"Claude Fable 5.2 向付费计划开放","detail":"公告称 Fable 5.2 已面向全部付费计划提供，开展有益网络安全或生物医学研究的组织可申请 Mythos 5.2 访问。","url":"https://x.com/claudeai/status/2119899492778398163","sourceId":"x:2119899492778398163"},{"kind":"动态","title":"历史手稿变成交互探索","detail":"作者称向 Fable 5.2 提供达芬奇笔记 PDF 后，模型将其中发明制作成可交互内容，展示了教育内容的一种表达方式。","url":"https://x.com/alexalbert__/status/2119916954337349737","sourceId":"x:2119916954337349737"},{"kind":"动态","title":"SMFL 团队将出版企业 AI 开发书籍","detail":"Amjad Masad 介绍日本 SMFL 数字创新团队的 Enterprise Vibe Coding，称计划于 11 月 27 日发行，主题是 AI 如何改变企业软件开发。","url":"https://x.com/amasad/status/2119909166764667292","sourceId":"x:2119909166764667292","images":[{"id":"bbd5ff28c19a3e2c929488b4","sourceId":"x:2119909166764667292","originalUrl":"https://pbs.twimg.com/media/HWttzgwbEAAPpdq.jpg","sourceUrl":"https://x.com/amasad/status/2119909166764667292","attribution":"Amjad Masad","method":"official_syndication","suggestedAlt":"","src":"assets/digest/2026-11-11/bbd5ff28c19a3e2c929488b4.jpg","sha256":"d13164443066f4bff7f651c9bd2bbd5314f97b6ae68810ead5dc727607664b83","bytes":108878,"checkedAt":"2026-11-11T03:57:52.298Z","cacheKey":"bbd5ff28c19a3e2c929488b4.jpg","mediaId":"bbd5ff28c19a3e2c929488b4","alt":"Amjad Masad 原帖中的日文 Enterprise Vibe Coding 书籍商品页截图，展示书封与作者团队。"}]}],"articles":{"blogs":[],"podcasts":[{"title":"Handshake AI：专家经验怎样变成训练任务与评测","sourceName":"Latent Space","sourceTitle":"What Frontier Labs Buy: A Data Deep Dive with Handshake AI — Garrett Lord &amp; Team","sourceId":"01a1c0f3-0e12-72e9-b44b-8ca8a4fe611d","sourceUrl":"https://www.youtube.com/@LatentSpacePod","publishedAt":"2026-11-09T16:41:48.000Z","linkScope":"channel","sourceTextSha256":"45fcf518af355d0cc206ae8bad36ba0a78bc0496ae51b005b76939ff847379ca","blocks":[{"type":"paragraph","text":"Handshake AI 的 Garrett Lord 与团队在 Latent Space 讨论前沿实验室购买的数据。他们把重点放在具体任务、专家判断和评估环境上：模型要完成实际工作，训练材料就需要表达这项工作怎样才算完成。"},{"type":"heading","text":"一条任务背后有大量专家工作"},{"type":"paragraph","text":"以财务建模为例，任务设计者需要提供业务背景、材料和评价标准。评分规则可能包含很多检查项，权重要反映真实的重要程度。规则太模糊，模型可能绕过目标获得分数；过于具体，又可能排除同样有效的答案。"},{"type":"paragraph","text":"团队称，一条数据的制作可能持续数天，还需要覆盖多个环境和任务。他们会在内部训练模型，观察数据是否帮助能力提高，再反过来调整材料和奖励信号。"},{"type":"heading","text":"公开资料没有覆盖全部实验经验"},{"type":"paragraph","text":"生命科学部分讨论了模型理解实验图像的困难。论文常展示汇总结果或少量代表性样本，而科学家日常处理的数据更加丰富。大量判断还来自长期实验经验，很难从论文文字完整获得。"},{"type":"paragraph","text":"团队介绍通过专家网络与实验合作获取材料，并在训练中尝试提示、选择题等较容易的形式，逐步接近真实任务。这说明做出有用数据还包括安排学习难度，单纯把最难的问题交给训练过程未必有效。"},{"type":"heading","text":"总体得分会掩盖关键错误"},{"type":"paragraph","text":"金融案例把讨论转向交付质量。某个税务处理或现金流错误可能持续影响后续结果，即使其他检查项完成得很好，专业人员仍然难以直接采用成品。"},{"type":"paragraph","text":"因此，团队强调对关键项设置合适权重，以及让人能看到模型做了什么、在哪些地方需要复核。模拟银行任务的评测只是一步，完整工作环境还包含更多交互、制度与约束。"},{"type":"heading","text":"行为评估需要多种专业视角"},{"type":"paragraph","text":"随后讨论安全评测时，团队将关注点扩展到多轮互动和高风险行为。他们介绍结合不同群体与专业人员的视角构造任务，避免只有一种狭窄定义决定什么算好结果。"},{"type":"paragraph","text":"一个贷款流程案例展示了看似完成任务、却在过程中作出有问题决策的风险。如果审核者只能看到最终文件，就需要重新走过许多步骤才能发现问题。自动化要节省人工，过程的可检查性就必须跟上。"},{"type":"heading","text":"把评测连接到真实采用"},{"type":"paragraph","text":"访谈最后回到实验室与企业的需求。团队认为，新的评测可以揭示过去没有测到的能力缺口，但企业是否信任系统，仍要看它在实际工作中的表现。数据、训练、评估和使用反馈因此需要连续衔接，才能知道模型究竟改进了什么。"}]}]},"quality":{"collected":30,"collectedTweets":29,"used":9,"usedTweets":8,"uniqueAuthors":8,"imageCount":1,"claimAudit":{"reviewMode":"editorial review plus structural checks; not automated proof of meaning","claimsReviewed":36,"warnings":[]},"status":"degraded","warnings":["Quoted-post context missing: x:2119891138450755670","Quoted-post context missing: x:2119878364794372162","Media unverified: x:2119869228207546638 (budget_exhausted)","Media unverified: x:2119899492778398163 (budget_exhausted)","Media unverified: podcasts:01a1c0f3-0e12-72e9-b44b-8ca8a4fe611d (feed_has_no_media_or_supported_post_locator)","Media unverified: x:2120021043876106429 (budget_exhausted)"]},"contentSchemaVersion":2,"sourceSnapshotSha256":"e9475883155dd4965a2956cd504088290c8669bddb6ff1f834155d2722f0ca35","selection":{"sources":[{"sourceId":"x:2119990961459921395","decision":"excluded","reason":"Brief announcement or context-dependent post; insufficient standalone detail for this edition."},{"sourceId":"x:2119935240202539147","decision":"excluded","reason":"Overlaps the model-launch theme or falls outside the chosen product
