  <script>
    const DIGESTS = [{"date":"2026-08-28","dateLabel":"2026年08月28日","generatedAt":"2026-08-28T00:00:00+08:00","sourceGeneratedAt":"2026-08-27T09:24:09.711Z","stats":{"podcastEpisodes":1,"xBuilders":16,"totalTweets":32,"blogPosts":2},"highlights":[{"tag":"组织采用","title":"AI-first 在大公司里开始像管理制度，而不是自愿尝鲜","body":"这期播客最强的信号不是 CEO 公开喊口号，而是把 AI 使用拆成强制培训、周榜、奖励和固定交流机制。因果很直接：当管理层把 AI 明确成组织效率责任，扩散路径就不再依赖少数爱折腾的人，而会变成全员能力建设。对 builder 来说，下一阶段真正能卖进公司的，不只是模型效果，而是能被企业拿来训练、比较和推动 adoption 的工作方式。","evidence":[{"quote":"Using ChatGPT is not cheating.","attribution":"Will（Walleye CEO，播客《A $10B Hedge Fund’s AI Playbook (Best of the Pod)》）","url":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL"},{"quote":"From the very top, we are building a culture around AI.","attribution":"Will（Walleye CEO，播客《A $10B Hedge Fund’s AI Playbook (Best of the Pod)》）","url":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL"},{"quote":"we're gonna train mandatory every single person at the firm","attribution":"Will（Walleye CEO，播客《A $10B Hedge Fund’s AI Playbook (Best of the Pod)》）","url":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL"}]},{"tag":"企业上下文","title":"企业 agent 的主战场，正在从模型能力转向上下文接入","body":"Aaron Levie 讲的是企业内容和治理，Claude 两篇博客讲的是浏览器里那些没 connector 的内部系统。两边拼起来看，真正卡住企业 agent 的已经不是“有没有最强模型”，而是“能不能带着权限、安全和上下文进入那些非结构化内容与老系统”。一旦这层没打通，再强的模型也只能停在系统外围。","evidence":[{"quote":"The world’s most advanced superintelligence is only as useful as the underlying enterprise knowledge it has access to.","attribution":"Aaron Levie (@levie)","url":"https://x.com/levie/status/2092702955292230100"},{"quote":"internal dashboards, legacy systems, and vendor portals","attribution":"Anthropic《Claude in Chrome is generally available》","url":"https://claude.com/blog/claude-in-chrome-generally-available"}]},{"tag":"执行边界","title":"浏览器不再只是工具入口，而是 agent 权限边界本身","body":"Anthropic 这次没有把 browser use 做成单一功能，而是拆成你自己的浏览器和 Claude 自己的浏览器两种执行面。这个产品切分说明，Web 自动化的核心问题已经不是“能不能点网页”，而是“哪些身份、会话和密码该不该被 agent 继承”。谁能先把这条边界讲清并产品化，谁才更可能把浏览器 agent 变成常规能力，而不是高风险特权。","evidence":[{"quote":"Claude can now also take actions autonomously in the browser","attribution":"Anthropic《Claude in Chrome is generally available》","url":"https://claude.com/blog/claude-in-chrome-generally-available"},{"quote":"The built-in browser is separate from your own.","attribution":"Anthropic《Claude gets its own browser in Cowork》","url":"https://claude.com/blog/cowork-built-in-browser"},{"quote":"Claude never sees your tabs, bookmarks, or passwords.","attribution":"Anthropic《Claude gets its own browser in Cowork》","url":"https://claude.com/blog/cowork-built-in-browser"}]},{"tag":"安全自动化","title":"安全开始被做成 agent 可调用的操作层，而不只是审批层","body":"Rauch 这次强调的不是又一个安全面板，而是让 agent 能直接调用 security check CLI，并在 human-in-the-loop 或 cron 里持续运行。Claude in Chrome 则把每次浏览器动作前的 classifier 校验写进执行链路。两条信号合在一起，说明安全正在前移进 runtime，本身也被接口化。未来 agent 能不能被放权，取决于它能否在行动过程中持续证明自己没越界。","evidence":[{"quote":"you can call on agents to improve your security posture with human-in-the-loop, or run in crons","attribution":"Guillermo Rauch (@rauchg)","url":"https://x.com/rauchg/status/2092621371914482026"},{"quote":"A safety classifier validates each action before it’s performed","attribution":"Anthropic《Claude in Chrome is generally available》","url":"https://claude.com/blog/claude-in-chrome-generally-available"}]}],"matters":[{"kind":"Research","title":"DeepCogito 把 post-training 作为前沿竞争点公开亮相","detail":"Aditya Agarwal 转发的投资理由很具体：DeepCogito 是一家 post-training research lab，研究重心放在 large-scale reinforcement learning、recursive self-improvement 和 iterated distillation and amplification（IDA）。","context":"这条信息更像研究路线声明，而不是单次产品发布。","url":"https://x.com/adityaag/status/2092679288869019700"},{"kind":"Open Source","title":"Matt Turck 把 NVIDIA 与 Hugging Face 的组合定义成开源 AI 中心","detail":"他的判断非常明确：Nemotron 加上 Hugging Face 的落点，让开源 AI 的品牌、资源和分发进一步向这组生态集中。","context":"这是对生态重心迁移的主观看法，不是公司公告复述。","url":"https://x.com/mattturck/status/2092808287280329097"},{"kind":"Product","title":"Claude 给反馈提交流程补上了可委托入口","detail":"Thariq 说 Claude 新增了 SendFeedback tool，用户不必再手动输入 `/feedback` 和自己整理问题，可以让 Claude 代写并提交。","context":"这类小工具不直接改变模型能力，但会降低真实用户反馈回流的摩擦。","url":"https://x.com/trq212/status/2092696449616376140"},{"kind":"Infrastructure","title":"Vercel 在把全球 sandbox 调度默认交给 agent","detail":"Rauch 把多区域、failover、并发 sandboxes 和快速 vCPU ramp 直接表述成“global compute at your agents' fingertips”，说明这类运行时基础设施正被包装成 agent 默认能力。","context":"这不是终端产品功能，更像 agent infra 供应侧的能力上探。","url":"https://x.com/rauchg/status/2092735785460277627"},{"kind":"Abuse","title":"Fraudulent requests 正在直接伤害正常用户的使用供给","detail":"Thariq 提到有客户正被 fraudulent requests 针对，而且这类攻击会伤害 legitimate users 获得 usage 的能力。","context":"这条更偏运营现实，提醒 builder 反滥用已经会反过来影响正常产品供给。","url":"https://x.com/trq212/status/2092729394565657010"},{"kind":"Interface","title":"Codex 的 visualization 被点名进入可感知升级期","detail":"Peter Steinberger 直接说 codex 的 visualization feature got really good，说明 agent 工具的竞争点正在从纯结果质量延伸到过程呈现。","context":"这是简短用户感知信号，不等于完整产品说明，但足以说明交互层还在快速前进。","url":"https://x.com/steipete/status/2092822007843061823"}],"sources":{"podcasts":[{"title":"A $10B Hedge Fund’s AI Playbook (Best of the Pod)","name":"AI & I by Every","publishedAt":"2026-08-26T15:00:00.000Z","url":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL","excerpts":["It's becoming a meme that CEOs are, like, writing basically, like, the We're AI first memo. You have the best example of that memo that I've ever seen. Would you mind just, like, reading, I don't know, maybe the first paragraph or two of what you wrote? Because I think it's amazing.","Using ChatGPT is not cheating. That's a non applicable idea from academia. I use ChatGPT to write this email. You should be using it too and be proud of it. As a hedge fund, we should be ashamed to leave money on the table by ignoring tools that make us faster, smarter, and more effective.","From the very top, we are building a culture around AI. Not using these tools is like refusing to use the Internet in 1995 because it wasn't perfect."]}],"blogs":[{"title":"Claude in Chrome is generally available ","source":"blog","publishedAt":"Aug 26, 2026","url":"https://claude.com/blog/claude-in-chrome-generally-available","summary":""},{"title":"Claude gets its own browser in Cowork","source":"blog","publishedAt":"Aug 26, 2026","url":"https://claude.com/blog/cowork-built-in-browser","summary":""}],"x":[{"name":"Josh Woodward","handle":"joshwoodward","bio":"VP, @Google @GoogleLabs @GeminiApp @GoogleAIStudio","tweets":[{"text":"Experimenting with multiplayer AI","createdAt":"2026-08-26T14:04:54.000Z","url":"https://x.com/joshwoodward/status/2092614266818064389","likes":157,"retweets":15,"replies":14}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"A good thing about having aged is that I feel that it’s been 20 years since I’ve pressed the reset button. Intrigued to see if I can find it tomorrow and dust it up","createdAt":"2026-08-27T06:31:31.000Z","url":"https://x.com/thsottiaux/status/2092862554632826968","likes":6582,"retweets":193,"replies":971},{"text":"A few weeks at OpenAI feel like years at other companies in terms of how much gets done. Crazy how much you can age in a few days","createdAt":"2026-08-26T23:30:54.000Z","url":"https://x.com/thsottiaux/status/2092756702349398036","likes":9336,"retweets":200,"replies":1181}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"Who should I tag for @X bugs now that @nikitabier has retired?","createdAt":"2026-08-27T04:22:05.000Z","url":"https://x.com/petergyang/status/2092829981885796800","likes":46,"retweets":0,"replies":16},{"text":"@ChatGPT If you enjoyed this, sign up for free to my newsletter to get my best AI and product guides. Join 110,000+ subscribers here:","createdAt":"2026-08-27T01:46:41.000Z","url":"https://x.com/petergyang/status/2092790875978162378","likes":3,"retweets":0,"replies":0},{"text":"Only thing linear is missing is a sauna perk wdyt @karrisaarinen 😅","createdAt":"2026-08-27T01:42:01.000Z","url":"https://x.com/petergyang/status/2092789702940340369","likes":2,"retweets":0,"replies":0}]},{"name":"Nan Yu","handle":"thenanyu","bio":"product enthusiast","tweets":[{"text":"Ah yes, the rule of 2.5","createdAt":"2026-08-26T21:32:36.000Z","url":"https://x.com/thenanyu/status/2092726934216343739","likes":39,"retweets":0,"replies":1},{"text":"scrum","createdAt":"2026-08-26T18:02:46.000Z","url":"https://x.com/thenanyu/status/2092674125529743864","likes":9,"retweets":0,"replies":2},{"text":"I am upset because the terrible comms has caused @gruber to lose his mind about watermarking and make @ditheringfm unlistenable for like 2 full episodes","createdAt":"2026-08-26T17:58:39.000Z","url":"https://x.com/thenanyu/status/2092673092103688348","likes":3,"retweets":0,"replies":0}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"We're seeing several of our customers be targeted by fraudulent requests and glad for all the work Stripe is doing to help them. Still a lot of work to do, these sort of attacks hurt everyones ability to provide usage to legitimate users.","createdAt":"2026-08-26T21:42:23.000Z","url":"https://x.com/trq212/status/2092729394565657010","likes":347,"retweets":11,"replies":19},{"text":"this was my change, excited to roll it out Claude now has a SendFeedback tool so instead of you guys having to hit /feedback and write up a report, you can just tell Claude to draft and approve it the feedback helps us improve and understand problems, so it's very appreciated","createdAt":"2026-08-26T19:31:28.000Z","url":"https://x.com/trq212/status/2092696449616376140","likes":944,"retweets":24,"replies":137}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Interesting","createdAt":"2026-08-26T17:01:24.000Z","url":"https://x.com/amasad/status/2092658681947246868","likes":133,"retweets":6,"replies":15}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"So cool. Global compute at your (agents') fingertips. Multiple regions, failover, up to 10,000 concurrent sandboxes & 5,000 vCPUs/min ramp by default, with more regions to come 🫪","createdAt":"2026-08-26T22:07:47.000Z","url":"https://x.com/rauchg/status/2092735785460277627","likes":181,"retweets":4,"replies":18},{"text":"We're shipping a cool security dashboard, but also the 𝚟𝚎𝚛𝚌𝚎𝚕 𝚜𝚎𝚌𝚞𝚛𝚒𝚝𝚢 𝚌𝚑𝚎𝚌𝚔 CLI. Much like 𝚒𝚜-𝚊𝚐𝚎𝚗𝚝𝚒𝚌, you can call on agents to improve your security posture with human-in-the-loop, or run in crons. Who would have thunk CLIs would save the world 😁","createdAt":"2026-08-26T14:33:08.000Z","url":"https://x.com/rauchg/status/2092621371914482026","likes":261,"retweets":12,"replies":34}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Yesterday, at Box we reported our Q2 results with revenue of $321.1 million for the quarter, up 9%, or 11% in constant currency (our highest constant-currency growth rate in 14 quarters), and we raised our full-year revenue target to $1.290 billion. Overall, this growth is being driven by the demand we're seeing from enterprises aiming to get the most out of their enterprise content and transform in the era of AI. As I shared on our earnings call, during the quarter I spoke with many enterprise technology leaders who highlighted their primary goals and challenges in implementing AI. One of the most common topics is how enterprises can get the right context to AI agents, as well as tap into…","createdAt":"2026-08-26T19:57:19.000Z","url":"https://x.com/levie/status/2092702955292230100","likes":188,"retweets":18,"replies":39}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"Truly a win-win-win: * NVIDIA is officially the center of open source AI w/ Nemotron and now HF * Hugging Face scores huge + gets the perfect home (no more nagging re business model!) * Open source AI wins! Massive congrats to friends @ClementDelangue, @Thom_Wolf (+ @ctnzr!)","createdAt":"2026-08-27T02:55:52.000Z","url":"https://x.com/mattturck/status/2092808287280329097","likes":119,"retweets":5,"replies":13},{"text":"Fun to be in the guest chair (vs host), for once. Chatted with Dan Nathan about: * why the best venture firm in the world might be NVIDIA * the \"hyper power law\" * why apps are becoming labs faster than labs are becoming apps * RSI and \"building God\" * AI bubble vs.duration mismatch concern * Learning to stop underestimating China","createdAt":"2026-08-26T19:01:32.000Z","url":"https://x.com/mattturck/status/2092688916969095587","likes":12,"retweets":4,"replies":1}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Make something people want, then make people want it. Harvard’17. GitHub: YouTube:","tweets":[{"text":"Most PR teams at large companies exist in order to block real marketing and branding It’s so ironic that a function designed to enhance a company’s brand ends up being antithetical to it","createdAt":"2026-08-27T00:43:18.000Z","url":"https://x.com/zarazhangrui/status/2092774923320369394","likes":22,"retweets":1,"replies":3},{"text":"When it comes to AI writing, many people seem to apply a double standard to the effect of “it’s fine if I use it; it’s not fine if YOU use it”","createdAt":"2026-08-27T00:38:31.000Z","url":"https://x.com/zarazhangrui/status/2092773720112988366","likes":71,"retweets":4,"replies":18}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"","createdAt":"2026-08-26T22:57:13.000Z","url":"https://x.com/nikunj/status/2092748226701210023","likes":325,"retweets":11,"replies":14}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"codex' visualization feature got really good.","createdAt":"2026-08-27T03:50:24.000Z","url":"https://x.com/steipete/status/2092822007843061823","likes":492,"retweets":16,"replies":47},{"text":"maybe it is a bubble?","createdAt":"2026-08-26T23:28:09.000Z","url":"https://x.com/steipete/status/2092756010280853815","likes":463,"retweets":12,"replies":37}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"THEY DID IT FOLKS","createdAt":"2026-08-26T23:28:41.000Z","url":"https://x.com/danshipper/status/2092756144447983619","likes":1367,"retweets":35,"replies":44},{"text":"Codex native apps are here!","createdAt":"2026-08-26T18:51:47.000Z","url":"https://x.com/danshipper/status/2092686463859126492","likes":258,"retweets":7,"replies":10},{"text":"definite golden age for polymaths and philosophers (luckily, a good antidote for epistemic despair) incredible time","createdAt":"2026-08-26T15:32:19.000Z","url":"https://x.com/danshipper/status/2092636264902148262","likes":259,"retweets":14,"replies":8}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"","createdAt":"2026-08-26T18:23:17.000Z","url":"https://x.com/adityaag/status/2092679292064768288","likes":4,"retweets":0,"replies":0},{"text":"The AI frontier will be determined by post-training. @DeepCogito is a post-training research lab. Today they’re announcing their $43M Series A. Their research focuses on large-scale reinforcement learning and recursive self-improvement. The core method is iterated distillation and amplification (IDA). They’ve already proven the method in public for models from 3B to 600B+ parameters. We met @drishanarora and @dhruvmalrana in March 2024 as Founder Fellows at @spc. They've known each other for 14 years. We’re excited to support the team working on the frontier of intelligence alongside @benchmark, @TQVentures, @Atreidesmgmt, @nexusvp, and @zscaler. More on why we invested below.","createdAt":"2026-08-26T18:23:17.000Z","url":"https://x.com/adityaag/status/2092679288869019700","likes":59,"retweets":10,"replies":3}]},{"name":"Sam Altman","handle":"sama","bio":"AI is cool i guess","tweets":[{"text":"i think we should do another party for our next model release, the 5.5 party was a lot of fun. what would make the next one awesome?","createdAt":"2026-08-26T21:56:47.000Z","url":"https://x.com/sama/status/2092733018838290817","likes":9236,"retweets":244,"replies":1889},{"text":"this is a good report about a bad thing:","createdAt":"2026-08-26T20:35:52.000Z","url":"https://x.com/sama/status/2092712656096358527","likes":3248,"retweets":131,"replies":285}]},{"name":"Claude","handle":"claudeai","bio":"Claude is an AI assistant built by @anthropicai to be safe, accurate, and secure. Talk to Claude on or download the app.","tweets":[{"text":"If you prefer to work in your own browser where you're already signed in, Claude in Chrome is now generally available on all paid plans. It remains your default if you already use it:","createdAt":"2026-08-26T23:26:25.000Z","url":"https://x.com/claudeai/status/2092755574563741871","likes":247,"retweets":9,"replies":4},{"text":"There's nothing to install. Claude's browser is built into the desktop app and stays separate from your own browser and logins. Rolling out over the next week on the desktop app for all paid plans:","createdAt":"2026-08-26T23:26:24.000Z","url":"https://x.com/claudeai/status/2092755573183828193","likes":455,"retweets":22,"replies":13},{"text":"Claude now has its own built-in browser in Cowork. When your task involves a website, a browser opens in Cowork's side panel, and Claude navigates, fills forms, and finishes the job.","createdAt":"2026-08-26T23:26:24.000Z","url":"https://x.com/claudeai/status/2092755571455758427","likes":7149,"retweets":412,"replies":249}]}]},"errors":[],"partial":false},{"date":"2026-08-27","dateLabel":"2026年08月27日","generatedAt":"2026-08-27T00:00:00+08:00","sourceGeneratedAt":"2026-08-26T06:28:20.473Z","stats":{"podcastEpisodes":1,"xBuilders":17,"totalTweets":32,"blogPosts":0},"highlights":[{"tag":"企业落地","title":"企业 AI 的护城河，开始长在连接与治理层，而不是模型层","body":"今天最清晰的共识不是谁的模型更聪明，而是企业一旦真的要把 agent 放进工作流，采购门槛立刻转向连接器、身份治理、计费和权限。Thibault 那条面向团队的方案介绍，把“能连进公司系统”和“能被公司管起来”放在同一层；Aaron Levie 则把这层直接定义为 applied AI 公司的价值窗口。因果关系很直接：模型能力可以被替换，但接入组织上下文并稳定穿过安全与管理要求，才决定 AI 能不能从试用变成常驻。","evidence":[{"quote":"So much demand for this one. Works similar to the Pro $100 plan but designed for teams and small companies. All ChatGPT, ChatGPT Work, and Codex features. Connect to Google Workspace, Slack, GitHub, Microsoft 365, and more. Secure workspace with SAML, SSO, and MFA. Centralized billing and administration. Usage analytics and spend controls. No 5h limits","attribution":"Thibault Sottiaux (@thsottiaux)","url":"https://x.com/thsottiaux/status/2092345330272780499"},{"quote":"It’s clear that there’s a wide gap between the AI models and the underlying workflows of an enterprise, which leaves a ton of opportunity for applied AI companies.","attribution":"Aaron Levie (@levie)","url":"https://x.com/levie/status/2092466424694649066"},{"quote":"This requires understanding the context, driving the change management, having a harness that can route to various models, connecting to the critical business systems in that vertical, solving the UX challenges of connecting users to agents in the right way in a workflow.","attribution":"Aaron Levie (@levie)","url":"https://x.com/levie/status/2092466424694649066"}]},{"tag":"记忆系统","title":"跨界面记忆会变成 agent 标配，但默认开启的前提是边界先被产品化","body":"Claude 这轮更新的重点不是“终于有 memory 了”，而是把 memory 从单点功能改成贯穿多表面的连续性层，同时把查看、编辑、删除和敏感主题开关全部显式化。也就是说，厂商已经默认用户要的是“少重复解释自己”，但也承认一旦记忆跨越聊天和执行面板，隐私边界必须先被界面化。真正的产品分水岭不在记住更多，而在能否让用户清楚地知道系统记住了什么、没记住什么。","evidence":[{"quote":"Claude now has one memory across chat and Claude Cowork, and you decide what's in it. Hand Cowork a task and it starts from what Claude already knows from your chats.","attribution":"Claude (@claudeai)","url":"https://x.com/claudeai/status/2092299704864284888"},{"quote":"Everything Claude remembers is saved as a list of topics in Settings, where you can read, edit, or delete each one. Memory also updates on its own as you chat, saving new details as they come up.","attribution":"Claude (@claudeai)","url":"https://x.com/claudeai/status/2092299707653439497"},{"quote":"Topics some consider sensitive, like health or religious beliefs, stay out of memory unless you turn them on in Settings.","attribution":"Claude (@claudeai)","url":"https://x.com/claudeai/status/2092299710002319742"}]},{"tag":"执行安全","title":"Agent 真正的瓶颈，已经不是会不会写代码，而是能不能被安全地放权","body":"一边是 Swyx 直接提醒大家别碰不稳定的 locked use，本地能力失控会把问题放大到钥匙串级别；另一边是 Guillermo 在推 secure eval 和 secure connectivity，把执行环境和服务接入都当成一等问题。两条信号合起来说明，agent 竞争正在从“能生成什么”切到“能安全地代做什么”。当产品开始碰本机、账户和外部服务时，权限模型和隔离策略不再是工程细节，而是用户是否敢真的交权的前提。","evidence":[{"quote":"do not use codex \"locked use\" capabilities right now. it is currently relying on unstable mac features and has completely locked me out of my macos keychain twice this week.","attribution":"Swyx (@swyx)","url":"https://x.com/swyx/status/2092492963435946494"},{"quote":"The hardest problem in building agents is secure connectivity to services and data.","attribution":"Guillermo Rauch (@rauchg)","url":"https://x.com/rauchg/status/2092352411839193234"},{"quote":"We're introducing Run SDK: secure eval for dynamic Code Mode execution. When agents write code, you don't always need a full sandbox. You can run their code in a lightweight QuickJS secure context. Faster and more cost-efficient.","attribution":"Guillermo Rauch (@rauchg)","url":"https://x.com/rauchg/status/2092382653161107534"}]},{"tag":"Agent Web","title":"搜索和 Web 基础设施，会被 agent 当成主要用户后重做一遍","body":"Parallel 这期播客里最关键的判断，是把 agent 当作与人类不同的第一类客户：如果主要流量变成 agent，搜索反馈就不能再靠 human click data，索引、排序甚至商业模式都要重写。这不是在浏览器上加一层自动化，而是在倒逼 Web 基础设施为机器使用者重新设计。谁还按 human UI 和 human feedback 来建 agent 产品，后面会越来越像在旧公路上硬跑新车。","evidence":[{"quote":"Our view at Parallel is that human click data is a bug, and agent doing work with search should rely on agent feedback, not human feedback.","attribution":"Parag Agrawal（播客《Parallel’s Parag Agrawal: Building a New Web for AI Agents》）","url":"https://www.youtube.com/playlist?list=PLOhHNjZItNnMm5tdW61JpnyxeYH5NDDx8"},{"quote":"We started Parallel with the bet that agents would do it a thousand x more than humans ever have. As a result, we need to reinvent the technology that can power search for agents, but also the business models that go alongside it.","attribution":"Parag Agrawal（播客《Parallel’s Parag Agrawal: Building a New Web for AI Agents》）","url":"https://www.youtube.com/playlist?list=PLOhHNjZItNnMm5tdW61JpnyxeYH5NDDx8"}]}],"matters":[{"kind":"硬件","title":"Sam Altman 用一句话把自研芯片推上台前","detail":"“we made a chip and it is fast” 信息极少，但已经足够说明算力硬件不再只是幕后供给问题，而是 lab 愿意直接放进产品叙事的变量。","url":"https://x.com/sama/status/2092339694210040187"},{"kind":"协作","title":"Google Labs 在试探多人实时 vibe coding","detail":"Putty 被定义成一起实时搭工具和网站的协作实验，说明生成式编程的增长点不只在个人提效，也在共同编辑场景。","url":"https://x.com/GoogleLabs/status/2092293667688173593"},{"kind":"医疗","title":"Peter Yang 把 AI skill 做成照护流程的单一事实源","detail":"这个开源 skill 不是泛泛问答，而是围绕患者信息、下一步行动、已知/未知、术语解释和更新日志，持续维护一份可协作的 brief。","url":"https://x.com/petergyang/status/2092249012913258946"},{"kind":"评测","title":"Madhu Guru 提醒 eval 也要有 roadmap","detail":"他把 use case 演进和 eval 演进直接绑在一起：如果用户已进入长上下文、多轮、主动 agent，团队却还在跑 week 1 的测试，问题会先出现在产品和流失上。","url":"https://x.com/realmadhuguru/status/2092426017118028266"},{"kind":"可扩展性","title":"Claude Code 预告更可 hackable 的方向","detail":"Thariq 只放了一句短预告，但方向很明确：未来竞争不仅在默认能力，也在开发者能否改造和接入自己的工作流。","url":"https://x.com/trq212/status/2092303682616627311"},{"kind":"社会许可","title":"Aditya Agarwal 把 AI 基建争议归因到收益分配不均","detail":"他认为公众反感数据中心扩建并不意外，因为今天 AI 主要先帮助知识工作者和高收入人群；当它真的带来普遍受益的疾病治疗突破，舆论结构才可能变化。","url":"https://x.com/adityaag/status/2092290497826173186"}],"sources":{"podcasts":[{"title":"Parallel’s Parag Agrawal: Building a New Web for AI Agents","name":"Training Data","publishedAt":"2026-08-25T09:00:00.000Z","url":"https://www.youtube.com/playlist?list=PLOhHNjZItNnMm5tdW61JpnyxeYH5NDDx8","excerpts":["Our view at Parallel is that human click data is a bug, and agent doing work with search should rely on agent feedback, not human feedback. We believe that these models are really good at compressing information and we can benefit from a lot of the research that have gone into building models and apply it to search indexing and ranking. And so you can now m…","Parag, thank you so much for joining us today. We're delighted to have you on the show. For those who don't know, Parag of Twitter CEO fame was the CEO for of Twitter before selling it to Elon and is now back on the founder arc. You founded a company called Parallel Web Systems, which is scaling up agentic search for the agentic web. We're very excited to h…","Thank you, Sonia, for having me. Thanks, Andrew, for joining us. I'm really excited about this conversation. At Parallel, we're building a bunch of technology in order to allow agents to search and use the web. So just like humans forever have figured out how to use browsers and search engines and clicking and browsing on the web to access information, agen…"]}],"blogs":[],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"PSA: do not use codex \"locked use\" capabilities right now. it is currently relying on unstable mac features and has completely locked me out of my macos keychain twice this week. thx @_chenglou for linking to apple developer forums acknowledging this is a \"known bug\". just avoid. ofc, would be nice to do everything in cloud, but cloud isn't there yet.","createdAt":"2026-08-26T06:02:53.000Z","url":"https://x.com/swyx/status/2092492963435946494","likes":5,"retweets":1,"replies":9}]},{"name":"Boris Cherny","handle":"bcherny","bio":"Claude Code @anthropicai","tweets":[{"text":"A small improvement: memory is now simpler and more powerful. Enjoy!","createdAt":"2026-08-25T20:57:13.000Z","url":"https://x.com/bcherny/status/2092355642363453943","likes":1429,"retweets":46,"replies":115}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Good products take time. At least 34 days.","createdAt":"2026-08-26T05:41:51.000Z","url":"https://x.com/thsottiaux/status/2092487667426738179","likes":2034,"retweets":62,"replies":389},{"text":"I want to see the polymarket","createdAt":"2026-08-25T21:13:02.000Z","url":"https://x.com/thsottiaux/status/2092359619075314102","likes":367,"retweets":4,"replies":39},{"text":"So much demand for this one. Works similar to the Pro $100 plan but designed for teams and small companies. ✅ All ChatGPT, ChatGPT Work, and Codex features ✅ Connect to Google Workspace, Slack, GitHub, Microsoft 365, and more ✅ Secure workspace with SAML, SSO, and MFA ✅ Centralized billing and administration ✅ Usage analytics and spend controls ✅ No 5h limits","createdAt":"2026-08-25T20:16:15.000Z","url":"https://x.com/thsottiaux/status/2092345330272780499","likes":2926,"retweets":110,"replies":569}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"Here's an example brief that the /fuck-cancer skill creates and updates. I’ve found it really useful to have a single source of truth doc with patient information, what to do next, what we know, definitions of medical terms, and an update log. 📌 Get the free skill here:","createdAt":"2026-08-25T18:00:16.000Z","url":"https://x.com/petergyang/status/2092311110871617915","likes":101,"retweets":11,"replies":9},{"text":"Very excited to attend @OpenAI Dev Day. ChatGPT / Codex is basically the OS I use for everything I do on my computer. Can't wait to see what updates the team has in store.","createdAt":"2026-08-25T16:01:06.000Z","url":"https://x.com/petergyang/status/2092281120650047746","likes":117,"retweets":7,"replies":6},{"text":"Today, I’m open-sourcing /fuck-cancer, an AI skill that helps patients and caregivers navigate cancer diagnosis and treatment and advocate for themselves and their loved ones. Here’s what patients and caregivers have told me since I shared my mom’s story: “You have to be a huge patient advocate. Ask questions and push for answers, biopsies, and proper testing.” “I need help navigating difficult conversations and advocating for myself.” “The volume of doctors, documents, and insurance paperwork can quickly become overwhelming.” I built the skill to help with these problems. It creates and updates a practical brief with five sections: 1. Patient and care-team information for easy reference du…","createdAt":"2026-08-25T13:53:31.000Z","url":"https://x.com/petergyang/status/2092249012913258946","likes":1389,"retweets":158,"replies":69}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"Full eval series so far: 1/ Getting started with evals 2/ Quality first, then cost 3/ Failure modes taxonomy 4/ Laddered eval strategy 5/ Tyranny of the average 6/ Hill climbing on evals 7/ The Goldilocks principle 8/ Discriminatory power of evals 9/ The Eval Roadmap Problem","createdAt":"2026-08-26T03:56:42.000Z","url":"https://x.com/realmadhuguru/status/2092461206783373758","likes":0,"retweets":0,"replies":0},{"text":"How to build great evals — Part 9 The Eval Roadmap Problem Most evals fail because teams treat them as static artifacts while their users expectations and behaviors have evolved. Your evals need a roadmap that evolves with your product and actual usage patterns. Take a financial research agent. Here is how use cases will evolve over time. Early user: Summarize this 5-page earnings report. 3 weeks later: review the last 5 earnings reports and explain their growth story. 2 months later: Here are 15 filings, earnings transcripts and research reports. Build an investment thesis. Eventually: Monitor my stock portfolio and tell send me alerts when something materially changes my thesis. Each stag…","createdAt":"2026-08-26T01:36:52.000Z","url":"https://x.com/realmadhuguru/status/2092426017118028266","likes":83,"retweets":4,"replies":8}]},{"name":"Cat Wu","handle":"_catwu","bio":"claude code + cowork @anthropicai, prev: @dagster, @scale_ai","tweets":[{"text":"Thanks to your feedback, we’ve unified memory across Chat and Cowork. Now, you can tell Claude to remember something once and it’ll have that context across surfaces! Tell us what you’d like to see next :)","createdAt":"2026-08-25T19:43:46.000Z","url":"https://x.com/_catwu/status/2092337156455051345","likes":588,"retweets":19,"replies":107}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"excited to share more on how we’re making Claude Code more hackable soon","createdAt":"2026-08-25T17:30:45.000Z","url":"https://x.com/trq212/status/2092303682616627311","likes":1118,"retweets":24,"replies":100}]},{"name":"Google Labs","handle":"GoogleLabs","bio":"Google’s home for our latest AI tools and experiments.","tweets":[{"text":"🚨 NEW LABS EXPERIMENT 🚨 Great minds t̵h̵i̵n̵k̵ play alike! Play with Putty is a collaborative vibe coding tool that lets you build tools and websites together in real time. 🫟 Ready for your imagination to go multiplayer? Join the waitlist at and share your feedback with us! US only, ages 18+","createdAt":"2026-08-25T16:50:57.000Z","url":"https://x.com/GoogleLabs/status/2092293667688173593","likes":1234,"retweets":102,"replies":53}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"(Not affiliated with Denny's)","createdAt":"2026-08-25T22:46:24.000Z","url":"https://x.com/rauchg/status/2092383119248884043","likes":31,"retweets":0,"replies":0},{"text":"We're introducing Run SDK: secure 𝚎𝚟𝚊𝚕 for dynamic Code Mode execution. When agents write code, you don't always need a full sandbox. You can 𝚛𝚞𝚗 their code in a lightweight QuickJS secure context. Faster and more cost-efficient. 𝚗𝚙𝚖 𝚒 𝚛𝚞𝚗","createdAt":"2026-08-25T22:44:33.000Z","url":"https://x.com/rauchg/status/2092382653161107534","likes":419,"retweets":19,"replies":38},{"text":"The hardest problem in building agents is secure connectivity to services and data. Excited for Vercel Connect to be GA. Run e.g: 𝚟𝚎𝚛𝚌𝚎𝚕 𝚌𝚘𝚗𝚗𝚎𝚌𝚝 𝚌𝚛𝚎𝚊𝚝𝚎 𝚗𝚘𝚝𝚒𝚘𝚗, then get an MCP client you can query on behalf of the authenticated user.","createdAt":"2026-08-25T20:44:23.000Z","url":"https://x.com/rauchg/status/2092352411839193234","likes":214,"retweets":10,"replies":23}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Good post on what the applied AI strategy looks like at scale. It’s clear that there’s a wide gap between the AI models and the underlying workflows of an enterprise, which leaves a ton of opportunity for applied AI companies. “The world doesn’t just want raw models and agents; it wants problems resolved and outcomes achieved. The premium will sit with the companies that can diffuse this intelligence through every aspect of civilization, converting raw tokens into real world outcomes, transforming industries, and creating economies in the process.” This requires understanding the context, driving the change management, having a harness that can route to various models, connecting to the cri…","createdAt":"2026-08-26T04:17:26.000Z","url":"https://x.com/levie/status/2092466424694649066","likes":122,"retweets":6,"replies":19}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Ok apparently this guy came up with it Don’t really care though Clout chaser lmao he is the one who blocked me","createdAt":"2026-08-25T20:40:44.000Z","url":"https://x.com/garrytan/status/2092351492397383908","likes":60,"retweets":0,"replies":13},{"text":"lmao","createdAt":"2026-08-25T18:40:20.000Z","url":"https://x.com/garrytan/status/2092321194037195022","likes":4686,"retweets":187,"replies":90},{"text":"You need to be cross-harness memory maxxing","createdAt":"2026-08-25T15:48:21.000Z","url":"https://x.com/garrytan/status/2092277912053657722","likes":510,"retweets":28,"replies":55}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"find someone who loves you as much as the VC who loves posting photos of an “exclusive” dinner 🙈","createdAt":"2026-08-26T04:56:34.000Z","url":"https://x.com/nikunj/status/2092476274312933634","likes":14,"retweets":0,"replies":2},{"text":"Originally inspired by the @TheStalwart’s Odd Lots episode. Built using @ChatGPT codex and @Railway Design polish courtesy of @emilkowalski skills and @itskasturiii generative loaders. Direct link here: Feedback always welcome!","createdAt":"2026-08-25T22:52:59.000Z","url":"https://x.com/nikunj/status/2092384774459674957","likes":3,"retweets":0,"replies":0},{"text":"Introducing the El Niño situation monitor (elneenyo dot com).. > real time updates, news and what’s happening straight from government sources > impact per region and costs > historical records and what’s the importance > glossary and FAQ on all the different readings If this topic pops up in your group chat, you know where to go now!","createdAt":"2026-08-25T22:49:15.000Z","url":"https://x.com/nikunj/status/2092383834470002922","likes":8,"retweets":0,"replies":2}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"This week.","createdAt":"2026-08-25T16:52:46.000Z","url":"https://x.com/steipete/status/2092294123638362346","likes":280,"retweets":11,"replies":20}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"","createdAt":"2026-08-25T21:00:57.000Z","url":"https://x.com/danshipper/status/2092356580930945029","likes":37,"retweets":1,"replies":2},{"text":"GET DOT","createdAt":"2026-08-25T15:55:06.000Z","url":"https://x.com/danshipper/status/2092279611988050181","likes":51,"retweets":2,"replies":4},{"text":"I got one of these to test @every vibe check forthcoming!","createdAt":"2026-08-25T15:47:16.000Z","url":"https://x.com/danshipper/status/2092277639591461056","likes":71,"retweets":1,"replies":5}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"It's totally unsurprising that the general population hates datacenter buildout. AI today primarily helps knowledge workers and the highest paid segments of the country. I suspect that the big change will happen when AI is able to find cures for diseases that ail everyone. We are starting to see light at the end of the tunnel here. Also makes sense why some of the brightest minds now want to focus there. Our industry also hasn't done ourselves any favors by all our fear-mongering. Instead of painting a positive version of the future, we have instead talked about all the reasons why we should be afraid 🤦‍♂️.","createdAt":"2026-08-25T16:38:22.000Z","url":"https://x.com/adityaag/status/2092290497826173186","likes":18,"retweets":1,"replies":3}]},{"name":"Sam Altman","handle":"sama","bio":"AI is cool i guess","tweets":[{"text":"we made a chip and it is fast","createdAt":"2026-08-25T19:53:51.000Z","url":"https://x.com/sama/status/2092339694210040187","likes":32803,"retweets":1347,"replies":3032}]},{"name":"Claude","handle":"claudeai","bio":"Claude is an AI assistant built by @anthropicai to be safe, accurate, and secure. Talk to Claude on or download the app.","tweets":[{"text":"Topics some consider sensitive, like health or religious beliefs, stay out of memory unless you turn them on in Settings. Memory is on by default on Free, Pro, and Max plans. Review yours anytime in Settings > Memory. Read more:","createdAt":"2026-08-25T17:14:58.000Z","url":"https://x.com/claudeai/status/2092299710002319742","likes":394,"retweets":4,"replies":20},{"text":"Everything Claude remembers is saved as a list of topics in Settings, where you can read, edit, or delete each one. Memory also updates on its own as you chat, saving new details as they come up. You can also say \"remember this\" to save something specific.","createdAt":"2026-08-25T17:14:58.000Z","url":"https://x.com/claudeai/status/2092299707653439497","likes":549,"retweets":21,"replies":24},{"text":"Claude now has one memory across chat and Claude Cowork, and you decide what's in it. Hand Cowork a task and it starts from what Claude already knows from your chats: the project you talked through, your manager's preferences, or the client from last quarter.","createdAt":"2026-08-25T17:14:57.000Z","url":"https://x.com/claudeai/status/2092299704864284888","likes":6846,"retweets":399,"replies":302}]}]},"errors":[],"partial":false},{"date":"2026-08-26","dateLabel":"2026年08月26日","generatedAt":"2026-08-26T00:00:00+08:00","sourceGeneratedAt":"2026-08-25T06:28:05.928Z","stats":{"podcastEpisodes":0,"xBuilders":13,"totalTweets":29,"blogPosts":0},"highlights":[{"tag":"商业化","title":"AI 的普及门槛，开始取决于边界清不清，而不是能力多不多","body":"今天最有代表性的两条 builder 判断都在收边界。消费侧，Plus 恢复 5 小时限额不是单纯缩紧，而是把算力波动和误用成本变成可解释的规则；企业侧，ZDR 被 Aaron Levie 直接定义为 adoption 的前提。两者指向同一个因果：当 AI 从尝鲜变成常用工具，产品要先把负载、权限和责任说清楚，增长才不会被运营与合规反噬。","evidence":[{"quote":"Tomorrow we will bring back the 5h limit for Plus accounts across ChatGPT Work and Codex... the 5h limit allows us to smoothen the load on our compute... users on the Plus plan are relatively casual and new users, but then also just accidentally eat through their whole weeks usage and then are confused","attribution":"Thibault Sottiaux (@thsottiaux)","url":"https://x.com/thsottiaux/status/2092058556707344708"},{"quote":"It’s not fully appreciated that ZDR is responsible for a substantial amount of the growth of AI... Without ZDR, AI diffusion grinds to a halt.","attribution":"Aaron Levie (@levie)","url":"https://x.com/levie/status/2091909170308296950"}]},{"tag":"交互范式","title":"Agent 要赢，不是多会聊天，而是少让用户碰界面","body":"Peter Yang 说得很狠：一旦要频繁登录网站或被困在 app 里，他宁可直接不用。Nan Yu 那条装机感受和 Peter Steinberger 对“可被 prompt 改写的软件”的判断，把同一件事补完整了。真正有粘性的 agent，不是把原来的人机流程包一层聊天框，而是把安装、配置、跳转这类界面摩擦吞掉。","evidence":[{"quote":"Whenever I have to login to a new website/app or even use an agent that's trapped in a website /app I usually just prefer to stop using the product","attribution":"Peter Yang (@petergyang)","url":"https://x.com/petergyang/status/2092080901094248474"},{"quote":"setting up a new computer with Codex is kind of nice... \"download and install handy, slack, chrome, cleanshot, rectangle\" makes you wish siri was good","attribution":"Nan Yu (@thenanyu)","url":"https://x.com/thenanyu/status/2092048044502192374"},{"quote":"We need to get away from software that we can’t change with a prompt.","attribution":"Peter Steinberger (@steipete)","url":"https://x.com/steipete/status/2091923535513928015"}]},{"tag":"执行层","title":"Agent 产品的差距，已经从会不会答，转到能不能持续把事做完","body":"Amjad 直接用日常工作替换来比较两个 agent，给出的胜负手不是模型智力，而是 persistence、fastidiousness 和实际调用软件完成任务的能力。Madhu 的 eval 贴又补了另一半：如果评测不能分辨这些真实差异，团队就会误以为系统在进步。判断是，下一轮竞争会卡在执行闭环上，谁能让 agent 稳定推进任务，谁才会被用户换成默认工具。","evidence":[{"quote":"Replit Agent completely replaced Claude CoWork in my day-to-day work. It's much more persistent and fastidious, and it uses code/software more effectively to complete tasks.","attribution":"Amjad Masad (@amasad)","url":"https://x.com/amasad/status/2091962601907638352"},{"quote":"A hill-climbing eval is useful when it can separate AI systems that are meaningfully different... The sweet spot for an eval is: Realistic + difficult + sensitive to differences in capability.","attribution":"Madhu Guru (@realmadhuguru)","url":"https://x.com/realmadhuguru/status/2092058332735693264"}]},{"tag":"工程效率","title":"性能债不会再躲在角落里，自动化工作流会把它放大成品牌体验","body":"Guillermo Rauch 两条内容连在一起看，很像同一套产品哲学：一边强调软件应该更小、更快、更强，一边顺手把一个历史遗留的 1 秒等待改成 1 毫秒。以前这类优化常被当成工程洁癖；一旦产品里充满自动化链路，它就会直接决定系统给人的顺手程度。能长期压住臃肿的团队，拿到的不只是 benchmark，而是体验上的持续优势。","evidence":[{"quote":"It's faster, cheaper, more capable, and… smaller. As software evolves, it tends to get slower, more bloated, buggier, and bigger.","attribution":"Guillermo Rauch (@rauchg)","url":"https://x.com/rauchg/status/2092081554814320677"},{"quote":"I asked fx to write me a faster alternative in Zig. It takes 1ms instead of 1s.","attribution":"Guillermo Rauch (@rauchg)","url":"https://x.com/rauchg/status/2091957823945216474"}]}],"matters":[{"kind":"Event","title":"OpenAI 在给 DevDay 2026 预热更强开发者叙事","detail":"Thibault Sottiaux 直接预告今年 DevDay 会是公司历史上最强一届，释放的是明确的大会级信号，而不是日常更新。","url":"https://x.com/thsottiaux/status/2092117461646856505"},{"kind":"Use Case","title":"Peter Yang 想让 AI 代打客服电话","detail":"他把目标定义得很具体：穿过自动语音系统、联系真人、完成预约或取消订阅，说明语音 agent 的真实需求正在从 demo 转向琐碎但高价值的事务代理。","url":"https://x.com/petergyang/status/2092031413319266382"},{"kind":"Community","title":"Zara Zhang 公开质疑传统 hackathon 形式已经过时","detail":"这不是在聊作品本身，而是在质疑 builder 活动的组织方式，说明 AI 时代连产出场景也在被重新审视。","url":"https://x.com/zarazhangrui/status/2092079390301556883"},{"kind":"Platform Risk","title":"Every 的 YouTube 账号被无预警停用","detail":"Dan Shipper 公开求助，称账号在没有通知和理由的情况下被 Google 关闭，平台依赖风险再次变成内容公司的现实问题。","url":"https://x.com/danshipper/status/2092026065644335446"},{"kind":"Fundraising","title":"Nikunj Kothari 提醒创始人先找出交易里的真正 champion","detail":"他强调非常规融资交易往往不是输在条款，而是输在没人愿意把它一路推到成交，因此 founder 需要主动识别并武装那个内部推动者。","url":"https://x.com/nikunj/status/2092079149028716877"}],"sources":{"podcasts":[],"blogs":[],"x":[{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"OpenAI DevDay 2026 will be our best DevDay in the history of the company. It will not be close.","createdAt":"2026-08-25T05:10:47.000Z","url":"https://x.com/thsottiaux/status/2092117461646856505","likes":1869,"retweets":77,"replies":278},{"text":"Tomorrow we will bring back the 5h limit for Plus accounts across ChatGPT Work and Codex. I had mentioned this a while ago, but then postponed it. This is necessary as (a) the 5h limit allows us to smoothen the load on our compute, allowing to keep the plan generous in terms of weekly usage and (b) users on the Plus plan are relatively casual and new users, but then also just accidentally eat through their whole weeks usage and then are confused, making it not a great experience. We are for the upcoming months keeping the 5h limit not enabled for Pro $100 and Pro $200 subscriptions.","createdAt":"2026-08-25T01:16:43.000Z","url":"https://x.com/thsottiaux/status/2092058556707344708","likes":9223,"retweets":527,"replies":2664}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"Whenever I have to login to a new website/app or even use an agent that's trapped in a website /app I usually just prefer to stop using the product (the only exception is entertainment or gaming). I can't be the only one.","createdAt":"2026-08-25T02:45:30.000Z","url":"https://x.com/petergyang/status/2092080901094248474","likes":26,"retweets":1,"replies":13},{"text":"I got 3 AI chief of staffs now, clearly the next step is to add one more","createdAt":"2026-08-25T00:38:30.000Z","url":"https://x.com/petergyang/status/2092048940732682395","likes":82,"retweets":2,"replies":28},{"text":"I'd like to try using AI to call customer support phone numbers using voice, navigate the terrible automated phone systems, and talk to a human to book appointments or cancel subscriptions. What's the easiest way to try this?","createdAt":"2026-08-24T23:28:51.000Z","url":"https://x.com/petergyang/status/2092031413319266382","likes":51,"retweets":2,"replies":33}]},{"name":"Nan Yu","handle":"thenanyu","bio":"product enthusiast","tweets":[{"text":"setting up a new computer with Codex is kind of nice... \"download and install handy, slack, chrome, cleanshot, rectangle\" makes you wish siri was good","createdAt":"2026-08-25T00:34:56.000Z","url":"https://x.com/thenanyu/status/2092048044502192374","likes":28,"retweets":0,"replies":5},{"text":"Feel the agi","createdAt":"2026-08-24T22:16:38.000Z","url":"https://x.com/thenanyu/status/2092013239643394076","likes":2,"retweets":0,"replies":0},{"text":"“L7 promo: shipped emoji reactions to Gmail that show up as ugly random one character emails with metadata to anyone using another mail app including iPhone mail app the most common mail app on Earth”","createdAt":"2026-08-24T20:58:26.000Z","url":"https://x.com/thenanyu/status/2091993558018572434","likes":2,"retweets":0,"replies":0}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"How to build great evals - part 8. The discriminatory property of evals. A hill-climbing eval is useful when it can separate AI systems that are meaningfully different. Imagine you run an eval on five AI systems: A: 94 B: 93 C: 95 D: 94 E: 92 Now suppose you already know A and C are substantially better systems than D and E. The eval is bad cos it doesn’t tell you that. It has low discriminatory power. It’s like giving a fifth-grade math test to a group of PhDs - everyone aces it and you’ve learned nothing about who is the smartest. That doesn’t mean making evals arbitrarily hard. Then everyone fails and you’re not measuring what your systems are meant for. The sweet spot for an eval is: Re…","createdAt":"2026-08-25T01:15:49.000Z","url":"https://x.com/realmadhuguru/status/2092058332735693264","likes":92,"retweets":7,"replies":8}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Only a few have reached this milestone!","createdAt":"2026-08-24T18:58:46.000Z","url":"https://x.com/amasad/status/2091963442186092639","likes":173,"retweets":5,"replies":16},{"text":"True. Replit Agent completely replaced Claude CoWork in my day-to-day work. It's much more persistent and fastidious, and it uses code/software more effectively to complete tasks.","createdAt":"2026-08-24T18:55:25.000Z","url":"https://x.com/amasad/status/2091962601907638352","likes":160,"retweets":9,"replies":26},{"text":"Cool!","createdAt":"2026-08-24T17:14:16.000Z","url":"https://x.com/amasad/status/2091937147473551474","likes":102,"retweets":3,"replies":7}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"It's faster, cheaper, more capable, and… smaller. As software evolves, it tends to get slower, more bloated, buggier, and bigger. is architected from the outset to prevent this.","createdAt":"2026-08-25T02:48:06.000Z","url":"https://x.com/rauchg/status/2092081554814320677","likes":210,"retweets":5,"replies":18},{"text":"If your terminal ever gets into a 'bad state', like garbled outputs, you run 𝚛𝚎𝚜𝚎𝚝. I noticed it was… oddly slow. Turns out in 1979 3BSD's 𝚝𝚜𝚎𝚝 had a 𝚜𝚕𝚎𝚎𝚙(𝟷) to let mechanical printer-and-ink terminals 'settle down' 😂 I asked 𝚏𝚡 to write me a faster alternative in Zig. It takes 1ms instead of 1s. It was really cool to dive deeper into 𝚗𝚌𝚞𝚛𝚜𝚎𝚜, 𝚝𝚜𝚎𝚝, 𝚝𝚎𝚛𝚖𝚒𝚗𝚏𝚘, and the myriad ways in which your terminal can get… cursed. It's legit fascinating how far back our technology stack goes, and how enduring good system design is, even with the occasional 'spider webs' you can find. Check out for a fun explainer (and some alternative solutions.) ps: once you start…","createdAt":"2026-08-24T18:36:26.000Z","url":"https://x.com/rauchg/status/2091957823945216474","likes":514,"retweets":21,"replies":44}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Systems of record have never been more important than in a world where you have AI agents that will do 100X more work on these platforms than people ever did. Agents will be querying the data in these systems, processing tasks, executing workflows, collaborating with human and agent users, and more. Thus, the governance, reliability, security, access controls, and business logic remain critical more than ever — the OpenAI Hugging Face incident is just a small peek into what the future will look like with agents running around trying to execute on their goals. But this only works for the systems of record that respond with the right product experiences, APIs, and business models to support a…","createdAt":"2026-08-25T03:12:26.000Z","url":"https://x.com/levie/status/2092087679240569126","likes":344,"retweets":24,"replies":45},{"text":"It’s not fully appreciated that ZDR is responsible for a substantial amount of the growth of AI, because it dramatically simplified the compliance process most companies deal with in handling data with subprocessors. The alternative path would have been a far slower adoption rate. For the applied AI tools that are primarily responsible for driving AI growth, they generally have agreements in place with their customers to only offer models with ZDR to ensure that customers don’t have to inspect each model they turn on. Anything else is an exception process that takes far longer. And then inside enterprises directly, most companies have internal governance requirements that say they can only…","createdAt":"2026-08-24T15:23:06.000Z","url":"https://x.com/levie/status/2091909170308296950","likes":172,"retweets":18,"replies":22}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Datacenters create jobs and prosperity, actually","createdAt":"2026-08-25T01:33:39.000Z","url":"https://x.com/garrytan/status/2092062820229890209","likes":502,"retweets":45,"replies":26},{"text":"Conductor Cloud has made me so much more productive and I don't have to keep my Macbook Pro cracked open anymore","createdAt":"2026-08-25T01:31:19.000Z","url":"https://x.com/garrytan/status/2092062231488061584","likes":389,"retweets":8,"replies":53},{"text":"Form a view. Turn it into an artifact or experiment. Put it in contact with reality. Read the result without self-deception. Revise and run again.","createdAt":"2026-08-25T01:20:32.000Z","url":"https://x.com/garrytan/status/2092059517446156640","likes":421,"retweets":34,"replies":53}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Make something people want, then make people want it. Harvard’17. GitHub: YouTube:","tweets":[{"text":"Unpopular opinion: hackathons are an outdated event format (at least the way they’re traditionally held)","createdAt":"2026-08-25T02:39:30.000Z","url":"https://x.com/zarazhangrui/status/2092079390301556883","likes":85,"retweets":5,"replies":27},{"text":"I really appreciate how @davidsenra immediately cuts to the chase and gets his guests to be their most natural selves I've watched lots of Sam Altman interviews; I feel like he's his most comfortable self during this one","createdAt":"2026-08-25T00:57:56.000Z","url":"https://x.com/zarazhan
