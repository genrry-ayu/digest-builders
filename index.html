  <script>
    const DIGESTS = [{"date":"2026-09-18","dateLabel":"2026年09月18日","generatedAt":"2026-09-18T00:00:00+08:00","sourceGeneratedAt":"2026-09-17T06:42:41.601Z","stats":{"podcastEpisodes":0,"xBuilders":16,"totalTweets":33,"blogPosts":1},"highlights":[{"tag":"产品范式","title":"AI 工作台的下一步不是增加入口，而是让意图自动选择工作方式","body":"当快速问答、深度执行和内容创作共用同一段上下文，用户就不必先理解产品的信息架构，再决定任务应该被送往哪里。这样的合并不只是减少标签页，它把路由责任从用户转给模型，也让文档、演示和设计从聊天附件变成可继续编辑、评论、导出与分享的工作结果。","evidence":[{"quote":"Based on your prompt, Claude will decide whether to give a quick answer or do deeper agentic work, and what kind of output best fits the task.","attribution":"Cat Wu（Claude Code + Cowork）","url":"https://x.com/_catwu/status/2100260655312089562"},{"quote":"So we stopped making you choose. Claude can now figure out what a task needs, so what Cowork and Design can do is available from any conversation, with the context, skills, and connectors you already have.","attribution":"Claude Blog","url":"https://claude.com/blog/cowork-is-now-claude"}]},{"tag":"模型分工","title":"专用判别模型正在把安全审查变成每次操作都能调用的基础设施","body":"Agent 工作流里的大量决策并不需要生成长文本，只需要低延迟地判断一条命令是否安全、一次路由是否合理。判别模型在速度和准确性上同时改善后，审查就不必只放在高风险节点，而可以进入默认执行路径；这会把安全从上线前的外围检查，变成运行时的持续能力。","evidence":[{"quote":"Default mode in 𝚏𝚡 is auto, with a safety reviewer analyzing every command. That reviewer runs on GPT Luna today. Jev is up to 18x faster (p95) and more accurate.","attribution":"Guillermo Rauch（Vercel CEO）","url":"https://x.com/rauchg/status/2100307962262872105"},{"quote":"Data classification tasks, routing decisions inside of a workflow, decision making when handed a particular domain problem, quick judgment calls about safety or security, and more all are the gates in a large number of processes.","attribution":"Aaron Levie（Box CEO）","url":"https://x.com/levie/status/2100448648672993540"}]},{"tag":"工具接口","title":"Agent 的工具设计正在从模拟电脑，转向直接表达业务能力","body":"文件系统和 bash 曾经是通用接口，因为模型只需学会一套操作方式；但通用并不等于可靠。随着 tool calling 成熟，直接暴露数据库查询或领域 API 可以减少中间状态、格式转换和绕路操作。未来高质量 Agent 集成的关键，会是工具是否贴近任务语义，而不是它看起来是否像一台传统电脑。","evidence":[{"quote":"I think increasingly you can just give Claude tools shaped in the way you want vs tricking it with a layer of indirection. e.g. for data storage do you really want a file system or do you want an API to a database","attribution":"Thariq（Claude Code）","url":"https://x.com/trq212/status/2100315537251463523"},{"quote":"I think bash is no longer all you need, if your goal is just reliably tool calling. but sandboxes + bash are still good for work that involves code generation & execution","attribution":"Thariq（Claude Code）","url":"https://x.com/trq212/status/2100315535758217422"}]},{"tag":"工作流资产","title":"模型升级不会淘汰 Skills，反而会抬高可复用流程的价值","body":"更强模型降低的是单次任务的理解成本，却不会自动保留团队特有的研究口径、编辑标准和浏览器操作约束。把这些判断写进 Skills，等于把个人经验变成可调用、可组合、可持续修正的流程资产；模型越能执行复杂步骤，这层显式约束越能把能力转化为稳定产出。","evidence":[{"quote":"Some people think the latest models make skills redundant but they've been indispensable for me to get AI to follow my specific edit and browser-use instructions.","attribution":"Peter Yang（AI 创作者）","url":"https://x.com/petergyang/status/2100328939034128856"},{"quote":"/podcast-production orchestrates 5 skills to turn the full episode into 6 different assets.","attribution":"Peter Yang（AI 创作者）","url":"https://x.com/petergyang/status/2100328939034128856"}]}],"matters":[{"kind":"产品安全","title":"安全与保障应被设计成 AI 产品能力","detail":"Madhu Guru 主张，安全与保障应成为产品和模型自身的功能，而不是由外部追加的 guardrails。","url":"https://x.com/realmadhuguru/status/2100312717739667963"},{"kind":"个人 Agent","title":"跨工具保留人格与完整记忆成为新的可移植诉求","detail":"Garry Tan 表示，他可以更换任意 harness，同时保留个人 AGI 的同一人格与完整记忆。","url":"https://x.com/garrytan/status/2100339347669279149"},{"kind":"家庭 Agent","title":"多人家庭 Agent 的门槛在权限粒度和受控访问","detail":"Nikunj Kothari 分享了夫妻共同使用的家庭 Agent，强调限定邮件读取、附件结构化与登录态浏览器等细粒度控制是通用聊天机器人难以复现的部分。","url":"https://x.com/nikunj/status/2100212813625196917"},{"kind":"交互体验","title":"模型的表达姿态会直接影响长期使用意愿","detail":"Zara Zhang 表示自己减少使用 Claude，是因为其表达常在展示聪明和复杂，而不是清楚传递观点。","url":"https://x.com/zarazhangrui/status/2100278750776824115"},{"kind":"发布节奏","title":"OpenAI 将原定本周的重要发布推迟到下周","detail":"Sam Altman 称其本周最期待发布的内容改到下周，并认为等待是值得的；原文没有披露具体产品。","url":"https://x.com/sama/status/2100351958167220547"}],"sources":{"podcasts":[],"blogs":[{"title":"Claude Cowork and chat are now one Claude","source":"blog","publishedAt":"Sep 16, 2026","url":"https://claude.com/blog/cowork-is-now-claude","summary":""}],"x":[{"name":"Boris Cherny","handle":"bcherny","bio":"Claude Code @anthropicai","tweets":[{"text":"Also today: Claude Docs, Claude Slides, and Claude Design are in every conversation. Ask Claude for a presentation and you get one you can open, edit, and export as PowerPoint or PDF. Same for a document or a design. There's no separate tool to navigate to. They're just in the chat.","createdAt":"2026-09-16T16:28:29.000Z","url":"https://x.com/bcherny/status/2100260544087535639","likes":2285,"retweets":131,"replies":127},{"text":"Claude Code showed that AI could do real work, not just answer questions. Developers hand Claude a feature, come back to shipped code. That's where much of the industry's serious engineering runs now. Cowork proved knowledge workers could do the same: hand Claude the brief, come back to finished files. Today, chat and Cowork start merging into one Claude. The direction: one Claude that carries context across everything you're working on, wherever you are. Simple enough for everyone to access Claude's full capabilities. I've been using this experience every day for the last few weeks, and it feels awesome. Simpler, faster, and more powerful. We're rolling this out slowly. We'll be fine-tunin…","createdAt":"2026-09-16T16:26:08.000Z","url":"https://x.com/bcherny/status/2100259951398789487","likes":1388,"retweets":60,"replies":161}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Sometimes physics can't be cheated","createdAt":"2026-09-16T23:18:15.000Z","url":"https://x.com/thsottiaux/status/2100363668051603608","likes":5415,"retweets":105,"replies":1079},{"text":"Astra ✅ Fast ✅ Frontier ✅ Efficient ✅ For everyone","createdAt":"2026-09-16T18:54:51.000Z","url":"https://x.com/thsottiaux/status/2100297380968997327","likes":4485,"retweets":123,"replies":1318},{"text":"What is ChatGPT","createdAt":"2026-09-16T18:47:10.000Z","url":"https://x.com/thsottiaux/status/2100295443620007993","likes":1913,"retweets":58,"replies":1468}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"Also we love these books that you get - the storytelling in them is much better than bob books and other alternatives.","createdAt":"2026-09-17T01:53:27.000Z","url":"https://x.com/petergyang/status/2100402721803342098","likes":3,"retweets":0,"replies":2},{"text":"My 4.5 year old loves learning to read using @Once_Reading, especially making the silliest faces as part of the photo feature. It's become a nightly ritual for us just like it's been for @clairevo! Plus I have to give a shout out to the founder @SebTurn for being the nicest dude. If you have young kids, I highly recommend giving Once a try for 1 month free here:","createdAt":"2026-09-17T01:53:22.000Z","url":"https://x.com/petergyang/status/2100402704275435872","likes":19,"retweets":3,"replies":4},{"text":"I use these 8 AI skills to produce my entire podcast while still applying my taste and judgment along the way. 1. /podcast-prep does research on the guest and then preps an interview guide. 2. /podcast-edit reviews the raw transcript, then works with me to pick engaging quotes for the intro reel along with moments to cut. 3. /podcast-production orchestrates 5 skills to turn the full episode into 6 different assets. Some people think the latest models make skills redundant but they've been indispensable for me to get AI to follow my specific edit and browser-use instructions. My latest video highlighting how I actually work with these skills is a good watch if you want to automate any manual…","createdAt":"2026-09-16T21:00:15.000Z","url":"https://x.com/petergyang/status/2100328939034128856","likes":25,"retweets":1,"replies":8}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"Safety and security are * features * of your AI product and model - not guardrails that need to be imposed on you from the outside.","createdAt":"2026-09-16T19:55:48.000Z","url":"https://x.com/realmadhuguru/status/2100312717739667963","likes":4,"retweets":0,"replies":1}]},{"name":"Cat Wu","handle":"_catwu","bio":"claude code + cowork @anthropicai, prev: @dagster, @scale_ai","tweets":[{"text":"Today, we are merging Claude Cowork and chat to simplify how you use Claude! We are also integrating Claude Design so that you can ask Claude to make a Slide, Design, or Doc without needing to switch tabs or apps. Many of you shared that you didn't want to choose which Claude product to use for any task. As Claude models have become more capable, we've found that Claude can handle the routing for you. Based on your prompt, Claude will decide whether to give a quick answer or do deeper agentic work, and what kind of output best fits the task. You're in control the whole time: you can still stop, redirect, or exert finer control over Claude's effort or approach. Give it a try and let us know…","createdAt":"2026-09-16T16:28:55.000Z","url":"https://x.com/_catwu/status/2100260655312089562","likes":1206,"retweets":54,"replies":105}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"I think Claude Managed Agents strikes the right balance here, the sandbox is optional and can be spun up independently of the rest of the agent loop. I recently ported an old project that was focused on bash tool calling to CMA and it worked well!","createdAt":"2026-09-16T20:07:01.000Z","url":"https://x.com/trq212/status/2100315538472009897","likes":46,"retweets":1,"replies":6},{"text":"I think increasingly you can just give Claude tools shaped in the way you want vs tricking it with a layer of indirection e.g. for data storage do you really want a file system or do you want an API to a database this is again, an update to me from last year","createdAt":"2026-09-16T20:07:00.000Z","url":"https://x.com/trq212/status/2100315537251463523","likes":63,"retweets":0,"replies":6},{"text":"related to this- I think bash is no longer all you need, if your goal is just reliably tool calling but sandboxes + bash are still good for work that involves code generation & execution","createdAt":"2026-09-16T20:07:00.000Z","url":"https://x.com/trq212/status/2100315535758217422","likes":356,"retweets":13,"replies":50}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"","createdAt":"2026-09-17T00:23:49.000Z","url":"https://x.com/rauchg/status/2100380166811951410","likes":25,"retweets":0,"replies":0},{"text":"We're seeing extraordinary results from @typesafeai. Default mode in 𝚏𝚡 is auto, with a safety reviewer analyzing every command. That reviewer runs on GPT Luna today. Jev is up to 18x faster (p95) *and* more accurate. It's coming to @vercel AI Gateway and likely new default.","createdAt":"2026-09-16T19:36:54.000Z","url":"https://x.com/rauchg/status/2100307962262872105","likes":2855,"retweets":121,"replies":96},{"text":"","createdAt":"2026-09-16T16:28:08.000Z","url":"https://x.com/rauchg/status/2100260457617736051","likes":360,"retweets":3,"replies":29}]},{"name":"Alex Albert","handle":"alexalbert__","bio":"Research @AnthropicAI. Opinions are my own!","tweets":[{"text":"The team did an amazing job with this merge. The resulting UX feels so much better than chat or Cowork did on their own. And the new slides/docs/design integrations work very well.","createdAt":"2026-09-16T18:48:24.000Z","url":"https://x.com/alexalbert__/status/2100295757953917120","likes":182,"retweets":5,"replies":12}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Incredibly exciting that there are entire universes of AI innovation that still exist that weren’t even on most of our radars. Being able to process information insanely quickly, at crazy low costs, with high levels of capability is huge for a wide number of enterprise tasks. Data classification tasks, routing decisions inside of a workflow, decision making when handed a particular domain problem, quick judgment calls about safety or security, and more all are the gates in a large number of processes. This model and approach could be quite cool in agentic workflows in the enterprise.","createdAt":"2026-09-17T04:55:56.000Z","url":"https://x.com/levie/status/2100448648672993540","likes":102,"retweets":7,"replies":20}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Excited to speak at @Supabase Select in conversation with the amazing @kiwicopple about building startups in the time of AI Register for the event and join me:","createdAt":"2026-09-16T22:43:45.000Z","url":"https://x.com/garrytan/status/2100354983053111365","likes":96,"retweets":9,"replies":20},{"text":"I can use any harness I want and it's the same personality and full memory of my personal AGI","createdAt":"2026-09-16T21:41:37.000Z","url":"https://x.com/garrytan/status/2100339347669279149","likes":512,"retweets":14,"replies":52}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Make something people want, then make people want it. Harvard’17. GitHub: YouTube:","tweets":[{"text":"I find myself using Claude less these days because the way it speaks has just become insufferable Like it’s constantly trying to showcase how smart/sophisticated it is, rather than actually communicating a point across","createdAt":"2026-09-16T17:40:50.000Z","url":"https://x.com/zarazhangrui/status/2100278750776824115","likes":1830,"retweets":61,"replies":306}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"Been tinkering with a “Home” @NousResearch agent for a few months and it’s finally gotten really good.. It’s also our first “group” bot where my wife and I interact with it on a daily basis - which has been fun learning especially when it fails 😅. I have tried to recreate with Grok Bot and similar and you can’t get this level of granularity and control (eg only read certain emails, convert in line attachments to structured data or logged in browser sessions) I asked it to share what it does based on the capabilities and our conversations and you can see it’s response below!","createdAt":"2026-09-16T13:18:49.000Z","url":"https://x.com/nikunj/status/2100212813625196917","likes":44,"retweets":0,"replies":8},{"text":"Before she wakes up and corrects me, she never “wanted” it in the first place.. We threatened to make Tiramisu and that’s when her preference spilled out. Sous chef had a great time eating half the batter 😂","createdAt":"2026-09-16T07:00:20.000Z","url":"https://x.com/nikunj/status/2100117565150470652","likes":5,"retweets":0,"replies":0},{"text":"Wife wanted Black Forest cake for her birthday.. I haven’t baked in a long long time, so not perfect but think it turned out ok (thanks @ChatGPT) Happy birthday @shimoleejhaveri - I love you mostest ❤️","createdAt":"2026-09-16T06:53:57.000Z","url":"https://x.com/nikunj/status/2100115958862107100","likes":158,"retweets":0,"replies":17}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"big big big big big","createdAt":"2026-09-16T18:02:02.000Z","url":"https:/ esign, Claude Slides, and Claude Docs are in beta on all paid plans. Read more:","createdAt":"2026-09-16T16:20:20.000Z","url":"https://x.com/claudeai/status/2100258495543071016","likes":462,"retweets":17,"replies":8},{"text":"Fix a line in the doc yourself, leave a comment for Claude on a slide, or select an element and move it. When it's ready, present the deck straight from Claude, export the doc in the format you already use, or share everything at one link.","createdAt":"2026-09-16T16:20:20.000Z","url":"https://x.com/claudeai/status/2100258494221812123","likes":498,"retweets":13,"replies":8},{"text":"You can also now make decks, docs, and designs in your conversation. Draft the one-pager in Claude Docs, turn it into a deck with Claude Slides, and mock up a matching visual in Claude Design, all from one place.","createdAt":"2026-09-16T16:20:20.000Z","url":"https://x.com/claudeai/status/2100258492590207079","likes":3305,"retweets":252,"replies":87}]}]},"errors":[],"partial":false},{"date":"2026-09-17","dateLabel":"2026年09月17日","generatedAt":"2026-09-17T00:00:00+08:00","sourceGeneratedAt":"2026-09-16T06:42:14.459Z","stats":{"podcastEpisodes":1,"xBuilders":14,"totalTweets":27,"blogPosts":1},"highlights":[{"tag":"企业应用层","title":"模型越强，企业工作流层越不会消失","body":"能力升级只解决了任务能否被理解，并没有自动解决企业数据接入、流程重构、人工介入、安全治理和组织变更。模型能处理的任务越复杂，这些衔接工作的失败成本反而越高；应用层的护城河因此不只是包装模型，而是把通用智能稳定地嵌进特定业务。","evidence":[{"quote":"There’s a massive chasm between the power of AI models and the ultimate workflows that enterprises are trying to automate. This gap is the opportunity for the applied AI layer to fill.","attribution":"Aaron Levie（Box CEO）","url":"https://x.com/levie/status/2099976021311398230"},{"quote":"the model could be the most intelligent, super intelligence in the world, but that workflow still requires you to connect up to other data systems, still requires these moments where there's a human in a loop interaction.","attribution":"Aaron Levie（Training Data）","url":"https://www.youtube.com/playlist?list=PLOhHNjZItNnMm5tdW61JpnyxeYH5NDDx8"}]},{"tag":"工具协议","title":"MCP 正从兼容层变成 Agent 的默认集成面","body":"CLI 的优势来自可组合性，但当模型能稳定调用工具、工具可以延迟加载且协议不再依赖会话状态时，MCP 开始直接吸收这部分价值。真正决定集成质量的将不再是是否暴露命令行，而是工具参数能否承载查询、筛选与组合，让模型用更少中间操作得到恰当的数据。","evidence":[{"quote":"I was not expecting things to go this way, but I think MCPs are better than CLIs for most integrations. The models have gotten much better at tool calling, we can defer tools & MCP is now stateless.","attribution":"Thariq（Claude Code）","url":"https://x.com/trq212/status/2099958388230873165"}]},{"tag":"模型分工","title":"不生成文字的模型，会把 AI 评判从昂贵步骤变成基础算子","body":"很多工作流需要的不是一段自然语言，而是在有限选项间给出可比较的置信度。直接输出概率可以绕开文本生成再解析的成本，并让路由、筛选和评分更容易被系统消费；这意味着模型市场会按任务形态继续细分，而不是所有环节都依赖同一种通用生成模型。","evidence":[{"quote":"it doesn't produce words as output, it produces probabilities. so it can efficiently act as a judge in cases where you'd need a Fable-level model—but in our testing was 25x faster and 600x lower priced","attribution":"Dan Shipper（Every CEO）","url":"https://x.com/danshipper/status/2099947471518474522"},{"quote":"if your output domain is known in advance, why not just train a model to produce logprobs over enums?","attribution":"Amjad Masad（Replit CEO）","url":"https://x.com/amasad/status/2100056178705514703"}]},{"tag":"产品扩散","title":"AI 产品的扩散瓶颈，正从能力供给转向可直接采用的工作流","body":"把 AI 放进用户已有工具只是入口，真正降低采用门槛的是把常见任务预先组织成可运行的流程，并用培训帮助用户完成第一次价值兑现。连接器、工作流模板与线下支持一起出现，说明竞争焦点正在从“用户能问什么”转向“用户接入后立刻能完成什么”。","evidence":[{"quote":"Claude for Small Business now includes 43 workflows and 27 new integrations with tools small businesses already use, including Shopify, Salesforce, TikTok, Atlassian, Zoom, Xero, Gusto, Square, Stripe, and Zapier.","attribution":"Claude Blog","url":"https://claude.com/blog/claude-for-small-business-launches-new-workflows-integrations-and-training-programs"},{"quote":"Salesforce in Claude is now available in beta. It brings your accounts, opportunities, and pipeline into Claude, with 37 pre-built sales skills.","attribution":"Claude","url":"https://x.com/claudeai/status/2099876514330206578"}]}],"matters":[{"kind":"学习工具","title":"Gemini Notebook 加入实时语音问答与课堂录音","detail":"Josh Woodward 介绍，学生可用近百种语言围绕课堂材料进行实时语音问答，也可录制讲座和笔记并自动保存到指定 notebook。","url":"https://x.com/joshwoodward/status/2099921866014306633"},{"kind":"开放研发","title":"Vercel Labs 把研究过程和失败实验一起公开","detail":"Guillermo Rauch 宣布 Vercel Labs 成为公开研究与实验入口，用于展示团队支持的项目、研究方向以及没有奏效的实验。","url":"https://x.com/rauchg/status/2099911447598059812"},{"kind":"Web 平台","title":"Safari 27 的 JSPI 让同步 WebAssembly 代码可等待异步 Promise","detail":"Guillermo Rauch 指出，libfx 已借助该能力通过浏览器内建 fetch 发起 API 调用，并判断 WebAssembly 会随更多原生代码进入 Web 而扩大作用。","url":"https://x.com/rauchg/status/2099974859023683975"},{"kind":"开发效率","title":"同一批前沿模型，编排层仍能显著改变修复速度","detail":"Garry Tan 表示，在 GStack/GBrain 的问题与 PR 修复流程中使用 capy.ai 后，原本用 Codex 或 Claude Code 约需一天的工作缩短到大约一半时间。","url":"https://x.com/garrytan/status/2099964487667454097"},{"kind":"创业财务","title":"融资应放大业务，而不应成为公司的生存前提","detail":"Nikunj Kothari 建议创始人先设计无需下一轮融资也能存续的默认路径，再分别推演资本充裕与紧缺时业务会如何变化。","url":"https://x.com/nikunj/status/2100008917980102863"}],"sources":{"podcasts":[{"title":"Box's Aaron Levie: On Reinventing Yourself in the AI Age and Enterprise Diffusion","name":"Training Data","publishedAt":"2026-09-15T09:00:00.000Z","url":"https://www.youtube.com/playlist?list=PLOhHNjZItNnMm5tdW61JpnyxeYH5NDDx8","excerpts":["I wanna send an emergency alert to, like, everybody who's, like, a sophomore or junior in college and just be, like, follow these 20 accounts","I agree. And also join Twitter because, like, this will just help your career. You're either, like, a year ahead or a year behind simply based on your feed. And my feed is like so so wired in. I'll still talk to to 20 year olds that are like, yeah, like, you know, I I I see some articles and I'm like, what do mean?","How do you see articles? Like, I don't even know what that means. Like, do you just, like, get lucky that somebody emailed you an article? You just have to be wired in. I I enjoy it."]}],"blogs":[{"title":"Claude for Small Business launches new workflows, integrations, and training programs","source":"blog","publishedAt":"Sep 15, 2026","url":"https://claude.com/blog/claude-for-small-business-launches-new-workflows-integrations-and-training-programs","summary":""}],"x":[{"name":"Josh Woodward","handle":"joshwoodward","bio":"VP, @Google @GoogleLabs @GeminiApp @GoogleAIStudio","tweets":[{"text":"The offer","createdAt":"2026-09-15T18:02:42.000Z","url":"https://x.com/joshwoodward/status/2099921868652482741","likes":11,"retweets":0,"replies":2},{"text":"The features","createdAt":"2026-09-15T18:02:42.000Z","url":"https://x.com/joshwoodward/status/2099921867331235956","likes":30,"retweets":2,"replies":3},{"text":"New updates in @Gemini_Notebook for students, my 2 favorites: 1) Have a live, spoken Q&A with your class materials in ~100 languages 2) Record lectures and notes on the go, the audio notes save automatically into your chosen notebook As a university student, you can also still get a free Google AI Plan in 140+ countries for bigger limits and access to more Google products!","createdAt":"2026-09-15T18:02:42.000Z","url":"https://x.com/joshwoodward/status/2099921866014306633","likes":329,"retweets":19,"replies":22}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"2026 is the year of efficiency and Tuesday is for random swag drops on your door handle","createdAt":"2026-09-15T18:06:14.000Z","url":"https://x.com/thsottiaux/status/2099922755655479624","likes":4885,"retweets":63,"replies":1200}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"Thank you all for your replies! Just sent @bot codes to a bunch of you — a few use cases that stood out: For growth & clients: → Find leads, draft outreach, and turn wins into case studies @kouroshbaloo → Build a competitor comparison matrix with sources @PaulWeissAI For ops & shipping: → Monitor hundreds of ad accounts and catch broken signup/payment flows @yashjain10k → Watch Jira, flag blockers, and draft the weekly status update @partykma → Triage support tickets, draft replies, and escalate with full context @jurlycat → For hotel owners: regularly test the booking flow so website booking errors get caught @LeenCanvas → Automate paperwork and back-office workflows for an electrical cont…","createdAt":"2026-09-16T01:02:24.000Z","url":"https://x.com/petergyang/status/2100027487681953834","likes":4,"retweets":0,"replies":0},{"text":"My attempt to get Muse to negotiate my Xfinity cable bill has sadly failed","createdAt":"2026-09-15T21:49:07.000Z","url":"https://x.com/petergyang/status/2099978848255533280","likes":36,"retweets":0,"replies":18},{"text":"The Grok @bot team asked me if I had any advice for solopreneurs. I’ve only been doing this full time for three months, but my advice is to design your business so you can spend more time doing work you actually enjoy. There will always be choices that could make more money. But if those choices leave you doing work you don’t enjoy, then that defeats the purpose of becoming a solopreneur in the first place. Delegate that boring work to your bots instead or just don't do it :) Was super fun joining the @SpaceXAI live stream this morning, the team is still going strong here:","createdAt":"2026-09-15T21:09:35.000Z","url":"https://x.com/petergyang/status/2099968897323778416","likes":147,"retweets":3,"replies":25}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"I was not expecting things to go this way, but I think MCPs are better than CLIs for most integrations. The models have gotten much better at tool calling, we can defer tools & MCP is now stateless. If you need to compose/filter data, add params like query to your MCP tools.","createdAt":"2026-09-15T20:27:49.000Z","url":"https://x.com/trq212/status/2099958388230873165","likes":2429,"retweets":109,"replies":209}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"This is cool, but if your output domain is known in advance, why not just train a model to produce logprobs over enums?","createdAt":"2026-09-16T02:56:24.000Z","url":"https://x.com/amasad/status/2100056178705514703","likes":326,"retweets":7,"replies":40},{"text":"If you’re curious about Effective Altruism, the origins of the cult, their tactics, and their influence network — check out my conversation with Tucker from two years ago:","createdAt":"2026-09-16T02:14:39.000Z","url":"https://x.com/amasad/status/2100045670845763791","likes":646,"retweets":49,"replies":26},{"text":"The AI naming curse strikes again. “AI Safety” firm made AI unsafe. “Effective Altruists” are both ineffective and enabling criminal activity. “Irregular” is regularly incompetent.","createdAt":"2026-09-15T07:21:12.000Z","url":"https://x.com/amasad/status/2099760428314411232","likes":659,"retweets":70,"replies":33}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Safari 27 supports JSPI, a magic WebAssembly capability for sync native code to suspend on an async 𝙿𝚛𝚘𝚖𝚒𝚜𝚎. On libfx uses the built-in browser 𝚏𝚎𝚝𝚌𝚑 stack to make API calls. As more code goes native, I expect WebAssembly to play a huge role in the future of the web.","createdAt":"2026-09-15T21:33:16.000Z","url":"https://x.com/rauchg/status/2099974859023683975","likes":284,"retweets":15,"replies":25},{"text":"Excited to formally introduce Vercel Labs. is the home for the in-public research and experimentation arm of Vercel. 247 million downloads in, we wanted to, also in public, share what we're supporting, what we're researching, and what experiments didn't pan out. Kudos to @ctatedev and @cramforce for shaping this great initiative and iterating in public.","createdAt":"2026-09-15T17:21:18.000Z","url":"https://x.com/rauchg/status/2099911447598059812","likes":1080,"retweets":47,"replies":66},{"text":"The future is multi-model. Trying to hide the choice confuses and hurts customers, who can't participate in the upside of the most exciting market competition of our times, nor master the best tool for the job.","createdAt":"2026-09-15T16:58:37.000Z","url":"https://x.com/rauchg/status/2099905740505055680","likes":380,"retweets":10,"replies":35}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"There’s a massive chasm between the power of AI models and the ultimate workflows that enterprises are trying to automate. This gap is the opportunity for the applied AI layer to fill. You need to connect the intelligence to workflows, often reengineer processes, aggregate the right context and data, allow for the right human in the loop experiences, drive change management, do domain specific evals, manage the security and governance of the data and process, and much more. We’re going to see this layer emerge in every vertical and horizontal category. And ironically, even as models improve at incredible rates, this layer still must exist - and may become even more important and useful. Gre…","createdAt":"2026-09-15T21:37:53.000Z","url":"https://x.com/levie/status/2099976021311398230","likes":203,"retweets":27,"replies":36}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"I think Muse is going to win tbh","createdAt":"2026-09-15T21:57:34.000Z","url":"https://x.com/garrytan/status/2099980972641124629","likes":1543,"retweets":53,"replies":120},{"text":"I just started using @capydotai with GStack/GBrain on some fix waves on outstanding issues/PRs and it did what would have taken a day with raw Codex/Claude Code in about half as much time, using the same frontier models. I'm amazed.","createdAt":"2026-09-15T20:52:03.000Z","url":"https://x.com/garrytan/status/2099964487667454097","likes":247,"retweets":23,"replies":36},{"text":"Interesting to realize this peptides boom didn't start in SF but rather the midwest in bodybuilding subcultures I recently started using peptides with @Ronan_RX and I've lost 18 lbs in two months!","createdAt":"2026-09-15T19:46:51.000Z","url":"https://x.com/garrytan/status/2099948078606520676","likes":183,"retweets":5,"replies":34}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"I’m meeting one too many founders who think the money spigot will magically flow and the next round will happen no matter what.. Capital is a weapon for acceleration. Used well you’re unbeatable. If you are so dependent on it, a simple downturn can lead to not so great consequences. If you don’t believe me, a simple prompt asking for this history will suffice. So been sharing this with a lot of the founders we advise: figure out the default path that ensures the survival of your company and a great self fulfilling business. And then figure out scenarios where abundant (or lack of) capital and what it does to your business. The only constant is change and we don’t know how capital markets ev…","createdAt":"2026-09-15T23:48:36.000Z","url":"https://x.com/nikunj/status/2100008917980102863","likes":68,"retweets":0,"replies":9}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"Excited to have you on board, Graham!","createdAt":"2026-09-15T20:34:33.000Z","url":"https://x.com/steipete/status/2099960081207242808","likes":241,"retweets":8,"replies":9}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"we almost never test new foundation models but we've been testing this for ~a week @every and it's pretty wild. the kind of things that will be obviously indispensible in 6-12 months it doesn't produce words as output, it produces probabilities. so it can efficiently act as a judge in cases where you'd need a Fable-level model—but in our testing was 25x faster and 600x lower priced excellent vibe check by @hammer_mt on @every:","createdAt":"2026-09-15T19:44:27.000Z","url":"https://x.com/danshipper/status/2099947471518474522","likes":1491,"retweets":74,"replies":50}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"More on why we invested in @profound from the beginning:","createdAt":"2026-09-15T19:13:31.000Z","url":"https://x.com/adityaag/status/2099939689738191146","likes":9,"retweets":0,"replies":0},{"text":"People ask what we saw in @profound before there was a Profound to see. It's now worth $1.8B. One third of the Fortune 100 runs on it. We didn't find the company. We watched it form. @thejamescad and @dbabbs met at @spc. Opposite worlds: an Uber maps engineer and a founder with no college degree who willed businesses into existence. Neither arrived with the idea. The partnership formed first. Profound has now evolved to become the fastest-growing AI marketing platform. We've invested in every round since the beginning and are proud to congratulate the team on their $180M Series D, co-led by @sequoia and @kleinerperkins with participation from @lightspeedvp, @khoslaventures, @Saga_Ventures,…","createdAt":"2026-09-15T19:13:30.000Z","url":"https://x.com/adityaag/status/2099939685657141257","likes":97,"retweets":12,"replies":8},{"text":"Profound started at @spc. We're proud to be a part of the journey. Onwards.","createdAt":"2026-09-15T16:58:19.000Z","url":"https://x.com/adityaag/status/2099905666324312141","likes":80,"retweets":5,"replies":2}]},{"name":"Sam Altman","handle":"sama","bio":"The mission of OpenAI is to ensure that AGI benefits all of humanity","tweets":[{"text":"big 🚢 this week and then for devday 🚢🚢🚢🚢🚢🚢","createdAt":"2026-09-15T14:46:56.000Z","url":"https://x.com/sama/status/2099872600977760451","likes":12219,"retweets":545,"replies":1004}]},{"name":"Claude","handle":"claudeai","bio":"Claude is an AI assistant built by @anthropicai to be safe, accurate, and secure. Talk to Claude on or download the app.","tweets":[{"text":"Learn more about Salesforce in Claude:","createdAt":"2026-09-15T15:02:29.000Z","url":"https://x.com/claudeai/status/2099876515840245772","likes":237,"retweets":23,"replies":12},{"text":"Salesforce in Claude is now available in beta. It brings your accounts, opportunities, and pipeline into Claude, with 37 pre-built sales skills. Prep a call, review a deal, create a pipeline dashboard, or send your forecast without leaving the conversation.","createdAt":"2026-09-15T15:02:29.000Z","url":"https://x.com/claudeai/status/2099876514330206578","likes":8891,"retweets":634,"replies":285}]}]},"errors":[],"partial":false},{"date":"2026-09-16","dateLabel":"2026年09月16日","generatedAt":"2026-09-16T00:00:00+08:00","sourceGeneratedAt":"2026-09-15T06:42:09.351Z","stats":{"podcastEpisodes":1,"xBuilders":12,"totalTweets":23,"blogPosts":4},"highlights":[{"tag":"Agent 架构","title":"能跨模型迭代的 Agent 平台，核心资产是稳定接口而不是固定 harness","body":"模型能力变化会迅速让旧的补偿机制从必要设计变成冗余负担。把会话、执行环境和编排逻辑拆成可替换组件，能让系统在模型升级、进程故障或执行环境变化时继续运转；Agent 基础设施的长期价值因此更接近操作系统抽象，而不是某一代模型的最佳提示词与循环。","evidence":[{"quote":"A common thread across this work is that harnesses encode assumptions about what Claude can’t do on its own. However, those assumptions need to be frequently questioned because they can go stale as models improve.","attribution":"Anthropic Engineering","url":"https://www.anthropic.com/engineering/managed-agents"},{"quote":"Agents are the next frontier, and they require new compute primitives designed for them.","attribution":"Guillermo Rauch（Vercel CEO）","url":"https://x.com/rauchg/status/2099514906366328902"}]},{"tag":"安全边界","title":"高频 Agent 的安全不能继续押注用户逐次点确认","body":"当 Agent 调用量和后台任务规模上升，权限弹窗会因重复出现而失去监督作用。更可靠的路径是从交互提醒转向结构性隔离：让凭证离开执行沙箱，并按数据分类与异常行为限制访问。这样安全才不必以彻底锁死生产力为代价。","evidence":[{"quote":"Our telemetry showed users approved roughly 93% of permission prompts. The more approvals a user sees, the less attention they pay to each, becoming over time much less diligent in their supervision.","attribution":"Anthropic Engineering","url":"https://www.anthropic.com/engineering/how-we-contain-claude"},{"quote":"The structural fix was to make sure the tokens are never reachable from the sandbox where Claude’s generated code runs.","attribution":"Anthropic Engineering","url":"https://www.anthropic.com/engineering/managed-agents"},{"quote":"If you give an agent too much unfettered information access, it will be difficult to truly control and protect your data; and conversely, if you lock everything down completely, you won’t get any real productivity gains from AI.","attribution":"Aaron Levie（Box CEO）","url":"https://x.com/levie/status/2099550035239424465"}]},{"tag":"协作界面","title":"Agent 的下一层产品价值，是把过程自动变成可核验的共享界面","body":"Agent 执行得更久、更复杂后，团队协作的瓶颈会从“让它完成任务”转向“让别人快速理解并验证结果”。由会话上下文持续生成同址更新、可回溯的页面，把状态同步、证据组织和交付物合并为一个对象；配合编译器、类型系统和 lint 等校验器，产出才真正进入团队工作流。","evidence":[{"quote":"Artifacts translate the work into a web page anyone can open and explore, like a pull request walkthrough, a dashboard you can filter and sort, or even a release checklist that fills itself out as work gets done.","attribution":"Claude Blog","url":"https://claude.com/blog/artifacts-in-claude-code"},{"quote":"Agents are only as good as the proof-checkers, compilers, type systems, and linters you give them.","attribution":"Guillermo Rauch（Vercel CEO）","url":"https://x.com/rauchg/status/2099540886409695346"}]},{"tag":"内容生产","title":"AI 写作的差异化正在从遣词造句迁移到私有输入的质量","body":"当组织能够把语气、结构和流程编码进上下文，文字组装会越来越容易复制；真正稀缺的是模型知识之外的新鲜材料，包括一手经验、专有研究和明确受众。写作者的角色不是退出创作，而是把精力从句子生产转向选材、判断与最后一公里的现实校准。","evidence":[{"quote":"But inputs are really what makes the writing unique.","attribution":"Katie Parrott（Every，AI & I Podcast）","url":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL"},{"quote":"But then what the model already knows is commoditized information. Like, that's not useful or interesting.","attribution":"Katie Parrott（Every，AI & I Podcast）","url":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL"}]}],"matters":[{"kind":"生态扩展","title":"Claude Mods 开始落地社区玩法","detail":"Boris Cherny 表示 Claude Mods 正在推出，社区已做出可在 Claude 中运行的俄罗斯方块 mod。","url":"https://x.com/bcherny/status/2099551291601248485"},{"kind":"用户共创","title":"Gemini 用 power user 小组提前测试个性化能力","detail":"Josh Woodward 称首批小组已测试二十多项功能，新一批成员将提前体验 Daily Brief 与 Personal Intelligence 的后续能力。","url":"https://x.com/joshwoodward/status/2099558443078365287"},{"kind":"产品取舍","title":"Codex 团队公开征集应被删除的旧功能","detail":"Thibault Sottiaux 直接询问哪些 Codex 功能已经无用，释放出用删减而非叠加来控制产品复杂度的信号。","url":"https://x.com/thsottiaux/status/2099393115241300166"},{"kind":"交互形态","title":"语音把 AI 工作流带离桌面","detail":"Peter Yang 表示语音让他能在自然环境中散步时保持生产力，而不必持续盯着屏幕。","url":"https://x.com/petergyang/status/2099677771408846975"},{"kind":"开发体验","title":"长会话工具开始把无缝恢复作为性能能力","detail":"Guillermo Rauch 介绍 fx 可自动升级，并能在重启后恢复对话，同时新版本针对长会话提速。","url":"https://x.com/rauchg/status/2099653035685445760"}],"sources":{"podcasts":[{"title":"How a Professional Writer Writes With AI","name":"AI & I by Every","publishedAt":"2026-09-02T15:01:40.000Z","url":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL","excerpts":["Hey, it's Dan Shipper, and this week I'm excited to share a very special episode of AI and Dive. In this episode, we're previewing the release of an experimental new plugin called Compound Writing, which helps you write with AI the way that we do internally. It's inspired by Kieran Klassen's Compound Engineering, and it's built by one of our staff writers,…","Today we're talking to Katie Parrott, staff writer at Every. Katie, if if you've been following Every for a while now, will be very familiar to you. She's one of our all star writers and we're so excited to learn more about her writing process and her new plug in today.","So good. I am so excited for this conversation. I am revealing myself as a Katie fangirl on on the podcast."]}],"blogs":[{"title":"How we contain Claude across products","source":"blog","publishedAt":null,"url":"https://www.anthropic.com/engineering/how-we-contain-claude","summary":""},{"title":"An update on recent Claude Code quality reports","source":"blog","publishedAt":null,"url":"https://www.anthropic.com/engineering/april-23-postmortem","summary":""},{"title":"Scaling Managed Agents: Decoupling the brain from the hands","source":"blog","publishedAt":null,"url":"https://www.anthropic.com/engineering/managed-agents","summary":""},{"title":"Claude Code now supports artifacts","source":"blog","publishedAt":"Jun 18, 2026","url":"https://claude.com/blog/artifacts-in-claude-code","summary":""}],"x":[{"name":"Josh Woodward","handle":"joshwoodward","bio":"VP, @Google @GoogleLabs @GeminiApp @GoogleAIStudio","tweets":[{"text":"Come design with us!","createdAt":"2026-09-14T19:03:58.000Z","url":"https://x.com/joshwoodward/status/2099574899555930114","likes":181,"retweets":14,"replies":14},{"text":"2 months ago, we launched a Gemini power user group to test early features in the app. 20+ features tested later, your feedback has been incredible. Thank you! A new cohort is now getting early access to what’s next for Daily Brief & Personal Intelligence, and we’ll keep onboarding people. ​Join our community:","createdAt":"2026-09-14T17:58:35.000Z","url":"https://x.com/joshwoodward/status/2099558443078365287","likes":1001,"retweets":58,"replies":104}]},{"name":"Boris Cherny","handle":"bcherny","bio":"Claude Code @anthropicai","tweets":[{"text":"Claude Mods are landing now. Someone already built a Tetris-in-Claude mod 🤯 See issue for the latest community update, technical details, and more cool demos","createdAt":"2026-09-14T17:30:10.000Z","url":"https://x.com/bcherny/status/2099551291601248485","likes":2169,"retweets":140,"replies":243}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"This week will also be a level of ships that you could have expected for DevDay 2025. Crazy","createdAt":"2026-09-15T06:19:47.000Z","url":"https://x.com/thsottiaux/status/2099744972195131850","likes":1488,"retweets":49,"replies":465},{"text":"What’s a feature we should remove from Codex that isn’t useful anymore?","createdAt":"2026-09-14T07:01:38.000Z","url":"https://x.com/thsottiaux/status/2099393115241300166","likes":8017,"retweets":148,"replies":8897}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"Screw it I can't wait to 2030","createdAt":"2026-09-15T03:46:23.000Z","url":"https://x.com/petergyang/status/2099706366327951658","likes":88,"retweets":1,"replies":12},{"text":"Voice has made me more productive going on walks in nature than staring at my screen which is an incredible feeling","createdAt":"2026-09-15T01:52:45.000Z","url":"https://x.com/petergyang/status/2099677771408846975","likes":51,"retweets":1,"replies":2},{"text":"She sounds super cool tbh","createdAt":"2026-09-15T01:14:42.000Z","url":"https://x.com/petergyang/status/2099668196651610556","likes":146,"retweets":6,"replies":10}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"just finished recording on latent space I’m excited about this one- we get very technical about things we haven’t really talked about much yet","createdAt":"2026-09-15T01:26:54.000Z","url":"https://x.com/trq212/status/2099671266068496802","likes":393,"retweets":3,"replies":32},{"text":"I talked to Sid & Robert about building Claude Code: how much things have changed, how hard it's been to keep up with model capabilities and also what we miss about software engineering before AI.","createdAt":"2026-09-14T17:29:34.000Z","url":"https://x.com/trq212/status/2099551141621329994","likes":381,"retweets":39,"replies":48}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"","createdAt":"2026-09-15T06:38:47.000Z","url":"https://x.com/amasad/status/2099749752892186925","likes":6,"retweets":1,"replies":1}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"One of the coolest things about 𝚏𝚡 is that it auto-upgrades, and 𝚌𝚝𝚛𝚕+𝚐 restarts + resumes the chat. Also, that 0.0.10 is much, much faster for longer sessions 😊","createdAt":"2026-09-15T00:14:28.000Z","url":"https://x.com/rauchg/status/2099653035685445760","likes":200,"retweets":3,"replies":29},{"text":"Agents are only as good as the proof-checkers, compilers, type systems, and linters you give them. 𝚜𝚑𝚊𝚍𝚌𝚗/𝚕𝚒𝚗𝚝 helps agents stay on track with the rules of your design system. Meta: verifiers + skills are the new 'frameworks'!","createdAt":"2026-09-14T16:48:49.000Z","url":"https://x.com/rauchg/status/2099540886409695346","likes":1182,"retweets":37,"replies":71},{"text":"Welcoming Steren, creator of Google Cloud Run, to Vercel. He will lead the Fluid family of compute products (Functions, Containers, Sandbox, Builds). Serverless was the last chapter of the cloud, and Steren helped define the paradigm at Google. Agents are the next frontier, and they require new compute primitives designed for them. Excited for Steren to lead this transition once again.","createdAt":"2026-09-14T15:05:35.000Z","url":"https://x.com/rauchg/status/2099514906366328902","likes":1935,"retweets":41,"replies":83}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"We probably need to all update our sense of what’s coming in terms of agentic workloads with the combination of agent swarms, better computer use, the next wave of APIs and MCPs coming online, and new form factors like Muse or Instinct, vertical enterprise agents, background workflow agents, and other products that are emerging right now. We’re going to throw agents at vastly more tasks in our professional and personal lives than we had initially imagined. The kind of information that agents will go out and find for us and do work for us in the background is going to be 100X more volume than what we can imagine previously prompting in a single session. You’re going to have agents go out and…","createdAt":"2026-09-15T05:56:08.000Z","url":"https://x.com/levie/status/2099739019517235618","likes":91,"retweets":8,"replies":24},{"text":"Protecting enterprise data in a world where agents are using our systems 100X more than people ever did is going to be one of the more complex security and governance challenges of the 21st century. Importantly, security and productivity gains are inexorably linked in the world of AI. If you give an agent too much unfettered information access, it will be difficult to truly control and protect your data; and conversely, if you lock everything down completely, you won’t get any real productivity gains from AI. We need all new ways to protect our systems, environments, and structured and unstructured dada in the enterprise in an intelligent way by modernizing our approach to security and gove…","createdAt":"2026-09-14T17:25:10.000Z","url":"https://x.com/levie/status/2099550035239424465","likes":68,"retweets":11,"replies":33}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"Ramp’s brand marketing is just genius at this point - an actual Broadway musical about bills is… unhinged in the best possible way lol (👏@eglyman and team… no CMO)","createdAt":"2026-09-14T23:00:19.000Z","url":"https://x.com/mattturck/status/2099634379093848156","likes":26,"retweets":0,"replies":4},{"text":"Ok, this was a fun weekend, but we all understand AI progress is not going to slow down, right? Too many players, too many economic incentives and too much prisoner's dilemma, both domestically and globally.","createdAt":"2026-09-14T20:00:48.000Z","url":"https://x.com/mattturck/status/2099589199104033031","likes":34,"retweets":3,"replies":11}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"I have been obsessed with closed payment loops for a LONG time, and have been looking to find a company trying to solve a real problem.. excited to finally back Piston (piston dot com) ⛽️ USA alone spends hundreds of billions in fuel. Most of that spend comes through cards (credit, fuel, or sometime house cards). However, a lot of these cards are not even tied to a particular driver. They often get stolen, skimmed, or misused. The fleet owner then has to eat the fraud and then spend a long time reconciling what exactly happened. The gas station has to pay interchange fees to accept the card, but has no relationship with the fleets on the other side. And a lot of companies have come and gone…","createdAt":"2026-09-14T22:47:28.000Z","url":"https://x.com/nikunj/status/2099631145268969840","likes":9,"retweets":1,"replies":2},{"text":"PSA to the new Dreamforce visitors.. Lyft bike is way way faster for your intra city commutes than spending hours stuck in a Waymo / Uber. The dedicated bike lanes in SOMA make this a breeze. Just like open source models you get 90% of the value for 10% of the time!","createdAt":"2026-09-14T16:31:09.000Z","url":"https://x.com/nikunj/status/2099536440006955445","likes":54,"retweets":0,"replies":7}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"This is so useful. pushing to add this to codex as well.","createdAt":"2026-09-14T18:52:12.000Z","url":"https://x.com/steipete/status/2099571935495827761","likes":655,"retweets":19,"replies":53}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"Seriously you'll want to see this for yourself","createdAt":"2026-09-14T19:10:06.000Z","url":"https://x.com/adityaag/status/2099576440413184148","likes":2,"retweets":0,"replies":0},{"text":"This is an incredible demo. AI can be human. That is the ultimate goal. So proud to have been their earliest partner. As always, a lot more to build.","createdAt":"2026-09-14T16:05:24.000Z","url":"https://x.com/adityaag/status/2099529959262019887","likes":118,"retweets":6,"replies":7}]}]},"errors":[],"partial":false},{"date":"2026-09-15","dateLabel":"2026年09月15日","generatedAt":"2026-09-15T00:00:00+08:00","sourceGeneratedAt":"2026-09-14T06:51:58.098Z","stats":{"podcastEpisodes":1,"xBuilders":15,"totalTweets":24,"blogPosts":0},"highlights":[{"tag":"治理机制","title":"前沿 AI 安全正在从发布门槛前移为训练门槛","body":"安全治理的关键节点正在改变：如果高风险能力是在训练过程中形成，只在模型发布前评估就已经太晚。把 safety case 放到重要强化学习训练之前，意味着实验是否启动也要接受结构化论证；这会增加研发成本，却能让风险控制真正跟上能力产生的节奏，而不是在成品阶段补救。","evidence":[{"quote":"At OpenAI we now formulate explicit safety cases in advance of frontier reinforcement learning runs we expect to significantly increase capability, in addition to the safety work we have long done in advance of model releases.","attribution":"Sam Altman（OpenAI CEO）","url":"https://x.com/sama/status/2099348812305473766"},{"quote":"AI development likely shouldn’t be that different ... we want these systems to be safe and ‘aligned’. How we get
