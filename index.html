lks in nature than staring at my screen which is an incredible feeling","createdAt":"2026-09-15T01:52:45.000Z","url":"https://x.com/petergyang/status/2099677771408846975","likes":51,"retweets":1,"replies":2},{"text":"She sounds super cool tbh","createdAt":"2026-09-15T01:14:42.000Z","url":"https://x.com/petergyang/status/2099668196651610556","likes":146,"retweets":6,"replies":10}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"just finished recording on latent space I’m excited about this one- we get very technical about things we haven’t really talked about much yet","createdAt":"2026-09-15T01:26:54.000Z","url":"https://x.com/trq212/status/2099671266068496802","likes":393,"retweets":3,"replies":32},{"text":"I talked to Sid & Robert about building Claude Code: how much things have changed, how hard it's been to keep up with model capabilities and also what we miss about software engineering before AI.","createdAt":"2026-09-14T17:29:34.000Z","url":"https://x.com/trq212/status/2099551141621329994","likes":381,"retweets":39,"replies":48}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"","createdAt":"2026-09-15T06:38:47.000Z","url":"https://x.com/amasad/status/2099749752892186925","likes":6,"retweets":1,"replies":1}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"One of the coolest things about 𝚏𝚡 is that it auto-upgrades, and 𝚌𝚝𝚛𝚕+𝚐 restarts + resumes the chat. Also, that 0.0.10 is much, much faster for longer sessions 😊","createdAt":"2026-09-15T00:14:28.000Z","url":"https://x.com/rauchg/status/2099653035685445760","likes":200,"retweets":3,"replies":29},{"text":"Agents are only as good as the proof-checkers, compilers, type systems, and linters you give them. 𝚜𝚑𝚊𝚍𝚌𝚗/𝚕𝚒𝚗𝚝 helps agents stay on track with the rules of your design system. Meta: verifiers + skills are the new 'frameworks'!","createdAt":"2026-09-14T16:48:49.000Z","url":"https://x.com/rauchg/status/2099540886409695346","likes":1182,"retweets":37,"replies":71},{"text":"Welcoming Steren, creator of Google Cloud Run, to Vercel. He will lead the Fluid family of compute products (Functions, Containers, Sandbox, Builds). Serverless was the last chapter of the cloud, and Steren helped define the paradigm at Google. Agents are the next frontier, and they require new compute primitives designed for them. Excited for Steren to lead this transition once again.","createdAt":"2026-09-14T15:05:35.000Z","url":"https://x.com/rauchg/status/2099514906366328902","likes":1935,"retweets":41,"replies":83}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"We probably need to all update our sense of what’s coming in terms of agentic workloads with the combination of agent swarms, better computer use, the next wave of APIs and MCPs coming online, and new form factors like Muse or Instinct, vertical enterprise agents, background workflow agents, and other products that are emerging right now. We’re going to throw agents at vastly more tasks in our professional and personal lives than we had initially imagined. The kind of information that agents will go out and find for us and do work for us in the background is going to be 100X more volume than what we can imagine previously prompting in a single session. You’re going to have agents go out and…","createdAt":"2026-09-15T05:56:08.000Z","url":"https://x.com/levie/status/2099739019517235618","likes":91,"retweets":8,"replies":24},{"text":"Protecting enterprise data in a world where agents are using our systems 100X more than people ever did is going to be one of the more complex security and governance challenges of the 21st century. Importantly, security and productivity gains are inexorably linked in the world of AI. If you give an agent too much unfettered information access, it will be difficult to truly control and protect your data; and conversely, if you lock everything down completely, you won’t get any real productivity gains from AI. We need all new ways to protect our systems, environments, and structured and unstructured dada in the enterprise in an intelligent way by modernizing our approach to security and gove…","createdAt":"2026-09-14T17:25:10.000Z","url":"https://x.com/levie/status/2099550035239424465","likes":68,"retweets":11,"replies":33}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"Ramp’s brand marketing is just genius at this point - an actual Broadway musical about bills is… unhinged in the best possible way lol (👏@eglyman and team… no CMO)","createdAt":"2026-09-14T23:00:19.000Z","url":"https://x.com/mattturck/status/2099634379093848156","likes":26,"retweets":0,"replies":4},{"text":"Ok, this was a fun weekend, but we all understand AI progress is not going to slow down, right? Too many players, too many economic incentives and too much prisoner's dilemma, both domestically and globally.","createdAt":"2026-09-14T20:00:48.000Z","url":"https://x.com/mattturck/status/2099589199104033031","likes":34,"retweets":3,"replies":11}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"I have been obsessed with closed payment loops for a LONG time, and have been looking to find a company trying to solve a real problem.. excited to finally back Piston (piston dot com) ⛽️ USA alone spends hundreds of billions in fuel. Most of that spend comes through cards (credit, fuel, or sometime house cards). However, a lot of these cards are not even tied to a particular driver. They often get stolen, skimmed, or misused. The fleet owner then has to eat the fraud and then spend a long time reconciling what exactly happened. The gas station has to pay interchange fees to accept the card, but has no relationship with the fleets on the other side. And a lot of companies have come and gone…","createdAt":"2026-09-14T22:47:28.000Z","url":"https://x.com/nikunj/status/2099631145268969840","likes":9,"retweets":1,"replies":2},{"text":"PSA to the new Dreamforce visitors.. Lyft bike is way way faster for your intra city commutes than spending hours stuck in a Waymo / Uber. The dedicated bike lanes in SOMA make this a breeze. Just like open source models you get 90% of the value for 10% of the time!","createdAt":"2026-09-14T16:31:09.000Z","url":"https://x.com/nikunj/status/2099536440006955445","likes":54,"retweets":0,"replies":7}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"This is so useful. pushing to add this to codex as well.","createdAt":"2026-09-14T18:52:12.000Z","url":"https://x.com/steipete/status/2099571935495827761","likes":655,"retweets":19,"replies":53}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"Seriously you'll want to see this for yourself","createdAt":"2026-09-14T19:10:06.000Z","url":"https://x.com/adityaag/status/2099576440413184148","likes":2,"retweets":0,"replies":0},{"text":"This is an incredible demo. AI can be human. That is the ultimate goal. So proud to have been their earliest partner. As always, a lot more to build.","createdAt":"2026-09-14T16:05:24.000Z","url":"https://x.com/adityaag/status/2099529959262019887","likes":118,"retweets":6,"replies":7}]}]},"errors":[],"partial":false},{"date":"2026-09-15","dateLabel":"2026年09月15日","generatedAt":"2026-09-15T00:00:00+08:00","sourceGeneratedAt":"2026-09-14T06:51:58.098Z","stats":{"podcastEpisodes":1,"xBuilders":15,"totalTweets":24,"blogPosts":0},"highlights":[{"tag":"治理机制","title":"前沿 AI 安全正在从发布门槛前移为训练门槛","body":"安全治理的关键节点正在改变：如果高风险能力是在训练过程中形成，只在模型发布前评估就已经太晚。把 safety case 放到重要强化学习训练之前，意味着实验是否启动也要接受结构化论证；这会增加研发成本，却能让风险控制真正跟上能力产生的节奏，而不是在成品阶段补救。","evidence":[{"quote":"At OpenAI we now formulate explicit safety cases in advance of frontier reinforcement learning runs we expect to significantly increase capability, in addition to the safety work we have long done in advance of model releases.","attribution":"Sam Altman（OpenAI CEO）","url":"https://x.com/sama/status/2099348812305473766"},{"quote":"AI development likely shouldn’t be that different ... we want these systems to be safe and ‘aligned’. How we get there -without meaningfully slowing down innovation progress or reducing competition- is one of the most complex questions in the 21st century","attribution":"Aaron Levie（Box CEO）","url":"https://x.com/levie/status/2099167992835924301"}]},{"tag":"工程资产","title":"AI 进入深水工程后，文档和测试资产比代码存量更像护城河","body":"通用模型在公开资料充足的验证、调试和文档环节更快兑现价值，却在高度专有的 RTL 生成与物理实现上受限。这说明企业部署工程 AI 的上限，不只取决于模型能力，还取决于内部知识是否可解释、可测试、可用于训练；长期被视为维护成本的文档和 test bench，正在变成可计算的战略资产。","evidence":[{"quote":"The largest amount of time is in the verification, the validation, the debug, the documentation, etcetera, etcetera. AI is really good at that.","attribution":"Rene Haas（Arm CEO，No Priors）","url":"https://www.youtube.com/@NoPriorsPodcast"},{"quote":"If it's unusable and untestable, it's actually untrainable. And if it's untrainable, it's not usable for AI.","attribution":"Rene Haas（Arm CEO，No Priors）","url":"https://www.youtube.com/@NoPriorsPodcast"}]},{"tag":"Agent 交互","title":"会认错但不继续执行，是 Agent 比答错更致命的断点","body":"用户纠正 Agent 时，真正表达的是新的执行意图，而不是邀请它复述共识。模型若只口头接受却停在原地，会迫使用户再次下令，破坏连续协作感。成熟的 Agent 交互需要把纠正自动转成下一步动作，同时保留必要的风险判断；衡量标准也应从‘是否理解反馈’升级为‘是否完成修正闭环’。","evidence":[{"quote":"Astra: You're right. I should do Y ... Why doesn't it just go and do Y, like the other models??","attribution":"Zara Zhang（Builder）","url":"https
