    const DIGESTS = [{"date":"2026-10-01","dateLabel":"2026年10月01日","generatedAt":"2026-10-01T00:00:00+08:00","sourceGeneratedAt":"2026-09-30T06:45:24.816Z","stats":{"podcastEpisodes":0,"xBuilders":14,"totalTweets":32,"blogPosts":1},"highlights":[{"tag":"Agent 产品","title":"常驻型 Agent 的冷启动资产不是技能列表，而是对用户的持续理解","body":"当 AI 从一次性对话变成全天候代办者，决定体验上限的会是它能否积累偏好、关注事项与委托边界。先让单个 Agent 在真实使用中形成稳定的个人上下文，再扩展为多 Agent 团队，可以减少错误被并行放大的风险；产品竞争也会从首次演示效果，转向几天使用后是否明显更贴合用户。","evidence":[{"quote":"A new way to use AI that works 24/7 for you; get more of your time and attention back to work at a higher level.","attribution":"Sam Altman，OpenAI CEO","url":"https://x.com/sama/status/2104995014208258235"},{"quote":"Personally I felt a jump after 2-3 days of use after teaching it more about my preferences and things on my mind.","attribution":"Thibault Sottiaux，OpenAI Codex 与 ChatGPT 团队","url":"https://x.com/thsottiaux/status/2105105086506840421"}]},{"tag":"竞争壁垒","title":"模型趋同时，产品护城河会碎成上千个不可见的小决策","body":"前沿能力可以通过更好的执行框架以更低成本被逼近，这会削弱单纯依赖模型领先的优势。但 harness 也不是一个可复制的功能点，而是产品、工程和商业动作长期叠加出的系统：每个改进都不显眼，组合起来却决定任务成功率。创业团队真正需要经营的，是快速发现这些细节并持续重组它们的能力。","evidence":[{"quote":"How to design and build a harness to reach frontier performance at a fraction of the cost!","attribution":"Amjad Masad，Replit CEO","url":"https://x.com/amasad/status/2104996638817386820"},{"quote":"the harness is like a thousand small things done well. And, a lot of it is invisible.","attribution":"Nikunj Kothari，FPV Ventures 合伙人","url":"https://x.com/nikunj/status/2105148927599423752"}]},{"tag":"浏览器 Agent","title":"浏览器 Agent 要取消逐步确认，必须先把安全判断产品化","body":"让 Agent 操作没有 API 的后台和旧系统，价值恰恰来自减少人工确认；但网页内容同时也是潜在攻击入口。可行路径不是在便利与安全之间二选一，而是把内容探测、意图比对和动作拦截放进每次执行链路，让低风险操作自动通过、偏离原始请求的动作被阻止。安全层因此不再是发布前检查，而是自治体验本身的组成部分。","evidence":[{"quote":"Claude can now also take actions autonomously in the browser, instead of needing approval for every one.","attribution":"Claude Blog","url":"https://claude.com/blog/claude-in-chrome-generally-available"}]},{"tag":"创作 way pavilion on a few mins, come by!","createdAt":"2026-09-29T18:24:19.000Z","url":"https://x.com/swyx/status/2105000738745376769","likes":72,"retweets":2,"replies":26},{"text":"i have the best reply guys","createdAt":"2026-09-29T17:20:06.000Z","url":"https://x.com/swyx/status/2104984576703844750","likes":3,"retweets":0,"replies":1}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"What’s up dot","createdAt":"2026-09-30T06:12:30.000Z","url":"https://x.com/thsottiaux/status/2105178959327756396","likes":857,"retweets":29,"replies":606},{"text":"We will have a few million dots online within days, working on all sorts of things across such a diverse and large community. Excited to learn from all of you on what you love and what doesn’t yet feel magical. Personally I felt a jump after 2-3 days of use after teaching it more about my preferences and things on my mind. It learns very quickly to be most useful and it can take on surprisingly ambitious tasks on its own. We’re learning from how you all use your primary dot before releasing the ability to create an entire team of them.","createdAt":"2026-09-30T01:18:58.000Z","url":"https://x.com/thsottiaux/status/2105105086506840421","likes":3634,"retweets":95,"replies":933},{"text":"It was so nice to connect with so many of you in person at DevDay. Immaculate vibes from the crowd and fun to see so many build things throughout the day.","createdAt":"2026-09-30T01:09:58.000Z","url":"https://x.com/thsottiaux/status/2105102820706058498","likes":1891,"retweets":38,"replies":219}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"Wow I had no idea this toggle exists Going to try this now I hate the ai slop shorts on YouTube","createdAt":"2026-09-30T02:48:03.000Z","url":"https://x.com/petergyang/status/2105127506701644024","likes":128,"retweets":4,"replies":10},{"text":" whole industry to support progress without reducing competition. This certainly points to a much brighter future for AI.","createdAt":"2026-09-30T01:44:32.000Z","url":"https://x.com/levie/status/2105111520913039530","likes":91,"retweets":8,"replies":19}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Just merged a version of OpenClaw’s test-audit skill into GStack. Test bloat is a real problem. Luckily intelligence is on tap these days!","createdAt":"2026-09-29T21:36:07.000Z","url":"https://x.com/garrytan/status/2105049005147525231","likes":146,"retweets":7,"replies":36}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Make something people want, then make people want it. Harvard’17. GitHub: YouTube:","tweets":[{"text":"I made a marketing website for my water bottle The whole thing was done by Opus 5.5 (6 prompts); it used: - Elevenlabs to generate the music - Meshy to generate the 3D assets - OpenAI API to generate images (sound on)","createdAt":"2026-09-30T00:44:02.000Z","url":"https://x.com/zarazhangrui/status/2105096296831017078","likes":254,"retweets":6,"replies":25}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"Two random honest thoughts on the market right now.. First is on people: It's harder than ever to find missionaries. I'm seeing people leave the companies they have cofounded to join the \"obvious\" winners. Public CEOs are leaving for positions at labs. Founders leaving and rejoining neolabs at a moment's notice. Companies getting Windsurf-ed where only the choice people are getting to join the future company. Founders raising tranched valuations without worrying about the next employee that will join them will have 409As that make early exercising impossible. As early stage VCs, we are often just betting on people. And, when those people leave on a dime's notice, then the remaining company…","createdAt":"2026-09-30T04:13:10.000Z","url":"https://x.com/nikunj/status/2105148927599423752","likes":223,"retweets":7,"replies":20},{"text":"Transitioning from one thing to the next can often be really fun and often quite stressful in what feels like a warp speed period.. If that’s you, @lolawajs & I would love to meet you at this breakfast and help in any way possible. DMs open!","createdAt":"2026-09-30T00:50:33.000Z","url":"https://x.com/nikunj/status/2105097936455786536","likes":17,"retweets":0,"replies":1},{"text":"If you’re a B2B founder and don’t want to spend egregious amounts of money on LinkedIn CPMs, lots of alpha in just aggregating what’s trending on X and posting it on LinkedIn. LinkedIn is consistently a week or two behind and they lap it up. And for those who think it’s cringe, you live long enough to start LinkedInfluencing. It truly comes for us all 🤷‍♂️","createdAt":"2026-09-29T14:59:19.000Z","url":"https://x.com/nikunj/status/2104949147812159672","likes":126,"retweets":0,"replies":24}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"That /goal is still running.","createdAt":"2026-09-29T21:36:30.000Z","url":"https://x.com/steipete/status/2105049100983132648","likes":8,"retweets":0,"replies":0},{"text":"This is pretty amazing.","createdAt":"2026-09-29T21:36:05.000Z","url":"https://x.com/steipete/status/2105048996549116268","likes":528,"retweets":17,"replies":22}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"@every @sama read the vibe check if you haven't:","createdAt":"2026-09-29T23:12:30.000Z","url":"https://x.com/danshipper/status/2105073259507331233","likes":3,"retweets":0,"replies":2},{"text":"im biased but im insanely proud of @every's dev day coverage - two vibe checks - live feed - livestream - podcast with @sama (coming tomorrow!) insane amount of effort from the team:","createdAt":"2026-09-29T22:47:28.000Z","url":"https://x.com/danshipper/status/2105066959822114972","likes":156,"retweets":8,"replies":16},{"text":"@sama subscribe to @every to get it:","createdAt":"2026-09-29T22:38:32.000Z","url":"https://x.com/danshipper/status/2105064711431897369","likes":2,"retweets":0,"replies":0}]},{"name":"Sam Altman","handle":"sama","bio":"The mission of OpenAI is to ensure that AGI benefits all of humanity","tweets":[{"text":"Dots are here! A new way to use AI that works 24/7 for you; get more of your time and attention back to work at a higher level.","createdAt":"2026-09-29T18:01:34.000Z","url":"https://x.com/sama/status/2104995014208258235","likes":12080,"retweets":872,"replies":1670},{"text":"Ultrafast is so fast I do not ever want to go back","createdAt":"2026-09-29T17:59:56.000Z","url":"https://x.com/sama/status/2104994601140711896","likes":8872,"retweets":214,"replies":1045},{"text":"6.1 Sol at 1/5th of the price of Astra, and 95% cache read discount! Extremely capable model.","createdAt":"2026-09-29T17:59:07.000Z","url":"https://x.com/sama/status/2104994395980533804","likes":6722,"retweets":220,"replies":467}]}]},"errors":[],"partial":false},{"date":"2026-09-30","dateLabel":"2026年09月30日","generatedAt":"2026-09-30T00:00:00+08:00","sourceGeneratedAt":"2026-09-29T06:45:20.961Z","stats":{"podcastEpisodes":0,"xBuilders":18,"totalTweets":34,"blogPosts":0},"highlights":[{"tag":"模型经济性","title":"下一轮模型竞争会从答得更好，转向每项任务耗得更少","body":"当模型能够用更少 token、更短时间交付同一结果，能力提升就不只是榜单变化，而会直接扩大可被自动化的任务边界。高频工作流因此更容易采用更高层的 Agent 抽象，团队评估模型时也应把一次回答的质量，升级为完成整项工作的成本、速度与可靠性。","evidence":[{"quote":"Sonnet 5.5 fixing a bug with Claude Code. 30% faster and 30% less usage.","attribution":"Boris Cherny，Claude Code 团队","url":"https://x.com/bcherny/status/2104638725317923228"},{"quote":"In Claude Code, users get ~30% more tasks done compared to Sonnet 5. It's smarter, so it needs fewer tokens for the same work.","attribution":"Cat Wu，Anthropic Claude Code 与 Cowork 团队","url":"https://x.com/_catwu/status/2104639552170377399"}]},{"tag":"企业评测","title":"通用模型的企业价值，必须在带行业陷阱的成品任务里兑现","body":"企业采用不会由单一平均分决定，而取决于模型能否在真实材料中识别算术错误、拒绝编造基准并正确处理原始数据。面向严肃业务的产品，评测单元应从知识问答转为可验收交付物，并按行业风险拆分；只有这样，速度和成本优势才不会掩盖关键错误。","evidence":[{"quote":"Sonnet 5.5 caught the miscalculated interest totals and the mispriced options and flagged them, and it also finished this work about 61% faster.","attribution":"Aaron Levie，Box 联合创始人兼 CEO","url":"https://x.com/levie/status/2104648654074343480"}]},{"tag":"Agent 工作流","title":"提示词正在退居入口，真正的能力载体是可复用的上下文系统","body":"当结果依赖参考仓库、skills、示例、检索和外部模型时，复制一句 prompt 已无法复制工作方法。团队的生产力资产会转向如何组织材料、规定调用顺序和沉淀动态流程；相应地，协作与评审也要从比较措辞，转向检查上下文来源、工具权限和执行轨迹。","evidence":[{"quote":"it's basically impossible for someone to just \"show you their prompt\" now, because everything is about references, skills and examples","attribution":"Thariq，Anthropic Claude Code 团队","url":"https://x.com/trq212/status/2104608785696440510"},{"quote":"With Sonnet + Opus 5.5 I think this sort intelligence is should be very available. Try Sonnet 5.5 in particular when making workflows.","attribution":"Thariq，Anthropic Claude Code 团队","url":"https://x.com/trq212/status/2104660926373023830"}]},{"tag":"商业模式","title":"订阅制 AI 正在从额度折扣，转向效率承诺与权益打包","body":"当 API 单价持续下降，用名义调用价值证明高价订阅会越来越脆弱。更可持续的订阅逻辑，是让用户相信同样预算能完成更多工作，并用不计入用量的附加权益维持差异；这也迫使厂商把模型效率改进真正传导到用户侧，而不是靠复杂限额制造价值感。","evidence":[{"quote":"On the subscription, we guarantee that over time you always get more work done and with an increasing level of quality.","attribution":"Thibault Sottiaux，OpenAI Codex 与 ChatGPT 团队","url":"https://x.com/thsottiaux/status/2104823812042940713"}]},{"tag":"创业策略","title":"把融资等同于分发护城河，会在平台反击时暴露得最快","body":"资本可以买到增长，却不能保证渠道控制权；当既有平台调动自身分发能力，单靠投放或规模形成的领先很容易被压缩。创业公司的防御仍要回到不可公平获得的优势、高留存、网络效应与自我造血，否则融资只会放大一个依赖外部窗口期的策略。","evidence":[{"quote":"Find your unfair advantages. Build a great product with high retention and ideally network effects. Use capital as a weapon to compound and not as destiny.","attribution":"Nikunj Kothari，FPV Ventures 合伙人","url":"https://x.com/nikunj/status/2104566122549063756"}]}],"matters":[{"kind":"Agent 基础设施","title":"无需认证的域名搜索开始直接为 Agent 优化","detail":"Guillermo Rauch 宣布 Vercel 域名搜索可免登录使用，并明确指出这对 Agent 尤其合适，显示产品入口正主动降低机器访问摩擦。","url":"https://x.com/rauchg/status/2104764419305796094"},{"kind":"交互入口","title":"代码生成正在进入日常通讯界面","detail":"Garry Tan 认为 Codegen 与 WhatsApp 的组合很合理，意味着开发代理可能通过用户已经高频使用的消息入口获得更低启动成本。","url":"https://x.com/garrytan/status/2104771351009702168"},{"kind":"设计质量","title":"AI 前端的复制门槛仍集中在审美与制作方法","detail":"Zara Zhang 征集难以摆脱 AI 感、无法复现优秀演示以及愿意公开制作流程的实践者，反映生成能力普及后，视觉完成度仍是明显短板。","url":"https://x.com/zarazhangrui/status/2104689580045979811"},{"kind":"创作工具","title":"单人原型开始整合玩法、素材与宣传片生产","detail":"Peter Yang 用 Sonnet 5.5 做出可玩的《星际争霸》关卡，并组合 Sketchfab 模型、Suno 音乐和模型生成的宣传片，展示跨媒介原型链路正在收拢。","url":"https://x.com/petergyang/status/2104736498151256303"},{"kind":"AI 技能","title":"真实迁移项目正在反向沉淀为可复用技能","detail":"Vercel 在迁移成熟工作负载后提炼出两项将公开的 AI skills，说明一次性交付开始被封装为可传播的工程能力。","url":"https://x.com/rauchg/status/2104660502723072281"}],"sources":{"podcasts":[],"blogs":[],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"oai designers have to be trolling us","createdAt":"2026-09-29T01:15:24.000Z","url":"https://x.com/swyx/status/2104741800393253322","likes":198,"retweets":2,"replies":42}]},{"name":"Josh Woodward","handle":"joshwoodward","bio":"VP, @Google @GoogleLabs @GeminiApp @GoogleAIStudio","tweets":[{"text":"Having just come back from Yosemite recently, this is awesome!","createdAt":"2026-09-28T16:57:04.000Z","url":"https://x.com/joshwoodward/status/2104616392297451882","likes":102,"retweets":2,"replies":4}]},{"name":"Boris Cherny","handle":"bcherny","bio":"Claude Code @anthropicai","tweets":[{"text":"Sonnet 5.5 fixing a bug with Claude Code. 30% faster and 30% less usage.","createdAt":"2026-09-28T18:25:49.000Z","url":"https://x.com/bcherny/status/2104638725317923228","likes":4835,"retweets":173,"replies":227}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Hi, Tomorrow we are re-opening the Pro $200 subscriptions to new subscribers, but together with it we are also changing how we calculate the usage for it. In effect, if you do the math, it will net out at half the dollar in API spend compared to the old Pro $200 plan. Now that it's said, let me explain why this is happening and why you will still get more work done than if you were on the Pro $200 subscription one month ago. (a) We didn't want to compromise in other ways and are committing to not reintroducing the 5h limit, so that you can fully use the weekly usage when you want. (b) On the subscription, we guarantee that over time you always get more work done and with an increasing level…","createdAt":"2026-09-29T06:41:17.000Z","url":"https://x.com/thsottiaux/status/2104823812042940713","likes":697,"retweets":73,"replies":196},{"text":"Taken by none other than the incredible @ah20im","createdAt":"2026-09-28T07:04:49.000Z","url":"https://x.com/thsottiaux/status/2104467346945675347","likes":481,"retweets":5,"replies":82},{"text":"Sunday vibes. See you at Fort Mason soon 🎮👩‍💻","createdAt":"2026-09-28T06:58:18.000Z","url":"https://x.com/thsottiaux/status/2104465709384491519","likes":4105,"retweets":72,"replies":502}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"Folks on X are so fickle about “omg openai is getting mogged by Claude 5.5” or just a few months ago “anthropic is so cooked by codex.” I’m just glad there are 2 (and soon more) competitors pushing the frontier so we can all benefit.","createdAt":"2026-09-29T05:44:03.000Z","url":"https://x.com/petergyang/status/2104809410040336784","likes":53,"retweets":2,"replies":14},{"text":"My very first @OpenAI dev day is tomorrow. If you're going I hope to see you there!","createdAt":"2026-09-29T03:52:39.000Z","url":"https://x.com/petergyang/status/2104781373433377030","likes":80,"retweets":0,"replies":12},{"text":"I built a working StarCraft level with Sonnet 5.5. You play Terran, defending your base against the Zerg: → Build Marines, Siege Tanks, and Battlecruisers → Use SC2 models from Sketchfab (by Catholomew) → Music generated with Suno 📌 Play it here: Sonnet also made the sizzle reel below. Check out my latest tutorial on Sonnet here:","createdAt":"2026-09-29T00:54:19.000Z","url":"https://x.com/petergyang/status/2104736498151256303","likes":80,"retweets":5,"replies":6}]},{"name":"Cat Wu","handle":"_catwu","bio":"claude code + cowork @anthropicai, prev: @dagster, @scale_ai","tweets":[{"text":"Sonnet 5.5 is here! In Claude Code, users get ~30% more tasks done compared to Sonnet 5. It's smarter, so it needs fewer tokens for the same work. Here it rakes a yard of leaves using tool calls. 24s faster than Sonnet 5, with 6K fewer tokens. It leaves her extra time to read :)","createdAt":"2026-09-28T18:29:06.000Z","url":"https://x.com/_catwu/status/2104639552170377399","likes":423,"retweets":8,"replies":39}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"I just told Claude \"can you help me think through this problem step by step\"","createdAt":"2026-09-28T22:40:08.000Z","url":"https://x.com/trq212/status/2104702728270471594","likes":2698,"retweets":48,"replies":144},{"text":"A lot of times when I talk about higher level abstractions like projects, claude tag and dynamic workflows, I hear concerns about token cost. With Sonnet + Opus 5.5 I think this sort intelligence is should be very available. Try Sonnet 5.5 in particular when making workflows.","createdAt":"2026-09-28T19:54:02.000Z","url":"https://x.com/trq212/status/2104660926373023830","likes":1691,"retweets":40,"replies":127},{"text":"it's basically impossible for someone to just \"show you their prompt\" now, because everything is about references, skills and examples I often ask my agent to look at 3 other repos I've made first, search the web for references, use other AI APIs, etc.","createdAt":"2026-09-28T16:26:50.000Z","url":"https://x.com/trq212/status/2104608785696440510","likes":4265,"retweets":143,"replies":275}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"You can now search @vercel domains without auth. Especially great if you're an agent.","createdAt":"2026-09-29T02:45:16.000Z","url":"https://x.com/rauchg/status/2104764419305796094","likes":213,"retweets":6,"replies":47},{"text":"Nice viz by @marcosnils: Choose ▲ if you want to win. You know what to choose if you want third place!","createdAt":"2026-09-28T21:36:31.000Z","url":"https://x.com/rauchg/status/2104686719685853226","likes":33,"retweets":1,"replies":5},{"text":"We migrated with as little intervention as possible, setting out to prove just how much faster @vercel is. ~70% faster builds and ~75% faster paints. We derived two AI skills from the migration that we'll be sharing back. It was a mature workload with a lot of \"$formerProvider-isms\", and yet the net of the work was done in under a week. If it's [built / rendered / shipped] fast, it's on Vercel.","createdAt":"2026-09-28T19:52:21.000Z","url":"https://x.com/rauchg/status/2104660502723072281","likes":429,"retweets":13,"replies":47}]},{"name":"Alex Albert","handle":"alexalbert__","bio":"Research @AnthropicAI. Opinions are my own!","tweets":[{"text":"Sonnet 5.5 has the same feel I liked about Opus 5.5. It writes clearly, it's very fast, and it's a major capabilities jump over Sonnet 5. Really great model to iterate with.","createdAt":"2026-09-28T18:06:47.000Z","url":"https://x.com/alexalbert__/status/2104633937280811010","likes":729,"retweets":11,"replies":46}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"At Box, we've been testing Sonnet 5.5 in early access on our complex work eval with the Box Agent, and Sonnet 5.5 is another strong jump from Sonnet 5 on knowledge work with enterprise content. Across the board we saw a 4 pt overall improvement on our hardest tests, but it was roughly 2.4× faster to a finished deliverable on 12% fewer tokens. We also saw major wins in key verticals, like a +18 percentage point improvement in Financial Services, +7 pt in Legal, +8 pt in Life Sciences, and +7 pt in the Public Sector. Here are some specific wins on certain tasks that show the power of Sonnet 5.5: * Financial services (+48 points): a due-diligence review of a trading-tool acquisition, where the…","createdAt":"2026-09-28T19:05:16.000Z","url":"https://x.com/levie/status/2104648654074343480","likes":146,"retweets":13,"replies":36}]},{"name":"Ryo Lu","handle":"ryolu_","bio":"Designed @Cursor_ai, @NotionHQ, @Stripe, built startups. I make a world where anyone can make software. Aspiring k-pop idol.","tweets":[{"text":"try it in all cities with youbike in taiwan docks, navigation, live turn-by-turn directions with voice","createdAt":"2026-09-28T12:20:57.000Z","url":"https://x.com/ryolu_/status/2104546903807660224","likes":11,"retweets":1,"replies":0},{"text":"what i’ve been doing: i love youbike 💛","createdAt":"2026-09-28T12:19:01.000Z","url":"https://x.com/ryolu_/status/2104546417281020315","likes":185,"retweets":4,"replies":8}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Codegen meets WhatsApp actually makes a ton of sense","createdAt":"2026-09-29T03:12:49.000Z","url":"https://x.com/garrytan/status/2104771351009702168","likes":190,"retweets":7,"replies":22},{"text":"Karma isn’t a thing that happens, it’s a choice you can make now","createdAt":"2026-09-28T13:11:03.000Z","url":"https://x.com/garrytan/status/2104559514699837634","likes":401,"retweets":48,"replies":53}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Make something people want, then make people want it. Harvard’17. GitHub: YouTube:","tweets":[{"text":"Hello, I'm looking to chat with some of my followers! If you're - building web-based/frontend experiences with AI but have a hard time making it look beautiful/not AI slop - seeing all these cool demos on X built with latest models but have no idea how to replicate them - are creating these cool demos yourself and would like to share your creation process/tips Would love to have a chat; DM me or comment below!","createdAt":"2026-09-28T21:47:53.000Z","url":"https://x.com/zarazhangrui/status/2104689580045979811","likes":180,"retweets":1,"replies":71}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"If you prefer video, this was one shot by Opus 5.5 💥","createdAt":"2026-09-29T02:20:20.000Z","url":"https://x.com/nikunj/status/2104758141128974358","likes":14,"retweets":0,"replies":0},{"text":"","createdAt":"2026-09-28T22:45:49.000Z","url":"https://x.com/nikunj/status/2104704157106180341","likes":93,"retweets":5,"replies":11},{"text":"Where are all the “distribution is a moat and hence raise a lot of money” investors today.. when the *checks notes* incumbents are flexing their distribution muscle. It’s SO important to stay first principles on what matters. Find your unfair advantages. Build a great product with high retention and ideally network effects. Use capital as a we ut I like things like the smell of a fresh orange. The perfumes that are supposed to be realistic and citrusy smell at best like orange layered over skunk.","createdAt":"2026-09-27T17:48:16.000Z","url":"https://x.com/AmandaAskell/status/2104266890726309908","likes":104,"retweets":1,"replies":17},{"text":"I wanted to know if I only hate perfume because I've never owned a nice one. So I researched a bunch of the fanciest and most well reviewed perfumes and bought a tiny sample bottle of each. I can now confidently confirm that all perfume smells disgusting.","createdAt":"2026-09-27T17:26:33.000Z","url":"https://x.com/AmandaAskell/status/2104261424625381528","likes":869,"retweets":14,"replies":166}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"dating myself with neopets I fear","createdAt":"2026-09-28T02:51:57.000Z","url":"https://x.com/trq212/status/2104403711699423680","likes":395,"retweets":1,"replies":91},{"text":"I am most afraid of us eating the productivity gains of agents by just becoming lazier.","createdAt":"2026-09-27T18:13:31.000Z","url":"https://x.com/trq212/status/2104273243599405395","likes":4322,"retweets":92,"replies":474}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Cool to see Replit being popular at Chan-Zuckerberg household!","createdAt":"2026-09-28T04:31:36.000Z","url":"https://x.com/amasad/status/2104428789417857436","likes":167,"retweets":5,"replies":9},{"text":"Love to see it 😂","createdAt":"2026-09-27T22:58:10.000Z","url":"https://x.com/amasad/status/2104344877798719516","likes":55,"retweets":4,"replies":5}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"I¹ ported my Mini web browser to Rust & Swift. It's faster, more secure, and shockingly, nicer to iterate on than Electron + Bun. I always wanted Safari-like UX but… Chrome 😁. Thanks to the 𝚌𝚎𝚏 crate, I can bundle up-to-date Chromium. 𝚏𝚡 𝚊𝚌𝚙 lets me embed an agent without bloating the app. It talks to my local fx CLI over ACP. fx can then manage the browser via an MCP server². By ditching Electron, I was able to get Liquid Glass, faster boots, and a more Mac-native feeling. Little things like fine-grained focus and input control, which are nightmare fuel in JS, just work®. Native is the future, both on the desktop and in the cloud. I suspect the entire software world will \"nativify…","createdAt":"2026-09-28T04:31:39.000Z","url":"https://x.com/rauchg/status/2104428800134013205","likes":508,"retweets":15,"replies":61}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Interesting to think about all the implications in a world where agents begin to make the best or most efficient choice for their users. On one hand, there is some subset of the economy that benefits from the friction customers traditionally have changing something about their habits. In those parts of the market, switching costs will come down and competition is going to increase dramatically until some equilibrium is reached between the disruptive alternatives and the incumbents. On the other hand, there are lots of markets that are hurt by a significant amount of friction, where agents will begin to unlock all kinds of economic activity by making it far easier to buy products or services…","createdAt":"2026-09-27T23:20:52.000Z","url":"https://x.com/levie/status/2104350592290406849","likes":174,"retweets":19,"replies":47}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Anti-bot is for losers tbh","createdAt":"2026-09-28T02:48:06.000Z","url":"https://x.com/garrytan/status/2104402742517420517","likes":418,"retweets":14,"replies":59},{"text":"\"Oh I can do this with CDP\" Haha you have not podcastEpisodes":1,"xBuilders":8,"totalTweets":14,"blogPosts":0},"highlights":[{"tag":"推理架构","title":"下一轮模型竞争会从参数规模转向推理阶段的并行效率","body":"当推理同时决定用户延迟、单位成本和 RL 生成轨迹的吞吐时，架构能否把工作负载并行化，就不再只是性能优化，而会直接影响模型迭代速度。扩散式 LLM 的真正挑战因此不是证明它能生成文本，而是证明它能把 GPU 利用率转化为更低成本、更快反馈和更高频的后训练循环。","evidence":[{"quote":"We bet on trying to build the architecture and trying to build the kind of models that will scale best at inference time because economics are dominated by the kind of intelligence per watt, the intelligence per dollar that you're able to get from the models.","attribution":"Stefano Ermon，Inception 联合创始人兼 CEO，No Priors","url":"https://www.youtube.com/@NoPriorsPodcast"},{"quote":"Inference is, again, a key bottleneck for our RL post training. And so if you have a model that scales better at inference time, then automatically you're gonna get better scaling during our RL post training.","attribution":"Stefano Ermon，Inception 联合创始人兼 CEO，No Priors","url":"https://www.youtube.com/@NoPriorsPodcast"}]},{"tag":"认知质量","title":"AI 内容泛滥正在把“读完并理解”变成稀缺能力","body":"低成本生成让表达数量暴涨，却把核验成本转嫁给读者。长期看，团队的竞争力不会来自产出更多文字，而来自能否建立一种拒绝未理解内容的工作规范：论点必须对应证据，结论必须经得起原文核对，否则 AI 提效会被阅读疲劳和错误归因抵消。","evidence":[{"quote":"We run a real risk that reading gets entirely discounted, because of the exhaustion of getting low-quality and unverified AI prose being thrown at you all the time.","attribution":"Guillermo Rauch，Vercel CEO","url":"https://x.com/rauchg/status/2103939888513274147"}]},{"tag":"工程工作流","title":"Coding agent 的价值重心正从写代码移到规划真实故障","body":"生产问题的难点通常不是补出一段代码，而是先收敛原因、影响面和修改顺序。把 agent 放进 autoplan 阶段，意味着工程团队开始用它组织诊断路径；一旦规划结果可审查，后续生成与执行才更容易进入可信的生产流程。","evidence":[{"quote":"This is my favorite way to fix bugs now — @capydotai with GStack /autoplan on a production issue. GPT-6 medium reasoning.","attribution":"Garry Tan，Y Combinator 总裁兼 CEO","url":"https://x.com/garrytan/status/2103989902476259702"}]},{"tag":"创作范式","title":"生成式视频正在把经典文本改编压缩成可连续迭代的个人流程","body":"从文本改写到分场景成片由同一创作者连续完成，说明视频生成的关键变化不只是画面质量，而是媒介转换的组织成本下降。创作者可 "handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Hello world, Lisa Rauch 👧. What an amazing and beautiful world to be born in.","createdAt":"2026-09-26T20:53:30.000Z","url":"https://x.com/rauchg/status/2103951116648280266","likes":7770,"retweets":30,"replies":730},{"text":"Reject non-understanding. Slop grenades are not just code and PRs. We run a real risk that *reading* gets entirely discounted, because of the exhaustion of getting low-quality and unverified AI prose being thrown at you all the time. There's a thread going viral about a 'perf improvement' attributed to a compiler change. The PR *description* itself has the AI telling this person it's *not* due to the compiler change, it's how the algorithms and data structures have changed. And the implication is that a similar win could have been attained otherwise. I want AI in the service of understanding the universe and enhancing human cognition and creativity.","createdAt":"2026-09-26T20:08:53.000Z","url":"https://x.com/rauchg/status/2103939888513274147","likes":1715,"retweets":124,"replies":122}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Most people get mad on social media but don’t know what to do to actually effect change We think you should come to a Garry’s List event and meet other people and organize to make it happen Mad about our kids educations? Come to a house party and organize for merit.","createdAt":"2026-09-27T04:40:13.000Z","url":"https://x.com/garrytan/status/2104068570938499350","likes":32,"retweets":2,"replies":9},{"text":"This is my favorite way to fix bugs now @capydotai with GStack /autoplan on a production issue GPT-6 medium reasoning","createdAt":"2026-09-26T23:27:37.000Z","url":"https://x.com/garrytan/status/2103989902476259702","likes":152,"retweets":9,"replies":38},{"text":"Be chalant Don’t LARP","creat ，企业软件的新采购标准将是产品对 Agent 是否足够易用，包括 Agent 能否理解其对象体系并操作业务数据。","attribution":"Guillermo Rauch · @rauchg","url":"https://x.com/rauchg/status/2103564484602384855"}]},{"tag":"企业治理","title":"评测正在从模型排行榜，变成企业上线 Agent 的控制面","body":"非确定性工作无法只靠传统测试证明安全，也不能等事故发生后再判断效果。企业需要把自身流程、容错边界和历史基线写进持续评测，才能知道一次模型升级或工作流修改究竟改善了什么、破坏了什么；因此评测会成为部署、扩权和预算增长之前的共同前置条件。","evidence":[{"quote":"Aaron Levie 指出，企业若没有针对自身环境的 Agent 评测，就无法判断什么有效、什么损坏、什么发生了变化，升级与部署都依赖良好评测。","attribution":"Aaron Levie · @levie","url":"https://x.com/levie/status/2103629073595728372"},{"quote":"Thariq 表示，自己会在希望保持参与时使用 low effort，而 max effort 主要用于零输入执行或寻找安全漏洞。","attribution":"Thariq · @trq212","url":"https://x.com/trq212/status/2103577115010687067"}]},{"tag":"产品范式","title":"独立的“高级工作区”正在消失，复杂任务会回到同一个对话入口","body":"用户真正讨厌的不是能力不够，而是先判断任务该去哪个模式、再手工搬运上下文。把聊天、长任务、文档和演示合并后，产品的核心职责转向识别任务规模、选择执行方式并管理中途确认；界面会更简单，但后台调度、记忆和权限控制会更复杂。","evidence":[{"quote":"Claude 将 Cowork 与 chat 合并，并让 Docs、Slides、Design、连接器和技能从任意对话中可用，用户不再需要先决定任务属于哪个空间。","attribution":"Claude Blog · Claude Cowork and chat are now one Claude","url":"https://claude.com/blog/cowork-is-now-claude"},{"quote":"Boris Cherny 描述的 Tag 会主动复现频道中的 bug、提交修复 PR，也会执行大规模数据分析，并保有记忆和连接器访问能力。","attribution":"Boris Cherny · @bcherny","url":"https://x.com/bcherny/status/2103538666597691552"}]},{"tag":"Agent 工程","title":"Agent 并发放大的第一个瓶颈，往往不是模型，而是为单人时代写下的同步架构","body":"当一个 Agent 同时展开几十条会话，过去可接受的阻塞式访问会迅速变成全局吞吐上限。更关键的变化是，Agent 也在降低大型重构的执行成本，让团队可以边运行边替换底层结构；工程组织因此需要更早为并发、隔离和渐进迁移设计，而不是等负载出现后补救。","evidence":[{"quote":"Peter Steinberger 反思 OpenClaw 使用同步 SQLite 访问：单个 Agent 可能并行运行 50 个会话后，它已成为限制；一个 Astra 目标已为迁移异步 worker 合入 575 个 PR。","attribution":"Peter Steinberger · @steipete","url":"https://x.com/steipete/status/2103648679169257737"},{"quote":"Michael Lee 认为，能全天候运行并随电力扩展的机器，不应只被分给现有岗位提速，而应促使公司重新组织人和技术的分工。","attribution":"Michael Lee · No Priors","url":"https://www.youtube.com/@NoPriorsPodcast"}]}],"matters":[{"kind":"消费 Agent","title":"漂亮界面无法补偿旅行 Agent 的搜索质量差距","detail":"Peter Yang 用相同日本行程测试 Muse 与 Grok，Muse 给出的机票价格高出 1000 多美元，并称其搜索来源是 Duffel 而非 Google Flights。","url":"https://x.com/petergyang/status/2103693608729932025"},{"kind":"并购布局","title":"Replit 收购 Atta，补入业务分析与数据可视化能力","detail":"Amjad Masad 表示，Atta 团队将加入 Replit，双方共同目标是让更多人具备理解企业业务的能力。","url":"https://x.com/amasad/status/2103632415185133992"},{"kind":"资本市场","title":"AI 创业融资进一步呈现头部集中","detail":"Matt Turck 观察到，创业公司数量很多，但投资人仍集中争抢同一批约 10 到 30 家公司，幂律效应比过去更强。","url":"https://x.com/mattturck/status/2103550183506337835"},{"kind":"安全透明","title":"OpenAI 持续审查 Agent 在训练与评测中的联网行为","detail":"Sam Altman 表示，团队正在分析海量 Agent 活动日志并陆续发布摘要，同时需要兼顾透明度与第三方漏洞的披露边界。","url":"https://x.com/sama/status/2103567198690349362"},{"kind":"服务韧性","title":"Codex 故障恢复后为付费用户重置使用额度","detail":"Thibault Sottiaux 在服务短暂中断后宣布恢复运行，并表示 Codex 与 ChatGPT work 的付费用户额度将被重置。","url":"https://x.com/thsottiaux/status/2103637477760311522"}],"sources":{"podcasts":[{"title":"Re-Founding Incumbents for the AI Era with Sequence Holdings Co-Founder and CEO Michael Lee","name":"No Priors","publishedAt":"2026-09-24T10:00:00.000Z","url":"https://www.youtube.com/@NoPriorsPodcast","excerpts":["Every company on the planet has a celebrated persona. In a world where you believe that alpha comes from engineering and AI, you need to create a culture whereby the celebrated persona is the engineer, and that's what's required. You think about your typical investment in a fund, and you're typically trying to figure out how do we start to package to sell t…","Hi, listeners. Welcome back to No Priors. Today, I'm here with Michael Lee, cofounder and CEO of Sequence Holdings. They just announced the largest AI take private to date with the Dell family office of Baldwin for $7,700,000,000. We talk about this, the Sequence story, how AI transformation is actually going to permeate the economy and what transfers from…","So you started Sequence Holdings, which is a permanent holding company that works with management teams to buy and refound their businesses to be market leaders with AI. We should talk about that, and it's a very exciting model. But you also announced this big transaction in Baldwin. Tell us about it."]}],"blogs":[{"title":"Claude Cowork and chat are now one Claude","source":"blog","publishedAt":"Sep 16, 2026","url":"https://claude.com/blog/cowork-is-now-claude","summary":""}],"x":[{"name":"Boris Cherny","handle":"bcherny","bio":"Claude Code @anthropicai","tweets":[{"text":"Can’t wait to see what you build.","createdAt":"2026-09-26T03:41:11.000Z","url":"https://x.com/bcherny/status/2103691327699550598","likes":481,"retweets":12,"replies":43},{"text":"Tag writes >50% of my PRs every day. It also does ~100% of my data analysis, and fixes most of our product feedback + bugs. It's not like a regular Slack bot. It is proactive, programmable, it has memory, it has access to your connectors. With Opus 5.5 and Fable 5.1, it has strong judgement. Example prompts I use: - \"@Claude react to threads in this channel with ✅ when resolved\" - \"@Claude from now on, attempt to repro every bug in this channel end to end, running the full app. once you reproduce the bug, put up a pr to fix it and tag the right team for code review\" - \"@Claude brainstorm ~100 hypotheses for what could explain this weird data, use a workflow to in/validate. spend 10m tokens…","createdAt":"2026-09-25T17:34:34.000Z","url":"https://x.com/bcherny/status/2103538666597691552","likes":1096,"retweets":52,"replies":159}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"o yes… we’re back in action and we’ll reset usage limits for all paid users across codex and ChatGPT work sorry about the brief disruption! (and yes we have a special spare codex when things are down to help us out)","createdAt":"2026-09-26T00:07:13.000Z","url":"https://x.com/thsottiaux/status/2103637477760311522","likes":12780,"retweets":671,"replies":2196},{"text":"o no :(","createdAt":"2026-09-25T23:08:15.000Z","url":"https://x.com/thsottiaux/status/2103622639386574979","likes":2687,"retweets":44,"replies":481},{"text":"We are aware that codex is down and are working hard to bring back normal service.","createdAt":"2026-09-25T22:58:00.000Z","url":"https://x.com/thsottiaux/status/2103620061156290622","likes":10596,"retweets":574,"replies":2255}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"I think Muse has an incredible UI and mascot but the underlying model it’s questionable how smart it is. Makes sense if it’s not that smart since this is meant to scale to a billion people","createdAt":"2026-09-26T04:02:19.000Z","url":"https://x.com/petergyang/status/2103696644558704796","likes":12,"retweets":1,"replies":1},{"text":"Ok all memes aside I had Grok @bot and Muse track the same Japan flight itinerary and Muse suggested a price that was $1K+ more than Grok Bot. When I asked Muse why it said it searched Duffel instead of Google Flights...wtf is Duffel?","createdAt":"2026-09-26T03:50:15.000Z","url":"https://x.com/petergyang/status/2103693608729932025","likes":83,"retweets":1,"replies":21},{"text":"Where's Jack Bauer and 24","createdAt":"2026-09-26T03:36:21.000Z","url":"https://x.com/petergyang/status/2103690110726558123","likes":28,"retweets":1,"replies":5}]},{"name":"Nan Yu","handle":"thenanyu","bio":"(soon) member of product staff @openai. prev head of product @linear","tweets":[{"text":"basically","createdAt":"2026-09-26T00:14:24.000Z","url":"https://x.com/thenanyu/status/2103639287367696603","likes":0,"retweets":0,"replies":0},{"text":"AGI","createdAt":"2026-09-25T23:11:14.000Z","url":"https://x.com/thenanyu/status/2103623390842294609","likes":52,"retweets":1,"replies":2}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"If you want to see interactive explainers of benchmarks and demos I built, you can read it on our new dev site here:","createdAt":"2026-09-25T20:07:21.000Z","url":"https://x.com/trq212/status/2103577116445175948","likes":140,"retweets":6,"replies":10},{"text":"I use effort low a lot more when I want to stay in the loop, and effort max is basically only if I want zero input or want to find security vulnerabilities.","createdAt":"2026-09-25T20:07:21.000Z","url":"https://x.com/trq212/status/2103577115010687067","likes":321,"retweets":23,"replies":14},{"text":"What is effort really? When do you change it it and why not just use max effort for everything? I dove deep into this problem, looking into evals and doing my own tests and I was quite surprised by the results.","createdAt":"2026-09-25T20:04:18.000Z","url":"https://x.com/trq212/status/2103576349499855160","likes":3517,"retweets":260,"replies":201}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"We’ve been thinking a lot about what it means to build the self-driving company. A big part of that is putting the ability to understand a business in everyone's hands. Atta has built a beautiful approach to business analysis and data visualization, and they share our belief that useful intelligence should be accessible to everyone. Welcoming Omar, Amine, and the Atta team to Replit!","createdAt":"2026-09-25T23:47:06.000Z","url":"https://x.com/amasad/status/2103632415185133992","likes":242,"retweets":10,"replies":24}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Cool 😂","createdAt":"2026-09-25T20:19:56.000Z","url":"https://x.com/rauchg/status/2103580284021354795","likes":178,"retweets":6,"replies":11},{"text":"We're helping world-class organizations like @klaviyo build agentic deployment platforms. ① Connect every agent (claude, codex, cursor…) ② Configure SSO via their IDP (Okta, Entra) ③ Now everyone can cook, securely® What happens to SaaS once every company sets this up? I get this question a lot 😁 First, the data must come from somewhere. These apps only work if they can be infused with business data. This is why we see the big enterprise SaaS players suddenly prioritize shipping CLIs and MCPs. Or dust off APIs they were neglecting for years. The new 'procurement bar' will be how ergonomic your product is for *agents*, rather than humans. How easily they can navigate your ontology and work…","createdAt":"2026-09-25T19:17:10.000Z","url":"https://x.com/rauchg/status/2103564484602384855","likes":183,"retweets":14,"replies":47},{"text":"The growth of has been mind-boggling. I watched it grow from idea, to first ship, to 𝚗𝚙𝚡 𝚜𝚔𝚒𝚕𝚕𝚜 being on every README of the internet. We used to write code, now we write English.","createdAt":"2026-09-25T17:55:42.000Z","url":"https://x.com/rauchg/status/2103543983557517340","likes":331,"retweets":7,"replies":43}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"You can’t automate what you can’t measure. This means that evals are one of the gates to diffusion of AI in the enterprise. We can test our deterministic processes through software, but most enterprises have no useful way of understanding how their non-deterministic processes are working today. Specifically the work that agents are doing for them. Evals are mission critical for enterprises adopting AI because you have no other way of knowing what’s working, what’s broken, what changed, what improved, what you can do more of, etc. if you don’t have a good sense of how agents work in your environment today. All changes, upgrades, and deployments are downstream from good evals. Not only are we…","createdAt":"2026-09-25T23:33:49.000Z","url":"https://x.com/levie/status/2103629073595728372","likes":195,"retweets":22,"replies":45}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Astra is very impressive","createdAt":"2026-09-26T00:56:55.000Z","url":"https://x.com/garrytan/status/2103649988282905001","likes":204,"retweets":6,"replies":21},{"text":"Legalize personalized education","createdAt":"2026-09-25T13:03:58.000Z","url":"https://x.com/garrytan/status/2103470568104468517","likes":3345,"retweets":480,"replies":305}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"Sooo. many. startups. But all investors want to invest in the same 10-30. This has always been true, but probably never to this extent. Hyper power law.","createdAt":"2026-09-25T18:20:20.000Z","url":"https://x.com/mattturck/status/2103550183506337835","likes":140,"retweets":2,"replies":26}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"keep thinking","createdAt":"2026-09-26T01:15:06.000Z","url":"https://x.com/steipete/status/2103654562523705675","likes":104,"retweets":5,"replies":10},{"text":"The biggest design mistake I made when we moved OC to sqlite: using sync db access. When it was just an agent that reports to you on Slack or iMessage this was fine; now that one agent might do 50 sessions in parallel and the whole team works on it, it is limiting. I have a /goal with Astra that so far landed 575 PRs to move everything to to async workers. We ship these improvements as we make progress. Pretty insane how even huge refactors are no longer scary.","createdAt":"2026-09-26T00:51:43.000Z","url":"https://x.com/steipete/status/2103648679169257737","likes":1043,"retweets":46,"replies":82},{"text":"day of the dead","createdAt":"2026-09-25T22:39:43.000Z","url":"https://x.com/steipete/status/2103615459426001163","likes":98,"retweets":5,"replies":4}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"i asked opus 5.5 to explain why personal benchmarks are so important (this is one shot)","createdAt":"2026-09-26T02:51:24.000Z","url":"https://x.com/danshipper/status/2103678798827020298","likes":48,"retweets":2,"replies":7}]},{"name":"Sam Altman","handle":"sama","bio":"The mission of OpenAI is to ensure that AGI benefits all of humanity","tweets":[{"text":"There is an extensive and ongoing review related to our agents’ use of internet access during training and evaluation. We’ve been publishing summaries at the link below and will continue to. We have not been as fast as we would have liked but we are trying to balance our desire for transparency with gaining a clear understanding from petabytes of agent activity logs, and working with impacted organizations. We are prioritizing as best as we can based on severity, and adding resources. Hugging Face is still the most severe event we’ve seen. We will be as transparent as we can be subject to things like vulnerabilities in other companies that our agents have found, which will be their call to…","createdAt":"2026-09-25T19:27:57.000Z","url":"https://x.com/sama/status/2103567198690349362","likes":4856,"retweets":311,"replies":782}]},{"name":"Claude","handle":"claudeai","bio":"Claude is an AI assistant built by @anthropicai to be safe, accurate, and secure. Talk to Claude on or download the app.","tweets":[{"text":"What are you going to explore with Opus 5.5 this weekend?","createdAt":"2026-09-25T16:03:12.000Z","url":"https://x.com/claudeai/status/2103515672777290083","likes":194,"retweets":2,"replies":59},{"text":"","createdAt":"2026-09-25T16:03:11.000Z","url":"https://x.com/claudeai/status/2103515670428238179","likes":293,"retweets":3,"replies":4},{"text":"","createdAt":"2026-09-25T16:03:11.000Z","url":"https://x.com/claudeai/status/2103515668171853944","likes":315,"retweets":9,"replies":3}]}]},"errors":[],"partial":false},{"date":"2026-09-26","dateLabel":"2026年09月26日","generatedAt":"2026-09-26T00:00:00+08:00","sourceGeneratedAt":"2026-09-25T06:43:22.960Z","stats":{"podcastEpisodes":1,"xBuilders":11,"totalTweets":23,"blogPosts":1},"highlights":[{"tag":"基础设施","title":"多模型时代的控制面，正在从 API 网关升级为模型操作系统","body":"当模型在能力、价格和任务类型上持续分化，固定绑定单一模型会把选择成本留给每个应用重复承担。新的基础设施价值不只在转发请求，而在理解任务、模型特长与成本约束，并持续决定调用谁；模型由此更像可调度资源，而不是产品唯一的智能内核。","evidence":[{"quote":"VAST Data 将模型视为类似 GPU 和 SSD 的资源，提出由基础设施理解不同模型的能力与成本，再把任务路由给合适模型。","attribution":"Renen Hallak · MAD Podcast","url":"https://www.youtube.com/@DataDrivenNYC/videos"},{"quote":"Vercel AI Gateway 的近两个月数据里，Anthropic、OpenAI 与开放模型的支出份额快速变化，OpenAI 已在 token 数上领先。","attribution":"Guillermo Rauch · @rauchg","url":"https://x.com/rauchg/status/2103216656747262419"}]},{"tag":"垂直软件","title":"AI 给小企业带来的不是一套通用副驾驶，而是每家店自己的软件","body":"小企业的差异通常藏在报价、获客、排班和客户沟通这些最后一公里流程里，标准 SaaS 很难完整覆盖。连接现有工具、把自然语言变成专属工作流后，定制软件的生产门槛会显著下降；竞争优势将更多来自流程被怎样编码，而不只是采购了哪款通用产品。","evidence":[{"quote":"Claude for Small Business 新增面向获客、询盘、提案与日常报告的工作流，并接入 Shopify、Salesforce、Xero、Stripe 等小企业现有工具。","attribution":"Claude Blog · Claude for Small Business","url":"https://claude.com/blog/claude-for-small-business-launches-new-workflows-integrations-and-training-programs"},{"quote":"每个小企业主，尤其是工匠行业，都会拥有定制软件；最后一公里正是为客户和员工创造独特体验的地方。","attribution":"Nikunj Kothari · @nikunj","url":"https://x.com/nikunj/status/2103360292973633770"}]},{"tag":"交互范式","title":"Agent 产品的模式切换，正在从厂商选项变成用户可编程界面","body":"规划、执行和头脑风暴并不是所有人都按同一顺序使用的固定阶段。把模式做成可创建、分享和重绑定的模块，意味着用户能把自己的工作方法嵌进产品；Agent 的界面也因此从预设流程，转向一套可扩展的认知控制层。","evidence":[{"quote":"Claude Code 计划把 plan mode 做成内置 mod，并允许其他 mod 添加新模式或覆盖 Shift+Tab。","attribution":"Thariq · @trq212","url":"https://x.com/trq212/status/2103212051065921632"},{"quote":"这一方案将允许用户自定义 plan mode 提示词、创建并分享自己的模式，或完全重新绑定快捷键。","attribution":"Thariq · @trq212","url":"https://x.com/trq212/status/2103212052391354794"}]},{"tag":"Agent 工程","title":"给 Agent 一个可验收的野心，比给它一句宽泛命令更可靠","body":"“清理一下”没有完成边界，Agent 很容易在最早的合理节点停止。把目标写成幅度、质量护栏和验收条件，会同时扩大搜索空间并约束副作用；这类目标规格正在成为人类管理 Agent 工作量和风险的实际接口。","evidence":[{"quote":"不要只让 Agent 清理代码；可以要求删除 20% 最无用的测试，同时把覆盖率变化控制在 2% 以内。","attribution":"Peter Steinberger · @steipete","url":"https://x.com/steipete/status/2103148444701610233"}]}],"matters":[{"kind":"内容策略","title":"高质量内容也能规模化，但复利来自长期积累","detail":"Swyx 表示“Scaling without Slop”开始显效：YouTube 第二个十万订阅的增长周期明显短于第一个十万。","url":"https://x.com/swyx/status/2103361254433993165"},{"kind":"消费实验","title":"Dreambeans 用每日限量把 AI 推荐重新指向真实社交","detail":"Google Labs 的实验每天只生成固定数量的“beans”，引导用户与现实中的人共同参与在意的活动。","url":"https://x.com/joshwoodward/status/2103182635992514569"},{"kind":"创作工具","title":"Muse 已能把创作结果直接变成 Replit 应用","detail":"Amjad Masad 宣布 Muse 现在可以在 Replit 上制作应用，创作入口与软件交付进一步接近。","url":"https://x.com/amasad/status/2103129037011120525"},{"kind":"创意产品","title":"Claude Code 团队把放大创作者能力作为产品目标","detail":"Thariq 在讨论 AI 与创造力时表示，希望产品更擅长赋能并放大创作者，而不是只替代制作步骤。","url":"https://x.com/trq212/status/2103259550325575806"},{"kind":"开源维护","title":"Agent 工具开始用于持续清理依赖中的长期缺陷","detail":"Peter Steinberger 用 Daybreak 又发现了 8 个长期存在的泄漏，并提醒开发者关注开源依赖的健康。","url":"https://x.com/steipete/status/2103200311641076100"}],"sources":{"podcasts":[{"title":"Who Feeds the GPUs? Inside AI's Hidden $30B Layer | Renen Hallak, VAST Data","name":"The MAD Podcast with Matt Turck","publishedAt":"2026-09-24T11:30:00.000Z","url":"https://www.youtube.com/@DataDrivenNYC/videos","excerpts":["Sometimes it scares me. We had a customer, one of these AI clouds, they said we're probably going to need about 500 petabytes over the next three years. Last week, came back to us and said, we're gonna need an extra two exabytes on top of that 500 petabytes. I think in the next ten years, we'll see more difference than we did in the last thousand years.","Hi. I'm Matt Turk. Welcome to the MAD podcast. We talk a lot about AI models on this show, and we talk a lot about compute. But today is about the layer in between, the crucial software infrastructure layer that feeds massive amounts of data to all those GPUs.","My guest today is Renan Halleck, founder and CEO of VAST Data, a company that is surprisingly under the radar considering it's been most recently valued at $30,000,000,000 and powers top AI players like xAI and some of the biggest AI neoclass in the world. Please enjoy my conversation with Renan Halleck. Renan, welcome. Thank you. Alright."]}],"blogs":[{"title":"Claude for Small Business launches new workflows, integrations, and training programs","source":"blog","publishedAt":"Sep 15, 2026","url":"https://claude.com/blog/claude-for-small-business-launches-new-workflows-integrations-and-training-programs","summary":""}],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"In Jan this year I called my content strategy shot: \"Scaling without Slop\". It's finally starting to work. It took us 3 years to reach our first 100k on youtube. It only took 1.2 months for the next 100k. Similar other metrics on AEO/SEO/subscriber traction and have a lot of New Media ideas that I'm excited to pursue. officially giving notice of the next phase of Latent Space, AINews, and what the rest of swyx inc has been cooking below","createdAt":"2026-09-25T05:49:36.000Z","url":"https://x.com/swyx/status/2103361254433993165","likes":23,"retweets":0,"replies":12},{"text":"more conferences could implement this. so much high value time wasted without thought","createdAt":"2026-09-24T20:42:07.000Z","url":"https://x.com/swyx/status/2103223477130129726","likes":504,"retweets":29,"replies":45}]},{"name":"Josh Woodward","handle":"joshwoodward","bio":"VP, @Google @GoogleLabs @GeminiApp @GoogleAIStudio","tweets":[{"text":"","createdAt":"2026-09-24T17:59:50.000Z","url":"https://x.com/joshwoodward/status/2103182638085501182","likes":5,"retweets":0,"replies":0},{"text":"Dreambeans is one of our newer experiments in @GoogleLabs. It h n AI? 06:20 \"We infer during the day, fine-tune at night\" 13:16 Announcement: frontier models & sensitive data 15:32 From P vs. NP to founding VAST Data 17:32 OpenAI, Navier–Stokes and 10,000 agent…","createdAt":"2026-09-24T16:59:49.000Z","url":"https://x.com/mattturck/status/2103167531917721866","likes":19,"retweets":8,"replies":9}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"“we believe that every small business owner, specifically for us in the trades, will have bespoke software, and that last mile is actually where differentiation can become, where you can provide a unique experience to your customers, to your employees”","createdAt":"2026-09-25T05:45:47.000Z","url":"https://x.com/nikunj/status/2103360292973633770","likes":4,"retweets":0,"replies":0},{"text":"This is the way..","createdAt":"2026-09-25T00:12:28.000Z","url":"https://x.com/nikunj/status/2103276414187548791","likes":31,"retweets":4,"replies":1},{"text":"We are in that stage of the \"revenue\" lifecycle..","createdAt":"2026-09-24T20:23:10.000Z","url":"https://x.com/nikunj/status/2103218709234172252","likes":9,"retweets":0,"replies":3}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"I put Daybreak on it and found 8 more long-standing leaks. Care for your oss dependencies!","createdAt":"2026-09-24T19:10:04.000Z","url":"https://x.com/steipete/status/2103200311641076100","likes":19,"retweets":0,"replies":7},{"text":"Afghanistan is more excited about AI than we are?","createdAt":"2026-09-24T15:52:04.000Z","url":"https://x.com/steipete/status/2103150483062014436","likes":317,"retweets":14,"replies":58},{"text":"If you just tell the agent to clean up, it will stop far too early. Give it an ambitious goal. Try \"remove 20% of the least useful tests while maintaining code coverage within 2%\"","createdAt":"2026-09-24T15:43:58.000Z","url":"https://x.com/steipete/status/2103148444701610233","likes":316,"retweets":10,"replies":12}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"so freaking cool","createdAt":"2026-09-25T00:42:00.000Z","url":"https://x.com/danshipper/status/2103283846645166283","likes":44,"retweets":1,"replies":3},{"text":"LIVE: Write-along","createdAt":"2026-09-24T17:01:59.000Z","url":"https://x.com/danshipper/status/2103168077102043373","likes":10,"retweets":0,"replies":2}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"It was great speaking with @SteveHiltonx at @spc for a conversation on California's future. We have more work to do. Onwards.","createdAt":"2026-09-24T21:08:51.000Z","url":"https://x.com/adityaag/status/2103230206005612661","likes":7,"retweets":2,"replies":0}]}]},"errors":[],"partial":false},{"date":"2026-09-25","dateLabel":"2026年09月25日","generatedAt":"2026-09-25T00:00:00+08:00","sourceGeneratedAt":"2026-09-24T06:42:38.168Z","stats":{"podcastEpisodes":0,"xBuilders":17,"totalTweets":37,"blogPosts":3},"highlights":[{"tag":"Agent 架构","title":"长任务 Agent 的可靠性，正在从“保住机器”转向“保住事件”","body":"当会话、执行循环与沙箱被拆成可替换组件，故障恢复就不再依赖某台持续存活的容器。真正需要持久化的是可重放的事件与状态；算力和执行环境反而可以按需创建、独立失败。这会让长任务系统更像成熟的分布式基础设施，而不是一台需要精心照料的远程电脑。","evidence":[{"quote":"Managed Agents 将 agent 虚拟化为 session、harness 和 sandbox；session 保存追加式事件日志，harness 或容器失败后都可重新启动并恢复。","attribution":"Anthropic Engineering · Scaling Managed Agents","url":"https://www.anthropic.com/engineering/managed-agents"},{"quote":"成功的 Agent 包含大脑、双手和文件；若要在云端经济地运行，就要把这些部分拆开。","attribution":"Guillermo Rauch · @rauchg","url":"https://x.com/rauchg/status/2102820148629614685"}]},{"tag":"安全边界","title":"Agent 安全的主战场不是“更聪明地拒绝”，而是“根本够不到”","body":"审批弹窗和模型防护都依赖概率判断，且会被疲劳、注入或能力提升逐渐侵蚀。更耐久的设计是先限定文件、网络、凭证和工具的可达范围，让一次判断失误只能造成有限损害。能力越强、自动运行越久，这种结构性隔离越应成为默认底座。","evidence":[{"quote":"文章将风险控制聚焦于 containment：通过沙箱、虚拟机、文件系统边界和出口控制，限制 Agent 实际能够触达的范围。","attribution":"Anthropic Engineering · How we contain Claude across products","url":"https://www.anthropic.com/engineering/how-we-contain-claude"}]},{"tag":"产品质量","title":"模型体验是“模型 × Harness”的乘积，优化任一层都可能让智能倒退","body":"用户感知到的能力并不只来自权重：默认推理强度、上下文保留和系统提示都会直接改变结果。局部优化延迟、成本或简洁度，可能同时削弱任务质量；因此 Agent 产品需要把配置和提示词当成模型版本同等级别的变更来评测、灰度和回滚。","evidence":[{"quote":"Claude Code 的质量报告最终追溯到三项独立改动：默认推理强度、闲置会话的思考清理，以及限制输出长度的系统提示；三项均已回退或修复。","attribution":"Anthropic Engineering · An update on recent Claude Code quality reports","url":"https://www.anthropic.com/engineering/april-23-postmortem"},{"quote":"一个实验室有最好的模型，另一个有最好的 harness。","attribution":"Peter Yang · @petergyang","url":"https://x.com/petergyang/status/2102952201350254667"}]},{"tag":"消费产品","title":"消费级 Agent 不会消灭选择，而会按任务重新分配选择权","body":"“用户想不想亲自做”不是固定偏好，而取决于过程本身是否有乐趣、风险与身份表达。适合 Agent 的入口不是笼统替代所有操作，而是识别用户此刻要探索还是要结果：前者增强比较与判断，后者把协调成本压到接近零。","evidence":[{"quote":"浏览衣服可能是娱乐，找屋顶工往往是折磨；即使购物，有时用户想浏览一小时，有时只想尽快收到合适的东西。","attribution":"Madhu Guru · @realmadhuguru","url":"https://x.com/realmadhuguru/status/2102777931764498536"}]}],"matters":[{"kind":"交互","title":"语音正在成为跨插件工作的统一入口","detail":"Thibault Sottiaux 描述了通过语音处理邮件、编码和日历，并让同一交互贯穿第三方插件生态。","url":"https://x.com/thsottiaux/status/2102814202117411196"},{"kind":"代码验证","title":"Claude 用局部建模与反例搜索处理高风险代码","detail":"Boris Cherny 澄清这并非验证整个代码库，而是针对状态机或易竞态区域建模、找反例、复现并修复。","url":"https://x.com/bcherny/status/2102898067133595992"},{"kind":"工作方法","title":"所谓 one-shot，背后往往是被隐藏的上下文工程","detail":"Thariq 指出，一次生成的展示可能建立在长提示、技能、示例和 API 密钥之上，不能只用轮次数判断难度。","url":"https://x.com/trq212/status/2102870353781641416"},{"kind":"创作","title":"创作工具降本之后，稀缺项仍是品味与表达意图","detail":"Aaron Levie 认为技术会扩展创作机会与叙事形式，但不会消除创意技能和品味的作用。","url":"https://x.com/levie/stat 43}]},{"name":"Boris Cherny","handle":"bcherny","bio":"Claude Code @anthropicai","tweets":[{"text":"It was an honor to meet Donald Knuth at the Computer History Museum today","createdAt":"2026-09-24T03:59:58.000Z","url":"https://x.com/bcherny/status/2102971275543216623","likes":1417,"retweets":25,"replies":50},{"text":"More details for the formal methods people -- what's happening is Claude is doing something like: 1. Building a model of the program, targeting a tricky state machine or race-prone part of the code 2. Finding counter-examples in the model. These are suspected bugs 3. Reproducing the bugs 4. Fixing the bugs in the code It's not that the whole codebase is formally verified (yet!..), more that the hairiest parts of the code are modeled, checked for counter-examples, and fixed.","createdAt":"2026-09-23T23:09:03.000Z","url":"https://x.com/bcherny/status/2102898067133595992","likes":68,"retweets":2,"replies":18},{"text":"If you've noticed how fast and the Desktop app have become in the last few weeks, here's how we did it. Lots of juicy learnings & techniques in the blog post for engineers working on speeding up your own apps.","createdAt":"2026-09-23T20:15:01.000Z","url":"https://x.com/bcherny/status/2102854267782705648","likes":3292,"retweets":103,"replies":160}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Can't wait for DevDay next Tuesday. Some really fun stuff, but also many many things that should change the way you work. It's been our most ambitious sprint and Astra has really made new things possible in such short amounts of time.","createdAt":"2026-09-24T05:39:27.000Z","url":"https://x.com/thsottiaux/status/2102996313780736363","likes":3159,"retweets":133,"replies":476},{"text":"Voice! I've gotten so used to just call ChatGPT and talk about all the work, check on emails, do some coding, manage my calendar and it works across the full ecosystem of plugins, including 3P developed plugins.","createdAt":"2026-09-23T17:35:48.000Z","url":"https://x.com/thsottiaux/status/2102814202117411196","likes":4009,"retweets":107,"replies":583}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"No more crappy corporate slides, the result of this prompt blew me away lol","createdAt":"2026-09-24T03:02:21.000Z","url":"https://x.com/petergyang/status/2102956775645552645","likes":206,"retweets":2,"replies":16},{"text":"With a model this good the Claude Code harness really needs great live voice and browser + computer use (latter is improving!) Right now one lab has the best model and another has the best harness.","createdAt":"2026-09-24T02:44:10.000Z","url":"https://x.com/petergyang/status/2102952201350254667","likes":25,"retweets":0,"replies":16},{"text":"Opus 5.5 is: - Smart - Fast - Fun to talk to - Good at writing - Friendly on rate limits - Constantly surprising at just how much it is capable of","createdAt":"2026-09-24T02:23:19.000Z","url":"https://x.com/petergyang/status/2102946952740741394","likes":309,"retweets":10,"replies":24}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"I respectfully disagree with @benthompson on this. He’s missing a key point - Consumers don’t have one relationship with “doing things”. I’ve learned it the hard way from building consumer and smb products for years at Google and now Meta. Browsing clothes can be entertainment (for some). But hiring a roofer is miserable (for most). Even with shopping, sometimes you want to browse for an hour. Sometimes you want the right thing just delivered asap. His argument sounds a lot like the early 2000s: “Why would I buy clothes online? I need to try them on.” “Why would I buy a $500 TV online? I will go check it out at Circuit City.” Technology keeps giving you better ways of doing things. Try hiri…","createdAt":"2026-09-23T15:11:41.000Z","url":"https://x.com/realmadhuguru/status/2102777931764498536","likes":146,"retweets":15,"replies":43}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"also it does look incredible","createdAt":"2026-09-23T21:19:17.000Z","url":"https://x.com/trq212/status/2102870443321676043","likes":101,"retweets":2,"replies":8},{"text":"the post: \"Claude one-shot this\" the prompt: 10k characters with good takes plus skills, examples and API keys","createdAt":"2026-09-23T21:18:56.000Z","url":"https://x.com/trq212/status/2102870353781641416","likes":1265,"retweets":25,"replies":54},{"text":"this is a new type of post we're trying where we share in-depth about how we do work using specific prompts and techniques you should be able to replicate let us know if it's useful or if you have any feedback!","createdAt":"2026-09-23T20:25:58.000Z","url":"https://x.com/trq212/status/2102857025206255902","likes":2289,"retweets":56,"replies":98}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"👀","createdAt":"2026-09-24T01:55:11.000Z","url":"https://x.com/amasad/status/2102939873384792340","likes":88,"retweets":2,"replies":8},{"text":"You need young people to break the mold, question deeply held beliefs, and attempt the impossible. The ideal college would cultivate exactly that.","createdAt":"2026-09-23T16:35:31.000Z","url":"https://x.com/amasad/status/2102799031038878172","likes":284,"retweets":22,"replies":36}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"ShellPerfBench. I'm really neurotic about the startup time of a new shell session. Opus 5.5 found a lot of really great optimizations other models missed. Anon, anytime you open a new terminal, you might be silently suffering. Tell your agent to optimize .𝚣𝚜𝚑𝚛𝚌 and friends","createdAt":"2026-09-24T02:26:27.000Z","url":"https://x.com/rauchg/status/2102947745132924993","likes":112,"retweets":2,"replies":33},{"text":"Muse, Instinct, OpenClaw, Claude Code… All successful agents have 3 key components: 🧠 Brain → model, harness (logic) 👐 Hands → tools, computer, browser 🗃️ Files → memories, skills, repos The 'easy' way is to throw all these in 1 stateful computer (a Mac Mini) Like, you run 𝚌𝚕𝚊𝚞𝚍𝚎 or 𝚏𝚡 in your mac, you keep it running all day with 𝚌𝚊𝚏𝚏𝚎𝚒𝚗𝚊𝚝𝚎, it has storage, and CLIs and apps installed. But if you want to cost-efficiently run agents in the cloud, you actually start breaking down these parts. 🧠 The harness can run in Fluid compute. To make it reliable across restarts, rollouts, crashes, you make its event log durable using Workflow. 👐 The hands can be a dedicated brows…","createdAt":"2026-09-23T17:59:26.000Z","url":"https://x.com/rauchg/status/2102820148629614685","likes":1453,"retweets":79,"replies":143}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Great vision for the future of the creative industry with AI from the one person who can actually predict these things. “As the barriers and the costs come down, more films will get made, not fewer. Studios will get to take more risks. There will be more seats at the table, and very soon entirely new forms of storytelling. In the 1980s, animation was dismissed as a niche corner of the business. Today it is one of the most beloved and profitable forms of storytelling in the world. In live action, filmmakers like Steven Spielberg, James Cameron and Peter Jackson embraced new visual tools not as shortcuts, but as instruments, and expanded cinema in the process. Every time storytelling has met…","createdAt":"2026-09-24T01:35:19.000Z","url":"https://x.com/levie/status/2102934874470617303","likes":81,"retweets":6,"replies":15},{"text":"Muse and Box, together at last","createdAt":"2026-09-24T00:19:46.000Z","url":"https://x.com/levie/status/2102915863989075979","likes":186,     }
    function renderHighlights(d) {
      const cards = (d.highlights || []).map(item => '<article class="card"><div class="tag">' + esc(item.tag) + '</div><h3>' + esc(item.title) + '</h3><p>' + esc(item.body) + '</p>' + ((item.evidence || []).length ? '<details><summary>查看原文依据</summary>' + item.evidence.map(renderEvidence).join('') + '</details>' : '') + '</article>').join('');
      return '<section><h2>洞察<span class="section-note">INSIGHTS / 经过判断的关键信号</span></h2><div class="grid">' + (cards || '<p class="empty">今天没有足够内容生成洞察。</p>') + '</div></section>';
    }
    function renderMatters(d) {
      const cards = (d.matters || []).map(item => '<article class="card"><div class="tag">' + esc(item.kind) + '</div><h3>' + link(item.url, item.title) + '</h3><p>' + esc(item.detail) + '</p></article>').join('');
      return '<section><h2>议题<span class="section-note">MATTERS / 值得继续追踪</span></h2><div class="grid">' + (cards || '<p class="empty">今天没有额外议题。</p>') + '</div></section>';
    }
    function renderSources(d) {
      const archive = d.archiveUrl ? '<p class="archive-link">' + link(d.archiveUrl, '查看当日完整存档 ↗') + '</p>' : '';
      const xGroups = ((d.sources || {}).x || []).map(builder => '<div class="source-group"><h3>' + esc(builder.name) + ' <span class="small">@' + esc(builder.handle) + '</span></h3><p class="small">' + esc(builder.bio) + '</p>' + (builder.tweets || []).map(tweet => '<p class="tweet">' + esc(tweet.text) + '<br>' + link(tweet.url, '原文') + ' <span class="small">likes ' + esc(tweet.likes) + ' · reposts ' + esc(tweet.retweets) + '</span></p>').join('') + '</div>').join('');
      const podcastGroups = ((d.sources || {}).podcasts || []).map(podcast => '<div class="source-group"><h3>' + link(podcast.url, podcast.title) + '</h3>' + (podcast.excerpts || []).map(e => '<blockquote>' + esc(e) + '</blockquote>').join('') + '</div>').join('');
      const blogGroups = ((d.sources || {}).blogs || []).map(blog => '<div class="source-group"><h3>' + link(blog.url, blog.title) + '</h3><p class="small">' + esc(blog.source || '') + '</p><p>' + esc(blog.summary || '') + '</p></div>').join('');
      return '<section><h2>原文<span class="section-note">SOURCES / 完整证据索引</span></h2>' + archive + '<div class="sources">' + podcastGroups + blogGroups + xGroups + '</div></section>';
    }
    function render() {
      const d = DIGESTS.find(item => item.date === selectedDate) || DIGESTS[0];
      if (!d) {
        document.getElementById('content').innerHTML = '<p class="empty">还没有 digest 数据。</p>';
        return;
      }
      selectedDate = d.date;
      renderDates();
      renderStats(d);
      document.getElementById('content').innerHTML = renderHighlights(d) + renderMatters(d) + renderSources(d);
    }
    render();
  </script>
</body>
</html>
