that would be wildly impractical, if not impossible, for a human engineer to pull off.\n\nExcept 𝚡𝚎𝚎𝚝 is structured as an \"autorepo.\" An oracle boots up Chrome, and verifies tens of thousands of text layout rules. A CI canary then watches the evolution of the original, and files signed PRs for agents to act on. It was conceived from the ground up around 'verification engineering', and the result speaks for itself.\n\nEnjoy!"}],"reviewNote":"核对原文具体动作、数字和限定；作者报告和推断不改写为独立实证。"}]}},{"tag":"实践","title":"Nate Parrott：在提示中明确限制模型偏爱的字体和颜色","body":"Peter Yang：Peter Yang 转述 Anthropic 的 Nate Parrott：Claude 每次创建作品都从新上下文出发，容易把自己偏爱的视觉样式当作原创。","claimType":"single_source","sourcePerspective":"Peter Yang","titleReview":{"id":"nov17-7","text":"Nate Parrott：在提示中明确限制模型偏爱的字体和颜色","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2122132596352327816","quote":"\"When you ask Claude to create something, it's operating in a fresh context where it thinks: Oh my God, the user asked me to make an app. I'm going to invent the most brilliant visual style.\"\n\nFrom @nateparrott at Anthropic on how to get Claude to avoid the same designs:\n\n\"It's going to be serif text, an off-white background, orange, and these bars on the edges of the cards. Because in Claude's mind, it's only ever done this once, so it thinks this is totally original.\n\nSo in our Claude Design prompt, we tell Claude, 'For this particular model, you tend to overly bias toward these two fonts and colors. So don't use them unless the user asks you to.' That tends to help a lot.\"\n\n📌 Watch our full episode here: https://t.co/HPX5HjXafX"}],"reviewNote":"核对原文具体动作、数字和限定；作者报告和推断不改写为独立实证。"},"evidence":[{"sourceId":"x:2122132596352327816","quote":"Because in Claude's mind, it's only ever done this once, so it thinks this is totally original.","translation":"因为在 Claude 的上下文里，它只做过这一次，所以认为这是完全原创的。","attribution":"Peter Yang","url":"https://x.com/petergyang/status/2122132596352327816"}],"detail":{"sources":[{"sourceId":"x:2122132596352327816","blocks":[{"type":"paragraph","sentences":[{"id":"nov17-8","text":"Peter Yang 转述 Anthropic 的 Nate Parrott：Claude 每次创建作品都从新上下文出发，容易把自己偏爱的视觉样式当作原创。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2122132596352327816","quote":"\"When you ask Claude to create something, it's operating in a fresh context where it thinks: Oh my God, the user asked me to make an app. I'm going to invent the most brilliant visual style.\""}],"reviewNote":"核对原文具体动作、数字和限定；作者报告和推断不改写为独立实证。"}]},{"type":"paragraph","sentences":[{"id":"nov17-9","text":"被举出的重复样式包括衬线文字、米白背景、橙色和卡片边缘的条状装饰。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2122132596352327816","quote":"\"It's going to be serif text, an off-white background, orange, and these bars on the edges of the cards. Because in Claude's mind, it's only ever done this once, so it thinks this is totally original."}],"reviewNote":"核对原文具体动作、数字和限定；作者报告和推断不改写为独立实证。"}]},{"type":"paragraph","sentences":[{"id":"nov17-10","text":"Nate 说，Claude Design 的提示会明确指出当前模型偏向的字体与颜色，要求除非用户提出，否则不要使用；他认为这通常很有帮助。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2122132596352327816","quote":"So in our Claude Design prompt, we tell Claude, 'For this particular model, you tend to overly bias toward these two fonts and colors. So don't use them unless the user asks you to.' That tends to help a lot.\""}],"reviewNote":"核对原文具体动作、数字和限定；作者报告和推断不改写为独立实证。"}]}],"coverageReview":{"details":"保留新上下文解释、四类重复特征、模型专属限制和用户例外。","limitations":"转述访谈观点，不把主观解释当成模型内部状态的直接测量。","omissions":"省略教程推广，不补视频中未采集的字体名称。"}}],"editorial":[{"id":"nov17-11","text":"这里把“避免雷同”变成了对已知视觉偏好的具体约束，同时保留用户明确指定时的例外；效果仍是受访者经验，而非量化测试。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2122132596352327816","quote":"\"When you ask Claude to create something, it's operating in a fresh context where it thinks: Oh my God, the user asked me to make an app. I'm going to invent the most brilliant visual style.\"\n\nFrom @nateparrott at Anthropic on how to get Claude to avoid the same designs:\n\n\"It's going to be serif text, an off-white background, orange, and these bars on the edges of the cards. Because in Claude's mind, it's only ever done this once, so it thinks this is totally original.\n\nSo in our Claude Design prompt, we tell Claude, 'For this particular model, you tend to overly bias toward these two fonts and colors. So don't use them unless the user asks you to.' That tends to help a lot.\"\n\n📌 Watch our full episode here: https://t.co/HPX5HjXafX"}],"reviewNote":"核对原文具体动作、数字和限定；作者报告和推断不改写为独立实证。"}]}},{"tag":"实践","title":"原型从数周缩到一两天，用户验证仍需要时间","body":"Peter Yang：Peter Yang 问 Nate Parrott，能轻松制作原型后，设计是否更有趣；Nate 先说明自己有工程背景，曾在 The Browser Company 开发 Arc。","claimType":"single_source","sourcePerspective":"Peter Yang","titleReview":{"id":"nov17-18","text":"原型从数周缩到一两天，用户验证仍需要时间","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2122060856498524510","quote":"\"Do you find being a designer more fun now that you can easily prototype everything?\"\n\nThat's the question I asked @nateparrott (Anthropic). His answer:\n\n\"I'm a little weird in that I have an engineering background. Before Anthropic, I worked at The Browser Company, where we made a browser called Arc.\n\nWe spent a year in pre-production before we released Arc. It took us a couple weeks to build out each idea and see which worked.\n\nNow at Anthropic, you can kind of do that in one to two days.\n\nSo you've really compressed the cycle of building. What you haven't compressed is the cycle of putting it in people's hands and understanding if they're going to use it.\"\n\n📌 Watch our full episode here: https://t.co/HPX5HjXafX"}],"reviewNote":"核对原文具体动作、数字和限定；作者报告和推断不改写为独立实证。"},"evidence":[{"sourceId":"x:2122060856498524510","quote":"What you haven't compressed is the cycle of putting it in people's hands and understanding if they're going to use it.","translation":"没有缩短的是把产品交到人们手里，并理解他们是否会使用它的周期。","attribution":"Peter Yang","url":"https://x.com/petergyang/status/2122060856498524510"}],"detail":{"sources":[{"sourceId":"x:2122060856498524510","blocks":[{"type":"paragraph","sentences":[{"id":"nov17-19","text":"Peter Yang 问 Nate Parrott，能轻松制作原型后，设计是否更有趣；Nate 先说明自己有工程背景，曾在 The Browser Company 开发 Arc。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2122060856498524510","quote":"\"Do you find being a designer more fun now that you can easily prototype everything?\"\n\nThat's the question I asked @nateparrott (Anthropic). His answer:\n\n\"I'm a little weird in that I have an engineering background. Before Anthropic, I worked at The Browser Company, where we made a browser called Arc."}],"reviewNote":"核对原文具体动作、数字和限定；作者报告和推断不改写为独立实证。"}]},{"type":"paragraph","sentences":[{"id":"nov17-20","text":"Nate 回忆，Arc 发布前做了一年预研，每个想法通常需要几周才能搭出来、判断是否可行。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2122060856498524510","quote":"We spent a year in pre-production before we released Arc. It took us a couple weeks to build out each idea and see which worked."}],"reviewNote":"核对原文具体动作、数字和限定；作者报告和推断不改写为独立实证。"}]},{"type":"paragraph","sentences":[{"id":"nov17-21","text":"他称现在在 Anthropic，类似工作可以在一到两天内完成。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2122060856498524510","quote":"Now at Anthropic, you can kind of do that in one to two days."}],"reviewNote":"核对原文具体动作、数字和限定；作者报告和推断不改写为独立实证。"}]},{"type":"paragraph","sentences":[{"id":"nov17-22","text":"他强调，缩短的是构建周期，把产品交给人使用并理解他们是否愿意使用的周期，并未同样缩短。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2122060856498524510","quote":"So you've really compressed the cycle of building. What you haven't compressed is the cycle of putting it in people's hands and understanding if they're going to use it.\""}],"reviewNote":"核对原文具体动作、数字和限定；作者报告和推断不改写为独立实证。"}]}],"coverageReview":{"details":"保留工程背景、Arc一年预研、数周到一两天以及用户验证边界。","limitations":"受访者跨公司经历，不是受控实验或普遍周期。","omissions":"省去推广链接。"}}],"editorial":[{"id":"nov17-23","text":"构建速度与用户验证速度是两个不同环节；这个个人经历支持更快试做想法，不支持按同一倍数推算产品验证提速。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2122060856498524510","quote":"\"Do you find being a designer more fun now that you can easily prototype everything?\"\n\nThat's the question I asked @nateparrott (Anthropic). His answer:\n\n\"I'm a little weird in that I have an engineering background. Before Anthropic, I worked at The Browser Company, where we made a browser called Arc.\n\nWe spent a year in pre-production before we released Arc. It took us a couple weeks to build out each idea and see which worked.\n\nNow at Anthropic, you can kind of do that in one to two days.\n\nSo you've really compressed the cycle of building. What you haven't compressed is the cycle of putting it in people's hands and understanding if they're going to use it.\"\n\n📌 Watch our full episode here: https://t.co/HPX5HjXafX"}],"reviewNote":"核对原文具体动作、数字和限定；作者报告和推断不改写为独立实证。"}]}}],"matters":[{"kind":"动态","title":"Context Window 摘要 skill 以无 skill 为基线迭代","detail":"Dan Shipper 报告，用 autoresearch 迭代摘要 skill，直到达到其个人偏好约 80% 的程度，并给出 Every Frontier 实验入口；推文正文未展开样本量与评分方法，不能把 80% 当作标准准确率。","sourceId":"x:2122091033001337134","url":"https://x.com/danshipper/status/2122091033001337134","images":[{"src":"assets/digest/2026-11-17/db7717638fc8bfd74f30aef2.jpg","originalUrl":"https://pbs.twimg.com/media/HXMuHDlWcAAObZb.jpg","sourceUrl":"https://x.com/danshipper/status/2122091033001337134","attribution":"Dan Shipper","sha256":"3f54a0f365f83445df50fda1ae0b2573b4265444e633e477ca8c8331e5eec498","width":697,"height":1199,"mediaId":"db7717638fc8bfd74f30aef2","alt":"作者分享的摘要 skill 实验记录截图，展示样例、检查项与迭代结果。"}]},{"kind":"动态","title":"Codex 容量报错可能已有修复","detail":"Thibault Sottiaux 表示团队可能修好了持续困扰用户的“model at capacity”错误；原帖使用 might，尚不是全面恢复或问题彻底解决的确认。","sourceId":"x:2122206990101536852","url":"https://x.com/thsottiaux/status/2122206990101536852","images":[{"src":"assets/digest/2026-11-17/e52778d7cc49965401067cd4.jpg","originalUrl":"https://pbs.twimg.com/media/HXOX68AaYAAlezW.jpg","sourceUrl":"https://x.com/thsottiaux/status/2122206990101536852","attribution":"Thibault Sottiaux","sha256":"c7a033a5e0dd1146081b1bb832b5ed4e25c4736c3c028e8ea5df375b6fadecad","width":1200,"height":703,"mediaId":"e52778d7cc49965401067cd4","alt":"Codex 官方容量错误趋势图，显示每日受影响用户比例与重试机制发布标记。"}]},{"kind":"动态","title":"Nan Yu 希望 Codex 能直接控制家庭自动化中枢","detail":"Nan Yu 征询即插即用的家庭自动化 hub，希望 Codex 能把它大致视作另一台电脑来控制；这是需求表达，没有选定产品或成功接入结果。","sourceId":"x:2122096965865664924","url":"https://x.com/thenanyu/status/2122096965865664924"},{"kind":"动态","title":"旧金山小型交流将讨论强化学习与自动化","detail":"Nikunj Kothari 预告 11 月 20 日中午在旧金山与 Core Automation 联合创始人 @kanavg1 交流 RL 方法、合成数据、循环与自动化；活动限线下 15 位听众、共 60 分钟，前 45 分钟访谈、后 15 分钟由嘉宾反问风投问题，并采用不公开记录与 Chatham House 规则。","sourceId":"x:2122042319419609105","url":"https://x.com/nikunj/status/2122042319419609105","images":[{"src":"assets/digest/2026-11-17/41d4063474020bce35deb6d8.jpg","originalUrl":"https://pbs.twimg.com/media/HXMCPkLboAApK84.jpg","sourceUrl":"https://x.com/nikunj/status/2122042319419609105","attribution":"Nikunj Kothari","sha256":"9b6d01f7d0fbb45694f7622cdc02a8b2a476b72743e988f16bfce63d0db11421","width":884,"height":1200,"mediaId":"41d4063474020bce35deb6d8","alt":"强化学习线下交流的活动详情截图，列出主持人与嘉宾、讨论方向及不公开记录规则。"}]}],"articles":{"blogs":[],"podcasts":[{"title":"Vlad Tenev：从数学工具到交易 agent，扩大个人参与的边界","sourceTitle":"Tokenization, Agentic Trading, Harmonic: Robinhood's Mission to Expand Ownership with CEO Vlad Tenev","sourceId":"03f99d40-d8c2-11f1-9c96-7b13ace0b070","sourceUrl":"https://www.youtube.com/@NoPriorsPodcast","sourceName":"No Priors","author":"Vlad Tenev","publishedAt":"2026-11-05T11:00:00.000Z","sourceTextSha256":"f6dfb57a89e54e90e5c3017b739b9513fd0460b51353aa2d24c8a2ae832d7938","linkScope":"channel","blocks":[{"type":"paragraph","text":"在 11 月 5 日的 No Priors 访谈中，Robinhood CEO Vlad Tenev 用“所有权”串起公司的多个方向：让更多人持有资产、接触早期公司，并使用过去更偏向专业机构的工具。他也把同一思路带到联合创办的 Harmonic，希望数学 AI 的发现能力交到用户手中。以下是其产品路线和判断，不把采用量或愿景写成投资收益保证。"},{"type":"heading","text":"童年的通胀经验，如何变成所有权使命"},{"type":"paragraph","text":"Tenev 回忆，家人从保加利亚移居美国时因经济条件分批团聚，早年经历停电、物资短缺与高通胀。他记得祖父把工资换成铜锅保存价值，也记得父母一边工作和求学，一边强调学业与家庭处境的关系。数学成为一条不断挑战自己的阶梯，后来吸引他的还有创造能流传很久的新理论。"},{"type":"paragraph","text":"这些经历让他把 Robinhood 从零佣金股票应用的起点，解释为逐步扩大资产所有权的过程。他认为广泛持有资产不仅涉及个人财富，也影响社会对经济体系的参与感；儿童账户、私人公司投资和资产代币化，在他的叙述里服务于这一共同目标。"},{"type":"heading","text":"数学 AI 的成果，应由更多使用者创造"},{"type":"paragraph","text":"谈到 Harmonic，他认为模型能力与输出可验证性结合，正在改变数学工作方式：版本控制和 Lean 等工具让数学更接近软件协作。他称 Aristotle 曾取得国际数学奥林匹克竞赛金牌级结果，公开后也被用于未解问题和新成果；这些均是受访者对项目的介绍。"},{"type":"paragraph","text":"他担心科学发现只由少数实验室的私有模型和员工完成。面对主持人关于更大算力可能压过人机协作的反问，他区分了“数学家做什么”和“谁拥有工具与成果”两个问题，主张把能力做成产品，让外部用户发现问题、创造成果，也更容易获得社会接受。这是组织与分配方式的立场，而非证明分布式研究必定更快。"},{"type":"heading","text":"代币化让资产成为可组合的软件部件"},{"type":"paragraph","text":"Tenev 用稳定币作类比：传统资产由机构托管，再对其发行与销毁代币，使其能在链上流转、按小份额交易并接入其他协议。他称类似方式可以用于股票、持有私人公司股份的载体，以及艺术品或房地产；不同资产的赎回等机制并不完全相同。"},{"type":"paragraph","text":"按其介绍，Robinhood 早期在欧洲推出的股票代币还不能自由转出与 DeFi 组合，后续版本结合 Robinhood Chain 扩展了这些能力。开发者据此尝试智能合约、NFT、组合资产等，他希望提供基础部件，让开发者发现新用途，而不是预先规定全部产品形态。"},{"type":"paragraph","text":"他承认公司主导一条链与组织上的充分去中心化存在取舍，但认为明确方向与品牌支持能提高开发者信心。关于覆盖更多国家、降低参与门槛和开发者活跃度的描述，是其商业愿景与自报观察，访谈没有独立核验各地区可用性或资产权利细节。"},{"type":"heading","text":"预测市场：表达判断，也提供信息"},{"type":"paragraph","text":"他把预测市场理解为更直接表达某种判断的方式：相比买股票间接押注公司业绩，拟推出的 KPI 合约希望围绕收入、每股收益等具体指标交易。他还认为概率可以像新闻版面一样提供信息，有人只查看赔率而不交易。这里既有已介绍的用法，也有计划中的产品，不代表这些市场能准确预测所有事件。"},{"type":"heading","text":"从交易 MCP，到账户内的 agent 工作台"},{"type":"paragraph","text":"在 agent finance 方面，他称 Robinhood 先推出 MCP 接口与 Agentic Trading，几个月内已有超过 15 万名客户开设相关账户，最近公布的调用量约为每天 3000 万次。这些是账户和工具调用的自报规模，并非策略盈利或活跃交易人数的证明。"},{"type":"paragraph","text":"进一步的 Robinhood Agents 把 harness 和界面放到账户内，支持运行策略循环、再平衡等 skills，并通过应用入口连接额外数据。他以零售商停车场车辆的卫星数据为例，说明用户可能如何构建策略；产品目标是让个人更容易使用原本需要编程、部署与专业基础设施的能力。"},{"type":"paragraph","text":"他预计初期采用集中在较专业的用户，之后才逐步扩散，并以编程 agent 从程序员走向非程序员的过程作类比。减少从想法到策略的操作阻力，是他看好的需求方向，不等于减少市场风险或保证获利。"},{"type":"heading","text":"独立资金账户与审批，构成当前边界"},{"type":"paragraph","text":"谈到防护，他介绍用户需另建账户并主动转入资金，与主要余额隔离；交易默认需批准，用户可以关闭批准要求，agent 仍不能因此进入其他账户。团队自行建设和改进沙箱与 harness。这些是他描述的权限边界，并不使账户内交易没有损失风险。"},{"type":"paragraph","text":"主持人进一步追问，若更多人自动交易，会不会像代码生成挤压 CI/CD 一样造成新负载。Tenev 回答，Robinhood 需要优化自己控制的数据库、策略运行环境与沙箱，而做市商和交易所已有高频交易推动的基础设施；他认为当前 agent 交易占比仍低，有时间观察扩张，但承认规模变化可能带来新的监管与特殊情形。"},{"type":"heading","text":"让零售用户更早参与私人公司"},{"type":"paragraph","text":"访谈随后回到 AI 收益分配。Tenev 认为，成长公司能长期在私募市场融资，普通人在上市后才参与，可能错过此前的增长；这种所有权分布也影响公众如何看待 AI。他以加密资产较早形成个人持有群体作对照，同时承认许多参与者会亏损。"},{"type":"paragraph","text":"他介绍 Robinhood Ventures 的思路：通过公开交易载体汇集零售资金，再投资私人公司；其描述中，第一支基金侧重晚期项目，第二支与 YC 合作，尝试更早期的种子轮和 A 轮。他明确早期机会也伴随更高风险，并把私人资产代币化视为另一条路径，其中美国内外的安排有区别。"},{"type":"paragraph","text":"对于投资者资格，他支持降低基于资产的门槛，倾向用知识和更充分披露代替过度限制；主持人则提出防欺诈与保护投资者的理由。节目中提到的考试和规则变化属于当时访谈内容，本篇不把它作为现行开户资格说明，核心争论是个人自主选择与适当保护如何平衡。"},{"type":"heading","text":"从出生持有资产，到面对长期挑战"},{"type":"paragraph","text":"Tenev 还介绍 Robinhood 与 BNY、财政部及 IRS 参与儿童账户计划，希望通过低成本分散 ETF 让儿童从早期持有美国经济的一部分，并谈到政府种子资金与私人捐赠。他将扩大持有率描述为长期目标；节目中的资格、金额与执行安排没有在此作为申请指南展开。"},{"type":"paragraph","text":"结尾回到领导者面对挑战的方式。他把自己的稳定部分归于童年家庭压力、独立性和亲人的支持，也承认性格与环境难以区分。他希望孩子有机会经历挑战，却尚未找到简单答案；对自己而言，能训练的是应对外界压力的能力，而非控制外界。整场访谈因此回到同一条主线：把工具和参与机会交给更多人，同时面对真实的制度、权限和风险边界。"}]}]},"quality":{"collected":20,"collectedTweets":19,"used":8,"usedTweets":7,"uniqueAuthors":7,"imageCount":3,"claimAudit":{"reviewMode":"editorial review plus structural checks; not automated proof of meaning","claimsReviewed":17,"warnings":[]},"status":"degraded","warnings":["Quoted-post context missing: x:2122132596352327816","Quoted-post context missing: x:2122060856498524510","Media unverified: podcasts:03f99d40-d8c2-11f1-9c96-7b13ace0b070 (feed_has_no_media_or_supported_post_locator)"]},"contentSchemaVersion":2,"sourceSnapshotSha256":"e2de1c25e2843d5b19b24f2e50b94f7ba92d05cf16c79f5a6ce0336b2657ed18","selection":{"sources":[{"sourceId":"x:2122066060769952161","decision":"excluded","reason":"指代normal但缺 "retweets":1,"replies":0}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Codex team might have actually fixed the \"model at capacity\" errors that have been pestering you.","createdAt":"2026-11-16T05:55:49.000Z","url":"https://x.com/thsottiaux/status/2122206990101536852","likes":2500,"retweets":84,"replies":795}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"\"When you ask Claude to create something, it's operating in a fresh context where it thinks: Oh my God, the user asked me to make an app. I'm going to invent the most brilliant visual style.\" From @nateparrott at Anthropic on how to get Claude to avoid the same designs: \"It's going to be serif text, an off-white background, orange, and these bars on the edges of the cards. Because in Claude's mind, it's only ever done this once, so it thinks this is totally original. So in our Claude Design prompt, we tell Claude, 'For this particular model, you tend to overly bias toward these two fonts and colors. So don't use them unless the user asks you to.' That tends to help a lot.\" 📌 Watch our full…","createdAt":"2026-11-16T01:00:12.000Z","url":"https://x.com/petergyang/status/2122132596352327816","likes":51,"retweets":1,"replies":24},{"text":"\"Do you find being a designer more fun now that you can easily prototype everything?\" That's the question I asked @nateparrott (Anthropic). His answer: \"I'm a little weird in that I have an engineering background. Before Anthropic, I worked at The Browser Company, where we made a browser called Arc. We spent a year in pre-production before we released Arc. It took us a couple weeks to build out each idea and see which worked. Now at Anthropic, you can kind of do that in one to two days. So you've really compressed the cycle of building. What you haven't compressed is the cycle of putting it in people's hands and understanding if they're going to use it.\" 📌 Watch our full episode here:","createdAt":"2026-11-15T20:15:08.000Z","url":"https://x.com/petergyang/status/2122060856498524510","likes":42,"retweets":0,"replies":10},{"text":"Alright I can't help it: NYTimes published this article that \"US intelligence had believed\" Alice Huang was a spy: But there's still no proof one way or another whether she was a spy or not, per CNN: So where did this spy narrative come from? Show us the evidence?","createdAt":"2026-11-15T18:50:54.000Z","url":"https://x.com/petergyang/status/2122039657001300125","likes":109,"retweets":2,"replies":14}]},{"name":"Nan Yu","handle":"thenanyu","bio":"product, codex @openai. prev head of product @linear","tweets":[{"text":"What’s the best home automation hub out there if I just wanna use Codex to control everything? Ideally, something plug-and-play that my Codex just sees as another computer, more or less","createdAt":"2026-11-15T22:38:37.000Z","url":"https://x.com/thenanyu/status/2122096965865664924","likes":18,"retweets":0,"replies":10},{"text":"It’s cute that my Waymo turns on its windshield wipers in the rain","createdAt":"2026-11-15T22:35:16.000Z","url":"https://x.com/thenanyu/status/2122096121946468451","likes":57,"retweets":2,"replies":2}]},{"name":"Thariq","handle":"trq212","bio":"playing WoW forever, formerly Claude Code @anthropicai","tweets":[{"text":"a new arena and two new characters","createdAt":"2026-11-16T02:25:45.000Z","url":"https://x.com/trq212/status/2122154124024381828","likes":956,"retweets":11,"replies":54}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"It’s been an interesting 48 hours.","createdAt":"2026-11-16T04:31:28.000Z","url":"https://x.com/amasad/status/2122185760799609017","likes":491,"retweets":21,"replies":30},{"text":"Good summary.","createdAt":"2026-11-15T20:21:21.000Z","url":"https://x.com/amasad/status/2122062419010961439","likes":336,"retweets":18,"replies":12}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Introducing 𝚡𝚎𝚎𝚝: A hermetic, pixel-perfect X post renderer in safe Rust / wasm. Zero browser, network, filesystem, system fonts. Renders a post to PNG in ~1ms (and 0.4 ms for @jack's \"setting up my twttr\" 😁). X is the global town square, and the medium is the message. Being able to preview what things will look like before posting is great for both humans and agents. Rendering with xeet is is 100x-1000x faster than booting up a browser and taking a screenshot, yet it's just as accurate. It reproduces Blink & HarfBuzz text shaping, 1/64px line breaking, RTL bidi, 28 Chirp font subsets, CJK/Math/Emoji fallbacks, \"Show more\" rules, etc. It's the kind of thing that would be wildly impract…","createdAt":"2026-11-16T04:27:37.000Z","url":"https://x.com/rauchg/status/2122184794209714368","likes":629,"retweets":27,"replies":81},{"text":"AI models are getting really good at naming things. I created a little CLI to diagnose system slowdowns, and it named it 𝚑𝚘𝚐 🐖, which I love. Given they're already good at cache invalidation, maybe computer science's hardest problems are solved after all 😂","createdAt":"2026-11-16T00:38:27.000Z","url":"https://x.com/rauchg/status/2122127120055034258","likes":459,"retweets":8,"replies":110}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Harvard’17. Instagram: GitHub:","tweets":[{"text":"Being good at LinkedIn probably makes you bad at X","createdAt":"2026-11-15T17:38:17.000Z","url":"https://x.com/zarazhangrui/status/2122021380745290202","likes":122,"retweets":3,"replies":33},{"text":"I love this store so much 😭","createdAt":"2026-11-15T17:36:59.000Z","url":"https://x.com/zarazhangrui/status/2122021053442703852","likes":21,"retweets":0,"replies":2}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"Next guest up in this weekly series is @kanavg1, cofounder of @coreauto on Friday, Nov 20th at noon. For this session, we'll be chatting about all things RL (methods, synthetic data, loops, automation etc) Format: > 60 minute sessions (IRL only) in SF > For the first 45 mins, I get to ask the guest spicy questions about their expertise > For the last 15 mins, they get to ask me anything they want to learn about venture > All off the record, chatham house rules > Open to 15 guests who listen in and can ask some of their own questions Register here if you want to join, and subscribe to the Luma for future guests:","createdAt":"2026-11-15T19:01:29.000Z","url":"https://x.com/nikunj/status/2122042319419609105","likes":58,"retweets":1,"replies":4}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"we've been working hard on compounding skills lately (skills that get better every time you use them) and i think @hammer_mt finally cracked it this weekend i made a skill to help us write context window summaries, and used autoresearch to iterate until it hit 80% of my taste on summaries vs. a no-skill baseline full writeup for your agnets on the @every frontier feed:","createdAt":"2026-11-15T22:15:03.000Z","url":"https://x.com/danshipper/status/2122091033001337134","likes":143,"retweets":4,"replies":30}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"One of our aerospace companies in India shared this with me today morning. The journey to the stars starts with a single plane on a remote runway on an early Sunday morning. Ad Astra. @shreepoorna365 @arctusaerospace","createdAt":"2026-11-15T16:26:11.000Z","url":"https://x.com/adityaag/status/2122003237335343457","likes":114,"retweets":13,"replies":5}]}]},"errors":[],"partial":false},{"date":"2026-11-16","dateLabel":"2026年11月16日","generatedAt":"2026-11-16T00:00:00+08:00","sourceGeneratedAt":"2026-11-15T06:26:52.164Z","stats":{"podcastEpisodes":1,"xBuilders":13,"totalTweets":26,"blogPosts":0},"highlights":[{"tag":"实践","title":"Aaron Levie：更多工作可能转成 agent 擅长的软件任务","body":"Aaron Levie：Aaron Levie 预计，模型在编程、工具与电脑使用、数学等方面会继续进步，因此能操作软件或生成代码的 agent，其改善速度可能快于其他知识工作领域。","claimType":"single_source","sourcePerspective":"Aaron Levie","titleReview":{"id":"nov16-1","text":"Aaron Levie：更多工作可能转成 agent 擅长的软件任务","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2121686564078297461","quote":"AI models are inevitably going to keep getting better and better at all coding, tool and computer use, math, and other coding-related tasks. As a result, agents that can use software to do their work, or generate code from scratch, will improve at a faster rate than all other domains of knowledge work.\n\nOn one hand that could mean that only a small subset of work can get automated. But probably what happens is that more and more work just becomes coding-shaped to adapt to what agents are good at.\n\nYou can see it in the most recent examples of model releases in the past couple of months, where agents can generate code that becomes animated videos, games, 3D models for products, and so on. We also know that tool use gives agents the ability to work with much of the same software that people already work with. This helps in cyber, life sciences, finance, and a number of other domains.\n\nOur mental model traditionally has been that the models have to be able to know everything about anything to generate value, but in reality they *really* have to know how to use or generate software effectively combined with deep domain expertise to make the right judgment calls inside of workflows. \n\nWhen you have that powerful combination, almost everything else gets unlocked. This is why the acceleration of agents in knowledge work is only going to increase from here."}],"reviewNote":"逐句核对原文，保留作者自述、预测和例子，不把主张写成独立实证。"},"evidence":[{"sourceId":"x:2121686564078297461","quote":"On one hand that could mean that only a small subset of work can get automated.","translation":"一方面，这可能意味着只有很小一部分工作能被自动化。","attribution":"Aaron Levie","url":"https://x.com/levie/status/2121686564078297461"}],"detail":{"sources":[{"sourceId":"x:2121686564078297461","blocks":[{"type":"paragraph","sentences":[{"id":"nov16-2","text":"Aaron Levie 预计，模型在编程、工具与电脑使用、数学等方面会继续进步，因此能操作软件或生成代码的 agent，其改善速度可能快于其他知识工作领域。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2121686564078297461","quote":"AI models are inevitably going to keep getting better and better at all coding, tool and computer use, math, and other coding-related tasks. As a result, agents that can use software to do their work, or generate code from scratch, will improve at a faster rate than all other domains of knowledge work."}],"reviewNote":"逐句核对原文，保留作者自述、预测和例子，不把主张写成独立实证。"}]},{"type":"paragraph","sentences":[{"id":"nov16-3","text":"他提出两种可能：自动化只覆盖少量工作，或更多工作主动调整为适合编码处理的形态；他更倾向后者。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2121686564078297461","quote":"On one hand that could mean that only a small subset of work can get automated. But probably what happens is that more and more work just becomes coding-shaped to adapt to what agents are good at."}],"reviewNote":"逐句核对原文，保留作者自述、预测和例子，不把主张写成独立实证。"}]},{"type":"paragraph","sentences":[{"id":"nov16-4","text":"他列举生成代码来制作动画视频、游戏和产品 3D 模型的例子，并认为工具使用能让 agent 操作人已在使用的软件，延伸到网络安全、生命科学和金融等领域。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2121686564078297461","quote":"You can see it in the most recent examples of model releases in the past couple of months, where agents can generate code that becomes animated videos, games, 3D models for products, and so on. We also know that tool use gives agents the ability to work with much of the same software that people already work with. This helps in cyber, life sciences, finance, and a number of other domains."}],"reviewNote":"逐句核对原文，保留作者自述、预测和例子，不把主张写成独立实证。"}]},{"type":"paragraph","sentences":[{"id":"nov16-5","text":"他的核心主张是，有效使用或生成软件还必须结合深厚领域知识，才能在工作流中作出正确判断；他据此看好知识工作中 agent 的持续加速。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2121686564078297461","quote":"Our mental model traditionally has been that the models have to be able to know everything about anything to generate value, but in reality they *really* have to know how to use or generate software effectively combined with deep domain expertise to make the right judgment calls inside of workflows. \n\nWhen you have that powerful combination, almost everything else gets unlocked. This is why the acceleration of agents in knowledge work is only going to increase from here."}],"reviewNote":"逐句核对原文，保留作者自述、预测和例子，不把主张写成独立实证。"}]}],"coverageReview":{"details":"保留能力进步、两种走向、动画游戏3D示例、跨领域工具使用与领域判断。","limitations":"作者预测，原帖未提供自动化比例或行业成效数据。","omissions":"省去重复强调加速的修辞。"}}],"editorial":[{"id":"nov16-6","text":"这个判断把软件操作能力与领域判断放在一起；“工作变得适合编码”是作者对采用路径的预测，不能据此认定所有行业已具备自动化条件。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2121686564078297461","quote":"AI models are inevitably going to keep getting better and better at all coding, tool and computer use, math, and other coding-related tasks. As a result, agents that can use software to do their work, or generate code from scratch, will improve at a faster rate than all other domains of knowledge work.\n\nOn one hand that could mean that only a small subset of work can get automated. But probably what happens is that more and more work just becomes coding-shaped to adapt to what agents are good at.\n\nYou can see it in the most recent examples of model releases in the past couple of months, where agents can generate code that becomes animated videos, games, 3D models for products, and so on. We also know that tool use gives agents the ability to work with much of the same software that people already work with. This helps in cyber, life sciences, finance, and a number of other domains.\n\nOur mental model traditionally has been that the models have to be able to know everything about anything to generate value, but in reality they *really* have to know how to use or generate software effectively combined with deep domain expertise to make the right judgment calls inside of workflows. \n\nWhen you have that powerful combination, almost everything else gets unlocked. This is why the acceleration of agents in knowledge work is only going to increase from here."}],"reviewNote":"逐句核对原文，保留作者自述、预测和例子，不把主张写成独立实证。"}]}},{"tag":"实践","title":"UI SDK 演示：两次提示复用 14 项交互行为","body":"Guillermo Rauch：Guillermo Rauch 分享了一次 UI SDK 实践：用 fx 与 Gemini Argon，通过两次提示构建纯 Web Components 界面，没有使用框架。","claimType":"single_source","sourcePerspective":"Guillermo Rauch","titleReview":{"id":"nov16-7","text":"UI SDK 演示：两次提示复用 14 项交互行为","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2121804295381377342","quote":"Got to experience the magic of @uisdk.\n\nTwo prompts of fx + Gemini Argon. Pure Web Components. No framework.\n\nThe agent reused 14 UI SDK behaviors out of the box 🤯: window resizing, drag, menubar hover-switching,  typeahead, roving toolbar focus, 10-band EQ sliders, scoped hotkeys, ARIA, and WebMCP agent control.\n\nhttps://t.co/1Ol3xqKWJz (source linked)\nMusic by @suno."}],"reviewNote":"逐句核对原文，保留作者自述、预测和例子，不把主张写成独立实证。"},"evidence":[{"sourceId":"x:2121804295381377342","quote":"Got to experience the magic of @uisdk.","translation":"体验到了 UI SDK 的魅力。","attribution":"Guillermo Rauch","url":"https://x.com/rauchg/status/2121804295381377342"}],"detail":{"sources":[{"sourceId":"x:2121804295381377342","blocks":[{"type":"paragraph","sentences":[{"id":"nov16-8","text":"Guillermo Rauch 分享了一次 UI SDK 实践：用 fx 与 Gemini Argon，通过两次提示构建纯 Web Components 界面，没有使用框架。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2121804295381377342","quote":"Two prompts of fx + Gemini Argon. Pure Web Components. No framework."}],"reviewNote":"逐句核对原文，保留作者自述、预测和例子，不把主张写成独立实证。"}]},{"type":"paragraph","sentences":[{"id":"nov16-9","text":"他称 agent 直接复用了 14 项 UI SDK 行为，并列出窗口调整、拖动、菜单悬停切换、输入匹配、工具栏焦点移动、十段均衡器滑杆、局部快捷键、ARIA 与 WebMCP agent 控制等例子。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2121804295381377342","quote":"The agent reused 14 UI SDK behaviors out of the box 🤯: window resizing, drag, menubar hover-switching,  typeahead, roving toolbar focus, 10-band EQ sliders, scoped hotkeys, ARIA, and WebMCP agent control."}],"reviewNote":"逐句核对原文，保留作者自述、预测和例子，不把主张写成独立实证。"}]},{"type":"paragraph","sentences":[{"id":"nov16-10","text":"帖子附有演示链接，注明可找到源码，音乐来自 Suno。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2121804295381377342","quote":"https://t.co/1Ol3xqKWJz (source linked)\nMusic by @suno."}],"reviewNote":"逐句核对原文，保留作者自述、预测和例子，不把主张写成独立实证。"}]}],"coverageReview":{"details":"保留工具组合、两次提示、无框架、14项与全部列举行为、源码及音乐归属。","limitations":"作者单次演示，未独立复测；列表并未逐项列全14个，不补剩余项目。","omissions":"省去惊叹与表情。"}}],"editorial":[{"id":"nov16-11","text":"这次演示说明作者在复用具体交互行为，而不是只生成静态外观；两次提示与 14 项行为是单次实践记录，不能当作普遍开发效率。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2121804295381377342","quote":"Got to experience the magic of @uisdk.\n\nTwo prompts of fx + Gemini Argon. Pure Web Components. No framework.\n\nThe agent reused 14 UI SDK behaviors out of the box 🤯: window resizing, drag, menubar hover-switching,  typeahead, roving toolbar focus, 10-band EQ sliders, scoped hotkeys, ARIA, and WebMCP agent control.\n\nhttps://t.co/1Ol3xqKWJz (source linked)\nMusic by @suno."}],"reviewNote":"逐句核对原文，保留作者自述、预测和例子，不把主张写成独立实证。"}]}},{"tag":"实践","title":"Peter Yang：升级模型时可分别审计配置与单个 skill","body":"Peter Yang：Peter Yang 推荐在 Fable 5.2 中尝试两种审计提示。","claimType":"single_source","sourcePerspective":"Peter Yang","titleReview":{"id":"nov16-12","text":"Peter Yang：升级模型时可分别审计配置与单个 skill","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2121649295950762363","quote":"Two very useful prompts to try with Fable 5.2:\n\n\"/doctor prompt-audit\": Audits your Claude Code setup (Claude md, skills, commands) and proposes fixes.\n\n\"/claude-api prompt-audit [skill name]\": Audits one skill in depth.\n\nI wish Claude Code auto-suggested running these every time Anthropic releases a new model.\n\n📌 Watch my full tutorial on how I use Fable and Opus here: https://t.co/slyEbWvvqA"}],"reviewNote":"逐句核对原文，保留作者自述、预测和例子，不把主张写成独立实证。"},"evidence":[{"sourceId":"x:2121649295950762363","quote":"I wish Claude Code auto-suggested running these every time Anthropic releases a new model.","translation":"我希望 Anthropic 每次发布新模型时，Claude Code 都能自动建议运行这些审计。","attribution":"Peter Yang","url":"https://x.com/petergyang/status/2121649295950762363"}],"detail":{"sources":[{"sourceId":"x:2121649295950762363","blocks":[{"type":"paragraph","sentences":[{"id":"nov16-13","text":"Peter Yang 推荐在 Fable 5.2 中尝试两种审计提示。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2121649295950762363","quote":"Two very useful prompts to try with Fable 5.2:"}],"reviewNote":"逐句核对原文，保留作者自述、预测和例子，不把主张写成独立实证。"}]},{"type":"paragraph","sentences":[{"id":"nov16-14","text":"“/doctor prompt-audit”用于审计 Claude Code 的 Claude md、skills 和 commands 配置，并提出修复建议。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2121649295950762363","quote":"\"/doctor prompt-audit\": Audits your Claude Code setup (Claude md, skills, commands) and proposes fixes."}],"reviewNote":"逐句核对原文，保留作者自述、预测和例子，不把主张写成独立实证。"}]},{"type":"paragraph","sentences":[{"id":"nov16-15","text":"“/claude-api prompt-audit [skill name]”用于深入审计一个指定 skill。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2121649295950762363","quote":"\"/claude-api prompt-audit [skill name]\": Audits one skill in depth."}],"reviewNote":"逐句核对原文，保留作者自述、预测和例子，不把主张写成独立实证。"}]},{"type":"paragraph","sentences":[{"id":"nov16-16","text":"他希望每次 Anthropic 发布新模型时，Claude Code 都能主动建议运行这些审计；这是愿望，不是已经自动触发的功能。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2121649295950762363","quote":"I wish Claude Code auto-suggested running these every time Anthropic releases a new model."}],"reviewNote":"逐句核对原文，保留作者自述、预测和例子，不把主张写成独立实证。"}]}],"coverageReview":{"details":"保留两个完整命令、各自检查范围、建议修复及自动提醒的愿望。","limitations":"用户分享而非官方保证；图片包含执行失败提示，不包装为全流程成功。","omissions":"省略教程推广链接的重复介绍，不补视频内容。"}}],"editorial":[{"id":"nov16-17","text":"作者将全局配置检查和单个 skill 深查分开，并把新模型发布作为重新审视提示词的时机；原帖没有证明审计能自动修好全部问题。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2121649295950762363","quote":"Two very useful prompts to try with Fable 5.2:\n\n\"/doctor prompt-audit\": Audits your Claude Code setup (Claude md, skills, commands) and proposes fixes.\n\n\"/claude-api prompt-audit [skill name]\": Audits one skill in depth.\n\nI wish Claude Code auto-suggested running these every time Anthropic releases a new model.\n\n📌 Watch my full tutorial on how I use Fable and Opus here: https://t.co/slyEbWvvqA"}],"reviewNote":"逐句核对原文，保留作者自述、预测和例子，不把主张写成独立实证。"}]},"images":[{"src":"assets/digest/2026-11-16/7933deb270225f58ca1c49dd.jpg","originalUrl":"https://pbs.twimg.com/media/HXGcyp1bsAAefPe.jpg","sourceUrl":"https://x.com/petergyang/status/2121649295950762363","attribution":"Peter Yang","sha256":"4069edf513b3f43fc5744fc574936c664962b648b38fea6a735ca95a7806afc9","width":1200,"height":741,"mediaId":"7933deb270225f58ca1c49dd","alt":"Peter Yang 的 prompt-audit 操作截图，显示审计过程及一条命令失败提示。"}]}],"matters":[{"kind":"动态","title":"Gemini 增加 Google Wallet 连接","detail":"Josh Woodward 介绍，可连接 Google Wallet 获得个人支出洞察，包括即时生成消费图表、发现订阅涨价，以及根据去年实际支出制定节日预算；此帖介绍功能示例，不是效果测评。","sourceId":"x:2121755282326102417","url":"https://x.com/joshwoodward/status/2121755282326102417","images":[{"src":"assets/digest/2026-11-16/739aaf1764350c2cc3cfcb67.png","originalUrl":"https://pbs.twimg.com/media/HXH6bLkbEAAyhJN.png","sourceUrl":"https://x.com/joshwoodward/status/2121755282326102417","attribution":"Josh Woodward","sha256":"244527ce2593a6f75664a259a0fb0174d34be397375974b97534c3b568db9493","width":390,"height":352,"mediaId":"739aaf1764350c2cc3cfcb67","alt":"Gemini 的 Google Wallet 连接器及 @wallet 输入界面。"}]},{"kind":"动态","title":"Daybreak 团队征集安全工具反馈","detail":"Thibault Sottiaux 邀请用户反馈 Daybreak 的模型、Codex 插件、蓝队与红队访问、文档、红队测试及防御工厂等环节，希望了解哪些部分应改进；未在此帖承诺具体更新。","sourceId":"x:2121845965997101118","url":"https://x.com/thsottiaux/status/2121845965997101118"},{"kind":"动态","title":"Guillermo 的项目采用强模型规划、快模型执行","detail":"Guillermo Rauch 称自己的项目通过能力最强的模型规划，再委派给快速模型的 subagents 实现，并用 ~/.fx/AGENTS.md 中一行指令表达这种安排；这是个人工作方式，不是不同组合的对照测试。","sourceId":"x:2121739228698886454","url":"https://x.com/rauchg/status/2121739228698886454"},{"kind":"动态","title":"Every Frontier feed 提供实验短文与原始代码","detail":"Dan Shipper 建议让 agent 阅读 Every 的 frontier feed，称其中发布团队的 AI 实验、原始代码和简短记录；本次仅采集到入口介绍，没有读取其中实验或补充结论。","sourceId":"x:2121620539655819305","url":"https://x.com/danshipper/status/2121620539655819305","images":[{"src":"assets/digest/2026-11-16/289e082cd27013112d796146.jpg","originalUrl":"https://pbs.twimg.com/media/HXGCaghWUAAqyWI.jpg","sourceUrl":"https://x.com/danshipper/status/2121620539655819305","attribution":"Dan Shipper","sha256":"71ee52536afa8c52d281dd85ae13496bafcab1a4221bf4c6ebf79f0c3671d6de","width":1200,"height":827,"mediaId":"289e082cd27013112d796146","alt":"Every Frontier 的实验列表页面，展示实验标题、作者及探索状态。"}]}],"articles":{"blogs":[],"podcasts":[{"title":"Jev 创建者：让模型成为软件可依赖的决策部件","sourceTitle":"Ep 97: Jev Creator on Decision Models, Benchmark Fatigue &amp; Why the Labs Missed It","sourceId":"9e93ce06-533a-4c12-aecb-7c10e60bb02a","sourceUrl":"https://www.youtube.com/@RedpointAI","sourceName":"Unsupervised Learning","author":"Jev 创建者","publishedAt":"2026-11-05T14:05:50.000Z","sourceTextSha256":"5f527bd6bff3b2affa4992621392e68c350acd1173479c30a21dc52878313742","linkScope":"channel","blocks":[{"type":"paragraph","text":"这期 11 月 5 日的 Unsupervised Learning 访谈围绕 Jev 决策模型展开。主持人 Jacob Efron 与产品创建者讨论的核心，不是模型能否在某张榜单上获胜，而是软件能否放心调用它完成细小决策。受访者承认产品尚未达到理想状态，并希望开发者与模型团队一起发现能力边界，而不是被动追逐新版本。"},{"type":"heading","text":"从给人看的回答，转向供机器使用的决策"},{"type":"paragraph","text":"他最初的疑问是，AI 看起来很聪明，却没有同样清楚地体现在广泛的生产效率上。在他的设想中，未来大量模型调用服务于软件本身：人可能重视措辞和文章风格，程序更需要明确的选择、约束和可靠结果。由此倒推，模型应成为软件中的认知部件，而不是每次都输出一段面向人的文字。"},{"type":"paragraph","text":"他将 Jev 称为偏“系统一”的模型，主动暴露错误与不足，认为大量普通自动化需要的正是这些小判断。部分功能以适合探索的状态发布，不推荐用于最稳定的场景；真正需要多高可靠性，应由了解下游业务的开发者判断。推出产品的目的之一，也是让用例与能力共同演进。"},{"type":"heading","text":"理想接口像 SQL，而非记住每个模型的脾气"},{"type":"paragraph","text":"谈到路线图，他说现实反馈还远远不够，希望开发者直接指出哪类任务不可靠。企业对训练数据使用和被模型厂商取代的担忧，也可能阻碍合作；他更希望业务逻辑和专业化保留在软件中，模型负责其中的微小决策。"},{"type":"paragraph","text":"他理解工程师短期内按模型擅长的任务分工，但不希望系统长期依赖某个模型特有的习性。理想状态类似 SQL：接口足够可靠，可以替换提供方。需要大量技巧才能工作，仍说明模型提供方有待改进；小而可靠的语义原语才更容易组合成复杂软件。"},{"type":"paragraph","text":"他并不反对聊天机器人或编程 agent，喜欢用它们探索问题和快速制作临时仪表盘。争论在于，生产系统是否还要不断升级依赖、盼下个模型修复问题；他希望成熟能力可以稳定运行，只在有必要时重新评估替代方案。"},{"type":"heading","text":"新形态不等于可靠，榜单也不能代替实用性"},{"type":"paragraph","text":"受访者期待更多模型形态，却担心行业把注意力放在命名新类别和展示演示上，忽略实际效用。按他的经验，让输出具有一种新形状比让它可靠容易得多；过度承诺会耗尽开发者尝试的耐心。"},{"type":"paragraph","text":"他承认自己对市场的观察可能有幸存者偏差，但感到这类模型的基准疲劳来得很快。若每个产品都宣称分数优秀，开发者仍得花大量时间自己测，真正可靠的进步也难以被识别。其批评针对“分数替代生产可靠性”，并不是访谈给出了覆盖所有模型的独立测评。"},{"type":"heading","text":"把语义判断插进类型与安全检查"},{"type":"paragraph","text":"他提出几个探索方向。其一是“语义依赖类型”：普通类型能要求返回整数，更细的约束能要求整数大于零；进一步可以用自然语言描述软件属性，由决策模型帮助检查模块是否能组合。这是设想，不是已经交付的类型系统。"},{"type":"paragraph","text":"另一方向是在工具调用中加入符合组织语境的安全检查，例如某段代码是否应访问另一部分系统。他希望便宜、快速的模型让这些检查能广泛嵌入软件，并帮助安全产品公司实现功能，而不是由模型厂商规定所有组织通用的规则。开发者甚至不必透露业务数据，只需说明导致不可靠的任务形状。"},{"type":"heading","text":"KV cache 的效率，也会约束状态管理"},{"type":"paragraph","text":"谈到编程 agent，他认为许多设计围绕 KV cache 展开：缓存节约成本，但状态往往不断追加，难以随意删除和重组。无状态的“任务输入、结果输出”可以先试便宜模型、交给廉价裁判检查，再升级或多次采样；长时间有状态的流程却要处理缓存、上下文和训练方式之间的取舍。"},{"type":"paragraph","text":"子 agent 该收到哪些上下文、结果中又该带回什么，都需要判断。全部传递会增加输入成本，持续追加则像把巨大字典一路传下去。他没有否认现有方式有用，而是认为如果所有智能都只能依附追加式上下文，软件可采用的架构就太受限。"},{"type":"paragraph","text":"他举出三种尚待建设的可能：多个 agent 共享状态，一个写代码，另一个只读代码并实时生成解释界面；切换任务时按语义需要和缓存读写成本重新组织上下文，而非只在空间耗尽时统一压缩；用低成本扫描从历史工作、甚至同事的历史中找出相关知识，避免每次重读全部文件。这些例子是研究与工程愿景，不能写成 Jev 已实现的功能。"},{"type":"heading","text":"多模态先承认不足，再寻找合适任务"},{"type":"paragraph","text":"对于图像，受访者认为可靠性比文本更难，主张先自动化容易的工作，并逐项追查失败究竟来自模型、提示还是软件。他坦承团队在图像上投入远少于文本，图像模型仍有很多不均衡能力，不愿把它称为生产就绪；所谓相对领先也只是他的主观判断。"},{"type":"paragraph","text":"他个人期待游戏、电脑操作，以及过滤低质量内容的工具。电脑界面尤其值得改善：如果系统足够可信，不擅长电脑的人也应能让助手代办。他把这些方向视为可探索的产品空间，没有在访谈中给出已验证的成功率。"},{"type":"heading","text":"护城河来自可靠性，低价本身还不够"},{"type":"paragraph","text":"被问及为何大实验室没有更早走这条路，他认为多年前的模型已具备可利用的智能原料，类似工作更难但并非不可能。这是其回顾性判断，而非对早期模型可完成多少经济工作的证明。"},{"type":"paragraph","text":"面对竞争，他担心只优化基准的产品让用户失去信任，因而更愿意把资源放在可靠性。他也区分“便宜带来更多使用”与“便宜而有用到让总预算增加”：后者才是他希望看到的市场扩张，不能仅靠价格下降推断已经发生。"},{"type":"paragraph","text":"他称服务可以盈利，融资更看重能帮助建立业务的人，而不是必须靠补贴换锁定。谈及发布前是否该做一版刷榜产品，他庆幸没有这样做，但也承认无法证明这条选择比追逐关注带来了更好的销售结果。"},{"type":"heading","text":"编程 agent 的价值，要连同副作用一起计算"},{"type":"paragraph","text":"主持人将话题转向实验室估值与编程市场。受访者承认编程 agent 很有价值，却区分“有正收益”和“值得投入这么多钱”；他没有足够信息判断具体估值，认为真实采用可能经历反复的热潮和调整。他对实验室交易安排的看法也来自听闻，不能作为已核实的财务事实。"},{"type":"paragraph","text":"他强调，判断 agent 应问“哪些决定可以信任它”，并考虑出错的代价。代码通常有 Git、人工审查与回滚手段，其他知识工作未必有同等保护；能力强不代表可以不加区分地交付真实世界操作。"},{"type":"paragraph","text":"被追问效率时，他给出约 20% 至 40% 加速的个人估计，同时强调任务、工程师技能、可隔离的副作用，以及长期技术债和技能变化都会影响结果。有些任务因此变得首次可做，另一些并不比手写更省事；这些数字不是统一基准或保证。"},{"type":"heading","text":"安全要拆成具体威胁，开发者也要主动塑造工具"},{"type":"paragraph","text":"最后，他把超级智能、递归自我改进、生物与网络滥用、信任安全区分开，认为恶意的人使用强工具，与系统自主形成目标，是不同威胁模型。他对自主性和快速自我改进持怀疑态度，承认这是可被证据改变的个人判断；不能据此认定相关风险不存在。"},{"type":"paragraph","text":"访谈以回到软件建设收束：开发者不必只围绕模型现有习性调整自己，也可以把真实需求和失败案例反馈给模型团队，共同探索接口、状态管理和新的应用。贯穿其中的尺度始终是可依赖的效用，而非让模型看起来无所不能。"}]}]},"quality":{"collected":27,"collectedTweets":26,"used":8,"usedTweets":7,"uniqueAuthors":7,"imageCount":3,"claimAudit":{"reviewMode":"editorial review plus structural checks; not automated proof of meaning","claimsReviewed":17,"warnings":[]},"status":"degraded","warnings":["Quoted-post context missing: x:2121804295381377342","Quoted-pos "replies":1}]},{"name":"Josh Woodward","handle":"joshwoodward","bio":"VP, @Google @GoogleLabs @GeminiApp @GoogleAIStudio","tweets":[{"text":"Available to all Gemini app users in the USA to start","createdAt":"2026-11-15T00:00:54.000Z","url":"https://x.com/joshwoodward/status/2121755283785699376","likes":24,"retweets":1,"replies":3},{"text":"New in Gemini: Connect Google Wallet for personal finance insights This is powerful for things like: + making instant charts to visualize your spend + finding sneaky subscription price hikes + making a holiday budget based on what you actually spent last year","createdAt":"2026-11-15T00:00:54.000Z","url":"https://x.com/joshwoodward/status/2121755282326102417","likes":462,"retweets":40,"replies":42}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Cyber team wants your feedback on Daybreak. Models, codex plugins, blue/red access, documentation, red teaming & defense factory... What can we do better or improve?","createdAt":"2026-11-15T06:01:14.000Z","url":"https://x.com/thsottiaux/status/2121845965997101118","likes":737,"retweets":30,"replies":534}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"Two very useful prompts to try with Fable 5.2: \"/doctor prompt-audit\": Audits your Claude Code setup (Claude md, skills, commands) and proposes fixes. \"/claude-api prompt-audit [skill name]\": Audits one skill in depth. I wish Claude Code auto-suggested running these every time Anthropic releases a new model. 📌 Watch my full tutorial on how I use Fable and Opus here:","createdAt":"2026-11-14T16:59:45.000Z","url":"https://x.com/petergyang/status/2121649295950762363","likes":440,"retweets":18,"replies":53},{"text":"And please consider starring the repo to help more people discover it:","createdAt":"2026-11-14T16:11:50.000Z","url":"https://x.com/petergyang/status/2121637240132735289","likes":12,"retweets":2,"replies":0}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Autonomous Businesses are here.","createdAt":"2026-11-15T00:42:05.000Z","url":"https://x.com/amasad/status/2121765647168483589","likes":298,"retweets":16,"replies":67},{"text":"Technology is inherently recursively self-improving and the degree of autonomy has been going up overtime. AI is an accelerant but it didn’t not start this cycle. Douglas Engelbart understood this.","createdAt":"2026-11-14T10:21:25.000Z","url":"https://x.com/amasad/status/2121549054173757554","likes":277,"retweets":32,"replies":82},{"text":"We’ve entered Murphy’s world. Anything that can go wrong will go wrong. With billions of things happening at once, recursively interdependent and accelerating rapidly, what’s once considered a rare failure is now a daily thing.","createdAt":"2026-11-14T08:25:42.000Z","url":"https://x.com/amasad/status/2121519931741127144","likes":1115,"retweets":87,"replies":142}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"An awesome day for humanity ✦ · ✧ · ✦ · ✧ ✧ · ✦ ✧ · ✧","createdAt":"2026-11-15T04:39:01.000Z","url":"https://x.com/rauchg/status/2121825273373229134","likes":404,"retweets":23,"replies":16},{"text":"Got to experience the magic of @uisdk. Two prompts of fx + Gemini Argon. Pure Web Components. No framework. The agent reused 14 UI SDK behaviors out of the box 🤯: window resizing, drag, menubar hover-switching, typeahead, roving toolbar focus, 10-band EQ sliders, scoped hotkeys, ARIA, and WebMCP agent control. (source linked) Music by @suno.","createdAt":"2026-11-15T03:15:39.000Z","url":"https://x.com/rauchg/status/2121804295381377342","likes":616,"retweets":23,"replies":74},{"text":"Subagents on work so well… extremely delightful. Amazing how much goodness fits in 6.33mb 😁 All my projects are built by planning with the smartest model + delegating to fast model subagents. It rceId":"x:2121428406764204199","url":"https://x.com/amasad/status/2121428406764204199"},{"kind":"动态","title":"突发访问压力下，Replit 页面提高限流额度","detail":"Amjad Masad 称，团队与托管在 Replit 的 StandWithJensen 页面所有者合作，提高了 rate limit，并认为页面现在应能承接更多访问；未给出流量、容量或压测数据。","sourceId":"x:2121389001546567837","url":"https://x.com/amasad/status/2121389001546567837"},{"kind":"动态","title":"Nikunj Kothari 主张按自己的工作流选模型","detail":"Nikunj Kothari 批评把刷高基准当作宣传，认为亲自在真实工作流中使用模型不可替代；这是他的选型建议，原帖没有给出被批评模型或基准的完整测评。","sourceId":"x:2121320899161010360","url":"https://x.com/nikunj/status/2121320899161010360"},{"kind":"方法","title":"持续学习先要能记录和重放生产轨迹","detail":"在 11 月 5 日 Training Data 访谈中，Trajectory 的 Ronak 把生产轨迹、可重放环境和训练算法列为关键环节：记录主 agent、子 agent、产品动作与用户反馈，再把这些经历转成评估和训练输入；完整复现环境与定义奖励仍需要人工工作。","sourceId":"podcasts:eed8f8c6-d88e-11f1-8b73-637e085f73d5","url":"https://www.youtube.com/playlist?list=PLOhHNjZItNnMm5tdW61JpnyxeYH5NDDx8"}],"articles":{"blogs":[],"podcasts":[{"title":"Trajectory：把真实任务的经验接入模型训练闭环","sourceTitle":"A Model For Everyone: How Ronak From Trajectory Is Building Products For Continual Learning","sourceId":"eed8f8c6-d88e-11f1-8b73-637e085f73d5","sourceUrl":"https://www.youtube.com/playlist?list=PLOhHNjZItNnMm5tdW61JpnyxeYH5NDDx8","sourceName":"Training Data","author":"Ronak","publishedAt":"2026-11-05T10:00:00.000Z","sourceTextSha256":"b74023e2941e63708bc770dd270382c072fe88b1fbf6ca5d47cd984fdd4a8244","linkScope":"playlist","blocks":[{"type":"paragraph","text":"在 11 月 5 日的 Training Data 访谈中，Trajectory 的 Ronak 讨论了如何把真实工作的经验变成模型改进。他把当前系统称为“伪持续学习”：agent 已很聪明，却通常不会在一次任务后自然积累经验，更新仍依赖离线、批量训练。Trajectory 先要降低企业定制模型的门槛，最终目标才是持续从使用中学习。"},{"type":"heading","text":"从纸质地图，到能随行程更新的导航"},{"type":"paragraph","text":"Ronak 用家庭公路旅行作比喻：过去先去 AAA 取标好的地图，改变路线还得重新求助；现在的模型更新有些类似。让每家公司都能训练模型，像 MapQuest 把离线规划能力交给更多人；真正持续学习则更像 Google Maps，每次出行都能贡献新经验，帮助系统调整路线和交通判断。这是他想达到的状态，不是现有产品已经实现的能力。"},{"type":"paragraph","text":"对于是否需要架构突破，他认为基础模型内部的记忆、连接等变化已经在发生，架构研究仍很重要。但他想解决另一层问题：企业往往知道什么算好，却很难把这一判断转成模型改进。Trajectory 希望连接研究能力和真实业务，而非替代底层模型研究。"},{"type":"heading","text":"将各家公司重复建设的研究流程产品化"},{"type":"paragraph","text":"他回忆在 Windsurf 训练模型时，需要庞大研究团队、计算投入和六到九个月的时间。几位创始人分别接触过生产编辑与重试、机器人部署反馈、艺术家对多模态模型的反馈，发现共同问题都是如何把现实反馈转成学习信号。大实验室擅长训练一个模型供所有人使用，为每个客户维护专门模型却需要另一种基础设施。"},{"type":"paragraph","text":"Harvey 是他给出的例子：法律产品积累了专家经验与业务细节，可以构建法律 agent 评测，但仅调用前沿模型并不能充分利用这些数据。他称，借助 Trajectory 定制的模型在相关评测中从约 4% 准确率提高到约 18%，成本约为前沿模型的六分之一；他同时承认仍有很大改进空间。这是受访者披露的特定案例，不能理解为已达到成熟法律服务的可靠性。"},{"type":"heading","text":"把任务轨迹而非 token 当作工作单元"},{"type":"paragraph","text":"Trajectory 的名字来自强化学习中的 trajectory，也就是完成任务的一段行动过程。Ronak 认为，与同事合作不会只计算说了多少字，agent 的工作也应围绕有经济价值的任务理解。在训练模拟中，rollout engine 产生轨迹；在真实业务里，生产中的推理与操作本身就可以提供轨迹。"},{"type":"paragraph","text":"目前企业仍需准备三部分：首先，把主 agent、子 agent、产品内事件及用户反馈记录成尽量完整的时间线；其次，提供 Docker 文件或系统要求等环境信息，让生产轨迹可被重放，用于评估与训练；最后，由训练栈、损失函数和奖励函数把任务经历转成参数改进。Trajectory 想尽量隐藏最后一层复杂性，让客户主要表达“什么算好”。"},{"type":"heading","text":"减少重放环境和奖励标注的人工负担"},{"type":"paragraph","text":"他指出两个困难：生产环境往往无法完美复制，法律和投行业务也未必有可自动验证的标准答案。团队因此研究降低环境与奖励构建成本，而不是假设客户已准备好理想数据。"},{"type":"paragraph","text":"在他介绍的 GRPO 训练方式里，同一个任务常需运行八次或十六次作为一组，再比较奖励。团队尝试 group size one，希望从不同任务各自的一条轨迹学习，例如利用一万条不同任务的经历，而不必为同一个任务反复运行。Ronak 称相关进展能减少对重放环境的依赖；这仍是他的算法介绍，并非对所有任务的通用效果保证。"},{"type":"paragraph","text":"奖励方面，他提出从一万条轨迹中挑选约一百条代表样本，由客户密集说明评价准则，再训练 meta grader，把这些判断推广到其余轨迹。他明确说这并不完美。更远的理想是让客户在可观测界面圈出 agent 做得好与不好的地方，点击训练便能改进。"},{"type":"heading","text":"训练、评估与部署放在同一个闭环里"},{"type":"paragraph","text":"当前产品把轨迹和质量标准接入训练，再在同一处评估、部署模型，回到生产环境收集新轨迹。Ronak 用苹果整合手机与互联网的产品思路作类比：并非每个环节都新，但连接后可以减少用户拼接流程的工作。"},{"type":"paragraph","text":"现阶段主要面向已经搭好 agent harness 的 AI 原生公司，他提到 Harvey、Rogo，也称 NVIDIA 已在使用平台。模型定制侧重让熟悉的任务更有效率；harness 则可能带来新的能力。将来或许只有一成任务调用前沿模型、其余路由到定制模型，但这是他描绘的未来分工，并非已经验证的通用比例。"},{"type":"paragraph","text":"Rogo 的例子强调简洁的金融 agent：可以在后台自主工作，回来时交付清晰结果，而不是冗长输出。按 Ronak 的说法，Rogo 利用自有数据训练后，token 使用效率提高数倍，成本和耗时也下降，同时改善其关心的任务；访谈没有给出完整测试口径。"},{"type":"heading","text":"真正在线学习，还缺好奇心与人的目标"},{"type":"paragraph","text":"讨论随后从产品转向研究。Ronak 用反复投球说明经验积累：人会建立关于行动后果的直觉，还会主动探索未知。他借用状态、动作和状态转移的语言，提出 agent 需要识别自己尚不了解的变化，并通过尝试建立认识。量化这种“好奇心”，在他看来是自主持续学习尚缺的一环。"},{"type":"paragraph","text":"主持人追问好奇心如何与用户目标一致，他区分了递归自我改进与自己希望推动的持续学习：前者可能把模型封在系统里提升 AI 研究能力，后者应从与人的互动和人指定的任务中学习。他主张让人留在反馈回路里；这是一条对齐方向，不代表相关风险已经解决。"},{"type":"heading","text":"研究基础设施与产品团队共同迭代"},{"type":"paragraph","text":"Trajectory 同时做强化学习算法与产品界面。Ronak 描述，团队把训练代码也做成生产系统，使用微服务、Kubernetes 和自动扩缩容；设计工程师也会运行训练任务，了解实际研究体验。团队更多时间讨论系统设计，再让编程 agent 执行实现，这是其内部工作方式的自述。"},{"type":"paragraph","text":"对产品建设者，他提出“园丁”的比喻：未来模型、harness 乃至产品可以从使用中逐渐调整，人的职责是设定方向和边界。当前 V1 仍只是更容易训练模型的入口；更大的愿景依赖观测、沙箱等生态基础设施，也需要其他公司共同建设。"},{"type":"paragraph","text":"访谈最后把专业化与持续学习连在一起：与其所有业务反复求助同一个通用模型，Ronak 希望各领域能将已有经验注入模型与 harness。他对企业普及率和自动改进的表达属于愿景，不能当作已达成的覆盖率；更实际的起点仍是整理生产轨迹、明确质量标准，并检验定制模型是否真的改善了目标工作。"}]}]},"quality":{"collected":22,"collectedTweets":21,"used":7,"usedTweets":6,"uniqueAuthors":6,"imageCount":1,"claimAudit":{"reviewMode":"editorial review plus structural checks; not automated proof of meaning","claimsReviewed":17,"warnings":[]},"status":"degraded","warnings":["Quoted-post context missing: x:2121277727940776114","Quoted-post context missing: x:2121430386685395022","Media unverified: podcasts:eed8f8c6-d88e-11f1-8b73-637e085f73d5 (feed_has_no_media_or_supported_post_locator)"]},"contentSchemaVersion":2,"sourceSnapshotSha256":"827331694553aa736a31320c1113f29dc9039580b7139a51dce82b929b705a2a","selection":{"sources":[{"sourceId":"x:2121473082372292885","decision":"excluded","reason":"活动邀请，仅短链接且缺少被引帖内容。"},{"sourceId":"x:2121431117526134923","decision":"excluded","reason":"争议报道的转引，缺少被引员工叙述全文，不补事实。"},{"sourceId":"x:2121430819667579031","decision":"excluded","reason":"围绕个人间谍指控的媒体争议，不属于本期builder实践主题，也未核验链接证据。"},{"sourceId":"x:2121430386685395022","decision":"used","reason":"用于具备具体动作或数字的独立主题，保留原帖主张范围。"},{"sourceId":"x:2121428406764204199","decision":"used","reason":"用于具备具体动作或数字的独立主题，保留原帖主张范围。"},{"sourceId":"x:2121389001546567837","decision":"used","reason":"用于具备具体动作或数字的独立主题，保留原帖主张范围。"},{"sourceId":"x:2121377395244749097","deci aidotengineer - @latentspacepod","tweets":[{"text":"come to tmr !","createdAt":"2026-11-14T05:19:32.000Z","url":"https://x.com/swyx/status/2121473082372292885","likes":3,"retweets":1,"replies":3}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"And here's a story from an NVIDIA employee. Btw, I encourage anyone reading this to do your own research.","createdAt":"2026-11-14T02:32:47.000Z","url":"https://x.com/petergyang/status/2121431117526134923","likes":14,"retweets":1,"replies":1},{"text":"Here's some evidence of the questionable reporting - it's still unclear that Alice Huang is a spy despite WSJ jumping to conclusions. This is from the Singapore gov:","createdAt":"2026-11-14T02:31:36.000Z","url":"https://x.com/petergyang/status/2121430819667579031","likes":16,"retweets":0,"replies":1},{"text":"If you know a loved one suffering from cancer or another long-term illness: 1. Upload all of the patient's medical records (e.g., to a Google Drive folder) 2. Tell ChatGPT or Claude to install my free /fuck-cancer skill (just point them at the link: 3. Point the skill at the folder to create a one-page brief, research clinical trials, and more. You're also welcome to fork the skill and modify it for other long-term conditions. tl:dr Use the full power of AI to beat shitty diseases.","createdAt":"2026-11-14T02:29:53.000Z","url":"https://x.com/petergyang/status/2121430386685395022","likes":434,"retweets":36,"replies":7}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"It's been great partnering with @Visa on agentic commerce. More features and use cases are coming!","createdAt":"2026-11-14T02:22:01.000Z","url":"https://x.com/amasad/status/2121428406764204199","likes":105,"retweets":6,"replies":35},{"text":"Worked with the owner of the StandWithJensen page, which is built and hosted on Replit, to raise the rate limit. It should now scale! Feel free to share @GavinSBaker","createdAt":"2026-11-13T23:45:26.000Z","url":"https://x.com/amasad/status/2121389001546567837","likes":1270,"retweets":104,"replies":59},{"text":"Read the Stand with Jensen letter and consider adding your name. #standwithjensen","createdAt":"2026-11-13T22:59:18.000Z","url":"https://x.com/amasad/status/2121377395244749097","likes":2557,"retweets":367,"replies":108}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Co-sign","createdAt":"2026-11-13T21:14:27.000Z","url":"https://x.com/rauchg/status/2121351007615811799","likes":3392,"retweets":103,"replies":37},{"text":"Vercel Sandbox is inevitable","createdAt":"2026-11-13T20:59:04.000Z","url":"https://x.com/rauchg/status/2121347136965210286","likes":227,"retweets":4,"replies":67},{"text":"Workflow SDK 5 and Vercel Workflows are a monumental step forward for agents. ◾ The 'time to first step' and 'time between steps' have massively improved. ◾ We doubled down on encryption and security. ◾ The reliability of the overall system has been proven at massive scale. We've ironed out many subtle details and exercised many disaster-recovery scenarios. ◾ We made the underlying durability log reusable for any agent harness. 𝚍𝚞𝚛𝚊𝚋𝚕𝚎-𝚑𝚊𝚛𝚗𝚎𝚜𝚜 was born. Check it out:","createdAt":"2026-11-13T16:23:16.000Z","url":"https://x.com/rauchg/status/2121277727940776114","likes":345,"retweets":8,"replies":101}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Keep Opus 5.5 as your coding default in Claude Code. On 52 coding tasks in Claude Code 2.1.322, Fable 5.2 solved about as many (82.7% vs 84.6%) but cost 2.80x as much per solved task. Opus already solves most of these tasks, though, so telling the two apart will take harder ones.","createdAt":"2026-11-14T04:45:28.000Z","url":"https://x 和 shadcn 在 agent 时代的角色发问，主张继续深入底层，删减、优化、加速与自动化。","claimType":"single_source","sourcePerspective":"Guillermo Rauch","titleReview":{"id":"nov14-1","text":"Guillermo Rauch：UI SDK 应封装行为，而非限制生成界面","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120966768483262648","quote":"What happens to frameworks in the agents era? to component libraries? to @shadcn? \n\nThe answer is: we need to drill deeper. Delete the part, optimize, accelerate, automate.\n\nUI SDK is like the x86 instruction set for agents to build new UI components spontaneously. \n\nAgents are the new design engineers, and they're ready to build *anything* you ask, tailored to your usecase. High-level, rigid, single-framework abstractions are like kryptonite for what is essentially an infinite, untiring creation machine.\n\nI think we've found someone that allows us to have the cake and eat it too. A decades-long dream. UI SDK is packaged behaviors that give us accessibility, performance, cohesion, saving us tokens, errors and effort, but with absolutely zero limitations and tradeoffs for what UIs we can generate.\n\nEnjoy!"}],"reviewNote":"逐句对照原文，保留作者自述及限定，不将宣传、预测或内部经验改写成普遍实证。"},"evidence":[{"sourceId":"x:2120966768483262648","quote":"UI SDK is like the x86 instruction set for agents to build new UI components spontaneously.","translation":"UI SDK 就像让 agent 自发构建新 UI 组件的 x86 指令集。","attribution":"Guillermo Rauch","url":"https://x.com/rauchg/status/2120966768483262648"}],"detail":{"sources":[{"sourceId":"x:2120966768483262648","blocks":[{"type":"paragraph","sentences":[{"id":"nov14-2","text":"Guillermo Rauch 从框架、组件库和 shadcn 在 agent 时代的角色发问，主张继续深入底层，删减、优化、加速与自动化。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120966768483262648","quote":"What happens to frameworks in the agents era? to component libraries? to @shadcn? \n\nThe answer is: we need to drill deeper. Delete the part, optimize, accelerate, automate."}],"reviewNote":"逐句对照原文，保留作者自述及限定，不将宣传、预测或内部经验改写成普遍实证 ence","reviewedAs":"supported","basis":[{"sourceId":"x:2120966768483262648","quote":"What happens to frameworks in the agents era? to component libraries? to @shadcn? \n\nThe answer is: we need to drill deeper. Delete the part, optimize, accelerate, automate.\n\nUI SDK is like the x86 instruction set for agents to build new UI components spontaneously. \n\nAgents are the new design engineers, and they're ready to build *anything* you ask, tailored to your usecase. High-level, rigid, single-framework abstractions are like kryptonite for what is essentially an infinite, untiring creation machine.\n\nI think we've found someone that allows us to have the cake and eat it too. A decades-long dream. UI SDK is packaged behaviors that give us accessibility, performance, cohesion, saving us tokens, errors and effort, but with absolutely zero limitations and tradeoffs for what UIs we can generate.\n\nEnjoy!"}],"reviewNote":"逐句对照原文，保留作者自述及限定，不将宣传、预测或内部经验改写成普遍实证。"}]}},{"tag":"实践","title":"Box 内部评测：Hydrogen 准确率提高，耗时与 token 减少","body":"Aaron Levie：Aaron Levie 表示，Box 在提前试用阶段用 Box AI Complex Work Eval 测试了 Gemini 4 Hydrogen，并认为它明显推进了快速模型的能力。","claimType":"single_source","sourcePerspective":"Aaron Levie","titleReview":{"id":"nov14-7","text":"Box 内部评测：Hydrogen 准确率提高，耗时与 token 减少","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120947988143198302","quote":"Ok this is a big deal. We’ve been testing Gemini 4 Hydrogen in early access with the Box AI Complex Work Eval, and it’s a serious jump for fast models. \n\nHydrogen is 5 percentage points better in accuracy than Gemini 3.8 Flash. That alone would be a great boost in capability, but possibly more importantly it did the tasks in less than half the time with about 12% fewer tokens on a typical task.\n\nFor this eval, we give the Box Agent Hydrogen as a model for a series of complex tasks that represent real world work with enterprise documents across finance, consulting, life sciences, and other industries. Hydrogen will be a great model for a lot of efficient but complex tasks across these fields.\n\nGemini team is definitely cooking. Hydrogen will be rolling out in the Box AI Studio shortly so any customer can build a custom agent with it."}],"reviewNote":"逐句对照原文，保留作者自述及限定，不将宣传、预测或内部经验改写成普遍实证。"},"evidence":[{"sourceId":"x:2120947988143198302","quote":"Hydrogen is 5 percentage points better in accuracy than Gemini 3.8 Flash.","translation":"Hydrogen 的准确率比 Gemini 3.8 Flash 高 5 个百分点。","attribution":"Aaron Levie","url":"https://x.com/levie/status/2120947988143198302"}],"detail":{"sources":[{"sourceId":"x:2120947988143198302","blocks":[{"type":"paragraph","sentences":[{"id":"nov14-8","text":"Aaron Levie 表示，Box 在提前试用阶段用 Box AI Complex Work Eval 测试了 Gemini 4 Hydrogen，并认为它明显推进了快速模型的能力。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120947988143198302","quote":"Ok this is a big deal. We’ve been testing Gemini 4 Hydrogen in early access with the Box AI Complex Work Eval, and it’s a serious jump for fast models. "}],"reviewNote":"逐句对照原文，保留作者自述及限定，不将宣传、预测或内部经验改写成普遍实证。"}]},{"type":"paragraph","sentences":[{"id":"nov14-9","text":"按其披露，相比 Gemini 3.8 Flash，Hydrogen 的准确率提高 5 个百分点，完成任务的时间不到一半，典型任务使用的 token 约少 12%。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120947988143198302","quote":"Hydrogen is 5 percentage points better in accuracy than Gemini 3.8 Flash. That alone would be a great boost in capability, but possibly more importantly it did the tasks in less than half the time with about 12% fewer tokens on a typical task."}],"reviewNote":"逐句对照原文，保留作者自述及限定，不将宣传、预测或内部经验改写成普遍实证。"}]},{"type":"paragraph","sentences":[{"id":"nov14-10","text":"该评测把 Hydrogen 交给 Box Agent，执行金融、咨询、生命科学等行业的企业文档复杂任务；作者据此看好它处理高效而复杂的工作。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120947988143198302","quote":"For this eval, we give the Box Agent Hydrogen as a model for a series of complex tasks that represent real world work wi eter Steinberger 提醒留意付费赞评","detail":"Peter Steinberger 称，有即将发布的 agent 营销方支付高额费用，邀请人在 X 上说好话，并提醒读者留意评测是否诚实；他没有指明产品或提供交易证据，不据此猜测具体品牌。","sourceId":"x:2121009372470067544","url":"https://x.com/steipete/status/2121009372470067544"}],"articles":{"blogs":[],"podcasts":[{"title":"Isomorphic Labs：把更多药物试错移到计算机，再回到真实验证","sourceTitle":"Powering AI-Driven Drug Discovery with President of Isomorphic Labs Max Jaderberg","sourceId":"c9a0c39e-de2a-11f1-9237-d39059052d4c","sourceUrl":"https://www.youtube.com/@NoPriorsPodcast","sourceName":"No Priors","author":"Max Jaderberg","publishedAt":"2026-11-12T11:00:00.000Z","linkScope":"channel","sourceTextSha256":"c6b5e880345474a113aba067b8f74efd35efd345f92fdd90a70de9f5e0926e4a","blocks":[{"type":"paragraph","text":"在 No Priors 访谈中，Isomorphic Labs 总裁、创始团队成员 Max Jaderberg 解释了公司的药物研发路线：让更多设计与预测发生在计算机里，再用真实实验验证。他的出发点不是药物已能由 AI 自动完成，而是传统试错在复杂生物学问题面前越来越昂贵，失败往往直到进入患者试验才显露。"},{"type":"heading","text":"从游戏 AI 到可迁移的生物学模型"},{"type":"paragraph","text":"Jaderberg 在计算机视觉领域完成博士研究、创业并进入 DeepMind，后来参与生成模型、深度强化学习和游戏挑战。他逐渐把问题从“AI 能否解出难题”转向“应该用它解决什么”。AlphaFold 展示了深度学习在重要生物学空间里泛化的可能，使团队相信值得建立专门公司，把 AI、化学和生物学人员聚到一起；Isomorphic Labs 因而在约 2021 年起步。"},{"type":"heading","text":"发现一种药之后，下一种能否更容易"},{"type":"paragraph","text":"主持人以知识增长与药物研发效率的反差提问，Jaderberg 将一个核心原因归于经验性试错：先对疾病机制和分子设计作假设，再合成、测试、反复迭代。细胞与分子设计空间都极其复杂，有限时间和资金约束了能探索的方案；在他的解释中，容易找到的药物逐渐被发现，剩下的问题更难。"},{"type":"paragraph","text":"他也承认文化与组织的影响，但更关心研发能否获得规模效应：一个项目学到的东西，能不能让下一种药更快？如果每种药都只是孤立的前沿研究，知识难以充分迁移；他希望底层模型吸收项目经验，持续改善对疾病生物学和分子设计的理解。这是平台路线的目标，不是已经证明每个项目都会加速。"},{"type":"heading","text":"跨学科团队要防止追逐虚假指标"},{"type":"paragraph","text":"公司并不要求每个候选人预先兼懂 AI 与制药，而是分别招聘优秀 AI 研究者、化学家和生物学家，通过内部交流培养交叉领域能力。谈到核心建模团队，他认为约五名 AI 人员配一名关键领域专家的比例有一定共鸣；领域专家要解释数据和指标，避免模型只优化看起来漂亮、却不能转化为药物价值的数字，这不是整家公司固定的人员配比。"},{"type":"heading","text":"以实验精度为目标，而不是彻底取消实验"},{"type":"paragraph","text":"核心 AI 团队希望把药物发现、设计和疾病理解尽量搬到计算机。自动化实验室能减少操作时间，但分子合成、细胞培养仍有物理等待；因此他们把“实验精度”画在内部评测图上，希望预测模型逐步接近这一目标。AlphaFold 的结构预测是他用来说明这种思路的例子。"},{"type":"paragraph","text":"他的设想是，更多探索在计算机中完成，真正合成分子和测试假设时，成功机会会更高、现实往返次数会更少。他同时明确，最终仍必须验证新的科学假设、药物效果与安全性；把更多试错移到计算机，不等于可以跳过真实验证或临床过程。"},{"type":"heading","text":"昂贵失败要求更早理解毒性与作用机制"},{"type":"paragraph","text":"访谈随后从发现阶段转向临床失败。Jaderberg 指出，分子可能打中目标却也影响别处，或目标本身产生意外负面作用，问题常在进入患者后才被发现。因此模型不只要预测结合，还要尽早理解疾病、细胞与不同作用路径。这是减少晚期未知风险的研发方向，并非已经达到的临床成功率承诺。"},{"type":"paragraph","text":"数据策略也不能只堆积旧记录。他认为，公共或企业数据库经常是过去项目留下的副产品，带有选择偏差；若追求泛化，所需数据分布可能不同。团队因此自行生成部分数据，同时结合外部资源，并把核心 AI 药物设计模型留在内部开发。"},{"type":"heading","text":"动物代理之外，寻找更接近人体的预测端点"},{"type":"paragraph","text":"主持人追问动物实验与人体结果之间的差距。Jaderberg 认为，可以把体外测量、AI 模型、类器官、器官芯片和合成人体组织结合，尝试更直接地预测人体临床毒性；他也承认相关临床数据有限。访谈中的动物预测性数字未展开研究口径，这里不把它当作普遍准确率。"},{"type":"paragraph","text":"实验技术范围很广，公司既自行工作，也与 CRO 和其他平台合作生成数据，并长期使用自动化实验室。Jaderberg 支持缩短真实世界反馈时间，但反复强调更大的方向是减少必须进入真实世界迭代的次数：实验负责验证，计算模型承担更多探索，而不是简单把现有试错全部交给机器人。"},{"type":"heading","text":"模型内部使用，药物管线既自研也合作"},{"type":"paragraph","text":"Isomorphic Labs 不把核心模型按 token 销售或授权出去，而是用其开发药物：一部分项目自行拥有、出资和推进，另一部分与制药公司、biotech 合作，结合对方在特定疾病领域的知识。按受访者介绍，内部重点是肿瘤、免疫和炎症；底层引擎则力求跨疾病、靶点类型与分子形式使用。"},{"type":"paragraph","text":"团队希望寻找影响多个下游适应证的共同机制。他以 RAS 相关药物的进展说明“根节点”思路，同时指出癌症突变可能绕过单一方案；这里引用的是他的研究讨论，不把其他公司的案例算作 Isomorphic Labs 的成果。"},{"type":"heading","text":"组合用药受制于安全性，也受制于设计精度"},{"type":"paragraph","text":"对于更复杂的药物组合，Jaderberg 解释，分子的毒性、肝脏影响和药物相互作用会限制安全组合；主持人也提到临床试验人数和组合数量的困难。他希望更精确的分子工程能支持同时调节多条生物通路的方案，但使用的仍是希望和可能，而非已经证实的治疗能力。"},{"type":"paragraph","text":"主持人提出监管是否过度强调安全时，他没有赞同放弃安全，而是强调患者安全始终居中，不同疾病与患者处境的风险承受能力也不同。他希望未来用更好的分子安全性和成功率数据推动改变，并明确这是需要逐步证明的目标。"},{"type":"heading","text":"临床时间表尚未给出，长期目标仍是更健康的生活"},{"type":"paragraph","text":"被问及首次临床试验日期，Jaderberg 没有给出确定时间，只说药物项目在推进、临床开发团队在建设。对于五年后的期待，他希望疾病预测理解与更精准、低毒的分子设计工具显著进步，同时承认发现和开发仍需要多年；他没有承诺五年内治愈某一比例的癌症。"},{"type":"paragraph","text":"访谈最后区分寿命与健康寿命：即使活到较高年龄，骨骼、肌肉等退化仍会影响行动与生活质量。Jaderberg 支持既改善具体疾病，也探索衰老的根本机制，但没有给出延长人类寿命倍数的预测。整条路线的落点仍是提高预测能力，并通过真实验证把它转为更安全有效的药物。"}]}]},"quality":{"collected":39,"collectedTweets":38,"used":8,"usedTweets":7,"uniqueAuthors":7,"imageCount":2,"claimAud
