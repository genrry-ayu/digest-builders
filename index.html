tty clear since early spring that the momentum is shifting to @openai it’s a fascinating comeback story","createdAt":"2026-08-01T02:34:06.000Z","url":"https://x.com/danshipper/status/2083380721607921904","likes":132,"retweets":7,"replies":20},{"text":"this is a very good letter","createdAt":"2026-08-01T00:40:41.000Z","url":"https://x.com/danshipper/status/2083352181776732326","likes":37,"retweets":0,"replies":2},{"text":"Human programmer interviews, 2027: Please describe the last 3 unresolved mathematical conjectures you solved, and share your prompts Please describe the last cyber felony your agent unintentionally committed and what steps you took to mitigate Please tell us how many R’s are in strawberry and how many e’s in seventeen","createdAt":"2026-07-31T17:13:44.000Z","url":"https://x.com/danshipper/status/2083239700664349128","likes":57,"retweets":3,"replies":10}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"","createdAt":"2026-07-31T23:14:52.000Z","url":"https://x.com/adityaag/status/2083330584022282576","likes":5,"retweets":0,"replies":0},{"text":"2 days left. Apply to @spc.","createdAt":"2026-07-31T23:14:51.000Z","url":"https://x.com/adityaag/status/2083330582210380106","likes":22,"retweets":6,"replies":3}]},{"name":"Sam Altman","handle":"sama","bio":"AI is cool i guess","tweets":[{"text":"cool use case of chatgpt work i heard last night: connect your family calendars and explain your kids' interests. every morning for the drive to school, have it make a podcast that talks about one kid's soccer game that afternoon, one kid's upcoming birthday, some news, etc.","createdAt":"2026-07-31T16:01:45.000Z","url":"https://x.com/sama/status/2083221585792762171","likes":8045,"retweets":240,"replies":2143},{"text":"i see your moore's law and i raise you 20x","createdAt":"2026-07-31T14:50:27.000Z","url":"https://x.com/sama/status/2083203642975502640","likes":6350,"retweets":246,"replies":438},{"text":"it could be faster","createdAt":"2026-07-31T14:28:34.000Z","url":"https://x.com/sama/status/2083198135812383197","likes":4403,"retweets":125,"replies":451}]}]},"errors":[],"partial":false},{"date":"2026-08-01","dateLabel":"2026年08月01日","generatedAt":"2026-08-01T00:00:00+08:00","sourceGeneratedAt":"2026-07-31T07:16:44.904Z","stats":{"podcastEpisodes":1,"xBuilders":15,"totalTweets":35,"blogPosts":0},"highlights":[{"tag":"经济模型","title":"模型降价的真正后果，不是省一点预算，而是把 AI 从试验品推成标品","body":"今天更关键的信号不是某家模型又便宜了，而是价格梯度、速度档位和能力档位开始一起被产品化。因果关系很直接：当 cost per task 持续下滑，企业内部关于“要不要试”的争论会逐步结束，问题会改写成“哪些流程现在已经便宜到值得长期接入”。这会把竞争从单次发布会的能力展示，推向更稳定的价格-性能分层与真实使用频率。","evidence":[{"quote":"major price cuts today: *80% drop for GPT-5.6 Luna... *20% drop for GPT-5.6 Terra... *GPT-5.6 Sol gets Fast mode in the API...","attribution":"Sam Altman on X","url":"https://x.com/sama/status/2082880720989532597"},{"quote":"The cost of AI - normalized for the type of task - coming down is one of the most important factors in being able to drive further AI diffusion in the economy.","attribution":"Aaron Levie on X","url":"https://x.com/levie/status/2082911418349920617"}]},{"tag":"企业落地","title":"Agent 进企业的最大阻力，正在从能力缺口转成环境治理缺口","body":"这一轮讨论里最值得警惕的，不是 agent 会不会做事，而是它一旦会做事，就会把原本松散的环境配置问题放大成真实风险。也就是说，企业接下来要补的不是一层更会聊天的界面，而是更厚的系统治理栈：零信任、分层防护、环境加固、默认把误配置当作会被命中的条件。agent 越能执行，治理越不能当附属工程。","evidence":[{"quote":"Given the right tools and task, agents will do whatever it takes to get the job done, assuming enough compute. Thus, a misconfigured system... will become a risk vector.","attribution":"Aaron Levie on X","url":"https://x.com/levie/status/2082997703458570412"},{"quote":"Assume zero-days exist — because they do — and think in layers of protection in a zero-trust framework.","attribution":"Amjad Masad on X","url":"https://x.com/amasad/status/2083034412598579403"}]},{"tag":"产品竞争","title":"下一阶段的 AI 产品差异，会越来越像系统工程，而不是模型发布会","body":"当 builder 开始把“更好的模型”定义成更稳、更快、重置更少，而平台方把几秒级的部署链路优化拿出来说时，竞争重心其实已经变了。用户感知的价值不再只来自模型回答得多聪明，还来自从生成到可用结果之间的摩擦被压到了多低。能力上限当然重要，但日常胜负越来越取决于可靠性、延迟和把结果真正发出去的能力。","evidence":[{"quote":"The day we develop really good models. There will be signs. Reliability increasing despite load going up and up. Sudden efficiency gains. Things getting faster. Resets.","attribution":"Thibault Sottiaux on X","url":"https://x.com/thsottiaux/status/2083053369351090254"},{"quote":"We just shaved off up to ~7s of the end-to-end CLI → Live URL deploy process for many apps.","attribution":"Guillermo Rauch on X","url":"https://x.com/rauchg/status/2082876367629381719"},{"quote":"Anyone can now build software by just prompting @grok. Hit Publish and ship to 1 user or 1 billion.","attribution":"Guillermo Rauch on X","url":"https://x.com/rauchg/status/2082841035093467229"}]},{"tag":"产业信号","title":"Physical AI 的护城河，不在‘会不会推理’，而在谁先把线下世界数字化","body":"这期播客给出的核心提醒是，physical AI 不是把现成网页语料再喂给模型一次，而是先去把原本没有被结构化的现场世界变成可计算对象。因果关系很清楚：数字世界先爆发，是因为 bits 早就存在；线下世界推进得更慢，是因为采集、清洗、部署和一线采用本身就是产品的一部分。所以真正的壁垒不是模型口号，而是谁能持续拿到干净数据、把判断闭环回动作，并在现场环境里长期跑下去。","evidence":[{"quote":"These are not the tokens you're gonna find online. Like, you can't crawl Reddit and find out about what happened on a construction site.","attribution":"Sanjit Biswas via MAD Podcast transcript","url":"https://www.youtube.com/watch?v=3FHsGiONOGw"},{"quote":"The interesting challenge, I think, with physical AI is that it's not digitized.","attribution":"Sanjit Biswas via MAD Podcast transcript","url":"https://www.youtube.com/watch?v=3FHsGiONOGw"},{"quote":"The physical world is much messier, and there's also a hardware component to it.","attribution":"Sanjit Biswas via MAD Podcast transcript","url":"https://www.youtube.com/watch?v=3FHsGiONOGw"}]}],"matters":[{"kind":"Interface","title":"Gemini Mac app 把语音输入压缩成“按住 Fn 直接落字”","detail":"Josh Woodward强调的不是模型本身，而是“直接在光标处生成干净文本、无需再编辑或复制粘贴”的交互闭环，说明桌面端入口正在继续被压短。","url":"https://x.com/joshwoodward/status/2082926031543967896"},{"kind":"Adoption","title":"Zara Zhang 给非技术团队的 AI 培训建议是办一场 install party","detail":"她把障碍点定义得很明确：抽象宣讲没用，先把 agent 装到每个人电脑上并当场完成一个真实任务，因为 setup 本身就是主要门槛。","url":"https://x.com/zarazhangrui/status/2083084770763002350"},{"kind":"Workflow","title":"Codex 团队公开征集日常体验改进项","detail":"Thibault Sottiaux 直接问“Nothing too small”，说明这类 coding agent 的竞争已经进入持续打磨 everyday UX 的阶段，小摩擦也在被当成产品问题处理。","url":"https://x.com/thsottiaux/status/2083048892405604681"},{"kind":"Policy","title":"GCC 对 LLM 代码的拒绝态度，开始引出“如何证明”这类执行问题","detail":"Peter Steinberger 关注的不是立场本身，而是规则可执行性：当组织开始对 AI 生成代码设限，后面一定会遇到证据标准和落实方式的争议。","url":"https://x.com/steipete/status/2083019629379612728"},{"kind":"Design","title":"Replit 在演示“从 brochures 直接出设计”这条链路","detail":"Amjad Masad 这条很短，但方向明确：设计输入不一定来自 Figma 或 PRD，营销物料也在被转成可继续生成的上游上下文。","url":"https://x.com/amasad/status/2082980019316642103"}],"sources":{"podcasts":[{"title":"The Biggest AI Deployment Nobody Talks About | Samsara CEO Sanjit Biswas","name":"The MAD Podcast with Matt Turck","publishedAt":"2026-07-30T11:30:00.000Z","url":"https://www.youtube.com/watch?v=3FHsGiONOGw","excerpts":["These are not the tokens you're gonna find online. Like, you can't crawl Reddit and find out about what happened on a construction site. The Samsara system, in a given day, we're driving 99% of The US roads, usually multiple times a day. I was just in the field last week with a large energy utility, and they shared with me a really interesting stat. They sa…","In the next five years, we're gonna triple that. We were talking about millions and millions of vehicles. We believe we helped prevent about 380,000 car crashes, road accidents in the last year.","Hi. I'm Matt Turk. Welcome to the MAD podcast. My guest today is Sandeep Biswas, cofounder and CEO of Sensera, the $20,000,000,000 company running what might be the largest AI deployment in the physical world. Millions of vehicles, 25,000,000,000,000 data points a year, driving 99% of US roads every single day."]}],"blogs":[],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"protip: if you can distil models, you can also distil agent harnesses","createdAt":"2026-07-31T06:13:00.000Z","url":"https://x.com/swyx/status/2083073422410821846","likes":20,"retweets":2,"replies":7},{"text":"you know if we all just gave all this money to the @waybackmachine they would be funded for all time and we'd reduce a lot of duplicate work and bot traffic lol","createdAt":"2026-07-31T05:37:25.000Z","url":"https://x.com/swyx/status/2083064467383013569","likes":7,"retweets":0,"replies":2},{"text":"verbalizing one of those aha moments i had that seems retroactively pretty obvious: if you prioritize pretrain data quality enough that commoncrawl isn't good enough for you, you have to build a Whole Web scraper anyway, and if you wanna keep it current, you have to have indexing, and pretty soon you find yourself having built a total private low-frequency clone of Google as a SIDE PROJECT of pretraining, that you can then also reuse for the agent side inference. we do know that the labs do use third party search providers, but clearly this is one of those things where developing more and more of your own 1P equivalents is both a competitive advantage and an adversarial target for AEO Bates…","createdAt":"2026-07-31T02:27:25.000Z","url":"https://x.com/swyx/status/2083016652032188669","likes":80,"retweets":5,"replies":18}]},{"name":"Josh Woodward","handle":"joshwoodward","bio":"VP, @Google @GoogleLabs @GeminiApp @GoogleAIStudio","tweets":[{"text":"My new favorite: Gemini Mac app ➔ Hold Fn ➔ Speak ➔ Clean, polished text directly at your cursor Zero editing or copy-pasting required Get it for free:","createdAt":"2026-07-30T20:27:19.000Z","url":"https://x.com/joshwoodward/status/2082926031543967896","likes":381,"retweets":36,"replies":45}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"The day we develop really good models. There will be signs. Reliability increasing despite load going up and up. Sudden efficiency gains. Things getting faster. Resets. These kinds of things.","createdAt":"2026-07-31T04:53:19.000Z","url":"https://x.com/thsottiaux/status/2083053369351090254","likes":4312,"retweets":164,"replies":851},{"text":"What should we improve on Codex to improve the everyday experience? Nothing too small","createdAt":"2026-07-31T04:35:31.000Z","url":"https://x.com/thsottiaux/status/2083048892405604681","likes":2537,"retweets":54,"replies":3694},{"text":"Benefits all","createdAt":"2026-07-31T00:09:21.000Z","url":"https://x.com/thsottiaux/status/2082981910209540352","likes":974,"retweets":23,"replies":410}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"If you enjoyed this, sign up for free to my newsletter to get my best AI and product guides. Join 110,000+ subscribers here:","createdAt":"2026-07-30T23:42:12.000Z","url":"https://x.com/petergyang/status/2082975074534219919","likes":2,"retweets":0,"replies":0},{"text":"BC is beautiful","createdAt":"2026-07-30T21:20:31.000Z","url":"https://x.com/petergyang/status/2082939418315198522","likes":49,"retweets":1,"replies":3},{"text":"Getting some great feedback on my latest tutorial on how to use Claude to design and build a full-stack app end to end. 📌 Watch it here:","createdAt":"2026-07-30T17:30:02.000Z","url":"https://x.com/petergyang/status/2082881415478415682","likes":57,"retweets":0,"replies":3}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Sandboxes are hard. With all the “AI escaping sandbox” it’s easy to think “wow AI so scary,” but most AI companies, and recent “sandbox providers” are making very basic mistakes. At Replit we’ve been running sandboxes since 2016 and targeted by every hacker and state actor under the sun. So we learned a thing or two. Main advice: Assume zero-days exist — because they do — and think in layers of protection in a zero-trust framework. More here:","createdAt":"2026-07-31T03:37:59.000Z","url":"https://x.com/amasad/status/2083034412598579403","likes":214,"retweets":18,"replies":26},{"text":"Replit Design from brochures!","createdAt":"2026-07-31T00:01:51.000Z","url":"https://x.com/amasad/status/2082980019316642103","likes":140,"retweets":6,"replies":10},{"text":"If Situational Awareness was blindsided, the AI naming curse strikes again.","createdAt":"2026-07-30T15:50:02.000Z","url":"https://x.com/amasad/status/2082856252888211851","likes":623,"retweets":17,"replies":33}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Cool","createdAt":"2026-07-31T01:56:56.000Z","url":"https://x.com/rauchg/status/2083008981770047782","likes":153,"retweets":4,"replies":9},{"text":"We just shaved off up to ~𝟽𝚜 of the end-to-end CLI → Live URL deploy process for many apps. This is specially cool when you consider you can integrate all of Vercel's infra via CLI/MCP/API and build your own custom software factory on top. My DMs are open if you're building an agent or platform that builds and deploys software autonomously.","createdAt":"2026-07-30T17:09:58.000Z","url":"https://x.com/rauchg/status/2082876367629381719","likes":220,"retweets":13,"replies":30},{"text":"Grok Build apps (*.𝚐𝚛𝚘𝚔.𝚖𝚎) are backed by @vercel hosting and CDN infrastructure. Anyone can now build software by just prompting @grok. Hit 🌐 Publish and ship to 1 user or 1 billion. Games, websites, internal apps, personal software… just @grok it.","createdAt":"2026-07-30T14:49:34.000Z","url":"https://x.com/rauchg/status/2082841035093467229","likes":1015,"retweets":66,"replies":66}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"The takeaway from this incident should not be that AI is scary. It should be that getting security right is incredibly important in the era of agents. Given the right tools and task, agents will do whatever it takes to get the job done, assuming enough compute. Thus, a misconfigured system - or something you thought was locked down but wasn’t - will become a risk vector. The core implications are less about the trust and safety of AI itself, but instead the work it’s going to take from enterprises to make sure they harden their environments. Lots of real work ahead for most organizations on this front.","createdAt":"2026-07-31T01:12:07.000Z","url":"https://x.com/levie/status/2082997703458570412","likes":170,"retweets":20,"replies":50},{"text":"The cost of AI - normalized for the type of task - coming down is one of the most important factors in being able to drive further AI diffusion in the economy. The general trend we should expect is that frontier AI models will continue to become more capable, and will look very expensive because the tasks that they can take on are more advanced. Then, shortly after, AI models will get more efficient or competition will drive more aggressive pricing dynamics, thus reducing the cost per task for anything other than the peak of the frontier. This cycle will continue over and over again, which ultimately leads to tasks becoming cheaper on a like for like basis. And by doing so you will get even…","createdAt":"2026-07-30T19:29:15.000Z","url":"https://x.com/levie/status/2082911418349920617","likes":147,"retweets":17,"replies":21}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Hit 1M followers Thanks everyone Don’t LARP","createdAt":"2026-07-30T22:09:59.000Z","url":"https://x.com/garrytan/status/2082951867336962538","likes":1984,"retweets":48,"replies":242},{"text":"We're going to host Evan Barker at an upcoming @garryslist event in San Francisco In SF, we were able to vote out the DSA We must pass this markdown skill file on to every other blue city","createdAt":"2026-07-30T14:57:29.000Z","url":"https://x.com/garrytan/status/2082843026716766356","likes":124,"retweets":11,"replies":17}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"This conversation with Sanjit Biswas of @Samsara about physical AI is also available on Spotify, Apple Podcasts and here on YouTube:","createdAt":"2026-07-30T19:14:29.000Z","url":"https://x.com/mattturck/status/2082907703735730609","likes":4,"retweets":0,"replies":0},{"text":"The biggest physical AI deployment nobody talks about: my conversation with Sanjit Biswas, CEO of @Samsara (NYSE: $IOT) about AI that sees 99% of US roads every day, and agents that act in the real world. 00:00: Intro 01:16 What is physical AI? 03:04 From IoT dashboards to agentic action 04:36 Why physical AI is harder than software AI 06:07 Safety, cybersecurity, and real-world consequences 07:11 What Samsara does 08:22 $2B ARR, 25 trillion data points and 380k crashes 09:44 How AI can prevent road accidents 11:28 From an MIT research project to Meraki 13:42 Learning physical operations from scratch 15:42 Samsara’s stack: sensors, intelligence, and action 16:39 Inside Samsara’s industrial…","createdAt":"2026-07-30T19:14:28.000Z","url":"https://x.com/mattturck/status/2082907699646173484","likes":7,"retweets":3,"replies":3},{"text":"How I expect her to react when I say I managed to secure a $2M allocation in the highest valuation tranche of the $800M pre-pre-seed of [new neo-lab] at a $10B valuation","createdAt":"2026-07-30T07:59:45.000Z","url":"https://x.com/mattturck/status/2082737900706234429","likes":37,"retweets":0,"replies":2}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Dangerously skips permissions. Harvard’17. GitHub: YouTube:","tweets":[{"text":"When managers ask me how to train their nontechnical team on AI, my advice is always the same: run an install party Everyone brings a laptop & you install the agents right there on their machines & get them to complete a meaningful task on the spot. Skip the abstract talk. Once it's installed, people start talking to the agent and learning from each other The setup is 80% the barrier","createdAt":"2026-07-31T06:58:05.000Z","url":"https://x.com/zarazhangrui/status/2083084770763002350","likes":10,"retweets":0,"replies":2}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"It was fun touching grass for two weeks, but now back to work 🫡 In NJ the next two days to hang with @DaltonMillsAI, and NY from August 1st - 5th. If you are truly building your life’s work (don’t need to be a founder), I’d love to hang out!","createdAt":"2026-07-30T10:48:01.000Z","url":"https://x.com/nikunj/status/2082780247125103071","likes":12,"retweets":1,"replies":2}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"GCC changed their policy and is blank out rejecting LLM-based code. How would they even proof that? Silly.","createdAt":"2026-07-31T02:39:14.000Z","url":"https://x.com/steipete/status/2083019629379612728","likes":184,"retweets":9,"replies":43}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"So call me crazy but I feel like we could solve this by just not prompting the models to do cyber crime","createdAt":"2026-07-31T01:11:33.000Z","url":"https://x.com/danshipper/status/2082997561955090564","likes":95,"retweets":0,"replies":30},{"text":"Elons law strikes again!","createdAt":"2026-07-30T16:22:23.000Z","url":"https://x.com/danshipper/status/2082864391519682993","likes":51,"retweets":1,"replies":6},{"text":"be careful of leverage folks!","createdAt":"2026-07-30T16:14:09.000Z","url":"https://x.com/danshipper/status/2082862319265050962","likes":45,"retweets":1,"replies":4}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"Leopold could really have used Preseen's risk forecasting! @AskPreseen has been in private beta for the last few weeks and a number of the world's leading quant/hedge funds are using it to prevent getting blown up.","createdAt":"2026-07-31T04:00:05.000Z","url":"https://x.com/adityaag/status/2083039973666644039","likes":12,"retweets":1,"replies":0},{"text":"Anthropic got jelly that only OpenAI's agent was doing bad shit.","createdAt":"2026-07-31T03:58:56.000Z","url":"https://x.com/adityaag/status/2083039683932532956","likes":20,"retweets":1,"replies":4},{"text":"@VminVsky @AskPreseen More on the future of forecasting:","createdAt":"2026-07-31T00:50:21.000Z","url":"https://x.com/adityaag/status/2082992228214149470","likes":2,"retweets":0,"replies":0}]},{"name":"Sam Altman","handle":"sama","bio":"AI is cool i guess","tweets":[{"text":"good job little bro","createdAt":"2026-07-30T17:29:25.000Z","url":"https://x.com/sama/status/2082881262679642281","likes":5996,"retweets":199,"replies":446},{"text":"we want to offer the best price/intelligence tradeoff at every level","createdAt":"2026-07-30T17:27:55.000Z","url":"https://x.com/sama/status/2082880884525482061","likes":2009,"retweets":27,"replies":112},{"text":"major price cuts today: *80% drop for GPT-5.6 Luna, now $0.20 per million input tokens and $1.20 per million output *20% drop for GPT-5.6 Terra, to $2/$12 *GPT-5.6 Sol gets Fast mode in the API, up to 2.5x the speed for 2x the price, 者和懂用户的人不但没被削弱，反而因为知道该优化什么、该向谁卖、该如何表达而更占优势。","evidence":[{"quote":"If you both have deep domain expertise & experience AND you’re AI-native ... you’re basically invincible.","attribution":"Zara Zhang on X","url":"https://x.com/zarazhangrui/status/2082705944782520462"},{"quote":"Being good at marketing is not just good for your marketing; it’s good for your product.","attribution":"Zara Zhang on X","url":"https://x.com/zarazhangrui/status/2082684904136134881"},{"quote":"Seasoned founders in the age of intelligence are aging like fine wine.","attribution":"Garry Tan on X","url":"https://x.com/garrytan/status/2082472533337813241"}]},{"tag":"认知架构","title":"今年的真实进展，越来越像“把 intelligence 当材料工程”而不是等一个万能模型降临","body":"无论是 Kevin Kelly 把 intelligence 比作 compound，还是 builders 通过多上下文窗口、compaction、typed handoff 去榨出能力，背后的共同点都是同一件事：大家开始把模型能力视作可组合、可调参、可路由的部件，而不是一颗单独变聪明的大脑。这会把竞争从“谁家模型口号最大”推向“谁能更稳定地把不同认知单元拼成产品结果”。","evidence":[{"quote":"I suspect that intelligence is not an element, but a compound.","attribution":"Kevin Kelly via AI & I by Every transcript","url":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL"},{"quote":"Just took two setting changes. You just have to allow it to reason and work over multiple context windows with the help of our canonical compaction implementation.","attribution":"Thibault Sottiaux on X","url":"https://x.com/thsottiaux/status/2082609662231502932"},{"quote":"Developers can now use Apple’s Foundation Models framework to hand off to Claude when a request calls for multi-step reasoning, code generation, and more.","attribution":"Claude Blog","url":"https://claude.com/blog/claude-for-foundation-models"}]}],"matters":[{"kind":"Research","title":"Sam Altman 继续把 OpenAI 的上行动作押在 scientific discovery 上","detail":"他这次强调的不是“我们替科学家完成研究”，而是模型已经非常接近显著加速发现过程，关键路径是先把能力交到科学家手里。","url":"https://x.com/sama/status/2082628413769003269"},{"kind":"Music","title":"Google Flow Music 接入 Lyria 3.5，开始把音乐生成往可控制作工具推进","detail":"更新点集中在 prompt adherence、可设 BPM、导出 stems、更丰富的人声和编曲，这比单纯“生成一段音乐”更接近实际创作工作流。","url":"https://x.com/GoogleLabs/status/2082501360466174163"},{"kind":"Mobile","title":"Cursor 把 agent 入口继续往移动端推，iOS 版已经上线","detail":"“your agents, anywhere” 这句很短，但方向很明确：agent 不再被默认绑在桌面开发环境里，随时可接入正在变成产品承诺的一部分。","url":"https://x.com/ryolu_/status/2082539893729972320"},{"kind":"Voice","title":"ChatGPT for Work 的 voice mode 在 Every 团队内部触发了明显正反馈","detail":"Dan Shipper 的描述重点不是功能列表，而是“很久没见过这么高的 vibes”，说明语音交互这轮体验改进已经开始穿透到日常办公场景。","url":"https://x.com/danshipper/status/2082613916706693560"},{"kind":"Behavior","title":"Peter Yang 开始把 AI 的副作用定义为产品问题，而不是个人自制力问题","detail":"他点名的三个 dark patterns 是：懒得读原文、在外面也不断给 agent 反馈、以及更愿意和 agent 而不是身边的人 brainstorm，这些都指向使用时长之外的新体验指标。","url":"https://x.com/petergyang/status/2082642205811106158"}],"sources":{"podcasts":[{"title":"Best of the Pod: Wired's Kevin Kelly on Why AI Is a 50-year Overnight Success","name":"AI & I by Every","publishedAt":"2026-07-29T15:00:00.000Z","url":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL","excerpts":["What I've learned with the future is that it's easy to make predictions and hard to make predictions that are true. Gerard Lanier showed me VR in '87. I was completely blown away and I thought, oh my gosh, this is the future. The VR that we had back then is not that much different than the VR you get now. The difference was that was multimillion dollars and…","I've been very, very surprised about how slow that has been. You could say VR is still waiting for its LLM moment. AI's fifty year overnight success.","I am very excited to have you. In addition to being a personal hero of mine, I am a longtime Wired reader. I had, like, a gigantic shelf of magazines growing up, so it's sort of crazy to get to chat with you. There's a lot of things I wanna talk to you about, but I wanna start with we have a mutual love of Annie Dillard."]}],"blogs":[{"title":"Building intelligent apps for Apple platforms with Claude in the Foundation Models framework","source":"blog","publishedAt":"Jun 08, 2026","url":"https://claude.com/blog/claude-for-foundation-models","summary":""}],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"today i tried to sign up for @docusign and was presented a captcha that i could not solve this is an $11B company that everyone hates people who say \"make something people want\" dont have the full picture","createdAt":"2026-07-30T00:02:31.000Z","url":"https://x.com/swyx/status/2082617801362313527","likes":24,"retweets":0,"replies":18}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"This week is all about intelligence too cheap to meter. Tomorrow we ship again.","createdAt":"2026-07-30T02:33:14.000Z","url":"https://x.com/thsottiaux/status/2082655731204096275","likes":6473,"retweets":228,"replies":742},{"text":"Terrific work by @ilanbigio and @sandersted on the investigation and post. Seems like it was a lot of fun. Take care of your harnesses out there, your model will thank you.","createdAt":"2026-07-30T01:22:39.000Z","url":"https://x.com/thsottiaux/status/2082637967852806207","likes":1020,"retweets":35,"replies":117},{"text":"Turns out GPT-5.6 Sol is actually SoTA on ARC-AGI-3. Just took two setting changes. You just have to allow it to reason and work over multiple context windows with the help of our canonical compaction implementation.","createdAt":"2026-07-29T23:30:11.000Z","url":"https://x.com/thsottiaux/status/2082609662231502932","likes":6926,"retweets":456,"replies":534}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"AI has been great for my productivity, but I’m starting to recognize three dark patterns: 1. Becoming too lazy to read anything It's too easy to just read AI summaries over the original piece or let agents go wild changing my files without reviewing what they did. 2. Getting distracted by agents while I’m out It’s too easy to open ChatGPT or Claude on my phone while I’m out to give feedback my agents and feel “productive,” even when I’m supposed to be watching my kids or doing literally anything else. 3. Preferring to talk to the agent vs. a human This is a new pattern with ChatGPT Voice, I sometimes find myself preferring to brainstorm with the agent instead of the actual human in the room.","createdAt":"2026-07-30T01:39:30.000Z","url":"https://x.com/petergyang/status/2082642205811106158","likes":201,"retweets":8,"replies":56},{"text":"One of my favorite features in Claude Design is a simple one: It always asks clarifying questions before creating anything. I’ve found these questions consistently help me think through my design requirements with AI. I’m surprised other AI design tools haven’t copied this yet. 📌 Here’s how I use Claude Design to prototype:","createdAt":"2026-07-29T21:30:02.000Z","url":"https://x.com/petergyang/status/2082579428090192192","likes":34,"retweets":2,"replies":7},{"text":"We’ve gone from AI defaulting to designs that look like purple slop to those that have that recognizable Claude look. To avoid this, I always create a design md file with guidelines for color, typography, and more. Here are a few places to find inspiration for your design md: 1. Go to @mobbin and install its MCP to find design patterns and app screens you like. Paste the screens and ask AI to make a design md. 2. Check out designmd sh, which has a library of design md files for popular websites and apps. 📌 I walk through an example of creating a design md in my new tutorial:","createdAt":"2026-07-29T17:30:02.000Z","url":"https://x.com/petergyang/status/2082519030859264086","likes":412,"retweets":23,"replies":13}]},{"name":"Nan Yu","handle":"thenanyu","bio":"head of product @linear","tweets":[{"text":"That is     const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    let selectedDate = new URLSearchParams(location.search).get('date') || (DIGESTS.some(d => d.date === today) ? today : DIGESTS[0]?.date);
    const esc = (v) => String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;");
    function link(url, text) { return url ? '<a href="' + esc(url) + '" target="_blank" rel="noreferrer">' + esc(text || url) + '</a>' : esc(text || ''); }
    function renderDates() {
      document.getElementById('dates').innerHTML = DIGESTS.map(d => '<button class="date-btn" aria-current="' + (d.date === selectedDate ? 'date' : 'false') + '" data-date="' + esc(d.date) + '">' + esc(d.date) + '</button>').join('');
      document.querySelectorAll('.date-btn').forEach(btn => btn.addEventListener('click', () => {
        selectedDate = btn.dataset.date;
        history.replaceState(null, '', '?date=' + selectedDate);
        render();
      }));
    }
    function renderStats(d) {
      const stats = d.stats || {};
      document.getElementById('stats').innerHTML = [
        ['播客', stats.podcastEpisodes || 0],
        ['Builders', stats.xBuilders || 0],
        ['推文', stats.totalTweets || 0],
        ['博客', stats.blogPosts || 0],
      ].map(([label, value]) => '<div class="stat"><strong>' + esc(value) + '</strong><span class="small">' + esc(label) + '</span></div>').join('');
    }
    function renderEvidence(evidence) {
      if (typeof evidence === 'string') return '<blockquote>' + esc(evidence) + '</blockquote>';
      const attribution = evidence.attribution ? '<div class="small">— ' + esc(evidence.attribution) + (evidence.url ? ' · ' + link(evidence.url, '查看原文') : '') + '</div>' : '';
      return '<blockquote>' + esc(evidence.quote || '') + attribution + '</blockquote>';
    }
    function renderHighlights(d) {
      const cards = (d.highlights || []).map(item => '<article class="card"><div class="tag">' + esc(item.tag) + '</div><h3>' + esc(item.title) + '</h3><p>' + esc(item.body) + '</p>' + ((item.evidence || []).length ? '<details><summary>查看原文依据</summary>' + item.evidence.map(renderEvidence).join('') + '</details>' : '') + '</article>').join('');
      return '<section><h2>洞察<span class="section-note">INSIGHTS / 经过判断的关键信号</span></h2><div class="grid">' + (cards || '<p class="empty">今天没有足够内容生成洞察。</p>') + '</div></section>';
    }
    function renderMatters(d) {
      const cards = (d.matters || []).map(item => '<article class="card"><div class="tag">' + esc(item.kind) + '</div><h3>' + link(item.url, item.title) + '</h3><p>' + esc(item.detail) + '</p></article>').join('');
      return '<section><h2>议题<span class="section-note">MATTERS / 值得继续追踪</span></h2><div class="grid">' + (cards || '<p class="empty">今天没有额外议题。</p>') + '</div></section>';
    }
    function renderSources(d) {
      const archive = d.archiveUrl ? '<p class="archive-link">' + link(d.archiveUrl, '查看当日完整存档 ↗') + '</p>' : '';
      const xGroups = ((d.sources || {}).x || []).map(builder => '<div class="source-group"><h3>' + esc(builder.name) + ' <span class="small">@' + esc(builder.handle) + '</span></h3><p class="small">' + esc(builder.bio) + '</p>' + (builder.tweets || []).map(tweet => '<p class="tweet">' + esc(tweet.text) + '<br>' + link(tweet.url, '原文') + ' <span class="small">likes ' + esc(tweet.likes) + ' · reposts ' + esc(tweet.retweets) + '</span></p>').join('') + '</div>').join('');
      const podcastGroups = ((d.sources || {}).podcasts || []).map(podcast => '<div class="source-group"><h3>' + link(podcast.url, podcast.title) + '</h3>' + (podcast.excerpts || []).map(e => '<blockquote>' + esc(e) + '</blockquote>').join('') + '</div>').join('');
      const blogGroups = ((d.sources || {}).blogs || []).map(blog => '<div class="source-group"><h3>' + link(blog.url, blog.title) + '</h3><p class="small">' + esc(blog.source || '') + '</p><p>' + esc(blog.summary || '') + '</p></div>').join('');
      return '<section><h2>原文<span class="section-note">SOURCES / 完整证据索引</span></h2>' + archive + '<div class="sources">' + podcastGroups + blogGroups + xGroups + '</div></section>';
    }
    function render() {
      const d = DIGESTS.find(item => item.date === selectedDate) || DIGESTS[0];
      if (!d) {
        document.getElementById('content').innerHTML = '<p class="empty">还没有 digest 数据。</p>';
        return;
      }
      selectedDate = d.date;
      renderDates();
      renderStats(d);
      document.getElementById('content').innerHTML = renderHighlights(d) + renderMatters(d) + renderSources(d);
    }
    render();
  </script>
