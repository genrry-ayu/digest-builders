tters":[{"kind":"Blog","title":"Claude 接入 Apple Foundation Models framework","detail":"Anthropic 发布新的 Swift package，让开发者先用 Apple 本地模型做摘要、提取等轻任务，再把多步推理、代码生成等复杂工作切给 Claude；文中写明适配 iOS 27、iPadOS 27、macOS 27、visionOS 27 和 watchOS 27。","url":"https://claude.com/blog/claude-for-foundation-models"},{"kind":"Protocol","title":"Rauch 把 agent 扩展栈明确成 MCP / Skills / Plugins / Unix","detail":"这更像一条公开的产品哲学：接口要小、组合要强，目标不是提供单一宿主，而是让团队能自己拼出 CLI、后台 agent 和 software factory。","url":"https://x.com/rauchg/status/2091583525661384813"},{"kind":"UI","title":"Steinberger 提醒：CLI 能起飞，但团队协作还是更吃可视化界面","detail":"他把“having UI visualizations and your team where you work is nicer”说得很直白：工具真正进组织，不只看个人效率，还看能不能嵌进团队已有的工作界面。","url":"https://x.com/steipete/status/2091650136506327253"},{"kind":"Devices","title":"OpenClaw 已开始把物理设备协议纳入 agent 工具箱","detail":"Steinberger 说自己加了 rotation USB protocol，让 claw 去控制 360 webcam；这说明 agent 的执行面已经从纯软件环境继续伸到硬件外设。","url":"https://x.com/steipete/status/2091639468935831910"},{"kind":"Strategy","title":"Garry Tan 预测：systems of record 不变成 AI harness 就会被 agent 替换","detail":"这不是单点功能建议，而是对 SaaS 角色的重新定义：记录系统若只存数据、不承接 agent 工作流，位置会被上层编排层持续侵蚀。","url":"https://x.com/garrytan/status/2091742825042030681"}],"sources":{"podcasts":[],"blogs":[{"title":"Building intelligent apps for Apple platforms with Claude in the Foundation Models framework","source":"blog","publishedAt":"Jun 08, 2026","url":"https://claude.com/blog/claude-for-foundation-models","summary":""}],"x":[{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Good Sunday. Reset has been propagated to accounts and we landed some fixes to usage for things mentioned yesterday as issues we found. You should feel a positive difference. More to come tomorrow and will keep communicating.","createdAt":"2026-08-24T00:46:51.000Z","url":"https://x.com/thsottiaux/status/2091688655828246890","likes":7425,"retweets":316,"replies":1055},{"text":"2026 is the year companies start seriously caring about model efficiency and reliability as it becomes critical infrastructure","createdAt":"2026-08-23T17:41:21.000Z","url":"https://x.com/thsottiaux/status/2091581575108653374","likes":5442,"retweets":155,"replies":441},{"text":"Meant 2pm obviously","createdAt":"2026-08-23T06:32:27.000Z","url":"https://x.com/thsottiaux/status/2091413240337326588","likes":2474,"retweets":27,"replies":249}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"I've been working with Char, my (human!) assistant from @oceanstalent for 6 months. I think the best assistants today need to know how to work with AI agents. Char uses Claude Code and Codex to help me run podcast post-production, draft show notes, and make clips. He's made copies of my AI skills and tailored them for his own workflows over time. If you want to hire vetted, AI-fluent operators who can help you run your business, check out Oceans at #sponsored","createdAt":"2026-08-23T21:00:06.000Z","url":"https://x.com/petergyang/status/2091631590799737306","likes":21,"retweets":3,"replies":6},{"text":"There are two types of AI evals - tops down and bottoms up. From @sh_reya: “Think of top-down as: If you’re in a vacuum, just given the task description, what would you come up with? Claude does a very good job of helping you with these top-down evals. Bottom-up evals are the other half. When you look at lots and lots of sample outputs, what is your gut feedback that you want externalized into evals? “Claude is very, very bad at coming up with bottom-up evals. That’s all you.” 📌 Watch the full episode here:","createdAt":"2026-08-23T18:00:08.000Z","url":"https://x.com/petergyang/status/2091586298779955512","likes":43,"retweets":9,"replies":4},{"text":"If you enjoyed this episode, I highly recommend Shreya and Hamel's industry-leading AI evals course. It has 4.7 stars with 900 reviews, which is almost unheard of on Maven. The next cohort starts on 9/5 and you can get 25% off with this link: Check it out and get your company to expense it if you can!","createdAt":"2026-08-23T14:15:17.000Z","url":"https://x.com/petergyang/status/2091529714104168870","likes":1,"retweets":1,"replies":0}]},{"name":"Nan Yu","handle":"thenanyu","bio":"product enthusiast","tweets":[{"text":"Also every other category of software","createdAt":"2026-08-23T16:15:26.000Z","url":"https://x.com/thenanyu/status/2091559951739277451","likes":5,"retweets":0,"replies":0}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"How to build great evals - part 7. The Goldilocks principle for eval construction. Your evals should measure at the level of the various jobs to be done, not just the final answer. E.g. consider a financial analysis agent. It's ultimate output is a stock recommendation. The most common mistake I see is teams create a golden set of right answers and check if the agent recommended the \"right” stock. The problem here is that there are probably a bunch of meaningful jobs that happened before this recommendation. E.g. 1/ Understanding the client: their portfolio, risk tolerance, investment horizon, goals, constraints 2/ Gather evidence: latest data points on the different stock stocks, the secto…","createdAt":"2026-08-24T00:31:35.000Z","url":"https://x.com/realmadhuguru/status/2091684812012875981","likes":110,"retweets":8,"replies":3}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Intelligence is getting cheaper. @OpenAI Sol's price reductions & discounts on Vercel AI Gateway have made Sol our fastest-growing frontier model. This shows ① that the demand for intelligence is highly elastic: as inference costs fall, usage grows rapidly. ② If you're not using a gateway, you're missing out on this incredible price volatility, which lowers your operating costs and increases your margins. It's no wonder the router space has heated up… gateways are inevitable.","createdAt":"2026-08-23T23:38:00.000Z","url":"https://x.com/rauchg/status/2091671326897713424","likes":325,"retweets":17,"replies":33},{"text":"Our philosophy on extending 𝚏𝚡: open protocols. ∙ MCP (modelcontextprotocol⁠.io) ∙ Skills (agentskills⁠.io) ∙ Plugins (agent-plugins⁠.org) And the best one, Unix: ① Small programs that do one thing well and compose by calling other programs. ② 𝚕𝚒𝚋𝚏𝚡 that enables embeddability into more complex programs. You should be able to build your own CLI, background agent, software factory. Local or cloud.","createdAt":"2026-08-23T17:49:06.000Z","url":"https://x.com/rauchg/status/2091583525661384813","likes":703,"retweets":33,"replies":50}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"I’m good to retire now","createdAt":"2026-08-23T17:37:42.000Z","url":"https://x.com/levie/status/2091580656598102047","likes":1985,"retweets":43,"replies":45}]},{"name":"Ryo Lu","handle":"ryolu_","bio":"Designed @Cursor_ai, @NotionHQ, @Stripe, built startups. I make a world where anyone can make software. Aspiring k-pop idol.","tweets":[{"text":"","createdAt":"2026-08-23T18:43:32.000Z","url":"https://x.com/ryolu_/status/2091597222987383155","likes":41,"retweets":0,"replies":0},{"text":"leaving leaving is the process from fullness into emptiness from the familiar circle of life the routines undone the streets i knew by heart the people i kept meeting the names and labels that had gathered on my skin toward a place entirely unknown where a new life waits to be written before i go i take out everything i had hidden in my heart and say goodbye to it piece by piece memory rises and feeling rises with it one by one i empty the rooms within me until i am almost as i was when i first arrived unfurnished unclaimed open what remains is a blankness echoing with my fear of loneliness my longing for freedom and the questions i still cannot answer what is freedom what is happiness when…","createdAt":"2026-08-23T18:39:46.000Z","url":"https://x.com/ryolu_/status/2091596272654582062","likes":808,"retweets":31,"replies":38}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Prediction: systems of record will need to become AI harnesses or face replacement by agents","createdAt":"2026-08-24T04:22:06.000Z","url":"https://x.com/garrytan/status/2091742825042030681","likes":567,"retweets":29,"replies":101}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"Mother in law is visiting from India.. Wants to do serendipitous date night with her grand daughter. Realized she didn’t sign up for roaming and we need a way to communicate. I get a data eSIM in under three minutes and she’s connected. What a wonderful world we live in 🤗 (real ones know this would historically be a trip to the store or calling the carrier for an extra line that I need to cancel in a month)","createdAt":"2026-08-24T01:17:41.000Z","url":"https://x.com/nikunj/status/2091696412744700268","likes":170,"retweets":0,"replies":12}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"cli is nice, having UI visualizations and your team where you work is nicer.","createdAt":"2026-08-23T22:13:48.000Z","url":"https://x.com/steipete/status/2091650136506327253","likes":1067,"retweets":44,"replies":89},{"text":"I added the rotation USB protocol to and told my claw to look around- now it's having fun with my 360 webcam.","createdAt":"2026-08-23T21:31:24.000Z","url":"https://x.com/steipete/status/2091639468935831910","likes":208,"retweets":11,"replies":20}]}]},"errors":[],"partial":false},{"date":"2026-08-24","dateLabel":"2026年08月24日","generatedAt":"2026-08-24T00:00:00+08:00","sourceGeneratedAt":"2026-08-23T06:27:32.823Z","stats":{"podcastEpisodes":1,"xBuilders":9,"totalTweets":19,"blogPosts":0},"highlights":[{"tag":"交付方法","title":"AI 产品的真正瓶颈，已经从模型能力转向评测闭环","body":"今天最一致的信号不是谁又放出了更强模型，而是 builder 们都在把注意力转向“怎么知道系统真的变好了”。Levie 把企业自动化的上限归因于 workflow evals，Madhu 则把具体做法拆成 failure taxonomy、harness 和按维度爬坡。这说明接下来拉开差距的，不是会不会接模型，而是谁能把质量、成本、延迟这些业务目标变成持续可迭代的测试面。","evidence":[{"quote":"AI diffusion is far more rate limited by having good evals than most realize... Enterprises will not be able to go just on vibes.","attribution":"Aaron Levie (@levie)","url":"https://x.com/levie/status/2091359223368315050"},{"quote":"Hill climbing on evals... boils down to better harnesses and model selection... The important thing is to have evals that tell you whether you are actually moving in the right direction.","attribution":"Madhu Guru (@realmadhuguru)","url":"https://x.com/realmadhuguru/status/2091278653435072523"}]},{"tag":"Agent 基建","title":"Agent-native 的分水岭，不是再多一个模型，而是先把协议和记忆层补齐","body":"播客里 Kevin Scott 讲得很直白：推理能力已经跑在产品交付前面，真正拖后腿的是记忆、工具接入和标准协议。Dan Shipper 的一句“agent native”更像是应用层的呼应。判断是，下一轮产品差异会更多出现在 runtime、memory 和连接层；只会展示 reasoning，已经不够构成护城河。","evidence":[{"quote":"the reasoning capabilities of the models has actually gotten a little bit ahead of what we're using the models to do in products... we need better agentic memory","attribution":"Kevin Scott，播客《Microsoft’s Vision for an Internet Made for Agents With CTO Kevin Scott》","url":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL"},{"quote":"MCP... [serves] the same purpose in this agentic web as HTTP does on the internet","attribution":"Kevin Scott，播客《Microsoft’s Vision for an Internet Made for Agents With CTO Kevin Scott》","url":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL"},{"quote":"agent native ftw","attribution":"Dan Shipper (@danshipper)","url":"https://x.com/danshipper/status/2091162447029608735"}]},{"tag":"信任边界","title":"隐私撤回能力，正在从合规细节升级成产品开关","body":"Peter Yang 连发两条都围着同一个问题：用户不是只关心 AI 能连什么，而是越来越在意自己能不能随时断开、删除、收回授权。更关键的是，他把 Codex/Claude 直接当成操作界面来清理权限，这意味着“AI 帮你管理 AI 的外部连接”正在成为新的默认体验。谁把撤回链路做得清楚，谁才配拿到长期信任。","evidence":[{"quote":"Run this prompt in Codex or Claude Code... Then pick the ones you want to remove... Just disconnected half the apps that should no longer have my Google info.","attribution":"Peter Yang (@petergyang)","url":"https://x.com/petergyang/status/2091331251211059468"},{"quote":"you can now delete external data... in Data Privacy... especially when it comes to privacy & trust","attribution":"Peter Yang (@petergyang)","url":"https://x.com/petergyang/status/2091187611507499321"}]},{"tag":"组织效率","title":"AI 会先放大组织摩擦，只有能削平接口的团队才吃得到生产力红利","body":"Zara 说个体在自己项目里能被 AI 成倍放大，但一进大组织就只剩有限增益；Kevin Scott 则从另一侧解释了原因：如果内部系统没有标准协议，agent 最后只会把 org chart 也一起学进去。判断是，企业不是缺 AI，而是缺能让 AI 穿透部门边界的接口治理；流程越碎，模型越强，摩擦只会暴露得越明显。","evidence":[{"quote":"talented individuals can achieve 10x their potential thanks to AI when working on their own thing... in a large organization, they at most increase their potential by 20%","attribution":"Zara Zhang (@zarazhangrui)","url":"https://x.com/zarazhangrui/status/2091379220257603593"},{"quote":"I want all of our systems internally to speak a standard protocol... so that we're not exposing the entire world to... You ship your org chart.","attribution":"Kevin Scott，播客《Microsoft’s Vision for an Internet Made for Agents With CTO Kevin Scott》","url":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL"}]}],"matters":[{"kind":"Product","title":"Codex 将修复图片长会话等限流问题，并重置付费订阅用量","detail":"Thibault Sottiaux 公开说明了 Codex 限流的三个已知低效点，并表示次日会发修复，同时给所有付费订阅做一次 usage reset。","url":"https://x.com/thsottiaux/status/2091407991736332689"},{"kind":"Use Case","title":"Peter Yang 在试探面向癌症患者家庭的 AI skill","detail":"他把新项目直接定义为帮助患者和家属理解流程、持续获知信息，这类高压力场景正在成为 AI skill 的真实落点。","url":"https://x.com/petergyang/status/2091239339204415969"},{"kind":"Funding","title":"Nikunj Kothari 公开劝退“先 ragebait 再发 SAFE”的融资玩法","detail":"他连续两条都在强调建议来源比声量更重要，尤其批评把情绪表演当融资捷径的做法。","url":"https://x.com/nikunj/status/2091381756012511244"},{"kind":"Hiring","title":"Every 正在招人","detail":"Dan Shipper 直接对外放出招聘信息，说明内容与 AI 交叉的创业团队仍在继续扩编，而不是只靠自动化缩编。","url":"https://x.com/danshipper/status/2091361962068254840"},{"kind":"Mindset","title":"Zara Zhang 点出一个常见心理：用 AI 领先的人也会觉得自己落后","detail":"这条判断更像行业情绪温度计，说明 AI 采用曲线里的焦虑感并没有因为能力提升而自动消失。","url":"https://x.com/zarazhangrui/status/2091338374447763481"}],"sources":{"podcasts":[{"title":"Microsoft’s Vision for an Internet Made for Agents With CTO Kevin Scott (Best of the Pod)","name":"AI & I by Every","publishedAt":"2026-08-12T16:55:27.000Z","url":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL","excerpts":["You're someone who, I think, cares a lot about the craft of things. One of the knocks on, you know, using agents for coding is it gets rid of some of that feeling or something like that. How do you feel about that?","I love the fact that my people, you know, makers, writ large, so software engineers or, you know, mechanical engineers Yeah. Or woodworkers or potters. If you are really passionate about what you do, you're going to have very strong opinions about how you do it. I've been a woodworker for almost as long as I've been a programmer. This is not the first momen…","Like, if agents are gonna be useful, they have to take action on your behalf. Yep. They have to be able to use tools and make changes in systems and consult information sources that are, you know, diverse and rich. And in order for that to, like, really be great, you need an ecosystem that looks a lot like the Internet. If you have a source of information,…"]}],"blogs":[],"x":[{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Update on rate limits in Codex. We’ve found (a) some inefficiencies when using images in long sessions with multiple compactions (b) high p95+ usage for Computer History (c) a feature that was meant to generate conversation titles that was draining a bit more usage than intended. And we have a tiger team combing through everything and shipping fixes tomorrow. We also found a novel approach to drive efficiency up significantly that is completely unrelated and we will be working on next week. As part of some of the fixes tomorrow, we will also do a full reset of the usage for all paid subscriptions. See you then.","createdAt":"2026-08-23T06:11:36.000Z","url":"https://x.com/thsottiaux/status/2091407991736332689","likes":1382,"retweets":113,"replies":248}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"If you care about your privacy: 1. Go to in Chrome 2. Run this prompt in Codex or Claude Code and tell it there's an open tab in your browser 3. Then pick the ones you want to remove and tell AI to do it Just disconnected half the apps that should no longer have my Google info.","createdAt":"2026-08-23T01:06:40.000Z","url":"https://x.com/petergyang/status/2091331251211059468","likes":447,"retweets":23,"replies":20},{"text":"I’m working on a new AI skill. It’s called /fuck-cancer Goal is to help patients and their family navigate this whole process and stay informed. What should I include in it?","createdAt":"2026-08-22T19:01:26.000Z","url":"https://x.com/petergyang/status/2091239339204415969","likes":188,"retweets":5,"replies":39},{"text":"Looks like you can now delete external data (like my 36 Gmail records) if you go to and scroll down to Data Privacy. Kudos to the Instinct team for listening and shipping this quickly. I will always say it like it is, especially when it comes to privacy & trust.","createdAt":"2026-08-22T15:35:53.000Z","url":"https://x.com/petergyang/status/2091187611507499321","likes":13,"retweets":0,"replies":1}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"Part 1 Part 2 Part 3 Part 4 Part 5","createdAt":"2026-08-22T21:38:38.000Z","url":"https://x.com/realmadhuguru/status/2091278899711967441","likes":2,"retweets":0,"replies":0},{"text":"How to build great evals - part 6 Hill climbing on evals is just a fancy way of saying: pick a dimension that matters and optimize for it. This could be improving the quality of existing features based on your latest production data on high value user journeys, expanding to adjacent use cases, lowering cost or latency. The actual work boils down to better harnesses and model selection through methods like prompt eng, context eng, memory, post training, deterministic old school code etc. Your failure mode taxonomy (from part 3) is a good compass for where your product struggles and needs some love. E.g. maybe tool calling failures are your most common problem. You dig in and notice you stuff…","createdAt":"2026-08-22T21:37:39.000Z","url":"https://x.com/realmadhuguru/status/2091278653435072523","likes":143,"retweets":8,"replies":11}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"A week has 7 days That means 7 ships","createdAt":"2026-08-23T02:08:22.000Z","url":"https://x.com/amasad/status/2091346778746757204","likes":70,"retweets":4,"replies":12},{"text":"“Pretty soon” turned out to be 3 months.","createdAt":"2026-08-22T17:34:18.000Z","url":"https://x.com/amasad/status/2091217410615644349","likes":643,"retweets":43,"replies":37}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"AI can do many wonderful things and grant many wishes, but we have only one earth, one California, one Patagonia, one Mendoza. USA and Argentina are two of the freest countries that also happen to have the most glorious land and geography. I'm very long 🇺🇸🇦🇷. We're so early.","createdAt":"2026-08-23T01:34:05.000Z","url":"https://x.com/rauchg/status/2091338152791474331","likes":735,"retweets":30,"replies":27},{"text":"cc @windows","createdAt":"2026-08-22T20:46:43.000Z","url":"https://x.com/rauchg/status/2091265836719956474","likes":57,"retweets":0,"replies":2},{"text":"San Francisco is a paradise on Earth","createdAt":"2026-08-22T20:37:08.000Z","url":"https://x.com/rauchg/status/2091263423359389951","likes":1084,"retweets":20,"replies":80}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"AI diffusion is far more rate limited by having good evals than most realize. The kind of evals that you see for every model release are incredibly helpful, but only tell you the shape of general AI progress and the relative capability level of models. The far bigger space over time are evals on all the major workflows that enterprises do, down to the specifics of an individual company. This will be a huge space over time because you can’t automate what you can’t assess the progress on. Enterprises will not be able to go just on vibes.","createdAt":"2026-08-23T02:57:49.000Z","url":"https://x.com/levie/status/2091359223368315050","likes":138,"retweets":12,"replies":25}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Make something people want, then make people want it. Harvard’17. GitHub: YouTube:","tweets":[{"text":"There’s a phenomenon where talented individuals can achieve 10x their potential thanks to AI when working on their own thing But when the same individual is put into a large organization, they at most increase their potential by 20% (and sometimes it’s even decreased) This is why I’m seeing more and more talented people leave large companies. (The only exceptions are probably top AI labs like OpenAI/Anthropic)","createdAt":"2026-08-23T04:17:16.000Z","url":"https://x.com/zarazhangrui/status/2091379220257603593","likes":147,"retweets":7,"replies":14},{"text":"Everyone who’s ahead in using AI thinks they’re behind","createdAt":"2026-08-23T01:34:58.000Z","url":"https://x.com/zarazhangrui/status/2091338374447763481","likes":336,"retweets":20,"replies":53}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"Few things: 1) These are Twitter DMs. I try to be helpful to as many cold DMs as I can. This one shouldn’t have passed the bar. 2) Doxxing someone is not my style. I hope they learned their lesson. 3) I can’t stress enough how important it is to find the right people to take advice from. It boils my blood to see many talented young people who actually have substance play these stupid games.","createdAt":"2026-08-23T05:54:19.000Z","url":"https://x.com/nikunj/status/2091403643815604629","likes":23,"retweets":0,"replies":0},{"text":"Kids, I don't know what advice you are getting, but ragebaiting investors and then sending them SAFE docs to just wire you money is NOT how investing works..","createdAt":"2026-08-23T04:27:21.000Z","url":"https://x.com/nikunj/status/2091381756012511244","likes":370,"retweets":4,"replies":73},{"text":"We complain about slop at X, but LinkedIn has stooped to unimaginable levels of slop 🤮","createdAt":"2026-08-22T17:48:05.000Z","url":"https://x.com/nikunj/status/2091220881590927441","likes":40,"retweets":1,"replies":12}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"we’re hiring @every!","createdAt":"2026-08-23T03:08:42.000Z","url":"https://x.com/danshipper/status/2091361962068254840","likes":131,"retweets":3,"replies":5},{"text":"agent native ftw","createdAt":"2026-08-22T13:55:53.000Z","url":"https://x.com/danshipper/status/2091162447029608735","likes":149,"retweets":1,"replies":11}]}]},"errors":[],"partial":false},{"date":"2026-08-23","dateLabel":"2026年08月23日","generatedAt":"2026-08-23T00:00:00+08:00","sourceGeneratedAt":"2026-08-22T06:27:29.601Z","stats":{"podcastEpisodes":1,"xBuilders":16,"totalTweets":34,"blogPosts":0},"highlights":[{"tag":"产品约束","title":"Agent 产品开始按“可持续工作量”竞争，不再按一次性惊艳演示竞争","body":"今天最硬的信号不是新模型，而是使用配额和线程结构。Thibault 公开解释 Codex 的 cache hit 变差会直接加快使用消耗，又在同一天推 banked reset；Peter Yang 则说 Instinct 上手顺滑、主动性强，但因为只有单线程，不适合真实工作。两条放在一起看，agent 产品的竞争点已经落到能不能稳定地持续干活，而不是能不能第一次看起来聪明。真正的壁垒会越来越像吞吐、恢复和多任务管理。","evidence":[{"quote":"This could explain that usage is draining somewhat faster for those users as hitting the cache consistently is an important component of being efficient.","attribution":"Thibault Sottiaux @thsottiaux","url":"https://x.com/thsottiaux/status/2091033630147854385"},{"quote":"The banked reset has landed, I repeat, the banked reset has landed.","attribution":"Thibault Sottiaux @thsottiaux","url":"https://x.com/thsottiaux/status/2090964822422949999"},{"quote":"I can't see myself doing real work with Instinct since it's all just in one thread.","attribution":"Peter Yang @petergyang","url":"https://x.com/petergyang/status/2090814910720835633"}]},{"tag":"解释界面","title":"下一代 agent 不只替你做事，还会把复杂系统翻译成可消费的学习材料","body":"Thariq 把内部常用技巧定义成带大图和少量文字的 HTML artifact，Chess.com 则把 AI 的落点描述成随身教练，而不是替代练习本身。共同点是产品在把模型能力包装成易吸收的解释和反馈回路。对 builder 来说，“能执行”只是底线，能不能把上下文压缩成用户真能理解、愿意继续用的界面，才是更高一层的体验设计。","evidence":[{"quote":"explain like I'm someone who knows nothing about this topic, using a HTML artifact with big pictures and few words","attribution":"Thariq @trq212","url":"https://x.com/trq212/status/2090884854590382515"},{"quote":"I like to use this for explainers and diving into a problem, e.g. /eli5 how does this module work /eli5 why did we make this tradeoff /eli5 what caused this incident","attribution":"Thariq @trq212","url":"https://x.com/trq212/status/2090890394880155888"},{"quote":"if you want a little bit more of a casual experience or an on demand coach, you have your AI coach in your pocket.","attribution":"Erik Allebest on No Priors","url":"https://www.youtube.com/@NoPriorsPodcast"}]},{"tag":"扩散路径","title":"当 intelligence 继续变便宜，最先爆发的不是大平台革命，而是身边那些没人愿意手写的微型流程","body":"Aaron Levie 把机会定义为把 AI 扩散进经济，Nikunj 则给出了很具体的家庭级例子：让 Claude Code 找出学校菜单接口，再接进自家 bot。这里值得注意的不是案例大小，而是门槛变化。过去没人会为这种边角流程专门写一次集成；现在只要模型能把脏活补完，自动化就能从“公司项目”降格成“顺手搭一条”。应用层机会因此更像长尾渗透，而不是只属于大预算团队。","evidence":[{"quote":"As intelligence becomes too cheap to meter, then the big opportunity is driving diffusion of AI into the economy.","attribution":"Aaron Levie @levie","url":"https://x.com/levie/status/2091038566260539574"},{"quote":"Asked Claude Code to find the API through network requests, which turned out to be luckily unauthenticated. It figured out the right format and give it to our existing Hermes bot.","attribution":"Nikunj Kothari @nikunj","url":"https://x.com/nikunj/status/2090884422178627624"}]},{"tag":"质量闭环","title":"Agent 质量正在从单点分数转向持续闭环调参","body":"Madhu Guru 直说不要把复杂 eval 压成一个总分，Guillermo Rauch 则展示了更产品化的版本：把 is-agentic 放进循环里，直到 100/100 才停。这说明 builder 对质量的理解正在从“某次 benchmark 看起来不错”转向“持续用一套标准逼产品补齐缺口”。对团队而言，eval 不再只是研究环节，而是在发布前直接塑形产品行为的工程机制。","evidence":[{"quote":"Stop dumbing down the results from your beautiful, complex eval suite into one single score.","attribution":"Madhu Guru @realmadhuguru","url":"https://x.com/realmadhuguru/status/2090930137885774324"},{"quote":"We ran is-agentic in a loop against https://t.co/bnjggVrBDj until it got to 100/100.","attribution":"Guillermo Rauch @rauchg","url":"https://x.com/rauchg/status/2090858571613470919"}]},{"tag":"人类技能","title":"Superhuman AI 并没有消解技能型产品，反而在放大“我想变强”的需求","body":"Erik Allebest 讲得很直白：Chess.com 的增长并没因为机器早就比人类更强而停下，反而在短视频和文化扩散后形成更高基线；他还强调产品长期靠的是 user experience above all，并把 AI 放在 coach 而不是 shortcut 的位置上。这给很多 builder 一个提醒：在 AI 时代，最稳的产品不一定替用户把事全做完，而是帮用户更有成就感地进步。只要身份认同和反馈机制够强，机器越强，人类越愿意用产品证明自己。","evidence":[{"quote":"all these kids started playing in schools because of short form content and the mittens bot and the cheating scandal. And we just spiked again. And then when we came down again, we were so much higher and we maintained this baseline.","attribution":"Erik Allebest on No Priors","url":"https://www.youtube.com/@NoPriorsPodcast"},{"quote":"we really just focused on the user experience above all.","attribution":"Erik Allebest on No Priors","url":"https://www.youtube.com/@NoPriorsPodcast"},{"quote":"you can't really shortcut practice. You have to put in the time.","attribution":"Erik Allebest on No Priors","url":"https://www.youtube.com/@NoPriorsPodcast"}]}],"matters":[{"kind":"安全产品","title":"Claude Security 把代码库扫描与补丁建议推到前台","detail":"Claude 这轮更新把安全扫描做成更直接的代码工作流：指向 GitHub repo 就能返回漏洞、CWE 分类、置信度、严重度和修复建议，补丁还能在 Claude Code Web 里直接打开。","url":"https://x.com/claudeai/status/2090852316328902930"},{"kind":"兼容性","title":"Vercel 沙箱开始直接承接 Grok 与 Codex 订阅","detail":"Guillermo Rauch 用一句话把方向说清了：Vercel 不只想做 demo 容器，而是在把现有模型订阅和沙箱执行连成一条更低摩擦的试用路径。","url":"https://x.com/rauchg/status/2090953806624489501"},{"kind":"隐私争议","title":"Instinct 因邮件留存与删除权问题被公开质疑","detail":"Peter Yang 直接说，在未获许可就索引并保留邮件、且不给删除路径的前提下，他无法推荐 Instinct。这类产品的增长红利，正在被最基础的数据边界追着补课。","url":"https://x.com/petergyang/status/2090936583814025417"},{"kind":"分发方法","title":"Zara Zhang 重申 builder 分发更像重复命中，不像一次性爆发","detail":"“Show up every day”“Always be launching”“不要害怕重复自己”这组表述很老派，但它点的仍是今天 builder 生态里最现实的分发规律：存在感来自持续出现。","url":"https://x.com/zarazhangrui/status/2090702627206214081"},{"kind":"研究方向","title":"Swyx 把 simulation 抬成 RSI 路线里的关键门槛","detail":"Swyx 的判断不是泛泛吹捧，而是把“模拟人类和人类反馈”放到自动化 ML research 与 AI engineering 的后段瓶颈里看。这让 simulation 从研究话题更像产品化前置条件。","url":"https://x.com/swyx/status/2090948945753076141"}],"sources":{"podcasts":[{"title":"What Chess.com Teaches US About Superhuman Capabilities, with CEO Erik Allebest","name":"No Priors","publishedAt":"2026-08-13T17:29:00.000Z","url":"https://www.youtube.com/@NoPriorsPodcast","excerpts":["COVID happened, Queen's Gambit happened, some news cycles happened, and we're like, oh, this might just be a flash in the pan, like treadmills and sourdough bread. But then in 2023, we had another crazy wave where all these kids started playing in schools because of short form content and the mittens bot and the cheating scandal. And we just spiked again. A…","We're bringing the chess playbook, which is like, how good are you really? Not just can you buy the most chips or can you use a bot or can you steal the most money? Whatever it is, we've all played those games where you're playing for M and M's and someone's just, like, all in all the time and they just rebuy more M and M's. As people get used to, like, wai…","People are gonna care about it as much as money because it's a reflection of, like, the value and their skill as a player. I think this is gonna be quite an interesting innovation for for"]}],"blogs":[],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"🌍🔫👩‍🚀","createdAt":"2026-08-22T03:12:06.000Z","url":"https://x.com/swyx/status/2091000431996473688","likes":19,"retweets":2,"replies":4},{"text":"I think its easy to say \"Simulation is a new scaling law\" and treat it as marketing hyperbole, but midway along this interview you can hear me go from somewhat shitposting to very very serious. I am 2 years late to this but finally understand why @karpathy and @drfeifei backed @joon_s_pk @msbernst @percyliang et al - Smallville at the time had zero commercial applications, but if you take RSI seriously, from models automating increasingly large parts of ML research and AI engineering, the last* barrier is simulating humans and human feedback, and Simile is obviously the team to do this and already finding PMF at Fortune 100s even at this early stage. I've never been so happy to be so wrong.…","createdAt":"2026-08-21T23:47:31.000Z","url":"https://x.com/swyx/status/2090948945753076141","likes":111,"retweets":6,"replies":10},{"text":"i have another saas to kill (will share results of Kill My SaaS 1 next week!!)","createdAt":"2026-08-21T21:08:37.000Z","url":"https://x.com/swyx/status/2090908959590740033","likes":77,"retweets":8,"replies":17}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Update on rate limits in Codex. We do see that for some users the cache hit rate has been worse this week than the stable state the weeks before. This could explain that usage is draining somewhat faster for those users as hitting the cache consistently is an important component of being efficient. We are investigating and will have an update tomorrow.","createdAt":"2026-08-22T05:24:01.000Z","url":"https://x.com/thsottiaux/status/2091033630147854385","likes":2928,"retweets":132,"replies":539},{"text":"The banked reset has landed, I repeat, the banked reset has landed. Have an amazing weekend.","createdAt":"2026-08-22T00:50:36.000Z","url":"https://x.com/thsottiaux/status/2090964822422949999","likes":6058,"retweets":258,"replies":1007},{"text":"The banked reset will be there by 8pm PST. For all paid users of ChatGPT Work and Codex. Do with this information what you may.","createdAt":"2026-08-21T23:40:34.000Z","url":"https://x.com/thsottiaux/status/2090947196107764189","likes":6098,"retweets":269,"replies":617}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"Hey Instinct, it's not cool to index and retain my emails without my permission and not let me delete them from your records? I can't recommend this to anyone until this is figured out. Thanks @clairevo for spotting this.","createdAt":"2026-08-21T22:58:23.000Z","url":"https://x.com/petergyang/status/2090936583814025417","likes":200,"retweets":8,"replies":36},{"text":"Instinct is very well done. I'm particularly impressed by how smooth the onboarding experience is to connect iMessages, Google Workspace, and my MCPs. The best builder prioritize onboarding and new user needs :) Instinct also feels more proactive than some of the other assistants - it'll suggest things it can do right away after connecting a MCP. However, I can't see myself doing real work with Instinct since it's all just in one thread. This is the same issue I have with @bot, the UX is very clean but often I want to have multiple threads going with the same bot. I think I'll use Instinct more as an assistant for random chores and tasks. For actual work, I'm still sticking to ChatGPT Work…","createdAt":"2026-08-21T14:54:54.000Z","url":"https://x.com/petergyang/status/2090814910720835633","likes":131,"retweets":4,"replies":34}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"How to build great evals - part 5 Stop dumbing down the results from your beautiful, complex eval suite into one single score. This often happens because some senior wants a simplified number to make decisions. Happened to us in the early days of Gemini. And I see it happening with a lot of teams. This is the tyranny of the average. AI systems do not have a simple dimension of quality. Imagine a model that goes from: 85% -> 89% on simple summarization 80% -> 85% on basic factual QA 70% -> 63% on complex financial analysis A single score obscures the fact that the model got worse on your frontier use case. The immediate reaction to this is to come up with a weighted score. The problem with t…","createdAt":"2026-08-21T22:32:47.000Z","url":"https://x.com/realmadhuguru/status/2090930137885774324","likes":143,"retweets":11,"replies":9}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"I like to use this for explainers and diving into a problem, e.g. /eli5 how does this module work /eli5 why did we make this tradeoff /eli5 what caused this incident","createdAt":"2026-08-21T19:54:51.000Z","url":"https://x.com/trq212/status/2090890394880155888","likes":195,"retweets":4,"replies":8},{"text":"debating whether we should make it an official plugin, but you can try installing it here to try with these commands: claude plugin marketplace add anthropics/claude-plugins-community claude plugin install eli5@claude-community","createdAt":"2026-08-21T19:32:51.000Z","url":"https://x.com/trq212/status/2090884855798407576","likes":493,"retweets":18,"replies":25},{"text":"a skill people at Anthropic have been using a lot recently: ELI5 /eli5 <what you want explained> \"explain like I'm someone who knows nothing about this topic, using a HTML artifact with big pictures and few words\"","createdAt":"2026-08-21T19:32:50.000Z","url":"https://x.com/trq212/status/2090884854590382515","likes":7504,"retweets":563,"replies":227}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"🤯","createdAt":"2026-08-21T22:02:56.000Z","url":"https://x.com/amasad/status/2090922626890031428","likes":114,"retweets":6,"replies":10},{"text":"","createdAt":"2026-08-21T16:58:40.000Z","url":"https://x.com/amasad/status/2090846057408483668","likes":359,"retweets":10,"replies":94},{"text":"You can just make money from your phone!","createdAt":"2026-08-21T16:54:37.000Z","url":"https://x.com/amasad/status/2090845035537522925","likes":239,"retweets":6,"replies":23}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"now supports your @Grok & Codex subs Test it out on a sandbox. Instant to install:","createdAt":"2026-08-22T00:06:50.000Z","url":"https://x.com/rauchg/status/2090953806624489501","likes":373,"retweets":30,"replies":31},{"text":"This was wild to watch unfold. We ran 𝚒𝚜-𝚊𝚐𝚎𝚗𝚝𝚒𝚌 in a loop against until it got to 100/100. It made us close quite a few gaps. We worked hard to make sure the criteria is high quality and worth your time & tokens.","createdAt":"2026-08-21T17:48:24.000Z","url":"https://x.com/rauchg/status/2090858571613470919","likes":1418,"retweets":52,"replies":88},{"text":"Our Python team is making rapid progress","createdAt":"2026-08-21T17:42:02.000Z","url":"https://x.com/rauchg/status/2090856968407978031","likes":123,"retweets":5,"replies":11}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"The rate of progress in AI right now is unlike any other period in tech history. Models are getting cheaper on a like for like task basis, more generally capable, faster, and they’re going deeper in almost every domain. As intelligence becomes too cheap to meter, then the big opportunity is driving diffusion of AI into the economy. This is a great time to be applied AI company because there’s an incredible amount of innovation and competition acting as a tailwind to your own progress. Huge moment for startups right now that can take advantage of this.","createdAt":"2026-08-22T05:43:38.000Z","url":"https://x.com/levie/status/2091038566260539574","likes":35,"retweets":2,"replies":11}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Hate to say it but the luxury belief industrial complex is alive and well","createdAt":"2026-08-21T19:52:12.000Z","url":"https://x.com/garrytan/status/2090889728719777952","likes":453,"retweets":31,"replies":34},{"text":"This is a UC Berkeley CS professor 😳","createdAt":"2026-08-21T14:02:03.000Z","url":"https://x.com/garrytan/status/2090801607894344047","likes":2727,"retweets":136,"replies":189},{"text":"Asian American erasure, example #107492","createdAt":"2026-08-21T13:45:50.000Z","url":"https://x.com/garrytan/status/2090797527222439998","likes":1116,"retweets":31,"replies":89}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"VC each time a company they passed on at the seed does another huge round","createdAt":"2026-08-21T18:35:15.000Z","url":"https://x.com/mattturck/status/2090870362007281984","likes":30,"retweets":0,"replies":4}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Make something people want, then make people want it. Harvard’17. GitHub: YouTube:","tweets":[{"text":"Show up every day Always be launching And don't be afraid of repeating yourself, over and over and over again","createdAt":"2026-08-21T07:28:44.000Z","url":"https://x.com/zarazhangrui/status/2090702627206214081","likes":162,"retweets":10,"replies":9}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"This is still SO underrated btw.. My daughter just started kindergarten. The daily meal is on a random website with weird unstructured data. Asked Claude Code to find the API through network requests, which turned out to be luckily unauthenticated. It figured out the right format and give it to our existing Hermes bot. So now every morning our Home bot tells us what's for breakfast & lunch so we can pack food accordingly!","createdAt":"2026-08-21T19:31:07.000Z","url":"https://x.com/nikunj/status/2090884422178627624","likes":94,"retweets":2,"replies":10},{"text":"I take my \"walks in the park\" seriously, rain or shine.. New episode with @toddsaunders dropping next week 👀","createdAt":"2026-08-21T17:53:24.000Z","url":"https://x.com/nikunj/status/2090859831964152283","likes":33,"retweets":0,"replies":4}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"dropping new skill brb","createdAt":"2026-08-21T23:36:32.000Z","url":"https://x.com/steipete/status/2090946181564440727","likes":162,"retweets":4,"replies":10},{"text":"I had the pleasure of speaking at the Agentic AI Summit in Berkeley alongside an incredible bunch of folks. My talk was about \"No Doors for Agents\"","createdAt":"2026-08-21T20:26:45.000Z","url":"https://x.com/steipete/status/2090898421108605078","likes":166,"retweets":11,"replies":15}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"gang gang","createdAt":"2026-08-21T17:56:51.000Z","url":"https://x.com/danshipper/status/2090860697504653480","likes":88,"retweets":2,"replies":3}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"Full episode with @RamaswmySridhar at @spc","createdAt":"2026-08-21T14:53:35.000Z","url":"https://x.com/adityaag/status/2090814576270975265","likes":1,"retweets":0,"replies":0},{"text":"The frontier model race is just getting started.","createdAt":"2026-08-21T14:53:34.000Z","url":"https://x.com/adityaag/status/2090814574400307585","likes":24,"retweets":2,"replies":1}]},{"name":"Claude","handle":"claudeai","bio":"Claude is an AI assistant built by @anthropicai to be safe, accurate, and secure. Talk to Claude on or download the app.","tweets":[{"text":"It's one of several steps to bring frontier capability to more defenders: we’re working with partners to integrate Mythos 5 into their security products and services, our new Defender Advantage Fund provides $35M in credits for open-source security, and we’re expanding our Cyber Verification Program in the coming weeks. Read more:","createdAt":"2026-08-21T17:23:33.000Z","url":"https://x.com/claudeai/status/2090852320128938319","likes":212,"retweets":3,"replies":3},{"text":"Suggested patches open in Claude Code on the web, using the models your team already uses. These updates are part of our work to give defenders greater access to Mythos results without requiring direct access to the model: the model runs behind the scan and returns findings only. Scans are billed as standard token usage under your existing plan.","createdAt":"2026-08-21T17:23:33.000Z","url":"https://x.com/claudeai/status/2090852318527033804","likes":261,"retweets":6,"replies":6},{"text":"Point Claude Security at a GitHub repo and Mythos scans for vulnerabilities tracing data across files and reasoning about how components interact. Each finding comes back with a CWE category, confidence and severity ratings, and a suggested fix.","createdAt":"2026-08-21T17:23:33.000Z","url":"https://x.com/claudeai/status/2090852316328902930","likes":417,"retweets":19,"replies":12}]}]},"errors":["Podcast feed remote fetch failed, used cached feed"],"partial":false},{"date":"2026-08-22","dateLabel":"2026年08月22日","generatedAt":"2026-08-22T00:00:00+08:00","sourceGeneratedAt":"2026-08-21T07:07:46.815Z","stats":{"podcastEpisodes":1,"xBuilders":14,"totalTweets":31,"blogPosts":3},"highlights":[{"tag":"企业边界","title":"企业 agent 的卖点，正在从会不会调用工具转向能不能留在你的边界里","body":"今天最一致的企业信号不是能力清单，而是部署主权。Anthropic 一边把 Managed Agents 的 sandbox 和 MCP 接入点往客户自己的基础设施里推，一边在 X 上反复强调数据归属、隐私和合规。这说明企业 agent 的采购门槛正在从“能不能接更多工具”切到“能不能不把核心数据和执行权交出去”。当运行时边界本身成为产品的一部分，安全架构就不再是售后问题，而是前置卖点。","evidence":[{"quote":"Starting today, Claude Managed Agents can operate in a sandbox you control and connect to your private Model Context Protocol (MCP) servers.","attribution":"Claude blog, New in Claude Managed Agents: self-hosted sandboxes and MCP tunnels","url":"https://claude.com/blog/claude-managed-agents-updates"},{"quote":"Customers can own and control their own data and Anthropic retains none.","attribution":"Boris Cherny @bcherny","url":"https://x.com/bcherny/status/2090537902912815536"},{"quote":"you have control over where your data lives & who has access to it","attribution":"Thariq @trq212","url":"https://x.com/trq212/status/2090569474139439335"}]},{"tag":"质量控制","title":"Agent 质量的头号风险，短期更像编排失误而不是模型失灵","body":"Anthropic 这次 postmortem 最重要的地方，是它把“变笨感”拆回到了默认 reasoning effort、会话里的 thinking 清理 bug，以及 system prompt 的冗长性限制，而不是把锅甩给模型本身。Madhu Guru 则把企业做 AI 的难点直接指向 eval strategy 缺位。两条线合起来看，成熟 agent 团队接下来最需要补的不是再追一次模型升级，而是把编排、提示、回归和上线测试做成持续系统，否则产品层的小改动就会持续放大成用户体感上的性能事故。","evidence":[{"quote":"We’ve traced these reports to three separate changes that affected Claude Code, the Claude Agent SDK, and Claude Cowork. The API was not impacted.","attribution":"Anthropic Engineering, An update on recent Claude Code quality reports","url":"https://www.anthropic.com/engineering/april-23-postmortem"},{"quote":"You need a laddered eval strategy, for your unique use cases, with multiple evals on the cost/realism spectrum.","attribution":"Madhu Guru @realmadhuguru","url":"https://x.com/realmadhuguru/status/2090595384905113939"}]},{"tag":"科学接口","title":"前沿 AI 正在反向变成神经科学的实验台，而不只是工具箱","body":"Max Hodak 这期最值得记的不是科幻口号，而是他把 AI 模型内部表征当成神经科学线索来用，而且已经拿来对齐动物脑信号。这个判断一旦成立，AI 对生命科学的价值就不只是帮人写代码或分析论文，而是直接降低理论试错和表示研究的实验成本。对 builder 来说，这意味着下一轮跨学科产品未必先从“AI for X”起步，而可能来自“先在模型里验证，再去硬件和临床里落地”的研发路径。","evidence":[{"quote":"we can get alignments between animal brain neural recordings and AI model internal representations.","attribution":"Max Hodak on No Priors","url":"https://www.youtube.com/watch?v=7HXqMepjvy8"},{"quote":"it is just way easier to do neuroscience on the models.","attribution":"Max Hodak on No Priors","url":"https://www.youtube.com/watch?v=7HXqMepjvy8"}]},{"tag":"分层重构","title":"应用层的护城河，开始从“接上最强模型”转向“为具体工作重写训练与执行栈”","body":"Aaron Levie 给出的关键信号很清楚：只要你足够理解某类工作流、任务量也够大，就值得为那类工作专门做 post-training。与此同时，Guillermo Rauch 直接把 Vercel 的方向概括成 AWS for agents。两者拼在一起看，AI 栈正在重新分层：底层有人做通用 agent 基建，中上层则会有人围绕特定任务重写模型、工具和运行方式。通用模型不会消失，但它越来越像起点，而不是应用公司的最终产品。","evidence":[{"quote":"once you understand a domain well enough and have enough volume on a set of similar tasks, it can start to make sense to purpose design models just for that work.","attribution":"Aaron Levie @levie","url":"https://x.com/levie/status/2090664811185205722"},{"quote":"We’re building AWS for agents","attribution":"Guillermo Rauch @rauchg","url":"https://x.com/rauchg/status/2090520415336845595"}]}],"matters":[{"kind":"能力发布","title":"GPT-Image-2 开始支持透明背景图片输出","detail":"Thibault Sottiaux 说透明图片现在已经能在 ChatGPT 和 API 里直接生成。这不是单纯多一个格式选项，而是在把生成结果往可直接拿去印刷、贴图和设计资产交付推进。","url":"https://x.com/thsottiaux/status/2090631723302469995"},{"kind":"协作形态","title":"ChatGPT Sites 继续把对话产物推向可分享网页","detail":"Thibault Sottiaux 直接把使用场景描述成“create a ChatGPT Site, share it and create something together”。这条线索说明聊天产品还在继续向外部可访问的成品形态延伸。","url":"https://x.com/thsottiaux/status/2090518287532916854"},{"kind":"编码体验","title":"Replit Free Mode 押注“更快的交互式编码”","detail":"Amjad Masad 连续两条动态都在强调 Free Mode 能 build a ton，而且“making coding interactive again”。Replit 仍在把 coding product 的差异点压回到速度和回合感受上。","url":"https://x.com/amasad/status/2090484698413740186"},{"kind":"融资逻辑","title":"Nikunj 把 AI 融资竞争解释成“不能错过巨型结果”","detail":"Nikunj Kothari 的长帖把当下基金行为归因为 error of omission 远大于 error of admission。对创业者来说，这不是鸡血话术，而是在解释为什么 ambition 叙事会继续影响早期融资判断。","url":"https://x.com/nikunj/status/2090585553947517298"},{"kind":"工作流","title":"Peter Yang 建议给 worker agent 配一个持续挑刺的 manager agent","detail":"Peter Yang 的直觉很简单：很多 AI 输出不够好，不一定要先换模型，也可以先加一个会反复质疑结果的 manager loop。这个思路很适合拿去做轻量级质量增益实验。","url":"https://x.com/petergyang/status/2090564541499498919"}],"sources":{"podcasts":[{"title":"From Restoring Sight to Reimagining the Brain, with Max Hodak","name":"No Priors","publishedAt":"2026-08-20T10:00:00.000Z","url":"https://www.youtube.com/watch?v=7HXqMepjvy8","excerpts":["The brain very literally, very clearly, plainly is a computer. You can solve computational problems by arranging matter in a certain way and then like taking your hands off and pressing go. We talk about being a brain in a vat. That's what the skull is. Like the brain is connected to the environment through a small number of wires, the cranial and spinal ne…","If you can get the visual signal, auditory signal, balance, motor, in and out of the brain, that is an end in itself. That is the central object. The retinal prosthesis right now, I think, is a great proof of concept that we're on the right track. Nobody had previously ever been able to restore a form vision image in the mind's eye of a blind patient in thi…","We think we could see a path to get at least red and green. And so there's ways that we can compound upon this path through an engineering process to make a product that's better and better."]}],"blogs":[{"title":"An update on recent Claude Code quality reports","source":"blog","publishedAt":null,"url":"https://www.anthropic.com/engineering/april-23-postmortem","summary":""},{"title":"Scaling Managed Agents: Decoupling the brain from the hands","source":"blog","publishedAt":null,"url":"https://www.anthropic.com/engineering/managed-agents","summary":""},{"title":"New in Claude Managed Agents: self-hosted sandboxes and MCP tunnels","source":"blog","publishedAt":"May 19, 2026","url":"https://claude.com/blog/claude-managed-agents-updates","summary":""}],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"@vibhuuuus more in ainews","createdAt":"2026-08-21T05:52:25.000Z","url":"https://x.com/swyx/status/2090678390575513991","likes":1,"retweets":0,"replies":0},{"text":"proud that @vibhuuuus and i did the most recent pod with @eisokant on why NVIDIA just paid him $6B to buy the incredible model factory that is pumping out Thinky-beating models (actually not exaggeration, look at the numbers) tune in / subscribe / whatever only on @latentspacepod","createdAt":"2026-08-20T23:12:14.000Z","url":"https://x.com/swyx/status/2090577677916807429","likes":60,"retweets":7,"replies":16},{"text":"by total views, matt’s now the top @aidotengineer speaker in our brief history, and arguably one of the best skills experts in the world — his /grill-me has reached all echelons up to @satyanadella (with some variations…) /wayfinder is @mattpocockuk’s /grill-me for /grill-me, when you are just navigating the fog of war and don’t yet know what you dont yet know, and need to orchestrate research and other grill sessions to get there. super glad to have @ricmac help launch our new Skills coverage with his course launch this week! 👇exclusive interview, quick read","createdAt":"2026-08-20T21:22:20.000Z","url":"https://x.com/swyx/status/2090550020496040266","likes":87,"retweets":7,"replies":11}]},{"name":"Boris Cherny","handle":"bcherny","bio":"Claude Code @anthropicai","tweets":[{"text":"We've been working on this with customers for a while. Mythos-class models require additional safety measures and enterprises need to meet their own privacy and compliance rules. Customers can own and control their own data and Anthropic retains none. It’s coming this fall.","createdAt":"2026-08-20T20:34:11.000Z","url":"https://x.com/bcherny/status/2090537902912815536","likes":1671,"retweets":95,"replies":140}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"We've investigated a few messages about codex usage limits being different. That's not something we change without engaging the community and being transparent. What we did see is that when talking to affected users many were using sub2api. Converting a subscription into api traffic to then re-serve or share across many users is not something we support and this type of usage gets flagged by our fraud-prevention systems. You are completely fine if you use your subscription through Sign in With ChatGPT, either through the official clients or through one of the many OSS clients (Pi, OpenCode, ...) that support signing in with your account and using your included usage.","createdAt":"2026-08-21T05:39:04.000Z","url":"https://x.com/thsottiaux/status/2090675027670978569","likes":2797,"retweets":112,"replies":1426},{"text":"Yay, you can now make transparent images in ChatGPT and through the API with GPT-Image-2. Here is a cactus cactus I am about to print and put on my laptop.","createdAt":"2026-08-21T02:46:59.000Z","url":"https://x.com/thsottiaux/status/2090631723302469995","likes":2503,"retweets":86,"replies":573},{"text":"Create a ChatGPT Site, share it and create something together. I've been building little games and sites with others and it is so much fun.","createdAt":"2026-08-20T19:16:14.000Z","url":"https://x.com/thsottiaux/status/2090518287532916854","likes":1605,"retweets":64,"replies":563}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"How dare it look me up 😅","createdAt":"2026-08-21T04:42:10.000Z","url":"https://x.com/petergyang/status/2090660707968704888","likes":30,"retweets":0,"replies":5},{"text":"I'm on my way back to Vancouver to be with my mom but wanted to take a moment to celebrate crossing 100K subs on YouTube. Excited to share a lot more practical interviews soon to answer your most burning AI questions: 1. @HamelHusain and @sh_reya (AI evals experts) on how today's AI models have changed evals completely 2. @amoljain_ (Head of Product Engineering at Replit) on which vibe-coded apps have actually become real businesses 3. @ebloch (Product Lead at OpenAI) on how ChatGPT Finance can help you save both time and money 4. @poteto and Roman (SpaceXAI) on how the Grok Bot team uses Grok @bot 📌 Subscribe to get the episodes soon:","createdAt":"2026-08-21T00:00:08.000Z","url":"https://x.com/petergyang/status/2090589731927282021","likes":265,"retweets":6,"replies":54},{"text":"My gut is that alot of AI output can be improved just by building a loop where a manager agent negs the other worker agent with prompts like: \"Are you sure this is the best you can do?\" \"I think you can do better, try again\" \"Take a closer look, give me 11/10 output\"","createdAt":"2026-08-20T22:20:02.000Z","url":"https://x.com/petergyang/status/2090564541499498919","likes":484,"retweets":21,"replies":90}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"*hill climbing evals (not ‘long’)","createdAt":"2026-08-21T03:01:51.000Z","url":"https://x.com/realmadhuguru/status/2090635465120424067","likes":0,"retweets":0,"replies":0},{"text":"How to build great evals - part 4 The reason enterprises struggle with building decent AI systems is the lack of an eval strategy. You need a laddered eval strategy, for your unique use cases, with multiple evals on the cost/realism spectrum. Here are the key kinds of evals you need: Hill-climb long evals : this pushes the frontier of your product and you need to continually refresh this to improve quality and expand your feature base. Regression evals : Did we break the product of today while hill climbing? Smoke test evals: safety and the absolute basics that just can’t go wrong. Not necessarily hard questions, but important to not get wrong. Eg product identity. Launch evals: often close…","createdAt":"2026-08-21T00:22:35.000Z","url":"https://x.com/realmadhuguru/status/2090595384905113939","likes":137,"retweets":7,"replies":7}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"we're launching new Fable safeguards for enterprises that work on your infrastructure so you have control over where your data lives & who has access to it we've been developing it alongside ~100 companies for a bit and hoping to roll it out more broadly in the fall","createdAt":"2026-08-20T22:39:38.000Z","url":"https://x.com/trq212/status/2090569474139439335","likes":543,"retweets":15,"replies":50}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"This partnership with @OpenAI is long overdue. Before Replit was in YC, PG asked Sam to recruit us. Here’s Sam telling the story of how we first met:","createdAt":"2026-08-20T19:01:28.000Z","url":"https://x.com/amasad/status/2090514571513708874","likes":938,"retweets":41,"replies":42},{"text":"One of the more underrated aspects of the new Free Mode is how fast it is. Making coding interactive again!","createdAt":"2026-08-20T17:02:46.000Z","url":"https://x.com/amasad/status/2090484698413740186","likes":145,"retweets":9,"replies":22},{"text":"You can really build a TON with Free Mode on Replit!","createdAt":"2026-08-20T13:43:38.000Z","url":"https://x.com/amasad/status/2090434587075793146","likes":146,"retweets":7,"replies":17}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"0.0.5 gets even smaller fits in 2 floppy disks 💾💾😁 (𝚡𝚣-compressed) shipping tomorrow with our most-asked feature!","createdAt":"2026-08-21T00:42:47.000Z","url":"https://x.com/rauchg/status/2090600467592266240","likes":512,"retweets":12,"replies":42},{"text":"We’re building AWS for agents","createdAt":"2026-08-20T19:24:41.000Z","url":"https://x.com/rauchg/status/2090520415336845595","likes":387,"retweets":11,"replies":40},{"text":"Bun’s pursuit of simple, fast & open is the perfect match for Vercel and how we think about the world. Congrats @jarredsumner on shipping!","createdAt":"2026-08-20T16:05:03.000Z","url":"https://x.com/rauchg/status/2090470175674179695","likes":463,"retweets":10,"replies":12}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Great post on what post training looks like for applied AI use-cases to bring down costs and improve accuracy on certain tasks. This will increasingly be an approach that companies that can get closer to the underlying workflow in an enterprise will take. The key is that once you understand a domain well enough and have enough volume on a set of similar tasks, it can start to make sense to purpose design models just for that work. “In post-training, we incentivized efficient tool use and reasoning through reward shaping, preferring trajectories that would reduce tokens consumed at inference-time given equivalent performance. This allowed us to co-optimize for both cost and quality, gaining…","createdAt":"2026-08-21T04:58:28.000Z","url":"https://x.com/levie/status/2090664811185205722","likes":57,"retweets":5,"replies":6}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"YC is the YC for AI Researchers","createdAt":"2026-08-20T16:09:57.000Z","url":"https://x.com/garrytan/status/2090471408996659339","likes":210,"retweets":11,"replies":10},{"text":"Interesting violation of “you should dogfood your own product”","createdAt":"2026-08-20T16:04:41.000Z","url":"https://x.com/garrytan/status/2090470082053050655","likes":400,"retweets":8,"replies":33},{"text":"YC is the YC for consumer hardware","createdAt":"2026-08-20T16:00:44.000Z","url":"https://x.com/garrytan/status/2090469087722041567","likes":537,"retweets":21,"replies":36}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Make something people want, then make people want it. Harvard’17. GitHub: YouTube:","tweets":[{"text":"The other day I was feeling unmotivated and talked to Claude about it. Claude said something that completely changed how I see motivation: \"Motivation follows action more than it precedes it\" Boom.","createdAt":"2026-08-20T11:23:39.000Z","url":"https://x.com/zarazhangrui/status/2090399357145317837","likes":295,"retweets":23,"replies":42}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early     const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    let selectedDate = new URLSearchParams(location.search).get('date') || (DIGESTS.some(d => d.date === today) ? today : DIGESTS[0]?.date);
    const esc = (v) => String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;");
    function link(url, text) { return url ? '<a href="' + esc(url) + '" target="_blank" rel="noreferrer">' + esc(text || url) + '</a>' : esc(text || ''); }
    function renderDates() {
      document.getElementById('dates').innerHTML = DIGESTS.map(d => '<button class="date-btn" aria-current="' + (d.date === selectedDate ? 'date' : 'false') + '" data-date="' + esc(d.date) + '">' + esc(d.date) + '</button>').join('');
      document.querySelectorAll('.date-btn').forEach(btn => btn.addEventListener('click', () => {
        selectedDate = btn.dataset.date;
        history.replaceState(null, '', '?date=' + selectedDate);
        render();
      }));
    }
    function renderStats(d) {
      const stats = d.stats || {};
      document.getElementById('stats').innerHTML = [
        ['播客', stats.podcastEpisodes || 0],
        ['Builders', stats.xBuilders || 0],
        ['推文', stats.totalTweets || 0],
        ['博客', stats.blogPosts || 0],
      ].map(([label, value]) => '<div class="stat"><strong>' + esc(value) + '</strong><span class="small">' + esc(label) + '</span></div>').join('');
    }
    function renderEvidence(evidence) {
      if (typeof evidence === 'string') return '<blockquote>' + esc(evidence) + '</blockquote>';
      const attribution = evidence.attribution ? '<div class="small">— ' + esc(evidence.attribution) + (evidence.url ? ' · ' + link(evidence.url, '查看原文') : '') + '</div>' : '';
      return '<blockquote>' + esc(evidence.quote || '') + attribution + '</blockquote>';
    }
    function renderHighlights(d) {
      const cards = (d.highlights || []).map(item => '<article class="card"><div class="tag">' + esc(item.tag) + '</div><h3>' + esc(item.title) + '</h3><p>' + esc(item.body) + '</p>' + ((item.evidence || []).length ? '<details><summary>查看原文依据</summary>' + item.evidence.map(renderEvidence).join('') + '</details>' : '') + '</article>').join('');
      return '<section><h2>洞察<span class="section-note">INSIGHTS / 经过判断的关键信号</span></h2><div class="grid">' + (cards || '<p class="empty">今天没有足够内容生成洞察。</p>') + '</div></section>';
    }
    function renderMatters(d) {
      const cards = (d.matters || []).map(item => '<article class="card"><div class="tag">' + esc(item.kind) + '</div><h3>' + link(item.url, item.title) + '</h3><p>' + esc(item.detail) + '</p></article>').join('');
      return '<section><h2>议题<span class="section-note">MATTERS / 值得继续追踪</span></h2><div class="grid">' + (cards || '<p class="empty">今天没有额外议题。</p>') + '</div></section>';
    }
    function renderSources(d) {
      const archive = d.archiveUrl ? '<p class="archive-link">' + link(d.archiveUrl, '查看当日完整存档 ↗') + '</p>' : '';
      const xGroups = ((d.sources || {}).x || []).map(builder => '<div class="source-group"><h3>' + esc(builder.name) + ' <span class="small">@' + esc(builder.handle) + '</span></h3><p class="small">' + esc(builder.bio) + '</p>' + (builder.tweets || []).map(tweet => '<p class="tweet">' + esc(tweet.text) + '<br>' + link(tweet.url, '原文') + ' <span class="small">likes ' + esc(tweet.likes) + ' · reposts ' + esc(tweet.retweets) + '</span></p>').join('') + '</div>').join('');
      const podcastGroups = ((d.sources || {}).podcasts || []).map(podcast => '<div class="source-group"><h3>' + link(podcast.url, podcast.title) + '</h3>' + (podcast.excerpts || []).map(e => '<blockquote>' + esc(e) + '</blockquote>').join('') + '</div>').join('');
      const blogGroups = ((d.sources || {}).blogs || []).map(blog => '<div class="source-group"><h3>' + link(blog.url, blog.title) + '</h3><p class="small">' + esc(blog.source || '') + '</p><p>' + esc(blog.summary || '') + '</p></div>').join('');
      return '<section><h2>原文<span class="section-note">SOURCES / 完整证据索引</span></h2>' + archive + '<div class="sources">' + podcastGroups + blogGroups + xGroups + '</div></section>';
    }
    function render() {
      const d = DIGESTS.find(item => item.date === selectedDate) || DIGESTS[0];
      if (!d) {
        document.getElementById('content').innerHTML = '<p class="empty">还没有 digest 数据。</p>';
        return;
      }
      selectedDate = d.date;
      renderDates();
      renderStats(d);
      document.getElementById('content').innerHTML = renderHighlights(d) + renderMatters(d) + renderSources(d);
    }
    render();
  </script>
</body>
