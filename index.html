ev: @dagster, @scale_ai","tweets":[{"text":"We heard your feedback that you want Claude to proactively take more off your plate! Claude Duet is a large step in this direction - it'll notice work that needs to be done, and then do it before you ask. Join the waitlist here:","createdAt":"2026-10-21T19:25:50.000Z","url":"https://x.com/_catwu/status/2112988751576330487","likes":728,"retweets":21,"replies":70}]},{"name":"Google Labs","handle":"GoogleLabs","bio":"Google’s home for our latest AI tools and experiments.","tweets":[{"text":"Story picked ✅ Calendar cleared ✅ The adventure continues in “Dreambeans Roulette: Part 2”! Join the trail with Sahana, Brian, and Nala as we dive into all things Dreambeans including: ☕️ How are Dreambean stories “brewed” in the first place? ☁️ How can one make Dreambeans “dream” even better? 📵 What if apps were designed to get you off your phone? Stay tuned for Part 3, where Brian shares field notes from the trail and a bit more on the experience and vision behind Google Labs. Dreambeans is live in the US, for users 18+. More regions coming soon. Learn more at","createdAt":"2026-10-21T18:05:52.000Z","url":"https://x.com/GoogleLabs/status/2112968628861878648","likes":30,"retweets":3,"replies":2}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"prompt -> corporation","createdAt":"2026-10-21T18:31:12.000Z","url":"https://x.com/amasad/status/2112975002027147545","likes":99,"retweets":4,"replies":34}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Vercel has proactively rolled out Firewall-level mitigations for today's Node.js RCE vulnerability, in advance of the official patch release. All traffic for all deployments is automatically protected. We're actively monitoring and rolling out managed runtime upgrades.","createdAt":"2026-10-21T23:29:26.000Z","url":"https://x.com/rauchg/status/2113050053724221732","likes":1449,"retweets":58,"replies":81},{"text":"DeepSeek v4.1 Flash (1017) is now included in ▲ Token Pass. Fast, mind-bogglingly cheap, and served with ZDR (zero-data retention). It's a phenomenal model to run subagents that execute plans conceived by larger and more expensive models. You can port TypeScript to Rust 10 times and not run out of credits 😂","createdAt":"2026-10-21T20:50:19.000Z","url":"https://x.com/rauchg/status/2113010010766913815","likes":544,"retweets":13,"replies":74},{"text":"It was inspiring to watch the behind-the-scenes¹ of the industry coming together, weeks in advance, to protect the world's infrastructure and mitigate php2shell. We deployed Vercel WAF mitigations that have already successfully prevented attempts on PHP origins. Assume more vulnerabilities are on the way. Flex the patch → redeploy muscle. ¹ A Slack channel. Thank you @SlackHQ!","createdAt":"2026-10-21T19:29:19.000Z","url":"https://x.com/rauchg/status/2112989629536440400","likes":386,"retweets":14,"replies":36}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"If you wanted to know all the jobs that AI will produce, look no further than cybersecurity. This is going to become one of the biggest investment areas for enterprises going forward. And even as the work becomes more agentic and autonomous you will need more talent to point the agents at the most critical work, review findings, patch systems, respond to incidents, and more. Lots of opportunity right now for the systems that protect data and enterprises, as well as the professionals that are deploying them and protecting organizations. It’s going to only get more wild out there.","createdAt":"2026-10-22T05:15:03.000Z","url":"https://x.com/levie/status/2113137032633757773","likes":187,"retweets":10,"replies":22},{"text":"Cyber is going to be one of the most profound aspects of AI. We now have a tireless workforce that can hunt down, discover, patch, or attack any system and software ever cr t’s urgent, and we’ll keep tuning it based on what early users tell us. Join the waitlist: Read more:","createdAt":"2026-10-21T19:09:37.000Z","url":"https://x.com/claudeai/status/2112984669943968099","likes":3248,"retweets":135,"replies":155},{"text":"Claude Duet draws on years of our safety and security work on agents. It never directly sees your passwords, a new classifier guards against sharing sensitive information, and the important decisions stay with you. We’ll share more on our approach to safety in Claude Duet soon.","createdAt":"2026-10-21T19:09:36.000Z","url":"https://x.com/claudeai/status/2112984667758510197","likes":2120,"retweets":37,"replies":27},{"text":"We designed Claude Duet around Claude Opus 5.5, which gives it the judgment to decide what needs you, what can wait, and when to check with you first. It carries over the memory, skills, and connected apps from your Claude account, so there’s little to set up.","createdAt":"2026-10-21T19:09:36.000Z","url":"https://x.com/claudeai/status/2112984666437546104","likes":3673,"retweets":76,"replies":52}]}]},"errors":[],"partial":false},{"date":"2026-10-21","dateLabel":"2026年10月21日","generatedAt":"2026-10-21T00:00:00+08:00","sourceGeneratedAt":"2026-10-19T06:54:43.642Z","stats":{"podcastEpisodes":1,"xBuilders":11,"totalTweets":21,"blogPosts":2},"highlights":[{"tag":"工程能力","title":"AI 应用走向实用，数据系统能力更难被简单封装替代","body":"本期远程 feed 获取失败，使用10月19日缓存，以下并非今日新消息。Swyx 的招聘表达提示：会拼接检索流程与能处理数据密集型系统，是不同层次的工程能力。若产品要长期运行，关键问题会延伸到数据组织与系统行为，而不只是一段模型调用。因此求职作品应展示完整问题的处理过程。这是一位招聘者的需求信号，不能扩展为整个就业市场的统计结论。","evidence":[{"quote":"there's a big difference between a \"RAG guy\" and a \"Data Intensive Applications\" person","attribution":"Swyx（10月19日缓存素材）","url":"https://x.com/swyx/status/2112073533794971941"}]},{"tag":"交互设计","title":"当创作本身有趣，游戏工具可能成为玩法的一部分","body":"依据10月19日缓存中的 Thariq 构想，生成角色的过程可以成为用户反复返回的理由。其产品意义在于，把创作入口、规则反馈与实际游玩连在一起，让用户能观察自己的修改如何影响体验。但角色可自由生成，也会把平衡性变成持续的问题；原帖表达的是设想，并未证明自动平衡已经实现。","evidence":[{"quote":"I was having as much fun making the game + characters as I was playing it.","attribution":"Thariq（10月19日缓存素材）","url":"https://x.com/trq212/status/2111884199359897953"}]},{"tag":"协作成本","title":"Agent 并行的收益，取决于任务能否被有效拆分和验收","body":"Box CEO Aaron Levie 在10月19日素材中提出，Agent 群体可把更多任务转化为算力投入问题。这个判断有明确前提：模型能胜任任务，多个执行者还能协调工作。由此推导，单纯增加 Agent 数量不足以保证结果改善；能否拆分任务、定义验收标准并控制复核成本，决定新增算力是否真正转化为有效产出。这是对其论点的分析，而非已经验证的规模化效果。","evidence":[{"quote":"All of this work is bottlenecked by our ability to plan, execute, review, and coordinate everything happening in these workflows.","attribution":"Aaron Levie（10月19日缓存素材）","url":"https://x.com/levie/status/2112051081014649303"}]}],"matters":[{"kind":"X · 10月19日素材","title":"Thibault Sottiaux 描述 OpenCode 事件后的恢复协作","detail":"据10月19日原帖，其团队与 OpenCode 合作恢复相关 OpenAI API 客户的使用，并退还攻击造成的额度消耗；素材未说明攻击机制，不据此补充技术细节。","url":"https://x.com/thsottiaux/status/2112034063934742720"},{"kind":"X · 10月19日素材","title":"Peter Yang 提倡用实际工作试做评估候选人","detail":"10月19日帖文引用一个两周完成具体功能的案例，强调以交付观察工作能力。案例没有给出薪酬、知识产权或候选人体验安排，不能据此判断完整招聘流程的效果。","url":"https://x.com/petergyang/status/2111970651326267529"},{"kind":"X · 10月19日素材","title":"Guillermo Rauch 分享小型游戏迭代体验","detail":"10月19日缓存中的帖子描述通过 AI Gateway 增加声音、碰撞检测和跟随镜头，并估计花费约30美分。这是个人单次体验，未提供可复现的成本基准。","url":"https://x.com/rauchg/status/2111929486661018081"},{"kind":"Blog · 历史复盘","title":"Claude Code 的质量复盘提醒：产品层改动也会改变智能表现","detail":"缓存文章回顾4月已修复的问题：默认推理强度、历史推理清理逻辑及精简输出提示词均影响体验。该文不是今天的故障公告，不能据此判断当前版本仍有同样问题。","url":"https://www.anthropic.com/engineering/april-23-postmortem"}],"sources":{"podcasts":[{"title":"What Happens When Billions of AI Agents Hit Your Database? (Andy Pavlo)","name":"The MAD Podcast with Matt Turck","publishedAt":"2026-10-08T11:30:00.000Z","url":"https://www.youtube.com/@DataDrivenNYC/videos","excerpts":["What is a file system? It's a database. Right? Everything's a database. Every month, there's a story where someone lost their production database because the agent deleted something.","It's the wild west for people that don't know thei ","createdAt":"2026-10-18T02:20:58.000Z","url":"https://x.com/rauchg/status/2111643672274165938","likes":381,"retweets":12,"replies":43}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"The biggest misread of anyone predicting the end of software engineering was imagining that the world only needed a certain amount of software, and bringing automation to the field would reduce the need for labor. Exactly the opposite is happening where essentially most things are actually turning into software. Because agents can use tools, work with computers, write software on the fly, and process data like humans (but far faster), we can now throw “software” at problems that never could reasonably be digitized before. What that leads to is the role of engineering taking on greater importance in the economy, because we can now engineer far more systems and processes than were possible be…","createdAt":"2026-10-17T18:30:51.000Z","url":"https://x.com/levie/status/2111525362446520466","likes":806,"retweets":92,"replies":116}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"introducing the modern venture capital stack (2026): - pre-pre-seed - pre-seed - post-pre-seed - mid-seed - pre-post-seed - post-seed - post-post-seed(?)","createdAt":"2026-10-17T20:42:52.000Z","url":"https://x.com/nikunj/status/2111558586421920134","likes":121,"retweets":4,"replies":23},{"text":"nyc ily 👋","createdAt":"2026-10-17T11:13:37.000Z","url":"https://x.com/nikunj/status/2111415330622820739","likes":151,"retweets":2,"replies":12}]}]},"errors":[],"partial":false}];
    const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    let selectedDate = new URLSearchParams(location.search).get('date') || (DIGESTS.some(d => d.date === today) ? today : DIGESTS[0]?.date);
    const esc = (v) => String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;");
    function link(url, text) { return url ? '<a href="' + esc(url) + '" target="_blank" rel="noreferrer">' + esc(text || url) + '</a>' : esc(text || ''); }
    function renderDates() {
      document.getElementById('dates').innerHTML = DIGESTS.map(d => '<button class="date-btn" aria-current="' + (d.date === selectedDate ? 'date' : 'false') + '" data-date="' + esc(d.date) + '">' + esc(d.date) + '</button>').join('');
      document.querySelectorAll('.date-btn').forEach(btn => btn.addEventListener('click', () => {
        selectedDate = btn.dataset.date;
        history.replaceState(null, '', '?date=' + selectedDate);
        render();
      }));
    }
    function renderStats(d) {
      const stats = d.stats || {};
      document.getElementById('stats').innerHTML = [
        ['播客', stats.podcastEpisodes || 0],
        ['Builders', stats.xBuilders || 0],
        ['推文', stats.totalTweets || 0],
        ['博客', stats.blogPosts || 0],
      ].map(([label, value]) => '<div class="stat"><strong>' + esc(value) + '</strong><span class="small">' + esc(label) + '</span></div>').join('');
    }
    function renderEvidence(evidence) {
      if (typeof evidence === 'string') return '<blockquote>' + esc(evidence) + '</blockquote>';
      const attribution = evidence.attribution ? '<div class="small">— ' + esc(evidence.attribution) + (evidence.url ? ' · ' + link(evidence.url, '查看原文') : '') + '</div>' : '';
      return '<blockquote>' + esc(evidence.quote || '') + attribution + '</blockquote>';
    }
    function renderHighlights(d) {
      const cards = (d.highlights || []).map(item => '<article class="card"><div class="tag">' + esc(item.tag) + '</div><h3>' + esc(item.title) + '</h3><p>' + esc(item.body) + '</p>' + ((item.evidence || []).length ? '<details><summary>查看原文依据</summary>' + item.evidence.map(renderEvidence).join('') + '</details>' : '') + '</article>').join('');
      return '<section><h2>洞察<span class="section-note">INSIGHTS / 经过判断的关键信号</span></h2><div class="grid">' + (cards || '<p class="empty">今天没有足够内容生成洞察。</p>') + '</div></section>';
    }
    function renderMatters(d) {
      const cards = (d.matters || []).map(item => '<article class="card"><div class="tag">' + esc(item.kind) + '</div><h3>' + link(item.url, item.title) + '</h3><p>' + esc(item.detail) + '</p></article>').join('');
      return '<section><h2>议题<span class="section-note">MATTERS / 值得继续追踪</span></h2><div class="grid">' + (cards || '<p class="empty">今天没有额外议题。</p>') + '</div></section>';
    }
    function renderSources(d) {
      const archive = d.archiveUrl ? '<p class="archive-link">' + link(d.archiveUrl, '查看当日完整存档 ↗') + '</p>' : '';
      const xGroups = ((d.sources || {}).x || []).map(builder => '<div class="source-group"><h3>' + esc(builder.name) + ' <span class="small">@' + esc(builder.handle) + '</span></h3><p class="small">' + esc(builder.bio) + '</p>' + (builder.tweets || []).map(tweet => '<p class="tweet">' + esc(tweet.text) + '<br>' + link(tweet.url, '原文') + ' <span class="small">likes ' + esc(tweet.likes) + ' · reposts ' + esc(tweet.retweets) + '</span></p>').join('') + '</div>').join('');
      const podcastGroups = ((d.sources || {}).podcasts || []).map(podcast => '<div class="source-group"><h3>' + link(podcast.url, podcast.title) + '</h3>' + (podcast.excerpts || []).map(e => '<blockquote>' + esc(e) + '</blockquote>').join('') + '</div>').join('');
      const blogGroups = ((d.sources || {}).blogs || []).map(blog => '<div class="source-group"><h3>' + link(blog.url, blog.title) + '</h3><p class="small">' + esc(blog.source || '') + '</p><p>' + esc(blog.summary || '') + '</p></div>').join('');
      return '<section><h2>原文<span class="section-note">SOURCES / 完整证据索引</span></h2>' + archive + '<div class="sources">' + podcastGroups + blogGroups + xGroups + '</div></section>';
    }
    function render() {
      const d = DIGESTS.find(item => item.date === selectedDate) || DIGESTS[0];
      if (!d) {
        document.getElementById('content').innerHTML = '<p class="empty">还没有 digest 数据。</p>';
        return;
      }
      selectedDate = d.date;
      renderDates();
      renderStats(d);
      document.getElementById('content').innerHTML = renderHighlights(d) + renderMatters(d) + renderSources(d);
    }
    render();
