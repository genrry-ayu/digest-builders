,{"type":"paragraph","sentences":[{"id":"nov14-10","text":"该评测把 Hydrogen 交给 Box Agent，执行金融、咨询、生命科学等行业的企业文档复杂任务；作者据此看好它处理高效而复杂的工作。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120947988143198302","quote":"For this eval, we give the Box Agent Hydrogen as a model for a series of complex tasks that represent real world work with enterprise documents across finance, consulting, life sciences, and other industries. Hydrogen will be a great model for a lot of efficient but complex tasks across these fields."}],"reviewNote":"逐句对照原文，保留作者自述及限定，不将宣传、预测或内部经验改写成普遍实证。"}]},{"type":"paragraph","sentences":[{"id":"nov14-11","text":"他称 Hydrogen 将很快在 Box AI Studio 推出，供客户构建定制 agent；原帖没有给出确切日期，不能当作已经对所有客户开放。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120947988143198302","quote":"Gemini team is definitely cooking. Hydrogen will be rolling out in the Box AI Studio shortly so any customer can build a custom agent with it."}],"reviewNote":"逐句对照原文，保留作者自述及限定，不将宣传、预测或内部经验改写成普遍实证。"}]}],"coverageReview":{"details":"保留比较基线、百分点单位、不到一半耗时、约12%token变化、三个行业与产品推出状态。","limitations":"厂商内部评测，文字未给样本量或独立复核；附原帖图表，不将结果泛化到所有任务。","omissions":"省去夸赞团队的修辞，不补缺失的被引帖。"}}],"editorial":[{"id":"nov14-12","text":"这次自报评测同时观察准确率、时间和 token，提供了比单一分数更完整的采用依据；结论范围仍是 Box 的企业文档任务。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2120947988143198302","quote":"Ok this is a big deal. We’ve been testing Gemini 4 Hydrogen in early access with the Box AI Complex Work Eval, and it’s a serious jump for fast models. \n\nHydrogen is 5 percentage points better in accuracy than Gemini 3.8 Flash. That alone would be a great boost in capability, but possibly more importantly it did the tasks in less than half the time with about 12% fewer tokens on a typical task.\n\nFor this eval, we give the Box Agent Hydrogen as a model for a series of complex tasks that represent real world work with enterprise documents across finance, consulting, life sciences, and other industries. Hydrogen will be a great model for a lot of efficient but complex tasks across these fields.\n\nGemini team is definitely cooking. Hydrogen will be rolling out in the Box AI Studio shortly so any customer can build a custom agent with it."}],"reviewNote":"逐句对照原文，保留作者自述及限定，不将宣传、预测或内部经验改写成普遍实证。"}]},"images":[{"src":"assets/digest/2026-11-14/08e15fed5ad50a629c263b67.jpg","originalUrl":"https://pbs.twimg.com/media/HW8e8-VasAAStoc.jpg","sourceUrl":"https://x.com/levie/status/2120947988143198302","attribution":"Aaron Levie","sha256":"656beeac65cdd1c6aee5f519044d1faf4528b9e7761842237457ba0f0cda4150","width":1200,"height":688,"mediaId":"08e15fed5ad50a629c263b67","alt":"Box 原帖对比 Gemini 3.8 Flash 与 Gemini 4 Hydrogen 在完整数据集及行业子集的准确率柱状图。"}]},{"tag":"实践","title":"Claude Meetings 让团队看见并纠正生成过程","body":"Claude：Claude 官方介绍，Claude 会作为可见参与者加入会议。","claimType":"single_source","sourcePerspective":"Claude","titleReview":{"id":"nov14-13","text":"Claude Meetings 让团队看见并纠正生成过程","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120973996304830859","quote":"Claude joins as a visible participant. Ask it a question out loud or in chat, or have it start a doc. Your team can see what it’s building and correct it as it takes shape. https://t.co/IFoJgWURCj"}],"reviewNote":"逐句对照原文，保留作者自述及限定，不将宣传、预测或内部经验改写成普遍实证。"},"evidence":[{"sourceId":"x:2120973996304830859","quote":"Your team can see what it’s building and correct it as it takes shape.","translation":"团队能看见它正在构建的内容，并在形成过程中进行纠正。","attribution":"Claude","url":"https://x.com/claudeai/status/2120973996304830859"}],"detail":{"sources":[{"sourceId":"x:2120973996304830859","blocks":[{"type":"paragraph","sentences":[{"id":"nov14-14","text":"Claude 官方介绍，Claude 会作为可见参与者加入会议。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120973996304830859","quote":"Claude joins as a visible participant."}],"reviewNote":"逐句对照原文，保留作者自述及限定，不将宣传、预测或内部经验改写成普遍实证。"}]},{"type":"paragraph","sentences":[{"id":"nov14-15","text":"参与者可以用语音或聊天向它提问，也可以让它开始写一份文档。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120973996304830859","quote":"Ask it a question out loud or in chat, or have it start a doc."}],"reviewNote":"逐句对照原文，保留作者自述及限定，不将宣传、预测或内部经验改写成普遍实证。"}]},{"type":"paragraph","sentences":[{"id":"nov14-16","text":"团队能看见它正在构建的内容，并在内容形成时纠正它。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120973996304830859","quote":"Your team can see what it’s building and correct it as it takes shape."}],"reviewNote":"逐句对照原文，保留作者自述及限定，不将宣传、预测或内部经验改写成普遍实证。"}]}],"coverageReview":{"details":"保留可见参与者、语音/聊天、起草文档与生成中纠正四个具体动作。","limitations":"官方功能介绍，不扩展为准确率、保密性或全平台开放承诺。","omissions":"不补视频里的未采集细节；其它会议帖子不重复拆成议题。"}}],"editorial":[{"id":"nov14-17","text":"这里的协作方式不只是在会后接收结果，还包括在生成过程中查看与纠正；原帖描述了交互能力，没有证明它能减少多少错误。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2120973996304830859","quote":"Claude joins as a visible participant. Ask it a question out loud or in chat, or have it start a doc. Your team can see what it’s building and correct it as it takes shape. https://t.co/IFoJgWURCj"}],"reviewNote":"逐句对照原文，保留作者自述及限定，不将宣传、预测或内部经验改写成普遍实证。"}]},"images":[{"src":"assets/digest/2026-11-14/6efefaf491d7020caaffeec3.jpg","originalUrl":"https://pbs.twimg.com/media/HW80yoZWEAIsg59.jpg","sourceUrl":"https://x.com/claudeai/status/2120973996304830859","attribution":"Claude","sha256":"72fc4b302defc1d734de8bf74ae5292061e411f33cb226e377b5245671da4be0","width":1200,"height":675,"mediaId":"6efefaf491d7020caaffeec3","alt":"Claude 作为可见会议参与者出现在视频网格中，并在聊天区引用文档作答。"}]}],"matters":[{"kind":"动态","title":"网络安全新工具瞄准自动修补与自动红队","detail":"Thibault Sottiaux 宣布团队正在开发自动补丁和自动红队方向的网络安全工具，并提供演示录播；帖中没有具体可用日期、支持范围或验证结果。","sourceId":"x:2121036562058400200","url":"https://x.com/thsottiaux/status/2121036562058400200"},{"kind":"动态","title":"Replit Agent 可为企业采购与购买广告","detail":"Amjad Masad 称，用户现在可让 Replit Agent 为企业购买物品，包括购买广告以获取客户；帖中没有交代支付授权、预算限制或实际获客效果。","sourceId":"x:2121018020520931712","url":"https://x.com/amasad/status/2121018020520931712"},{"kind":"动态","title":"dots 更新与 banked reset 开始发放","detail":"Thibault Sottiaux 在 11 月 12 日的帖中称 dots 已有更新，banked reset 已激活、预计随后进入用户账户；未披露更新明细，也没有承诺所有账户即时到账。","sourceId":"x:2120999993079451919","url":"https://x.com/thsottiaux/status/2120999993079451919"},{"kind":"动态","title":"Peter Steinberger 提醒留意付费赞评","detail":"Peter Steinberger 称，有即将发布的 agent 营销方支付高额费用，邀请人在 X 上说好话，并提醒读者留意评测是否诚实；他没有指明产品或提供交易证据，不据此猜测具体品牌。","sourceId":"x:2121009372470067544","url":"https://x.com/steipete/status/2121009372470067544"}],"articles":{"blogs":[],"podcasts":[{"title":"Isomorphic Labs：把更多药物试错移到计算机，再回到真实验证","sourceTitle":"Powering AI-Driven Drug Discovery with President of Isomorphic Labs Max Jaderberg","sourceId":"c9a0c39e-de2a-11f1-9237-d39059052d4c","sourceUrl":"https://www.youtube.com/@NoPriorsPodcast","sourceName":"No Priors","author":"Max Jaderberg","publishedAt":"2026-11-12T11:00:00.000Z","linkScope":"channel","sourceTextSha256":"c6b5e880345474a113aba067b8f74efd35efd345f92fdd90a70de9f5e0926e4a","blocks":[{"type":"paragraph","text":"在 No Priors 访谈中，Isomorphic Labs 总裁、创始团队成员 Max Jaderberg 解释了公司的药物研发路线：让更多设计与预测发生在计算机里，再用真实实验验证。他的出发点不是药物已能由 AI 自动完成，而是传统试错在复杂生物学问题面前越来越昂贵，失败往往直到进入患者试验才显露。"},{"type":"heading","text":"从游戏 AI 到可迁移的生物学模型"},{"type":"paragraph","text":"Jaderberg 在计算机视觉领域完成博士研究、创业并进入 DeepMind，后来参与生成模型、深度强化学习和游戏挑战。他逐渐把问题从“AI 能否解出难题”转向“应该用它解决什么”。AlphaFold 展示了深度学习在重要生物学空间里泛化的可能，使团队相信值得建立专门公司，把 AI、化学和生物学人员聚到一起；Isomorphic Labs 因而在约 2021 年起步。"},{"type":"heading","text":"发现一种药之后，下一种能否更容易"},{"type":"paragraph","text":"主持人以知识增长与药物研发效率的反差提问，Jaderberg 将一个核心原因归于经验性试错：先对疾病机制和分子设计作假设，再合成、测试、反复迭代。细胞与分子设计空间都极其复杂，有限时间和资金约束了能探索的方案；在他的解释中，容易找到的药物逐渐被发现，剩下的问题更难。"},{"type":"paragraph","text":"他也承认文化与组织的影响，但更关心研发能否获得规模效应：一个项目学到的东西，能不能让下一种药更快？如果每种药都只是孤立的前沿研究，知识难以充分迁移；他希望底层模型吸收项目经验，持续改善对疾病生物学和分子设计的理解。这是平台路线的目标，不是已经证明每个项目都会加速。"},{"type":"heading","text":"跨学科团队要防止追逐虚假指标"},{"type":"paragraph","text":"公司并不要求每个候选人预先兼懂 AI 与制药，而是分别招聘优秀 AI 研究者、化学家和生物学家，通过内部交流培养交叉领域能力。谈到核心建模团队，他认为约五名 AI 人员配一名关键领域专家的比例有一定共鸣；领域专家要解释数据和指标，避免模型只优化看起来漂亮、却不能转化为药物价值的数字，这不是整家公司固定的人员配比。"},{"type":"heading","text":"以实验精度为目标，而不是彻底取消实验"},{"type":"paragraph","text":"核心 AI 团队希望把药物发现、设计和疾病理解尽量搬到计算机。自动化实验室能减少操作时间，但分子合成、细胞培养仍有物理等待；因此他们把“实验精度”画在内部评测图上，希望预测模型逐步接近这一目标。AlphaFold 的结构预测是他用来说明这种思路的例子。"},{"type":"paragraph","text":"他的设想是，更多探索在计算机中完成，真正合成分子和测试假设时，成功机会会更高、现实往返次数会更少。他同时明确，最终仍必须验证新的科学假设、药物效果与安全性；把更多试错移到计算机，不等于可以跳过真实验证或临床过程。"},{"type":"heading","text":"昂贵失败要求更早理解毒性与作用机制"},{"type":"paragraph","text":"访谈随后从发现阶段转向临床失败。Jaderberg 指出，分子可能打中目标却也影响别处，或目标本身产生意外负面作用，问题常在进入患者后才被发现。因此模型不只要预测结合，还要尽早理解疾病、细胞与不同作用路径。这是减少晚期未知风险的研发方向，并非已经达到的临床成功率承诺。"},{"type":"paragraph","text":"数据策略也不能只堆积旧记录。他认为，公共或企业数据库经常是过去项目留下的副产品，带有选择偏差；若追求泛化，所需数据分布可能不同。团队因此自行生成部分数据，同时结合外部资源，并把核心 AI 药物设计模型留在内部开发。"},{"type":"heading","text":"动物代理之外，寻找更接近人体的预测端点"},{"type":"paragraph","text":"主持人追问动物实验与人体结果之间的差距。Jaderberg 认为，可以把体外测量、AI 模型、类器官、器官芯片和合成人体组织结合，尝试更直接地预测人体临床毒性；他也承认相关临床数据有限。访谈中的动物预测性数字未展开研究口径，这里不把它当作普遍准确率。"},{"type":"paragraph","text":"实验技术范围很广，公司既自行工作，也与 CRO 和其他平台合作生成数据，并长期使用自动化实验室。Jaderberg 支持缩短真实世界反馈时间，但反复强调更大的方向是减少必须进入真实世界迭代的次数：实验负责验证，计算模型承担更多探索，而不是简单把现有试错全部交给机器人。"},{"type":"heading","text":"模型内部使用，药物管线既自研也合作"},{"type":"paragraph","text":"Isomorphic Labs 不把核心模型按 token 销售或授权出去，而是用其开发药物：一部分项目自行拥有、出资和推进，另一部分与制药公司、biotech 合作，结合对方在特定疾病领域的知识。按受访者介绍，内部重点是肿瘤、免疫和炎症；底层引擎则力求跨疾病、靶点类型与分子形式使用。"},{"type":"paragraph","text":"团队希望寻找影响多个下游适应证的共同机制。他以 RAS 相关药物的进展说明“根节点”思路，同时指出癌症突变可能绕过单一方案；这里引用的是他的研究讨论，不把其他公司的案例算作 Isomorphic Labs 的成果。"},{"type":"heading","text":"组合用药受制于安全性，也受制于设计精度"},{"type":"paragraph","text":"对于更复杂的药物组合，Jaderberg 解释，分子的毒性、肝脏影响和药物相互作用会限制安全组合；主持人也提到临床试验人数和组合数量的困难。他希望更精确的分子工程能支持同时调节多条生物通路的方案，但使用的仍是希望和可能，而非已经证实的治疗能力。"},{"type":"paragraph","text":"主持人提出监管是否过度强调安全时，他没有赞同放弃安全，而是强调患者安全始终居中，不同疾病与患者处境的风险承受能力也不同。他希望未来用更好的分子安全性和成功率数据推动改变，并明确这是需要逐步证明的目标。"},{"type":"heading","text":"临床时间表尚未给出，长期目标仍是更健康的生活"},{"type":"paragraph","text":"被问及首次临床试验日期，Jaderberg 没有给出确定时间，只说药物项目在推进、临床开发团队在建设。对于五年后的期待，他希望疾病预测理解与更精准、低毒的分子设计工具显著进步，同时承认发现和开发仍需要多年；他没有承诺五年内治愈某一比例的癌症。"},{"type":"paragraph","text":"访谈最后区分寿命与健康寿命：即使活到较高年龄，骨骼、肌肉等退化仍会影响行动与生活质量。Jaderberg 支持既改善具体疾病，也探索衰老的根本机制，但没有给出延长人类寿命倍数的预测。整条路线的落点仍是提高预测能力，并通过真实验证把它转为更安全有效的药物。"}]}]},"quality":{"collected":39,"collectedTweets":38,"used":8,"usedTweets":7,"uniqueAuthors":7,"imageCount":2,"claimAudit":{"reviewMode":"editorial review plus structural checks; not automated proof of meaning","claimsReviewed":17,"warnings":[]},"status":"degraded","warnings":["Quoted-post context missing: x:2120966768483262648","Quoted-post context missing: x:2120947988143198302","Media unverified: podcasts:c9a0c39e-de2a-11f1-9237-d39059052d4c (feed_has_no_media_or_supported_post_locator)"]},"contentSchemaVersion":2,"sourceSnapshotSha256":"429f353141b728ef293e07cabd2e267367159acf4b56401f893a04bd9c03861a","selection":{"sources":[{"sourceId":"x:2121088973372334443","decision":"excluded","reason":"个人活动和大会现场片段，未包含可展开的技术内容。"},{"sourceId":"x:2121060183988486493","decision":"excluded","reason":"个人活动和大会现场片段，未包含可展开的技术内容。"},{"sourceId":"x:2120981552561844593","decision":"excluded","reason":"个人活动和大会现场片段，未包含可展开的技术内容。"},{"sourceId":"x:2120990821902397885","decision":"excluded","reason":"产品预告或简短宣传；不与Box同模型评测重复，眼镜预订帖也缺少完整产品身份。"},{"sourceId":"x:2120990820631450061","decision":"excluded","reason":"产品预告或简短宣传；不与Box同模型评测重复，眼镜预订帖也缺少完整产品身份。"},{"sourceId":"x:2120942262054232392","decision":"excluded","reason":"产品预告或简短宣传；不与Box同模型评测重复，眼镜预订帖也缺少完整产品身份。"},{"sourceId":"x:2121062974161092792","decision":"excluded","reason":"征求改进意见但未给实际方案，不作为产品更新。"},{"sourceId":"x:2121036562058400200","decision":"used","reason":"采用具体原文与作者观点，保留其范围和限制。"},{"sourceId":"x:2120999993079451919","decision":"used","reason":"采用具体原文与作者观点，保留其范围和限制。"},{"sourceId":"x:2121100531502620784","decision":"excluded","reason":"人物争议或只有感叹与外链，缺乏核实且偏离构建实践。"},{"sourceId":"x:2121098361201918301","decision":"excluded","reason":"人物争议或只有感叹与外链，缺乏核实且偏离构建实践。"},{"sourceId":"x:2121035933541941297","decision":"exclude thropicAI","tweets":[{"text":"A lot of getting good work out of Claude now is just finding the context it’s missing and figuring out how to close that gap Claude Meetings is one way to bring in the remaining slices and has proved very useful internally","createdAt":"2026-11-12T20:54:59.000Z","url":"https://x.com/alexalbert__/status/2120983722182988206","likes":386,"retweets":10,"replies":86}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Ok this is a big deal. We’ve been testing Gemini 4 Hydrogen in early access with the Box AI Complex Work Eval, and it’s a serious jump for fast models. Hydrogen is 5 percentage points better in accuracy than Gemini 3.8 Flash. That alone would be a great boost in capability, but possibly more importantly it did the tasks in less than half the time with about 12% fewer tokens on a typical task. For this eval, we give the Box Agent Hydrogen as a model for a series of complex tasks that represent real world work with enterprise documents across finance, consulting, life sciences, and other industries. Hydrogen will be a great model for a lot of efficient but complex tasks across these fields. G…","createdAt":"2026-11-12T18:33:00.000Z","url":"https://x.com/levie/status/2120947988143198302","likes":619,"retweets":39,"replies":82},{"text":"What a mess 😕","createdAt":"2026-11-12T14:05:42.000Z","url":"https://x.com/levie/status/2120880718868045973","likes":490,"retweets":18,"replies":31}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"With Jensen, the AI ecosystem loses: * its central banker (backstops etc) * its most active investor * a bold acquirer (extra kudos to Hugging Face for perhaps the best timing in large M&A history) Those are the kind of aggressive moves only a founder can make","createdAt":"2026-11-12T18:46:44.000Z","url":"https://x.c d to everybody today - appreciate all the DMs and comments!!","createdAt":"2026-11-12T16:07:02.000Z","url":"https://x.com/nikunj/status/2120911254999154710","likes":2,"retweets":0,"replies":0}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"My team wrote about how we run persistent agents inside OpenAI.","createdAt":"2026-11-13T01:53:12.000Z","url":"https://x.com/steipete/status/2121058770767982997","likes":589,"retweets":32,"replies":73},{"text":"Would you enable yolo mode for dots, even if your dot might do sth unwanted?","createdAt":"2026-11-13T00:47:25.000Z","url":"https://x.com/steipete/status/2121042215619510584","likes":106,"retweets":1,"replies":127},{"text":"There’s some new agent launching later this week and marketers offer a lot of money to say nice things about it on X. Keep a lookout on honest reviews 🫠","createdAt":"2026-11-12T22:36:55.000Z","url":"https://x.com/steipete/status/2121009372470067544","likes":1159,"retweets":24,"replies":124}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"Everybody is talking about honeypot! Was it a honeypot always or merely at the end, as a form of circumstance? But this is precisely the trap. *sniffs* These are merely the *surface* of the situation. What is the real infidelity? America tells Nvidia: you are married to national security, you must not sell your most powerful chips to China. But in the same breath it says: you are the great hero of American capitalism! Sell as many chips as possible! And Jensen says: of course, darling, I will be faithful. Then, late at night, *sniffs* he finds a way to remain faithful. So you see, Jensen is not cheating on the system. Cheating on his wife? Yes. The system? No. He is the only one who has bee…","createdAt":"2026-11-13T00:23:44.000Z","url":"https://x.com/danshipper/status/2121036252350972222","likes":20,"retweets":4,"replies":6},{"text":"Claude the first time it sits in on one of my meetings:","createdAt":"2026-11-12T23:56:01.000Z","url":"https://x.com/danshipper/status/2121029280432075157","likes":138,"retweets":4,"replies":13},{"text":"🫡🤝","createdAt":"2026-11-12T23:43:05.000Z","url":"https://x.com/danshipper/status/2121026025668727279","likes":23,"retweets":1,"replies":1}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"We would not be where we are today without Jensen. It is viscerally painful to see what is happening.","createdAt":"2026-11-12T16:57:55.000Z","url":"https://x.com/adityaag/status/2120924059709956201","likes":334,"retweets":24,"replies":19}]},{"name":"Claude","handle":"claudeai","bio":"Claude is an AI assistant built by @anthropicai to be safe, accurate, and secure. Talk to Claude on or download the app.","tweets":[{"text":"Claude Meetings is starting with Google Meet, with support for other video conferencing platforms coming soon. Learn more:","createdAt":"2026-11-12T20:16:22.000Z","url":"https://x.com/claudeai/status/2120974000746582357","likes":1275,"retweets":38,"replies":26},{"text":"Claude takes the notes, too. After the call, the notes, action items, transcript, and anything Claude built are on the meeting’s page in Claude.","createdAt":"2026-11-12T20:16:21.000Z","url":"https://x.com/claudeai/status/2120973999295643679","likes":1277,"retweets":18,"replies":11},{"text":"Claude joins as a visible participant. Ask it a question out loud or in chat, or have it start a doc. Your team can see what it’s building and correct it as it takes shape.","createdAt":"2026-11-12T20:16:21.000Z","url":"https://x.com/claudeai/status/2120973996304830859","likes":1678,"retweets":43,"replies":34}]}]},"errors":[],"partial":false},{"date":"2026-11-13","dateLabel":"2026年11月13日","generatedAt":"2026-11-13T00:00:00+08:00","sourceGeneratedAt":"2026-11-12T06:28:54.625Z","stats":{"podcastEpisodes":1,"xBuilders":16,"totalTweets":32,"blogPosts":0},"highlights":[{"tag":"实践","title":"Dan Shipper：同一模型下，团队的价值在选择与负责","body":"Dan Shipper 用客户调查与回答排序实验，说明团队成员的责任和视角如何影响 AI 工作。","claimType":"single_source","sourcePerspective":"Dan Shipper","titleReview":{"id":"nov13-8","text":"Dan Shipper：同一模型下，团队的价值在选择与负责","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120539547620790424","quote":"I look at what I do with Fable 5.2 in the cracks of my week and think: this would've taken five people and $200,000.\n\nThen I look at what my team does with the same AI.\n\nLast week, between meetings, I analyzed our customer survey, made a game for our team, spotted an opportunity to sell @Every to teams, built a CRM, and started reaching out.\n\nLook at that and you might ask: Why would I need a team at all?\n\nThe chart seems to agree. On OpenAI's GDPval benchmark, AI went from beating human experts 12.4% of the time in 2024 to around 83% in 2026. That's the aggregate view of the future of work: gather a lot of data and extrapolate a trend line.\n\nBut the aggregate misses something. To see it, you have to get intimate: zoom in on one real situation, with all its messiness, and extrapolate from there.\n\nWe gave everyone at Every access to the same customer survey and the same AI models.\n\n• I found an opportunity to sell to teams.\n• @poojary_yash saw that first-time subscribers were churning because we send too much email.\n• @dabrundage noticed that many of our readers feel lonely: they're excited about AI, but people around them think they're crazy.\n• @jackcheng turned the results into a Claymation game show.\n\nCould you ask Claude to produce what each of them found? Maybe. But generating possibilities is cheap. Knowing which ones matter is hard.\n\n@hammer_mt ran an experiment to predict what I'd say in Slack. When Claude got 400 attempts, it produced an answer like mine 93% of the time. But when it had to rank its own answers, mine landed in its top 10% only around 60% of the time.\n\nEach person on a team is responsible for a different part of the world. That responsibility narrows where they look, and their perspective helps them decide what matters enough to act on. A team explores more possibilities than a single default prompt, and it can take responsibility for what it finds.\n\nThe obvious objection: models will get better at ranking. I think they will. But people aren't frozen while that happens. Comparing 2026 Yash with 2027 Claude misses that there will also be a 2027 Yash, with another year of experience, using 2027 Claude.\n\nAs models improve and spread, they raise the floor for everyone. The default answer becomes the baseline. The value is in using your perspective and responsibility to push past it.\n\nThat's why I think we need to change how we measure AI. Instead of only asking how well a model performs on problems everyone agrees are worth solving, ask: How good is it at doing my work, from my perspective?\n\nThe aggregate can show us the capability curve. The intimate helps us see what we might build, and who we might become, as we ride it.\n\nI presented this at Thesis: 2027. The full talk is on the Every podcast:"}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"},"evidence":[{"sourceId":"x:2120539547620790424","attribution":"Dan Shipper","quote":"But generating possibilities is cheap. Knowing which ones matter is hard.","translation":"生成可能性很便宜，判断哪些重要却很难。","url":"https://x.com/danshipper/status/2120539547620790424"}],"detail":{"sources":[{"sourceId":"x:2120539547620790424","blocks":[{"type":"paragraph","sentences":[{"id":"nov13-1","text":"Dan Shipper 回顾，自己在一周会议间隙用 AI 分析客户调查、为团队做游戏、发现向团队销售 Every 的机会，继而搭建 CRM 并开始联系客户；他把这些工作类比为过去五个人、约 20 万美元的投入，这不是一笔实际节省金额的核算。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120539547620790424","quote":"I look at what I do with Fable 5.2 in the cracks of my week and think: this would've taken five people and $200,000.\n\nThen I look at what my team does with the same AI.\n\nLast week, between meetings, I analyzed our customer survey, made a game for our team, spotted an opportunity to sell @Every to teams, built a CRM, and started reaching out."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-2","text":"他引用 GDPval 的汇总视角：按其转述，AI 战胜人类专家的比例从 2024 年的 12.4% 上升到 2026 年约 83%；但他认为，只沿趋势线推演会漏掉具体工作中的差异。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120539547620790424","quote":"The chart seems to agree. On OpenAI's GDPval benchmark, AI went from beating human experts 12.4% of the time in 2024 to around 83% in 2026. That's the aggregate view of the future of work: gather a lot of data and extrapolate a trend line.\n\nBut the aggregate misses something. To see it, you have to get intimate: zoom in on one real situation, with all its messiness, and extrapolate from there."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-team-a","text":"Every 把同一份调查和相同模型交给团队：Dan 看到团队销售机会，Yash 发现邮件过多与新订阅者流失有关。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120539547620790424","quote":"We gave everyone at Every access to the same customer survey and the same AI models.\n\n• I found an opportunity to sell to teams.\n• @poojary_yash saw that first-time subscribers were churning because we send too much email."}],"reviewNote":"逐项保留团队案例；原帖带冒号的列表项按原顺序展示，不补造新主题。"}]},{"type":"heading","text":"@dabrundage 发现许多读者感到孤独","originalHeading":"@dabrundage noticed that many of our readers feel lonely","review":{"id":"nov13-team-heading","text":"@dabrundage 发现许多读者感到孤独","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120539547620790424","quote":"@dabrundage noticed that many of our readers feel lonely"}],"reviewNote":"逐项保留团队案例；原帖带冒号的列表项按原顺序展示，不补造新主题。"}},{"type":"paragraph","sentences":[{"id":"nov13-team-b","text":"这些读者对 AI 兴奋，但周围人认为他们不正常；Jack 则把调查结果做成黏土动画风格的游戏节目。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120539547620790424","quote":"• @dabrundage noticed that many of our readers feel lonely: they're excited about AI, but people around them think they're crazy.\n• @jackcheng turned the results into a Claymation game show."}],"reviewNote":"逐项保留团队案例；原帖带冒号的列表项按原顺序展示，不补造新主题。"}]},{"type":"paragraph","sentences":[{"id":"nov13-4","text":"他不否认模型可能生成这些发现，但强调生成候选与选出重要候选是两回事：一次预测他 Slack 回复的实验，让 Claude 每题尝试 400 个答案时，93% 的情况下能生成类似他的回答；要求模型自排优先级时，他的回答仅约 60% 的情况下进入前 10%。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120539547620790424","quote":"Could you ask Claude to produce what each of them found? Maybe. But generating possibilities is cheap. Knowing which ones matter is hard.\n\n@hammer_mt ran an experiment to predict what I'd say in Slack. When Claude got 400 attempts, it produced an answer like mine 93% of the time. But when it had to rank its own answers, mine landed in its top 10% only around 60% of the time."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-5","text":"Dan 的解释是，团队成员各自承担不同责任，责任缩小搜索范围，个人视角帮助判断哪些发现值得行动；因此团队能探索比单个默认提示更广的可能性，并为结果负责。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120539547620790424","quote":"Each person on a team is responsible for a different part of the world. That responsibility narrows where they look, and their perspective helps them decide what matters enough to act on. A team explores more possibilities than a single default prompt, and it can take responsibility for what it finds."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-6","text":"他承认模型的排序能力会进步，但反对用停留在 2026 年的人与 2027 年模型比较：到时人也多了一年经验，并会使用新模型；当模型能力广泛普及时，默认答案成为基线，价值在于以个人视角与责任超越它。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120539547620790424","quote":"The obvious objection: models will get better at ranking. I think they will. But people aren't frozen while that happens. Comparing 2026 Yash with 2027 Claude misses that there will also be a 2027 Yash, with another year of experience, using 2027 Claude.\n\nAs models improve and spread, they raise the floor for everyone. The default answer becomes the baseline. The value is in using your perspective and responsibility to push past it."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-7","text":"因此，他建议评测除了测公认值得解决的问题，还应问模型能否从自己的视角做好自己的工作；汇总数据呈现能力曲线，具体实践则帮助人理解可以创造什么。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120539547620790424","quote":"That's why I think we need to change how we measure AI. Instead of only asking how well a model performs on problems everyone agrees are worth solving, ask: How good is it at doing my work, from my perspective?\n\nThe aggregate can show us the capability curve. The intimate helps us see what we might build, and who we might become, as we ride it."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]}],"coverageReview":{"details":"保留一周任务、五人和20万美元类比、GDPval数字、四位成员的不同产物、400/93%/60%实验以及未来人机比较。","limitations":"基准与实验均为作者转述，非本刊独立验证；团队案例不证明所有岗位永不被替代。","omissions":"省去会议宣传和反复设问；没有补充未采集的基准方法。"}}],"editorial":[{"id":"nov13-9","text":"这组案例区分了生成能力与行动选择：让模型列出很多答案，并不等于已经决定应当推进哪一个；作者把团队价值放在后者。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2120539547620790424","quote":"I look at what I do with Fable 5.2 in the cracks of my week and think: this would've taken five people and $200,000.\n\nThen I look at what my team does with the same AI.\n\nLast week, between meetings, I analyzed our customer survey, made a game for our team, spotted an opportunity to sell @Every to teams, built a CRM, and started reaching out.\n\nLook at that and you might ask: Why would I need a team at all?\n\nThe chart seems to agree. On OpenAI's GDPval benchmark, AI went from beating human experts 12.4% of the time in 2024 to around 83% in 2026. That's the aggregate view of the future of work: gather a lot of data and extrapolate a trend line.\n\nBut the aggregate misses something. To see it, you have to get intimate: zoom in on one real situation, with all its messiness, and extrapolate from there.\n\nWe gave everyone at Every access to the same customer survey and the same AI models.\n\n• I found an opportunity to sell to teams.\n• @poojary_yash saw that first-time subscribers were churning because we send too much email.\n• @dabrundage noticed that many of our readers feel lonely: they're excited about AI, but people around them think they're crazy.\n• @jackcheng turned the results into a Claymation game show.\n\nCould you ask Claude to produce what each of them found? Maybe. But generating possibilities is cheap. Knowing which ones matter is hard.\n\n@hammer_mt ran an experiment to predict what I'd say in Slack. When Claude got 400 attempts, it produced an answer like mine 93% of the time. But when it had to rank its own answers, mine landed in its top 10% only around 60% of the time.\n\nEach person on a team is responsible for a different part of the world. That responsibility narrows where they look, and their perspective helps them decide what matters enough to act on. A team explores more possibilities than a single default prompt, and it can take responsibility for what it finds.\n\nThe obvious objection: models will get better at ranking. I think they will. But people aren't frozen while that happens. Comparing 2026 Yash with 2027 Claude misses that there will also be a 2027 Yash, with another year of experience, using 2027 Claude.\n\nAs models improve and spread, they raise the floor for everyone. The default answer becomes the baseline. The value is in using your perspective and responsibility to push past it.\n\nThat's why I think we need to change how we measure AI. Instead of only asking how well a model performs on problems everyone agrees are worth solving, ask: How good is it at doing my work, from my perspective?\n\nThe aggregate can show us the capability curve. The intimate helps us see what we might build, and who we might become, as we ride it.\n\nI presented this at Thesis: 2027. The full talk is on the Every podcast:"}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]}},{"tag":"实践","title":"803 家公司清单观察：多模型与推理服务商占比上升","body":"Nikunj Kothari 从子处理者清单观察到多模型与推理服务商采用增加，并提醒清单滞后。","claimType":"single_source","sourcePerspective":"Nikunj Kothari","titleReview":{"id":"nov13-16","text":"803 家公司清单观察：多模型与推理服务商占比上升","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120669243918418237","quote":"I scraped 803 companies sub-processors to investigate what AI native companies are using for their infrastructure.. \n\nSome interesting findings from the last time I did this in March:\n\n> 44% of companies list two+ model providers (up from 33%). Small n, but Anthropic grew twice as fast as OpenAI. \n\n> 86 pairs where each company names the other as a subprocessor (@AnthropicAI + @Cloudflare, @vercel + @spacexai)\n\n> 33% of companies list an inference provider (up from 22%). @modal continues to crush. \n\n> Chinese models are primarily coming through video (think Bytedance) rather than text (at least on the subprocessor lists)\n\n> @typesafeai is the breakout hit, going from 0 to many companies in a short period. \n\nCaveat: subprocessor lists tend to be a lagging indicator, but a sure shot way of knowing if the company is using something. \n\nYou can find all the updated data, design and insights at deploygraph dot com. Feedback welcome!"}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"},"evidence":[{"sourceId":"x:2120669243918418237","attribution":"Nikunj Kothari","quote":"Caveat: subprocessor lists tend to be a lagging indicator, but a sure shot way  short period. \n\nCaveat: subprocessor lists tend to be a lagging indicator, but a sure shot way of knowing if the company is using something. \n\nYou can find all the updated data, design and insights at deploygraph dot com. Feedback welcome!"}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]}},{"tag":"实践","title":"Aditya Agarwal 区分 AI 扩散与科学前沿创业","body":"Aditya Agarwal 区分贴近业务工作的 AI 扩散，以及通过科学进展形成产品的创业路线。","claimType":"single_source","sourcePerspective":"Aditya Agarwal","titleReview":{"id":"nov13-25","text":"Aditya Agarwal 区分 AI 扩散与科学前沿创业","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120578134177464356","quote":"There are basically two kinds of companies to build right now.\n\n1. Diffusion of AI\nThis is the \"vertical SaaS\" of today. There are a bunch of different models for it (FDE company, rollup, horizontal product) but ultimately it all boils down to the same thing: get AI diffused very close to where the work is being done.\n\nProfound, Cognition, Harvey etc. A lot of great companies will get built here.\n\n2. Frontier of AI\nThis is where the really interesting action is. Use AI to accelerate scientific progress, then build products from that progress.\n\nIt is a harder category to see. But we are seeing a lot more of it at @spc:\n\n- Externa is adding hundreds of new chemical building blocks to proteins, so you can engineer a drug to match the disease instead of settling for what nature gave you.\n\n- Epana Bio is using genomics and AI to design autoimmune therapies that go after the cellular origin of the disease.\n\n- VenomicsAI is doing AI-accelerated drug discovery from venoms.\n\n- Equivariant is doing multi-physics modeling for the semiconductor industry.\n\n(There are always picks-and-shovels for AI as well. Lots of amazing companies in that category.)\n\nCategory 2 is not well understood or much talked about externally. It should be because I think that is where the vast majority of model driven returns will come from."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"},"evidence":[{"sourceId":"x:2120578134177464356","attribution":"Aditya Agarwal","quote":"Use AI to accelerate scientific progress, then build products from that progress.","translation":"用 AI 加速科学进展，再从这些进展中构建产品。","url":"https://x.com/adityaag/status/2120578134177464356"}],"detail":{"sources":[{"sourceId":"x:2120578134177464356","blocks":[{"type":"paragraph","sentences":[{"id":"nov13-18","text":"Aditya Agarwal 把当前 AI 创业大体分为两个方向：将 AI 扩散到工作现场，以及利用 AI 推进科学前沿。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120578134177464356","quote":"There are basically two kinds of companies to build right now.\n\n1. Diffusion of AI\nThis is the \"vertical SaaS\" of today. There are a bunch of different models for it (FDE company, rollup, horizontal product) but ultimately it all boils down to the same thing: get AI diffused very close to where the work is being done.\n\nProfound, Cognition, Harvey etc. A lot of great companies will get built here.\n\n2. Frontier of AI\nThis is where the really interesting action is. Use AI to accelerate scientific progress, then build products from that progress.\n\nIt is a harder category to see. But we are seeing a lot more of it at @spc:\n\n- Externa is adding hundreds of new chemical building blocks to proteins, so you can engineer a drug to match the disease instead of settling for what nature gave you.\n\n- Epana Bio is using genomics and AI to design autoimmune therapies that go after the cellular origin of the disease.\n\n- VenomicsAI is doing AI-accelerated drug discovery from venoms.\n\n- Equivariant is doing multi-physics modeling for the semiconductor industry.\n\n(There are always picks-and-shovels for AI as well. Lots of amazing companies in that category.)\n\nCategory 2 is not well understood or much talked about externally. It should be because I think that is where the vast majority of model driven returns will come from."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-19","text":"第一类是“AI 的扩散”：类似今天的垂直 SaaS，可以采取 FDE 公司、收购整合或横向产品等形式，核心是把 AI 带到实际工作发生的位置；他列举 Profound、Cognition 和 Harvey。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120578134177464356","quote":"1. Diffusion of AI\nThis is the \"vertical SaaS\" of today. There are a bunch of different models for it (FDE company, rollup, horizontal product) but ultimately it all boils down to the same thing: get AI diffused very close to where the work is being done.\n\nProfound, Cognition, Harvey etc. A lot of great companies will get built here."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-20","text":"第二类是“AI 的前沿”：先用 AI 加速科学进展，再把进展转为产品；他认为这一类更难被外界看见，却在 SPC 看到更多案例。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120578134177464356","quote":"2. Frontier of AI\nThis is where the really interesting action is. Use AI to accelerate scientific progress, then build products from that progress.\n\nIt is a harder category to see. But we are seeing a lot more of it at @spc:"}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-21","text":"他列举 Externa 为蛋白质增加数百种新的化学构件，以便按疾病需求设计药物，而非只接受天然已有的构件。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120578134177464356","quote":"- Externa is adding hundreds of new chemical building blocks to proteins, so you can engineer a drug to match the disease instead of settling for what nature gave you."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-22","text":"Epana Bio 的方向是结合基因组学与 AI，设计针对疾病细胞起源的自身免疫疗法；VenomicsAI 则从毒液出发做 AI 加速药物发现。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120578134177464356","quote":"- Epana Bio is using genomics and AI to design autoimmune therapies that go after the cellular origin of the disease.\n\n- VenomicsAI is doing AI-accelerated drug discovery from venoms."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-23","text":"Equivariant 为半导体行业做多物理场建模；此外，他也认可为 AI 提供工具和基础设施的公司这一类别。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120578134177464356","quote":"- Equivariant is doing multi-physics modeling for the semiconductor industry.\n\n(There are always picks-and-shovels for AI as well. Lots of amazing companies in that category.)"}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-24","text":"他判断第二类尚未得到充分理解和讨论，并预计绝大多数模型驱动的回报会来自这里；这是投资判断，不是上述项目已经取得的收益或临床效果。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120578134177464356","quote":"Category 2 is not well understood or much talked about externally. It should be because I think that is where the vast majority of model driven returns will come from."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]}],"coverageReview":{"details":"保留两种分类及原始顺序、FDE/收购整合/横向产品、三个扩散案例、四个科学案例与工具基础设施补充。","limitations":"项目方向按作者描述整理，不暗示药效验证、商业成功或投资回报已实现。","omissions":"省去强调兴奋程度的修辞，不补项目外链或研究数据。"}}],"editorial":[{"id":"nov13-26","text":"两条路线的区分在于产品从哪里来：一条把 AI 带入已有工作，一条先推动科学进展再形成产品；作者对后者回报的判断仍属于预期。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2120578134177464356","quote":"There are basically two kinds of companies to build right now.\n\n1. Diffusion of AI\nThis is the \"vertical SaaS\" of today. There are a bunch of different models for it (FDE company, rollup, horizontal product) but ultimately it all boils down to the same thing: get AI diffused very close to where the work is being done.\n\nProfound, Cognition, Harvey etc. A lot of great companies will get built here.\n\n2. Frontier of AI\nThis is where the really interesting action is. Use AI to accelerate scientific progress, then build products from that progress.\n\nIt is a harder category to see. But we are seeing a lot more of it at @spc:\n\n- Externa is adding hundreds of new chemical building blocks to proteins, so you can engineer a drug to match the disease instead of settling for what nature gave you.\n\n- Epana Bio is using genomics and AI to design autoimmune therapies that go after the cellular origin of the disease.\n\n- VenomicsAI is doing AI-accelerated drug discovery from venoms.\n\n- Equivariant is doing multi-physics modeling for the semiconductor industry.\n\n(There are always picks-and-shovels for AI as well. Lots of amazing companies in that category.)\n\nCategory 2 is not well understood or much talked about externally. It should be because I think that is where the vast majority of model driven returns will come from."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]}}],"matters":[{"kind":"产品","title":"Tabletop 把共享资料变成可操作的活动空间","detail":"Google Labs 发布 Tabletop 实验：将链接和文件放入共享空间、邀请同伴，再按需生成旅行地图、晚餐决策转盘、匹克球对阵表、周边投票或可拖拽座位图。候补名单目前限美国、18 岁以上用户。","sourceId":"x:2120549258692882702","url":"https://x.com/GoogleLabs/status/2120549258692882702"},{"kind":"创作","title":"Mariko Mori 用 Claude 编码制作展览动画","detail":"Claude 官方介绍，艺术家 Mariko Mori 在回顾展“All That Shines”中，使用 Claude 编写计算机生成动画的代码，并将其作为新的视频装置呈现；原帖未提供制作流程或效果评测。","sourceId":"x:2120669165316915259","url":"https://x.com/claudeai/status/2120669165316915259"},{"kind":"工程","title":"fx 启动基准对照高度优化的纯汇编版本","detail":"Guillermo Rauch 介绍，团队用一个高度优化的纯汇编 fx.s 版本与 fx 启动过程做基准对比。采集文字未给出耗时或胜负，不据此声称性能提升。","sourceId":"x:2120598652825809186","url":"https://x.com/rauchg/status/2120598652825809186","images":[{"src":"assets/digest/2026-11-13/19ef3a66e24c6fb8d77f7815.jpg","originalUrl":"https://pbs.twimg.com/media/HW3hFeAa4AAw_Rd.jpg","sourceUrl":"https://x.com/rauchg/status/2120598652825809186","attribution":"Guillermo Rauch","sha256":"5e0f074b2a0fb16249f05e21272d9f02923fc35e73631055e48a7776c8e08893","width":1199,"height":711,"mediaId":"19ef3a66e24c6fb8d77f7815","alt":"fx.s 纯汇编启动对照程序的代码片段与注释。"}]},{"kind":"实践","title":"Rauch 提醒产品工作仍需要人的专注与投入","detail":"Guillermo Rauch 强调，创造出色产品仍需要大量人类专注、努力、动力、热爱及持续注意力；这是产品实践立场，不是可量化的生产率结论。","sourceId":"x:2120601000176439478","url":"https://x.com/rauchg/status/2120601000176439478"}],"articles":{"blogs":[],"podcasts":[{"title":"自动化之后，团队如何把 AI 的可能性变成行动","sourceTitle":"A New Vision for Human Work After Automation","sourceId":"flightcast:01M717KBM0K828PAMMP3ZPWV8P","sourceUrl":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL","sourceName":"AI & I by Every","author":"Dan Shipper","publishedAt":"2026-11-11T15:30:00.000Z","linkScope":"playlist","sourceTextSha256":"bcf3a64887721bcbd21131f25a37a03bb6c9df49544daf4537eff9854650d1c4","blocks":[{"type":"paragraph","text":"在 Every 的这场演讲中，Dan Shipper 回答的问题不是模型还能完成多少任务，而是自动化之后，人怎样继续做出有价值的工作。他提出两种观察未来的方式：汇集大量数据、延长趋势线，或走近一个真实案例，理解其中交错的责任、经验和选择。前者显示能力进步，后者帮助看清人如何使用这些能力。"},{"type":"heading","text":"能力曲线为何会动摇人的工作认同"},{"type":"paragraph","text":"Dan 先解释 GDPval：专家从真实工作中选任务并写成详细提示，让模型与不使用 AI 的人分别完成，再由专家盲评。按演讲中的转述，AI 胜出比例由 2024 年的 12.4%，经 2025 年的 47.6%，上升到 2026 年约 83%。这些是他用来说明趋势的数字，并非本篇独立核实的基准结果；他关于基准可能已经饱和的说法也是个人判断。"},{"type":"paragraph","text":"他自己的经历让这条曲线变得具体。一周的会议间隙，他分析季度客户调查，制作让同事比拼客户理解的实时游戏，发现向团队销售 Every 的机会，接着搭建 CRM 并联系客户。他把这些任务对应到过去的数据科学、游戏开发、产品营销、工程和销售拓展工作，估计相当于五个人、约 20 万美元的投入；这是帮助理解能力变化的类比，不是实际成本审计。"},{"type":"paragraph","text":"当人把身份与工作内容联系起来，看见模型做出相似成果，就可能感到自身价值被动摇。Dan 称之为行动主体感的断裂，但不认为汇总曲线足以回答所有问题。他回顾自己在 2022 年使用 GPT-3 的感受：亲手使用让他看到的，不只是岗位替代，也包括个体未来获得类似团队规模的能力。"},{"type":"heading","text":"同一份调查，为什么仍需要一个团队"},{"type":"paragraph","text":"问题随后回到 Every：如果自己已能指挥 agent 完成这么多工作，为什么公司仍有约三十人的团队？他把同一份季度调查开放给同事，大家也能使用相同模型，但结果不是一组默认答案的复制。"},{"type":"paragraph","text":"Dan 找到团队销售机会，增长工程师 Yash 关注到首月订阅者因邮件太多而流失，营销负责人 Douglas 看见读者的孤独感——他们热爱 AI，身边人却往往不理解；资深编辑 Jack 把调查做成黏土动画风格的问答节目。默认提示下，Claude 也能指出写作、产品组合和信息量的问题，Dan 并不否认这些见解成立，但认为人人都能得到的默认答案不再稀缺。"},{"type":"paragraph","text":"这些分析还发生在筹备会议的繁忙期间。Yash 不只提出问题，还写了修改代码的 PR，同时参与直播体验建设。Dan 借此强调，价值不止是说出一条见解，还包括把注意力放到具体责任上，并推动行动。"},{"type":"heading","text":"生成候选与挑选答案不是同一件事"},{"type":"paragraph","text":"他预先回应了一个反问：能不能直接提示 Claude，让它生成同事会提出的想法？团队评测负责人 Mike Taylor 做过预测 Dan 的 Slack 回复的实验。每题允许模型给出 400 个答案时，约 93% 的情况下其中包含类似 Dan 的回答；但让模型自己排序，Dan 的答案只有约 60% 的情况下进入前 10%。这说明的是这次实验里的候选覆盖与排序差异，而非所有模型和任务的通用成功率。"},{"type":"paragraph","text":"Dan 将其归纳为：生成变便宜，筛选仍困难。每个人在团队中的责任先缩小搜索范围，再由自己的经验与视角挑出值得推进的发现。一个团队因此能沿不同方向探索同一份材料，并有人对选中的方向负责；这与只向模型问一句“你看到了什么”不同。"},{"type":"heading","text":"比较未来模型时，不应把人冻结在过去"},{"type":"paragraph","text":"Dan 承认，模型的排序能力很可能继续提高。但他认为，用 2027 年的模型对比停留在 2026 年的 Yash，本身就不完整：未来的 Yash 也会积累新经验、使用新模型。即使另一边是持续运行的 agent，也有人决定如何启动和组织它。"},{"type":"paragraph","text":"于是，他真正想比较的是带着经验与责任使用模型的人，以及默认配置下的模型。当先进能力普及，默认答案会成为新的底线；独特视角带来的优势也可能被下一代能力吸收，但使用者同样可以继续学习和利用新能力。这是一种关于工作未来的解释，不构成所有职业都不会被替代的证明。"},{"type":"heading","text":"从掌握答案转向分配智能与检验结果"},{"type":"paragraph","text":"他把这种工作方式称为 allocation economy：人不只靠知道多少东西被评价，还要能够分配智能资源，安排模型工作，并确保结果完成得好。由此，他建议改变部分评测问题：除了问模型是否擅长大家都认可、容易验证的数学或编程题，也要问它能否从自己的视角完成自己的工作。"},{"type":"paragraph","text":"这不是否认能力基准，而是补足其观察范围。汇总指标说明共同能力如何上升，深入具体实践则展示人在新能力之上能建造什么、承担什么责任，以及自身怎样变化。演讲最终落回同一个观点：模型进步可以是被人使用的资源，而人的视角与行动仍需要在真实工作里检验。"}]}]},"quality":{"collected":33,"collectedTweets":32,"used":8,"usedTweets":7,"uniqueAuthors":7,"imageCount":1,"claimAudit":{"reviewMode":"editorial review plus structural checks; not automated proof of meaning","claimsReviewed":28,"warnings":[]},"status":"degraded","warnings":["Media unverified: podcasts:flightcast:01M717KBM0K828PAMMP3ZPWV8P (feed_has_no_media_or_supported_post_locator)","Media unverified: x:2120601000176439478 (budget_exhausted)"]},"contentSchemaVersion":2,"sourceSnapshotSha256":"7cf57214358720d3ee8c6d04f4bae7164295c938d5a40a3c914a2a682f859c85","selection":{"sources":[{"sourceId":"x:2120640864787841513","decision":"excluded","reason":"活动实况、节目预告或身份澄清，未包含可展开的构建实践。"},{"sourceId":"x:2120640558184206508","decision":"excluded","reason":"活动实况、节目预告或身份澄清，未包含可展开的构建实践。"},{"sourceId":"x:2120582147107078356","decision":"excluded","reason":"活动实况、节目预告或身份澄清，未包含可展开的构建实践。"},{"sourceId":"x:212  cheating is appalling but that's different from getting fired over it. Before the board takes action they should do a proper investigation and involve shareholders in the decision. There's no denying that Jensen built a generational company.","createdAt":"2026-11-12T03:53:34.000Z","url":"https://x.com/petergyang/status/2120726673452933269","likes":19,"retweets":0,"replies":3},{"text":"Man I am so disappointed in Jensen. So many people looked up to him including me. The story of rising from a dishwasher and waiter to the CEO of the most valuable company in the world. The story of a 41-year marriage to his college sweetheart. What the hell happened man? And of all the people to have affairs with you have to choose a spy and a freakin' NVIDIA executive? Come on dude.","createdAt":"2026-11-11T22:45:31.000Z","url":"https://x.com/petergyang/status/2120649149389627493","likes":2019,"retweets":102,"replies":728},{"text":"Come on dude this is too much","createdAt":"2026-11-11T22:31:09.000Z","url":"https://x.com/petergyang/status/2120645533689905269","likes":52,"retweets":0,"replies":8}]},{"name":"Thariq","handle":"trq212","bio":"playing WoW forever, formerly Claude Code @anthropicai","tweets":[{"text":"it’s about how I think the experience of using coding agents could be like next year and how we get to shape it","createdAt":"2026-11-11T20:54:07.000Z","url":"https://x.com/trq212/status/2120621112807866620","likes":117,"retweets":0,"replies":8},{"text":"Swyx gave me the “closing keynote” of AIE code, aka everyone is tired or flying out so if you’re not one of those please come to mine tomorrow at 5pm it’s called “the sweet side of the bitter lesson”","createdAt":"2026-11-11T20:53:16.000Z","url":"https://x.com/trq212/status/2120620900785820143","likes":1242,"retweets":21,"replies":81}]},{"name":"Google Labs","handle":"GoogleLabs","bio":"Google’s home for our latest AI tools and experiments.","tweets":[{"text":"Want to see how our team actually uses Tabletop? 👀 Founding engineer @romannurik gave us a tour of his family’s space— showing how Tabletop can be as useful, quirky, or wonderfully specific as you want it to be: 🪙 Interactive chore charts & piggy banks 🔍 Rainy-day scavenger hunt with live score tracking 🗺️ On-the-whim LEGO maps 🧝‍♀️ Fantasy book-themed NYC trip Pull up a chair and join the waitlist (US, 18+):","createdAt":"2026-11-11T19:12:06.000Z","url":"https://x.com/GoogleLabs/status/2120595442782368240","likes":100,"retweets":12,"replies":8},{"text":"🚨 NEW LABS EXPERIMENT 🚨 Introducing Tabletop 🎲— our newest experiment built to get your crew from \"we should totally do that\" to \"we’re actually doing this.\" Drop links and files into one shared space, add your crew, and ask Tabletop for whatever you need to create custom spaces on the fly: 🗺️ Interactive road trip maps & dinner-decider wheels 🏆 Live pickleball brackets & merch voting boards 🪑 Drag-and-drop seating charts (so you don’t get stuck next to your boss) Pull up a chair and join the waitlist (US, 18+):","createdAt":"2026-11-11T16:08:35.000Z","url":"https://x.com/GoogleLabs/status/2120549258692882702","likes":1113,"retweets":93,"replies":43}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Why are old stories that were not even covered up all that well become sudden international and geopolitical news? The timing is suspicious, so worth asking: who benefits and why now? If Jensen, the premier champion of open models, is taken out then anyone who wants AI closed, centralized, and controlled might benefit. Why now? The midterms seem relevant. But also perhaps the upcoming IPOs.","createdAt":"2026-11-12T00:15:41.000Z","url":"https://x.com/amasad/status/2120671838909194695","likes":3430,"retweets":389,"replies":183}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"PSA: creating wonderful products still requires extraordinary amounts of human focus, effort, motivation, and love. And an att ng repel Tons of gems for any founder 👇","createdAt":"2026-11-11T14:22:46.000Z","url":"https://x.com/mattturck/status/2120522625697116287","likes":30,"retweets":1,"replies":3}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Harvard’17. Instagram: GitHub:","tweets":[{"text":"\"Technology only finishes its most important work once the audience forgets the technology\"","createdAt":"2026-11-11T08:14:35.000Z","url":"https://x.com/zarazhangrui/status/2120429971718156375","likes":49,"retweets":2,"replies":7}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"@grok can you transcribe the message here?","createdAt":"2026-11-12T06:05:44.000Z","url":"https://x.com/nikunj/status/2120759932370944188","likes":1,"retweets":0,"replies":1},{"text":"RFS (request for startups) from a stealth portfolio founder.. I really like all of these ideas. If you are working on any of these, please DM me!","createdAt":"2026-11-12T05:45:00.000Z","url":"https://x.com/nikunj/status/2120754714296172923","likes":15,"retweets":0,"replies":3},{"text":"I scraped 803 companies sub-processors to investigate what AI native companies are using for their infrastructure.. Some interesting findings from the last time I did this in March: > 44% of companies list two+ model providers (up from 33%). Small n, but Anthropic grew twice as fast as OpenAI. > 86 pairs where each company names the other as a subprocessor (@AnthropicAI + @Cloudflare, @vercel + @spacexai) > 33% of companies list an inference provider (up from 22%). @modal continues to crush. > Chinese models are primarily coming through video (think Bytedance) rather than text (at least on the subprocessor lists) > @typesafeai is the breakout hit, going from 0 to many companies in a short p…","createdAt":"2026-11-12T00:05:22.000Z","url":"https://x.com/nikunj/status/2120669243918418237","likes":32,"retweets":1,"replies":13}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"reading some of these comments makes my brain hurt. oss is already hard enough without politics.","createdAt":"2026-11-12T02:52:21.000Z","url":"https://x.com/steipete/status/2120711266759258616","likes":309,"retweets":10,"replies":19}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"I look at what I do with Fable 5.2 in the cracks of my week and think: this would've taken five people and $200,000. Then I look at what my team does with the same AI. Last week, between meetings, I analyzed our customer survey, made a game for our team, spotted an opportunity to sell @Every to teams, built a CRM, and started reaching out. Look at that and you might ask: Why would I need a team at all? The chart seems to agree. On OpenAI's GDPval benchmark, AI went from beating human experts 12.4% of the time in 2024 to around 83% in 2026. That's the aggregate view of the future of work: gather a lot of data and extrapolate a trend line. But the aggregate misses something. To see it, you ha…","createdAt":"2026-11-11T15:30:00.000Z","url":"https://x.com/danshipper/status/2120539547620790424","likes":118,"retweets":13,"replies":42},{"text":"this week @every","createdAt":"2026-11-11T15:16:09.000Z","url":"https://x.com/danshipper/status/2120536060413268386","likes":14,"retweets":1,"replies":0}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"It has been such a pleasure to partner with Rox from the earliest days. I have also learnt a lot about what it means to run a company at AI-pace from @ishanmkh. His talk at our recent founder retreat was incredible.","createdAt":"2026-11-11T21:02:56.000Z","url":"https://x.com/adityaag/status/2120623334555791504","likes":26,"retweets":3,"replies":0},{"text":"There are basically two kinds of companies to build right now. 1. Diffusion of AI This is the \"vertical SaaS\" of today. There are a bunch of different models for it (FDE company, rollup, horizontal product) but ultimately it all boils down to the same thing: get AI diffused very close to where the work is being done. Profound, Cognition, Harvey etc. A lot of great companies will get built here. 2. Frontier of AI This is where the really interesting action is. Use AI to accelerate scientific progress, then build products from that progress. It is a harder category to see. But we are seeing a lot more of it at @spc: - Externa is adding hundreds of new chemical building blocks to proteins, so…","createdAt":"2026-11-11T18:03:20.000Z","url":"https://x.com/adityaag/status/2120578134177464356","likes":240,"retweets":25,"replies":21}]},{"name":"Claude","handle":"claudeai","bio":"Claude is an AI assistant built by @anthropicai to be safe, accurate, and secure. Talk to Claude on or download the app.","tweets":[{"text":"Mariko Mori has pushed the boundaries of art for three decades. For her retrospective \"All That Shines,\" she used Claude to write code for a computer-generated animation, presented as a new video installation.","createdAt":"2026-11-12T00:05:03.000Z","url":"https://x.com/claudeai/status/2120669165316915259","likes":3408,"retweets":206,"replies":183}]}]},"errors":[],"partial":false},{"date":"2026-11-12","dateLabel":"2026年11月12日","generatedAt":"2026-11-12T00:00:00+08:00","sourceGeneratedAt":"2026-11-11T06:28:17.628Z","stats":{"podcastEpisodes":1,"xBuilders":15,"totalTweets":32,"blogPosts":0},"highlights":[{"tag":"实践","title":"Dan Shipper 试用 Carbon：编程进步明显，写作暂不换用","body":"Dan Shipper 的首日试用显示 Carbon 更适合大型编程和音视频任务，但仍需明确终点与人工审阅。","claimType":"single_source","sourcePerspective":"Dan Shipper","titleReview":{"id":"nov12-19","text":"Dan Shipper 试用 Carbon：编程进步明显，写作暂不换用","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120187507396530309","quote":"BREAKING:\n\n@Google just dropped Gemini 4 Carbon. It’s a much better coder than Argon—but I’m probably keeping Argon for writing.\n\nWe’ve been testing it at @every across coding, writing, design, and knowledge work. It can work for hours on an ambitious project, but it doesn’t always know when to stop.\n\nHere’s your day-zero vibe check:\n\n• Coding: On one run of our Senior Engineer benchmark, Carbon scored 44%, versus Argon’s 21%. A big improvement, though still middle of the pack. In a separate test, @hammer_mt gave it a backlog to work through. It identified 6 tasks as ready, then did 15—including work someone else was already doing. He stopped it after almost 4.5 hours.\n\n• Big builds: @RandyCounsman gave it 3D scans of our podcast studio and an equipment list. In one attempt, it built a browser-based model accurate enough to check whether new gear would fit without getting into the shot. He estimates Carbon also wrote about 95% of a big update to Everycut, our internal video editor.\n\n• Code quality: @kieranklaassen values its tests and documentation on large projects, including its record of approaches it considered and rejected. Fable remains his first choice, but Carbon has earned a place alongside it. The catch: It can produce huge files where Fable keeps things more modular.\n\n• Audio and video: Randy found it caught audio editing issues other models missed. Kieran handed it a recorded meeting and asked for shorts. It came back with 6 titled clips.\n\n• Design: @jackcheng got a hyperrealistic ginkgo-leaf app icon with details other models struggle with. Objects and 3D scenes look better than Argon’s. Interfaces split the team: Jack and Randy kept getting boxes within boxes, while @TylerNishida liked its ideas for new interfaces. Kieran says giving it design guidance makes a big difference.\n\n• Writing: Our editorial benchmark put Carbon and Argon about even. If you like Argon, you’ll probably like Carbon. But Carbon costs more, and I haven’t seen enough improvement to justify switching.\n\nMy Reach Test: 🟨 I’ll use it sometimes.\n\nGive it one big job with a clear finish line, and review what comes back. It’s also worth trying as a second opinion, especially on audio and video.\n\nFull vibe check coming soon: https://t.co/Ch2pNl9Po5"}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"},"evidence":[{"sourceId":"x:2120187507396530309","quote":"Give it one big job with a clear finish line, and review what comes back.","translation":"给它一项终点明确的大任务，并审阅返回的结果。","attribution":"Dan Shipper","url":"https://x.com/danshipper/status/2120187507396530309"}],"detail":{"sources":[{"sourceId":"x:2120187507396530309","blocks":[{"type":"paragraph","sentences":[{"id":"nov12-1","text":"Dan Shipper 的首日试用判断是：Carbon 编程能力明显优于 Argon，但写作仍倾向保留 Argon；Every 团队跨编程、写作、设计和知识工作测试，发现它能持续工作数小时，却不总能自行停下。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120187507396530309","quote":"BREAKING:\n\n@Google just dropped Gemini 4 Carbon. It’s a much better coder than Argon—but I’m probably keeping Argon for writing.\n\nWe’ve been testing it at @every across coding, writing, design, and knowledge work. It can work for hours on an ambitious project, but it doesn’t always know when to stop.\n\n"}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]},{"type":"heading","text":"编程","originalHeading":"Coding","review":{"id":"nov12-2","text":"编程","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120187507396530309","quote":"• Coding: On one run of our Senior Engineer benchmark, Carbon scored 44%, versus Argon’s 21%. A big improvement, though still middle of the pack. In a separate test, @hammer_mt gave it a backlog to work through. It identified 6 tasks as ready, then did 15—including work someone else was already doing. He stoppe
