es":[{"sourceId":"x:2125102190196859156","blocks":[{"type":"paragraph","sentences":[{"id":"nov25-10","text":"Madhu Guru 认为“数据”这个名称低估了它在模型开发中的真正作用。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2125102190196859156","quote":"Part of the disconnect is that the name “data” massively undersells what it truly represents in model development."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov25-11","text":"他指出，不贴近模型开发的人容易把数据想成煤一样的被动商品，买来后直接灌进模型。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2125102190196859156","quote":"People who are not close to model development think of data as this  inert commodity you buy and shovel into a model, like coal."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov25-12","text":"但在他看来，优质数据编码了高价值知识、品味和专长，而且常以此前未曾存在的方式表达和组织。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2125102190196859156","quote":"In reality great data encodes incredibly high value knowledge, taste and expertise, often articulated and structured in ways that did not exist previously. "}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov25-13","text":"因此，他把数据视为跨领域提升智能的基础构件之一，并判断它会继续处于智能产业的核心。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2125102190196859156","quote":"This makes it one of THE fundamental building blocks for creating increasingly capable intelligence across domains. \n\nData will continue to be incredibly central to the intelligence industry ."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]}],"coverageReview":{"details":"按原文顺序保留名称误导、煤的类比、知识品味专业能力、表达组织及跨领域作用。","limitations":"个人判断，没有数据集对比、因果实验或成本数据。","omissions":"被引上下文未采集，不补具体案例。"}}],"editorial":[{"id":"nov25-14","text":"这段观点强调的不只是数据量，而是其中的知识如何被表达与组织；把数据采购等同于简单买原料，会遗漏作者所强调的专业价值，但原帖没有给出衡量这种价值的方法。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2125102190196859156","quote":"Part of the disconnect is that the name “data” massively undersells what it truly represents in model development.\n\nPeople who are not close to model development think of data as this  inert commodity you buy and shovel into a model, like coal.\n\nIn reality great data encodes incredibly high value knowledge, taste and expertise, often articulated and structured in ways that did not exist previously. \n\nThis makes it one of THE fundamental building blocks for creating increasingly capable intelligence across domains. \n\nData will continue to be incredibly central to the intelligence industry ."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]}},{"tag":"实践","title":"Aaron Levie：服务业可以扩大 agent 产出，但仍需要专家把关结果","body":"Aaron Levie：Aaron Levie 认为服务企业长期受到交付能力限制：规模主要随人员增长，而人才总量有限，客户又希望更快、更便宜或质量更高。","claimType":"single_source","sourcePerspective":"Aaron Levie","titleReview":{"id":"nov25-15","text":"Aaron Levie：服务业可以扩大 agent 产出，但仍需要专家把关结果","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2125089009018040779","quote":"This is a pretty key insight. Services businesses are always held back by their ability to deliver outcomes to customers. \n\nThat scaling essentially only could come from headcount, and no matter how much demand you saw, there was always a finite amount of talent you could get for the problem you were going after. Not to mention, the customer generally always wants the work done faster, at a lower price, or at a higher quality.\n\nAgents entirely change the calculus here, because now we can scale output in a way that’s decoupled from the among of time that goes in. A single engineer can have the output of dozens of engineers before. A single designer can probably build out your entire design system and brand. And so on.\n\nWell why isn’t this just all agents then? Because the key is to still have experts on the front end that actually can ensure the right outcomes are delivered from agents.\n\nIt’s likely that we’re going to see this in a wide variety of categories. You’ll see this in cyber security, advertising and marketing, legal, accounting, IT transformation, and a number of other historically people-only services industries.\n\nIt’s a great time if you’re starting one of these businesses, or if you have the capability to transform an existing one."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"},"evidence":[{"sourceId":"x:2125089009018040779","quote":"Because the key is to still have experts on the front end that actually can ensure the right outcomes are delivered from agents.","translation":"因为关键仍是让专家处在前端，真正确保 agent 交付正确的结果。","attribution":"Aaron Levie","url":"https://x.com/levie/status/2125089009018040779"}],"detail":{"sources":[{"sourceId":"x:2125089009018040779","blocks":[{"type":"paragraph","sentences":[{"id":"nov25-16","text":"Aaron Levie 认为服务企业长期受到交付能力限制：规模主要随人员增长，而人才总量有限，客户又希望更快、更便宜或质量更高。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2125089009018040779","quote":"This is a pretty key insight. Services businesses are always held back by their ability to deliver outcomes to customers. \n\nThat scaling essentially only could come from headcount, and no matter how much demand you saw, there was always a finite amount of talent you could get for the problem you were going after. Not to mention, the customer generally always wants the work done faster, at a lower price, or at a higher quality."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov25-17","text":"他判断 agent 可以让产出增长不再与投入时间一一对应，并以一个工程师可能达到过去数十人的产出、一个设计师可能完成整套设计系统与品牌为例。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2125089009018040779","quote":"Agents entirely change the calculus here, because now we can scale output in a way that’s decoupled from the among of time that goes in. A single engineer can have the output of dozens of engin ytes":113639,"checkedAt":"2026-11-25T01:08:29.374Z"},{"id":"1ca3846d80e1dbe5222702f7","sourceId":"x:2124915267864301581","originalUrl":"https://pbs.twimg.com/media/HX03LIHbEAEjSGM.jpg","sourceUrl":"https://x.com/nikunj/status/2124915267864301581","attribution":"Nikunj Kothari","method":"official_syndication","suggestedAlt":"","width":715,"height":1200,"src":"assets/digest/2026-11-25/1ca3846d80e1dbe5222702f7.jpg","cacheKey":"1ca3846d80e1dbe5222702f7.jpg","sha256":"3ebc0c0401f6f19afb971c6d4628701ea4cf38c8a4e53f1249246d78f105e50d","bytes":121322,"checkedAt":"2026-11-25T01:08:29.374Z"}],"contextIncomplete":false},{"sourceId":"x:2124874329238466842","sourceUrl":"https://x.com/nikunj/status/2124874329238466842","status":"no_image","reason":"official_post_has_no_photo","candidates":[],"contextIncomplete":true},{"sourceId":"x:2124896430783447510","sourceUrl":"https://x.com/danshipper/status/2124896430783447510","status":"no_image","reason":"official_post_has_no_photo","candidates":[],"contextIncomplete":false},{"sourceId":"x:2124886826909622653","sourceUrl":"https://x.com/danshipper/status/2124886826909622653","status":"no_image","reason":"official_post_has_no_photo","candidates":[],"contextIncomplete":true},{"sourceId":"x:2124947675913367832","sourceUrl":"https://x.com/adityaag/status/2124947675913367832","status":"no_image","reason":"official_post_has_no_photo","candidates":[],"contextIncomplete":true},{"sourceId":"x:2124894264564092952","sourceUrl":"https://x.com/sama/status/2124894264564092952","status":"no_image","reason":"official_post_has_no_photo","candidates":[],"contextIncomplete":true},{"sourceId":"x:2124887162206495228","sourceUrl":"https://x.com/sama/status/2124887162206495228","status":"no_image","reason":"official_post_has_no_photo","candidates":[],"contextIncomplete":false}],"warnings":[],"summary":{"available":6,"no_image":35,"no_relevant_image":0,"failed":0,"unverified":0}},"sources":{"podcasts":[],"blogs":[],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @cognition - @temporalio - @aidotengineer - @latentspacepod","tweets":[{"text":"microsoft answers the call!!!!! oh my, am I a @mustafasuleyman stan?? i think we need @alexandr_wang to join in and that will be the tipping point for all labs to unite on this effort","createdAt":"2026-11-23T08:21:06.000Z","url":"https://x.com/swyx/status/2124780264916423021","likes":11,"retweets":0,"replies":10},{"text":"@theallinpod also this FTX SBF quote","createdAt":"2026-11-23T07:26:18.000Z","url":"https://x.com/swyx/status/2124766474736976240","likes":7,"retweets":0,"replies":0}]},{"name":"Boris Cherny","handle":"bcherny","bio":"Claude @anthropicai","tweets":[{"text":"Anyone can use /ship. If you’re on a Team or Enterprise plan, your admin can turn on Claude Ship per GitHub repo. I’d start with one repo and run Approvals in observe mode until you trust it.","createdAt":"2026-11-23T20:21:13.000Z","url":"https://x.com/bcherny/status/2124961488691740941","likes":175,"retweets":5,"replies":17},{"text":"It multiplies my velocity. I don’t need to wait around for code review or babysit PRs, and the results are better. Code Review looks for bugs, PR Steward works on fixes and failing checks, and Claude Approvals approves what your team’s policy allows (the last two are in beta).","createdAt":"2026-11-23T20:21:13.000Z","url":"https://x.com/bcherny/status/2124961487454384442","likes":201,"retweets":5,"replies":16},{"text":"A year ago we launched Opus 4.5, the first model to write 100% of my code. Shipping PRs hasn’t caught up, so today we’re launching Claude Ship in beta for Team and Enterprise. I use it all day every day and can’t imagine shipping without it.","createdAt":"2026-11-23T20:21:12.000Z","url":"https://x.com/bcherny/status/2124961485801836573","likes":5943,"retweets":178,"replies":242}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Worth listening to if you're curious what goes on in the minds of the people at OpenAI who are obsessively trying to patch all the flaws in OSS software and infrastructure we all rely on","createdAt":"2026-11-24T00:43:26.000Z","url":"https://x.com/thsottiaux/status/2125027477877887231","likes":1510,"retweets":53,"replies":273},{"text":"You should feel a significant jump in quality of answers on ChatGPT once rolled out to you. Together with all the investments we are making across simplifying the app, making it faster and merging chat & work, it's going to be quite the improvement in day to day experience by the end of the year.","createdAt":"2026-11-23T22:48:30.000Z","url":"https://x.com/thsottiaux/status/2124998553856844186","likes":4241,"retweets":133,"replies":823},{"text":"Inside OpenAI, dots are quickly becoming the primary way to get things done. We have dots building the dots system.","createdAt":"2026-11-23T17:48:30.000Z","url":"https://x.com/thsottiaux/status/2124923055072043052","likes":2649,"retweets":67,"replies":769}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":".@ChatGPT Dots still feels very buggy - it sends emails without me reviewing and randomly just stops responding. I really want to like this product but maybe I’m prompting it wrong?","createdAt":"2026-11-24T02:55:47.000Z","url":"https://x.com/petergyang/status/2125060785667969399","likes":96,"retweets":1,"replies":60},{"text":"Ok I admit I'm just salty for not being able to play GTA 6 during the day haha","createdAt":"2026-11-24T01:09:34.000Z","url":"https://x.com/petergyang/status/2125034054663999684","likes":16,"retweets":0,"replies":2},{"text":"I think it's kinda BS that schools have so many no school days like this whole week is no school while the parents still have to work","createdAt":"2026-11-24T00:54:01.000Z","url":"https://x.com/petergyang/status/2125030140577296647","likes":136,"retweets":2,"replies":37}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"Part of the disconnect is that the name “data” massively undersells what it truly represents in model development. People who are not close to model development think of data as this inert commodity you buy and shovel into a model, like coal. In reality great data encodes incredibly high value knowledge, taste and expertise, often articulated and structured in ways that did not exist previously. This makes it one of THE fundamental building blocks for creating increasingly capable intelligence across domains. Data will continue to be incredibly central to the intelligence industry .","createdAt":"2026-11-24T05:40:19.000Z","url":"https://x.com/realmadhuguru/status/2125102190196859156","likes":16,"retweets":1,"replies":1},{"text":"thanks for all the interest, pointers and DMs! let’s make a meetup happens. might not be able to reply to each individually, but will post updates here. Stay tuned!","createdAt":"2026-11-23T06:53:16.000Z","url":"https://x.com/realmadhuguru/status/2124758161068556756","likes":1,"retweets":0,"replies":0}]},{"name":"Thariq","handle":"trq212","bio":"at your service, formerly Claude Code @anthropicai","tweets":[{"text":"X payouts are such a good model for future software companies keep a lean core team and pay the users who help it grow, get better with feedback, sell, etc.","createdAt":"2026-11-23T22:03:20.000Z","url":"https://x.com/trq212/status/2124987187406275037","likes":1327,"retweets":28,"replies":57},{"text":"they cut the scene in Hitchhiker's Guide where the computer follows 42 with 500 million pages of Lean","createdAt":"2026-11-23T07:31:35.000Z","url":"https://x.com/trq212/status/2124767804247379968","likes":10567,"retweets":546,"replies":105}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Great meeting with VP @JDVance on Friday to discuss American AI leadership, cybersecurity, and modernizing our nation’s software infrastructure. We also discussed an issue close to my heart: American leadership in open-weight AI. Our allies want sovereign AI and are increasingly looking to Chinese open models. At home, American startups need a competitive model ecosystem. America could win the frontier AI race and still lose the global AI ecosystem. Very happy to see Jensen back at Nvidia. He’s been one of the most important champions of American open-weight AI.","createdAt":"2026-11-23T23:29:15.000Z","url":"https://x.com/amasad/status/2125008810041610359","likes":1852,"retweets":110,"replies":130},{"text":"The man is severely underpaid.","createdAt":"2026-11-23T22:59:42.000Z","url":"https://x.com/amasad/status/2125001371472871659","likes":1498,"retweets":70,"replies":30},{"text":"New research from Replit on scaling laws for agent swarms. We show that scaling the number of agents can yield dramatic performance gains, but unlike traditional scaling laws, more compute doesn't necessarily translate into better results, and how agents organize themselves matters. - Given a fixed two-hour window, Opus 5.5 went from a 3.7x speedup on NumPy with one agent to 18.9x with 32 agents. - GPT-6.2 Astra was the strongest solo agent but exhibited negative scaling beyond 8 agents. - Models spontaneously developed different organizational structures. Decentralized swarms scaled better than those that relied on centralized coordination. - The parallelizability of the problem was a stro…","createdAt":"2026-11-23T20:52:17.000Z","url":"https://x.com/amasad/status/2124969305674748175","likes":295,"retweets":19,"replies":72}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"▲ + 🇯🇵 Vercel is doubling down on Japan!","createdAt":"2026-11-24T02:41:50.000Z","url":"https://x.com/rauchg/status/2125057274213507253","likes":375,"retweets":19,"replies":31},{"text":"An actually good board!","createdAt":"2026-11-23T15:05:02.000Z","url":"https://x.com/rauchg/status/2124881919506886832","likes":393,"retweets":5,"replies":22},{"text":"I asked Fable to study all my coding sessions and decide whether Opus or Gemini Neon is best. Think of it as a 'personal eval'. It picked Neon. Google being so, so back seems widely (and wildly) under-discussed.","createdAt":"2026-11-23T14:57:42.000Z","url":"https://x.com/rauchg/status/2124880074168242369","likes":1792,"retweets":44,"replies":200}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"This is a pretty key insight. Services businesses are always held back by their ability to deliver outcomes to customers. That scaling essentially only could come from headcount, and no matter how much demand you saw, there was always a finite amount of talent you could get for the problem you were going after. Not to mention, the customer generally always wants the work done faster, at a lower price, or at a higher quality. Agents entirely change the calculus here, because now we can scale output in a way that’s decoupled from the among of time that goes in. A single engineer can have the output of dozens of engineers before. A single designer can probably build out your entire design syst…","createdAt":"2026-11-24T04:47:56.000Z","url":"https://x.com/levie/status/2125089009018040779","likes":346,"retweets":13,"replies":30},{"text":"2026 is just waking up each day to the magnitude of news that could only have happened once per decade before 2026.","createdAt":"2026-11-23T18:19:17.000Z","url":"https://x.com/levie/status/2124930801485930564","likes":470,"retweets":28,"replies":41}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"One trick a startup can use to self-prompt in a loop anslation":"agent 喜欢的东西，并不总是人会喜欢的。","attribution":"Peter Yang","url":"https://x.com/petergyang/status/2124669298191090033"}],"detail":{"sources":[{"sourceId":"x:2124669298191090033","blocks":[{"type":"paragraph","sentences":[{"id":"nov24-2","text":"Peter Yang 引述 Microsoft Copilot 的 Charles Lamanna，将 agent 称为“非常苛刻的客户”。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2124669298191090033","quote":"\"Agents are very harsh customers.\""}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov24-3","text":"引文认为 agent 更看重性能、价格与可靠性，它偏好的东西不一定是人偏好的。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2124669298191090033","quote":"[Agents] will look for the best performance, price, and reliability. What an agent prefers isn't always what a person would prefer."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov24-4","text":"他以搜索为例：给人通常展示十条链接和简短摘要，agent 却可能接受一千条结果。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2124669298191090033","quote":"When a person does a search, you give them 10 links with small snippets. An agent doesn't care. You can return a thousand results."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov24-5","text":"据此，引文预期 API 与用户体验会演进，出现更适合 agent 的模式。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2124669298191090033","quote":"Our APIs and user experiences will start to evolve and have modes that better support agents."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]}],"coverageReview":{"details":"保留转引身份、三个选择标准、十条与一千条搜索结果对比及接口演进判断。","limitations":"仅有Peter转引片段，不把它当完整访谈或实测结论。","omissions":"省略观看号召，不补未采集单集内容。"}}],"editorial":[{"id":"nov24-6","text":"搜索结果数量的对比指向接口设计的差异：面向人的信息筛选方式不必原样套给 agent；这仍是访谈观点，不能据此认定更多返回结果在所有任务上都更好。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2124669298191090033","quote":"\"Agents are very harsh customers.\"\n\nFrom @clamanna (EVP @Microsoft Copilot) on what happens when agents become the main users of software:\n\n\"[Agents] will look for the best performance, price, and reliability. What an agent prefers isn't always what a person would prefer.\n\nWhen a person does a search, you give them 10 links with small snippets. An agent doesn't care. You can return a thousand results.\n\nOur APIs and user experiences will start to evolve and have modes that better support agents.\"\n\n📌 Watch our full episode here: https://t.co/asVgmPQ9wF"}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]}},{"tag":"实践","title":"Aaron Levie：多 agent 协作需要重做知识、任务与权限的组织方式","body":"Aaron Levie：Aaron Levie 认为，当 agent 承接长时间项目、围绕目标并行工作时，运行框架与编排架构也必须演进。","claimType":"single_source","sourcePerspective":"Aaron Levie","titleReview":{"id":"nov24-7","text":"Aaron Levie：多 agent 协作需要重做知识、任务与权限的组织方式","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2124658150771188157","quote":"Yes to all of this. As agents take on more and more long running project work, and you have swarms of agents that parallelize work against a goal, the agent harness and architecture for orchestration will have to evolve. \n\nOne of the biggest shifts is how those agents collectively share their knowledge, keep track of the tasks, and also coordinate with human users. This in theory is technically straightforward, but there’s a ton of complexity to get right to ensure agents can both get access to the revenant resources without too much or little exposure.\n\nThere are a lot of lessons to pull from based on how people already do this kind of work together (people share their files, have computers to work with, community in chats and inboxes, and so on). But equally the primitives need to be able to enable this work at a throughput far higher than people, and in a world where agents can much more easily become a vector of security risk. \n\nGoing to be super fun building out this next generation of how agents operate. Lots of opportunity here both for horizontal and vertical specific approaches to bring this to life."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"},"evidence":[{"sourceId":"x:2124658150771188157","quote":"One of the biggest shifts is how those agents collectively share their knowledge, keep track of the tasks, and also coordinate with human users.","translation":"最大的变化之一，是这些 agent 如何共同分享知识、跟踪任务，并与人类用户协调。","attribution":"Aaron Levie","url":"https://x.com/levie/status/2124658150771188157"}],"detail":{"sources":[{"sourceId":"x:2124658150771188157","blocks":[{"type":"paragraph","sentences":[{"id":"nov24-8","text":"Aaron Levie 认为，当 agent 承接长时间项目、围绕目标并行工作时，运行框架与编排架构也必须演进。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2124658150771188157","quote":"Yes to all of this. As agents take on more and more long running project work, and you have swarms of agents that parallelize work against a goal, the agent harness and architecture for orchestration will have to evolve. "}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov24-9","text":"他把共享知识、跟踪任务及与人协调列为关键变化，强调真正复杂的是让 agent 得到相关资源，同时避免暴露过多或过少。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2124658150771188157","quote":"One of the biggest shifts is how those agents collectively share their knowledge, keep track of the tasks, and also coordinate with human users. This in theory is technically straightforward, but there’s a ton of complexity to get right to ensure agents can both get access to the revenant resources without too much or little exposure."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov24-10","text":"他建议从人类协作的共享文件、工作电脑、聊天和收件箱等方式借鉴，但认为底层机制必须支持远高于人的吞吐量，也必须面对 agent 更易成为安全风险入口的问题。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2124658150771188157"," n chats and inboxes, and so on). But equally the primitives need to be able to enable this work at a throughput far higher than people, and in a world where agents can much more easily become a vector of security risk. \n\nGoing to be super fun building out this next generation of how agents operate. Lots of opportunity here both for horizontal and vertical specific approaches to bring this to life."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]}},{"tag":"实践","title":"Guillermo Rauch：AI 的输出还应帮助人形成理解","body":"Guillermo Rauch：Guillermo Rauch 主张把 AI 引向人能理解的解释与概念形成，而不只是艺术。","claimType":"single_source","sourcePerspective":"Guillermo Rauch","titleReview":{"id":"nov24-13","text":"Guillermo Rauch：AI 的输出还应帮助人形成理解","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2124654108124848350","quote":"Rather than art, we ought to point AI towards human-understandability and conceptualization.\n\nThe Riemann proof should come with a paper, a walkthrough, new concepts and insights.\n\nMuch like the intermediate representation of high-level code is desirable even in a world where LLM will go straight to CPU instructions output."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"},"evidence":[{"sourceId":"x:2124654108124848350","quote":"Rather than art, we ought to point AI towards human-understandability and conceptualization.","translation":"与其指向艺术，我们更应让 AI 朝着人类能够理解和形成概念的方向发展。","attribution":"Guillermo Rauch","url":"https://x.com/rauchg/status/2124654108124848350"}],"detail":{"sources":[{"sourceId":"x:2124654108124848350","blocks":[{"type":"paragraph","sentences":[{"id":"nov24-14","text":"Guillermo Rauch 主张把 AI 引向人能理解的解释与概念形成，而不只是艺术。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2124654108124848350","quote":"Rather than art, we ought to point AI towards human-understandability and conceptualization."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov24-15","text":"他认为所讨论的黎曼证明应附上论文、逐步讲解，以及新的概念与洞见。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2124654108124848350","quote":"The Riemann proof should come with a paper, a walkthrough, new concepts and insights."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov24-16","text":"他用代码作类比：即便未来语言模型可以直接输出 CPU 指令，高层代码的中间表示仍然值得保留。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2124654108124848350","quote":"Much like the intermediate representation of high-level code is desirable even in a world where LLM will go straight to CPU instructions output."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]}],"coverageReview":{"details":"完整保留价值主张、论文讲解概念要求及CPU指令类比。","limitations":"规范性建议与未来假设，不是数学成果验证或现有模型能力评测。","omissions":"不补相关数学事件细节。"}}],"editorial":[{"id":"nov24-17","text":"作者要求的是结果之外的理解路径；代码类比强调，即使机器能直接执行，供人检查和思考的表达仍有价值，但本批没有数学证明正文，不能据此确认那项证明成立。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2124654108124848350","quote":"Rather than art, we ought to point AI towards human-understandability and conceptualization.\n\nThe Riemann proof should come with a paper, a walkthrough, new concepts and insights.\n\nMuch like the intermediate representation of high-level code is desirable even in a world where LLM will go straight to CPU instructions output."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]}}],"matters":[{"kind":"动态","title":"Sam Altman 提议把开发上限与监控能力里程碑挂钩","detail":"Sam Altman 提议前沿开发者建立共享评估、红队安全论证和透明度规范，并以 perplexity 等跨实验室指标约定开发上限，达到理解与监控 AI 行为的具体里程碑后才越过；他举了思维链监控器后继方案的例子。这是提议，不等于行业已实施。","sourceId":"x:2124551883130114403","url":"https://x.com/sama/status/2124551883130114403"},{"kind":"动态","title":"Replit Desktop 把安全模型作为产品卖点","detail":"Amjad Masad 称团队与 Windows 合作构建 Replit Desktop 的安全模型，并称 Christie’s 因安全需求选择 Replit 开展 agent 工作。正文未提供架构、审计或客户评估细节，这些保留为他的产品与客户主张。","sourceId":"x:2124604574606795002","url":"https://x.com/amasad/status/2124604574606795002"},{"kind":"动态","title":"Ryo Lu 展示原生 iOS 卡拉 OK 项目","detail":"Ryo Lu 说自己借助 airbuild 几乎一次生成 ryOS Karaoke，并描述将 iPhone Duo 半折后当作小型卡拉 OK 设备。原帖是制作自述，没有提供测试范围或完成度数据，不扩大为稳定性保证。","sourceId":"x:2124473853858725907","url":"https://x.com/ryolu_/status/2124473853858725907"},{"kind":"动态","title":"Swyx 鼓励创始人记录从创业到被收购的过程","detail":"Swyx 推荐一篇带遗憾与建议的创业历程，认为公开记录能让后来者少受一些苦；他列出的主题包括 SaaS 市场时点、知识产权转让、不要炫耀 SEO、吸引 Naval 关注、招聘裁员、寻找收购与清除障碍，以及 CTO 教练。原文复盘未被采集，不补具体做法。","sourceId":"x:2124730733147390347","url":"https://x.com/swyx/status/2124730733147390347"}],"articles":{"blogs":[],"podcasts":[{"title":"Dan Shipper：生成变便宜后，团队为什么仍有价值","sourceTitle":"A New Vision for Human Work After Automation","sourceId":"flightcast:01M717KBM0K828PAMMP3ZPWV8P","sourceUrl":"https://www.youtube.com/watch?v=WstNofgQF5Q","sourceName":"AI & I by Every","author":"Dan Shipper","publishedAt":"2026-11-11T15:30:00.000Z","sourceTextSha256":"bcf3a64887721bcbd21131f25a37a03bb6c9df49544daf4537eff9854650d1c4","blocks":[{"type":"paragraph","text":"本文来自 11 月 11 日发布的 AI & I by Every 节目，收录 Dan Shipper 在 Every 大会上的演讲，并非当天新节目。他用一次客户调查说明：当生成工作变得便宜，人的职责与视角仍会影响哪些结果值得选择、哪些事情值得推进。以下案例、数字与判断均来自演讲自述。"},{"type":"heading","text":"总量曲线之外，还要走近一件真实工作"},{"type":"paragraph","text":"Shipper 区分两种理解未来的方法：一是汇集大量数据、外推趋势，二是深入具体情境、理解其中的细节与变量。他承认前者的力量，AI 本身就受益于数据和计算规模的增长；但把模型进步直接推导为人没有价值，可能遗漏工作实际如何变化。"},{"type":"paragraph","text":"他以 GDPval 为例，称盲评中 AI 相对人类专家的胜出比例从 2024 年的 12.4%，到 2025 年的 47.6%，再到 2026 年约 83%；这些是他的演讲引用，本期未取得对应评测材料，也不能将其扩大成所有工作的替代比例。"},{"type":"paragraph","text":"他自己的季度客户调查也呈现类似冲击：在日程空隙中分析数据，制作让团队竞赛了解客户的实时游戏，发现面向团队销售的机会，再搭建 CRM 联系客户。他把这类比为过去数据科学、游戏开发、营销、工程与销售拓展等约五个岗位的工作，而不是报告一次真实的五人裁员。"},{"type":"heading","text":"同一份调查，不同人看到了不同问题"},{"type":"paragraph","text":"即使能借助 agent 做这么多事，Every 仍有约三十人的团队。Shipper 追问：同样的数据、同样的 Claude，为什么还需要这些同事？答案藏在团队各自的调查分析里。"},{"type":"paragraph","text":"他看到了面向团队销售的机会；负责增长的 Yash 关注新订阅者首月流失与邮件过多的关系；营销负责人 Douglas 注意到读者的孤独感——他们热衷 AI，身边的人却未必理解；编辑 Jack 则把结果做成黏土动画风格的抢答节目。每个人使用 AI，却选中了不同的重点。"},{"type":"paragraph","text":"把调查直接交给 Claude、只问“数据里有什么”，也能得到真实见解，例如内容的价值、产品组合对留存的作用，以及聚焦和信息量问题。但这些默认答案人人可以得到，没有哪个同事仅提交这份通用回答。Yash 还在筹备大会和制作直播体验时完成分析，并写出推动相关改动的 PR，把观察转成行动。"},{"type":"heading","text":"能生成某个答案，不等于能把它挑出来"},{"type":"paragraph","text":"Shipper 并不否认模型可能给出同事想到的内容。他举了内部评估负责人 Mike Taylor 预测自己 Slack 回复的实验：让 Claude 为每个问题生成四百个答案时，约 93% 的情况下能包含他的答案；但再要求排序，该答案进入前 10% 的比例只有约 60%。"},{"type":"paragraph","text":"这个自述实验的重点是生成与筛选的差别，而非通用准确率：大量候选里存在有用答案，并不意味着用户能轻易找到它。他由此概括，生成便宜，排序仍难；人负责某个业务领域，便知道该往哪里看，也更容易判断什么值得采取行动。"},{"type":"paragraph","text":"职责先缩小探索范围，个人视角再帮助选出重要线索，随后有人承担推进责任。团队让多个这样的视角同时工作，探索的可能性比一个默认提示词更广；这就是他保留团队的理由。"},{"type":"heading","text":"比较未来模型时，不要把人冻结在今天"},{"type":"paragraph","text":"面对“再过一年模型也会排序”的反驳，Shipper 承认模型可能明显进步，但认为不能拿 2026 年的 Yash 与 2027 年的 Claude 单独比较：未来的 Yash 也会积累新经验，并使用未来模型。另一边的 agent 也需要被启动、设定方向。"},{"type":"paragraph","text":"因此，他真正想比较的是“带着职责和视角使用模型的人”，与同一模型的默认提示词。模型能力广泛分发后，默认答案成为更高的新起点；人的差异在于如何引导同样的能力，而不是继续与旧版本模型竞争。"},{"type":"paragraph","text":"他也承认今天的独特做法可能成为明天的基础能力，但这不代表人必须停留在原处。持续使用新工具的人，会在新的起点上继续选择目标和推进工作；这是一种对未来工作方式的判断，不是对所有职业安全的保证。"},{"type":"heading","text":"从知道多少，转向如何分配智能资源"},{"type":"paragraph","text":"Shipper 将这种方式称为“分配经济”：评价一个人，不只看他知道多少，而看他如何分配智能资源、交付任务并确保质量。职责与视角因此不是生成之外的装饰，而是决定工作去向的条件。"},{"type":"paragraph","text":"他进一步建议改变评价 AI 的方式：除了数学、编程等容易达成共识和验证的问题，也要问模型能否从具体使用者的视角完成其工作。共识能力仍然有用，但当所有人都能获得它，独特选择与判断可能更稀缺。"},{"type":"paragraph","text":"演讲最后回到两种观察方法：总量评测为了比较模型，需要固定人的任务基线；具体实践却能让人看到自己如何随工具改变。Shipper 希望把模型进步视为可以为自己的目标服务的资源，同时持续观察真实的人与团队如何工作，而不只从一条能力曲线推断整个工作世界。"}]}]},"quality":{"collected":23,"collectedTweets":22,"used":8,"usedTweets":7,"uniqueAuthors":8,"imageCount":0,"claimAudit":{"reviewMode":"editorial review plus structural checks; not automated proof of meaning","claimsReviewed":17,"warnings":[]},"status":"degraded","warnings":["Quoted-post context missing: x:2124669298191090033","Quoted-post context missing: x:2124658150771188157","Quoted-post context missing: x:2124654108124848350","Media unverified: podcasts:flightcast:01M717KBM0K828PAMMP3ZPWV8 rmative capabilities as we enter the ~0.68-0.7 log-perplexity window.” this chart is one of the most beautiful ways to tell the story of the last 4 years. it also shows that a lot of the post training issues we debate is kinda the B plot to the overall A plot of larg…","createdAt":"2026-11-22T19:19:04.000Z","url":"https://x.com/swyx/status/2124583459356373052","likes":112,"retweets":2,"replies":82}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"Just played this with fam and wow highly recommended for coop games","createdAt":"2026-11-23T04:34:06.000Z","url":"https://x.com/petergyang/status/2124723140437959022","likes":0,"retweets":0,"replies":0},{"text":"@grok list all the recommendations by most recommended and write 1 sentence each why","createdAt":"2026-11-23T02:44:43.000Z","url":"https://x.com/petergyang/status/2124695613971603850","likes":3,"retweets":0,"replies":1},{"text":"\"Agents are very harsh customers.\" From @clamanna (EVP @Microsoft Copilot) on what happens when agents become the main users of software: \"[Agents] will look for the best performance, price, and reliability. What an agent prefers isn't always what a person would prefer. When a person does a search, you give them 10 links with small snippets. An agent doesn't care. You can return a thousand results. Our APIs and user experiences will start to evolve and have modes that better support agents.\" 📌 Watch our full episode here:","createdAt":"2026-11-23T01:00:09.000Z","url":"https://x.com/petergyang/status/2124669298191090033","likes":7,"retweets":1,"replies":10}]},{"name":"Nan Yu","handle":"thenanyu","bio":"product, codex @openai. prev head of product @linear","tweets":[{"text":"I found a secret prompt that makes all your vibecoded projects scale and perform better, with higher reliability. “Use Postgres”","createdAt":"2026-11-22T19:53:57.000Z","url":"https://x.com/thenanyu/status/2124592238974156861","likes":33,"retweets":0,"replies":5}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Spectacle","createdAt":"2026-11-23T01:08:15.000Z","url":"https://x.com/amasad/status/2124671335700091020","likes":164,"retweets":3,"replies":15},{"text":"Desktop AI apps are generally a security & privacy nightmare. We worked with Windows to ship a world-class security model for Replit Desktop. Which is why Christie’s, the world’s preeminent custodian of rare art, chose Replit for secure agentic work!","createdAt":"2026-11-22T20:42:58.000Z","url":"https://x.com/amasad/status/2124604574606795002","likes":201,"retweets":11,"replies":57}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Rather than art, we ought to point AI towards human-understandability and conceptualization. The Riemann proof should come with a paper, a walkthrough, new concepts and insights. Much like the intermediate representation of high-level code is desirable even in a world where LLM will go straight to CPU instructions output.","createdAt":"2026-11-22T23:59:48.000Z","url":"https://x.com/rauchg/status/2124654108124848350","likes":127,"retweets":7,"replies":62},{"text":"This aged extremely well. There's a tweet out there (will likely get deleted soon) of a provider giving you \"free\" inference of a \"stealth model\" that's \"ZDR\" with millions of views. These stealth models are mechanisms of industrial scale data exfiltration to nation state programs, I strongly suspect, and the Dragos research seems to confirm. Imagine explaining to your boss: sorry chief, I *had* to try this really cool ZDR free stealth model… all our secrets, customer data, and code are now in a different continent! Vercel AI Gateway built up tremendous, real-world token volume without taking any of these shortcuts. More to come tomorrow on how we will push the trust, privacy, and security…","createdAt":"2026-11-22T20:06:54.000Z","url":"https://x.com/rauchg/status/2124595496849445079","likes":491,"retweets":21,"replies":91}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Yes to all of this. As agents take on more and more long running project work, and you have swarms of agents that parallelize work against a goal, the agent harness and architecture for orchestration will have to evolve. One of the biggest shifts is how those agents collectively share their knowledge, keep track of the tasks, and also coordinate with human users. This in theory is technically straightforward, but there’s a ton of complexity to get right to ensure agents can both get access to the revenant resources without too much or little exposure. There are a lot of lessons to pull from based on how people already do this kind of work together (people share their files, have computers t…","createdAt":"2026-11-23T00:15:52.000Z","url":"https://x.com/levie/status/2124658150771188157","likes":364,"retweets":21,"replies":66}]},{"name":"Ryo Lu","handle":"ryolu_","bio":"Designed @Cursor_ai, @NotionHQ, @Stripe, built startups. I make a world where anyone can make software. Aspiring k-pop idol.","tweets":[{"text":"ryOS Karaoke, native on iOS, almost one-shotted with @airbuild half fold the iPhone Duo and it's a tiny karaoke machine 🎤","createdAt":"2026-11-22T12:03:32.000Z","url":"https://x.com/ryolu_/status/2124473853858725907","likes":230,"retweets":7,"replies":19}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"Breaking: AI fails to solve the most intractable math problem, how VCs are going to return those huge funds when the entry valuation of their deals is > $1B pre-product","createdAt":"2026-11-23T01:09:42.000Z","url":"https://x.com/mattturck/status/2124671699245257037","likes":85,"retweets":0,"replies":8},{"text":"Had been years in The best human mathematicians know how to build theory, painstakingly, to reach a goal. But no human brain, on its own, is capable of creating a wormhole that requires a 25,000 page long tour through existing infrastructure with no obvious or realistic connection to the goal. But huge credit to Levent here: I think no current AI, on its own, is capable of this either.”\n\nIt used to be the case that to solve a particular problem - code, life sciences, math, cyber, engineering, and so on - you were ultimately bound by how much information an individual or team could retain and understand about the space. More information or more team members don’t always help, because it gets harder to connect the dots or coordinate amongst everyone. AI changes that completely. \n\nFor the first time ever we can decouple the human context limits and ability to work through information from our ability to drive productivity or discoveries. This is likely not just a small increase in the kinds of discoveries we can drive, but a qualitative shift in human output. \n\nNow every single form of prior art, insight, past research, past decision, or unrelated breakthrough, can be used for the discovery or creation of something new. This is useful for anything from cybersecurity to life sciences research. Agents will be able to correlate entirely unrelated work to a separate project; scan every bit of data in your enterprise for solving a problem; and so on. \n\nThe solutions may not be as elegant as they were in the past, but we sure will have far more of them. We’re only in the first couple of months of actually understanding the implications of this but it’s clearly going to drive a lot of change."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"},"evidence":[{"sourceId":"x:2124252844710887549","quote":"More information or more team members don’t always help, because it gets harder to connect the dots or coordinate amongst everyone.","translation":"更多信息或更多团队成员并不总有帮助，因为把线索连接起来、协调每个人会变得更困难。","attribution":"Aaron Levie","url":"https://x.com/levie/status/2124252844710887549"}],"detail":{"sources":[{"sourceId":"x:2124252844710887549","blocks":[{"type":"paragraph","sentences":[{"id":"nov23-10","text":"Aaron Levie 从他所称的黎曼猜想“突破”谈起，认为解决问题的方式正在改变；他转引的文字把相关工作描述为跨越约二万五千页既有知识的连接，同时强调当前 AI 单独也做不到。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2124252844710887549","quote":"This post nails why we why we should take the Riemann Hypothesis breakthrough very seriously, even beyond math. We’re entering an era where solving problems will look very different from how we solved them in the past.\n\n“This is not theory-building in the usual sense. It is something much weirder and more alien. The best human mathematicians know how to build theory, painstakingly, to reach a goal. But no human brain, on its own, is capable of creating a wormhole that requires a 25,000 page long tour through existing infrastructure with no obvious or realistic connection to the goal. But huge credit to Levent here: I think no current AI, on its own, is capable of this either.”"}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov23-11","text":"他认为，过去的问题求解受个人或团队能够记住、理解的信息限制；加入更多信息或成员，也可能增加连接与协调的难度。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2124252844710887549","quote":"It used to be the case that to solve a particular problem - code, life sciences, math, cyber, engineering, and so on - you were ultimately bound by how much information an individual or team could retain and understand about the space. More information or more team members don’t always help, because it gets harder to connect the dots or coordinate amongst everyone. AI changes that completely. "}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov23-12","text":"他据此预测，AI 可把人处理上下文的限制与发现能力部分分离，改变产出的性质，而不只是小幅增加数量。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2124252844710887549","quote":"For the first time ever we can decouple the human context limits and ability to work through information from our ability to drive productivity or discoveries. This is likely not just a small increase in the kinds of discoveries we can drive, but a qualitative shift in human output. "}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov23-13","text":"他设想，既有技术、过去研究与决策，甚至不相关的突破，都可成为新发现的材料；agent 可能连接跨项目工作，或扫描企业数据寻找解法。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2124252844710887549","quote":"Now every single form of prior art, insight, past research, past decision, or unrelated breakthrough, can be used for the discovery or creation of something new. This is useful for anything from cybersecurity to life sciences research. Agents will be able to correlate entirely unrelated work to a separate project; scan every bit of data in your enterprise for solving a problem; and so on. "}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov23-14","text":"他预期未来解法未必同样优雅，但数量会更多，同时承认人们才刚开始理解这些影响。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2124252844710887549","quote":"The solutions may not be as elegant as they were in the past, but we sure will have far more of them. We’re only in the first couple of months of actually understanding the implications of this but it’s clearly going to drive a lot of change."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]}],"coverageReview":{"details":"保留数学引子、转引的人机共同限制、信息协调瓶颈、跨领域例子与解法不一定优雅的限定。","limitations":"数学证明正文和被引帖未采集；二万五千页仅为作者转引，跨领域能力是预测。","omissions":"不补证明内容、数学结论或原文之外的能力评测。"}}],"editorial":[{"id":"nov23-15","text":"这段论述的价值在于提出跨材料连接的工作假设；数学事件及转引内容没有在本批来源中得到独立验证，不能据此宣布证明成立，更不能把作者对 agent 的设想视为已测能力。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2124252844710887549","quote":"This post nails why we why we should take the Riemann Hypothesis breakthrough very seriously, even beyond math. We’re entering an era where solving problems will look very different from how we solved them in the past.\n\n“This is not theory-building in the usual sense. It is something much weirder and more alien. The best human mathematicians know how to build theory, painstakingly, to reach a goal. But no human brain, on its own, is capable of creating a wormhole that requires a 25,000 page long tour through existing infrastructure with no obvious or realistic connection to the goal. But huge credit to Levent here: I think no current AI, on its own, is capable of this either.”\n\nIt used to be the case that to solve a particular problem - code, life sciences, math, cyber, engineering, and so on - you were ultimately bound by how much information an individual or team could retain and understand about the space. More information or more team members don’t always help, because it gets harder to connect the dots or coordinate amongst everyone. AI changes that completely. \n\nFor the first time ever we can decouple the human context limits and ability to work through information from our ability to drive productivity or discoveries. This is likely not just a small increase in the kinds of discoveries we can drive, but a qualitative shift in human output. \n\nNow every single form of prior art, insight, past research, past decision, or unrelated breakthrough, can be used for the discovery or creation of something new. This is useful for anything from cybersecurity to life sciences research. Agents will be able to correlate entirely unrelated work to a separate project; scan every bit of data in your enterprise for solving a problem; and so on. \n\nThe solutions may not be as elegant as they were in the past, but we sure will have far more of them. We’re only in the first couple of months of actually understanding the implications of this but it’s clearly going to drive a lot of change."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]}}],"matters":[{"kind":"动态","title":"ChatGPT / Codex 桌面团队征集更新后的问题","detail":"Thibault Sottiaux 表示团队已准备下一次大更新，并询问用户前一天更新后还有哪些地方不到位。这是反馈征集，正文没有列出下一版功能或发布时间。","sourceId":"x:2124322968499282388","url":"https://x.com/thsottiaux/status/2124322968499282388"},{"kind":"动态","title":"Amjad Masad 关注用 GitHub issues 协调 agent 群","detail":"Amjad Masad 转述一名高中生将 GTA6 重新编译到 PC 的项目；相比移植本身，他更关注借助 GitHub issues 在多个 agent 间协调任务，并提出这是否可能成为新的开源模式。帖子与项目截图不构成对运行结果或协作效果的独立验证。","sourceId":"x:2124345037408686228","url":"https://x.com/amasad/status/2124345037408686228","images":[{"src":"assets/digest/2026-11-23/75de218c9f3d69454f7b7005.jpg","originalUrl":"https://pbs.twimg.com/media/HXswjXEacAARDsB.jpg","sourceUrl":"https://x.com/amasad/status/2124345037408686228","attribution":"Amjad Masad","sha256":"321ca008d46b1472d307969a708a28f0cb926ee4365e26e87ab3ab6c669cdabc","width":994,"height":1200,"mediaId":"75de218c9f3d69454f7b7005","alt":"Amjad Masad 分享的 Leonida 项目说明截图；图片呈现项目自述，不代表运行效果已经验证。"}]},{"kind":"动态","title":"Amjad Masad 宣布 Amuse 开源","detail":"Amjad Masad 称由 Replit Missions 构建的 Amuse 已开源。原帖只有简短公告和链接，本期不推定其许可证、功能范围或部署条件。","sourceId":"x:2124277564596519355","url":"https://x.com/amasad/status/2124277564596519355"},{"kind":"动态","title":"Dan Shipper 提醒区分基准分数与实际使用","detail":"Dan Shipper 指出，基准测试必须选择测量对象与固定条件，分数上涨未必意味着读者所理解的变化；他建议同时细看深度使用 AI 的团队如何应用模型能力。所链接文章不在本批正文中，不补其论证。","sourceId":"x:2124292892168475086","url":"https://x.com/danshipper/status/2124292892168475086"}],"articles":{"blogs":[],"podcasts":[{"title":"Isomorphic Labs：让药物设计更多在计算机上迭代","sourceTitle":"Powering AI-Driven Drug Discovery with President of Isomorphic Labs Max Jaderberg","sourceId":"c9a0c39e-de2a-11f1-9237-d39059052d4c","sourceUrl":"https://www.youtube.com/watch?v=IiKf3BgBezE","sourceName":"No Priors","author":"Max Jaderberg","publishedAt":"2026-11-12T11:00:00.000Z","sourceTextSha256":"c6b5e880345474a113aba067b8f74efd35efd345f92fdd90a70de9f5e0926e4a","blocks":[{"type":"paragraph","text":"这篇整理来自 11 月 12 日发布的 No Priors 访谈，并非今天的新节目。Isomorphic Labs 总裁 Max Jaderberg 讨论的核心问题，是怎样把药物研发中的反复试错更多搬到计算机上，让进入现实实验的设计更有把握。他把这描述为正在建设的能力，而不是已经完成的临床成果。"},{"type":"heading","text":"从游戏挑战走向疾病研究"},{"type":"paragraph","text":"Jaderberg 早年研究计算机视觉，在 DeepMind 参与生成模型、强化学习和游戏挑战。他看到这些方法逐步解决曾被认为极难的问题，开始思考如何把它们用于更重要的现实任务。AlphaFold 对生物问题展示出的泛化能力，给团队提供了信心；约 2021 年，他们为这项使命建立独立公司，组织 AI、化学与生物学人才共同工作。"},{"type":"paragraph","text":"访谈首先提出一个矛盾：知识与研究工具增加，研发新药却仍慢而昂贵。Jaderberg 的解释是，传统设计高度依赖“提出假设—制造分子—现实测试”的循环；生物系统复杂、分子设计空间巨大，有限时间和资金能尝试的方案却有限，容易找到的机会也会逐渐减少。"},{"type":"heading","text":"平台的价值，要能跨项目积累"},{"type":"paragraph","text":"单个药物项目可以积累大量经验，但不一定能显著加快下一项。Jaderberg 因此强调一个底层平台：让不同项目的学习进入模型，加深对疾病机制和分子设计的理解，再用于后续研发。这样才有机会形成随项目增加而增强的能力，而不是每次重新开展孤立的前沿研究。"},{"type":"paragraph","text":"这也影响招聘。公司并不只寻找已经兼懂 AI 与药物发现的人，而是分别聘用优秀的模型研究者与生物、化学专家，再让他们在内部相互学习。他认可部分核心建模团队中约五名 AI 人员配一名领域专家的量级，但没有把它定为所有团队的固定比例。领域专家的重要职责，是理解数据细节，判断指标能否真正转化为制药价值。"},{"type":"heading","text":"目标不是多做实验，而是减少无效迭代"},{"type":"paragraph","text":"他把合成分子与现实测试视为主要时间、成本瓶颈，目标是让模拟模型达到实验级精度。以结构预测为例，如果计算能够替代漫长的结构测定，研发就有机会把更多设计迭代放在电脑上。团队会在内部评估中标出实验精度作为目标线；这并不意味着所有模型已达到目标。"},{"type":"paragraph","text":"研发失败还经常出现在临床：分子可能命中目标，却同时影响别处；目标本身也可能带来未预料的负面效果。因此，他希望模型不只预测结合关系，还帮助提前理解疾病生物学、细胞与毒性风险。收益不仅是更快筛选，也可能是更早发现本来要到患者阶段才暴露的问题。"},{"type":"heading","text":"数据分布，比已有数据有多少更关键"},{"type":"paragraph","text":"大量历史数据是研发活动顺带留下的，可能带有很强偏差。Jaderberg 认为，想得到泛化模型，未必能只依赖这些数据，需要主动生成更符合学习目标的数据。他称团队在自产数据上观察到良好的扩展规律，但访谈未给出可独立比较的数据集或评测结果。"},{"type":"paragraph","text":"主持人提出动物实验难以转化到人的问题。Jaderberg 同样认为动物只是代理，提出把体外实验、预测模型、类器官、器官芯片和合成人体组织等方法结合，直接研究人类临床毒性。同时他承认临床试验数量有限，相应数据仍不足；这些方向不能被读作已取代临床验证。"},{"type":"paragraph","text":"公司自行开发药物设计引擎，也重视拥有专有数据；但实验技术复杂多样，不坚持所有环节自己做。数据可由内部团队、合同研究机构及其他技术公司共同产生，核心在于是否服务于模型需要。"},{"type":"heading","text":"自动实验室与模拟，是互补的两条路"},{"type":"paragraph","text":"自动化实验室能缩短操作时间，公司也长期与这类平台合作。但分子反应和细胞培养仍受物理时间约束。Jaderberg 因此希望将更多探索放进计算环境，让现实实验更偏向验证已经形成的方案，减少靠反复现实试验学习的次数。"},{"type":"paragraph","text":"他反复保留一个边界：新科学假设最终仍需现实验证，药物也必须确认有效和安全。“走出真实世界”指减少迭代瓶颈，不是取消实验或直接跳到患者使用。"},{"type":"heading","text":"用模型做药，而不是出售模型调用"},{"type":"paragraph","text":"Isomorphic 的设计引擎保留内部使用，不按 token 销售，也不对外授权模型。商业上有两类项目：自己资助并拥有的药物管线，以及与药企或生物技术公司合作的项目。伙伴带来特定疾病领域的经验和难题，团队再用设计引擎共同推进。"},{"type":"paragraph","text":"内部重点是肿瘤、免疫与炎症；Jaderberg 则把底层模型描述为跨疾病、靶点类别和分子形式的通用能力。他希望寻找可能影响多种下游病症的共同机制，并以访谈中提及的 KRAS 相关研发为例说明方向；这里保留为他的例子，不将外部药物效果当作本公司的成绩。"},{"type":"paragraph","text":"组合用药也展示了工程难度：多种药物可能带来叠加毒性、肝脏影响或不良相互作用。他设想，若能更准确地设计分子，便可能安全地同时调节多个靶点；但这仍是机会判断，不能推导为复杂组合已经有效或安全。"},{"type":"heading","text":"临床时间表与患者安全，仍是边界"},{"type":"paragraph","text":"面对监管是否拖慢进展的问题，Jaderberg 坚持患者安全是核心，同时认为风险承受应结合患者处境：晚期癌症与低度慢性炎症的选择并不相同。他希望未来用更好的成功率和安全性数据证明设计方法的价值，再影响研发与监管实践，而非仅靠技术愿景要求放松标准。"},{"type":"paragraph","text":"主持人追问首次临床试验的日期，他没有给出承诺，只说公司在建设临床开发团队、努力推动候选药物进入患者阶段。对未来五年，他期待疾病预测理解和分子精确设计能力有显著提升，也承认药物发现与开发目前仍需多年。"},{"type":"paragraph","text":"访谈最后从延长寿命转向健康寿命：除了避免重大疾病，也要减少衰老带来的骨骼、肌肉与活动能力退化。他欢迎改善具体疾病与研究衰老根因两类工作，但没有承诺某个寿命倍数或疾病治愈期限。整段讨论的落点，是把研发的不确定性尽量前移到设计阶段，同时保留最终验证的责任。"}]}]},"quality":{"collected":24,"collectedTweets":23,"used":8,"usedTweets":7,"uniqueAuthors":7,"imageCount":2,"claimAudit":{"reviewMode":"editorial review plus structural checks; not automated proof of meaning","claimsReviewed":15,"warnings":[]},"status":"degraded","warnings":["Quoted-post context missing: x:2124252844710887549","Media unverified: podcasts:c9a0c39e-de2a-11f1-9237-d39059052d4c (feed_has_no_media_or_supported_post_locator)"]},"contentSchemaVersion":2,"sourceSnapshotSha256":"d14126ba863a3a68bcab19cdebd9de48251eb9e1b33eb2f480463d525f1088e5","selection":{"sources":[{"sourceId":"x:2124147427313861009","decision":"excluded","reason":"质疑供应商秘密回传但缺被引帖与证据，不能认定行为。"},{"sourceId":"x:2124322968499282388","decision":"used","reason":"可独立整理的操作体验、协作判断或具体动态；保留作者主张及未核实边界。"},{"sourceId":"x:2124277855131664869","decision":"excluded","reason":"尝试社交平台的短句，无构建信息。"},{"sourceId":"x:2124217179717648537","decision":"excluded","reason":"同作者导航建议，与已选Codex入口体验接近，避免重复。"},{"sourceId":"x:2124217176655843483","decision":"used","reason":"可独立 ery exciting as a…"]}],"blogs":[],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @cognition - @temporalio - @aidotengineer - @latentspacepod","tweets":[{"text":"is there any possible benign explanation why these providers were secretly phoning home? because wtf","createdAt":"2026-11-21T14:26:26.000Z","url":"https://x.com/swyx/status/2124147427313861009","likes":250,"retweets":9,"replies":109}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Team is already preparing another big update, but how are things since yesterday’s update to the ChatGPT/Codex desktop app? What still requires attention and is not quite there?","createdAt":"2026-11-22T02:03:58.000Z","url":"https://x.com/thsottiaux/status/2124322968499282388","likes":2158,"retweets":66,"replies":1116},{"text":"Going to check out this threads thing","createdAt":"2026-11-21T23:04:42.000Z","url":"https://x.com/thsottiaux/status/2124277855131664869","likes":2376,"retweets":37,"replies":434}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"Also I think chats in the left nav should include local recent codex threads not just chat threads","createdAt":"2026-11-21T19:03:36.000Z","url":"https://x.com/petergyang/status/2124217179717648537","likes":7,"retweets":0,"replies":2},{"text":"The new ChatGPT mobile app is very clean but if you miss your codex threads like me you can go to the right most tab and hold to pin codex to the bottom nav. This isn’t obvious at all btw @chatgpt","createdAt":"2026-11-21T19:03:35.000Z","url":"https://x.com/petergyang/status/2124217176655843483","likes":54,"retweets":2,"replies":29},{"text":"I get the complaints about GTA VI now wtf is this","createdAt":"2026-11-21T17:45:53.000Z","url":"https://x.com/petergyang/status/2124197623683027363","likes":87,"retweets":1,"replies":9}]},{"name":"Nan Yu","handle":"thenanyu","bio":"product, codex @openai. prev head of product @linear","tweets":[{"text":"Forget second brain. Third brain.","createdAt":"2026-11-21T20:41:35.000Z","url":"https://x.com/thenanyu/status/2124241838358008184","likes":24,"retweets":0,"replies":8}]},{"name":"Thariq","handle":"trq212","bio":"at your service, formerly Claude Code @anthropicai","tweets":[{"text":"I fear we are too quick to disintermediate ourselves, and by doing so we do both ourselves and the models disservice.","createdAt":"2026-11-21T20:33:02.000Z","url":"https://x.com/trq212/status/2124239688013914132","likes":188,"retweets":6,"replies":7},{"text":"it seems to me that as models get more powerful, the skill of working with them becomes more and more important, and I have not seen diminishing returns on that skill yet we have many many more problems to solve","createdAt":"2026-11-21T20:33:02.000Z","url":"https://x.com/trq212/status/2124239686482923553","likes":219,"retweets":4,"replies":9},{"text":"yes, Claude is doing a lot of the technical work. and yes, maybe future models will one-shot \"prove the Riemann hypothesis\" or \"make javascript a static language\" but I believe collaborating with models to push the frontier is a deeply technical skill in its own right","createdAt":"2026-11-21T20:33:01.000Z","url":"https://x.com/trq212/status/2124239684536840682","likes":294,"retweets":6,"replies":3}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"A high school kid is recompiling the GTA6 to work on PC. What’s more interesting is how they’re github issues to coordinate tasks across agent swarms. A new model for open source?","createdAt":"2026-11-22T03:31:39.000Z","url":"https://x.com/amasad/status/2124345037408686228","likes":401,"retweets":30,"replies":56},{"text":"Amuse, built by Replit Missions, is open source!","createdAt":"2026-11-21T23:03:33.000Z","url":"https://x.com reedom to pursue them in the best way they can."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"},"evidence":[{"sourceId":"x:2123686350410912145","quote":"It won’t be about explicitly telling them, but instead giving them goals and enough freedom to pursue them in the best way they can.","translation":"重点将不再是逐项明确告诉它们怎么做，而是给出目标和足够自由，让它们尽可能寻找合适的实现方式。","attribution":"Aaron Levie","url":"https://x.com/levie/status/2123686350410912145"}],"detail":{"sources":[{"sourceId":"x:2123686350410912145","blocks":[{"type":"paragraph","sentences":[{"id":"nov22-12","text":"Aaron Levie 认为今年模型能力已有明显跃升，越来越适合处理人自己也难以清晰定义的问题，而不只是执行精确指令。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2123686350410912145","quote":"This year we’ve had a clear jump in model capability where instead of telling agents precisely what to do, it’s better to use these systems to solve problems you can’t easily define yourself. "}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov22-13","text":"他对比一年前的产品设计与开发：过去需要把实现办法讲得很细，现在 agent 可能连接更大的方案空间，提出人没有想到的实现。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2123686350410912145","quote":"A year ago you’d need to very clearly tell agents the how to design and develop your product idea, or there was almost no chance of success. Now, increasingly, the agent likely can come up with a better implementation than you’d have thought of because you can have it connect the dots between a far greater solution space than you can. "}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov22-14","text":"他预测这种变化会扩展到金融、法律、生命科学和网络安全等知识工作，理由是任何个人都难以掌握全部相关行业知识。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2123686350410912145","quote":"This will be increasingly true in basically every domain of kneeler work. We’re going to see this impact in finance, legal, life sciences, cyber, and many other spaces where no person can hold onto all the available relevant industry knowledge to think of the best solution. "}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov22-15","text":"据此，他主张给 agent 明确目标，并留出足够自由，让它寻找完成目标的方法；这是对工作方式的建议。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2123686350410912145","quote":"Ultimately this is going to reshape our relationship with AI and how we deploy agents in our work. It won’t be about explicitly telling them, but instead giving them goals and enough freedom to pursue them in the best way they can."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]}],"coverageReview":{"details":"保留一年对比、难定义问题、更大方案空间、四个领域及目标与自由的结论。","limitations":"作者判断与预测，未给成功率、评测或高风险领域使用边界，不推定可无监督部署。","omissions":"不扩写原文笔误，不补被引帖或外部事实。"}}],"editorial":[{"id":"nov22-16","text":"作者提出的是把实现选择交给 agent 的方向，而不是证明它在所有领域都优于人；原帖没有任务样本或评测，预测仍应与已验证能力分开。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2123686350410912145","quote":"This year we’ve had a clear jump in model capability where instead of telling agents precisely what to do, it’s better to use these systems to solve problems you can’t easily define yourself. \n\nA year ago you’d need to very clearly tell agents the how to design and develop your product idea, or there was almost no chance of success. Now, increasingly, the agent likely can come up with a better implementation than you’d have thought of because you can have it connect the dots between a far greater solution space than you can. \n\nThis will be increasingly true in basically every domain of kneeler work. We’re going to see this impact in finance, legal, life sciences, cyber, and many other spaces where no person can hold onto all the available relevant industry knowledge to think of the best solution. \n\nUltimately this is going to reshape our relationship with AI and how we deploy agents in our work. It won’t be about explicitly telling them, but instead giving them goals and enough freedom to pursue them in the best way they can."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]}}],"matters":[{"kind":"动态","title":"Gemini 网页模型选择器加入长按交互","detail":"Josh Woodward 说团队受到用户帖子启发，做出一个小体验并上线；入口是长按网页端模型选择器。正文未说明具体效果，本期不根据未采集的视频补描述。","sourceId":"x:2123943606906138868","url":"https://x.com/joshwoodward/status/2123943606906138868"},{"kind":"动态","title":"Thariq 的游戏原型把比赛与队友故事连接起来","detail":"Thariq 介绍一款以元素操控为运动的体育动漫游戏：玩家与小队参加锦标赛，比赛间隙探索队友各自的故事，叙事关系参考 Mass Effect 和 Dragon Age；他称已想清楚玩法循环，未宣称成品发布。","sourceId":"x:2123909357071159327","url":"https://x.com/trq212/status/2123909357071159327"},{"kind":"动态","title":"自动约见邮件很积极，线下却没有认出对方","detail":"Matt Turck 讲述 Slush 的一次经历：对方发两次约见邮件，他回复后又迅速收到三次，见面时对方看了两遍名牌仍似乎不认识他，打招呼便离开。作者以此讽刺自动化邮件与实际交流脱节；只是个人轶事，不能据此确定对方使用了什么系统。","sourceId":"x:2123777488786538982","url":"https://x.com/mattturck/status/2123777488786538982"},{"kind":"动态","title":"Zara Zhang 提醒关注 AI 作品的交付形式","detail":"Zara Zhang 建议不要直接把 Claude Artifacts 或 ChatGPT sites 发给客户，理由是这可能让客户觉得自己也能通过提示词完成。原帖是对客户感知的个人建议，没有调查数据，也不证明这些载体本身缺乏价值。","sourceId":"x:2123813583339532321","url":"https://x.com/zarazhangrui/status/2123813583339532321"}],"articles":{"blogs":[],"podcasts":[{"title":"Linear 的增长与 AI 转型：从自助工具到产品开发系统","sourceTitle":"Scaling Linear’s GTM to $100M ARR — Cristina Cordova, COO","sourceId":"01a1f60c-1b1f-7366-a794-20e0b0bcdc8a","sourceUrl":"https://www.youtube.com/watch?v=x0VSm6IjcDQ","sourceName":"Latent Space","author":"Cristina Cordova","publishedAt":"2026-11-19T23:38:57.000Z","sourceTextSha256":"ce0003f9840e0f0c435165183897c91a1524c87bde7b87d982d1991dfef9a535","blocks":[{"type":"paragraph","text":"11 月 19 日发布的 Latent Space 访谈中，Linear COO Cristina Cordova 回顾公司如何从面向创业公司的自助产品，逐步建立企业销售，再转向人和 agent 共同工作的产品开发系统。她没有把增长归结为一次营销动作，而是反复讨论产品、客户信任、团队能力与变化中的商业模式。以下数字和案例均保留为受访者自述。"},{"type":"heading","text":"什么时候需要 COO，要看创始团队缺什么"},{"type":"paragraph","text":"Cordova 曾在 Stripe 工作七年半，随后在 Notion 负责平台、合作和自助增长，再加入 Linear。她并不建议每家刚找到产品市场契合的公司都招聘 COO：如果问题只是创始人忙不过来卖产品，先补销售或销售负责人可能更合适。只有团队清楚自己在哪些职能缺少判断“优秀是什么”的能力，综合型运营角色才有明确价值。"},{"type":"paragraph","text":"她加入时 Linear 约三十五至四十人，主要以产品驱动增长，客户多为创业公司和成长企业，大客户大约不超过五百席。Vercel、Ramp 等客户可以自行注册并随业务扩大，但另一类公司在放入任何数据之前就需要合同、试点和内部评估。她的任务是建立服务后者的能力，访谈时称公司在她加入后至少增长了十倍。"},{"type":"paragraph","text":"Linear 的试工也围绕真实职责：她为未来六至十二个月拟定市场进入计划，访谈已有销售、客服、客户成功与营销同事，再与创始团队对齐。计划因此既是招聘样本，也是入职后的工作蓝图，而非脱离岗位的面试题。"},{"type":"heading","text":"从变更日志，到能真正到达用户的产品叙事"},{"type":"paragraph","text":"早期营销主要靠功能更新邮件和公司账号发帖，但邮件订阅者不足用户的十分之一。她希望不只宣布“又发布了什么”，还说明 Linear 为什么值得采用，并在用户每天工作的应用内传达变化。目标是在维持品牌风格的同时，让现有与潜在客户都真正理解产品。"},{"type":"paragraph","text":"产品能自助销售，不意味着所有客户都愿意自助购买。核心工作系统涉及信任，她因此扩充销售，优先聘用向工程师、设计师卖过技术产品的人，让他们熟悉演示和真实工作流，而非依赖花哨幻灯片。销售必须经过产品培训，能够理解用户问题。"},{"type":"paragraph","text":"团队没有先配大量销售开发代表（SDR），而是让客户经理直接承担触达与沟通，减少客户为了看到演示先经历一次资格盘问。客服也坚持内部团队、不外包，因为早期它常是用户与 Linear 的第一次真人接触。她把这些选择视为适合自身客户的方式，没有宣称所有公司都该照搬。"},{"type":"heading","text":"先学会替换成长企业的旧工具，再走向企业市场"},{"type":"paragraph","text":"入职不久，Cordova 把公司目标里的“进入企业市场”划掉：当时只有一名销售，既缺人，也没有足够经验主动赢得已经使用其他工具的成长企业。她先要求团队把这一阶段做好，以满意客户和推荐建立基础，到 2025 年才正式成立企业销售板块。"},{"type":"paragraph","text":"替换已有系统的阻力与卖一个全新工具不同。她认为稍好两三成不足以抵消迁移成本；早期 Linear 依靠设计与使用体验，需要用户亲自试用才容易理解差异。免费入口让很多人先为自己使用，再推动公司采用。后来，产品的销售理由又随着 AI 改变：不只比旧工具好用，而是要改变手工搬运工作的方式。"},{"type":"heading","text":"“Issue tracking is dead”，指的是手工追踪过程"},{"type":"paragraph","text":"她解释，问题单这个工作单位仍在，真正希望消失的是逐步手动报告 bug、打标签、分配、更新状态、关闭和通知客户的过程。这些动作占用时间，却并非直接建设产品。Linear 因此把自己重新描述为产品开发系统，让人更多时间用于做产品，让 agent 承担协调环节。"},{"type":"paragraph","text":"她也不同意应用只需成为数据库、暴露 MCP 接口便能拥有好商业模式。Linear 既向外部 agent 开放，也把 agent 工作流带进产品：例如 Loops 自动分配任务并启动编码，Triage Intelligence 自动标记和分发进入队列的缺陷与需求。某些自动化直接做成功能即可，不必要求用户再搭一个 agent。"},{"type":"paragraph","text":"据她称，自 2025 年发布 MCP server 后，agent 创建的 issue 已超过总量一半；同时应用内活动也增长。她关注应用中的工作创建与会话，而不只看 MCP 调用。聊天常是单人交互，团队仍需可视化、协作和共享工作状态，因此她把两条使用曲线一起增长当作产品同时服务人与 agent 的信号，而非证明界面不再重要。"},{"type":"paragraph","text":"前沿 AI 客户较早提出这些需求；Ramp、Coinbase 等既有公司也在建设内部 agent，希望通过 API 深度接入并掌握自身数据。销售与客户成功团队从客户演示中学习，再把经验教给其他客户，或直接反馈成产品能力。不是每个客户都会主动要求新功能，团队也需要提前判断方向。"},{"type":"heading","text":"AI 能减轻工作，但不能替品牌承担所有回答"},{"type":"paragraph","text":"Linear 自身也让销售修改网站文案、营销调整数据流程，再由工程师审核。客服使用 AI 起草回复，但由人决定是否发送；Cordova 反对先让模型回答所有问题，等客户生气才交给人。她指出，三句话能说清的问题，模型可能写成三段，速度并不自动等于有帮助。"},{"type":"paragraph","text":"这让团队不必随业务同比增加人数，但她明确区分了减少招聘增量与裁员。客户故事也类似：AI 可以转写访谈、找出值得写的片段，最终文章仍由人完成，以保留品牌的具体感和手工品质。选择在哪里使用 AI，本身就是产品与经营判断。"},{"type":"heading","text":"企业销售要解决迁移，也要帮助内部支持者说服同事"},{"type":"paragraph","text":"解决方案工程师与企业客户经理配合，处理定制 API、复杂工作流和大规模迁移的技术问题；可以快速制作集成演示或导入器，但通常不会像驻场工程那样取得客户系统访问并代为全面实施。她认为 Linear 应足够容易集成，而不是依赖长期专职管理员。"},{"type":"paragraph","text":"相对明确的工作结构，也有助于 agent 理解数据。她举例，过度可配置的系统可能让同一个 bug 标签在不同团队代表不同事情。Linear 更偏有明确用途和做法的工具，这是它与无限定制系统之间的取舍。"},{"type":"paragraph","text":"销售还要帮助内部支持者向 IT、采购和管理层解释价值。成交时间因此差异很大：一家公司可由 CEO 在一个月内推动，也有公司前后两年多、换了几位内部推动者才说服 CTO。AI 热潮没有让组织决策自动变快，但新增 AI 预算确实可能打开之前没有的购买空间；她预计这种实验性支出会逐渐受到检验。"},{"type":"heading","text":"按席位、按用量和按结果，并不是简单替代关系"},{"type":"paragraph","text":"Cordova 提醒，收入规模相似的公司可能结构完全不同：Linear 约四万付费客户，长期以席位计费；少数超大合同撑起的收入则具有不同集中度。可信赖的产品可以签多年协议，但收入确定性也意味着提价受限；快速变化的新工具更常先以试点或短合约探索。"},{"type":"paragraph","text":"Linear 保留核心席位收费，只对部分新增 AI 能力加入使用量计费，并非把过去免费的核心功能全部改成按量收费。她希望有清晰的结果定价，却承认自动分派一个 bug 对不同公司的价值很难统一，因此现阶段很多定价仍参考服务成本。"},{"type":"paragraph","text":"访谈中的具体做法是：Linear Agent 聊天免费，使用前沿模型；编码会话可选择 OpenAI 或 Anthropic 的模型与 harness，按公开 API 费用加少量费用；Loops 则采用 AI credits。大部分 AI 功能直接包含在产品中。整理整个积压任务与简单聊天的成本也不同，所以“每次查询一美元”并不天然合理。"},{"type":"paragraph","text":"对于成本尚不明确的 beta 功能，团队会提前告知现在免费、未来可能收费，观察真实使用后再确定方式，并在正式收费前通知。但用户可能忘记数月前的说明，透明沟通不能消除所有失望。她更倾向起初保守定价、成本下降后降价，而非先定得过低再被迫涨价；这些都是访谈当时的策略描述。"},{"type":"heading","text":"改变路线图，意味着承认一些旧计划做不完"},{"type":"paragraph","text":"2025 年原本是推进大型组织功能的一年，MCP、agent API 与 Codex、Cursor、GitHub Copilot 合作却成了必须快速做的新方向。她明确说，这不是在完成旧计划之外额外完成一切，而是一些企业功能被延后。她相信抢先支持 agent 仍可赢得企业客户，只是通过不同于原计划的路径。"},{"type":"paragraph","text":"回看 2023 年创业公司缩减开支的环境，她认为需要贴近客户、集中精力，同时信任产品与工程团队。如今路线图最长约六个月，市场叙事也随之调整；过去关于夏季淡季、星期几适合发布的惯例不再可靠。但她也强调 Linear 会为质量延期，通过缩小范围取得速度，而不是把最快当作唯一目标。"},{"type":"heading","text":"组织方式与产品品质，是同一套选择"},{"type":"paragraph","text":"为什么不一次招聘一百名销售？她的回答是，较小团队更容易调整方向，循序扩张让工程与销售建立对彼此判断的信任。试工也体现相同倾向：先确认一个人在别处的好经验，能否转化成对 Linear 真实问题的贡献。"},{"type":"paragraph","text":"她从 Stripe 带来的一个观察是人员构成：当商业团队增长太快，曾以工程、产品、设计和数据至少占约四成作为约束。她坦言数字是人为选择；Linear 没有照搬硬门槛，但她持续跟踪比例，以免团队构成偏离希望建设的产品型公司。"},{"type":"paragraph","text":"另一个教训是，不要因为公司成功、能吸引更资深的人，就总在现有优秀负责人上面加一层。她希望给内部人才成长机会，只有下一阶段确实缺少能力时才外聘。公司当时约一百七十人，除创始人与 COO 外仍偏扁平，通过扩大职责和负责人范围发展领导者，而不急着增加高管层级。"},{"type":"heading","text":"从投资回到运营：价值在于亲自把事情做成"},{"type":"paragraph","text":"访谈后段，她解释为何一度转向投资：在 Notion 约四十人时，自己很享受帮忙招聘、补齐组织职能，但把这些岗位招齐后，回到原来的平台合作工作反而不再兴奋。投资带来了跨公司的广度，却与在公司内部执行很不一样；她更擅长帮助刚找到产品市场契合的企业扩建业务。"},{"type":"paragraph","text":"运营经历让她能向创始人提供更可信的具体帮助，投资经历则帮助她理解董事会关心的数据、融资预期，以及怎样主动要求介绍客户和人才。回到 Linear，这些经验最终落在同一个原则上：理解公司真正需要什么，再搭建相应的人、产品与商业流程，而不是复制一套看起来成功的组织模板。"}]}]},"quality":{"collected":32,"collectedTweets":31,"used":8,"usedTweets":7,"uniqueAuthors":8,"imageCount":1,"claimAudit":{"reviewMode":"editorial review plus structural checks; not automated proof of meaning","claimsReviewed":16,"warnings":[]},"status":"degraded","warnings":["Quoted-post context missing: x:2123879309463228445","Quoted-post context missing: x:2123879031049449791","Quoted-post context missing: x:2123686350410912145","Media unverified: podcasts:01a1f60c-1b1f-7366-a794-20e0b0bcdc8a (feed_has_no_media_or_supported_post_locator)","Media unverified: x:2123813583339532321 (budget_exhausted)"]},"contentSchemaVersion":2,"sourceSnapshotSha256":"4ec3a3ad9d7af1e8b4004252775c480a410ef4d3f9143c47fcf01e2b4286d38d","selection":{"sources":[{"sourceId":"x:2123856303974121851","decision":"excluded","reason":"感叹与链接，无正文事实。"},{"sourceId":"x:2123843282082132335","decision":"excluded","reason":"访谈预告未包含论证，不能扩写LangChain转型内容。"},{"sourceId":"x:2123690305736396925","decision":"excluded","reason":"询问Cursor功能而非确认功能，图片不作为补事实入口。"},{"sourceId":"x:2123943608516792480","decision":"excluded","reason":"致谢与引用，已有同作者功能入口帖子。"},{"sourceId":"x:2123943606906138868", cd yet?","createdAt":"2026-11-20T08:09:59.000Z","url":"https://x.com/swyx/status/2123690305736396925","likes":122,"retweets":0,"replies":86}]},{"name":"Josh Woodward","handle":"joshwoodward","bio":"VP, @Google @GoogleLabs @GeminiApp @GoogleAIStudio","tweets":[{"text":"Thanks again to @UFO2002616 for the inspiration!","createdAt":"2026-11-21T00:56:31.000Z","url":"https://x.com/joshwoodward/status/2123943608516792480","likes":39,"retweets":0,"replies":1},{"text":"Whew, what a week of shipping! A few of us were having fun with Gemini Neon on the Friday afternoon before the holiday week ahead, and we loved the post from @UFO2002616 so much that we just built it and threw it into prod! Long click on the model picker on the web and enjoy 🙂","createdAt":"2026-11-21T00:56:31.000Z","url":"https://x.com/joshwoodward/status/2123943606906138868","likes":380,"retweets":22,"replies":44}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"We’ve been messing around a bit and inadvertently created an experience that’s a bit too fun internally and now everyone is just having fun instead of working. We might not recover from this.","createdAt":"2026-11-21T04:31:36.000Z","url":"https://x.com/thsottiaux/status/2123997735326232775","likes":3281,"retweets":88,"replies":656},{"text":"First tweet from Akshay. Be nice to this one, he’s special.","createdAt":"2026-11-20T19:40:38.000Z","url":"https://x.com/thsottiaux/status/2123864112694509995","likes":2650,"retweets":33,"replies":244},{"text":"Team is locked in, upgrade your desktop app. Faster, simpler and a lot more pleasant to use.","createdAt":"2026-11-20T19:29:07.000Z","url":"https://x.com/thsottiaux/status/2123861214644347122","likes":2743,"retweets":64,"replies":360}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"3 hours of download left before I can play this, what's going with the user score though 🤔","createdAt":"2026-11-21T00:59:22.000Z","url":"https://x.com/petergyang/status/2123944322190254340","likes":37,"retweets":0,"replies":15},{"text":"BREAKING: @JensenHuang Once Tried to Offer Brisket to a Visibly Vegetarian Squirrel","createdAt":"2026-11-21T00:47:09.000Z","url":"https://x.com/petergyang/status/2123941250902667762","likes":2983,"retweets":154,"replies":135},{"text":"For those of you trying out @antigravity for Neon, here's a quick tip: 1. Go to 2. Tap see more and then the share button 3. Tap Add to Home Screen Then you can talk to all your Antigravity threads via remote control on mobile. Even though Antigravity doesn't have a mobile app (yet), I find its remote control actually better than Claude's because all the threads are available by default.","createdAt":"2026-11-20T20:41:01.000Z","url":"https://x.com/petergyang/status/2123879309463228445","likes":159,"retweets":7,"replies":27}]},{"name":"Nan Yu","handle":"thenanyu","bio":"product, codex @openai. prev head of product @linear","tweets":[{"text":"big perf and QoL wins for actions you do dozens to hundreds of times a day","createdAt":"2026-11-21T03:33:23.000Z","url":"https://x.com/thenanyu/status/2123983081577267264","likes":8,"retweets":0,"replies":0}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"Who are the most interesting AI people I should meet in Chennai? I’ll be in town end of Nov - 1st wk Dec. about me: I’m at Meta building AI products now; previously led product for Gemini, Veo and Nano Banana models at Google. schedule is tight but I should be able to squeeze in a few meetings.","createdAt":"2026-11-21T02:51:18.000Z","url":"https://x.com/realmadhuguru/status/2123972492645777629","likes":112,"retweets":6,"replies":33}]},{"name":"Thariq","handle":"trq212","bio":"playing WoW forever, formerly Claude Code @anthropicai","tweets":[{"text":"I'm calling it Home Ground.","createdAt":"2026-11-20T22:40:26.000Z","url":"https://x.com/trq212/status/2123909358828539965","likes":21,"retweets":0,"replies":1},{"text":"I think I’ve figured out the gameplay loop! It’s a sports anime game, but the sport is elemental bending. You fight in tournaments alongside your squad, and between matches they have their own stories you can get into, like in Mass Effect or Dragon Age.","createdAt":"2026-11-20T22:40:25.000Z","url":"https://x.com/trq212/status/2123909357071159327","likes":537,"retweets":7,"replies":50},{"text":"I am now even more against handoff","createdAt":"2026-11-20T21:43:32.000Z","url":"https://x.com/trq212/status/2123895040821071959","likes":374,"retweets":1,"replies":6}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"It’s phenomenal","createdAt":"2026-11-20T20:34:20.000Z","url":"https://x.com/amasad/status/2123877625915375950","likes":80,"retweets":3,"replies":9},{"text":"Is it a bear market?","createdAt":"2026-11-20T20:31:42.000Z","url":"https://x.com/amasad/status/2123876961923613180","likes":30,"retweets":1,"replies":29},{"text":"With two separate Riemann proofs, one AI and one Human, coming out at the same time, assuming they’re both correct, it’ll be interesting to see the difference especially on elegance.","createdAt":"2026-11-20T20:22:04.000Z","url":"https://x.com/amasad/status/2123874539218010491","likes":1064,"retweets":47,"replies":51}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"When I first tried an internal pre-release version of @eve, a personal shopper agent was my \"hello world\". It worked, but a lot of the infrastructure was missing. Now, @agentcardhq exists, models are better, iMessage and WhatsApp eve channels are mature, and performance is vastly improved (without trading off durability and encryption.) The result is you can ship a platform of the caliber of Muse / Instinct, that you fully control, on our open intelligence stack. The experience is pure delight. I highly recommend you try this. Run with this template. Make it your own.","createdAt":"2026-11-20T20:39:55.000Z","url":"https://x.com/rauchg/status/2123879031049449791","likes":219,"retweets":13,"replies":48},{"text":"ISO 42001:2023 is like the \"SOC2 of AI\". It's the first global, independently audited standard for how companies build, evaluate, monitor and govern AI systems. When you ship on and use Vercel's AI, you now know the infra is audited annually by an accredited third party.","createdAt":"2026-11-20T20:00:45.000Z","url":"https://x.com/rauchg/status/2123869175085191298","likes":660,"retweets":26,"replies":51}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Going to be a big day in math","createdAt":"2026-11-20T14:55:01.000Z","url":"https://x.com/levie/status/2123792233535332448","likes":3344,"retweets":195,"replies":65},{"text":"This year we’ve had a clear jump in model capability where instead of telling agents precisely what to do, it’s better to use these systems to solve problems you can’t easily define yourself. A year ago you’d need to very clearly tell agents the how to design and develop your product idea, or there was almost no chance of success. Now, increasingly, the agent likely can come up with a better implementation than you’d have thought of because you can have it connect the dots between a far greater solution space than you can. This will be increasingly true in basically every domain of kneeler work. We’re going to see this impact in finance, legal, life sciences, cyber, and many other spaces wh…","createdAt":"2026-11-20T07:54:16.000Z","url":"https://x.com/levie/status/2123686350410912145","likes":407,"retweets":32,"replies":164}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the
