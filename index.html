orld. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"My team wrote about how we run persistent agents inside OpenAI.","createdAt":"2026-11-13T01:53:12.000Z","url":"https://x.com/steipete/status/2121058770767982997","likes":589,"retweets":32,"replies":73},{"text":"Would you enable yolo mode for dots, even if your dot might do sth unwanted?","createdAt":"2026-11-13T00:47:25.000Z","url":"https://x.com/steipete/status/2121042215619510584","likes":106,"retweets":1,"replies":127},{"text":"There’s some new agent launching later this week and marketers offer a lot of money to say nice things about it on X. Keep a lookout on honest reviews 🫠","createdAt":"2026-11-12T22:36:55.000Z","url":"https://x.com/steipete/status/2121009372470067544","likes":1159,"retweets":24,"replies":124}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"Everybody is talking about honeypot! Was it a honeypot always or merely at the end, as a form of circumstance? But this is precisely the trap. *sniffs* These are merely the *surface* of the situation. What is the real infidelity? America tells Nvidia: you are married to national security, you must not sell your most powerful chips to China. But in the same breath it says: you are the great hero of American capitalism! Sell as many chips as possible! And Jensen says: of course, darling, I will be faithful. Then, late at night, *sniffs* he finds a way to remain faithful. So you see, Jensen is not cheating on the system. Cheating on his wife? Yes. The system? No. He is the only one who has bee…","createdAt":"2026-11-13T00:23:44.000Z","url":"https://x.com/danshipper/status/2121036252350972222","likes":20,"retweets":4,"replies":6},{"text":"Claude the first time it sits in on one of my meetings:","createdAt":"2026-11-12T23:56:01.000Z","url":"https://x.com/danshipper/status/2121029280432075157","likes":138,"retweets":4,"replies":13},{"text":"🫡🤝","createdAt":"2026-11-12T23:43:05.000Z","url":"https://x.com/danshipper/status/2121026025668727279","likes":23,"retweets":1,"replies":1}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"We would not be where we are today without Jensen. It is viscerally painful to see what is happening.","createdAt":"2026-11-12T16:57:55.000Z","url":"https://x.com/adityaag/status/2120924059709956201","likes":334,"retweets":24,"replies":19}]},{"name":"Claude","handle":"claudeai","bio":"Claude is an AI assistant built by @anthropicai to be safe, accurate, and secure. Talk to Claude on or download the app.","tweets":[{"text":"Claude Meetings is starting with Google Meet, with support for other video conferencing platforms coming soon. Learn more:","createdAt":"2026-11-12T20:16:22.000Z","url":"https://x.com/claudeai/status/2120974000746582357","likes":1275,"retweets":38,"replies":26},{"text":"Claude takes the notes, too. After the call, the notes, action items, transcript, and anything Claude built are on the meeting’s page in Claude.","createdAt":"2026-11-12T20:16:21.000Z","url":"https://x.com/claudeai/status/2120973999295643679","likes":1277,"retweets":18,"replies":11},{"text":"Claude joins as a visible participant. Ask it a question out loud or in chat, or have it start a doc. Your team can see what it’s building and correct it as it takes shape.","createdAt":"2026-11-12T20:16:21.000Z","url":"https://x.com/claudeai/status/2120973996304830859","likes":1678,"retweets":43,"replies":34}]}]},"errors":[],"partial":false},{"date":"2026-11-13","dateLabel":"2026年11月13日","generatedAt":"2026-11-13T00:00:00+08:00","sourceGeneratedAt":"2026-11-12T06:28:54.625Z","stats":{"podcastEpisodes":1,"xBuilders":16,"totalTweets":32,"blogPosts":0},"highlights":[{"tag":"实践","title":"Dan Shipper：同一模型下，团队的价值在选择与负责","body":"Dan Shipper 用客户调查与回答排序实验，说明团队成员的责任和视角如何影响 AI 工作。","claimType":"single_source","sourcePerspective":"Dan Shipper","titleReview":{"id":"nov13-8","text":"Dan Shipper：同一模型下，团队的价值在选择与负责","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120539547620790424","quote":"I look at what I do with Fable 5.2 in the cracks of my week and think: this would've taken five people and $200,000.\n\nThen I look at what my team does with the same AI.\n\nLast week, between meetings, I analyzed our customer survey, made a game for our team, spotted an opportunity to sell @Every to teams, built a CRM, and started reaching out.\n\nLook at that and you might ask: Why would I need a team at all?\n\nThe chart seems to agree. On OpenAI's GDPval benchmark, AI went from beating human experts 12.4% of the time in 2024 to around 83% in 2026. That's the aggregate view of the future of work: gather a lot of data and extrapolate a trend line.\n\nBut the aggregate misses something. To see it, you have to get intimate: zoom in on one real situation, with all its messiness, and extrapolate from there.\n\nWe gave everyone at Every access to the same customer survey and the same AI models.\n\n• I found an opportunity to sell to teams.\n• @poojary_yash saw that first-time subscribers were churning because we send too much email.\n• @dabrundage noticed that many of our readers feel lonely: they're excited about AI, but people around them think they're crazy.\n• @jackcheng turned the results into a Claymation game show.\n\nCould you ask Claude to produce what each of them found? Maybe. But generating possibilities is cheap. Knowing which ones matter is hard.\n\n@hammer_mt ran an experiment to predict what I'd say in Slack. When Claude got 400 attempts, it produced an answer like mine 93% of the time. But when it had to rank its own answers, mine landed in its top 10% only around 60% of the time.\n\nEach person on a team is responsible for a different part of the world. That responsibility narrows where they look, and their perspective helps them decide what matters enough to act on. A team explores more possibilities than a single default prompt, and it can take responsibility for what it finds.\n\nThe obvious objection: models will get better at ranking. I think they will. But people aren't frozen while that happens. Comparing 2026 Yash with 2027 Claude misses that there will also be a 2027 Yash, with another year of experience, using 2027 Claude.\n\nAs models improve and spread, they raise the floor for everyone. The default answer becomes the baseline. The value is in using your perspective and responsibility to push past it.\n\nThat's why I think we need to change how we measure AI. Instead of only asking how well a model performs on problems everyone agrees are worth solving, ask: How good is it at doing my work, from my perspective?\n\nThe aggregate can show us the capability curve. The intimate helps us see what we might build, and who we might become, as we ride it.\n\nI presented this at Thesis: 2027. The full talk is on the Every podcast:"}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"},"evidence":[{"sourceId":"x:2120539547620790424","attribution":"Dan Shipper","quote":"But generating possibilities is cheap. Knowing which ones matter is hard.","translation":"生成可能性很便宜，判断哪些重要却很难。","url":"https://x.com/danshipper/status/2120539547620790424"}],"detail":{"sources":[{"sourceId":"x:2120539547620790424","blocks":[{"type":"paragraph","sentences":[{"id":"nov13-1","text":"Dan Shipper 回顾，自己在一周会议间隙用 AI 分析客户调查、为团队做游戏、发现向团队销售 Every 的机会，继而搭建 CRM 并开始联系客户；他把这些工作类比为过去五个人、约 20 万美元的投入，这不是一笔实际节省金额的核算。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120539547620790424","quote":"I look at what I do with Fable 5.2 in the cracks of my week and think: this would've taken five people and $200,000.\n\nThen I look at what my team does with the same AI.\n\nLast week, between meetings, I analyzed our customer survey, made a game for our team, spotted an opportunity to sell @Every to teams, built a CRM, and started reaching out."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-2","text":"他引用 GDPval 的汇总视角：按其转述，AI 战胜人类专家的比例从 2024 年的 12.4% 上升到 2026 年约 83%；但他认为，只沿趋势线推演会漏掉具体工作中的差异。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120539547620790424","quote":"The chart seems to agree. On OpenAI's GDPval benchmark, AI went from beating human experts 12.4% of the time in 2024 to around 83% in 2026. That's the aggregate view of the future of work: gather a lot of data and extrapolate a trend line.\n\nBut the aggregate misses something. To see it, you have to get intimate: zoom in on one real situation, with all its messiness, and extrapolate from there."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-team-a","text":"Every 把同一份调查和相同模型交给团队：Dan 看到团队销售机会，Yash 发现邮件过多与新订阅者流失有关。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120539547620790424","quote":"We gave everyone at Every access to the same customer survey and the same AI models.\n\n• I found an opportunity to sell to teams.\n• @poojary_yash saw that first-time subscribers were churning because we send too much email."}],"reviewNote":"逐项保留团队案例；原帖带冒号的列表项按原顺序展示，不补造新主题。"}]},{"type":"heading","text":"@dabrundage 发现许多读者感到孤独","originalHeading":"@dabrundage noticed that many of our readers feel lonely","review":{"id":"nov13-team-heading","text":"@dabrundage 发现许多读者感到孤独","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120539547620790424","quote":"@dabrundage noticed that many of our readers feel lonely"}],"reviewNote":"逐项保留团队案例；原帖带冒号的列表项按原顺序展示，不补造新主题。"}},{"type":"paragraph","sentences":[{"id":"nov13-team-b","text":"这些读者对 AI 兴奋，但周围人认为他们不正常；Jack 则把调查结果做成黏土动画风格的游戏节目。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120539547620790424","quote":"• @dabrundage noticed that many of our readers feel lonely: they're excited about AI, but people around them think they're crazy.\n• @jackcheng turned the results into a Claymation game show."}],"reviewNote":"逐项保留团队案例；原帖带冒号的列表项按原顺序展示，不补造新主题。"}]},{"type":"paragraph","sentences":[{"id":"nov13-4","text":"他不否认模型可能生成这些发现，但强调生成候选与选出重要候选是两回事：一次预测他 Slack 回复的实验，让 Claude 每题尝试 400 个答案时，93% 的情况下能生成类似他的回答；要求模型自排优先级时，他的回答仅约 60% 的情况下进入前 10%。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120539547620790424","quote":"Could you ask Claude to produce what each of them found? Maybe. But generating possibilities is cheap. Knowing which ones matter is hard.\n\n@hammer_mt ran an experiment to predict what I'd say in Slack. When Claude got 400 attempts, it produced an answer like mine 93% of the time. But when it had to rank its own answers, mine landed in its top 10% only around 60% of the time."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-5","text":"Dan 的解释是，团队成员各自承担不同责任，责任缩小搜索范围，个人视角帮助判断哪些发现值得行动；因此团队能探索比单个默认提示更广的可能性，并为结果负责。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120539547620790424","quote":"Each person on a team is responsible for a different part of the world. That responsibility narrows where they look, and their perspective helps them decide what matters enough to act on. A team explores more possibilities than a single default prompt, and it can take responsibility for what it finds."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-6","text":"他承认模型的排序能力会进步，但反对用停留在 2026 年的人与 2027 年模型比较：到时人也多了一年经验，并会使用新模型；当模型能力广泛普及时，默认答案成为基线，价值在于以个人视角与责任超越它。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120539547620790424","quote":"The obvious objection: models will get better at ranking. I think they will. But people aren't frozen while that happens. Comparing 2026 Yash with 2027 Claude misses that there will also be a 2027 Yash, with another year of experience, using 2027 Claude.\n\nAs models improve and spread, they raise the floor for everyone. The default answer becomes the baseline. The value is in using your perspective and responsibility to push past it."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-7","text":"因此，他建议评测除了测公认值得解决的问题，还应问模型能否从自己的视角做好自己的工作；汇总数据呈现能力曲线，具体实践则帮助人理解可以创造什么。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120539547620790424","quote":"That's why I think we need to change how we measure AI. Instead of only asking how well a model performs on problems everyone agrees are worth solving, ask: How good is it at doing my work, from my perspective?\n\nThe aggregate can show us the capability curve. The intimate helps us see what we might build, and who we might become, as we ride it."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]}],"coverageReview":{"details":"保留一周任务、五人和20万美元类比、GDPval数字、四位成员的不同产物、400/93%/60%实验以及未来人机比较。","limitations":"基准与实验均为作者转述，非本刊独立验证；团队案例不证明所有岗位永不被替代。","omissions":"省去会议宣传和反复设问；没有补充未采集的基准方法。"}}],"editorial":[{"id":"nov13-9","text":"这组案例区分了生成能力与行动选择：让模型列出很多答案，并不等于已经决定应当推进哪一个；作者把团队价值放在后者。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2120539547620790424","quote":"I look at what I do with Fable 5.2 in the cracks of my week and think: this would've taken five people and $200,000.\n\nThen I look at what my team does with the same AI.\n\nLast week, between meetings, I analyzed our customer survey, made a game for our team, spotted an opportunity to sell @Every to teams, built a CRM, and started reaching out.\n\nLook at that and you might ask: Why would I need a team at all?\n\nThe chart seems to agree. On OpenAI's GDPval benchmark, AI went from beating human experts 12.4% of the time in 2024 to around 83% in 2026. That's the aggregate view of the future of work: gather a lot of data and extrapolate a trend line.\n\nBut the aggregate misses something. To see it, you have to get intimate: zoom in on one real situation, with all its messiness, and extrapolate from there.\n\nWe gave everyone at Every access to the same customer survey and the same AI models.\n\n• I found an opportunity to sell to teams.\n• @poojary_yash saw that first-time subscribers were churning because we send too much email.\n• @dabrundage noticed that many of our readers feel lonely: they're excited about AI, but people around them think they're crazy.\n• @jackcheng turned the results into a Claymation game show.\n\nCould you ask Claude to produce what each of them found? Maybe. But generating possibilities is cheap. Knowing which ones matter is hard.\n\n@hammer_mt ran an experiment to predict what I'd say in Slack. When Claude got 400 attempts, it produced an answer like mine 93% of the time. But when it had to rank its own answers, mine landed in its top 10% only around 60% of the time.\n\nEach person on a team is responsible for a different part of the world. That responsibility narrows where they look, and their perspective helps them decide what matters enough to act on. A team explores more possibilities than a single default prompt, and it can take responsibility for what it finds.\n\nThe obvious objection: models will get better at ranking. I think they will. But people aren't frozen while that happens. Comparing 2026 Yash with 2027 Claude misses that there will also be a 2027 Yash, with another year of experience, using 2027 Claude.\n\nAs models improve and spread, they raise the floor for everyone. The default answer becomes the baseline. The value is in using your perspective and responsibility to push past it.\n\nThat's why I think we need to change how we measure AI. Instead of only asking how well a model performs on problems everyone agrees are worth solving, ask: How good is it at doing my work, from my perspective?\n\nThe aggregate can show us the capability curve. The intimate helps us see what we might build, and who we might become, as we ride it.\n\nI presented this at Thesis: 2027. The full talk is on the Every podcast:"}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]}},{"tag":"实践","title":"803 家公司清单观察：多模型与推理服务商占比上升","body":"Nikunj Kothari 从子处理者清单观察到多模型与推理服务商采用增加，并提醒清单滞后。","claimType":"single_source","sourcePerspective":"Nikunj Kothari","titleReview":{"id":"nov13-16","text":"803 家公司清单观察：多模型与推理服务商占比上升","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120669243918418237","quote":"I scraped 803 companies sub-processors to investigate what AI native companies are using for their infrastructure.. \n\nSome interesting findings from the last time I did this in March:\n\n> 44% of companies list two+ model providers (up from 33%). Small n, but Anthropic grew twice as fast as OpenAI. \n\n> 86 pairs where each company names the other as a subprocessor (@AnthropicAI + @Cloudflare, @vercel + @spacexai)\n\n> 33% of companies list an inference provider (up from 22%). @modal continues to crush. \n\n> Chinese models are primarily coming through video (think Bytedance) rather than text (at least on the subprocessor lists)\n\n> @typesafeai is the breakout hit, going from 0 to many companies in a short period. \n\nCaveat: subprocessor lists tend to be a lagging indicator, but a sure shot way of knowing if the company is using something. \n\nYou can find all the updated data, design and insights at deploygraph dot com. Feedback welcome!"}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"},"evidence":[{"sourceId":"x:2120669243918418237","attribution":"Nikunj Kothari","quote":"Caveat: subprocessor lists tend to be a lagging indicator, but a sure shot way of knowing if the company is using something.","translation":"注意：子处理者清单通常是滞后指标，但作者认为它能可靠说明公司是否使用某项服务。","url":"https://x.com/nikunj/status/2120669243918418237"}],"detail":{"sources":[{"sourceId":"x:2120669243918418237","blocks":[{"type":"paragraph","sentences":[{"id":"nov13-10","text":"Nikunj Kothari 抓取了 803 家公司的子处理者清单，研究 AI 原生企业的基础设施，并与自己三月做的同类观察比较。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120669243918418237","quote":"I scraped 803 companies sub-processors to investigate what AI native companies are using for their infrastructure.. \n\nSome interesting findings from the last time I did this in March:"}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-11","text":"列出至少两家模型供应商的公司占 44%，此前为 33%；他另称 Anthropic 的增长速度为 OpenAI 的两倍，但明确提醒相关样本量较小。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120669243918418237","quote":"> 44% of companies list two+ model providers (up from 33%). Small n, but Anthropic grew twice as fast as OpenAI. "}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-12","text":"他发现 86 对公司互相把对方列为子处理者，举例包括 Anthropic 与 Cloudflare、Vercel 与 spacexai。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120669243918418237","quote":"> 86 pairs where each company names the other as a subprocessor (@AnthropicAI + @Cloudflare, @vercel + @spacexai)"}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-13","text":"列出推理服务商的公司占 33%，此前为 22%；作者对 Modal 的表现评价积极。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120669243918418237","quote":"> 33% of companies list an inference provider (up from 22%). @modal continues to crush. "}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-14","text":"按这些清单所能观察到的情况，中国模型主要经视频而非文本进入，举例为 Bytedance；他还称 typesafeai 从零起步，短期内出现在多家公司清单中，但没有给出具体家数。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120669243918418237","quote":"> Chinese models are primarily coming through video (think Bytedance) rather than text (at least on the subprocessor lists)\n\n> @typesafeai is the breakout hit, going from 0 to many companies in a short period. "}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-15","text":"他提醒子处理者清单往往滞后，同时把它视为判断公司是否使用某服务的可靠线索，并将更新数据、设计与分析指向 deploygraph dot com。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120669243918418237","quote":"Caveat: subprocessor lists tend to be a lagging indicator, but a sure shot way of knowing if the company is using something. \n\nYou can find all the updated data, design and insights at deploygraph dot com. Feedback welcome!"}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]}],"coverageReview":{"details":"逐项保留803家、44%/33%、86对、33%/22%、双方示例、中国模型视频路径及typesafeai观察。","limitations":"保留小样本和滞后限制，不把清单比例写成流量份额，不把增长两倍解释成绝对采用量两倍。","omissions":"省去征求私信反馈，保留数据站名但不猜外链URL。"}}],"editorial":[{"id":"nov13-17","text":"这些数字反映清单中出现的供应商，而非调用量、收入或实时市场份额；原帖的滞后提醒，是使用这组观察时的重要边界。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2120669243918418237","quote":"I scraped 803 companies sub-processors to investigate what AI native companies are using for their infrastructure.. \n\nSome interesting findings from the last time I did this in March:\n\n> 44% of companies list two+ model providers (up from 33%). Small n, but Anthropic grew twice as fast as OpenAI. \n\n> 86 pairs where each company names the other as a subprocessor (@AnthropicAI + @Cloudflare, @vercel + @spacexai)\n\n> 33% of companies list an inference provider (up from 22%). @modal continues to crush. \n\n> Chinese models are primarily coming through video (think Bytedance) rather than text (at least on the subprocessor lists)\n\n> @typesafeai is the breakout hit, going from 0 to many companies in a short period. \n\nCaveat: subprocessor lists tend to be a lagging indicator, but a sure shot way of knowing if the company is using something. \n\nYou can find all the updated data, design and insights at deploygraph dot com. Feedback welcome!"}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]}},{"tag":"实践","title":"Aditya Agarwal 区分 AI 扩散与科学前沿创业","body":"Aditya Agarwal 区分贴近业务工作的 AI 扩散，以及通过科学进展形成产品的创业路线。","claimType":"single_source","sourcePerspective":"Aditya Agarwal","titleReview":{"id":"nov13-25","text":"Aditya Agarwal 区分 AI 扩散与科学前沿创业","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120578134177464356","quote":"There are basically two kinds of companies to build right now.\n\n1. Diffusion of AI\nThis is the \"vertical SaaS\" of today. There are a bunch of different models for it (FDE company, rollup, horizontal product) but ultimately it all boils down to the same thing: get AI diffused very close to where the work is being done.\n\nProfound, Cognition, Harvey etc. A lot of great companies will get built here.\n\n2. Frontier of AI\nThis is where the really interesting action is. Use AI to accelerate scientific progress, then build products from that progress.\n\nIt is a harder category to see. But we are seeing a lot more of it at @spc:\n\n- Externa is adding hundreds of new chemical building blocks to proteins, so you can engineer a drug to match the disease instead of settling for what nature gave you.\n\n- Epana Bio is using genomics and AI to design autoimmune therapies that go after the cellular origin of the disease.\n\n- VenomicsAI is doing AI-accelerated drug discovery from venoms.\n\n- Equivariant is doing multi-physics modeling for the semiconductor industry.\n\n(There are always picks-and-shovels for AI as well. Lots of amazing companies in that category.)\n\nCategory 2 is not well understood or much talked about externally. It should be because I think that is where the vast majority of model driven returns will come from."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"},"evidence":[{"sourceId":"x:2120578134177464356","attribution":"Aditya Agarwal","quote":"Use AI to accelerate scientific progress, then build products from that progress.","translation":"用 AI 加速科学进展，再从这些进展中构建产品。","url":"https://x.com/adityaag/status/2120578134177464356"}],"detail":{"sources":[{"sourceId":"x:2120578134177464356","blocks":[{"type":"paragraph","sentences":[{"id":"nov13-18","text":"Aditya Agarwal 把当前 AI 创业大体分为两个方向：将 AI 扩散到工作现场，以及利用 AI 推进科学前沿。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120578134177464356","quote":"There are basically two kinds of companies to build right now.\n\n1. Diffusion of AI\nThis is the \"vertical SaaS\" of today. There are a bunch of different models for it (FDE company, rollup, horizontal product) but ultimately it all boils down to the same thing: get AI diffused very close to where the work is being done.\n\nProfound, Cognition, Harvey etc. A lot of great companies will get built here.\n\n2. Frontier of AI\nThis is where the really interesting action is. Use AI to accelerate scientific progress, then build products from that progress.\n\nIt is a harder category to see. But we are seeing a lot more of it at @spc:\n\n- Externa is adding hundreds of new chemical building blocks to proteins, so you can engineer a drug to match the disease instead of settling for what nature gave you.\n\n- Epana Bio is using genomics and AI to design autoimmune therapies that go after the cellular origin of the disease.\n\n- VenomicsAI is doing AI-accelerated drug discovery from venoms.\n\n- Equivariant is doing multi-physics modeling for the semiconductor industry.\n\n(There are always picks-and-shovels for AI as well. Lots of amazing companies in that category.)\n\nCategory 2 is not well understood or much talked about externally. It should be because I think that is where the vast majority of model driven returns will come from."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-19","text":"第一类是“AI 的扩散”：类似今天的垂直 SaaS，可以采取 FDE 公司、收购整合或横向产品等形式，核心是把 AI 带到实际工作发生的位置；他列举 Profound、Cognition 和 Harvey。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120578134177464356","quote":"1. Diffusion of AI\nThis is the \"vertical SaaS\" of today. There are a bunch of different models for it (FDE company, rollup, horizontal product) but ultimately it all boils down to the same thing: get AI diffused very close to where the work is being done.\n\nProfound, Cognition, Harvey etc. A lot of great companies will get built here."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-20","text":"第二类是“AI 的前沿”：先用 AI 加速科学进展，再把进展转为产品；他认为这一类更难被外界看见，却在 SPC 看到更多案例。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120578134177464356","quote":"2. Frontier of AI\nThis is where the really interesting action is. Use AI to accelerate scientific progress, then build products from that progress.\n\nIt is a harder category to see. But we are seeing a lot more of it at @spc:"}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-21","text":"他列举 Externa 为蛋白质增加数百种新的化学构件，以便按疾病需求设计药物，而非只接受天然已有的构件。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120578134177464356","quote":"- Externa is adding hundreds of new chemical building blocks to proteins, so you can engineer a drug to match the disease instead of settling for what nature gave you."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-22","text":"Epana Bio 的方向是结合基因组学与 AI，设计针对疾病细胞起源的自身免疫疗法；VenomicsAI 则从毒液出发做 AI 加速药物发现。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120578134177464356","quote":"- Epana Bio is using genomics and AI to design autoimmune therapies that go after the cellular origin of the disease.\n\n- VenomicsAI is doing AI-accelerated drug discovery from venoms."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-23","text":"Equivariant 为半导体行业做多物理场建模；此外，他也认可为 AI 提供工具和基础设施的公司这一类别。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120578134177464356","quote":"- Equivariant is doing multi-physics modeling for the semiconductor industry.\n\n(There are always picks-and-shovels for AI as well. Lots of amazing companies in that category.)"}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]},{"type":"paragraph","sentences":[{"id":"nov13-24","text":"他判断第二类尚未得到充分理解和讨论，并预计绝大多数模型驱动的回报会来自这里；这是投资判断，不是上述项目已经取得的收益或临床效果。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120578134177464356","quote":"Category 2 is not well understood or much talked about externally. It should be because I think that is where the vast majority of model driven returns will come from."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]}],"coverageReview":{"details":"保留两种分类及原始顺序、FDE/收购整合/横向产品、三个扩散案例、四个科学案例与工具基础设施补充。","limitations":"项目方向按作者描述整理，不暗示药效验证、商业成功或投资回报已实现。","omissions":"省去强调兴奋程度的修辞，不补项目外链或研究数据。"}}],"editorial":[{"id":"nov13-26","text":"两条路线的区分在于产品从哪里来：一条把 AI 带入已有工作，一条先推动科学进展再形成产品；作者对后者回报的判断仍属于预期。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2120578134177464356","quote":"There are basically two kinds of companies to build right now.\n\n1. Diffusion of AI\nThis is the \"vertical SaaS\" of today. There are a bunch of different models for it (FDE company, rollup, horizontal product) but ultimately it all boils down to the same thing: get AI diffused very close to where the work is being done.\n\nProfound, Cognition, Harvey etc. A lot of great companies will get built here.\n\n2. Frontier of AI\nThis is where the really interesting action is. Use AI to accelerate scientific progress, then build products from that progress.\n\nIt is a harder category to see. But we are seeing a lot more of it at @spc:\n\n- Externa is adding hundreds of new chemical building blocks to proteins, so you can engineer a drug to match the disease instead of settling for what nature gave you.\n\n- Epana Bio is using genomics and AI to design autoimmune therapies that go after the cellular origin of the disease.\n\n- VenomicsAI is doing AI-accelerated drug discovery from venoms.\n\n- Equivariant is doing multi-physics modeling for the semiconductor industry.\n\n(There are always picks-and-shovels for AI as well. Lots of amazing companies in that category.)\n\nCategory 2 is not well understood or much talked about externally. It should be because I think that is where the vast majority of model driven returns will come from."}],"reviewNote":"对照本段原文，保留作者视角、数字口径和限定；没有外推为普遍已证实事实。"}]}}],"matters":[{"kind":"产品","title":"Tabletop 把共享资料变成可操作的活动空间","detail":"Google Labs 发布 Tabletop 实验：将链接和文件放入共享空间、邀请同伴，再按需生成旅行地图、晚餐决策转盘、匹克球对阵表、周边投票或可拖拽座位图。候补名单目前限美国、18 岁以上用户。","sourceId":"x:2120549258692882702","url":"https://x.com/GoogleLabs/status/2120549258692882702"},{"kind":"创作","title":"Mariko Mori 用 Claude 编码制作展览动画","detail":"Claude 官方介绍，艺术家 Mariko Mori 在回顾展“All That Shines”中，使用 Claude 编写计算机生成动画的代码，并将其作为新的视频装置呈现；原帖未提供制作流程或效果评测。","sourceId":"x:2120669165316915259","url":"https://x.com/claudeai/status/2120669165316915259"},{"kind":"工程","title":"fx 启动基准对照高度优化的纯汇编版本","detail":"Guillermo Rauch 介绍，团队用一个高度优化的纯汇编 fx.s 版本与 fx 启动过程做基准对比。采集文字未给出耗时或胜负，不据此声称性能提升。","sourceId":"x:2120598652825809186","url":"https://x.com/rauchg/status/2120598652825809186","images":[{"src":"assets/digest/2026-11-13/19ef3a66e24c6fb8d77f7815.jpg","originalUrl":"https://pbs.twimg.com/media/HW3hFeAa4AAw_Rd.jpg","sourceUrl":"https://x.com/rauchg/status/2120598652825809186","attribution":"Guillermo Rauch","sha256":"5e0f074b2a0fb16249f05e21272d9f02923fc35e73631055e48a7776c8e08893","width":1199,"height":711,"mediaId":"19ef3a66e24c6fb8d77f7815","alt":"fx.s 纯汇编启动对照程序的代码片段与注释。"}]},{"kind":"实践","title":"Rauch 提醒产品工作仍需要人的专注与投入","detail":"Guillermo Rauch 强调，创造出色产品仍需要大量人类专注、努力、动力、热爱及持续注意力；这是产品实践立场，不是可量化的生产率结论。","sourceId":"x:2120601000176439478","url":"https://x.com/rauchg/status/2120601000176439478"}],"articles":{"blogs":[],"podcasts":[{"title":"自动化之后，团队如何把 AI 的可能性变成行动","sourceTitle":"A New Vision for Human Work After Automation","sourceId":"flightcast:01M717KBM0K828PAMMP3ZPWV8P","sourceUrl":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL","sourceName":"AI & I by Every","author":"Dan Shipper","publishedAt":"2026-11-11T15:30:00.000Z","linkScope":"playlist","sourceTextSha256":"bcf3a64887721bcbd21131f25a37a03bb6c9df49544daf4537eff9854650d1c4","blocks":[{"type":"paragraph","text":"在 Every 的这场演讲中，Dan Shipper 回答的问题不是模型还能完成多少任务，而是自动化之后，人怎样继续做出有价值的工作。他提出两种观察未来的方式：汇集大量数据、延长趋势线，或走近一个真实案例，理解其中交错的责任、经验和选择。前者显示能力进步，后者帮助看清人如何使用这些能力。"},{"type":"heading","text":"能力曲线为何会动摇人的工作认同"},{"type":"paragraph","text":"Dan 先解释 GDPval：专家从真实工作中选任务并写成详细提示，让模型与不使用 AI 的人分别完成，再由专家盲评。按演讲中的转述，AI 胜出比例由 2024 年的 12.4%，经 2025 年的 47.6%，上升到 2026 年约 83%。这些是他用来说明趋势的数字，并非本篇独立核实的基准结果；他关于基准可能已经饱和的说法也是个人判断。"},{"type":"paragraph","text":"他自己的经历让这条曲线变得具体。一周的会议间隙，他分析季度客户调查，制作让同事比拼客户理解的实时游戏，发现向团队销售 Every 的机会，接着搭建 CRM 并联系客户。他把这些任务对应到过去的数据科学、游戏开发、产品营销、工程和销售拓展工作，估计相当于五个人、约 20 万美元的投入；这是帮助理解能力变化的类比，不是实际成本审计。"},{"type":"paragraph","text":"当人把身份与工作内容联系起来，看见模型做出相似成果，就可能感到自身价值被动摇。Dan 称之为行动主体感的断裂，但不认为汇总曲线足以回答所有问题。他回顾自己在 2022 年使用 GPT-3 的感受：亲手使用让他看到的，不只是岗位替代，也包括个体未来获得类似团队规模的能力。"},{"type":"heading","text":"同一份调查，为什么仍需要一个团队"},{"type":"paragraph","text":"问题随后回到 Every：如果自己已能指挥 agent 完成这么多工作，为什么公司仍有约三十人的团队？他把同一份季度调查开放给同事，大家也能使用相同模型，但结果不是一组默认答案的复制。"},{"type":"paragraph","text":"Dan 找到团队销售机会，增长工程师 Yash 关注到首月订阅者因邮件太多而流失，营销负责人 Douglas 看见读者的孤独感——他们热爱 AI，身边人却往往不理解；资深编辑 Jack 把调查做成黏土动画风格的问答节目。默认提示下，Claude 也能指出写作、产品组合和信息量的问题，Dan 并不否认这些见解成立，但认为人人都能得到的默认答案不再稀缺。"},{"type":"paragraph","text":"这些分析还发生在筹备会议的繁忙期间。Yash 不只提出问题，还写了修改代码的 PR，同时参与直播体验建设。Dan 借此强调，价值不止是说出一条见解，还包括把注意力放到具体责任上，并推动行动。"},{"type":"heading","text":"生成候选与挑选答案不是同一件事"},{"type":"paragraph","text":"他预先回应了一个反问：能不能直接提示 Claude，让它生成同事会提出的想法？团队评测负责人 Mike Taylor 做过预测 Dan 的 Slack 回复的实验。每题允许模型给出 400 个答案时，约 93% 的情况下其中包含类似 Dan 的回答；但让模型自己排序，Dan 的答案只有约 60% 的情况下进入前 10%。这说明的是这次实验里的候选覆盖与排序差异，而非所有模型和任务的通用成功率。"},{"type":"paragraph","text":"Dan 将其归纳为：生成变便宜，筛选仍困难。每个人在团队中的责任先缩小搜索范围，再由自己的经验与视角挑出值得推进的发现。一个团队因此能沿不同方向探索同一份材料，并有人对选中的方向负责；这与只向模型问一句“你看到了什么”不同。"},{"type":"heading","text":"比较未来模型时，不应把人冻结在过去"},{"type":"paragraph","text":"Dan 承认，模型的排序能力很可能继续提高。但他认为，用 2027 年的模型对比停留在 2026 年的 Yash，本身就不完整：未来的 Yash 也会积累新经验、使用新模型。即使另一边是持续运行的 agent，也有人决定如何启动和组织它。"},{"type":"paragraph","text":"于是，他真正想比较的是带着经验与责任使用模型的人，以及默认配置下的模型。当先进能力普及，默认答案会成为新的底线；独特视角带来的优势也可能被下一代能力吸收，但使用者同样可以继续学习和利用新能力。这是一种关于工作未来的解释，不构成所有职业都不会被替代的证明。"},{"type":"heading","text":"从掌握答案转向分配智能与检验结果"},{"type":"paragraph","text":"他把这种工作方式称为 allocation economy：人不只靠知道多少东西被评价，还要能够分配智能资源，安排模型工作，并确保结果完成得好。由此，他建议改变部分评测问题：除了问模型是否擅长大家都认可、容易验证的数学或编程题，也要问它能否从自己的视角完成自己的工作。"},{"type":"paragraph","text":"这不是否认能力基准，而是补足其观察范围。汇总指标说明共同能力如何上升，深入具体实践则展示人在新能力之上能建造什么、承担什么责任，以及自身怎样变化。演讲最终落回同一个观点：模型进步可以是被人使用的资源，而人的视角与行动仍需要在真实工作里检验。"}]}]},"quality":{"collected":33,"collectedTweets":32,"used":8,"usedTweets":7,"uniqueAuthors":7,"imageCount":1,"claimAudit":{"reviewMode":"editorial review plus structural checks; not automated proof of meaning","claimsReviewed":28,"warnings":[]},"status":"degraded","warnings":["Media unverified: podcasts:flightcast:01M717KBM0K828PAMMP3ZPWV8P (feed_has_no_media_or_supported_post_locator)","Media unverified: x:2120601000176439478 (budget_exhausted)"]},"contentSchemaVersion":2,"sourceSnapshotSha256":"7cf57214358720d3ee8c6d04f4bae7164295c938d5a40a3c914a2a682f859c85","selection":{"sources":[{"sourceId":"x:2120640864787841513","decision":"excluded","reason":"活动实况、节目预告或身份澄清，未包含可展开的构建实践。"},{"sourceId":"x:2120640558184206508","decision":"excluded","reason":"活动实况、节目预告或身份澄清，未包含可展开的构建实践。"},{"sourceId":"x:2120582147107078356","decision":"excluded","reason":"活动实况、节目预告或身份澄清，未包含可展开的构建实践。"},{"sourceId":"x:2120622974277734716","decision":"excluded","reason":"泛化推荐依赖未采集的引用帖，无法确认对象。"},{"sourceId":"x:2120410480204525936","decision":"excluded","reason":"额度重置预告，没有正式可用性与规则细节。"},{"sourceId":"x:2120410006273380750","decision":"excluded","reason":"额度重置预告，没有正式可用性与规则细节。"},{"sourceId":"x:2120726673452933269","decision":"excluded","reason":"涉及个人争议且缺少核实材料，与本期构建实践无关。"},{"s edAt":"2026-11-11T19:12:06.000Z","url":"https://x.com/GoogleLabs/status/2120595442782368240","likes":100,"retweets":12,"replies":8},{"text":"🚨 NEW LABS EXPERIMENT 🚨 Introducing Tabletop 🎲— our newest experiment built to get your crew from \"we should totally do that\" to \"we’re actually doing this.\" Drop links and files into one shared space, add your crew, and ask Tabletop for whatever you need to create custom spaces on the fly: 🗺️ Interactive road trip maps & dinner-decider wheels 🏆 Live pickleball brackets & merch voting boards 🪑 Drag-and-drop seating charts (so you don’t get stuck next to your boss) Pull up a chair and join the waitlist (US, 18+):","createdAt":"2026-11-11T16:08:35.000Z","url":"https://x.com/GoogleLabs/status/2120549258692882702","likes":1113,"retweets":93,"replies":43}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Why are old stories that were not even covered up all that well become sudden international and geopolitical news? The timing is suspicious, so worth asking: who benefits and why now? If Jensen, the premier champion of open models, is taken out then anyone who wants AI closed, centralized, and controlled might benefit. Why now? The midterms seem relevant. But also perhaps the upcoming IPOs.","createdAt":"2026-11-12T00:15:41.000Z","url":"https://x.com/amasad/status/2120671838909194695","likes":3430,"retweets":389,"replies":183}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"PSA: creating wonderful products still requires extraordinary amounts of human focus, effort, motivation, and love. And an attention span.","createdAt":"2026-11-11T19:34:11.000Z","url":"https://x.com/rauchg/status/2120601000176439478","likes":3292,"retweets":374,"replies":237},{"text":"We have a benchmark that makes 𝚏𝚡 bootup compete with an ultra-optimized pure-assembly 𝚏𝚡.𝚜 version 😂","createdAt":"2026-11-11T19:24:52.000Z","url":"https://x.com/rauchg/status/2120598652825809 ence forgets the technology\"","createdAt":"2026-11-11T08:14:35.000Z","url":"https://x.com/zarazhangrui/status/2120429971718156375","likes":49,"retweets":2,"replies":7}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"@grok can you transcribe the message here?","createdAt":"2026-11-12T06:05:44.000Z","url":"https://x.com/nikunj/status/2120759932370944188","likes":1,"retweets":0,"replies":1},{"text":"RFS (request for startups) from a stealth portfolio founder.. I really like all of these ideas. If you are working on any of these, please DM me!","createdAt":"2026-11-12T05:45:00.000Z","url":"https://x.com/nikunj/status/2120754714296172923","likes":15,"retweets":0,"replies":3},{"text":"I scraped 803 companies sub-processors to investigate what AI native companies are using for their infrastructure.. Some interesting findings from the last time I did this in March: > 44% of companies list two+ model providers (up from 33%). Small n, but Anthropic grew twice as fast as OpenAI. > 86 pairs where each company names the other as a subprocessor (@AnthropicAI + @Cloudflare, @vercel + @spacexai) > 33% of companies list an inference provider (up from 22%). @modal continues to crush. > Chinese models are primarily coming through video (think Bytedance) rather than text (at least on the subprocessor lists) > @typesafeai is the breakout hit, going from 0 to many companies in a short p…","createdAt":"2026-11-12T00:05:22.000Z","url":"https://x.com/nikunj/status/2120669243918418237","likes":32,"retweets":1,"replies":13}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"reading some of these comments makes my brain hurt. oss is already hard enough without politics.","createdAt":"2026-11-12T02:52:21.000Z","url":"https://x.com/steipete/status/2120711266759258616","likes":309,"retweets":10,"replies":19}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"I look at what I do with Fable 5.2 in the cracks of my week and think: this would've taken five people and $200,000. Then I look at what my team does with the same AI. Last week, between meetings, I analyzed our customer survey, made a game for our team, spotted an opportunity to sell @Every to teams, built a CRM, and started reaching out. Look at that and you might ask: Why would I need a team at all? The chart seems to agree. On OpenAI's GDPval benchmark, AI went from beating human experts 12.4% of the time in 2024 to around 83% in 2026. That's the aggregate view of the future of work: gather a lot of data and extrapolate a trend line. But the aggregate misses something. To see it, you ha…","createdAt":"2026-11-11T15:30:00.000Z","url":"https://x.com/danshipper/status/2120539547620790424","likes":118,"retweets":13,"replies":42},{"text":"this week @every","createdAt":"2026-11-11T15:16:09.000Z","url":"https://x.com/danshipper/status/2120536060413268386","likes":14,"retweets":1,"replies":0}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"It has been such a pleasure to partner with Rox from the earliest days. I have also learnt a lot about what it means to run a company at AI-pace from @ishanmkh. His talk at our recent founder retreat was incredible.","createdAt":"2026-11-11T21:02:56.000Z","url":"https://x.com/adityaag/status/2120623334555791504","likes":26,"retweets":3,"replies":0},{"text":"There are basically two kinds of companies to build right now. 1. Diffusion of AI This is the \"vertical SaaS\" of today. There are a bunch of different models for it (FDE company, rollup, horizontal product) but ultimately it all boils down to the same thing: get AI diffused very close to where the work is being done. Profound, Cognition, Harvey etc. A lot of great companies will get built here. 2. Frontier of AI This is where the really interesting action is. Use AI to accelerate scientific progress, then build products from that progress. It is a harder category to see. But we are seeing a lot more of it at @spc: - Externa is adding hundreds of new chemical building blocks to proteins, so…","createdAt":"2026-11-11T18:03:20.000Z","url":"https://x.com/adityaag/status/2120578134177464356","likes":240,"retweets":25,"replies":21}]},{"name":"Claude","handle":"claudeai","bio":"Claude is an AI assistant built by @anthropicai to be safe, accurate, and secure. Talk to Claude on or download the app.","tweets":[{"text":"Mariko Mori has pushed the boundaries of art for three decades. For her retrospective \"All That Shines,\" she used Claude to write code for a computer-generated animation, presented as a new video installation.","createdAt":"2026-11-12T00:05:03.000Z","url":"https://x.com/claudeai/status/2120669165316915259","likes":3408,"retweets":206,"replies":183}]}]},"errors":[],"partial":false},{"date":"2026-11-12","dateLabel":"2026年11月12日","generatedAt":"2026-11-12T00:00:00+08:00","sourceGeneratedAt":"2026-11-11T06:28:17.628Z","stats":{"podcastEpisodes":1,"xBuilders":15,"totalTweets":32,"blogPosts":0},"highlights":[{"tag":"实践","title":"Dan Shipper 试用 Carbon：编程进步明显，写作暂不换用","body":"Dan Shipper 的首日试用显示 Carbon 更适合大型编程和音视频任务，但仍需明确终点与人工审阅。","claimType":"single_source","sourcePerspective":"Dan Shipper","titleReview":{"id":"nov12-19","text":"Dan Shipper 试用 Carbon：编程进步明显，写作暂不换用","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120187507396530309","quote":"BREAKING:\n\n@Google just dropped Gemini 4 Carbon. It’s a much better coder than Argon—but I’m probably keeping Argon for writing.\n\nWe’ve been testing it at @every across coding, writing, design, and knowledge work. It can work for hours on an ambitious project, but it doesn’t always know when to stop.\n\nHere’s your day-zero vibe check:\n\n• Coding: On one run of our Senior Engineer benchmark, Carbon scored 44%, versus Argon’s 21%. A big improvement, though still middle of the pack. In a separate test, @hammer_mt gave it a backlog to work through. It identified 6 tasks as ready, then did 15—including work someone else was already doing. He stopped it after almost 4.5 hours.\n\n• Big builds: @RandyCounsman gave it 3D scans of our podcast studio and an equipment list. In one attempt, it built a browser-based model accurate enough to check whether new gear would fit without getting into the shot. He estimates Carbon also wrote about 95% of a big update to Everycut, our internal video editor.\n\n• Code quality: @kieranklaassen values its tests and documentation on large projects, including its record of approaches it considered and rejected. Fable remains his first choice, but Carbon has earned a place alongside it. The catch: It can produce huge files where Fable keeps things more modular.\n\n• Audio and video: Randy found it caught audio editing issues other models missed. Kieran handed it a recorded meeting and asked for shorts. It came back with 6 titled clips.\n\n• Design: @jackcheng got a hyperrealistic ginkgo-leaf app icon with details other models struggle with. Objects and 3D scenes look better than Argon’s. Interfaces split the team: Jack and Randy kept getting boxes within boxes, while @TylerNishida liked its ideas for new interfaces. Kieran says giving it design guidance makes a big difference.\n\n• Writing: Our editorial benchmark put Carbon and Argon about even. If you like Argon, you’ll probably like Carbon. But Carbon costs more, and I haven’t seen enough improvement to justify switching.\n\nMy Reach Test: 🟨 I’ll use it sometimes.\n\nGive it one big job with a clear finish line, and review what comes back. It’s also worth trying as a second opinion, especially on audio and video.\n\nFull vibe check coming soon: https://t.co/Ch2pNl9Po5"}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"},"evidence":[{"sourceId":"x:2120187507396530309","quote":"Give it one big job with a clear finish line, and review what comes back.","translation":"给它一项终点明确的大任务，并审阅返回的结果。","attribution":"Dan Shipper","url":"https://x.com/danshipper/status/2120187507396530309"}],"detail":{"sources":[{"sourceId":"x:2120187507396530309","blocks":[{"type":"paragraph","sentences":[{"id":"nov12-1","text":"Dan Shipper 的首日试用判断是：Carbon 编程能力明显优于 Argon，但写作仍倾向保留 Argon；Every 团队跨编程、写作、设计和知识工作测试，发现它能持续工作数小时，却不总能自行停下。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120187507396530309","quote":"BREAKING:\n\n@Google just dropped Gemini 4 Carbon. It’s a much better coder than Argon—but I’m probably keeping Argon for writing.\n\nWe’ve been testing it at @every across coding, writing, design, and knowledge work. It can work for hours on an ambitious project, but it doesn’t always know when to stop.\n\n"}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]},{"type":"heading","text":"编程","originalHeading":"Coding","review":{"id":"nov12-2","text":"编程","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120187507396530309","quote":"• Coding: On one run of our Senior Engineer benchmark, Carbon scored 44%, versus Argon’s 21%. A big improvement, though still middle of the pack. In a separate test, @hammer_mt gave it a backlog to work through. It identified 6 tasks as ready, then did 15—including work someone else was already doing. He stopped it after almost 4.5 hours."}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}},{"type":"paragraph","sentences":[{"id":"nov12-3","text":"在一次 Senior Engineer 基准运行中，Carbon 得分 44%，Argon 为 21%；作者强调进步虽大，仍属中游。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120187507396530309","quote":"On one run of our Senior Engineer benchmark ary","reviewedAs":"supported","basis":[{"sourceId":"x:2120187507396530309","quote":" 🟨 I’ll use it sometimes.\n\nGive it one big job with a clear finish line, and review what comes back. It’s also worth trying as a second opinion, especially on audio and video.\n\nFull vibe check coming soon: https://t.co/Ch2pNl9Po5"}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]}],"coverageReview":{"details":"保留六个原有分项、44%/21%单次基准、6项变15项、4.5小时、工作室模型、95%估计及6段视频。","limitations":"均为团队首日试用；数字不是普遍成功率，95%为估计，设计评价分歧及写作成本限制均保留。","omissions":"省去发帖修辞、社交账号标记和文末预告链接，不补外链内容。"}}],"editorial":[{"id":"nov12-20","text":"这份试用报告支持按任务选择模型：编程表现提升，并不代表写作也值得付出切换成本；长时间执行还需要明确收尾条件。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2120187507396530309","quote":"BREAKING:\n\n@Google just dropped Gemini 4 Carbon. It’s a much better coder than Argon—but I’m probably keeping Argon for writing.\n\nWe’ve been testing it at @every across coding, writing, design, and knowledge work. It can work for hours on an ambitious project, but it doesn’t always know when to stop.\n\nHere’s your day-zero vibe check:\n\n• Coding: On one run of our Senior Engineer benchmark, Carbon scored 44%, versus Argon’s 21%. A big improvement, though still middle of the pack. In a separate test, @hammer_mt gave it a backlog to work through. It identified 6 tasks as ready, then did 15—including work someone else was already doing. He stopped it after almost 4.5 hours.\n\n• Big builds: @RandyCounsman gave it 3D scans of our podcast studio and an equipment list. In one attempt, it built a browser-based model accurate enough to check whether new gear would fit without getting into the shot. He estimates Carbon also wrote about 95% of a big update to Everycut, our internal video editor.\n\n• Code quality: @kieranklaassen values its tests and documentation on large projects, including its record of approaches it considered and rejected. Fable remains his first choice, but Carbon has earned a place alongside it. The catch: It can produce huge files where Fable keeps things more modular.\n\n• Audio and video: Randy found it caught audio editing issues other models missed. Kieran handed it a recorded meeting and asked for shorts. It came back with 6 titled clips.\n\n• Design: @jackcheng got a hyperrealistic ginkgo-leaf app icon with details other models struggle with. Objects and 3D scenes look better than Argon’s. Interfaces split the team: Jack and Randy kept getting boxes within boxes, while @TylerNishida liked its ideas for new interfaces. Kieran says giving it design guidance makes a big difference.\n\n• Writing: Our editorial benchmark put Carbon and Argon about even. If you like Argon, you’ll probably like Carbon. But Carbon costs more, and I haven’t seen enough improvement to justify switching.\n\nMy Reach Test: 🟨 I’ll use it sometimes.\n\nGive it one big job with a clear finish line, and review what comes back. It’s also worth trying as a second opinion, especially on audio and video.\n\nFull vibe check coming soon: https://t.co/Ch2pNl9Po5"}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]}},{"tag":"实践","title":"Aaron Levie：agent 群的机会在数字任务与工作组织","body":"Aaron Levie 预期 agent 群会扩大数字环境中的产出，并带来执行框架和业务部署机会。","claimType":"single_source","sourcePerspective":"Aaron Levie","titleReview":{"id":"nov12-26","text":"Aaron Levie：agent 群的机会在数字任务与工作组织","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120385739342897469","quote":"Agent swarms have the potential to drive yet another leap in output from AI. The impact will be a clear separation between teams that adopt this pattern of work and those that don’t. \n\nThe progression has roughly been: chat gave us quick turn AI responses that let us work a bit faster, but we were still rate limited by our interactions; then agents that can go off and complete entire tasks for us, accelerating hours or days of work into minutes; to now swarms of agents that are goal seeking and will find any route to the successful completion of a project, where there’s no inherent limit to the productivity gains. \n\nWe can imagine a future where, for any task in which value can be created within a self-contained digital environment, swarms will be able to complete the work faster than any other approach.\n\nEssentially any area where value creation is currently bound by the amount of research you can do, the amount of decisions made with a set of software tools, the amount of data processed or consumed, and the amount of code (or code adjacent) that can be generated. \n\nThis means swarms will play a big role in game development, coding, trading, life sciences research, IT automation, cyber, math breakthroughs, animation, and plenty of other areas of work that have these characteristics. \n\nThere’s a lot of opportunity to build the harnesses, applied AI products, and infrastructure for how these agents operate. And most importantly there’s a ton of opportunity for those that can wire up work in this way. It’s going to be an entire new field of FDE work available."}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"},"evidence":[{"sourceId":"x:2120385739342897469","quote":"We can imagine a future where, for any task in which value can be created within a self-contained digital environment, swarms will be able to complete the work faster than any other approach.","translation":"我们可以设想一个未来：对于能在自足数字环境中创造价值的任务，agent 群将比其他方式更快完成工作。","attribution":"Aaron Levie","url":"https://x.com/levie/status/2120385739342897469"}],"detail":{"sources":[{"sourceId":"x:2120385739342897469","blocks":[{"type":"paragraph","sentences":[{"id":"nov12-21","text":"Aaron Levie 认为 agent 群有潜力再次提高 AI 产出，并可能拉开采用这一工作方式与未采用团队之间的差距。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120385739342897469","quote":"Agent swarms have the potential to drive yet another leap in output from AI. The impact will be a clear separation between teams that adopt this pattern of work and those that don’t. "}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]},{"type":"paragraph","sentences":[{"id":"nov12-22","text":"他把演进分成三个阶段：聊天让响应更快，却仍受人的交互节奏约束；agent 可以独立完成任务，把数小时或数天的工作缩短；agent 群则围绕项目目标寻找完成路径，他认为其生产率增幅没有内在上限。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120385739342897469","quote":"The progression has roughly been: chat gave us quick turn AI responses that let us work a bit faster, but we were still rate limited by our interactions; then agents that can go off and complete entire tasks for us, accelerating hours or days of work into minutes; to now swarms of agents that are goal seeking and will find any route to the successful completion of a project, where there’s no inherent limit to the productivity gains. "}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]},{"type":"paragraph","sentences":[{"id":"nov12-23","text":"他设想的适用前提是价值能够在自足的数字环境中创造，尤其是产出受研究量、软件操作决策量、数据处理量，以及代码或类似产物生成量限制的任务。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120385739342897469","quote":"We can imagine a future where, for any task in which value can be created within a self-contained digital environment, swarms will be able to complete the work faster than any other approach.\n\nEssentially any area where value creation is currently bound by the amount of research you can do, the amount of decisions made with a set of software tools, the amount of data processed or consumed, and the amount of code (or code adjacent) that can be generated. "}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]},{"type":"paragraph","sentences":[{"id":"nov12-24","text":"他列举的领域包括游戏开发、编程、交易、生命科学研究、IT 自动化、网络安全、数学突破和动画；这些是其看好的方向，并非文中已验证的落地结果。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120385739342897469","quote":"This means swarms will play a big role in game development, coding, trading, life sciences research, IT automation, cyber, math breakthroughs, animation, and plenty of other areas of work that have these characteristics. "}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]},{"type":"paragraph","sentences":[{"id":"nov12-25","text":"相应机会既包括 agent 的执行框架、应用产品和基础设施，也包括把实际工作接入这种组织方式；他预计会出现新的前线部署工程（FDE）工作。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120385739342897469","quote":"There’s a lot of opportunity to build the harnesses, applied AI products, and infrastructure for how these agents operate. And most importantly there’s a ton of opportunity for those that can wire up work in this way. It’s going to be an entire new field of FDE work available."}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]}],"coverageReview":{"details":"保留聊天、单agent、agent群的演进，数字环境前提、四类瓶颈、八个领域与FDE机会。","limitations":"全篇是作者预测；不把生产率无内在上限或行业应用写成实测结果，引用帖正文缺失。","omissions":"省去重复强调机会的修辞，不猜测所引用帖的产品与表现。"}}],"editorial":[{"id":"nov12-27","text":"这里值得区分两层机会：制造 agent 工具，以及把具体业务组织成可由 agent 群执行的工作；作者同时看好两者，尚未提供收益验证。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2120385739342897469","quote":"Agent swarms have the potential to drive yet another leap in output from AI. The impact will be a clear separation between teams that adopt this pattern of work and those that don’t. \n\nThe progression has roughly been: chat gave us quick turn AI responses that let us work a bit faster, but we were still rate limited by our interactions; then agents that can go off and complete entire tasks for us, accelerating hours or days of work into minutes; to now swarms of agents that are goal seeking and will find any route to the successful completion of a project, where there’s no inherent limit to the productivity gains. \n\nWe can imagine a future where, for any task in which value can be created within a self-contained digital environment, swarms will be able to complete the work faster than any other approach.\n\nEssentially any area where value creation is currently bound by the amount of research you can do, the amount of decisions made with a set of software tools, the amount of data processed or consumed, and the amount of code (or code adjacent) that can be generated. \n\nThis means swarms will play a big role in game development, coding, trading, life sciences research, IT automation, cyber, math breakthroughs, animation, and plenty of other areas of work that have these characteristics. \n\nThere’s a lot of opportunity to build the harnesses, applied AI products, and infrastructure for how these agents operate. And most importantly there’s a ton of opportunity for those that can wire up work in this way. It’s going to be an entire new field of FDE work available."}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]}},{"tag":"实践","title":"Guillermo Rauch：agent 时代未必需要统一编程语言","body":"Guillermo Rauch 肯定 Rust，同时预期 agent 会推动专用语言与按场景使用底层语言。","claimType":"single_source","sourcePerspective":"Guillermo Rauch","titleReview":{"id":"nov12-31","text":"Guillermo Rauch：agent 时代未必需要统一编程语言","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120337388178379178","quote":"Rust is a superb language and ecosystem, especially given it was invented pre agentic coding.\n\nWith agents, new languages will blossom, even purpose-built ones for specific usecases, and discretionary C or even LLVM IR, assembly…\n\nAI is fluid. No more one-size-fits-all. https://t.co/YTwRelXWCW"}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"},"evidence":[{"sourceId":"x:2120337388178379178","quote":"Rust is a superb language and ecosystem, especially given it was invented pre agentic coding.","translation":"Rust 是出色的语言和生态，尤其考虑到它诞生于 agent 编程之前。","attribution":"Guillermo Rauch","url":"https://x.com/rauchg/status/2120337388178379178"}],"detail":{"sources":[{"sourceId":"x:2120337388178379178","blocks":[{"type":"paragraph","sentences":[{"id":"nov12-28","text":"Guillermo Rauch 首先肯定 Rust 的语言与生态，并强调它诞生于 agent 编程之前。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120337388178379178","quote":"Rust is a superb language and ecosystem, especially given it was invented pre agentic coding."}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]},{"type":"paragraph","sentences":[{"id":"nov12-29","text":"他预期 agent 会促成更多新语言，包括面向具体用途的专用语言，也可能按需采用 C、LLVM IR 或汇编。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120337388178379178","quote":"With agents, new languages will blossom, even purpose-built ones for specific usecases, and discretionary C or even LLVM IR, assembly…"}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]},{"type":"paragraph","sentences":[{"id":"nov12-30","text":"他的立场是 AI 具有灵活性，不再需要一套语言适用于所有场景。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2120337388178379178","quote":"AI is fluid. No more one-size-fits-all."}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]}],"coverageReview":{"details":"保留对Rust的肯定，以及专用语言、C、LLVM IR、汇编的完整列举。","limitations":"新语言繁荣属于预测；没有基准、迁移方案或引用帖全文。","omissions":"仅去掉短链接，不补写引用帖内容。"}}],"editorial":[{"id":"nov12-32","text":"这是一种按任务选择语言的判断，而非放弃 Rust 的建议；原帖没有提供迁移成本或性能对比。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2120337388178379178","quote":"Rust is a superb language and ecosystem, especially given it was invented pre agentic coding.\n\nWith agents, new languages will blossom, even purpose-built ones for specific usecases, and discretionary C or even LLVM IR, assembly…\n\nAI is fluid. No more one-size-fits-all. https://t.co/YTwRelXWCW"}],"reviewNote":"逐句对照所列原文；保留作者判断、案例范围及限定，不扩展为一般事实。"}]}}],"matters":[{"kind":"产品","title":"Vercel 公布 Security Review 首周处理量","detail":"Guillermo Rauch 称，上线不足一周识别出 57,897 个漏洞，其中 6,029 个为严重或高危，14,665 个已由 Agent 修补；任意仓库均可启用，不限部署平台。这是厂商自报数据，帖中没有独立验证或修补正确率。","sourceId":"x:2120188488628977819","url":"https://x.com/rauchg/status/2120188488628977819"},{"kind":"产品","title":"听写快捷键兼容 Apple F5 专用按键","detail":"Nan Yu 介绍，听写功能可映射 Apple 听写键这一 F5 特殊变体，并支持按住说话、双击与单击快捷方式；他特别强调这些交互边界的处理。","sourceId":"x:2120203450223104012","url":"https://x.com/thenanyu/status/2120203450223104012","images":[{"src":"assets/digest/2026-11-12/5820e811c91f8688816a9c9a.jpg","originalUrl":"https://pbs.twimg.com/media/HWx5jbPa0AAich_.jpg","sourceUrl":"https://x.com/thenanyu/status/2120203450223104012","attribution":"Nan Yu","sha256":"8ba420a379680b35fc1b3b959ec1d58f629f9cfca65c9ee774465810b0dd45ed","width":1070,"height":400,"mediaId":"5820e811c91f8688816a9c9a","alt":"听写设置界面中，红圈标出映射到 Apple F5 听写键的单击快捷方式。"}]},{"kind":"产品","title":"Claude 交互式连接器支持在对话旁操作完整工具","detail":"Claude 宣布可在对话旁打开 Adobe、Atlassian 和 Box 的完整工具，用户可自行修改，也可让 Claude 一起操作；功能正向网页端和桌面端推出。","sourceId":"x:2120206375137484875","url":"https://x.com/claudeai/status/2120206375137484875"},{"kind":"产品","title":"Claude Data 面向付费计划正式开放","detail":"Claude Data（原 Dashboards）现面向付费计划正式开放；除仪表盘外，还可根据指标起草数据故事和带解说的视频，由用户审阅后分享。认证查询与实时分享仍为 beta。","sourceId":"x:2120206372478566799","url":"https://x.com/claudeai/status/2120206372478566799","images":[{"src":"assets/digest/2026-11-12/3f1f037c77678a77c5a2df0d.jpg","originalUrl":"https://pbs.twimg.com/media/HWx5bmVWUAInsnV.jpg","sourceUrl":"https://x.com/claudeai/status/2120206372478566799","attribution":"Claude","sha256":"31c24b955ff53c3561c2f18af1c3b53573087cc77aae8cdcf2726e731a32c80a","width":1200,"height":675,"mediaId":"3f1f037c77678a77c5a2df0d","alt":"Claude Data 的预订数据仪表盘与设计面板，展示数据故事、短视频和可视化分析选项。"}]},{"kind":"实践","title":"先分享进行中的作品，再判断是否值得完成","detail":"Zara Zhang 建议不要等作品完成或完美才分享；公开进行中的版本，有时能帮助判断是否值得继续完成。这是创作与受众建设建议，不是效果保证。","sourceId":"x:2120041030951297033","url":"https://x.com/zarazhangrui/status/2120041030951297033"}],"articles":{"blogs":[],"podcasts":[{"title":"Resend 的 agent 之路：从邮件体验到接口、分发与基础设施","sourceTitle":"Designing for Agents — Zeno Rocha, Resend","sourceId":"01a1c6f7-44d3-7eaf-95ea-cb9de51baff2","sourceUrl":"https://www.youtube.com/@LatentSpacePod","sourceName":"Latent Space","author":"Zeno Rocha","publishedAt":"2026-11-10T20:06:15.000Z","linkScope":"channel","sourceTextSha256":"6ab0be5f3204890b2b7d5939543460525d1a22d33a3b81fb59fa14fda2c3d630","blocks":[{"type":"paragraph","text":"在 Latent Space 这期访谈中，Resend 创始人 Zeno Rocha 从开发者邮件工具谈到 agent 入口、分发与公司经营。他原本做前端，并无邮件基础设施背景；创业出发点是，已有产品更多照顾营销人员，开发者仍缺少被认真服务的体验。他希望把邮件做成类似 Stripe 的开发者基础设施。"},{"type":"paragraph","text":"Rocha 自述，录制时 Resend 服务约 430 万用户、超过 12 万付费客户，既有独立开发者，也有 Warner Brothers、HBO 等客户。这些是访谈中的公司口径。主持人因自己的 agent 即使已有其他邮件服务仍推荐 Resend 而追问：产品如何进入模型的选择范围？回答先从邮件本身的复杂性展开。"},{"type":"heading","text":"减少注册阻力，把投递与防滥用留给平台"},{"type":"paragraph","text":"邮件不是增加机器就能扩大吞吐：Gmail、Outlook、Yahoo 各有规则。Rocha 以向 10 万人发信为例，解释平台需要排队、分批、控制不同收件服务商的速度，并观察最初一批收件人的互动；优先发送给活跃受众，是他提到的做法之一。IP 历史、地址池与持续发送模式也要管理。"},{"type":"paragraph","text":"他不愿让正常用户先填表、等待人工批准，因此选择默认信任，平台承担识别风险的负担，再依据退信、投诉和收件服务商反馈快速阻断异常，沟通判断是误用还是滥用。他谈到一次约两万个域名的滥用尝试，用来说明注册时间、相似域名和突发发送等信号为何重要；这不是零门槛就没有风险。"},{"type":"paragraph","text":"教育也被放进产品：发送前检查链接与拼写、根据发送模式提供提示，并从 HTML 自动生成纯文本版本。Rocha 认为纯文本有助于投递，但没有给出量化对照；打开率还会被隐私保护和预读取影响，点击追踪则涉及链接域名与发件域名的一致性，以及共享追踪域名被其他客户牵连的风险。"},{"type":"heading","text":"支持不能只靠不断加人"},{"type":"paragraph","text":"支持最初由创始人承担，随后经历招人答疑、培养领域能力，再到主动消除重复问题。他们曾要求答复工单必须附知识库或文档链接：没有文档就先写，单次回答更慢，却能留下供后续复用的内容。用户从约百万增长到数百万后，他仍希望保留免费层，因此不能仅靠线性增加支持人员。"},{"type":"paragraph","text":"新一批通过 Lovable、Bolt、v0 等工具建站的用户，常连 DNS 出错后如何排查都不清楚。团队因此接入 Domain Connect，让用户通过类似授权登录的流程配置域名，减少手工粘贴记录；但让域名供应商接入并不简单，涉及维护、收费和长期联络。投递专家及其行业关系同样是基础设施的一部分。"},{"type":"heading","text":"先解决模板，再深入基础设施"},{"type":"paragraph","text":"React Email 并非与 Resend 无关的偶然副产品：开发 Resend 时，用户研究反复提到邮件模板的表格布局、内联 CSS 和 Outlook 兼容问题。团队把 React/JSX 用作模板工具，借助 TypeScript 和设计 token 改善开发体验，而不是在邮件里运行 JavaScript。他们还为竞品发送平台撰写接入文档，先提供开放工具，再承接发送需求。"},{"type":"paragraph","text":"Rocha 说，Resend SDK 的 npm 下载量已经超过 SendGrid 并达到两倍以上，同时明确承认这不等于邮件发送量超过对方：后者仍有更大的企业发送规模。他早期借助 Amazon SES，集中完善 SDK 和开发文档；但实际服务还需要 SNS 事件、CloudWatch 日志、SQS 队列和自建 webhook，不能仅看发送单价。"},{"type":"paragraph","text":"公司正在进一步自建底层发送设施，以掌握 IP 池、服务商节流和更多可观测数据。访谈时项目仍在推进，不能当成全部上线。他也提到发送路径已从 JavaScript 转向 Go，并围绕尾部延迟和吞吐做优化；目标是让用户更清楚邮件离开平台后发生了什么。"},{"type":"heading","text":"让产品能从不同入口使用"},{"type":"paragraph","text":"谈到 MCP 与 CLI，Rocha 不选择只押一种入口，而是希望产品不受固定界面约束：API 优先，让用户从自己工作的地方调用。按其自述，MCP 调用持续增长，所提及的一个八月最终约有 120 万次调用；这属于访谈回顾的使用情况，并非今天的指标。"},{"type":"paragraph","text":"最早的本地 MCP 由投资方工程师制作，后转入公司维护。远程版本却要求重做 OAuth、角色权限与资源访问控制，再补齐可观测性和官方目录分发。他以自己从 Plausible 转向 PostHog 为例，解释为什么是否由厂商正式维护、能否在常用客户端直接连接，会影响他的采购判断。"},{"type":"paragraph","text":"工具数量已从最初约二十个甚至更少增至八十多个，但他仍会展开调用记录检查响应是否过大。真正困难的是从覆盖九成仪表盘能力走到全部覆盖：用量、账单、团队邀请、账户创建和删除都要决定如何暴露。数量增长是其产品实践，不能据此认定工具越多越好；主持人也提出了只提供少量通用工具的不同做法。"},{"type":"paragraph","text":"CLI、各语言 SDK 与可视化编辑器因此同时存在。招聘页甚至允许通过 CLI 或 API 申请，他把完成安装和授权流程视为一种投入信号。对于少量语言用户，他仍愿意维护原生体验良好的 SDK；而营销团队可在多人编辑器中维护模板、让代码仅调用模板 ID，开发团队也可选择把模板放进版本控制。"},{"type":"heading","text":"从发送邮件走向 agent 收件箱"},{"type":"paragraph","text":"团队还在探索可通过 API 批量创建收件箱，并提供已读、未读、星标、标签等能力；访谈中这是将发布的方向，不是已普遍开放的功能。他随后回到投递信誉：可用不同子域区分交易邮件与营销邮件，避免把所有发送流混在一起；相似的新域名却可能更像钓鱼行为，不能简单认定换域名就会改善投递。"},{"type":"heading","text":"让模型读懂产品，比追逐排名技巧更具体"},{"type":"paragraph","text":"AEO 的起点仍是细致文档：不只写语言层面的接入，还覆盖 Django 等具体框架；网站大量使用问答形式，给文档和营销页提供 llms.txt 与 Markdown 版本。主持人对这些措施是否提高分发效果保持怀疑，Rocha 给出的更具体例子是定价准确性。"},{"type":"paragraph","text":"他发现模型比较发送 120 万封邮件的费用时，把 Resend 算错，并称定价不透明；网页中的 JavaScript 计算器不容易被直接读取。补充可读的 Markdown 定价内容后，几天后再次提问得到了正确结果。这是一次自述观察，并不是严密的增长实验；HTML 与 Markdown 还带来双份维护问题。采用量图表也配上文字数据，出于同样考虑。"},{"type":"paragraph","text":"迁移页面除了说明，还提供代码转换器；他认为竞品直接做比较页面，在推荐中可能更占优势。对于新工具被推荐、近期信息与外部讨论的作用，他谈的是自己的观察；团队尝试多种 AEO 追踪产品，却仍缺少确定的行动答案。主持人则介绍把分析工具、代码和实验记录交给 agent，在人工批准实验后观察结果的做法，双方没有给出保证有效的通用公式。"},{"type":"heading","text":"企业经营与个人取舍"},{"type":"paragraph","text":"Resend 正逐步建立企业销售，访谈时只有一名客户经理，Rocha 不希望一次扩张破坏远程团队文化。他把企业版看成不同的产品：不能只在价目表上增加 SSO、SCIM 和审计日志，就认为已满足企业需求。营销邮件按联系人数计费也面临快速增长客户的挑战，而批量营销发送涉及动态分批和节流，与交易邮件的处理不同。"},{"type":"paragraph","text":"最后他谈到参加 YC 时已是父亲，并因迎接第二个孩子而更多待在巴西。有人劝他减少对设计的投入，他仍选择做自己愿意使用、有明确审美的产品；对于家庭，他也宁愿公司规模小一些而与女儿亲近。这些是他自己的优先级，并非没有压力或适用于所有创业者的答案。"},{"type":"paragraph","text":"访谈收尾还区分了在既有类别中领先与创造新类别：主持人认为 Resend 已形成鲜明位置，但是否定义了一个让人立即理解的新类别，仍是开放问题。整段经历呈现的是从开发者体验进入邮件行业，再补齐基础设施、agent 接口和公司能力的过程，而不是单靠某个 AEO 技巧取得增长。"}]}]},"quality":{"collected":33,"collectedTwe thread","createdAt":"2026-11-11T04:41:27.000Z","url":"https://x.com/swyx/status/2120376333142569316","likes":5,"retweets":0,"replies":1},{"text":"i had a preview of his keynote and you guys don’t know what youre in for in thursday. literally had to agree to embargo to get this talk on board (it is not the full story) tune in to the aie live stream 9am-6pm tmr and thursday!!","createdAt":"2026-11-11T04:27:29.000Z","url":"https://x.com/swyx/status/2120372817720197357","likes":71,"retweets":2,"replies":23},{"text":"I finally asked @zenorocha, the CEO of AEO, why tf my agents keep choosing Resend even when I don't want them to","createdAt":"2026-11-10T21:00:05.000Z","url":"https://x.com/swyx/status/2120260228902264872","likes":83,"retweets":4,"replies":69}]},{"name":"Josh Woodward","handle":"joshwoodward","bio":"VP, @Google @GoogleLabs @GeminiApp @GoogleAIStudio","tweets":[{"text":"Right now, Gemini 4 Carbon is in the @GeminiApp for Ultra subscribers worldwide","createdAt":"2026-11-10T16:06:07.000Z","url":"https://x.com/joshwoodward/status/2120186249281778135","likes":689,"retweets":30,"replies":107}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"How many of you have a small business?","createdAt":"2026-11-10T21:28:04.000Z","url":"https://x.com/thsottiaux/status/2120267268517249036","likes":3252,"retweets":81,"replies":866},{"text":"Labs innovating together ftw","createdAt":"2026-11-10T21:26:31.000Z","url":"https://x.com/thsottiaux/status/2120266880963473789","likes":3892,"retweets":109,"replies":386}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"Agree with Kartik. Game developers and gamers hating on (tasteful) use of AI is idiotic. There’s a huge difference between someone using AI to pump out slop and someone using it as another tool to make a great game.","createdAt":"2026-11-11T04:18:21.000Z","url":"https://x.com/petergyang/status/2120370522622181809","likes":27,"retweets":1,"replies":10},{"text":"Here's the updated game btw","createdAt":"2026-11-11T01:25:23.000Z","url":"https://x.com/petergyang/status/2120326994579931419","likes":5,"retweets":0,"replies":1},{"text":"I don't really care about the stock price but if @AnthropicAI can accelerate cures of all these terrible diseases it'll be one of the most impactful companies in history. I'm actually really glad Dario is focused on this vs. winning on viral shorts and TikTok memes.","createdAt":"2026-11-11T00:59:06.000Z","url":"https://x.com/petergyang/status/2120320377163501817","likes":437,"retweets":10,"replies":28}]},{"name":"Nan Yu","handle":"thenanyu","bio":"product, codex @openai. prev head of product @linear","tweets":[{"text":"@bamitsmanas That's like 30 coffees, or a 1-2 months of ChatGPT pro","createdAt":"2026-11-10T17:16:18.000Z","url":"https://x.com/thenanyu/status/2120203911265218969","likes":5,"retweets":0,"replies":0},{"text":"One of the lovely details about this, which few other dictation apps get right, is you're able to map the Apple dictation key (special variant of F5) We also support push to talk, double tap and single tap shortcuts. kudos to @bamitsmanas for getting all the edges right on this","createdAt":"2026-11-10T17:14:28.000Z","url":"https://x.com/thenanyu/status/2120203450223104012","likes":16,"retweets":0,"replies":1}]},{"name":"Thariq","handle":"trq212","bio":"playing WoW forever, formerly Claude Code @anthropicai","tweets":[{"text":"we need fewer one shot demos and more tools that show how you can collaborate with models to bring your vision to life","createdAt":"2026-11-10T18:34:03.000Z","url":"https://x.com/trq212/status/2120223476279869875","likes":1590,"retweets":68,"replies":125}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Rust is a superb language and ecosystem, especially given it was invented pre agentic coding. With agents, new languages will blossom, even purpose-built ones for specific usecases, and discretionary C or even LLVM IR, assembly… AI is fluid. No more one-size-fits-all.","createdAt":"2026-11-11T02:06:41.000Z","url":"https://x.com/rauchg/status/2120337388178379178","likes":518,"retweets":12,"replies":98},{"text":"Vercel Security Review, less than 1 week since launch: ✓ 𝟱𝟳,𝟴𝟵𝟳 vulnerabilities identified ✓ 𝟲,𝟬𝟮𝟵 critical or high ✓ 𝟭𝟰,𝟲𝟲𝟱 already patched by Agent I'm shocked at ① the number of critical vulnerabilities that would go unnoticed and ② the ease at which the agent automatically fixes them. You can turn it on for any repo, no matter where you deploy to.","createdAt":"2026-11-10T16:15:01.000Z","url":"https://x.com/rauchg/status/2120188488628977819","likes":446,"retweets":24,"replies":127}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Agent swarms have the potential to drive yet another leap in output from AI. The impact will be a clear separation between teams that adopt this pattern of work and those that don’t. The progression has roughly been: chat gave us quick turn AI responses that let us work a bit faster, but we were still rate limited by our interactions; then agents that can go off and complete entire tasks for us, accelerating hours or days of work into minutes; to now swarms of agents that are goal seeking and will find any route to the successful completion of a project, where there’s no inherent limit to the productivity gains. We can imagine a future where, for any task in which value can be created withi…","createdAt":"2026-11-11T05:18:49.000Z","url":"https://x.com/levie/status/2120385739342897469","likes":72,"retweets":5,"replies":26},{"text":"Agents are going to work with enterprise files 100X more than people do today. This is why we're excited to partner with Anthropic to bring full read/write interoperability to Box content via Claude. Now you can have an agent not only pull up content to work with in a workflow, but also write back file updates to Box and view them directly inside of Claude, all via MCP. You can create, edit, and update contracts, presentations, strategy docs, and any other content. When we started Box we couldn't have imagined all the ways that we'd be working with our unstructured data in the future, but it's clear that agents and people will be producing vastly more artifacts than we imagined. We're build…","createdAt":"2026-11-10T21:04:48.000Z","url":"https://x.com/levie/status/2120261416733036905","likes":166,"retweets":21,"replies":66}]},{"name":"Ryo Lu","handle":"ryolu_","bio":"Designed @Cursor_ai, @NotionHQ, @Stripe, built startups. I make a world where anyone can make software. Aspiring k-pop idol.","tweets":[{"text":"we build software not just to optimize, complete tasks or impose our own constraints – but to build a world where we let people in, aspire to things they couldn’t do before, to create, and find ourselves – just like filmmakers and musicians a great read:","createdAt":"2026-11-11T04:57:17.000Z","url":"https://x.com/ryolu_/status/2120380317429350654","likes":91,"retweets":6,"replies":7},{"text":"working together with other humans is where the magic happens, not each of us running our own army of agents in silos glad to see this come alive 💛","createdAt":"2026-11-11T02:07:54.000Z","url":"https://x.com/ryolu_/status/2120337691661443081","likes":314,"retweets":11,"replies":12},{"text":"read or watch on my journal – in english, chinese or japanese","createdAt":"2026-11-10T09:44:00.000Z","url":"https://x.com/ryolu_/status/2120090087715426614","likes":8,"retweets":0,"replies":1}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Harvard’17. Instagram: GitHub:","tweets":[{"text":"If users don't come back to your product, - 20% of the time it's because they don't like your product - 80% of the time it's because they forgot your product even exists","createdAt":"2026-11-10T19:20:15.000Z ure. Talk to Claude on or download the app.","tweets":[{"text":"These updates are starting to roll out today, so you may not see them all right away. Learn more about Claude Whiteboards, Sheets, Data, and interactive connectors:","createdAt":"2026-11-10T17:26:07.000Z","url":"https://x.com/claudeai/status/2120206379315261702","likes":1149,"retweets":42,"replies":8},{"text":"Also new: with interactive connectors, you can now open the full version of a tool inside Claude. Work in Adobe, Atlassian, and Box beside your conversation. Make changes yourself, or ask Claude to make them with you. Rolling out on web and desktop.","createdAt":"2026-11-10T17:26:06.000Z","url":"https://x.com/claudeai/status/2120206375137484875","likes":2885,"retweets":132,"replies":58},{"text":"Claude Data (formerly Dashboards) is now generally available on paid plans. Along with dashboards, Claude can draft data stories and narrated videos from your metrics, for you to review before sharing. Certified queries and live sharing are in beta.","createdAt":"2026-11-10T17:26:05.000Z","url":"https://x.com/claudeai/status/2120206372478566799","likes":1683,"retweets":47,"replies":18}]}]},"errors":[],"partial":false},{"date":"2026-11-11","dateLabel":"2026年11月11日","generatedAt":"2026-11-11T00:00:00+08:00","sourceGeneratedAt":"2026-11-10T06:27:38.415Z","stats":{"podcastEpisodes":1,"xBuilders":15,"totalTweets":29,"blogPosts":0},"highlights":[{"tag":"实践","title":"Madhu Guru：AI 应让产品经理在全流程中做得更深","body":"Madhu Guru 建议产品负责人先画出完整的产品生命周期，例如“理解市场 → 设计 → 开发 → 市场进入（GTM）”，再检查产品经理在各阶段的参与情况。","evidence":[{"quote":"This is a handoff-heavy, lossy process.","translation":"这个过程交接很多，也容易丢失信息。","attribution":"Madhu Guru","url":"https://x.com/realmadhuguru/status/2119999748086362466","publishedAt":"2026-11-10T03:45:02.000Z","sourceId":"x:2119999748086362466"}],"claimType":"single_source","sourcePerspective":"Madhu Guru","detail":{"sources":[{"sourceId":"x:2119999748086362466","blocks":[{"type":"paragraph","sentences":[{"id":"cla
