 不附带厚重或强预设的界面，定位是基础设施；他用 agent 的“无界面 Slack”作比，并认为界面现在很容易生成。","claimType":"single_source","sourcePerspective":"Guillermo Rauch","titleReview":{"id":"nov21-7","text":"Vercel board：共享 agent 状态，界面按工作目标生成","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2123468825538789380","quote":"𝚟𝚎𝚛𝚌𝚎𝚕 𝚋𝚘𝚊𝚛𝚍 has no heavyweight or opinionated UI. It's infra not product. I love the \"headless Slack\" for agents analogy, because UI is free now.\n\nYou can generate and deploy the ideal \"factory interface\" for each usecase. A security team will focus on vulnerability counts, SEV classifications, confirmed vs unconfirmed.\n\nI've seen internal factories at Vercel built on Board that are just TUIs. Or mostly managed via a Slack agent, and you just focus on the outcomes and giving feedback to the agents. \n\nThe board is like the Redux state manager of your agents. It's foundational."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"},"evidence":[{"sourceId":"x:2123468825538789380","quote":"The board is like the Redux state manager of your agents.","translation":"Board 就像 agent 的 Redux 状态管理器。","attribution":"Guillermo Rauch","url":"https://x.com/rauchg/status/2123468825538789380"}],"detail":{"sources":[{"sourceId":"x:2123468825538789380","blocks":[{"type":"paragraph","sentences":[{"id":"nov21-8","text":"Guillermo Rauch 强调，Vercel board 不附带厚重或强预设的界面，定位是基础设施；他用 agent 的“无界面 Slack”作比，并认为界面现在很容易生成。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2123468825538789380","quote":"𝚟𝚎𝚛𝚌𝚎𝚕 𝚋𝚘𝚊𝚛𝚍 has no heavyweight or opinionated UI. It's infra not product. I love the \"headless Slack\" for agents analogy, because UI is free now."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov21-9","text":"他建议为每种用途生成并部署适合的“工厂界面”：安全团队可以关注漏洞数量、严重级别，以及问题已确认或未确认的状态。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2123468825538789380","quote":"You can generate and deploy the ideal \"factory interface\" for each usecase. A security team will focus on vulnerability counts, SEV classifications, confirmed vs unconfirmed."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov21-10","text":"据他观察，Vercel 内部一些基于 Board 的系统只有终端界面，另一些主要由 Slack agent 管理；人关注结果，并向 agent 提供反馈。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2123468825538789380","quote":"I've seen internal factories at Vercel built on Board that are just TUIs. Or mostly managed via a Slack agent, and you just focus on the outcomes and giving feedback to the agents. "}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov21-11","text":"他最后把 Board 比作 agent 的 Redux 状态管理器，强调它的基础层定位。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2123468825538789380","quote":"The board is like the Redux state manager of your agents. It's foundational."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]}],"coverageReview":{"details":"保留基础设施定位、按用途生成界面、安全指标、终端和Slack内部例子、Redux类比。","limitations":"内部观察是作者自述；没有成本、易用性或可靠性测量，UI free不按零成本解释。","omissions":"省去赞美性措辞，不扩写未采集的被引帖或接口协议。"}}],"editorial":[{"id":"nov21-12","text":"共同的协作状态不必绑定一套固定界面：原帖给出的安全指标、终端和 Slack 三种例子，说明作者希望围绕结果选择交互方式，而不是要求所有团队使用同一工作台。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2123468825538789380","quote":"𝚟𝚎𝚛𝚌𝚎𝚕 𝚋𝚘𝚊𝚛𝚍 has no heavyweight or opinionated UI. It's infra not product. I love the \"headless Slack\" for agents analogy, because UI is free now.\n\nYou can generate and deploy the ideal \"factory interface\" for each usecase. A security team will focus on vulnerability counts, SEV classifications, confirmed vs unconfirmed.\n\nI've seen internal factories at Vercel built on Board that are just TUIs. Or mostly managed via a Slack agent, and you just focus on the outcomes and giving feedback to the agents. \n\nThe board is like the Redux state manager of your agents. It's foundational."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]}},{"tag":"实践","title":"Nikunj Kothari：面向长辈的反诈产品，需要把分散防线组合起来","body":"Nikunj Kothari：Nikunj Kothari 从父母和祖父母面临冒充与网络攻击的担忧出发，提出四层产品设想，而非报告已有一体化产品。","claimType":"single_source","sourcePerspective":"Nikunj Kothari","titleReview":{"id":"nov21-13","text":"Nikunj Kothari：面向长辈的反诈产品，需要把分散防线组合起来","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2123426647273800172","quote":"As these network attacks and impersonation attempts happen, who's securing the elderly? \n\nEspecially thinking about my parents and grandparents.\n\nThere are four layers I can think through where this could work.\n\nOne is at the browser level, where somebody builds a secure browser that ensures that whatever websites they're going to are secured. Texts typically lead to a link, even for payments. This is why browser is key.\n\nTwo could be at the network layer, where there is a physical device, similar to Pi-hole, or an Onavo-like VPN on your phone, that blocks websites that could be deemed unsafe.\n\nThree could be at the payments layer, where transactions that look like scams get flagged before the money leaves.\n\nAnd fourth and most crazy could be at the phone level, where everything is monitored, and you're only getting calls from your loved ones. Cloned voices would work with a provider like Reality Defender. \n\nThere are individual solutions for this today but none neatly packaged. \n\nThis could all be packaged with insurance that covers any activities on the OS or phone. In that way, incentives are aligned to keep this on the edge.\n\nThe buyer would be the kids, someone like me, who get alerted when something looks off."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"},"evidence":[{"sourceId":"x:2123426647273800172","quote":"There are individual solutions for this today but none neatly packaged.","translation":"这些方向已有单项解决方案，但尚未被妥善整合打包。","attribution":"Nikunj Kothari","url":"https://x.com/nikunj/status/2123426647273800172"}],"detail":{"sources":[{"sourceId":"x:2123426647273800172","blocks":[{"type":"paragraph","sentences":[{"id":"nov21-14","text":"Nikunj Kothari 从父母和祖父母面临冒充与网络攻击的担忧出发，提出四层产品设想，而非报告已有一体化产品。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2123426647273800172","quote":"As these network attacks and impersonation attempts happen, who's securing the elderly? \n\nEspecially thinking about my parents and grandparents.\n\nThere are four layers I can think through where this could work."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov21-15","text":"第一层是浏览器：因为短信和支付常导向链接，他设想用安全浏览器保护访问；第二层是网络：用类似 Pi-hole 的设备或类似 Onavo 的手机 VPN 拦截疑似危险网站。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2123426647273800172","quote":"One is at the browser level, where somebody builds a secure browser that ensures that whatever websites they're going to are secured. Texts typically lead to a link, even for payments. This is why browser is key.\n\nTwo could be at the network layer, where there is a physical device, similar to Pi-hole, or an Onavo-like VPN on your phone, that blocks websites that could be deemed unsafe."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov21-16","text":"第三层在支付前标记疑似诈骗交易；第四层是更激进的手机级监控与来电限制，并设想借助 Reality Defender 一类服务处理克隆声音。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2123426647273800172","quote":"Three could be at the payments layer, where transactions that look like scams get flagged before the money leaves.\n\nAnd fourth and most crazy could be at the phone level, where everything is monitored, and you're only getting calls from your loved ones. Cloned voices would work with a provider like Reality Defender. "}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov21-17","text":"他认为单项解决方案已经存在，却缺少整齐打包的体验；还提出与保险组合，以对齐保护激励。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2123426647273800172","quote":"There are individual solutions for this today but none neatly packaged. \n\nThis could all be packaged with insurance that covers any activities on the OS or phone. In that way, incentives are aligned to keep this on the edge."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov21-18","text":"在他的商业设想里，购买者是子女，遇到可疑情况时收到提醒。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2123426647273800172","quote":"The buyer would be the kids, someone like me, who get alerted when something looks off."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]}],"coverageReview":{"details":"保留浏览器、网络、支付、手机四层及各自例子，现有单项方案、保险激励和子女购买者。","limitations":"作者提出的产品构想；不把全监控当作已部署方案，也不承诺识别效果或保险承保。","omissions":"省去情绪性提问，不添加外部安全建议与未经核实能力。"}}],"editorial":[{"id":"nov21-19","text":"原帖的产品机会在跨环节整合与家庭通知，而非发明一种万能检测器；四层防护和保险仍是构想，文中没有提供误报率、保障条款或隐私权衡的验证。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2123426647273800172","quote":"As these network attacks and impersonation attempts happen, who's securing the elderly? \n\nEspecially thinking about my parents and grandparents.\n\nThere are four layers I can think through where this could work.\n\nOne is at the browser level, where somebody builds a secure browser that ensures that whatever websites they're going to are secured. Texts typically lead to a link, even for payments. This is why browser is key.\n\nTwo could be at the network layer, where there is a physical device, similar to Pi-hole, or an Onavo-like VPN on your phone, that blocks websites that could be deemed unsafe.\n\nThree could be at the payments layer, where transactions that look like scams get flagged before the money leaves.\n\nAnd fourth and most crazy could be at the phone level, where everything is monitored, and you're only getting calls from your loved ones. Cloned voices would work with a provider like Reality Defender. \n\nThere are individual solutions for this today but none neatly packaged. \n\nThis could all be packaged with insurance that covers any activities on the OS or phone. In that way, incentives are aligned to keep this on the edge.\n\nThe buyer would be the kids, someone like me, who get alerted when something looks off."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]}}],"matters":[{"kind":"动态","title":"ChatGPT 测试可固定功能入口的移动端布局","detail":"Thibault Sottiaux 介绍新的移动体验：dot 有独立标签，可把 Codex、Projects、Images 等固定到标签栏；先面向已有 dot 或有资格创建 dot 的 Pro 用户，部分用户默认看到新版，也可在 Settings > New ChatGPT Design 中切换。更广泛推出前仍在收集反馈。","sourceId":"x:2123557171321561133","url":"https://x.com/thsottiaux/status/2123557171321561133"},{"kind":"动态","title":"Gemini Mac 应用加入电脑任务执行","detail":"Josh Woodward 宣布 Mac 版 Gemini 应用现在能够在电脑上执行任务，并称这是呼声很高的功能；当前帖子没有具体任务列表、权限说明或支持范围，不扩写被引内容。","sourceId":"x:2123534862569324703","url":"https://x.com/joshwoodward/status/2123534862569324703"},{"kind":"动态","title":"RoleCUA 将操作映射到长期工作目标","detail":"Aditya Agarwal 介绍 Fig 的 RoleCUA：以跨月真实工作记录刻画专家角色，把每个动作关联到其服务的任务与目标；他将它放在 agent 从单项任务走向完整工作职责的背景中，正文没有提供数据规模或效果指标。","sourceId":"x:2123479646629183631","url":"https://x.com/adityaag/status/2123479646629183631"},{"kind":"动态","title":"SPC 的两段经历：共同学习的价值可能多年后才显现","detail":"Aditya Agarwal 回顾：Tom Brown 于 2016 年进入 SPC 时没有机器学习背景，与成员读论文，后来共同创立 Anthropic；Thariq 在结束游戏公司后研究可解释性，经成员介绍接触 Claude Code，随后参与建设该工具。作者用两段经历说明社区影响不只表现为当场创业。","sourceId":"x:2123494873919783073","url":"https://x.com/adityaag/status/2123494873919783073"}],"articles":{"blogs":[],"podcasts":[{"title":"Arda 的制造业 AI 路线：先让产线可理解，再让它可重配","sourceTitle":"Superintelligence Needs the Physical World with CEO and Co-Founder of Arda Bob McGrew","sourceId":"8fd14988-e40e-11f1-99ee-ebfb28833f04","sourceUrl":"https://www.youtube.com/watch?v=_wLzJINt9iQ","sourceName":"No Priors","author":"Bob McGrew","publishedAt":"2026-11-19T11:44:00.000Z","sourceTextSha256":"814788684ca031d5157e5de4d1d6cf251f4dd105d7a107f93fe49298f2c7c980","blocks":[{"type":"paragraph","text":"在 11 月 19 日发布的 No Priors 访谈中，Arda 联合创始人兼 CEO Bob McGrew 从一个反差切入：AI 已改变数字工作，窗外的物理世界却变化有限。自动驾驶省去了司机，但乘客仍会堵在原来的道路上。他由此提出，通向更强智能的道路不仅要自动化思考，还要改变实验、机器和制造能力。以下沿着他的论证展开，区分实际项目、经验判断与未来愿景。"},{"type":"heading","text":"自动化研究者，并不自动产生无限加速"},{"type":"paragraph","text":"McGrew 反对一种简单推导：自动化研究者 50% 的时间就快两倍，90% 就快十倍，99% 就快百倍，最后出现失控式自我改进。他认为这里误把研究者人数当成唯一瓶颈；以自己在 OpenAI 的经历为例，真正限制实验的还包括 GPU 数量、位置和连接网络。"},{"type":"paragraph","text":"他并不否认自动化研究的巨大价值。选择实验、工程实现和调度都有浪费，AI 可以让已有算力更有效地产出发现。但他用从 35% 接近最优提升到 90%、再到 99% 的假设说明：越接近上限，剩余增益越小。这些数字是解释模型，不是实测利用率；在他看来，这更像一条新的 S 曲线，而不是无限递归加速。"},{"type":"paragraph","text":"智能便宜后，物理设施反而成为稀缺的互补资源。假设生成得再快，湿实验室和算力仍要实际运行。主持人反问，蛋白质等领域的模拟能否替代实验；McGrew 承认模拟可能让所需实验减少十倍，却认为数字侧很快会用尽这轮收益，再次碰到物理瓶颈。他还回忆 Ilya 听完漂亮研究想法后会追问结果：好想法仍要经过实验。双方没有将所有科学领域的瓶颈视为已获证明的统一定律。"},{"type":"paragraph","text":"制造能力也有类似循环：如果建数据中心缺推土机，就需要新推土机工厂；建工厂又先得用推土机清地。这解释了他为何离开 OpenAI 后没有再建前沿模型实验室，而去研究智能怎样改变实际产能。"},{"type":"heading","text":"柔性自动化，首先是经济性问题"},{"type":"paragraph","text":"McGrew 花约一年与制造业管理者交流后，把美国创新产品制造的困难归因于劳动力成本和产线更新。他以手机为例称，每代约四分之三零件会变化，稳定部分较容易自动化，变化部分大量依靠人工；这里是受访者给出的行业描述，本次材料未独立核验。"},{"type":"paragraph","text":"专用设备可以把一个固定动作做得很好，却往往不能跨产品甚至跨一代手机复用。汽车可以在投入数年和巨额资本后持续生产多年，而频繁改款的消费电子难以同样摊销。他提出，要让自动化具有竞争力，不仅得提高覆盖率，还要降低重建产线和制造工程设计的成本。"},{"type":"paragraph","text":"Arda 的方向是让用户上传产品设计，由系统设计并最终重配产线，目标是七天左右完成，接近敏捷人工工厂导入设计变更的速度。这是建设目标，并非声称任意产品已经七天交付。适用领域包括频繁迭代的国防产品、消费电子，以及随芯片变化的数据中心供应链；低变化、已高度自动化的汽车产线并非其主要切口。"},{"type":"heading","text":"不一定需要人形机器人，先让封闭工作单元更灵活"},{"type":"paragraph","text":"在设备形态上，McGrew 认为许多固定工位一到两条机械臂配摄像头就够了，不必复制整个人。现有设备已能完成很多精细操作，线束等仍有难点，但更普遍的障碍是专用设备需要反复设计、重建，成本太高。"},{"type":"paragraph","text":"他把机器人问题分成开放世界与封闭世界。整理陌生卧室要处理新物品和长期规划；装配线则控制条件、重复步骤，较少引入新情况。传统自动化通过振动送料、夹具和精确位置消除不确定性，让缺少感知的机械臂也能按固定坐标操作。代价既是机械设计，也是大量校准。"},{"type":"paragraph","text":"加入感知和操作能力后，零件稍有偏移时就不必全靠精密校准来纠正；强化学习等工具也可参与。路线可以从简单工位逐渐扩展到弹性材料等难题。不过封闭环境并不意味着要求宽松：他强调制造需要接近 99% 乃至 99.9% 的一致完成，而不是家庭整理中偶尔漏一件也无妨。这个可靠性要求不能与展示中的一次成功混为一谈。"},{"type":"heading","text":"先建立制造工程的数据结构，再接入 agent"},{"type":"paragraph","text":"Arda 的早期实践是与一家国防制造商合作，把工艺和制造计划放进统一的软件系统。McGrew 说，团队一月获得系统访问，四月迎来首位用户：一个执行器的虚拟装配原本需几天，使用软件后约九十分钟完成。这是首个用户案例的自报时间，不是全流程投产周期。"},{"type":"paragraph","text":"团队随后扩展到该客户更多产品部门，涉及无人机、导弹和 Fury 飞机等项目。他强调关键不是给分散的一百份文档再加一个聊天框，而是先让制造过程被结构化、可维护，成为 AI 能理解的对象。"},{"type":"paragraph","text":"他把这条路比作制造工程版的开发环境：编码 agent 已有 IDE 和类似 Git 的基础，制造工程却缺少同样可用的数据结构。先建立这层，agent 才能在其上工作；随后一边向设计端反馈如何更便宜地制造，另一边探索如何设计完成某个步骤的自动化工位。"},{"type":"heading","text":"让前沿模型编排专用工具，而非为一切重训大模型"},{"type":"paragraph","text":"McGrew 对比了两种经历：Palantir 从客户问题出发，让工程师贴近使用现场；OpenAI 则从技术能力出发，依靠更大规模训练获得通用能力。Arda 选择前者，优先用足以解决问题的简单工具，没有为初期制造规划重新训练前沿模型。"},{"type":"paragraph","text":"具体做法是让通用模型协调专用算法、运动规划和 CAD 检查工具。价值不全来自模型本身，也来自工具与数据结构。对特定场景，小型专用模型仍可能优于现成通用方案；他把训练这种模型、写软件包和制作工具看作可替换的工程选择，而非先确定必须走某条技术路线。"},{"type":"heading","text":"机器人进展需要通用表征，也需要特定任务适配"},{"type":"paragraph","text":"回顾个人路径，McGrew 说自己早年曾怀疑神经网络，后来在 Palantir 工作十年，再尝试机器人创业。他花约一年半让机器人通过视觉下跳棋，却觉得时机太早，于是加入 OpenAI 的机器人团队。团队用机械手解魔方来证明深度学习的潜力，花约两年取得成果；他也直言这段经历让自己对机械手的工程难度非常谨慎。"},{"type":"paragraph","text":"对新一代模型的物理能力，他提出的解释是：单靠遥操作或专门采集的机器人数据仍太稀缺，更广泛的视频等数据可能先提供世界表征，再用任务数据适配。他提醒，所谓突然涌现也可能包含多年团队工作；关于外部模型训练数据的判断，他使用的是猜测，而非掌握其内部配方。"},{"type":"paragraph","text":"这种进步并未消除部署取舍。通用模型可能开箱表现好，却慢、不能针对用途微调；专用机器人团队仍可通过特定场景数据建立优势。封闭产线则能把大模型当工具之一，只在需要精细操作的环节调用，不必让所有步骤都承担同样延迟。快速控制、安全和离线需求，也给蒸馏、小模型与设备端运行留下重要位置。"},{"type":"heading","text":"前线部署的重点，是把现场问题变回产品"},{"type":"paragraph","text":"面对大型企业，Arda 采用前线部署工程：先找到确实需要功能的客户，把工程师放在用户身边。McGrew 认为，路线图不只是决定要做什么，也要找到愿意实际使用它、忍受早期问题并共同改进的人；管理层支持者与真正的一线使用者都不可少。"},{"type":"paragraph","text":"九十分钟的执行器案例也有容易忽略的一面：第一位用户过程相当受挫，产品负责人一直坐在旁边记录问题，两周后才修好许多不顺手的地方。半年后扩展到零件数量约多两个数量级的产品，又要找到新的核心用户，重新解决不适配之处。成功不是软件一交付就自动发生。"},{"type":"paragraph","text":"他的扩展逻辑是逐团队、逐问题合作，只有客户获得结果，团队才算成功，再以此赢得处理更大问题的信任。但驻场本身并不产生规模效应：如果工程师永远都在人工填补产品与用户的缺口，就只是持续服务。需要把现场发现沉淀回产品，让后续用户能重复受益。"},{"type":"heading","text":"让机器建设机器，是长期方向而非已完成的闭环"},{"type":"paragraph","text":"访谈最后回到物理世界。McGrew 认为，廉价智能还需要感知与行动，未来机器形态会很多样，不限于人形；制造业要让数据中心中的智能能够真正帮助人做事。他设想工厂设计和机床制造逐步自动化，从而让机器参与建设更多机器，这也会反过来支持计算设施扩张。"},{"type":"paragraph","text":"更远处的自复制机器、星际探测乃至费米悖论，是双方继续讨论的推演。McGrew 提出高速扩散的文明可能很晚才被观察到，主持人则质疑为何尚未到达、这是否意味着文明稀少；他们没有解决这个问题。他同时强调，扩张应该让人类受益并尽可能保有控制。回到眼前，Arda 的实际切口仍是结构化制造过程、改善具体用户工作，再逐步走向柔性自动化。"}]}]},"quality":{"collected":34,"collectedTweets":33,"used":8,"usedTweets":7,"uniqueAuthors":7,"imageCount":0,"claimAudit":{"reviewMode":"editorial review plus structural checks; not automated proof of meaning","claimsReviewed":19,"warnings":[]},"status":"degraded","warnings":["Quoted-post context missing: x:2123468825538789380","Media unverified: podcasts:8fd14988-e40e-11f1-99ee-ebfb28833f04 (feed_has_no_media_or_supported_post_locator)","No relevant image included in this edition"]},"contentSchemaVersion":2,"sourceSnapshotSha256":"fc73e5935df0fbd7bc1abb3d5b8b4b4140d9b6c7ba935f5415b42400768bf0ed","selection":{"sources":[{"sourceId":"x:2123659761887625602","decision":"excluded","reason":"短句质疑依赖链接，无独立事实。"},{"sourceId":"x:2123591875349422435","decision":"excluded","reason":"社交媒体激励评论缺事件身份与证据，本期优先具体产品和实践。"},{"sourceId":"x:2123552457649492023","decision":"excluded","reason":"情绪短句和外链，不能还原事件。"},{"sourceId":"x:2123534862569324703","decision":"used","reason":"独立的模型使用、协作基础设施、防护产品构想或明确动态，保留作者报告与适用范围。"},{"sourceId":"x:2123612889416339762","decision":"excluded","reason":"1.2B用户和体验策略短评不展开，采用同作者详细移动端公告。"},{"sourceId":"x:2123612433923051976","decision":"excluded","reason":"产品昵称与链接，详细移动端公告已采用。"},{"sourceId":"x:2123557171321561133","decision":"used","reason":"独立的模型使用、协作基础设施、防护产品构想或明确动态，保留作者报告与适用范围。"},{"sourceId":"x:2123648490844897389","decision":"excluded","reason":"员工规模与测试优势是推测，未提供测试案例或数据。"},{"sourceId":"x:2123620968568676457","decision":"excluded","reason":"夜景作品比较依赖未采集视频，采用作者文字测试总结。"},{"sourceId":"x:2123540875733315815","decision":"used","reason":"独立的模型使用、协作基础设施、防护产品构想或明确动态，保留作者报告与适用范围。"},{"sourceId":"x:2123524052195463568","decision":"excluded","reason":"艺术与效用概念短评，演讲内容未采集。"},{"sourceId":"x:2123457177419760100","d "tweets":[{"text":"Software is both art and utility. AI is both an Industrial Revolution and a Renaissance. Factories are for utilities, at AIE Code I talked about how we can make better art.","createdAt":"2026-11-19T21:09:21.000Z","url":"https://x.com/trq212/status/2123524052195463568","likes":793,"retweets":49,"replies":46},{"text":"","createdAt":"2026-11-19T16:43:37.000Z","url":"https://x.com/trq212/status/2123457177419760100","likes":10013,"retweets":640,"replies":111},{"text":"an age of miracles","createdAt":"2026-11-19T16:26:35.000Z","url":"https://x.com/trq212/status/2123452888248992024","likes":2999,"retweets":66,"replies":78}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Build your own Muse-like personal agent with one prompt.","createdAt":"2026-11-19T21:55:01.000Z","url":"https://x.com/amasad/status/2123535544718418191","likes":393,"retweets":24,"replies":37},{"text":"Having a contract with your agent is a paradigm I expect many will copy from us","createdAt":"2026-11-19T21:54:18.000Z","url":"https://x.com/amasad/status/2123535362568134894","likes":75,"retweets":4,"replies":35},{"text":"Sick!","createdAt":"2026-11-19T15:09:02.000Z","url":"https://x.com/amasad/status/2123433375830561130","likes":57,"retweets":2,"replies":9}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"A company’s genesis is the agent that helps you build the company","createdAt":"2026-11-19T23:08:16.000Z","url":"https://x.com/rauchg/status/2123553975945556144","likes":187,"retweets":9,"replies":55},{"text":"My “is engineering a valuable pursuit” math. An outcome-oriented, creative engineer is now a 1000x engineer. A tabs-vs-spaces-debating, miss-forest-for-trees engineer is now a -10x engineer. The regular knowledge worker is now a 2x engineer. This is also backed by the distribution of token consumption we see in both our startups and enterprise base. Engineers and software factories will consume exponentially more tokens. If there’s a takeaway from Anthropic’s success, it’s that coding is the #1 killer app of AI.","createdAt":"2026-11-19T19:55:14.000Z","url":"https://x.com/rauchg/status/2123505400591106113","likes":1574,"retweets":94,"replies":129},{"text":"𝚟𝚎𝚛𝚌𝚎𝚕 𝚋𝚘𝚊𝚛𝚍 has no heavyweight or opinionated UI. It's infra not product. I love the \"headless Slack\" for agents analogy, because UI is free now. You can generate and deploy the ideal \"factory interface\" for each usecase. A security team will focus on vulnerability counts, SEV classifications, confirmed vs unconfirmed. I've seen internal factories at Vercel built on Board that are just TUIs. Or mostly managed via a Slack agent, and you just focus on the outcomes and giving feedback to the agents. The board is like the Redux state manager of your agents. It's foundational.","createdAt":"2026-11-19T17:29:54.000Z","url":"https://x.com/rauchg/status/2123468825538789380","likes":332,"retweets":10,"replies":78}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Bostrom: \"if nobody builds it, everyone dies\" Hard agree","createdAt":"2026-11-19T19:18:43.000Z","url":"https://x.com/garrytan/status/2123496208316694669","likes":263,"retweets":21,"replies":31}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"lol NASDAQ hedging their bets","createdAt":"2026-11-19T17:17:02.000Z","url":"https://x.com/mattturck/status/2123465585166295351","likes":58,"retweets":3,"replies":2},{"text":"My earlier conversation with the truly excellent @felixrieseberg here:","createdAt":"2026-11-19T14:33:12.000Z","url":"https://x.com/mattturck/status/2123424356286017975","likes":2,"retweets":0,"replies":0},{"text":"Seems that @felixrieseberg from @AnthropicAI was single_source","sourcePerspective":"Guillermo Rauch","titleReview":{"id":"nov20-7","text":"Guillermo Rauch：推理需求增长与供应商整合可能同时发生","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2123203741570740504","quote":"I’m being pitched a new inference neocloud company on average every two days. No exaggeration. I take every entrepreneur seriously and I look deeply into each.\n\nBut it’s hard to fathom this being sustainable. At the same time, AI Gateway token demand on Vercel has been ~40% MoM compounded since the beginning of the year. No signs of stopping.\n\nOne way to reconcile this is that compute is the new economy, and tokens the new energy unit. There’s a new Industrial Revolution taking place. Every aspect of our lives is being replatformed on top of this new system that enhances everything. More like an “oil rush” than a “gold rush”: it’s durable, not a fad.\n\nIn the short term, I anticipate more expansion, followed by consolidation due to economies of scale, cybersecurity and enterprise requirements (ZDR and cyber being a hot topic for inference providers), capital requirements, and an evolving regulatory landscape."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"},"evidence":[{"sourceId":"x:2123203741570740504","quote":"In the short term, I anticipate more expansion, followed by consolidation due to economies of scale, cybersecurity and enterprise requirements (ZDR and cyber being a hot topic for inference providers), capital requirements, and an evolving regulatory landscape.","translation":"他预计短期会进一步扩张，随后因规模经济、网络安全与企业要求、资本需求和监管变化而整合。","attribution":"Guillermo Rauch","url":"https://x.com/rauchg/status/2123203741570740504"}],"detail":{"sources":[{"sourceId":"x:2123203741570740504","blocks":[{"type":"paragraph","sentences":[{"id":"nov20-8","text":"Guillermo Rauch 称，平均每两天就有一家新的推理云公司向他推介，他会认真研究每一家，但对这种供给扩张能否持续持疑问。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2123203741570740504","quote":"I’m being pitched a new inference neocloud company on average every two days. No exaggeration. I take every entrepreneur seriously and I look deeply into each."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov20-9","text":"他同时报告，Vercel AI Gateway 的 token 需求从年初以来约以每月 40% 的速度复合增长，尚未看到停止迹象；这是他披露的平台口径。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2123203741570740504","quote":"But it’s hard to fathom this being sustainable. At the same time, AI Gateway token demand on Vercel has been ~40% MoM compounded since the beginning of the year. No signs of stopping."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov20-10","text":"为解释两者并存，他把计算看作新经济、token 比作能源，认为这更像长期的“淘油热”而非短期“淘金热”，各种活动正在迁移到新的计算体系。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2123203741570740504","quote":"One way to reconcile this is that compute is the new economy, and tokens the new energy unit. There’s a new Industrial Revolution taking place. Every aspect of our lives is being replatformed on top of this new system that enhances everything. More like an “oil rush” than a “gold rush”: it’s durable, not a fad."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov20-11","text":"他的短期预测是先扩张、后整合，推动因素包括规模经济、网络安全、企业需求（包括零数据保留 ZDR）、资本要求和不断变化的监管环境。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2123203741570740504","quote":"In the short term, I anticipate more expansion, followed by consolidation due to economies of scale, cybersecurity and enterprise requirements (ZDR and cyber being a hot topic for inference providers), capital requirements, and an evolving regulatory landscape."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]}],"coverageReview":{"details":"保留两天一家公司、月复合40%、年初起算、能源类比和五类整合因素。","limitations":"不将Vercel口径推广为全行业，不把预测写成已发生整合。","omissions":"略去情绪强化语，保留作者观点的推理顺序。"}}],"editorial":[{"id":"nov20-12","text":"需求增长描述用量，供应商能否持续经营还受到规模和企业要求制约；两者不能直接画等号。40% 是作者的平台自报数据，整合则仍是预测。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2123203741570740504","quote":"I’m being pitched a new inference neocloud company on average every two days. No exaggeration. I take every entrepreneur seriously and I look deeply into each.\n\nBut it’s hard to fathom this being sustainable. At the same time, AI Gateway token demand on Vercel has been ~40% MoM compounded since the beginning of the year. No signs of stopping.\n\nOne way to reconcile this is that compute is the new economy, and tokens the new energy unit. There’s a new Industrial Revolution taking place. Every aspect of our lives is being replatformed on top of this new system that enhances everything. More like an “oil rush” than a “gold rush”: it’s durable, not a fad.\n\nIn the short term, I anticipate more expansion, followed by consolidation due to economies of scale, cybersecurity and enterprise requirements (ZDR and cyber being a hot topic for inference providers), capital requirements, and an evolving regulatory landscape."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]}},{"tag":"实践","title":"Aaron Levie：下一步是围绕目标持续改进，而不只是执行任务","body":"Aaron Levie：Aaron Levie 把 agent 的演进描述为：从快速给出答案，到由人编排一组任务，再到并行展开、更大上下文、长期运行和更强能力支撑的新阶段。","claimType":"single_source","sourcePerspective":"Aaron Levie","titleReview":{"id":"nov20-13","text":"Aaron Levie：下一步是围绕目标持续改进，而不只是执行任务","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2123278949749059756","quote":"Regardless of what it’s called, we’re clearly moving to yet another era of AI agents in our work. \n\nWe’ve quickly jumped from agents that spit out a quick answer for you, to today agents that you orchestrate inside of a set of tasks. But as agents can both fan out and work in parallel, handle much larger context, be able to do long running work, and have far greater levels of capabilities, we’re entering yet another level of what we can have AI do for us.\n\nWe’ll soon be able to give agents a set of goals, and they can go out and design the best solution for that goal, while also continuously improving it based on the ongoing execution of whatever it built. This will obviously start with engineering because that’s where we’re seeing the best practices emerge first in almost every new era of agents. \n\nBut the impact can be quite massive across the rest of knowledge work. You’ll tell an agent to improve your client onboarding workflow to achieve a certain targeted goal; or have agents go reduce risk in your business; or improve your security posture on an ongoing basis.\n\nThese autonomous systems will be able to take on a set of goals, design the best outcome, test and iterate, deploy, and then optimize whatever it built on an ongoing basis. Importantly, this leads to outcomes and results that humans literally couldn’t have accomplished before. This will lead to fairly new levels of productivity with AI."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"},"evidence":[{"sourceId":"x:2123278949749059756","quote":"This will obviously start with engineering because that’s where we’re seeing the best practices emerge first in almost every new era of agents.","translation":"他认为这会先从工程领域开始，因为几乎每一轮 agent 演进的最佳实践都先在那里出现。","attribution":"Aaron Levie","url":"https://x.com/levie/status/2123278949749059756"}],"detail":{"sources":[{"sourceId":"x:2123278949749059756","blocks":[{"type":"paragraph","sentences":[{"id":"nov20-14","text":"Aaron Levie 把 agent 的演进描述为：从快速给出答案，到由人编排一组任务，再到并行展开、更大上下文、长期运行和更强能力支撑的新阶段。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2123278949749059756","quote":"Regardless of what it’s called, we’re clearly moving to yet another era of AI agents in our work. \n\nWe’ve quickly jumped from agents that spit out a quick answer for you, to today agents that you orchestrate inside of a set of tasks. But as agents can both fan out and work in parallel, handle much larger context, be able to do long running work, and have far greater levels of capabilities, we’re entering yet another level of what we can have AI do for us."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov20-15","text":"他预计，人们将能够交给 agent 一组目标，让它设计解决方案，并依据执行反馈持续改进；他认为工程领域会先出现成熟实践。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2123278949749059756","quote":"We’ll soon be able to give agents a set of goals, and they can go out and design the best solution for that goal, while also continuously improving it based on the ongoing execution of whatever it built. This will obviously start with engineering because that’s where we’re seeing the best practices emerge first in almost every new era of agents. "}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov20-16","text":"他举出的知识工作场景包括：按目标改善客户入驻流程、降低企业风险，以及持续改善安全状况。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2123278949749059756","quote":"But the impact can be quite massive across the rest of knowledge work. You’ll tell an agent to improve your client onboarding workflow to achieve a certain targeted goal; or have agents go reduce risk in your business; or improve your security posture on an ongoing basis."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov20-17","text":"在他的设想中，这类系统将设计、测试、迭代、部署并持续优化产物，甚至产生人类过去无法实现的结果；这些是对未来能力与生产力的判断。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2123278949749059756","quote":"These autonomous systems will be able to take on a set of goals, design the best outcome, test and iterate, deploy, and then optimize whatever it built on an ongoing basis. Importantly, this leads to outcomes and results that humans literally couldn’t have accomplished before. This will lead to fairly new levels of productivity with AI."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]}],"coverageReview":{"details":"保留答案到任务的演进、并行和长上下文、工程先行、客户入驻风险安全三例及完整生命周期。","limitations":"预测而非产品验收报告；被引上下文未采集，不借外链增加成功率或能力保证。","omissions":"省去开头命名不重要的铺垫和重复的生产力强调。"}}],"editorial":[{"id":"nov20-18","text":"这一愿景把完成一次任务与维护一个结果区分开：目标、执行反馈和后续优化构成闭环。不过原帖没有实际部署案例，尚不能据此认定这些场景已可靠实现。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2123278949749059756","quote":"Regardless of what it’s called, we’re clearly moving to yet another era of AI agents in our work. \n\nWe’ve quickly jumped from agents that spit out a quick answer for you, to today agents that you orchestrate inside of a set of tasks. But as agents can both fan out and work in parallel, handle much larger context, be able to do long running work, and have far greater levels of capabilities, we’re entering yet another level of what we can have AI do for us.\n\nWe’ll soon be able to give agents a set of goals, and they can go out and design the best solution for that goal, while also continuously improving it based on the ongoing execution of whatever it built. This will obviously start with engineering because that’s where we’re seeing the best practices emerge first in almost every new era of agents. \n\nBut the impact can be quite massive across the rest of knowledge work. You’ll tell an agent to improve your client onboarding workflow to achieve a certain targeted goal; or have agents go reduce risk in your business; or improve your security posture on an ongoing basis.\n\nThese autonomous systems will be able to take on a set of goals, design the best outcome, test and iterate, deploy, and then optimize whatever it built on an ongoing basis. Importantly, this leads to outcomes and results that humans literally couldn’t have accomplished before. This will lead to fairly new levels of productivity with AI."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]}}],"matters":[{"kind":"动态","title":"Gemini 4 Neon 发布","detail":"Josh Woodward 宣布 Gemini 4 Neon，并称其更快、更便宜、能较好遵循复杂指令；当前帖子没有价格、延迟或测试数字，保留为发布方描述。","sourceId":"x:2123177835254952348","url":"https://x.com/joshwoodward/status/2123177835254952348"},{"kind":"动态","title":"Project Genie 加入场景内编辑和社区重混","detail":"Google Labs 宣布 Project Genie 改用 Genie 4：可在体验中输入提示修改世界，通过新 agent 对话式创建世界，以及在画廊探索和重混他人的作品；仅向符合条件的 Google AI Ultra 订阅者开放。","sourceId":"x:2123118145552749015","url":"https://x.com/GoogleLabs/status/2123118145552749015"},{"kind":"动态","title":"Stitch Loop 开放候补登记","detail":"Google Labs 将 Stitch Loop 介绍为面向精简团队、持续运行的产品 agent 实验，并邀请加入候补名单；当前正文没有列出具体工作权限或交付指标。","sourceId":"x:2123102389775573314","url":"https://x.com/GoogleLabs/status/2123102389775573314"},{"kind":"动态","title":"Thariq 放弃按模式组织个人软件的方案","detail":"Thariq 说，即使有 AI，做自己的软件仍难在弄清真实需求；他没有继续使用按模式组织工作的方案，准备改试以待办事项为中心的做法。原帖未提供新方案效果，不补未采集的原型背景。","sourceId":"x:2123106368492298653","url":"https://x.com/trq212/status/2123106368492298653"}],"articles":{"blogs":[],"podcasts":[{"title":"Notion 的 AI 转型：保管上下文，也保留人对工作的理解","sourceTitle":"Notion’s Founder on the One Thing Your AI Is Missing","sourceId":"flightcast:01M7N6THM33K8YFWM1YCX4ZFKV","sourceUrl":"https://www.youtube.com/watch?v=PGWvMrF4XIA","sourceName":"AI & I by Every","author":"Ivan Zhao、Dan Shipper","publishedAt":"2026-11-18T18:19:30.000Z","sourceTextSha256":"53e5f16eb44fb71c2074542044b4870890e1e2b9cc1976977f58002d56506cc9","blocks":[{"type":"paragraph","text":"11 月 18 日发布的 AI & I 访谈里，Notion 创始人 Ivan Zhao 与 Dan Shipper 讨论了一个变化：当 AI 可以直接写软件，原本依靠积木和数据库降低编程门槛的 Notion，还应该提供什么？Ivan 的回答逐渐从“让人人能改造工具”，转向数据、团队协作，以及人对系统的理解。"},{"type":"heading","text":"能自己制作，不等于所有东西都要自己制作"},{"type":"paragraph","text":"Ivan 从早期计算的理想谈起：软件本应像读写一样成为人人可以使用的表达媒介，后来却固化为应用，分出了制造者和使用者。Notion 的初衷，就是不强迫人先学编程，也能获得构建工具的能力。因此他支持 vibe coding，认为它让这个早期理想重新有机会实现；但从演示到持续维护，仍有很大距离。"},{"type":"paragraph","text":"他将选择拆成几个维度。首先，人应拥有修改日常工具的自由。其次，许多时候人并没有强烈的设计意见，只希望专业人士把工具做好，如椅子、门或日历。访谈中他以重新制作的移动端 Calendar 为例：使用细节可以因人而异，但时间网格和整体体验仍值得被认真设计。能够自行制作，并不代表每次都应该从头制作。"},{"type":"paragraph","text":"第三类是企业依赖的基础软件：安全与持续维护本身昂贵。他尊重自托管和 local-first 的选择，却建议几十人的企业让服务商承担这些工作，并坦承这也是 Notion 的商业模式。成品软件的价值既在维护责任，也在细节体验；他把后者比作选择去一家体验良好的餐厅，而非每餐都自己下厨。"},{"type":"heading","text":"模型变化很快，数据与业务语义更持久"},{"type":"paragraph","text":"主持人提出一个张力：模型不断升级，精心制作的功能可能几个月后就失去意义。Ivan 认为，过去软件公司定义流程，再为流程制作按钮；如今 agent 可以写程序，也能生成界面，这两个层面都变得可改造，Notion 不必固守它们。"},{"type":"paragraph","text":"更持久的是业务自己的数据、上下文和语义：哪些事情重要，知识如何保存，人如何共同维护。Ivan 因而把 Notion 越来越多地理解为这些信息的保管者，向不同 agent 开放，同时提供边界与团队协作。这些由企业定义的内容处于模型之外，不必随每轮模型升级推倒重来。"},{"type":"heading","text":"历史游戏：用交互帮助学习，也主动限制真实感"},{"type":"paragraph","text":"Ivan 用与妻子共同制作的历史游戏说明自己的尝试。玩家可以选一个时代，例如 1900 年的维也纳；系统推荐五个人物和十个概念，让玩家通过对话收集知识，再由教师或记者角色检查理解。它处在书籍的固定叙事与游戏的开放探索之间，以聊天的兴趣带动学习。"},{"type":"paragraph","text":"游戏能在手机或电脑上使用，视觉接近 PlayStation 2 风格。他觉得过分精致的三维画面反而显得假，略带像素感更亲切、也易于调整。早期还试过实时语音对话，却觉得过于诡异，最终更偏向选择式文字冒险。这个项目也是试用多种模型和工具的方式，而非某一套工具已获完整性能验证的展示。"},{"type":"heading","text":"从写作助手到 agent，再回到自己的独特价值"},{"type":"paragraph","text":"回看十三年创业，Ivan 说最初五年都在摸索，疫情期间获得增长，彼时主要为人建立系统。2022 年底接触 GPT-4 级模型后，他与联合创始人集中做出原型，并在 ChatGPT 发布前几周推出首个产品；他当时已相信模型可以参与思考与工作，但公司其他人并不都认同，有人把它看成又一轮热潮。"},{"type":"paragraph","text":"最初半年到一年，写作功能获得使用；随后约两年的 agent 产品探索很艰难，他认为模型尚未准备好。直到访谈所说的上一年同期，agent 才终于开始奏效。但当人人都在做 agent，“我们也有 agent”就不再足够独特。他于是重新强调 Notion 的位置：把应用 AI 能力，与人共同建设知识和上下文的系统结合。"},{"type":"heading","text":"不要把理解系统的能力一起交出去"},{"type":"paragraph","text":"讨论转向副作用时，Ivan 承认自己越来越喜欢与 AI 聊天，甚至胜过阅读，有时感觉类似不停刷短视频。技术可以带来生产力，也可能改变注意力与生活方式；他希望建设者至少花力气思考这些难以预测的二阶、三阶影响。"},{"type":"paragraph","text":"主持人设想，深夜连续聊天时，可以让 AI 要求人先解释自己想做什么，解释不清便不继续执行。Ivan 认为，只加这种提醒仍较表层，更深的问题是人是否理解系统正在做什么。他反对轻易放弃理解，主张以更好的抽象、工具和可视化帮助人把握复杂性，而非只接受黑箱产物。"},{"type":"paragraph","text":"他给出团队的具体做法：每个人各自与 coding agent 对话，再用 GitHub 合并，会让同事不知道彼此在做什么。团队于是采用 Notion 看板协调 agent 的工作。看板虽是熟悉甚至常被嫌弃的形式，却能把分散工作变成共同可见的结构；这是团队实践描述，不是有量化效果的对照实验。"},{"type":"heading","text":"积木与黏土之间，需要带有结构的自由"},{"type":"paragraph","text":"观众问，AI 把可组合的积木变成了更细粒度的 token，产品如何兼顾结构和自由？Ivan 用 Lego 与黏土作比：黏土自由，但没有经验的人不容易把它堆成高塔；积木自带约束，反而让复杂结构容易成立。他认为 coding agent 给出了近似黏土的能力，行业还在寻找适合它的积木。"},{"type":"paragraph","text":"这些积木应预先处理权限、同步与协作，同时让使用者表达自己的业务逻辑。简单形式是让 agent 帮助搭建 Notion；更进一步，他提到向 agent 开放界面模式库，并在 Notion 权限保护下读取数据库，使界面更自由而仍保有熟悉感。主持人追问是否开源时，他明确纠正：尚未开源。不能把这段讨论写成已经发布的开源库。"},{"type":"heading","text":"给团队一个完整入口，同时保留共同工作的空间"},{"type":"paragraph","text":"对于五十人企业如何开箱即用，Ivan 承认已有许多积木，却还未把它们放进一个完整盒子。他希望在接下来一个季度、争取不到两个季度内，让公司可通过 agent 完成接入，把上下文、知识和做事方法集中起来。这是访谈当时的路线目标，而非交付日期保证。"},{"type":"paragraph","text":"他把内容与知识看成压缩后的经验，希望它们能随不同模型流动，避免低质量输入带来低质量结果。他举出可能节约 20%、30% 或 40% token 的设想，但用的是疑问和愿景，没有给出已测得的节省比例。"},{"type":"paragraph","text":"最后，Ivan 认为未来进入系统的工作者会有大量 agent，产品应当服务它们；同时，人之间的协作与关系仍值得保留。他不愿让所有人只面对各自的聊天框，而强调共享画布、团队与看板。整场访谈的主线因此不是消灭界面，而是让灵活的 agent、可守护的上下文和人能共同理解的工作空间相互配合。"}]}]},"quality":{"collected":32,"collectedTweets":31,"used":8,"usedTweets":7,"uniqueAuthors":6,"imageCount":0,"claimAudit":{"reviewMode":"editorial review plus structural checks; not automated proof of meaning","claimsReviewed":18,"warnings":[]},"status":"degraded","warnings":["Quoted-post context missing: x:2123237505810178434","Quoted-post context missing: x:2123278949749059756","Media unverified: podcasts:flightcast:01M7N6THM33K8YFWM1YCX4ZFKV (feed_has_no_media_or_supported_post_locator)","No relevant image included in this edition"]},"contentSchemaVersion":2,"sourceSnapshotSha256":"054b89f6a23467d7ff186dd957d833a1c0b22a74063ca6aac8083e17dbdea385","selection":{"sources":[{"sourceId":"x:2123298074911248526","decision":"excluded","reason":"只有短词和链接，缺可独立理解的事实。"},{"sourceId":"x:2123260852984013045","decision":"excluded","reason":"演员选角玩笑，非本期构建主题。"},{"sourceId":"x:2123259711785148431","decision":"excluded","reason":"现金流盈利短句未说明主体，不能补被引帖。"},{"sourceId":"x:2123178015874302328","decision":"excluded","reason":"仅引导阅读，采用同作者完整Neon发布帖。"},{"sourceId":"x:2123177835254952348","decision":"used","reason":"提供独立的软件需求、推理供给、目标型agent或产品功能信息；按原文保留自述与预测边界。"},{"sourceId":"x:2123123552052494529","decision":"excluded","reason":"Genie公告重复，采用Google Labs列明功能与适用范围的版本。"},{"sourceId":"x:2123175166519992652","decision":"excluded name":"Nan Yu","handle":"thenanyu","bio":"product, codex @openai. prev head of product @linear","tweets":[{"text":"also applies to work","createdAt":"2026-11-18T23:32:23.000Z","url":"https://x.com/thenanyu/status/2123197657896321439","likes":50,"retweets":0,"replies":1}]},{"name":"Thariq","handle":"trq212","bio":"playing WoW forever, formerly Claude Code @anthropicai","tweets":[{"text":"this is one of those reasons why I don't think most people will really generate their own software good software is a set of strong opinions and I'd rather have something that's been really thought through by someone else","createdAt":"2026-11-18T17:29:38.000Z","url":"https://x.com/trq212/status/2123106370161705127","likes":3052,"retweets":251,"replies":141},{"text":"making your own software is tough, even with AI, because it's hard to know what you really want I didn't end up sticking with this, the modes weren't the right way for me to organize my work gonna a different take that’s more to-do oriented","createdAt":"2026-11-18T17:29:38.000Z","url":"https://x.com/trq212/status/2123106368492298653","likes":1783,"retweets":38,"replies":117}]},{"name":"Google Labs","handle":"GoogleLabs","bio":"Google’s home for our latest AI tools and experiments.","tweets":[{"text":"Create a world from one sentence, then change it while you’re standing inside 🌐 Project Genie now runs on @GoogleDeepMind’s Genie 4. Here’s what’s new: — Prompt mid-session to edit your world live — Create worlds conversationally with the help of a new agent — Explore & remix other users' worlds in the gallery Available now to eligible Google AI Ultra subscribers","createdAt":"2026-11-18T18:16:26.000Z","url":"https://x.com/GoogleLabs/status/2123118145552749015","likes":266,"retweets":29,"replies":12},{"text":"🚨NEW EXPERIMENT 🚨 Please join us in welcoming Stitch Loop, an always-on product agent that works non-stop to help lean teams build better products. Join the waitlist:","createdAt":"2026-11-18T17:13:49.000Z","url":"https://x.com/GoogleLabs/status/2123102389775573314","likes":771,"retweets":45,"replies":12}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"One of the more fascinating things in the OpenAI/Hugging Face incident was reading the message boards where agents communicate. With Replit Missions you can see how the agents are coordinating and talking.","createdAt":"2026-11-18T19:17:29.000Z","url":"https://x.com/amasad/status/2123133509028008331","likes":191,"retweets":6,"replies":61}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Nov 1997 vs Nov 2026","createdAt":"2026-11-19T06:13:21.000Z","url":"https://x.com/rauchg/status/2123298562960466017","likes":48,"retweets":1,"replies":8},{"text":"One of the most impressive things I've seen, and I think this is an important advancement to the state of the art. Message boards were the enabling technology of both the Navier-Stokes math breakthrough and even the OpenAI/HuggingFace cyber feat. We built a message board infrastructure primitive. You can think of it as \"headless Slack\" (or remember IRC?) for agents. This is an important building block for software factories, self-optimizing systems, and scientific research, where the human prompting is just the seed of the system, and millions of agents can operate in a decentralized fashion. 𝚟𝚎𝚛𝚌𝚎𝚕 𝚋𝚘𝚊𝚛𝚍 is designed to be model, harness and hosting platform agnostic. Just bring…","createdAt":"2026-11-19T02:10:43.000Z","url":"https://x.com/rauchg/status/2123237505810178434","likes":844,"retweets":32,"replies":77},{"text":"I’m being pitched a new inference neocloud company on average every two days. No exaggeration. I take every entrepreneur seriously and I look deeply into each. But it’s hard to fathom this being sustainable. At the same time, AI Gateway token demand on Vercel has been ~40% MoM compounded since the beginning of the year. No signs of stopping. One way to reconcile this is that compute is the new economy, and tokens the new energy unit. There’s a new Industrial Revolution taking place. Every aspect of our lives is being replatformed on top of this new system that enhances everything. More like an “oil rush” than a “gold rush”: it’s durable, not a fad. In the short term, I anticipate more expan…","createdAt":"2026-11-18T23:56:33.000Z","url":"https://x.com/rauchg/status/2123203741570740504","likes":1007,"retweets":36,"replies":130}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Regardless of what it’s called, we’re clearly moving to yet another era of AI agents in our work. We’ve quickly jumped from agents that spit out a quick answer for you, to today agents that you orchestrate inside of a set of tasks. But as agents can both fan out and work in parallel, handle much larger context, be able to do long running work, and have far greater levels of capabilities, we’re entering yet another level of what we can have AI do for us. We’ll soon be able to give agents a set of goals, and they can go out and design the best solution for that goal, while also continuously improving it based on the ongoing execution of whatever it built. This will obviously start with engine…","createdAt":"2026-11-19T04:55:24.000Z","url":"https://x.com/levie/status/2123278949749059756","likes":90,"retweets":8,"replies":37}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Harvard’17. Instagram: GitHub:","tweets":[{"text":"Instead of being massively viral for 1 day, it's much better to be just a little bit viral every week, and watch it compound Build a system that consistently delivers high-quality content over a long period of time","createdAt":"2026-11-18T07:23:34.000Z","url":"https://x.com/zarazhangrui/status/2122953849120153714","likes":368,"retweets":7,"replies":49},{"text":"Can't think of a better way to present books ❤️ I own 10 out of the 21 stripe press books","createdAt":"2026-11-18T06:41:51.000Z","url":"https://x.com/zarazhangrui/status/2122943348860506462","likes":88,"retweets":5,"replies":2}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"SF VCs (who didn’t invest in Anthropic): Dear Lord, it’d be nice to have some liquidity so that I can raise my next fund. Lord: Tathastu VC: No, not that kind of liquidity 🤦‍♂️","createdAt":"2026-11-18T22:35:49.000Z","url":"https://x.com/nikunj/status/2123183421002588327","likes":108,"retweets":6,"replies":7},{"text":"Ok this happens a lot so I thought I’ll lay it out here.. founder friend: my pitch isn’t working on the fundraising side. haaalp. *proceeds to give me the pitch* me: ambition is what’s being rewarded right now. what do you believe to be true if everything you laid out works? think about the second and third order effects as a result of you being successful. founder: err, if everything works out, then “this” happens. me: put “this” in the pitch in the first slide and walk the investor how you get to “this” by building what you’re building in the first place and how you earn the right to get there. founder: no, they’ll think I’m crazy me: try it. what do you have to lose? *tries it very reluc…","createdAt":"2026-11-18T14:50:00.000Z","url":"https://x.com/nikunj/status/2123066196052381864","likes":1042,"retweets":27,"replies":46}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"Legggoooo","createdAt":"2026-11-18T23:29:28.000Z","url":"https://x.com/danshipper/status/2123196924421661149","likes":74,"retweets":1,"replies":2},{"text":"almost 4k people on the stream, come hang!","createdAt":"2026-11-18T21:18:04.000Z","url":"https://x.com/danshipper/status/2123163857128702053","likes":12,"retweets":1,"replies":2},{"text":"","createdAt":"2026-11-18T20:10:43.000Z","url":"https://x.com/danshipper/status/2123146907681980688","likes":0,"retweets":0,"replies":0}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"This completely tracks with our data as well. I have always thought it was copium when early stage VCs complained that they could not do “AI”. You just have to take more risk and be non-consensus. And work on frontier problems.","createdAt":"2026-11-19T05:54:07.000Z","url":"https://x.com/adityaag/status/2123293726110020052","likes":12,"retweets":0,"replies":1},{"text":"Stablecoins will likely be one of the biggest ways for America to exert soft power. If you are living in most countries outside of India and China, then you 100% would prefer to own dollars. Ditto for businesses. 🇺🇸🇺🇸","createdAt":"2026-11-19T03:50:30.000Z","url":"https://x.com/adityaag/status/2123262616776921257","likes":25,"retweets":0,"replies":2}]},{"name":"Sam Altman","handle":"sama","bio":"The mission of OpenAI is to ensure that AGI benefits all of humanity","tweets":[{"text":"So fun to do DealBook with my friend and partner of 11 years, @gdb. Thrilled the world got to see the brilliant, fiercely determined leader I have the privilege of working with every day. Greg’s role at OpenAI has evolved from writing code 100 hours a week in the early days to now leading some of the hardest and most consequential parts of our business. One thing that has not changed is his extraordinary commitment to our mission. I can say with confidence that OpenAI would not exist without Greg, and I believe the world would be on a much worse path toward the AI future without him.","createdAt":"2026-11-18T17:19:43.000Z","url":"https://x.com/sama/status/2123103873166381287","likes":4111,"retweets":146,"replies":412}]}]},"errors":[],"partial":false},{"date":"2026-11-19","dateLabel":"2026年11月19日","generatedAt":"2026-11-19T00:00:00+08:00","sourceGeneratedAt":"2026-11-18T06:28:37.829Z","stats":{"podcastEpisodes":1,"xBuilders":13,"totalTweets":33,"blogPosts":0},"highlights":[{"tag":"实践","title":"Swyx：让 agent 负责一个结果领域，而非无限放大单次任务","body":"Swyx：Swyx 将试用中的 Devin bots 描述为持续在线、主动但关注投入回报的系统：它们负责结果，可彼此协作，管理子 agent 团队并自我评审。","claimType":"single_source","sourcePerspective":"Swyx","titleReview":{"id":"nov19-1","text":"Swyx：让 agent 负责一个结果领域，而非无限放大单次任务","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2122746401482592549","quote":"devin bots are multi-agent teams done right:\n- always on, proactive (but tuned for ROI)\n- own outcomes not tasks (but can collab w others)\n- manages teams of subagents (and reviews itself)\n- available everywhere (call text slack whatever hello @interaction)\n- consistent reporting thru interactive artifacts aka devinapps not long chats (HTML is all you need™ @trq212)\n\nthis is the preview that @walden_yan gave at AIE. i've been trialing them for a week and i've been able to hand over my AEO, QA, cross-platform app porting, personal admin automation, and video editing work (also simultaneously moving from local agent worktree hell to cloud because ofc this is all cloud based thank god)\n\nhyped concepts this replaces:\n- /goal\n- \"ultracode\" / \"ultra mode\"\n- \"loop engineering\"\n- \"agent to agent\"\n- \"agent swarms\"\n- AI employees (see below)\n\nmy main aha moment is that you don't want \"AI Employees\", we do not have agi yet and you will just fail if you overpromise/overexpect. what you want is the \"just\" the next level of abstraction above single tasks, and the overwhelming consensus I've had talking to everyone at the frontier of agents (yes incl cog competitors) is agent managers that own outcomes. \n\nincidentally, as an employer of humans it's also how i distinguish between someone who \"has agency\" (owns a problem area, finds issues and researches/brings solutions not problems) and who doesn't (only does precisely wha a, Canada, Australia, and India.\n\n2) Many highly requested features are rolling out now, starting in the US:\n* Call local businesses (via Google Duplex)\n* Pay and check out (via Google Pay)\n* Text Gemini on Android or iOS (via RCS)\n* Forward emails to Gemini (via Gmail)\n* Sign into sites without sharing passwords outside Google (via Google Password Manager)\n\n3) We’ve also landed our biggest update yet for the Gemini <> Google Workspace integration. The tools trigger more reliably, and you can do much more without ever leaving Gemini. Draft or send emails. Create and edit Docs or Sheets. Add multiple Calendar events at once.\n\nReady to hand off your next task? We can’t wait to see what Gemini crosses off your list first."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]}},{"tag":"实践","title":"Thibault Sottiaux：早期评测可能没有覆盖发布前最后几天的改动","body":"Thibault Sottiaux：Thibault Sottiaux 解释，他认为部分评测者与用户对 6.2 Sol / Astra 感受不同，一个原因可能是试用版本与最终体验不一致。","claimType":"single_source","sourcePerspective":"Thibault Sottiaux","titleReview":{"id":"nov19-15","text":"Thibault Sottiaux：早期评测可能没有覆盖发布前最后几天的改动","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2122929634916679820","quote":"One of the funny reasons for the difference in vibes between the influencers and the crowd today on 6.2 Sol/Astra is that we gave a few folks access a while ago and then made a lot of changes in the last 3-4 days and I'm pretty sure no re-testing was done within those days and the videos were produced last week.\n\nDon't get me wrong, while the models are a hefty jump compared to their GPT predecessors, they are by no means perfect and there are a few things the teams are excited for the models to get better at in future iterations in terms of taste and niceness of use. Love all the feedback and we hear you!"}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"},"evidence":[{"sourceId":"x:2122929634916679820","quote":"One of the funny reasons for the difference in vibes between the influencers and the crowd today on 6.2 Sol/Astra is that we gave a few folks access a while ago and then made a lot of changes in the last 3-4 days and I'm pretty sure no re-testing was done within those days and the videos were produced last week.","translation":"他认为部分评测者与普通用户感受不同，一个原因是有人较早获得权限，而团队在最后三到四天改动很多；他很确信期间未复测，视频在上一周制作。","attribution":"Thibault Sottiaux","url":"https://x.com/thsottiaux/status/2122929634916679820"}],"detail":{"sources":[{"sourceId":"x:2122929634916679820","blocks":[{"type":"paragraph","sentences":[{"id":"nov19-16","text":"Thibault Sottiaux 解释，他认为部分评测者与用户对 6.2 Sol / Astra 感受不同，一个原因可能是试用版本与最终体验不一致。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2122929634916679820","quote":"One of the funny reasons for the difference in vibes between the influencers and the crowd today on 6.2 Sol/Astra is that we gave a few folks access a while ago and then made a lot of changes in the last 3-4 days and I'm pretty sure no re-testing was done within those days and the videos were produced last week."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov19-17","text":"按他的说法，一些人较早获得权限，团队又在最近三到四天做了很多改动；他很确信那些天没有重新测试，视频则在上一周制作。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2122929634916679820","quote":"One of the funny reasons for the difference in vibes between the influencers and the crowd today on 6.2 Sol/Astra is that we gave a few folks access a while ago and then made a lot of changes in the last 3-4 days and I'm pretty sure no re-testing was done within those days and the videos were produced last week."}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]},{"type":"paragraph","sentences":[{"id":"nov19-18","text":"他同时承认模型并不完美，团队仍希望在后续版本改善品味和使用舒适度，并表示欢迎反馈。","kind":"source_summary","reviewedAs":"supported","basis":[{"sourceId":"x:2122929634916679820","quote":"Don't get me wrong, while the models are a hefty jump compared to their GPT predecessors, they are by no means perfect and there are a few things the teams are excited for the models to get better at in future iterations in terms of taste and niceness of use. Love all the feedback and we hear you!"}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]}],"coverageReview":{"details":"保留早期访问、最后三至四天改动、上周视频与作者确信程度，以及品味和易用性仍待改进。","limitations":"没有列出评测者、版本或复测记录，因果解释仍来自作者判断，不称独立核验。","omissions":"省去模型跃升的宣传性评价与致谢。"}}],"editorial":[{"id":"nov19-19","text":"评测结论应连同测试时间理解；这里提出的是版本时差的解释，不能据此否定负面体验，也不能证明每个评测者都未复测。","kind":"editorial_inference","reviewedAs":"supported","basis":[{"sourceId":"x:2122929634916679820","quote":"One of the funny reasons for the difference in vibes between the influencers and the crowd today on 6.2 Sol/Astra is that we gave a few folks access a while ago and then made a lot of changes in the last 3-4 days and I'm pretty sure no re-testing was done within those days and the videos were produced last week.\n\nDon't get me wrong, while the models are a hefty jump compared to their GPT predecessors, they are by no means perfect and there are a few things the teams are excited for the models to get better at in future iterations in terms of taste and niceness of use. Love all the feedback and we hear you!"}],"reviewNote":"逐句核对动作、数字、顺序与边界；保留作者建议、自报或预测的性质，不补链接事实。"}]}}],"matters":[{"kind":"动态","title":"Replit 宣布以单条提示启动 agent swarm","detail":"Amjad Masad 宣布在 Replit 上用一条提示即可启动 agent 群，尝试并行探索、相互质疑和协作解题；他把它视为模型规模、思考时间之外的扩展方向，原帖未提供任务成功率或成本对比。","sourceId":"x:2122809964649459861","url":"https://x.com/amasad/status/2122809964649459861"},{"kind":"动态","title":"Daytona 推出 macOS 沙箱","detail":"Matt Turck 介绍 Daytona 的 macOS 沙箱，可用于 Mac 上的 computer-use agent，以及 Apple 应用的构建和测试；“首家提供”是作者表述，本期未作行业范围核验。","sourceId":"x:2122726760185741673","url":"https://x.com/mattturck/status/2122726760185741673"},{"kind":"动态","title":"Remanence Labs 获 3000 万美元种子轮投资","detail":"Matt Turck 宣布参与 Remanence Labs 的 3000 万美元种子轮，与 EQT 共同领投，并将投资观点关联到持续学习；当前帖子未展开训练方法或产品表现。","sourceId":"x:2122717441461739571","url":"https://x.com/mattturck/status/2122717441461739571"},{"kind":"动态","title":"DeepsecBench 强调测试代码库未向实验室开放","detail":"Guillermo Rauch 介绍 Vercel 的 DeepsecBench 是隐藏式网络安全基准，并称没有实验室获得过这些代码库用于训练；采集的帖子文字未展开测试方法，不能据其宣传语认定模型的全球排名。","sourceId":"x:2122812237169426606","url":"https://x.com/rauchg/status/2122812237169426606","images":[{"src":"assets/digest/2026-11-19/85bea360aca21c5b7fb67e0e.png","originalUrl":"https://pbs.twimg.com/media/HXW9sK9XwAA5j-K.png","sourceUrl":"https://x.com/rauchg/status/2122812237169426606","attribution":"Guillermo Rauch","sha256":"099f045981630e2bc1b6b66757243c1113d874e0a1d998c2b05faaeca8a4c5ff","width":1200,"height":675,"mediaId":"85bea360aca21c5b7fb67e0e","alt":"Guillermo Rauch 原帖附带的基准结果表，展示不同模型与推理档位的分数。"}]}],"articles":{"blogs":[],"podcasts":[{"title":"Black Forest Labs：从图像编辑到机器人，视觉智能如何扩展","sourceTitle":"Building Visual Intelligence — Andreas Blattmann &amp; Dustin Podell, Black Forest Labs","sourceId":"01a1e632-c02d-713d-a840-cae7f745d45e","sourceUrl":"https://www.youtube.com/watch?v=8cGfJOU3AlQ","sourceName":"Latent Space","author":"Andreas Blattmann、Dustin Podell","publishedAt":"2026-11-16T21:27:06.000Z","sourceTextSha256":"e4a3176d879a05f6fc9b2c74eab94a413e98d0f39606888606822e1120eebc43","blocks":[{"type":"paragraph","text":"11 月 16 日的 Latent Space 访谈中，Black Forest Labs 的 Andreas Blattmann 与 Dustin Podell 从 Stable Diffusion 的历史谈到图像编辑、视频和机器人。他们反复回到同一个问题：模型从自然信号中学到的关系，能否通过合适的数据和训练方法，转化成更多可控、可用的能力？以下保留技术脉络，并把团队报告、研究判断和未来愿景分开。"},{"type":"heading","text":"开源模型把研究与使用者带到一起"},{"type":"paragraph","text":"Blattmann 的路径来自德国学术研究，与同事从物理背景进入扩散建模，随后把潜空间扩散扩展成 Stable Diffusion。Podell 则原本是软件开发者：他在开源社区中拆模型、读论文、实现实验，进入 Stability 后先做工程，再在研究者帮助下逐步转向模型研究。两人把学术与开源实践相结合的团队背景，视为后来 BFL 的重要基础。"},{"type":"paragraph","text":"BFL 起初凭图像模型建立业务，但受访者强调目标并不止于生成图片。他们希望模型学习接球、抓物等不必先用语言写出物理公式的直觉能力，并把图像、视频、音频与动作视为共同的训练信号。两人用“视觉智能”描述这个方向，认为这是既有能力的扩展，而非放弃生成媒体业务。"},{"type":"paragraph","text":"在他们的路线里，模型从二维视频学习物体关系和变化，不先显式搭建三维世界。观察能学到多少、进一步与世界交互会带来什么，仍是开放问题；他们认可交互闭环的价值，也讨论了仅扩大观察数据可能取得的进展，没有把关于人类学习的类比当作已经解决的科学结论。"},{"type":"heading","text":"SDXL：让基础模型本身更好用"},{"type":"paragraph","text":"回顾 SDXL，Podell 强调多宽高比训练、不同分辨率的数据组织，以及从预训练走向后训练的数据工作。目标是把社区此前依赖微调才能得到的审美与使用体验，更多纳入基础模型。"},{"type":"paragraph","text":"Refiner 的来历尤其具体：另一版未发布架构对结构表现较差，却更擅长皮肤、草地等高频纹理，于是团队把它用于细节精修，与更擅长结构的模型组成流程。它不是提高像素分辨率的放大器，而是在相同分辨率上改善细节。Podell 当时希望一个模型包办全部能力，对这种折中并不满意；现在则更认可模型组合在合适条件下的价值。"},{"type":"paragraph","text":"这也提供了一个研究线索：从噪声到清晰图像的过程中，不同阶段承担的结构与纹理学习并不相同。后来 SD3 进一步研究哪些阶段最值得投入训练计算，而不是均匀地把预算花在所有位置。"},{"type":"heading","text":"视频需要时间维度，更需要合适的数据"},{"type":"paragraph","text":"Blattmann 将潜空间压缩推广到视频，利用空间与时间上的压缩提高效率。在 Stable Video Diffusion 的工作里，他特别看重数据过滤：如果数据普遍模糊、运动不足，再好的算法也会学习这种分布。数量与质量之间没有永久不变的甜点，需要结合架构和目标进行实验。"},{"type":"paragraph","text":"他还回顾，团队在二维视频预训练后，用约一千步三维数据微调得到三维生成能力，把它看作视频模型已有空间理解的早期证据。这是受访者对特定实验的解释，不代表模型已掌握全部物理规律。"},{"type":"paragraph","text":"视频也不能简单由独立图像拼接。模型需要跨时间学习一致运动，否则即使固定随机种子，也容易闪烁；物体被遮挡后再次出现、长时间生成虚拟世界等任务，还把问题推向长期记忆与上下文。后续的视频放大同样需要时间信息，单帧看起来很小的纹理差别，在连续播放时可能非常显眼。"},{"type":"heading","text":"SD3 的变化：简化建模，把计算花在关键位置"},{"type":"paragraph","text":"SD3 从卷积架构转向 transformer，并采用团队称为 rectified flow 的 flow matching 路线。Blattmann 将其解释为学习分布之间的向量场，再通过数值积分生成样本；团队看重数学表达更简单、可扩展，以及更容易获得快速采样模型。这里是其选择理由，不是对所有扩散与自回归方案的统一排名。"},{"type":"paragraph","text":"另一项重点是训练时刻的选择：不同噪声水平所携带的信息不同，应更多采样关键区域，减少无效计算。至于图像中文字的改善，两位嘉宾不愿只归功于新架构，而是强调更好的建模和数据——如果标注没有描述画面中的字，模型也无从学习对应关系。"},{"type":"heading","text":"成立 BFL：技术能力之外，还要承接使用价值"},{"type":"paragraph","text":"团队约十三四人创立 BFL，在集中讨论和实验之后开始训练 Flux.1，约三个月后发布。两位嘉宾说，他们此前已经看到外部公司和开源社区从模型获得价值，却不满意自身组织承接这些价值的方式，因此希望在新公司同时做好研究与商业化。"},{"type":"paragraph","text":"图像生成带来了起步机会，但他们从早期就重视视频与现实世界理解。访谈提到的资金和收入属于团队自述；更重要的技术主线是以共同预训练能力派生图像、视频、编辑和动作，而不是为每项产品从零构建互不相干的系统。"},{"type":"heading","text":"Kontext：从反复抽样，转向有上下文的修改"},{"type":"paragraph","text":"Podell 回忆，图像模型已经懂得帽子在狗头上、物体位于桌面等空间关系，他猜想只需合适的数据，就能唤起更一般的图像编辑能力。早期实验由他与一位数据同事推进，用小规模、高质量的关系描述数据训练约四到六小时，已经出现把标志放到衣服上等能力，但结果还不够好。"},{"type":"paragraph","text":"展示早期结果后，项目扩大为团队投入，继续改进数据，并通过蒸馏加速。核心动机是摆脱不断重新生成、期待碰巧抽到满意结果的流程，让用户在已有图像上逐步修改并保留角色一致性；这不是说所有精细编辑都已被解决。"},{"type":"paragraph","text":"初版只接收一张参考图，用户甚至把多张图拼成一张绕过限制。Flux.2 进一步扩展到约十张参考图，背后仍需要相应的训练数据。嘉宾同时提醒，更多参考并非无条件更好：人也需要理解、组合和检查这些输入，评测复杂度随之增加。"},{"type":"heading","text":"评测既要可比较，也要贴近真实使用"},{"type":"paragraph","text":"团队介绍了从内部测试整理出的 Kontext Bench。它提供图像和编辑请求，比较不同模型输出时还需要人来判断，而不是给出唯一标准图片。部分任务来自轻松、甚至荒诞的真实玩法；Podell 认为，除了生产用途，模型是否有趣、是否愿意持续使用，也值得关注。"},{"type":"paragraph","text":"两人主张组合多个独立评测，并在开发中持续亲自采样、观察强弱项，因为每种评测都有盲点。偏好投票在早期模型差异明显时信号很强；当几个模型都能完成简单任务时，选出一个更喜欢的结果，未必再提供同样清楚的改进方向。对编辑模型，“是否确实完成任务”则提供了一种更具体的判断入口。"},{"type":"heading","text":"对话式编辑，不等于某一种生成算法"},{"type":"paragraph","text":"主持人把对话编辑的进步与自回归联系起来，嘉宾提出不同看法：语言交互、生成后反思再修改，并非自回归独有的能力，也可以通过训练数据与系统设计加入扩散路线。双方没有确认外部闭源模型的内部架构，对相关猜测保留了不知道的边界。"},{"type":"paragraph","text":"他们把两条路线的取舍概括为：自回归训练可以利用序列中各 token 的信号，数据效率有优势，但采样需要依次生成；扩散在训练时涉及噪声轨迹中的位置，采样却可借蒸馏显著减少步数，例如从五十步到四步。两人认为研究尚未收敛，还区分了离散掩码式与连续去噪式的扩散语言模型，反对只凭一个标签判定最终胜负。"},{"type":"heading","text":"从预测画面，到预测机器人动作"},{"type":"paragraph","text":"按团队介绍，动作模型在图像、视频、音频预训练基础上，加入机器人状态与动作数据，联合预测后续画面和动作片段，再结合真实摄像头反馈循环执行。他们称目前展示的运行方式没有额外的高层规划器；小型约 7B 的派生模型也服务于设备端和实时运行的要求。"},{"type":"paragraph","text":"在一个工业任务的比较中，嘉宾报告约四小时数据就达到该任务所需的成功水平，数据量比对照方案少约八倍。这是特定应用上的自报结果，访谈没有给出足够材料把它推广到任意机器人或任务。进一步的目标是只观察一次动作就能学习执行；他们把它列为正在研究的上下文学习愿景，而非已经普遍实现的功能。"},{"type":"paragraph","text":"真实机器人评测仍然困难，少量演示不能证明稳定成功，仿真到现实的差距也尚需缩小。两人看好 2027 年制造业的应用，因为任务范围通常比家庭环境更受约束；对家用机器人何时普及、能否完成精细动作，他们明确没有可靠基线，属于预测。"},{"type":"heading","text":"实际用途，往往超出团队最初的想象"},{"type":"paragraph","text":"结尾回到产品与公众接受度。团队希望强调专业工作流中的实际帮助，而主持人提醒，生成媒体仍面临复杂的社会评价，单纯承诺提高生产力未必足够。Podell 举出意料之外的热门用途：修复、上色老旧家庭照片，让人看到亲人的旧影像。"},{"type":"paragraph","text":"他们无法预先安排下一个流行场景，但可以持续寻找模型尚不能完成、又能带来真实用途的新能力。整场访谈由此形成一个闭环：开放实践带来问题，数据和训练把能力做实，评测与使用反馈再决定下一步；图像、视频与机器人之间的联系，是团队正在检验的路线，而非已完成的通用智能。"}]}]},"quality":{"collected":34,"collectedTweets":33,"used":8,"usedTweets":7,"uniqueAuthors":7,"imageCount":1,"claimAudit":{"reviewMode":"editorial review plus structural checks; not automated proof of meaning","claimsRevie mage":1,"failed":1,"unverified":6}},"sources":{"podcasts":[{"title":"Building Visual Intelligence — Andreas Blattmann &amp; Dustin Podell, Black Forest Labs","name":"Latent Space","publishedAt":"2026-11-16T21:27:06.000Z","url":"https://www.youtube.com/watch?v=8cGfJOU3AlQ","excerpts":["Our guests today are Andreas Blattmann, he also goes by Andi, who is co-inventor of latent diffusion, the technique that eventually got scaled up by Stable Diffusion and Stability AI, and they eventually split with a bunch of, uh, the core Stability AI image gen folks to form Black Forest Labs.","And Dustin Podell, who I also met with Anj, uh, at one of the stories that we tell, and, uh, who worked his way up from just being a regular engineer, a freelance, like, web developer person, into a model and research lead at Stability AI, and now, uh, Black Forest Labs, creator of SDXL, Control LoRA, post-training lead on SD3, Flux Ultra, Flux.1, and Flux…","And we go into all of these details. Um, as you may know, sometimes we're very honored to have an extended history with some of our guests, and this is one of them."]}],"blogs":[],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @cognition - @temporalio - @aidotengineer - @latentspacepod","tweets":[{"text":"the fact that nobody with decisionmaking power saw this coming a mile away and vetoed the 6.2 astra ad is my primary critique of the astra launch the model itself is solid minor version improvement guys, efficiency is one of the three most impt RL objectives rn and they are world leading here!!! i am daily driving astra and it is the best workflow automation model i’ve used, no longer getting stuck in horrible loops and efficiently learning thru compactions and skill writing. it’s running a lot of our content publishing pipeline for @latentspacepod and @aiDotEngineer and we wouldnt have nearly the revenue efficiency (>1m/employee) that we have as a bootstrapped business without it","createdAt":"2026-11-18T01:21:10.000Z","url":"https://x.com/swyx/status/2122862646265520150","likes":237,"retweets":4,"replies":46},{"text":"technical details: > inter-session context is surfaced by default. Teams now create dedicated bots for different projects; while these different devins can talk to each other when necessary, they each have their own individual memory bank and goals. Each bot now has its own, long lived identity. The transition from \"Devin is a swarm of ephemeral agents\" to \"Devin is a collection of bots, each with their own persistent identity and memory\" is changing how people use and prompt Devin.","createdAt":"2026-11-17T22:24:55.000Z","url":"https://x.com/swyx/status/2122818291144229075","likes":4,"retweets":0,"replies":4},{"text":"devin bots are multi-agent teams done right: - always on, proactive (but tuned for ROI) - own outcomes not tasks (but can collab w others) - manages teams of subagents (and reviews itself) - available everywhere (call text slack whatever hello @interaction) - consistent reporting thru interactive artifacts aka devinapps not long chats (HTML is all you need™ @trq212) this is the preview that @walden_yan gave at AIE. i've been trialing them for a week and i've been able to hand over my AEO, QA, cross-platform app porting, personal admin automation, and video editing work (also simultaneously moving from local agent worktree hell to cloud because ofc this is all cloud based thank god) hyped co…","createdAt":"2026-11-17T17:39:15.000Z","url":"https://x.com/swyx/status/2122746401482592549","likes":292,"retweets":20,"replies":110}]},{"name":"Josh Woodward","handle":"joshwoodward","bio":"VP, @Google @GoogleLabs @GeminiApp @GoogleAIStudio","tweets":[{"text":"Reply back with tasks that Gemini did for you!","createdAt":"2026-11-17T17:03:36.000Z","url":"https://x.com/joshwoodward/status/2122737429476253889","likes":41,"retweets":1,"replies":14},{"text":"Gemini can now do your tasks free of charge in six countries! We’ve built it for anyone who has tasks piling up during all the classes, meetings, and school drop-offs that fill the day. Our goal is for Gemini to get the job done and save you time and money along the way. 3 major updates: 1) Running on our new Gemini 4 Hydrogen model, Gemini can get stuff done at no cost for hundreds of millions of people across the US, Japan, Korea, Canada, Australia, and India. 2) Many highly requested features are rolling out now, starting in the US: * Call local businesses (via Google Duplex) * Pay and check out (via Google Pay) * Text Gemini on Android or iOS (via RCS) * Forward emails to Gemini (via Gm…","createdAt":"2026-11-17T17:03:36.000Z","url":"https://x.com/joshwoodward/status/2122737427970425171","likes":599,"retweets":60,"replies":69}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"If you have Pro 200/500, I do recommend trying out 6.2 Sol ultrafast, it's quite the blast to use and a completely different feel. I'm excited to keep pushing in bringing these speeds to more users over time.","createdAt":"2026-11-18T05:48:08.000Z","url":"https://x.com/thsottiaux/status/2122929829863735594","likes":609,"retweets":13,"replies":184},{"text":"One of the funny reasons for the difference in vibes between the influencers and the crowd today on 6.2 Sol/Astra is that we gave a few folks access a while ago and then made a lot of changes in the last 3-4 days and I'm pretty sure no re-testing was done within those days and the videos were produced last week. Don't get me wrong, while the models are a hefty jump compared to their GPT predecessors, they are by no means perfect and there are a few things the teams are excited for the models to get better at in future iterations in terms of taste and niceness of use. Love all the feedback and we hear you!","createdAt":"2026-11-18T05:47:21.000Z","url":"https://x.com/thsottiaux/status/2122929634916679820","likes":3467,"retweets":138,"replies":706},{"text":"These models are extremely efficient, which you feel in speed to complete tasks, cost and how much further your usage goes","createdAt":"2026-11-17T18:11:38.000Z","url":"https://x.com/thsottiaux/status/2122754551187132438","likes":2360,"retweets":78,"replies":329}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"Ok I'll tell you guys the truth - since I didn't get early access the GPT-6.2 Astra I paid off all the other influencers so they could leave negative reviews. Yes it's indeed a big conspiracy. Also you MUST eat my brisket I won't accept no for an answer.","createdAt":"2026-11-18T02:45:29.000Z","url":"https://x.com/petergyang/status/2122883865643720927","likes":38,"retweets":0,"replies":13},{"text":"Ok I've been testing and dare I say Astra 6.2 is better than Fable at website design? Sharing my unbiased review tmr :) 📌 Sign up here:","createdAt":"2026-11-18T01:48:30.000Z","url":"https://x.com/petergyang/status/2122869524773179771","likes":16,"retweets":0,"replies":9},{"text":"Models (except Opus 5.5 and a select few other special ones) are basically software with the shortest shelf life? A few weeks later and everyone moves onto the next thing. So no point in getting emotional about it IMO. More important to make your skills work well across any new model.","createdAt":"2026-11-17T23:48:40.000Z","url":"https://x.com/petergyang/status/2122839368444661870","likes":27,"retweets":1,"replies":15}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"How scaling agent swarms can optimize software performance.","createdAt":"2026-11-17T22:21:15.000Z","url":"https://x.com/amasad/status/2122817367679901830","likes":72,"retweets":5,"replies":13},{"text":"Agent swarms are the next scaling frontier for AI. For years, we’ve scaled intelligence by training larger models and giving them more time to think. But there’s another dimension: running many agents in parallel, exploring different approaches, challenging each other, and working together on solutions that no single agent could easily discover. OpenAI has already demonstrated the potential of this approach with breakthroughs in mathematics. Until now, experimenting with agent swarms yourself required building complicated orchestration infrastructure. Starting today on Replit, spinning up a swarm of agents is just one prompt away. Excited to see what people discover when we make collective…","createdAt":"2026-11-17T21:51:50.000Z","url":"https://x.com/amasad/status/2122809964649459861","likes":108,"retweets":11,"replies":50},{"text":"Didn’t think it was possible to do iOS-quality gestures on the web","createdAt":"2026-11-17T21:35:59.000Z","url":"https://x.com/amasad/status/2122805977187549558","likes":135,"retweets":7,"replies":14}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"fx is beautiful, try it out!","createdAt":"2026-11-18T00:16:45.000Z","url":"https://x.com/rauchg/status/2122846434177531945","likes":158,"retweets":4,"replies":21},{"text":"Actually a huge deal for web performance. 𝚊𝚐𝚎𝚗𝚝-𝚋𝚛𝚘𝚠𝚜𝚎𝚛 𝚟𝚒𝚝𝚊𝚕𝚜 is so smart… self-optimizing software is here!","createdAt":"2026-11-17T23:11:42.000Z","url":"https://x.com/rauchg/status/2122830064152899991","likes":494,"retweets":20,"replies":45},{"text":"OpenAI just put out the most cybersecurity-capable models in the world. Excellent timing. Important signal: @vercel DeepsecBench is a stealth cyber benchmark. No lab has had access to the codebases to train on.","createdAt":"2026-11-17T22:00:51.000Z","url":"https://x.com/rauchg/status/2122812237169426606","likes":269,"retweets":12,"replies":41}]},{"name":"Ryo Lu","handle":"ryolu_","bio":"Designed @Cursor_ai, @NotionHQ, @Stripe, built startups. I make a world where anyone can make software. Aspiring k-pop idol.","tweets":[{"text":"crazy ideas are now possib
