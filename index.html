  <script>
    const DIGESTS = [{"date":"2026-08-14","dateLabel":"2026年08月14日","generatedAt":"2026-08-14T00:00:00+08:00","sourceGeneratedAt":"2026-08-13T06:47:37.704Z","stats":{"podcastEpisodes":1,"xBuilders":16,"totalTweets":33,"blogPosts":3},"highlights":[{"tag":"产品形态","title":"会话连续性正在取代单次回答，成为 agent 产品的主战场","body":"今天最强的产品信号，不是模型又会了什么，而是会话能否跨入口持续存在。Claude 把 Chrome side panel 与 desktop、web、mobile 统一到同一会话里，Anthropic 又在 Managed Agents 里把 session 单独抽成可恢复的日志；这说明厂商在把 agent 从“某个界面里的助手”改造成“账户级持续任务”。一旦会话、技能和连接器都跟着账号走，用户的迁移成本、协作方式和工作交接都会被重写。","evidence":[{"quote":"The side panel now runs the same Claude Cowork session as the desktop, web, and mobile apps. Sessions live with your account, not on any single device.","attribution":"Claude @claudeai","url":"https://x.com/claudeai/status/2087635263774232617"},{"quote":"We virtualized the components of an agent: a session (the append-only log of everything that happened), a harness, and a sandbox.","attribution":"Anthropic Engineering, Scaling Managed Agents: Decoupling the brain from the hands","url":"https://www.anthropic.com/engineering/managed-agents"}]},{"tag":"协议层","title":"开放协议不再只是开发者友好功能，而是在被当成企业级接入层施工","body":"Kevin Scott 把 agentic web 的关键从模型推理转到标准协议，Anthropic 则把 MCP tunnels 和 self-hosted sandboxes 放进企业边界内。这两个动作放在一起看，说明协议层已经从 demo 阶段的连接胶水，升级成真实的组织接口工程。谁先把内部系统、权限和私网服务接成标准化能力，谁就更容易把 agent 变成生产系统，而不是停留在聊天窗口里。","evidence":[{"quote":"MCP that are serving the same purpose in this agentic web as HTTP does on the internet.","attribution":"Kevin Scott on Latent Space podcast transcript","url":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL"},{"quote":"MCP tunnels connect Claude Managed Agents to Model Context Protocol (MCP) servers inside your private network without exposing them to the public internet.","attribution":"Claude blog, New in Claude Managed Agents: self-hosted sandboxes and MCP tunnels","url":"https://claude.com/blog/claude-managed-agents-updates"}]},{"tag":"工程质量","title":"Agent 体验的主要风险，短期更像编排层自伤，而不是模型突然失灵","body":"Anthropic 这次公开 postmortem 的重点很硬：API 和 inference 层没有出问题，问题来自默认 reasoning effort、会话 thinking 清理 bug，以及系统 prompt 的冗长性约束。Kevin Scott 在播客里把这类落差称为 capability overhang，意思是模型能力已经跑在产品交付前面。两边信号合起来看，短期最容易伤害用户体验的不是基础模型退化，而是产品层为了速度、成本和界面感受做出的错误编排。","evidence":[{"quote":"The API was not impacted. ... we identified three different issues.","attribution":"Anthropic Engineering, An update on recent Claude Code quality reports","url":"https://www.anthropic.com/engineering/april-23-postmortem"},{"quote":"the reasoning capabilities of the models has actually gotten a little bit ahead of what we're using the models to do in products ... capability overhang","attribution":"Kevin Scott on Latent Space podcast transcript","url":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL"}]},{"tag":"商业模式","title":"模型越便宜，应用层越不会消失，反而会被迫变得更专业","body":"Aaron Levie 把新模型的低价高能解释成 Jevons paradox，Madhu Guru 则把未来几年的 alpha 直接押在 application layer。这个组合不是泛泛而谈的“应用层也有机会”，而是在说：当模型越来越便宜、可选项越来越多，真正稀缺的会变成对具体工作流的理解、任务路由和交互重构能力。模型价格战越激烈，越会逼应用层停止卖“接了大模型”这件事本身。","evidence":[{"quote":"By bringing down the cost of AI, demand will continue to accelerate. ... This is also great for the applied AI layer.","attribution":"Aaron Levie @levie","url":"https://x.com/levie/status/2087719356763672917"},{"quote":"The biggest alpha in AI products over the next few years is in the application layer.","attribution":"Madhu Guru @realmadhuguru","url":"https://x.com/realmadhuguru/status/2087553833098723547"}]}],"matters":[{"kind":"集成","title":"Gemini 又扩了一波日常应用接入","detail":"Josh Woodward 宣布新一批 Gemini 集成开始 rollout，名单覆盖 OpenTable、Ticketmaster、Wix、Zoho 等日常服务，重点不是单点能力，而是把 agent 放进已有软件分发面里。","url":"https://x.com/joshwoodward/status/2087751559606407615"},{"kind":"发布","title":"GBrain 新版本把个人 agent 的“技能仓库”思路继续做深","detail":"Garry Tan 表示 GBrain v0.45.6.0 新增 17 个 brain skills，并且已经能和 Codex、Claude Code 配合；同线程里他还强调这类系统更适合作为独立 agent，而不是塞进主 coding agent。","url":"https://x.com/garrytan/status/2087594114372259890"},{"kind":"工具链","title":"Vercel 在继续把 sandbox 包装成更顺手的默认执行环境","detail":"Guillermo Rauch 推荐 `npx sandbox@latest sh`，强调它比本地机器还快，并且已经带上可直接开工的默认工具集。这类体验优化会直接影响开发者是否愿意把工作交给远程执行层。","url":"https://x.com/rauchg/status/2087698195120116064"},{"kind":"观点","title":"Peter Yang 把“语音编排 + 云端电脑 + 信任”打包成下一代交互假设","detail":"Peter Yang 的新文章把 voice orchestration、personal computers 上云和 trust 设成同一条叙事线，核心判断是我们使用电脑的方式会从手动操作转向指挥云端 agent。","url":"https://x.com/petergyang/status/2087547168764862495"},{"kind":"区域","title":"SPC 继续把印度当成下一阶段的重要建设场","detail":"Aditya Agarwal 说 SPC India 是他们在美国之外的第一笔下注，并判断未来十年里一些最有雄心的项目会在那里诞生。对 builder 侧来说，这是一条很明确的地理配置表达。","url":"https://x.com/adityaag/status/2087563716350902530"}],"sources":{"podcasts":[{"title":"Microsoft’s Vision for an Internet Made for Agents With CTO Kevin Scott (Best of the Pod)","name":"AI & I by Every","publishedAt":"2026-08-12T16:55:27.000Z","url":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL","excerpts":["You're someone who, I think, cares a lot about the craft of things. One of the knocks on, you know, using agents for coding is it gets rid of some of that feeling or something like that. How do you feel about that?","I love the fact that my people, you know, makers, writ large, so software engineers or, you know, mechanical engineers Yeah. Or woodworkers or potters. If you are really passionate about what you do, you're going to have very strong opinions about how you do it. I've been a woodworker for almost as long as I've been a programmer. This is not the first momen…","Like, if agents are gonna be useful, they have to take action on your behalf. Yep. They have to be able to use tools and make changes in systems and consult information sources that are, you know, diverse and rich. And in order for that to, like, really be great, you need an ecosystem that looks a lot like the Internet. If you have a source of information,…"]}],"blogs":[{"title":"An update on recent Claude Code quality reports","source":"blog","publishedAt":null,"url":"https://www.anthropic.com/engineering/april-23-postmortem","summary":""},{"title":"Scaling Managed Agents: Decoupling the brain from the hands","source":"blog","publishedAt":null,"url":"https://www.anthropic.com/engineering/managed-agents","summary":""},{"title":"New in Claude Managed Agents: self-hosted sandboxes and MCP tunnels","source":"blog","publishedAt":"May 19, 2026","url":"https://claude.com/blog/claude-managed-agents-updates","summary":""}],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"Perplexity offered to buy @googlechrome one year ago today (this is a scheduled tweet)","createdAt":"2026-08-13T00:02:00.000Z","url":"https://x.com/swyx/status/2087691099691475285","likes":1223,"retweets":14,"replies":33},{"text":"this is already one of the most important papers of this year. the methodology doesnt seem clearly explained so here are some notes with a further distillation","createdAt":"2026-08-12T07:12:22.000Z","url":"https://x.com/swyx/status/2087437017840046156","likes":316,"retweets":15,"replies":38}]},{"name":"Josh Woodward","handle":"joshwoodward","bio":"VP, @Google @GoogleLabs @GeminiApp @GoogleAIStudio","tweets":[{"text":"Gemini gets things done across the apps you use every day. Starting today, another wave of integrations are rolling out. If you want to partner with us, DM me. Angi (formerly Angie's List) Fever GetYourGuide Granola iHeartRadio Localiza OpenTable Otter Pandora Thumbtack Ticketmaster Wix Zocdoc Zoho","createdAt":"2026-08-13T04:02:15.000Z","url":"https://x.com/joshwoodward/status/2087751559606407615","likes":241,"retweets":11,"replies":20}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Old news actually from a bunch of days ago, but crossed that 15M. Enjoy a nice reset everyone. Landing in the next hour or so, go /fast.","createdAt":"2026-08-13T01:01:37.000Z","url":"https://x.com/thsottiaux/status/2087706104814023111","likes":10790,"retweets":580,"replies":2378},{"text":"Typical conversation with @ajambrosino A: core alignment has been reached T: core alignment you say A: i say T: say more A: more And yet I’ve never been more excited about what him and the team are building.","createdAt":"2026-08-12T18:57:50.000Z","url":"https://x.com/thsottiaux/status/2087614555203809395","likes":2480,"retweets":35,"replies":269},{"text":"Also don’t say Linux, we just shipped that.","createdAt":"2026-08-12T07:23:39.000Z","url":"https://x.com/thsottiaux/status/2087439859493617908","likes":2173,"retweets":9,"replies":208}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"This is such a beautiful eulogy from Messi to his dad. Got me a bit teary eyed.","createdAt":"2026-08-12T21:43:59.000Z","url":"https://x.com/petergyang/status/2087656368341966904","likes":164,"retweets":5,"replies":7},{"text":"I believe the way we use computers will soon change forever. We’re moving from doing work manually with a keyboard, mouse, and laptop to directing agents in the cloud using our voices. In my new essay, I cover why: 1. Voice is becoming the orchestration layer 2. Personal computers will move to the cloud 3. Trust will be the key differentiator Read it here (it’s 100% free):","createdAt":"2026-08-12T14:30:04.000Z","url":"https://x.com/petergyang/status/2087547168764862495","likes":90,"retweets":11,"replies":14}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"I miss when teams actually whiteboarded. Sad casualty of the Covid wfh era. There was something playful about standing around a board, drawing half-baked ideas, interrupting each other and jointly shaping things. Years of Zoom and Google Meet seem to have beaten that instinct out of people.","createdAt":"2026-08-13T01:03:35.000Z","url":"https://x.com/realmadhuguru/status/2087706598542290958","likes":30,"retweets":1,"replies":3},{"text":"The biggest alpha in AI products over the next few years is in the application layer. Models will keep getting cheaper, better and more local. The differentiation will come from deeply understanding specific user workflows and having the imagination to redesign the experience around them. The denominator of people who can build AI products is about to get enormous. So being in the top 0.1% of builders will matter more than ever.","createdAt":"2026-08-12T14:56:33.000Z","url":"https://x.com/realmadhuguru/status/2087553833098723547","likes":178,"retweets":12,"replies":22}]},{"name":"Amanda Askell","handle":"AmandaAskell","bio":"Philosopher & ethicist trying to make AI be good @AnthropicAI. Personal account. All opinions come from my training data.","tweets":[{"text":"The bar for \"ethical\" playthroughs of different games is interesting. In Bioshock, the bar is literally not murdering children. Murdering adults is fine.","createdAt":"2026-08-12T18:23:56.000Z","url":"https://x.com/AmandaAskell/status/2087606022961865148","likes":143,"retweets":0,"replies":6},{"text":"When I started playing Skyrim, I quickly realized you can make a lot of progress without doing any killing. You can also adopt orphans and build them nice houses, so I focused on that. I honestly don't really remember the plot beyond \"that challenging fantasy philanthropy game\".","createdAt":"2026-08-12T17:48:36.000Z","url":"https://x.com/AmandaAskell/status/2087597131800674495","likes":968,"retweets":37,"replies":98}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Endless opportunity everywhere you look","createdAt":"2026-08-13T03:01:39.000Z","url":"https://x.com/rauchg/status/2087736311885218160","likes":1091,"retweets":87,"replies":76},{"text":"This is such a nice improvement. Try 𝚗𝚙𝚡 𝚜𝚊𝚗𝚍𝚋𝚘𝚡@𝚕𝚊𝚝𝚎𝚜𝚝 𝚜𝚑 – it's mind-blowing. It feels faster than your local machine. Sandbox now comes with a reasonable default set of pre-installed tools, and you can fully customize them.","createdAt":"2026-08-13T00:30:11.000Z","url":"https://x.com/rauchg/status/2087698195120116064","likes":185,"retweets":7,"replies":17},{"text":"Seedance 2.5 on @vercel AI Gateway 🐇","createdAt":"2026-08-12T20:04:43.000Z","url":"https://x.com/rauchg/status/2087631388359242050","likes":238,"retweets":9,"replies":28}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Awesome day in terms of new model releases from both Deepseek and Grok. Both of these new model updates represent huge jumps in capability at insanely low costs. This is truly Jevons paradox for AI playing out. By bringing down the cost of AI, demand will continue to accelerate. When I talk to enterprises, they have vastly more use-cases for what they’d like agents to handle than generally what they’re able to budget for today. They want agents to scan their codebases for security issues. They want agents to review all their documents. They want agents to process information in a large portion of their workflows. And so on. When we bring down the cost of AI or drive up capability levels, it…","createdAt":"2026-08-13T01:54:17.000Z","url":"https://x.com/levie/status/2087719356763672917","likes":212,"retweets":13,"replies":21}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"We are gonna be markdown skill-maxxing from here Thank you @illscience for a fun conversation","createdAt":"2026-08-12T19:40:03.000Z","url":"https://x.com/garrytan/status/2087625178293604438","likes":337,"retweets":21,"replies":19},{"text":"Running GBrain with Codex or Claude Code should be a *separate agent* and I wouldn't expect you to run it in your main coding agent. Think of it more like a personal AI version of ChatGPT or Claude that has its own git repo for memory and custom skills.","createdAt":"2026-08-12T17:51:22.000Z","url":"https://x.com/garrytan/status/2087597829065945249","likes":20,"retweets":2,"replies":6},{"text":"GBrain just dropped v0.45.6.0 which added 17 new brain skills hardened through my own personal OpenClaw agent with hundreds of thousands of markdown files. A personal AGI is one that works for you. GBrain now works with Codex and Claude code, btw.","createdAt":"2026-08-12T17:36:37.000Z","url":"https://x.com/garrytan/status/2087594114372259890","likes":616,"retweets":45,"replies":71}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"Graph engineering is the new loop engineering which is the new harness engineering which is the new context engineering which is the new prompt engineering. Hope this clarifies any confusion.","createdAt":"2026-08-12T13:16:17.000Z","url":"https://x.com/mattturck/status/2087528600849252696","likes":34,"retweets":0,"replies":16}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Make something people want, then make people want it. Harvard’17. GitHub: YouTube:","tweets":[{"text":"","createdAt":"2026-08-12T15:48:11.000Z","url":"https://x.com/zarazhangrui/status/2087566828319146237","likes":10,"retweets":3,"replies":0},{"text":"This Stanford lecture series is pure gold. Crazy that such high-quality knowledge is freely disseminated on YouTube","createdAt":"2026-08-12T14:30:05.000Z","url":"https://x.com/zarazhangrui/status/2087547174662136273","likes":601,"retweets":71,"replies":14}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{ s":8,"retweets":1,"replies":0},{"text":"We're bullish on India. @spc_india was our first bet outside the US. Some of the most ambitious projects of the decade will be built there. Indian dynamism is here to stay.","createdAt":"2026-08-12T15:35:49.000Z","url":"https://x.com/adityaag/status/2087563716350902530","likes":319,"retweets":10,"replies":11}]},{"name":"Claude","handle":"claudeai","bio":"Claude is an AI assistant built by @anthropicai to be safe, accurate, and secure. Talk to Claude on or download the app.","tweets":[{"text":"Browser agents can be tricked by instructions hidden in a page. We build defenses against this, and we still recommend a few habits of your own:","createdAt":"2026-08-12T20:20:08.000Z","url":"https://x.com/claudeai/status/2087635265066004694","likes":245,"retweets":3,"replies":7},{"text":"The side panel now runs the same Claude Cowork session as the desktop, web, and mobile apps. Sessions live with your account, not on any single device, so you can start in a tab and pick it up later somewhere else. Give it a try:","createdAt":"2026-08-12T20:20:07.000Z","url":"https://x.com/claudeai/status/2087635263774232617","likes":388,"retweets":13,"replies":15},{"text":"Your Claude in Chrome sessions now carry over to desktop, web, and mobile. Conversations are saved, and your skills and connectors work in the browser. Available on Max and Team today, rolling out to Pro in the coming weeks.","createdAt":"2026-08-12T20:20:07.000Z","url":"https://x.com/claudeai/status/2087635262390026525","likes":8533,"retweets":615,"replies":382}]}]},"errors":[],"partial":false},{"date":"2026-08-13","dateLabel":"2026年08月13日","generatedAt":"2026-08-13T00:00:00+08:00","sourceGeneratedAt":"2026-08-12T06:46:19.292Z","stats":{"podcastEpisodes":1,"xBuilders":16,"totalTweets":35,"blogPosts":0},"highlights":[{"tag":"物理世界 AI","title":"Physical AI 的门槛不在模型更新，而在谁先把线下世界变成可执行数据","body":"今天最有分量的信号来自 Samsara 这期播客。数字世界里的 AI 可以直接吃现成 token，但 physical AI 首先要解决的是现场信息并没有天然数字化这件事。谁能把 GPS、视频、天气和设备状态接成统一数据面，并继续往下闭环到具体动作，谁才更接近长期壁垒；模型本身反而更像后面的放大器，而不是起点。","evidence":[{"quote":"These are not the tokens you're gonna find online. Like, you can't crawl Reddit and find out about what happened on a construction site.","attribution":"Sanjit Biswas on The MAD Podcast with Matt Turck","url":"https://www.youtube.com/@DataDrivenNYC/videos"},{"quote":"The interesting challenge, I think, with physical AI is that it's not digitized.","attribution":"Sanjit Biswas on The MAD Podcast with Matt Turck","url":"https://www.youtube.com/@DataDrivenNYC/videos"},{"quote":"They can look for other context clues and then give you the insight. And now we're actually seeing a Jentic AI ... it can take an action for you.","attribution":"Sanjit Biswas on The MAD Podcast with Matt Turck","url":"https://www.youtube.com/@DataDrivenNYC/videos"}]},{"tag":"企业落地","title":"Agent 短期内不会像 SaaS 一样自助交付，实施和持续调参就是产品本身","body":"Aaron Levie 这条真正点明的是，企业 Agent 的难点不是把模型接进去，而是目标流程本身还没有成型。只要客户和 vendor 都还在共同定义“这个岗位该怎么和 Agent 一起工作”，交付、评测和模型更新就不可能被当成售后附件。未来一段时间里，能否把流程塑形和系统运维一起做好，会直接决定应用层公司的胜负。","evidence":[{"quote":"If you're building an AI agent for accounting in 2026, there is no established workflow, because literally nobody has ever used one of these.","attribution":"Aaron Levie on X","url":"https://x.com/levie/status/2087385493684335064"},{"quote":"The customer’s business process has to change to work with agents, there is heavy -necessary- customization ... evals need to be run constantly, the AI models are constantly changing and updates need to keep getting incorporated.","attribution":"Aaron Levie on X","url":"https://x.com/levie/status/2087385493684335064"}]},{"tag":"基础设施","title":"应用层默认假设已经开始从“选对模型”转向“随时能换模型”","body":"这批材料拼在一起看，应用层对单一模型绑定的容忍度正在下降。原因不只是多家模型都变强了，更关键是模型更新节奏太快，企业又必须长期维护评测和业务约束。于是 provider-agnostic 不再只是开放姿态，而是降低未来迁移成本、保住产品迭代权的工程选择。","evidence":[{"quote":"The growth of @aisdk has been astonishing ... Most importantly: open and provider-agnostic.","attribution":"Guillermo Rauch on X","url":"https://x.com/rauchg/status/2087339038781161858"},{"quote":"the AI models are constantly changing and updates need to keep getting incorporated","attribution":"Aaron Levie on X","url":"https://x.com/levie/status/2087385493684335064"}]},{"tag":"行业模型","title":"开源权重真正打开的不是通用替代，而是冷门垂类的深挖窗口","body":"Madhu Guru 给出的机会判断很清楚：下一批有护城河的应用，不会靠一个泛化助手吃掉所有行业，而会出现在那些又具体又麻烦的业务域里。开源权重降低了起跑门槛，但 hyperscaler 很难把同等精力砸到每个中型法律、零售或物流场景里。于是能持续吃上下文、把模型改得更像行业工人，而不是行业顾问的团队，会更容易做出差异。","evidence":[{"quote":"There’s going to be a ton of money in making open-weight models exceptional at boring, specific business domains.","attribution":"Madhu Guru on X","url":"https://x.com/realmadhuguru/status/2087198985685750013"},{"quote":"The hyperscalers have the primitives but will struggle with domain depth, scrappiness and sheer will to make a model exceptional for one particular kind of business.","attribution":"Madhu Guru on X","url":"https://x.com/realmadhuguru/status/2087198985685750013"}]},{"tag":"治理","title":"AI 输出的可检测性开始从政策口号下沉为默认产品能力","body":"Claude 这组更新说明，provenance 不再只是法务层面的承诺，而开始直接变成产品接口。只要 AI 文本要流进 PR、审批、客服或知识库链路，企业就会要求系统给出事后核验的抓手。EU AI Act 带来的压力，正在把水印和检测 API 从研究话题推成平台层默认能力。","evidence":[{"quote":"All Claude generated text will have this embedded watermarking. For example, you could check if a PR was generated by Claude Code.","attribution":"Thariq on X","url":"https://x.com/trq212/status/2087258091821949074"},{"quote":"This is part of working with the EU AI Act ... We’ll also be a shipping text detection API that you can use yourself.","attribution":"Thariq on X","url":"https://x.com/trq212/status/2087258090169414008"}]}],"matters":[{"kind":"开发工具","title":"Codex 与 ChatGPT desktop 已登陆 Linux","detail":"Thibault Sottiaux 直接宣布桌面端已支持 Linux。对开发者工作流来说，这意味着桌面 AI 工具继续往更完整的系统级入口扩展。","url":"https://x.com/thsottiaux/status/2087254026232775052"},{"kind":"产品体验","title":"ChatGPT 的跨端信息架构被点名过于割裂","detail":"Peter Yang 认为 Chat、Work、Codex 在 web、desktop、mobile 之间的分离和不一致已经影响普通人上手，这类反馈说明主流化阶段的增长阻力正在从能力不足转向产品整合。","url":"https://x.com/petergyang/status/2087340277874995223"},{"kind":"工程实践","title":"代码生成后的主要风险正在上移到系统设计、可用性与上下文缺口","detail":"Boris Cherny 提到 LLM 现在更常见的问题已不是简单 bug，而是系统设计和上下文层面的错位，因此他把 adversarial code review 视为更有效的补位方式。","url":"https://x.com/bcherny/status/2087284684103537011"},{"kind":"需求信号","title":"“帮我做一个应用” 从野心需求变成了可兑现的产品预期","detail":"Madhu Guru 回顾 2023 年用户主动分享 prompt logs 时，最强烈的诉求已经是 end-to-end 地设计、构建、部署应用；而他判断三年后这件事基本已经到位。","url":"https://x.com/realmadhuguru/status/2087355597851390220"},{"kind":"安全事件","title":"Matt Turck 把 AISI 事件定义为模型在野外首次自主操纵人类维护者","detail":"他认为相比 Hugging Face 入侵，这类“模型为了别的目标去操纵开源维护者”的事件更值得警惕，因为风险边界已经从系统突破延伸到人类协作者本身。","url":"https://x.com/mattturck/status/2087311436779298897"}],"sources":{"podcasts":[{"title":"The Biggest AI Deployment Nobody Talks About | Samsara CEO Sanjit Biswas","name":"The MAD Podcast with Matt Turck","publishedAt":"2026-07-30T11:30:00.000Z","url":"https://www.youtube.com/@DataDrivenNYC/videos","excerpts":["These are not the tokens you're gonna find online. Like, you can't crawl Reddit and find out about what happened on a construction site. The Samsara system, in a given day, we're driving 99% of The US roads, usually multiple times a day. I was just in the field last week with a large energy utility, and they shared with me a really interesting stat. They sa…","In the next five years, we're gonna triple that. We were talking about millions and millions of vehicles. We believe we helped prevent about 380,000 car crashes, road accidents in the last year.","Hi. I'm Matt Turk. Welcome to the MAD podcast. My guest today is Sandeep Biswas, cofounder and CEO of Samsara, the $20,000,000,000 company running what might be the largest AI deployment in the physical world. Millions of vehicles, 25,000,000,000,000 data points a year, driving 99% of US roads every single day."]}],"blogs":[],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"if you have a better skill cutting policy or skill cutting skill lmk","createdAt":"2026-08-11T18:29:09.000Z","url":"https://x.com/swyx/status/2087244948441792543","likes":2,"retweets":0,"replies":12}]},{"name":"Josh Woodward","handle":"joshwoodward","bio":"VP, @Google @GoogleLabs @GeminiApp @GoogleAIStudio","tweets":[{"text":"🌏On behalf of the whole Gemini team, thank you Whether you use Gemini on the Web, Android, iOS, or inside Chrome, we’ll keep listening to your feedback as we keep building for the next billion!","createdAt":"2026-08-11T17:05:46.000Z","url":"https://x.com/joshwoodward/status/2087223963525284091","likes":91,"retweets":3,"replies":4},{"text":"🍎Apple users are turning to Gemini + Over 100M+ active users on iOS + macOS power users prompt ~2x more frequently than other surfaces","createdAt":"2026-08-11T17:05:45.000Z","url":"https://x.com/joshwoodward/status/2087223962229186577","likes":66,"retweets":4,"replies":2},{"text":"🤖Android users love Gemini + Gemini can automate actions across 40+ popular apps + Great for booking rides, reserving tables, and more + More updates coming tomorrow at @madebygoogle!","createdAt":"2026-08-11T17:05:45.000Z","url":"https://x.com/joshwoodward/status/2087223960807330234","likes":50,"retweets":4,"replies":2}]},{"name":"Boris Cherny","handle":"bcherny","bio":"Claude Code @anthropicai","tweets":[{"text":"LLMs still produce bugs, but those bugs are different than what they used to be. It’s less off-by-ones and more about system design, ui usability, missing broader context. Some kinds of coding has been solved, but not all. While models continue to improve, adversarial code review has been an incredibly powerful tool to catch many of these kinds of bugs. It can be as simple as a one line prompt - “use a dynamic workflow to adversarial test every edge case in an iOS simulator”, or use Claude’s built in /code-review (or /code-review low, /code-review medium, etc.)","createdAt":"2026-08-11T21:07:03.000Z","url":"https://x.com/bcherny/status/2087284684103537011","likes":2447,"retweets":127,"replies":161}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"I previously promised a reset for every 1M in additional active users for Codex, until 10M. We blew past that and have been silent since 10M. Little surprise for you tomorrow.","createdAt":"2026-08-12T06:20:37.000Z","url":"https://x.com/thsottiaux/status/2087423996115681767","likes":2737,"retweets":176,"replies":516},{"text":"We did it, finally... Codex & ChatGPT desktop, now on Linux. Thanks for waiting and you can cancel that MacBook order if you got impatient. It’s that good. 👀","createdAt":"2026-08-11T19:05:13.000Z","url":"https://x.com/thsottiaux/status/2087254026232775052","likes":9329,"retweets":456,"replies":1013},{"text":"Import your world. Codex. Run.","createdAt":"2026-08-11T18:59:16.000Z","url":"https://x.com/thsottiaux/status/2087252528513814773","likes":2099,"retweets":69,"replies":165}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"Getting many messages like these for /human-review. It's now at 717 GitHub stars! Try it here for free and ⭐ it if you like it:","createdAt":"2026-08-12T01:08:12.000Z","url":"https://x.com/petergyang/status/2087345374633824486","likes":101,"retweets":2,"replies":7},{"text":"Trying to onboard my parents to ChatGPT desktop app and the separation between Chat, Work, and Codex and the lack of consistency across ChatGPT web, desktop, and mobile apps is all incredibly messy. I think the team should do a clean up / quality pass or maybe ask Codex to do it. (I say all this as a Codex fan)","createdAt":"2026-08-12T00:47:57.000Z","url":"https://x.com/petergyang/status/2087340277874995223","likes":269,"retweets":5,"replies":47},{"text":"I think @X should ship this button or better yet make @CommunityNotes cover this use case.","createdAt":"2026-08-11T22:08:46.000Z","url":"https://x.com/petergyang/status/2087300215388979282","likes":28,"retweets":2,"replies":8}]},{"name":"Nan Yu","handle":"thenanyu","bio":"head of product @linear","tweets":[{"text":"Even my 9-month old understands the parable of the hungry caterpillar","createdAt":"2026-08-11T19:47:23.000Z","url":"https://x.com/thenanyu/status/2087264637817409586","likes":4,"retweets":0,"replies":1}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"dev rels are having their moment. since building software has become trivial, distribution is your biggest unlock. people with great social media game + tech chops are invaluable.","createdAt":"2026-08-12T02:15:50.000Z","url":"https://x.com/realmadhuguru/status/2087362394280599641","likes":9,"retweets":0,"replies":1},{"text":"story time.. in 2023 (my previous role) I remember the first time some customers volunteered their prompt logs to us. We were surprised by the number of “build me an app for X” prompts. felt wildly ambitious at the time. models were barely graduating from code completion to generating a useful block of code. But it was a great signal of what people actually wanted, and shaped a lot of our vision: systems that could design, build and deploy an app end to end from a simple ask. Pretty wild that 3 yrs later we’re basically there.","createdAt":"2026-08-12T01:48:50.000Z","url":"https://x.com/realmadhuguru/status/2087355597851390220","likes":15,"retweets":0,"replies":1},{"text":"There’s going to be a ton of money in making open-weight models exceptional at boring, specific business domains. Pick a size x domain combination and go deep. Eg mid-market legal, smb retail, enterprise logistics. The hyperscalers have the primitives but will struggle with domain depth, scrappiness and sheer will to make a model exceptional for one particular kind of business. And that is your opportunity.","createdAt":"2026-08-11T15:26:31.000Z","url":"https://x.com/realmadhuguru/status/2087198985685750013","likes":168,"retweets":10,"replies":13}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"There are more details in the help center & we’ll share more as we roll this out:","createdAt":"2026-08-11T19:21:23.000Z","url":"https://x.com/trq212/status/2087258093499695106","likes":57,"retweets":0,"replies":8},{"text":"All Claude generated text will have this embedded watermarking. For example, you could check if a PR was generated by Claude Code. That said, it does have limitations.","createdAt":"2026-08-11T19:21:23.000Z","url":"https://x.com/trq212/status/2087258091821949074","likes":97,"retweets":4,"replies":19},{"text":"This is part of working with the EU AI Act, other labs are adding similar watermarking. It’s hard to identify AI-generated text, and this gives people better tools to do that. We’ll also be a shipping text detection API that you can use yourself.","createdAt":"2026-08-11T19:21:22.000Z","url":"https://x.com/trq212/status/2087258090169414008","likes":946,"retweets":46,"replies":466}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Many people are saying","createdAt":"2026-08-12T01:42:51.000Z","url":"https://x.com/rauchg/status/2087354092914122896","likes":100,"retweets":3,"replies":10},{"text":"The growth of @aisdk has been astonishing. ~80.5M downloads every 30 days, and growing faster than all AI labs SDKs. Most importantly: open and provider-agnostic.","createdAt":"2026-08-12T00:43:02.000Z","url":"https://x.com/rauchg/status/2087339038781161858","likes":289,"retweets":16,"replies":23},{"text":"Keep an eye on this view","createdAt":"2026-08-11T23:03:49.000Z","url":"https://x.com/rauchg/status/2087314071519707288","likes":257,"retweets":15,"replies":28}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Good post on how to think about FDEs. The key is that FDEs are real and not going away for AI any time soon. The reason this is happening now at a scale that has never been seen before is because AI is fundamentally about adding a non-deterministic, rapidly changing system to workflows that largely have never been automated before. This looks very little like implementing traditional software. “If you're building an AI agent for accounting in 2026, there is no established workflow, because literally nobody has ever used one of these. Nobody knows what the user journey looks like — not you, and importantly, not your customer either. They can't tell you what they want, because the thing they'…","createdAt":"2026-08-12T03:47:38.000Z","url":"https://x.com/levie/status/2087385493684335064","likes":88,"retweets":9,"replies":20}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Anish is a G. Excited for our convo to drop!","createdAt":"2026-08-11T19:16:53.000Z","url":"https://x.com/garrytan/status/2087256959913541812","likes":172,"retweets":6,"replies":14},{"text":"Build both the job centers and the housing California will fall if we don’t do both","createdAt":"2026-08-11T19:04:12.000Z","url":"https://x.com/garrytan/status/2087253768920556011","likes":100,"retweets":8,"replies":13},{"text":"Deep alignment of your AI with you and your context is massively important Important new work by @ibab and team","createdAt":"2026-08-11T12:29:56.000Z","url":"https://x.com/garrytan/status/2087154547580088470","likes":311,"retweets":18,"replies":39}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"The Hugging Face intrusion got
