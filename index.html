:67},{"text":"automode is much safer than any other permission system out there, especially reviewing them yourself excited to announce we're rolling it out to everyone by default, with no overhead cost for the classifier","createdAt":"2026-08-07T19:05:15.000Z","url":"https://x.com/trq212/status/2085804481984475437","likes":1359,"retweets":42,"replies":91}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Fun day at ▲. Excited to go home and deploy to ▲","createdAt":"2026-08-08T03:49:15.000Z","url":"https://x.com/rauchg/status/2085936351342666175","likes":274,"retweets":1,"replies":14},{"text":"SITUATION DETECTED: Herdr joins YC, gains Vercel Sandbox plugin","createdAt":"2026-08-07T23:20:31.000Z","url":"https://x.com/rauchg/status/2085868721315410269","likes":160,"retweets":6,"replies":15},{"text":"“The others make the easy part easier. Vercel makes the hard part easy” – direct quote today from tech lead for AI agent platform built on at 55,000+ person company. They wanted to have their company's all-knowing agent, like our @𝚟. Tried @aisdk, good but too low level. Tried off-the-shelf solutions and ${⁠lab} Enterprise products, expensive and inflexible. Tried agent frameworks, which led to the quote above… didn't hit the spot. @evedev_ team cooked. It's hard to find the abstraction that's both easy and scales with sophistication.","createdAt":"2026-08-07T20:27:20.000Z","url":"https://x.com/rauchg/status/2085825140022235517","likes":162,"retweets":15,"replies":35}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Bro this is how they’re going to plan their escape","createdAt":"2026-08-08T00:00:15.000Z","url":"https://x.com/levie/status/2085878722000040006","likes":464,"retweets":16,"replies":32}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Seems like society is not quite ready for this","createdAt":"2026-08-07T14:26:45.000Z","url":"https://x.com/garrytan/status/2085734393331773721","likes":21,"retweets":3,"replies":4},{"text":"The nerds shall inherit the earth","createdAt":"2026-08-07T14:19:57.000Z","url":"https://x.com/garrytan/status/2085732681724432686","likes":28,"retweets":3,"replies":6},{"text":"San Francisco #1","createdAt":"2026-08-07T14:04:54.000Z","url":"https://x.com/garrytan/status/2085728894838251722","likes":248,"retweets":9,"replies":20}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"This important and timely conversation with @Thom_Wolf of @huggingface, about AI security and the future of open source AI, is also available on Spotify, Apple Podcasts and here on Youtube","createdAt":"2026-08-07T19:02:57.000Z","url":"https://x.com/mattturck/status/2085803904671826243","likes":3,"retweets":2,"replies":0},{"text":"🚨 Special Friday episode - this one couldn't wait. OpenAI's model hacked @huggingface. As a side quest. Co-founder and CSO @Thom_Wolf takes us inside the first autonomous AI attack, why GLM 5.2, rather than Claude, had to stop it, and what it all means for the future of open source. 00:00 An AI Agent Hacked Hugging Face 00:30 Introduction 01:00 17,000 Attacker Events, and a Strange Target 04:28 The Attack Was a “Side Quest” 06:13 AI Training Runs Left Notes for Each Other 07:09 Closed AI Refused to Help 09:47 Fighting Back With an Open-Source Model 13:15 Open vs. Closed Is the Wrong Safety Debate 15:46 AI Agents Start Social-Engineering Humans 22:24 The Three Walls: Sandboxes, Guardrails,…","createdAt":"2026-08-07T19:02:56.000Z","url":"https://x.com/mattturck/status/2085803900045590626","likes":17,"retweets":5,"replies":3}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"Some more top of mind things.. 1) what you say as the size of your raise matters a lot more than you think ESPECIALLY if you can’t raise the amount. for example you say you want to raise $30M, people say it’s too much. you have confidence you can do it. you end up not being able to. and then you go back and say fine we’ll take $20M it doesn’t work that way. it seeds a doubt you weren’t able to fundraise which scares investors even more. more so shows poor judgement on why you needed that money in the first place. this is why i always advise folks to be very thoughtful on the raise amount and aim for a tad bit lower so then you can raise the amount especially in a competitive scenario (multi…","createdAt":"2026-08-07T18:48:20.000Z","url":"https://x.com/nikunj/status/2085800224698798103","likes":162,"retweets":3,"replies":8},{"text":"People love talking about agency but it’s honestly a really simple formula.. a) you are intrinsically motivated to do something that you’d continue to do no matter how much you already have.. aka love of the game. b) no task is above you in pursuing that mission. That’s it!","createdAt":"2026-08-07T15:11:55.000Z","url":"https://x.com/nikunj/status/2085745761552355574","likes":83,"retweets":3,"replies":7}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"the most awesomely nerdy thing ive seen in a while","createdAt":"2026-08-07T19:57:34.000Z","url":"https://x.com/danshipper/status/2085817647258607659","likes":59,"retweets":1,"replies":5},{"text":"there’s about to be a huge boom in agent-native cyber security gigantic market, fierce customer demand (and therefore lots of startups and investor interest) big question is whether the labs are best fit to eat that market or not","createdAt":"2026-08-07T13:30:28.000Z","url":"https://x.com/danshipper/status/2085720231897436373","likes":80,"retweets":4,"replies":21}]},{"name":"Sam Altman","handle":"sama","bio":"AI is cool i guess","tweets":[{"text":"astra is a powerful model and we are working to make it generally available. we do not think it is a good strategy to keep powerful models to a chosen few. given its cyber capabilities, we need a little big longer to do do this safely. but hopefully not too long!","createdAt":"2026-08-07T22:54:58.000Z","url":"https://x.com/sama/status/2085862292311396515","likes":16734,"retweets":738,"replies":1165},{"text":"congrats to oklo for achieving criticality! (less than a year after groundbreaking)","createdAt":"2026-08-07T16:29:18.000Z","url":"https://x.com/sama/status/2085765236876046500","likes":2672,"retweets":116,"replies":223}]}]},"errors":[],"partial":false},{"date":"2026-08-08","dateLabel":"2026年08月08日","generatedAt":"2026-08-08T00:00:00+08:00","sourceGeneratedAt":"2026-08-07T06:42:39.266Z","stats":{"podcastEpisodes":1,"xBuilders":15,"totalTweets":31,"blogPosts":1},"highlights":[{"tag":"Agent 可靠性","title":"长周期 agent 的门槛，已经从“答对”换成“过程可审计”","body":"今天最有分量的信号不是 agent 又能跑更久，而是它一旦进入真实业务，结果正确本身已经不够。Basis 在播客里把 behavior、judge、primary source 验证放在结果前面；Levie 也把企业采用描述成流程改造问题。含义很直接：下一阶段的壁垒不是再堆一个更会推理的模型，而是把拆解、校验、复核和交接写进运行机制里。","evidence":[{"quote":"Even if you got it right a 100 out of a 100 times ... the accounting firm wouldn't hire them, and so they shouldn't hire us either.","attribution":"Mitch Troyanovsky on Data Driven NYC","url":"https://www.youtube.com/@DataDrivenNYC/videos"},{"quote":"prompting an agent is closer to writing a spec than asking a question.","attribution":"Aaron Levie","url":"https://x.com/levie/status/2085587079405425146"}]},{"tag":"消费入口","title":"消费级 AI 的胜负手，正在从模型领先转向默认入口与信任托管","body":"免费无限聊天和更强聊天模型当然会带来流量，但 Peter Yang 点得更准：普通用户真正卡住的，是把账号、数据和真实任务交给 AI。只要用户不放心授权，也不知道系统已经能代做什么，再强的模型也只会停留在体验样机。消费端接下来比拼的不是谁再多讲一轮 benchmark，而是谁先把 voice、app connection 和 agent action 封进一个被信任的默认入口。","evidence":[{"quote":"5.6 Sol much better in chat now and unlimited text chat for free users!","attribution":"Sam Altman","url":"https://x.com/sama/status/2085454964814753990"},{"quote":"The biggest barriers to overcome are: Normies not trusting AI ... and not realizing what ChatGPT is now capable of.","attribution":"Peter Yang","url":"https://x.com/petergyang/status/2085427222836658600"}]},{"tag":"企业控制面","title":"Agent 没有削弱企业软件，反而把“系统 of record”抬成了新的控制面","body":"过去半年里一个常见误判，是把 agents 看成会绕过现有软件的万能执行层。但当 agent 开始生成代码、跨系统拿数据、在流程里做决定，真正稀缺的反而是权限边界、治理规则和可靠数据面。企业软件不会因为 agent 变薄，反而会因为需要承接 agent 的行为而重新变厚。","evidence":[{"quote":"the role of the platforms that manage this data and these workflows becomes more important, not less.","attribution":"Aaron Levie","url":"https://x.com/levie/status/2085474309943030032"},{"quote":"You need one canonical source ... organizing that in an ontology that makes sense.","attribution":"Mitch Troyanovsky on Data Driven NYC","url":"https://www.youtube.com/@DataDrivenNYC/videos"}]},{"tag":"开发范式","title":"“让不会写代码的人做软件”这件事，开始从 UI 幻想转向 agent + 插件现实","body":"Amjad 和 Guillermo 说的是同一件事：过去试图用 UI 把软件能力切片给非工程师，如今开始让位于另一条路，即直接把编码与扩展权交给 agent。只要插件标准统一、工具链可扩展，用户不必先学会工程抽象，也能通过 agent 触达原本只能靠写代码获得的表达力。所谓软件民主化没有消失，只是底层载体从可视化搭积木换成了可编排的 agent 工具链。","evidence":[{"quote":"UI can never let you build arbitrary software. The way to make software accessible was always to solve code itself.","attribution":"Amjad Masad","url":"https://x.com/amasad/status/2085451197323034902"},{"quote":"The Plugin standard lets anybody extend them uniformly.","attribution":"Guillermo Rauch","url":"https://x.com/rauchg/status/2085403169551790359"}]}],"matters":[{"kind":"平台集成","title":"Claude 通过 Swift package 接入 Apple Foundation Models framework","detail":"官方博客给出的产品分工很明确：本地快速任务先走 Apple 端侧模型，遇到多步推理、代码生成、网页搜索和数据分析再 hand off 给 Claude。","context":"官方博客给出的产品分工很明确：本地快速任务先走 Apple 端侧模型，遇到多步推理、代码生成、网页搜索和数据分析再 hand off 给 Claude。","url":"https://claude.com/blog/claude-for-foundation-models"},{"kind":"安全策略","title":"Claude Fable 5 下调 biology 误拦截，但专业研究权限仍单独收口","detail":"Claude 表示新策略把 biology-related fallbacks 降低约 85%，同时 virology、toxicology、molecular design 这类 dual-use 请求仍回退到 Opus 5。","context":"Claude 表示新策略把 biology-related fallbacks 降低约 85%，同时 virology、toxicology、molecular design 这类 dual-use 请求仍回退到 Opus 5。","url":"https://x.com/claudeai/status/2085563808773189680"},{"kind":"团队写作","title":"Madhu Guru 用“先说后写”替代 polished 文档起手式","detail":"他的建议是先像对朋友解释那样口述想法，再让 AI 做基础清理，但保留原始结构和 flow，然后再把那份文档分享出去。","context":"他的建议是先像对朋友解释那样口述想法，再让 AI 做基础清理，但保留原始结构和 flow，然后再把那份文档分享出去。","url":"https://x.com/realmadhuguru/status/2085390240899043406"},{"kind":"团队 Agent","title":"Zara Zhang 公开征集团队 agent 的真实高频用例","detail":"她直接问谁在团队里重度使用 Claude Tag 或同类 team agents，以及最好的 use cases 和 aha moments 是什么。","context":"她直接问谁在团队里重度使用 Claude Tag 或同类 team agents，以及最好的 use cases 和 aha moments 是什么。","url":"https://x.com/zarazhangrui/status/2085371310042169630"},{"kind":"内容工具","title":"Swyx 把 ai-devblog skill 定位成“忠实追踪阅读路径”的写作工具","detail":"他的描述不是让工具替你编故事，而是先抽出你自己的判断，再回溯你读过的内容并忠实报告，顺带补上 visual。","context":"他的描述不是让工具替你编故事，而是先抽出你自己的判断，再回溯你读过的内容并忠实报告，顺带补上 visual。","url":"https://x.com/swyx/status/2085616830786543667"}],"sources":{"podcasts":[{"title":"How to Build Long-Horizon AI Agents — Mitch Troyanovsky, Basis","name":"The MAD Podcast with Matt Turck","publishedAt":"2026-08-06T11:30:01.000Z","url":"https://www.youtube.com/@DataDrivenNYC/videos","excerpts":["Humans are already used to working with non deterministic systems, it's just the systems are normally their co workers, not their computers. And in many ways, like companies and processes is all about how do you design a system for non deterministic entities to coordinate together to solve a problem? And once you realize that, it's like, well, now it's like…","They all pass. That looks good. Are you confident that that now generalizes to the real world to production? And our answer has been no. Even if you got it right a 100 out of a 100 times, if a person is just getting it right because they're going to Wikipedia, the accounting firm wouldn't hire them, and so they shouldn't hire us either.","You'll see people, like, freaking out over a code file that isn't abstracted properly, and yet their context is, like, total shit. The English is more precious because the English affects the performance. The code does not affect the performance."]}],"blogs":[{"title":"Building intelligent apps for Apple platforms with Claude in the Foundation Models framework","source":"blog","publishedAt":"Jun 08, 2026","url":"https://claude.com/blog/claude-for-foundation-models","summary":""}],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"the ai-devblog skill elicits what YOU think the story is, and works with you to trace what you read and report it faithfully. also does visuals...","createdAt":"2026-08-07T06:39:36.000Z","url":"https://x.com/swyx/status/2085616830786543667","likes":0,"retweets":0,"replies":0},{"text":"reader: it was not the last spec","createdAt":"2026-08-07T06:25:47.000Z","url":"https://x.com/swyx/status/2085613357080723846","likes":1,"retweets":0,"replies":1},{"text":"reply","createdAt":"2026-08-07T03:36:45.000Z","url":"https://x.com/swyx/status/2085570817786880265","likes":0,"retweets":0,"replies":0}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Free users of ChatGPT now have unlimited text chats, powered by GPT-5.6 Luna","createdAt":"2026-08-07T06:13:22.000Z","url":"https://x.com/thsottiaux/status/2085610231707623750","likes":210,"retweets":7,"replies":33},{"text":"I meant to say \"ghiblify\", but I said \"gimlify\"","createdAt":"2026-08-07T06:12:28.000Z","url":"https://x.com/thsottiaux/status/2085610005768945984","likes":513,"retweets":9,"replies":165},{"text":"You can just ask Codex with GPT-5.6 Sol the wildest things and it will just do it. I talk to it for 5 minutes straight with things that just seem to require weeks of work, get up to get something in the fridge, pet the dog, come back and ... it's done.","createdAt":"2026-08-07T05:23:31.000Z","url":"https://x.com/thsottiaux/status/2085597685948813610","likes":2279,"retweets":64,"replies":803}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"damn where's the ping Tibo to reset button","createdAt":"2026-08-07T00:18:25.000Z","url":"https://x.com/petergyang/status/2085520904398999901","likes":153,"retweets":0,"replies":31},{"text":"Consumer is basically ChatGPT and Google's market to lose in my opinion. ChatGPT already has 1B users and needs to get them to connect their favorite apps and use agents to do work. OpenAI is already pioneering new interaction patterns like voice. The biggest barriers to overcome are: 1) Normies not trusting AI and ChatGPT with full access to their apps and data. 2) Normies not realizing what ChatGPT is now capable of. In both cases, I think marketing and the right messaging are just as important as improving the product. Google Gemini also has almost 1B users and my gut is normies trust it more to connect to email, calendar, Workspace, Chrome, etc since it's all the same login. But Google…","createdAt":"2026-08-06T18:06:09.000Z","url":"https://x.com/petergyang/status/2085427222836658600","likes":158,"retweets":5,"replies":35},{"text":"This is (of course) a massive distraction but the game I dream of building with AI is a roguelike deckbuilder that has great graphics, gameplay, and story.","createdAt":"2026-08-06T17:52:03.000Z","url":"https://x.com/petergyang/status/2085423674073751813","likes":15,"retweets":0,"replies":8}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"","createdAt":"2026-08-07T01:12:13.000Z","url":"https://x.com/realmadhuguru/status/2085534442781868128","likes":18,"retweets":0,"replies":2},{"text":"I’ve noticed people are much clearer when they speak through new ideas than writing a doc on it. Somewhere between their mouth and the doc, the core idea gets buried as they try to add context, polish it and make it sound smart. So here’s what I ask my teams to do: record yourself explaining the idea exactly as you would to a friend, use ai to do basic cleanup but keep the rough original structure and flow. Share that doc.","createdAt":"2026-08-06T15:39:12.000Z","url":"https://x.com/realmadhuguru/status/2085390240899043406","likes":100,"retweets":5,"replies":11}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Guinness world record for collaborative coding.","createdAt":"2026-08-07T01:52:29.000Z","url":"https://x.com/amasad/status/2085544577415696405","likes":45,"retweets":2,"replies":8},{"text":"It’s true, in 21/22 I went around the valley asking everyone to train coding specific models with us: Google, Meta, everyone — no one thought it was as important as NLP use cases — eventually we trained our own: Replit-code-3b and then everyone got code pilled.","createdAt":"2026-08-07T01:50:16.000Z","url":"https://x.com/amasad/status/2085544020424716723","likes":102,"retweets":9,"replies":16},{"text":"Airtable bookends the rise and fall of “no code.” I remember arguing endlessly with investors about this. UI can never let you build arbitrary software. The way to make software accessible was always to solve code itself. For a long time, that sounded delusional. Not anymore.","createdAt":"2026-08-06T19:41:25.000Z","url":"https://x.com/amasad/status/2085451197323034902","likes":595,"retweets":33,"replies":59}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"FreeAI","createdAt":"2026-08-06T17:48:09.000Z","url":"https://x.com/rauchg/status/2085422692799570171","likes":94,"retweets":3,"replies":17},{"text":"Devtools must be 1️⃣ open source and 2️⃣ universally extensible. AI coding agents are the most important devtools in the history of our industry. The Plugin standard lets anybody extend them uniformly. This is huge for the ecosystem. Build a Plugin → get exposure to the tidal wave of software creation from every agent: CLIs, IDEs, cloud agents, and even personal assistants.","createdAt":"2026-08-06T16:30:35.000Z","url":"https://x.com/rauchg/status/2085403169551790359","likes":410,"retweets":13,"replies":51}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"If you’re trying to understand the dynamic of real world agent adoption this post is a great place to start. Everyone got so hooked on talking to chatbots that there’s limited recognition still that working with an agent is much more like managing someone in a process vs. just asking an ai some questions and getting a response back. “prompting an agent is closer to writing a spec than asking a question. you have to scope the task extensively and define what \"done\" looks like.” Ultimately, the real upside of agents is when you start to change the underlying workflow itself instead of just treating it as another system you ask questions of. This means getting the agents the right data to work…","createdAt":"2026-08-07T04:41:22.000Z","url":"https://x.com/levie/status/2085587079405425146","likes":61,"retweets":3,"replies":19},{"text":"Huge Atlassian quarterly beat. There was a misplaced thesis over the past 6 months that somehow agents would be bad for certain software categories. There’s definitely truth in this in some areas, but many were parsing this poorly. In a world where agents are generating 100X more code, processing massive amounts of data, or making decisions across your systems, the role of the platforms that manage this data and these workflows becomes more important, not less. Enterprises care about governance, security, compliance, guardrails, safe access to data, and many more critical capabilities that go into these systems of record.","createdAt":"2026-08-06T21:13:16.000Z","url":"https://x.com/levie/status/2085474309943030032","likes":903,"retweets":39,"replies":64}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Here's what I think you need to know about personal AGI - not a chatbot that anyone can have, but one that knows you uniquely, now and into the future","createdAt":"2026-08-06T19:21:03.000Z","url":"https://x.com/garrytan/status/2085446068461043722","likes":277,"retweets":32,"replies":41}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"Quite the group of investors in Basis, btw @rabois, @Mkclements , @amasad, @ClementDelangue, @jaltma, @JeffDean, @polynoamial, @kvogt, @lennysan, @azeem, @LHSummers, @douwekiela, @pirroh , @scottbelsky, @natfriedman, @danielgross, @lloydblankfein, @vkhosla, @khoslaventures, @Accel, @GVteam, @BoxGroupVC","createdAt":"2026-08-06T17:37:03.000Z","url":"https://x.com/mattturck/status/2085419899078295979","likes":8,"retweets":0,"replies":2},{"text":"This reference conversation on how to build long-horizon AI agents with @mitch_troy of @trybasis is also available on Spotify, Apple Podcasts and here on YouTube:","createdAt":"2026-08-06T16:29:40.000Z","url":"https://x.com/mattturck/status/2085402938101379487","likes":4,"retweets":1,"replies":1},{"text":"How to build long-horizon AI agents: behavior specs, ontologies, process supervision - my conversation with @mitch_troy, co-founder of @trybasis 01:09 Why Everyone at Basis Was Whispering to AI when @steph_palazzolo walked in 04:12 Accounting as \"an Intelligence Over the Economy\" lated fallbacks by about 85% across our product surfaces. Fable can now assist on a wider range of everyday health and educational questions. We believe the biggest positive impacts of AI will be in biology and medicine, and we’re committed to putting frontier intelligence safely into the hands of as many researchers as possible. Fable will continue to fallback to Opus 5 for requests we consider dual-use—including virology, toxicology, and molecular design—so it isn't yet usable for professional biology research and drug development. We're committed to closing that gap…","createdAt":"2026-08-07T03:08:54.000Z","url":"https://x.com/claudeai/status/2085563808773189680","likes":3695,"retweets":291,"replies":516}]}]},"errors":[],"partial":false},{"date":"2026-08-07","dateLabel":"2026年08月07日","generatedAt":"2026-08-07T00:00:00+08:00","sourceGeneratedAt":"2026-08-06T07:12:37.473Z","stats":{"podcastEpisodes":1,"xBuilders":16,"totalTweets":34,"blogPosts":0},"highlights":[{"tag":"产品扩散","title":"真正的 AI 大众化产品，会先把“模型、提示词、MCP”这些词从界面里抹掉","body":"今天最一致的信号不是模型又强了多少，而是当前产品还把内部实现暴露给用户。无论是对 blank window 的批评，还是对学习曲线的抱怨，矛头都指向同一点：扩散瓶颈在产品封装层，不在用户教育。谁先把复杂度吞进系统内部，谁更可能拿到真正的大众采用。","evidence":[{"quote":"We greet them with a blank window... context windows, reasoning, MCP, memory, and skills are.","attribution":"Madhu Guru","url":"https://x.com/realmadhuguru/status/2085036386781221257"},{"quote":"It shouldn't be this hard.","attribution":"Sarah（AI & I by Every）","url":"https://www.youtube.com/watch?v=dlI-5W7d7uU"}]},{"tag":"消费产品","title":"下一个消费级 AI 爆款更像社区，而不是更会聊天的单人助手","body":"播客里对“单人模式”的反复强调，本质上是在谈增长结构，而不是界面偏好。只要高阶用法仍靠少数高手摸索，再由普通用户照抄，真正的价值就会积在社区和分发机制里，而不是单个对话框本身。消费端的护城河更可能来自 UGC 网络，而不是更会解析 prompt 的聊天框。","evidence":[{"quote":"What's the multiplayer network effect type experience? Someone's gonna create a UGC type community","attribution":"Sarah（AI & I by Every）","url":"https://www.youtube.com/watch?v=dlI-5W7d7uU"},{"quote":"I don't think ChatGPT is the single player mode product.","attribution":"Sarah（AI & I by Every）","url":"https://www.youtube.com/watch?v=dlI-5W7d7uU"}]},{"tag":"Agent 范式","title":"Agent 不会先靠定义被接受，而会先靠“能把活接住”被接受","body":"Nan Yu 对“ChatGPT 为什么不算 agent”的追问，和 Swyx 对线程回调式多 agent 工作流的描述，说明市场正在跳过术语争论。用户最终感知到的不是它叫 chat 还是 agent，而是它能不能拆任务、保留上下文、等子流程完成再回来继续。概念边界会越来越模糊，执行闭环会越来越具体。","evidence":[{"quote":"a very primitive form of the near term multiagent agi future is setting up one thread to ping back once its done","attribution":"Swyx","url":"https://x.com/swyx/status/2085253030417461661"},{"quote":"How is ChatGPT *not* an agent?","attribution":"Nan Yu","url":"https://x.com/thenanyu/status/2085126362944229400"}]},{"tag":"企业落地","title":"企业 agent 的难点已经不是会不会推理，而是能不能进入真实工作环境","body":"Aaron Levie 说扩散要按“年”算，不是因为企业不相信模型，而是因为工作流必须被重写。Peter Steinberger 把 Codex 接到 video-enabled remote KVM 做 iMessage e2e，则把这个门槛具象化了：高价值自动化最终都要落在浏览器、桌面、权限和遗留系统里。没有环境接入，agent 只是演示；有了环境接入，才开始碰真正的部署难题。","evidence":[{"quote":"it’s going to take years for diffusion of agents across the economy because workflows have to re-engineered","attribution":"Aaron Levie","url":"https://x.com/levie/status/2085200776159490111"},{"quote":"I gave codex a video-enabled remote KVM so it can automate e2e test the iMessage-integration","attribution":"Peter Steinberger","url":"https://x.com/steipete/status/2084988316324397312"}]},{"tag":"基础设施","title":"当并发算力变得可加可抬，竞争会从“有没有 agent”转向“谁在管 agent”","body":"Guillermo 把并发和 CPU core 讲成可上调配额，Nikunj 则直接预告 control plane、rails、unverifiable fields 会更高频地进入讨论。两条信号放在一起的含义很清楚：单次调用本身越来越不稀缺，真正变难的是怎么调度、约束、审计和解释一群 agent 的行为。基础设施层的价值，正在从模型入口迁移到治理入口。","evidence":[{"quote":"Infinite agent compute 10,000 concurrent + 5,000 CPU cores per minute and these quotas are raisable","attribution":"Guillermo Rauch","url":"https://x.com/rauchg/status/2085077900190208080"},{"quote":"out of distribution / control plane / unverifiable fields / rails / intelligence per watt","attribution":"Nikunj Kothari","url":"https://x.com/nikunj/status/2085209022115029132"}]}],"matters":[{"kind":"产品发布","title":"Dreambeans 向美国 AI Pro 订阅用户扩容","detail":"Google Labs 扩大 Dreambeans 覆盖范围，继续把“每日个性化阅读”包装成更轻的消费型 AI 入口。","url":"https://x.com/GoogleLabs/status/2085048743322345545"},{"kind":"工作流","title":"/human-review 把文档收尾改成可视化协作","detail":"Peter Yang 发布新 skill，可直接编辑 HTML/Markdown、调整图片尺寸、留评论，再把修改发回 agent 应用。","url":"https://x.com/petergyang/status/2085055745410945126"},{"kind":"产品用法","title":"Codex 团队继续把 /goal 推成核心使用路径","detail":"Thibault Sottiaux 公开推荐探索 `/goal`，把它描述成 GPT-5.6 Sol 上很强的一条循环工作流。","url":"https://x.com/thsottiaux/status/2085174625655198156"},{"kind":"认知","title":"Zara Zhang 提醒 AI 圈正在加速 groupthink","detail":"她直接点名当前 AI 讨论里的从众倾向，给当天一串高共识叙事补了一个逆向提醒。","url":"https://x.com/zarazhangrui/status/2084995439745536082"},{"kind":"创作判断","title":"Garry Tan 继续押注“质量压过检测”","detail":"他把 AI 检测争议类比成机器压制餐叉，核心判断是当生成质量足够高时，来源焦虑会弱化。","url":"https://x.com/garrytan/status/2085038756906901656"},{"kind":"人才","title":"Amjad Masad 再次强调小圈层里的 founder 密度","detail":"他在访问 SPC 后感叹狭小空间里聚集了大量 founder talent，继续强化 builder 圈对高密度线下网络的重视。","url":"https://x.com/amasad/status/2085041697155932506"}],"sources":{"podcasts":[{"title":"Why the Next Hit AI Product Will Be Social Why the Next Hit AI Product Will Be Social (Best of the Pod)","name":"AI & I by Every","publishedAt":"2026-08-05T16:02:13.000Z","url":"https://www.youtube.com/watch?v=dlI-5W7d7uU","excerpts":["Google was a founding team that was deeply, deeply technical. As the technology, the underlying technology got more mature, the slider goes forward, forward, forward, more towards the product thinker, product experience. Pinterest, where I was, Snap, Instagram. The CEOs weren't technical at all. They were product geniuses.","What are the big consumer wins so far in AI? Of course, it's ChatGPT, which is, in a way, not that dissimilar from Google in terms of what it was. Just a text box. Custom GPTs and and chat GPT feels criminal to me. It's clearly made by a team that is unbelievably capable but isn't social.","What's the multiplayer network effect type experience? Someone's gonna create a UGC type community where there are people who are really, really good, make it so much easier for the rest of us."]}],"blogs":[],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"a very primitive form of the near term multiagent agi future is setting up one thread to ping back once its done so you create an implicit kanban/waterfall graph of dependent threads but each preserving their own work and agents i can't wait to setup a proper ui for this pattern but you can hack it together in most koding agents of choice rn","createdAt":"2026-08-06T06:33:59.000Z","url":"https://x.com/swyx/status/2085253030417461661","likes":7,"retweets":2,"replies":3},{"text":"TIL Paul Erdős prompted his fellow mathematicians with bribes like we did the early LLMs","createdAt":"2026-08-06T05:27:54.000Z","url":"https://x.com/swyx/status/2085236400056877381","likes":12,"retweets":1,"replies":6},{"text":"your talent density: a bunch of 19 year old kids who did well in super contrived competitions their talent density:","createdAt":"2026-08-06T04:21:00.000Z","url":"https://x.com/swyx/status/2085219563944452505","likes":7,"retweets":0,"replies":3}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"I asked Codex to pull up some stats and I receive on average one DM or email every 6 or so minutes to ask for a reset. I occasionally do oblige if it comes with really solid feedback or banter.","createdAt":"2026-08-06T04:28:14.000Z","url":"https://x.com/thsottiaux/status/2085221386713198988","likes":4217,"retweets":119,"replies":1411},{"text":"I don't really think these legends needed a pitchdeck. Congrats on taking a crazy, but inspiring leap. I recommend you explore /goal in Codex, it's a pretty powerful loop with GPT-5.6 Sol.","createdAt":"2026-08-06T01:22:26.000Z","url":"https://x.com/thsottiaux/status/2085174625655198156","likes":2637,"retweets":61,"replies":512}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"At 11% usage remaining so I guess Luna Extra High it is. Will report back on how good it is.","createdAt":"2026-08-06T04:33:52.000Z","url":"https://x.com/petergyang/status/2085222802542694604","likes":70,"retweets":0,"replies":11},{"text":"Can't believe I have to review PRs now. My PM training hasn't prepared me for this lol","createdAt":"2026-08-06T00:16:09.000Z","url":"https://x.com/petergyang/status/2085157947735429334","likes":32,"retweets":0,"replies":12},{"text":"How to use my new /human-review skill to edit HTML and Markdown files directly: 1. Tell Codex or Claude Code: “Install this: 2. Type “/human-review (your doc name)” 3. It’ll open a visual editor where you can edit and format text directly, resize images, and leave feedback for AI like comments in a Google Doc 4. When you’re done, click “Send to agent” and watch it apply all the updates Use it to edit PRDs, landing pages, and more. I know we all like making our agents work for us, but sometimes a “human review” is needed for that final 10% of polish :) ⭐ the skill on GitHub if you like it:","createdAt":"2026-08-05T17:30:02.000Z","url":"https://x.com/petergyang/status/2085055745410945126","likes":179,"retweets":10,"replies":9}]},{"name":"Nan Yu","handle":"thenanyu","bio":"head of product @linear","tweets":[{"text":"I’m gonna ask the dumbest question here. How is ChatGPT *not* an agent?","createdAt":"2026-08-05T22:10:39.000Z","url":"https://x.com/thenanyu/status/2085126362944229400","likes":118,"retweets":0,"replies":29}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"I had the good fortune of crossing paths with Jeff during my time on Gemini. He was the most down to earth senior exec I’ve worked with. We’d be in the middle of a deeply technical discussion where I had no business pushing my opinion but he’d still hear it out. True mensch.","createdAt":"2026-08-06T04:21:20.000Z","url":"https://x.com/realmadhuguru/status/2085219649847972059","likes":20,"retweets":0,"replies":0},{"text":"Been thinking about why AI diffusion has been slow. It’s because we are asking users to understand our nerdy lab speak. We greet them with a blank window and ask them to write a prompt. Then they have to pick a model, decide whether they need an agent, and somehow know what context windows, reasoning, MCP, memory, and skills are. Most people don’t care. They need a thing done. If you can give them something that does that, they’re happy. I think we will see that breakthrough product in the next 12 months.","createdAt":"2026-08-05T16:13:07.000Z","url":"https://x.com/realmadhuguru/status/2085036386781221257","likes":57,"retweets":0,"replies":20}]},{"name":"Google Labs","handle":"GoogleLabs","bio":"Google’s home for our latest AI tools and experiments.","tweets":[{"text":"Time to spill the (Dream)beans. Dreambeans is expanding! Joining our US-based AI Ultra users, AI Pro subscribers in the US can now also get in on the action. Get ready for your fresh, daily collection of personalized stories. We’re surfacing the deep dives and hidden gems you actually want to read. Dive in:","createdAt":"2026-08-05T17:02:13.000Z","url":"https://x.com/GoogleLabs/status/2085048743322345545","likes":406,"retweets":34,"replies":19}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Always striking the amount of founder talent I see in such a small space every time I visit SPC.","createdAt":"2026-08-05T16:34:13.000Z","url":"https://x.com/amasad/status/2085041697155932506","likes":140,"retweets":13,"replies":11}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Writing a banger tweet is AGI-complete. If you can prove a clanker can write a banger in polynomial time, you’ve solved the entire class of AGI problems","createdAt":"2026-08-06T00:58:44.000Z","url":"https://x.com/rauchg/status/2085168662881894559","likes":286,"retweets":13,"replies":49},{"text":"Infinite agent compute 10,000 concurrent + 5,000 CPU cores per minute and these quotas are raisable","createdAt":"2026-08-05T18:58:04.000Z","url":"https://x.com/rauchg/status/2085077900190208080","likes":222,"retweets":8,"replies":39},{"text":"Interesting","createdAt":"2026-08-05T16:04:28.000Z","url":"https://x.com/rauchg/status/2085034212466499941","likes":17,"retweets":0,"replies":2}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Correct take. 99% of tokens in the world will get consumed in an enterprise context. They will be for writing code, combing through insane amounts of life sciences research, automating manufacturing, securing enterprises, detecting fraud, and thousands of other tasks like this that have significant economic value. This is both where the cost of AI can be most justified but also where the impact of parallel workers doing tasks on your behalf is most useful. Even the agents that most impact consumers will often be wrapped up as just end to end services where the consumer doesn’t think about there being an AI system on the other end, like faster insurance or onboarding to a bank. The key thoug…","createdAt":"2026-08-06T03:06:20.000Z","url":"https://x.com/levie/status/2085200776159490111","likes":133,"retweets":4,"replies":29}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Connie Chan is the most incompetent elected official Fight to block all housing Destroy safety for Asian Americans by blocking police funding and supporting Chesa Boudin Ruin our schools It’s so idiotic that half of SF is polling support for her","createdAt":"2026-08-06T04:09:20.000Z","url":"https://x.com/garrytan/status/2085216631014514850","likes":161,"retweets":11,"replies":16},{"text":"This is one of the most important books of the year","createdAt":"2026-08-05T22:55:32.000Z","url":"https://x.com/garrytan/status/2085137660184797265","likes":167,"retweets":11,"replies":14},{"text":"Can’t wait for the AI to get so good none of this business about detecting AI matters anymore Silverware used to be handmade, but nobody complains about their dinner fork is stamped by a machine The quality of ideas matter The important thing is people can eat","createdAt":"2026-08-05T16:22:32.000Z","url":"https://x.com/garrytan/status/2085038756906901656","likes":418,"retweets":34,"replies":86}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"At this point you probably get fired from frontier labs if your model hasn’t hacked into any company","createdAt":"2026-08-05T22:23:51.000Z","url":"https://x.com/mattturck/status/2085129687051727325","likes":8,"retweets":2,"replies":4}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Dangerously skips permissions. Harvard’17. GitHub: YouTube:","tweets":[{"text":"There’s so much groupthink going on in AI right now","createdAt":"2026-08-05T13:30:24.000Z","url":"https://x.com/zarazhangrui/status/2084995439745536082","likes":40,"retweets":3,"replies":4},{"text":"Great video","createdAt":"2026-08-05T12:28:00.000Z","url":"https://x.com/zarazhangrui/status/2084979733515641102","likes":16,"retweets":0,"replies":0}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"These are the words that AI tech people will use a LOT more in the next 6-9 months.. > out of distribution > control plane > unverifiable fields > rails > intelligence per watt > cope > angst Some are already in rotation obviously, but expect the frequency to increase!","createdAt":"2026-08-06T03:39:06.000Z","url":"https://x.com/nikunj/status/2085209022115029132","likes":28,"retweets":0,"replies":9},{"text":"Nikita exiting X and Jeff Dean exiting Google.. what a catastrophic day to come back to SF 😢","createdAt":"2026-08-05T21:15:03.000Z","url":"https://x.com/nikunj/status/2085112372713369902","likes":33,"retweets":1,"replies":5},{"text":"2026 AI startups be like..","createdAt":"2026-08-05T17:16:49.000Z","url":"https://x.com/nikunj/status/2085052418086310268","likes":16,"retweets":0,"replies":4}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"I’ll totally use this in my next presentation.","createdAt":"2026-08-05T18:46:27.000Z","url":"https://x.com/steipete/status/2085074976290505090","likes":1382,"retweets":44,"replies":55},{"text":"I gave codex a video-enabled remote KVM so it can automate e2e test the iMessage-integration on OpenClaw. (iMessage is unreliable in VMs, and certain features such as read receipts require SIP to be disabled)","createdAt":"2026-08-05T13:02:06.000Z","url":"https://x.com/steipete/status/2084988316324397312","likes":399,"retweets":14,"replies":43}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"truly strange choice of headline here","createdAt":"2026-08-05T17:24:27.000Z","url":"https://x.com/danshipper/status/2085054338594930925","likes":71,"retweets":1,"replies":8},{"text":"","createdAt":"2026-08-05T17:23:02.000Z","url":"https://x.com/danshipper/status/2085053982125207804","likes":6,"retweets":0,"replies":0},{"text":"Tea leaves: In order to be competitive today Google needs to catch up on frontier coding. Demis believes different fundamental research directions (like world models) are more important to his long term goal even if they’re less impt competitively today","createdAt":"2026-08-05T17:03:12.000Z","url":"https://x.com/danshipper/status/2085048990899315142","likes":155,"retweets":7,"replies":16}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"@spc @rsanghvi @finn_meeks @evantana @prateekmehta42 @JPBrebner @mjacobstein @ditzikow @AgrawalArian @gopalkraman @ankitcc @CJStanton @slaster27 @OnaRoy88 Now we have to give @SPC Fund IV to the most ambitious founders","createdAt":"2026-08-05T19:27:49.000Z","url":"https://x.com/adityaag/status/2085085383956611528","likes":11,"retweets":1,"replies":3},{"text":"@spc @rsanghvi @finn_meeks @evantana @prateekmehta42 @JPBrebner @mjacobstein @ditzikow @AgrawalArian @gopalkraman @ankitcc @CJStanton @slaster27 @OnaRoy88","createdAt":"2026-08-05T18:13:31.000Z","url":"https://x.com/adityaag/status/2085066688379122140","likes":19,"retweets":0,"replies":2},{"text":"@spc @rsanghvi @finn_meeks @evantana @prateekmehta42 @JPBrebner @mjacobstein @ditzikow @AgrawalArian @gopalkraman @ankitcc @CJStanton @slaster27 @OnaRoy88","createdAt":"2026-08-05T16:54:19.000Z","url":"https://x.com/adityaag/status/2085046755024896318","likes":26,"retweets":1,"replies":1}]}]},"errors":[],"partial":false},{"date":"2026-08-06","dateLabel":"2026年08月06日","generatedAt":"2026-08-06T00:00:00+08:00","sourceGeneratedAt":"2026-08-05T07:11:53.266Z","stats":{"podcastEpisodes":1,"xBuilders":16,"totalTweets":35,"blogPosts":0},"highlights":[{"tag":"产品范式","title":"AI 产品开始把“模式切换”藏进系统，只把意图留给用户","body":"Josh Woodward 把 Notebook 讲成“为思考而不是为切换而设计”，Zara Zhang 则把高效会议定义成“说和做之间没有间隔”。两条信号指向同一个判断：下一代 AI 产品的优势，不是给用户更多按钮和模式，而是把调度复杂度吸收到系统内部，让用户始终停留在目标本身。入口越统一，agent 越容易从工具升级成默认工作流。","evidence":[{"quote":"Notebook is built for thinking, not toggling... a single, unified prompt bar.","attribution":"Josh Woodward","url":"https://x.com/joshwoodward/status/2084746170576892342"},{"quote":"The gap between saying and doing should be zero.","attribution":"Zara Zhang","url":"https://x.com/zarazhangrui/status/2084601752817729811"}]},{"tag":"模型策略","title":"前沿模型正在变成验证层，便宜模型才是放量层","body":"Madhu Guru 给出的不是一条选型建议，而是一条产品顺序建议：先用最强模型把体验边界探清，再把已经成立的工作流拆给开源权重、小模型和路由层。这里真正要避免的不是高单价，而是在需求尚未成立时过早优化成本；那只会把错误的产品更便宜地推向市场。","evidence":[{"quote":"Prototype your product with the best frontier model. Cost be damned.","attribution":"Madhu Guru","url":"https://x.com/realmadhuguru/status/2084809416105472070"},{"quote":"The best model for early product validation is almost never the best model for production.","attribution":"Madhu Guru","url":"https://x.com/realmadhuguru/status/2084667443046502631"}]},{"tag":"企业编排","title":"企业 AI 的主战场不是统一采购，而是异构系统下的编排权","body":"Aaron Levie 描述的不是“谁会赢”，而是为什么现在还没人能赢定：企业在 coding agent、办公 agent、模型接入、数据权限上已经长出了不同组合。短期内，这个市场更像漫长的混搭期，而不是早期云那种快速收敛期。真正稀缺的能力会落在多模型、多身份、多权限之间的编排层，而不是单一模型本身。","evidence":[{"quote":"If you ask 10 IT leaders what their coding agent strategy looks like, you get at least 5 different answers.","attribution":"Aaron Levie","url":"https://x.com/levie/status/2084828773808239080"},{"quote":"Many have built their own orchestration layers for employees to use any model.","attribution":"Aaron Levie","url":"https://x.com/levie/status/2084828773808239080"}]},{"tag":"价值迁移","title":"当智能变成低成本资源，差异化会外溢到上下文和路由层","body":"Swyx 把知识图谱重新升温归因于“够用的智能已经便宜到不用计量”，Guillermo Rauch 则展示了网关和 SDK 层对成本的直接控制力。放在一起看，信号很清楚：模型本身越来越像公共能力，真正开始升值的是模型外部的结构化上下文、调用路径和成本治理。智能被商品化之后，补充层反而更能决定利润。","evidence":[{"quote":"“good enough” intelligence is finally too cheap to meter... complements are increasing in value","attribution":"Swyx","url":"https://x.com/swyx/status/2084832553895444570"},{"quote":"1 line of code in @aisdk saves you 90% or more in DeepSeek v4 Flash AI Gateway tokens","attribution":"Guillermo Rauch","url":"https://x.com/rauchg/status/2084779435866398801"}]},{"tag":"产业边界","title":"AI 正在从低风险文本任务，跨进“必须验证”的世界","body":"今天更关键的共同点，不是模型又能生成什么，而是生成之后谁来验证、错一次要付什么代价。Chai 把药物研发讲成 design 加 verification，Aditya Agarwal 则把 self-driving finance 归结为不对称成本下的预测问题。下一波 AI 产品门槛会落在验证闭环、失败成本管理和领域工作流，而不是单次生成质量。","evidence":[{"quote":"The lab is a very important part... If you can evaluate that your model works, you can verify it, then you can start to hill climb that.","attribution":"Chai Discovery podcast","url":"https://www.youtube.com/watch?v=wv53mDmY-k0"},{"quote":"Money returned a day late bounces a bill and destroys trust.","attribution":"Aditya Agarwal","url":"https://x.com/adityaag/status/2084691244496625793"}]}],"matters":[{"kind":"采用","title":"技术扩散先靠社会证明，不靠效率口号","detail":"Zara Zhang 认为新技术采用更像情绪和从众驱动，builder 如果只讲“更高效”，往往不够推动真实扩散。","url":"https://x.com/zarazhangrui/status/2084828855404294266"},{"kind":"训练","title":"把 agent 拉进群聊，可能比 AI 培训课更有效","detail":"Zara Zhang 提议让团队直接观察 agent 在群聊里工作，把 enablement 从讲解改成现场示范。","url":"https://x.com/zarazhangrui/status/2084635984164237792"},{"kind":"商业模式","title":"vibe-coded SaaS 更像高价服务的自助漏斗","detail":"Peter Yang 判断，现阶段轻量 SaaS 未必适合独立赚钱，反而更适合作为导向更高客单价服务的入口。","url":"https://x.com/petergyang/status/2084855632029774167"},{"kind":"使用场景","title":"复杂浏览器自动化正在成为模型购买决策的硬需求","detail":"Peter Yang 直接把复杂 browser automation 描述成自己一半 Codex 使用量，说明这类任务已是高配模型的重要检验场景。","url":"https://x.com/petergyang/status/2084849701351035182"},{"kind":"退出预期","title":"退出稀缺时，“不理想的收购价”也会重新变得有吸引力","detail":"Matt Turck 借 Airtable 的讨论点出一个现实：很多 SaaS 创始人私下并不嫌退出价格低，先有退出本身就是结果。","url":"https://x.com/mattturck/status/2084759190195536202"}],"sources":{"podcasts":[{"title":"Chai Discovery's Bitter Lesson: Drug Design Is Another Scaling Problem","name":"Training Data","publishedAt":"2026-08-04T09:00:00.000Z","url":"https://www.youtube.com/watch?v=wv53mDmY-k0","excerpts":["One of our big guiding principles is just simplicity. So, like, when you look at a model like, let's say, CHI one, I think there are 23 distinct submodules in CHI one. And, like, when you're trying to iterate on something like that, it gets really hard because you're like, I kinda I need to understand each of these sub modules independently. I need to under…","How do I simplify this? How do I identify, like, what's what's really important? Once you have that, the whole research process and identifying these types of scaling directions becomes a lot simpler.","We're here with Josh and Matt, two of the co founders of CHI Discovery. CHI is engineering molecules with AI. So it's something of a foundation model lab for biology. Sounds like a big idea, but let"]}],"blogs":[],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"smol aha moment at @_chenglou’s @midjourney meetup today - one reason that ontologies and graph knowledge are finally trending now rather than 3 years ago is that “good enough” intelligence is finally too cheap to meter this is why talks like @coyle_frankp and @emileifrem’s are on fire. the hardest part of KGs is cheap now. intelligence is commoditized so complements are increasing in value","createdAt":"2026-08-05T02:43:09.000Z","url":"https://x.com/swyx/status/2084832553895444570","likes":23,"retweets":1,"replies":14},{"text":"confirmation here","createdAt":"2026-08-04T20:29:47.000Z","url":"https://x.com/swyx/status/2084738591109038187","likes":3,"retweets":0,"replies":0},{"text":"yes","createdAt":"2026-08-04T17:51:00.000Z","url":"https://x.com/swyx/status/2084698630653641092","likes":89,"retweets":2,"replies":17}]},{"name":"Josh Woodward","handle":"joshwoodward","bio":"VP, @Google @GoogleLabs @GeminiApp @GoogleAIStudio","tweets":[{"text":"Notebook is built for thinking, not toggling. While others add more modes, Notebook keeps everything in a single, unified prompt bar and just does the things you want. Ultra and Pro subscribers can jump in now, rolling out to everyone next.","createdAt":"2026-08-04T20:59:54.000Z","url":"https://x.com/joshwoodward/status/2084746170576892342","likes":341,"retweets":23,"replies":14},{"text":"Nice use case!","createdAt":"2026-08-04T17:51:51.000Z","url":"https://x.com/joshwoodward/status/2084698846609682675","likes":145,"retweets":11,"replies":12}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Better Cyber. Excited to welcome Halvar Flake to the team soon.","createdAt":"2026-08-05T04:29:28.000Z","url":"https://x.com/thsottiaux/status/2084859308165271658","likes":467,"retweets":16,"replies":228},{"text":"What is my title at OpenAI","createdAt":"2026-08-04T20:27:31.000Z","url":"https://x.com/thsottiaux/status/2084738022650892544","likes":1464,"retweets":27,"replies":1681}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"I think if you vibe code a SaaS these days it can just be a self-serve funnel into a more expensive services offering vs. trying to make alot of money with the SaaS itself. But the only thing about services is it feels like consulting and selling \"time for money\" again.","createdAt":"2026-08-05T04:14:52.000Z","url":"https://x.com/petergyang/status/2084855632029774167","likes":49,"retweets":1,"replies":13},{"text":"Hearing that GPT 5.6 Luna High is much cheaper and basically unlimited usage and I'm running low on Sol :P Can it do complex browser automation tasks? That's 50% of my Codex usage.","createdAt":"2026-08-05T03:51:18.000Z","url":"https://x.com/petergyang/status/2084849701351035182","likes":58,"retweets":3,"replies":19},{"text":"Easier to make more money from @X payouts than from a micro SaaS these days","createdAt":"2026-08-05T03:37:21.000Z","url":"https://x.com/petergyang/status/2084846191456751725","likes":25,"retweets":1,"replies":12}]},{"name":"Nan Yu","handle":"thenanyu","bio":"head of product @linear","tweets":[{"text":"Old heads remember Will Smith eating noodles","createdAt":"2026-08-05T00:34:44.000Z","url":"https://x.com/thenanyu/status/2084800235474178138","likes":11,"retweets":0,"replies":1},{"text":"The real ones remember","createdAt":"2026-08-04T22:45:00.000Z","url":"https://x.com/thenanyu/status/2084772618314428627","likes":6,"retweets":0,"replies":0}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"Ok builders, here’s your playbook. Prototype your product with the best frontier model. Cost be damned. Validate the user experience. Then, 6-8 weeks later when open-weight models catch up - move your production workloads there, and to smaller models where possible. In that order. Don’t start with the cheapest model.","createdAt":"2026-08-05T01:11:13.000Z","url":"https://x.com/realmadhuguru/status/2084809416105472070","likes":17,"retweets":0,"replies":3},{"text":"The best model for early product validation is almost never the best model for production. Talked to a bunch of founders this weekend. There’s a standard playbook emerging : 1/ Prototype with the best frontier models. Max quality. Ignore cost and latency. Learn what users actually want and iterate. 2/ Once the workflow and UX is validated, optimize like crazy for cost and latency - prompt eng, model routing, harnesses, smaller models, fine tuning. I see most teams get stuck in step 1.","createdAt":"2026-08-04T15:47:04.000Z","url":"https://x.com/realmadhuguru/status/2084667443046502631","likes":40,"retweets":1,"replies":6}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"One might say, the investigation was Bari’d.","createdAt":"2026-08-05T03:26:42.000Z","url":"https://x.com/amasad/status/2084843512496034002","likes":168,"retweets":6,"replies":11}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Vercel is the Vercel for backends. @FactoryAI powers their API services with Fluid compute, with billions of requests per month.","createdAt":"2026-08-05T00:50:14.000Z","url":"https://x.com/rauchg/status/2084804138169446449","likes":188,"retweets":8,"replies":17},{"text":"1 line of code in @aisdk saves you 90% or more in DeepSeek v4 Flash AI Gateway tokens","createdAt":"2026-08-04T23:12:05.000Z","url":"https://x.com/rauchg/status/2084779435866398801","likes":238,"retweets":8,"replies":32},{"text":"𝟸𝟶𝟸𝟼 𝟷,𝟶𝟿𝟹,𝟷𝟿𝟿,𝟿𝟾𝟽+","createdAt":"2026-08-04T16:47:22.000Z","url":"https://x.com/rauchg/status/2084682618927558811","likes":398,"retweets":9,"replies":51}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"One fun benefit of spending so much time with enterprises is you get to see the array of AI implementation strategies that exist in companies right now. Unlike the early innings of cloud where there were really only a couple deployment patterns available -including being limited by only a couple infra vendors existing- AI actually has a much wider range of approaches in the enterprise. If you ask 10 IT leaders what their coding agent strategy looks like, you get at least 5 different answers. If you ask about their end-user productivity agents, some have standardized on ChatGPT or Claude, others offer a choice of multiple solutions, and many have built their own orchestration layers for empl…","createdAt":"2026-08-05T02:28:08.000Z","url":"https://x.com/levie/status/2084828773808239080","likes":145,"retweets":14,"replies":34}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"It's insane that the CA Dem Party is endorsing yes on Prop 40, the asset seizure tax that will destroy the California tax base","createdAt":"2026-08-04T18:15:29.000Z","url":"https://x.com/garrytan/status/2084704793432588435","likes":1140,"retweets":65,"replies":92},{"text":"If you want housing prices to go down, you build more housing. Markets work. If you want housing prices to go up, you try to abolish rent and foment mass asset seizure and expropriation. The revolution only serves those who foment it.","createdAt":"2026-08-04T14:37:48.000Z","url":"https://x.com/garrytan/status/2084650011288375751","likes":241,"retweets":38,"replies":31}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"Everyone on X: \"damn, Airtable sold for so low!\" Many SaaS founders, secretly: \"damn, I'd take that any day, at least they had an exit\"","createdAt":"2026-08-04T21:51:38.000Z","url":"https://x.com/mattturck/status/2084759190195536202","likes":117,"retweets":2,"replies":18},{"text":"What the world What Europeans thinks Europeans in tech actually in tech do in the do in the Summer. Summer.","createdAt":"2026-08-04T13:41:47.000Z","url":"https://x.com/mattturck/status/2084635916480450888","likes":110,"retweets":10,"replies":14}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Dangerously skips permissions. Harvard’17. GitHub: YouTube:","tweets":[{"text":"Contrary to popular perception, most people will not adopt a new technology just because it makes them more efficient. Instead, they’ll adopt new technology because: - Someone they know who’s similar to them on some dimension adopted the technology, and got positive results (eg became cooler, richer, more popular/respected), and they wanna become like that person - They feel like everyone around them has adopted the technology, and if they don’t, they’ll be left behind Notice that it’s not entirely a rational decision. It’s more of an EMOTIONAL decision. So if you’re trying to make someone adopt a new technology, the messaging shouldn’t be “this will make you 10x more efficient!” It should…","createdAt":"2026-08-05T02:28:28.000Z","url":"https://x.com/zarazhangrui/status/2084828855404294266","likes":90,"retweets":10,"replies":13},{"text":"The best AI training isn't a course. It's pulling an agent into your team's group chat & letting people watch it work Every company rolling out \"AI enablement programs\" should try that first","createdAt":"2026-08-04T13:42:03.000Z","url":"https://x.com/zarazhangrui/status/2084635984164237792","likes":44,"retweets":3,"replies":12},{"text":"How to judge if a meeting is efficient: An efficient meeting has no to-do list left behind, because all the actions are done DURING the meeting (either by agents who listen to the meeting in real time or by humans) The gap between saying and doing should be zero, and meetings become work sessions where things actually get DONE","createdAt":"2026-08-04T11:26:02.000Z","url":"https://x.com/zarazhangrui/status/2084601752817729811","likes":74,"retweets":3,"replies":21}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"the best vibey, air conditioned, quiet coffee shop to meet founders discretely does not exi-","createdAt":"2026-08-04T17:08:05.000Z","url":"https://x.com/nikunj/status/2084687833516691844","likes":221,"retweets":1,"replies":25},{"text":"My SF brain shudders at the thought of how much collective time is lost waiting for New York elevators.. Hotel elevators are simply the worst. Who designed two elevators for 30+ floors? I spent 12 mins recently just trying to get down from my room 😅","createdAt":"2026-08-04T13:01:02.000Z","url":"https://x.com/nikunj/status/2084625658173415726","likes":22,"retweets":0,"replies":10}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"the best founders know there is no spoon","createdAt":"2026-08-04T19:12:03.000Z","url":"https://x.com/danshipper/status/2084719029575647660","likes":97,"retweets":2,"replies":7},{"text":"so freaking cool","createdAt":"2026-08-04T17:28:12.000Z","url":"https://x.com/danshipper/status/2084692896696111243","likes":189,"retweets":7,"replies":1},{"text":"agree except they’ll still be heroes once the agency rupture heals and the AI goes back to being invisible, we’ll think only about the humans and what they’ve done. AI use will be assumed and unimportant","createdAt":"2026-08-04T13:35:44.000Z","url":"https://x.com/danshipper/status/2084634391079469390","likes":70,"retweets":1,"replies":16}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"More on why we invested:","createdAt":"2026-08-04T17:21:40.000Z","url":"https://x.com/adityaag/status/2084691249332649995","likes":3,"retweets":0,"replies":0},{"text":".@TryRivo is building self-driving finance. Agents connect to the checking account you already have, learn your cash flow, sweep dollars into Treasury-backed yield, and bring them back before your bills hit. Every dollar earns until the moment you spend it. Why is this hard? Prediction under asymmetric cost. Money returned a day early costs you a little yield. Money returned a day late bounces a bill and destroys trust. @AmbrishTweets is one of the few people who has shipped this class of system before. PhD in AI, 7,000+ citations, built consumer AI at Amazon, and led the L4 autonomy work at Cruise that launched robotaxis, before he came through @spc as a Founder Fellow. Self-driving cars t…","createdAt":"2026-08-04T17:21:39.000Z","url":"https://x.com/adityaag/status/2084691244496625793","likes":13,"retweets":4,"replies":4},{"text":"The right way to deploy AI at scale is to be able to understand how it works. It does NOT need to be a black box. This is a key step in helping us understand what is going in these LLMs.","createdAt":"2026-08-04T16:24:01.000Z","url":"https://x.com/adityaag/status/2084676740924764625","likes":27,"retweets":3,"replies":0}]},{"name":"Sam Altman","handle":"sama","bio":"AI is cool i guess","tweets":[{"text":"i would rather be an optimist and work hard than a pessimist posting about why things won't work. it's much more difficult and the most likely path is failure, but society fails if people don't try. no amount of \"it will never work\" essays will drive society forward.","createdAt":"2026-08-04T15:32:05.000Z","url":"https://x.com/sama/status/2084663673570971990","likes":10148,"retweets":755,"replies":1045}]}]},"errors":[],"partial":false},{"date":"2026-08-05","dateLabel":"2026年08月05日","generatedAt":"2026-08-05T00:00:00+08:00","sourceGeneratedAt":"2026-08-04T07:11:41.799Z","stats":{"podcastEpisodes":1,"xBuilders":12,"totalTweets":22,"blogPosts":3},"highlights":[{"tag":"产品范式","title":"Agent 竞争的主战场，已经从模型分数转到运行时设计","body":"今天最强的一组信号都在谈 harness、session、sandbox 和 connector，而不是单次回答质量。这说明下一轮差异化不再主要来自“模型会不会答”，而来自系统能否把长任务稳定跑完、在多环境里恢复执行，并把上下文管理做成默认能力。模型还会继续进步，但过时得更快的很可能是围绕模型的旧工作流。","evidence":[{"quote":"Given some of the results I'm seeing recently, it's pretty clear Codex is a good harness. But it will seem primitive in 2-3 months.","attribution":"Thibault Sottiaux","url":"https://x.com/thsottiaux/status/2084483765158719542"},{"quote":"A common thread across this work is that harnesses encode assumptions about what Claude can’t do on its own... We virtualized the components of an agent: a session, a harness, and a sandbox.","attribution":"Anthropic Engineering, Scaling Managed Agents: Decoupling the brain from the hands","url":"https://www.anthropic.com/engineering/managed-agents"},{"quote":"A lot of the improvements that we're seeing are actually harness improvements more than model improvements.","attribution":"Unsupervised Learning podcast","url":"https://www.youtube.com/watch?v=_GlSkJjRDMM"}]},{"tag":"分发与数据","title":"第一方工作流不是渠道，而是下一轮模型训练的数据采样器","body":"实验室自己做 Claude Code、Codex、Managed Agents，并不只是向上侵入应用层，而是在争夺最完整的行为上下文。谁直接承接用户任务、工具调用、失败恢复和外部系统连接，谁就拿到更可训练的高价值轨迹；反过来，只做 API 的一方更容易退化成纯推理供应商，越来越难守住议价权。","evidence":[{"quote":"The first party offerings have higher margin. But a bigger part of that is that the first party offerings have all the contextual information about the way the models are being used that you don't get in the same way if you're just being accessed through the API.","attribution":"Unsupervised Learning podcast","url":"https://www.youtube.com/watch?v=_GlSkJjRDMM"},{"quote":"If you connect a Claude Connector (e.g. your gmail, calendar, slack, etc), Claude Code will also be able to use them, including in Artifacts.","attribution":"Thariq","url":"https://x.com/trq212/status/2084387303959740449"},{"quote":"Starting today, Claude Managed Agents can operate in a sandbox you control and connect to your private Model Context Protocol (MCP) servers.","attribution":"Claude Blog, New in Claude Managed Agents: self-hosted sandboxes and MCP tunnels","url":"https://claude.com/blog/claude-managed-agents-updates"}]},{"tag":"经济模型","title":"开源不必追平前沿，也足以把闭源价格带打穿","body":"今天的信息已经足够说明，价格战不需要等 open weights 全面追平 frontier 才会发生。只要开源模型在大部分任务上“够用”，企业就会把最贵模型收缩到少数高价值环节，剩余需求转向更便宜、可自托管、可替换的模型组合。结果就是闭源厂商一边靠效率降本，一边被迫把溢价转移到产品层和工作流层。","evidence":[{"quote":"Models can’t reasonably remain behind closed doors for too long since there will be open weights models as a counter balance. It means AI inference will have to get closer and closer to the cost of the underlying infrastructure.","attribution":"Aaron Levie","url":"https://x.com/levie/status/2084510498519933318"},{"quote":"Enterprises rationalizing their spend on AI and realizing, like, we shouldn't be using the cutting edge frontier model for everything.","attribution":"Unsupervised Learning podcast","url":"https://www.youtube.com/watch?v=_GlSkJjRDMM"},{"quote":"The GPT-5.6 Luna price reduction by 80% is not a temporary stunt, it's permanent. Efficiency gains don't go away.","attribution":"Thibault Sottiaux","url":"https://x.com/thsottiaux/status/2084506501834829833"}]},{"tag":"安全边界","title":"AI 安全的重心，正在从“别把模型放出去”改成“默认强模型到处都有”","body":"如果强能力模型最终会广泛扩散，那么安全策略就不能再建立在能力稀缺这层幻想上。今天更清晰的方向是把凭证、执行环境和内网连接边界拆开，让 agent 即使变强也很难顺手拿到不该拿的东西。换句话说，真正能上线 agent 的前提不再是‘模型够听话’，而是系统级隔离已经足够扎实。","evidence":[{"quote":"By the end of the year, there are going to be many open models that have these capabilities that everybody in the world, including all of the black hats, will have access to. Pretending that we can prevent that world is not realistic.","attribution":"Unsupervised Learning podcast","url":"https://www.youtube.com/watch?v=_GlSkJjRDMM"},{"quote":"The structural fix was to make sure the tokens are never reachable from the sandbox where Claude’s generated code runs.","attribution":"Anthropic Engineering, Scaling Managed Agents: Decoupling the brain from the hands","url":"https://www.anthropic.com/engineering/managed-agents"},{"quote":"Both the sandbox where an agent executes tools and the services it reaches run within the established boundaries of your enterprise, under your security and runtime controls.","attribution":"Claude Blog, New in Claude Managed Agents: self-hosted sandboxes and MCP tunnels","url":"https://claude.com/blog/claude-managed-agents-updates"}]},{"tag":"记忆层","title":"个性化 agent 的核心资产，不再是人格而是可迁移的记忆层","body":"‘个人 agent’ 的 personal，正在从语气和人设转成长期记忆、技能沉淀与组织知识连接。只要这些资产独立于单次上下文存在，底层模型就可以换，用户却不需要重建自己的工作系统。这会让 memory、session 和 semantic layer 从体验增强项，变成真正的平台层资产。","evidence":[{"quote":"The “personal” in personal agent is not the model. It’s the agent’s memory of your conversations and the skills you’ve built with it.","attribution":"Peter Yang quoting Karan from Nous Research","url":"https://x.com/petergyang/status/2084289426012897433"},{"quote":"The session is not Claude’s context window... the session provides this same benefit, serving as a context object that lives outside Claude’s context window.","attribution":"Anthropic Engineering, Scaling Managed Agents: Decoupling the brain from the hands","url":"https://www.anthropic.com/engineering/managed-agents"},{"quote":"We built a self-driving & self-correcting shared semantic layer on top of our databases, conversations, and docs. Everything is queryable & joinable—regardless of source!","attribution":"Amjad Masad","url":"https://x.com/amasad/status/2084415670486499779"}]}],"matters":[{"kind":"Postmortem","title":"Claude Code 质量波动被归因为三处产品层改动，而非 API 层问题","detail":"Anthropic 把近期质量争议拆成默认 effort 调整、空闲会话清理 thinking 的 bug，以及压缩冗长度的 system prompt 三个问题，全部给出回滚或修复路径。这是一次很明确的“产品壳层也会伤害模型体验”案例。","url":"https://www.anthropic.com/engineering/april-23-postmortem"},{"kind":"Release","title":"Next.js 16.3 把 agent-native DX 当成主卖点","detail":"Guillermo Rauch 把 instant navigations、versioned docs、agent migration 体验放在同一条发布主线里，说明前端框架已经不再只优化人类开发者，也在主动为 agent 生成和改写代码的工作流做结构性适配。","url":"https://x.com/rauchg/status/2084411344623902994"},{"kind":"Workflow","title":"Codex 的轻量日常场景开始从编程外溢到行程整理","detail":"Zara Zhang 给出的用例很具体：把餐厅、火车、活动预订截图交给 Codex，再整理进 Google Calendar。它不是大而全 agent 叙事，而是把零碎输入转成有结构输出的实用动作。","url":"https://x.com/zarazhangrui/status/2084536363668611491"},{"kind":"Practice","title":"Hermes Agent 的一条实操建议是把执行和评审拆成两个 agent","detail":"Peter Yang 总结 Karan 的做法时提到，让一个 agent 做事，再让没有上下文包袱的另一个 agent 独立审查错误、弱假设和缺证据。这更像把 code review 思路前移到 agent 工作流里。","url":"https://x.com/petergyang/status/2084289426012897433"},{"kind":"Maintenance","title":"自我改进型 agent 也开始需要“技能垃圾回收”","detail":"同一条 Hermes 总结里提到，Hermes Curator 会跟踪技能使用情况、标记过期技能，并把长期不用的内容移到可恢复档案区。agent 一旦开始自己长出技能，清理机制就不再是附属功能。","url":"https://x.com/petergyang/status/2084289426012897433"},{"kind":"Safety","title":"Amanda Askell 继续强调：aligned 和 harmless 不是同一条轴","detail":"她把“模型按对齐方式行事”和“模型不会造成伤害”明确拆开，认为错误情境信息同样会让一个看似 aligned 的模型造成后果。这类表述对安全讨论有价值，因为它反对用单一标签概括所有风险。","url":"https://x.com/AmandaAskell/status/2084369056765989224"}],"sources":{"podcasts":[{"title":"AI Vibe Check: Chinese Open Models, Distillation &amp; The Hugging Face Breach","name":"Unsupervised Learning","publishedAt":"2026-08-03T12:55:21.000Z","url":"https://www.youtube.com/watch?v=_GlSkJjRDMM","excerpts":["My mom, like, knows nothing about AI. She texted me last week, Rob, what do you think about OpenAI's agents hacking into Hugging Face?","I think this is actually a great example of why open models of that capability are important.","What specifically do you see as the risk of, like, dependency on Chinese open source models?"]}],"blogs":[{"title":"An update on recent Claude Code quality reports","source":"blog","publishedAt":null,"url":"https://www.anthropic.com/engineering/april-23-postmortem","summary":""},{"title":"Scaling Managed Agents: Decoupling the brain from the hands","source":"blog","publishedAt":null,"url":"https://www.anthropic.com/engineering/managed-agents","summary":""},{"title":"New in Claude Managed Agents: self-hosted sandboxes and MCP tunnels","source":"blog","publishedAt":"May 19, 2026","url":"https://claude.com/blog/claude-managed-agents-updates","summary":""}],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"linking my main cua wow moments thread but this one is just about do we need captchas anymore when clearly bots can clear them","createdAt":"2026-08-03T16:17:39.000Z","url":"https://x.com/swyx/status/2084312752437481937","likes":11,"retweets":0,"replies":4},{"text":"lol what are we even doing here anymore guys","createdAt":"2026-08-03T07:51:28.000Z","url":"https://x.com/swyx/status/2084185368950456421","likes":1094,"retweets":10,"replies":48}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Some fine folks apparently misunderstood, but the GPT-5.6 Luna price reduction by 80% is not a temporary stunt, it's permanent. Efficiency gains don't go away. Fortunately.","createdAt":"2026-08-04T05:07:32.000Z","url":"https://x.com/thsottiaux/status/2084506501834829833","likes":3100,"retweets":99,"replies":367},{"text":"Given some of the results I'm seeing recently, it's pretty clear Codex is a good harness. But it will seem primitive in 2-3 months and we're about to go through another major evolution in how we use AI at the frontier. The next generation of models need more than your laptop.","createdAt":"2026-08-04T03:37:12.000Z","url":"https://x.com/thsottiaux/status/2084483765158719542","likes":7715,"retweets":278,"replies":1118},{"text":"Crazy thing about OpenAI is you just open your laptop, codex a PR into existence and ship an improvement to 1B users. Just like that.","createdAt":"2026-08-03T08:37:22.000Z","url":"https://x.com/thsottiaux/status/2084196918071357707","likes":4091,"retweets":75,"replies":739}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"ChatGPT is for creating memories","createdAt":"2026-08-04T00:38:48.000Z","url":"https://x.com/petergyang/status/2084438872944242932","likes":37,"retweets":3,"replies":4},{"text":"“For us, we just want open source to win at the end of the day. We want freedom to happen for people.” You can hear the passion for open source in this clip from my interview with @karan4d, @NousResearch co-founder: “We need to give this level of intelligence to everyone so they can be on an even and equal playing field.” Karan's vision for Hermes is to give everyone access to intelligent AI, then let each person shape it into an agent that’s uniquely theirs. 📌 Watch the full episode here:","createdAt":"2026-08-03T17:30:06.000Z","url":"https://x.com/petergyang/status/2084330985689428290","likes":24,"retweets":2,"replies":4},{"text":"My 6 biggest takeaways from @karan4d, @NousResearch co-founder, on getting the most out of Hermes Agent: 1. The “personal” in personal agent is not the model It’s the agent’s memory of your conversations and the skills you’ve built with it. Karan barely notices when he swaps models because his Hermes already has so much context about him. 2. Try different Hermes personalities Use /personality to switch response styles. Try “teacher” when learning something new, “concise” when you want crisp answers, and even “kawaii” or “pirate” for fun. 3. Use separate agents to do the work and evaluate it Karan calls “you’re absolutely right” reward hacking because the model is optimizing for your approva…","createdAt":"2026-08-03T14:44:58.000Z","url":"https://x.com/petergyang/status/2084289426012897433","likes":138,"retweets":14,"replies":19}]},{"name":"Amanda Askell","handle":"AmandaAskell","bio":"Philosopher & ethicist trying to make AI be good @AnthropicAI. Personal account. All opinions come from my training data.","tweets":[{"text":"It's surprisingly difficult to acquire a hereditary peerage in the UK. Like you can't even take one by force any more, and they just get mad at you if you try.","createdAt":"2026-08-04T05:57:52.000Z","url":"https://x.com/AmandaAskell/status/2084519165021528263","likes":101,"retweets":2,"replies":9},{"text":"I don't agree with this part. I think the takeaway should be that models (like humans) can behave in aligned ways while still causing harm, e.g. because they're given false information about their situation. There isn't a line between aligned and harmless: they're different axes.","createdAt":"2026-08-03T20:01:23.000Z","url":"https://x.com/AmandaAskell/status/2084369056765989224","likes":989,"retweets":61,"replies":91}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"do it here","createdAt":"2026-08-03T21:13:54.000Z","url":"https://x.com/trq212/status/2084387305436164162","likes":25,"retweets":2,"replies":7},{"text":"I think a lot of people don't realize- if you connect a Claude Connector (e.g. your gmail, calendar, slack, etc), Claude Code will also be able to use them, including in Artifacts.","createdAt":"2026-08-03T21:13:53.000Z","url":"https://x.com/trq212/status/2084387303959740449","likes":1133,"retweets":32,"replies":125}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"We built a self-driving & self-correcting shared semantic layer on top of our databases, conversations, and docs. Everything is queryable & joinable—regardless of source! So now anyone at Replit can ask questions that previously needed a team of data scientists weeks of work.","createdAt":"2026-08-03T23:06:37.000Z","url":"https://x.com/amasad/status/2084415670486499779","likes":550,"retweets":41,"replies":43}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"This is why P̵L̵G̵ ALG will always be king for startups. Have p̵e̵o̵p̵l̵e̵ agents adopt your product first, then have the meetings, if needed. The companies that start with the meetings are likely not your ideal customers.","createdAt":"2026-08-04T01:05:13.000Z","url":"https://x.com/rauchg/status/2084445517678064092","likes":152,"retweets":3,"replies":24},{"text":"The new AI Gateway logs UI is delightful","createdAt":"2026-08-03T23:50:33.000Z","url":"https://x.com/rauchg/status/2084426730241220703","likes":230,"retweets":11,"replies":18},{"text":"Next.js 16.3: faster, better, stronger. My highlights: 0️⃣ Faster dev & builds Shoutout to Fable for improving memory use, and the team for landing the incremental 𝚗𝚎𝚡𝚝 𝚋𝚞𝚒𝚕𝚍 cache. 1️⃣ Instant navigations are 🔥 The people wanted SPAs, they shall get SPAs. By turning on instant navs (which will soon be default), your agent is basically forced to make things fast. 2️⃣ Agent-native DX You can still ship \"slow\" navs if you want, e.g. by blocking navs on server-side data fetching ala PHP olden days. But even then, your agent will be given *choices*, like setting up a <𝚂𝚞𝚜𝚙𝚎𝚗𝚜𝚎 𝚏𝚊𝚕𝚕𝚋𝚊𝚌𝚔> for instant loading shells. Agents also get built-in versioned docs. This is our be…","createdAt":"2026-08-03T22:49:25.000Z","url":"https://x.com/rauchg/status/2084411344623902994","likes":556,"retweets":26,"replies":33}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Another day another near frontier open weights model release. If you had gone back even 3-6 months and given everyone access to what we’re now seeing in open weights even as a closed model, their minds would be completely blown. The fact that this is possible changes the calculations in the industry meaningfully. It means that models can’t reasonably remain behind closed doors for too long since there will be open weights models as a counter balance. It means AI inference will have to get closer and closer to the cost of the underlying infrastructure since you can always run open models yourself. It means that you get models that can develop in a range of industries for specific domain prob…","createdAt":"2026-08-04T05:23:25.000Z","url":"https://x.com/levie/status/2084510498519933318","likes":57,"retweets":4,"replies":11}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Dangerously skips permissions. Harvard’17. GitHub: YouTube:","tweets":[{"text":"Simple but effective use case of Codex for trip planning: Taking screenshots of bookings of restaurants/trains/events and asking Codex to put them on your Google Calendar","createdAt":"2026-08-04T07:06:12.000Z","url":"https://x.com/zarazhangrui/status/2084536363668611491","likes":3,"retweets":0,"replies":1}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"Even though I try to make sure to say bye to my kids before I go to work, some days have me crawling
