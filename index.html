    const DIGESTS = [{"date":"2026-11-11","dateLabel":"2026年11月11日","generatedAt":"2026-11-11T00:00:00+08:00","sourceGeneratedAt":"2026-11-10T06:27:38.415Z","stats":{"podcastEpisodes":1,"xBuilders":15,"totalTweets":29,"blogPosts":0},"highlights":[{"tag":"实践","title":"产品经理深入各环节，能减少交接中的信息损失","body":"Madhu Guru 建议画出从市场理解到设计、开发、推广的全过程，再看 AI 能让产品经理在哪些环节深入。原型、代码探索和自主分析让问题更早得到回答，交接时也更容易说明约束。由此看，工具的价值可以用减少了多少等待与误解来衡量。","evidence":[{"quote":"This is a handoff-heavy, lossy process.","translation":"这个过程交接很多，也容易丢失信息。","attribution":"Madhu Guru","url":"https://x.com/realmadhuguru/status/2119999748086362466","publishedAt":"2026-11-10T03:45:02.000Z","sourceId":"x:2119999748086362466"}],"claimType":"single_source","sourcePerspective":"Madhu Guru"},{"tag":"实践","title":"跨会话事件让 agent 更容易接续长任务","body":"Guillermo Rauch 介绍 MCP Events，并以部署完成通知为例。任务发起后能收到后续事件，agent 就不必反复询问状态。由此推断，这种机制能减少等待期间的重复调用，但实际工作流仍需要处理重复通知和中断后的恢复。","evidence":[{"sourceId":"x:2119891138450755670","url":"https://x.com/rauchg/status/2119891138450755670","attribution":"Guillermo Rauch","quote":"MCP could read and write, but it couldn't tell you later \"this event happened.\"","translation":"MCP 能读写，但以前不能在稍后告诉你“这个事件发生了”。","publishedAt":"2026-11-09T20:33:27.000Z"}],"claimType":"single_source","sourcePerspective":"Guillermo Rauch"},{"tag":"实践","claimType":"synthesis","title":"长任务收益同时受计算资源、预算和验收边界限制","body":"Guillermo Rauch 强调并行任务需要足够的执行资源；Dan Shipper 的团队试用则暴露出耗时和 token 成本，并要求事先约定完成标准。这两种经验指向同一项实践约束：把更多任务交给 agent，不能只增加分工，还应同时设定环境容量、费用上限和验收范围。两位作者的体验不能代表所有任务的性能。","evidence":[{"sourceId":"x:2119878364794372162","url":"https://x.com/rauchg/status/2119878364794372162","attribution":"Guillermo Rauch","quote":"The model can delegate and orchestrate far more than a single computer can handle.","translation":"模型能委派和编排的工作，可能远超单台计算机的承载能力。","publishedAt":"2026-11-09T19:42:42.000Z"},{"sourceId":"x:2119869228207546638","url":"https://x.com/danshipper/status/2119869228207546638","attribution":"Dan Shipper","quote":"Set the goal, the budget, and how much checking you need before walking away.","translation":"离开前，先设定目标、预算以及需要多少检查。","publishedAt":"2026-11-09T19:06:23.000Z"},{"sourceId":"x:2119869228207546638","url":"https://x.com/danshipper/status/2119869228207546638","attribution":"Dan Shipper","quote":"It’s slow and burns through tokens.","translation":"它运行较慢，也会消耗大量 token。","publishedAt":"2026-11-09T19:06:23.000Z"}]}],"matters":[{"kind":"动态","title":"Dots 扩展多机器控制","detail":"作者宣布 Dots 除默认提供的云电脑外，还可控制多台机器。采集帖未说明具体连接方式与权限配置。","url":"https://x.com/thsottiaux/status/2120021043876106429","sourceId":"x:2120021043876106429"},{"kind":"动态","title":"Claude Fable 5.2 向付费计划开放","detail":"公告称 Fable 5.2 已面向全部付费计划提供，开展有益网络安全或生物医学研究的组织可申请 Mythos 5.2 访问。","url":"https://x.com/claudeai/status/2119899492778398163","sourceId":"x:2119899492778398163"},{"kind":"动态","title":"历史手稿变成交互探索","detail":"作者称向 Fable 5.2 提供达芬奇笔记 PDF 后，模型将其中发明制作成可交互内容，展示了教育内容的一种表达方式。","url":"https://x.com/alexalbert__/status/2119916954337349737","sourceId":"x:2119916954337349737"},{"kind":"动态","title":"SMFL 团队将出版企业 AI 开发书籍","detail":"Amjad Masad 介绍日本 SMFL 数字创新团队的 Enterprise Vibe Coding，称计划于 11 月 27 日发行，主题是 AI 如何改变企业软件开发。","url":"https://x.com/amasad/status/2119909166764667292","sourceId":"x:2119909166764667292","images":[{"id":"bbd5ff28c19a3e2c929488b4","sourceId":"x:2119909166764667292","originalUrl":"https://pbs.twimg.com/media/HWttzgwbEAAPpdq.jpg","sourceUrl":"https://x.com/amasad/status/2119909166764667292","attribution":"Amjad Masad","method":"official_syndication","suggestedAlt":"","src":"assets/digest/2026-11-11/bbd5ff28c19a3e2c929488b4.jpg","sha256":"d13164443066f4bff7f651c9bd2bbd5314f97b6ae68810ead5dc727607664b83","bytes":108878,"checkedAt":"2026-11-11T03:57:52.298Z","cacheKey":"bbd5ff28c19a3e2c929488b4.jpg","mediaId":"bbd5ff28c19a3e2c929488b4","alt":"Amjad Masad 原帖中的日文 Enterprise Vibe Coding 书籍商品页截图，展示书封与作者团队。"}]}],"articles":{"blogs":[],"podcasts":[{"title":"Handshake AI：专家经验怎样变成训练任务与评测","sourceName":"Latent Space","sourceTitle":"What Frontier Labs Buy: A Data Deep Dive with Handshake AI — Garrett Lord &amp; Team","sourceId":"01a1c0f3-0e12-72e9-b44b-8ca8a4fe611d","sourceUrl":"https://www.youtube.com/@LatentSpacePod","publishedAt":"2026-11-09T16:41:48.000Z","linkScope":"channel","sourceTextSha256":"45fcf518af355d0cc206ae8bad36ba0a78bc0496ae51b005b76939ff847379ca","blocks":[{"type":"paragraph","text":"Handshake AI 的 Garrett Lord 与团队在 Latent Space 讨论前沿实验室购买的数据。他们把重点放在具体任务、专家判断和评估环境上：模型要完成实际工作，训练材料就需要表达这项工作怎样才算完成。"},{"type":"heading","text":"一条任务背后有大量专家工作"},{"type":"paragraph","text":"以财务建模为例，任务设计者需要提供业务背景、材料和评价标准。评分规则可能包含很多检查项，权重要反映真实的重要程度。规则太模糊，模型可能绕过目标获得分数；过于具体，又可能排除同样有效的答案。"},{"type":"paragraph","text":"团队称，一条数据的制作可能持续数天，还需要覆盖多个环境和任务。他们会在内部训练模型，观察数据是否帮助能力提高，再反过来调整材料和奖励信号。"},{"type":"heading","text":"公开资料没有覆盖全部实验经验"},{"type":"paragraph","text":"生命科学部分讨论了模型理解实验图像的困难。论文常展示汇总结果或少量代表性样本，而科学家日常处理的数据更加丰富。大量判断还来自长期实验经验，很难从论文文字完整获得。"},{"type":"paragraph","text":"团队介绍通过专家网络与实验合作获取材料，并在训练中尝试提示、选择题等较容易的形式，逐步接近真实任务。这说明做出有用数据还包括安排学习难度，单纯把最难的问题交给训练过程未必有效。"},{"type":"heading","text":"总体得分会掩盖关键错误"},{"type":"paragraph","text":"金融案例把讨论转向交付质量。某个税务处理或现金流错误可能持续影响后续结果，即使其他检查项完成得很好，专业人员仍然难以直接采用成品。"},{"type":"paragraph","text":"因此，团队强调对关键项设置合适权重，以及让人能看到模型做了什么、在哪些地方需要复核。模拟银行任务的评测只是一步，完整工作环境还包含更多交互、制度与约束。"},{"type":"heading","text":"行为评估需要多种专业视角"},{"type":"paragraph","text":"随后讨论安全评测时，团队将关注点扩展到多轮互动和高风险行为。他们介绍结合不同群体与专业人员的视角构造任务，避免只有一种狭窄定义决定什么算好结果。"},{"type":"paragraph","text":"一个贷款流程案例展示了看似完成任务、却在过程中作出有问题决策的风险。如果审核者只能看到最终文件，就需要重新走过许多步骤才能发现问题。自动化要节省人工，过程的可检查性就必须跟上。"},{"type":"heading","text":"把评测连接到真实采用"},{"type":"paragraph","text":"访谈最后回到实验室与企业的需求。团队认为，新的评测可以揭示过去没有测到的能力缺口，但企业是否信任系统，仍要看它在实际工作中的表现。数据、训练、评估和使用反馈因此需要连续衔接，才能知道模型究竟改进了什么。"}]}]},"quality":{"collected":30,"collectedTweets":29,"used":9,"usedTweets":8,"uniqueAuthors":8,"imageCount":1,"status":"degraded","warnings":["Quoted-post context missing: x:2119891138450755670","Quoted-post context missing: x:2119878364794372162","Media unverified: x:2119869228207546638 (budget_exhaus on with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @cognition - @temporalio - @aidotengineer - @latentspacepod","tweets":[{"text":"signups for new media creators","createdAt":"2026-11-10T03:10:07.000Z","url":"https://x.com/swyx/status/2119990961459921395","likes":1,"retweets":0,"replies":1},{"text":"bro just proved fermat's last theorem AS A DEMO for the fable 5.2 launch and casually told me he's got something bigger planned for his aie code talk lol anthropic u guys are wildin","createdAt":"2026-11-09T23:28:42.000Z","url":"https://x.com/swyx/status/2119935240202539147","likes":277,"retweets":10,"replies":79},{"text":"btw by complete coincidence the $ANT IPO roadshow across wall street started today. they had this in the chamber and its also nice that it came after Astra, Argon and Carbon…","createdAt":"2026-11-09T19:44:12.000Z","url":"https://x.com/swyx/status/2119878742063641056","likes":108,"retweets":1,"replies":16}]},{"name":"Boris Cherny","handle":"bcherny","bio":"Claude @anthropicai","tweets":[{"text":"Pro users get one reset, and Max, Ultra, and Team Premium get up to three, depending on how long you've subscribed:","createdAt":"2026-11-09T20:32:11.000Z","url":"https://x.com/bcherny/status/2119890820186976763","likes":349,"retweets":11,"replies":50},{"text":"We wanted to do more for the people who’ve been with us the longest. So with Fable 5.2, the longer you’ve been subscribed, the more Fable resets you get.","createdAt":"2026-11-09T19:21:45.000Z","url":"https://x.com/bcherny/status/2119873095129550880","likes":14483,"retweets":552,"replies":1105}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Dots can now control many machines in addition to its own little cloud computer that we provide by default.","createdAt":"2026-11-10T05:09:39.000Z","url":"https://x.com/thsottiaux/status/2120021043876106429","likes":1438,"retweets":38,"replies":624}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"This is the future of work 😂","createdAt":"2026-11-10T05:29:48.000Z","url":"https://x.com/petergyang/status/2120026112722137345","likes":12,"retweets":0,"replies":4},{"text":"Turned my 8-year-old's drawings into kart racers - time to upgrade the characters","createdAt":"2026-11-10T05:08:24.000Z","url":"https://x.com/petergyang/status/2120020729546862979","likes":10,"retweets":0,"replies":4},{"text":"Upgrading the music right now","createdAt":"2026-11-10T05:03:40.000Z","url":"https://x.com/petergyang/status/2120019538763002179","likes":0,"retweets":0,"replies":0}]},{"name":"Nan Yu","handle":"thenanyu","bio":"product, codex @openai. prev head of product @linear","tweets":[{"text":"PSA since it took me a second to discover it: If you wanna get some untapped value out of your ChatGPT subscription, go into settings and turn on global dictation It uses the same fast and accurate transcription path as the in-app dictation","createdAt":"2026-11-10T06:14:46.000Z","url":"https://x.com/thenanyu/status/2120037431261184454","likes":9,"retweets":0,"replies":1}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"If you are a product leader, here is a simple exercise: draw out your product lifecycle. e.g. market understanding -> design -> development -> GTM. Chances are your PMs spend more time in some stages than others - because of the nature of your product, your org or their comfort zones. This is a handoff-heavy, lossy process. Now ask yourself: using AI, how much deeper can PMs go on every stage? PMs should be able to - build a much deeper, broader understanding of users and the market - iterate fast from ideas to working prototypes - explore the codebase to study technical constraints and tradeoffs - run their own analytics and investigate questions as they emerge - understand the GTM funnel…","createdAt":"2026-11-10T03:45:02.000Z","url":"https://x.com/realmadhuguru/status/2119999748086362466","likes":61,"retweets":3,"replies":0}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"I showed Paul Graham vibe coding before it was called that back in July ‘24, and this was his reaction:","createdAt":"2026-11-10T01:27:54.000Z","url":"https://x.com/amasad/status/2119965240066752682","likes":456,"retweets":21,"replies":58},{"text":"If you're in Japan, check out \"Enterprise Vibe Coding,\" a new book from SMFL's digital innovation team on how AI is transforming enterprise software development. Coming November 27. Honored to be on the cover!","createdAt":"2026-11-09T21:45:06.000Z","url":"https://x.com/amasad/status/2119909166764667292","likes":76,"retweets":8,"replies":17},{"text":"\"But who maintains vibe coded apps?\" How about self-healing software...","createdAt":"2026-11-09T20:41:48.000Z","url":"https://x.com/amasad/status/2119893236747780567","likes":173,"retweets":13,"replies":70}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"So bullish on MCP. Its utility exceeds the \"M\" part: even AI aside, it'll be a civilization-scale accomplishment to get all our systems communicating through one universal open protocol. A missing piece was how to get arbitrary callbacks across sessions. MCP could read and write, but it couldn't tell you later \"this event happened.\" MCP Events fixes this. We're adding support in our own MCP. Say an agent makes a deployment, and wants to know when it's complete. Instead of polling, it can subscribe to 𝚍𝚎𝚙𝚕𝚘𝚢𝚖𝚎𝚗𝚝.𝚜𝚞𝚌𝚌𝚎𝚎𝚍𝚎𝚍. PSA: With Vercel Queues and Workflows, writing the backend machinery for your own MCPs to do this is easy peasy.","createdAt":"2026-11-09T20:33:27.000Z","url":"https://x.com/rauchg/status/2119891138450755670","likes":663,"retweets":33,"replies":101},{"text":"At @vercel we got to test this model before release. Best way to summarize it: astonishingly brilliant. One interesting takeaway: it's very clear that this new generation of models can take on unprecedented bodies of parallel work. To actually seize this intelligence, you need cloud sandboxes. Full stop. The model can delegate and orchestrate far more than a single computer can handle. Likely far more than you can even imagine it can handle. Your bottleneck is now ① your ambition and ② your parallel computing power. Btw, I learned from @cramforce you don't need to overcomplicate it. Install Vercel CLI, setup the Plugin and tell the agent to use /𝚘𝚏𝚏𝚕𝚘𝚊𝚍-𝚝𝚘-𝚜𝚊𝚗𝚍𝚋𝚘𝚡 skill. It'…","createdAt":"2026-11-09T19:42:42.000Z","url":"https://x.com/rauchg/status/2119878364794372162","likes":1907,"retweets":58,"replies":114}]},{"name":"Alex Albert","handle":"alexalbert__","bio":"Research @AnthropicAI","tweets":[{"text":"I gave Fable 5.2 a PDF of one of Leonardo da Vinci’s 500-year-old notebooks and it made his inventions real for me to interact with. Such an exciting time for education. Anything from history that’s been stuck on a page can now be something you explore.","createdAt":"2026-11-09T22:16:02.000Z","url":"https://x.com/alexalbert__/status/2119916954337349737","likes":1418,"retweets":150,"replies":86},{"text":"Every time we have a new model, I run the same simple prompt on all my projects: \"Read this entire project and find everything that’s broken, inconsistent, inefficient, or no longer needed. Fix what you’re sure about and list the rest for me to review.\" highly recommend trying","createdAt":"2026-11-09T20:08:52.000Z","url":"https://x.com/alexalbert__/status/2119884951550386671","likes":6350,"retweets":292,"replies":214},{"text":"btw robotics will fall to the bitter lesson too","createdAt":"2026-11-09T19:09:10.000Z","url":"https://x.com/alexalbert__/status/2119869925288558799","likes":2790,"retweets":104,"replies":54}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"It turns out the advancements we’re getting in coding and computer use, combined with industry specific understand and general reasoning, can bring automation to a large number of areas of knowledge work. We’re entering the era of autonomous collaborators in a number of industries that haven’t yet had their claude code or codex moment yet. But now this is going to happen. We’ll see it in animation, film production, gaming, manufacturing, architecture, product design, robotics, and more. All of these fields have the potential of driving far more output similar to what we’ve seen in software engineering. There’s no inherent finite demand for these categories of work. “Software is eating the w…","createdAt":"2026-11-10T02:54:53.000Z","url":"https://x.com/levie/status/2119987129204047894","likes":227,"retweets":15,"replies":73}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Red letter day: New frontier model = every one of your projects gets a step function improvement I'm not sure if I'll ever get sick of frontier model release days","createdAt":"2026-11-09T19:57:54.000Z","url":"https://x.com/garrytan/status/2119882192088391751","likes":306,"retweets":11,"replies":57}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"Ever since I read Niklas Gruhn's excellent article ( I think about this every day.. If you don't think people notice that you are feeding everything to AI and regurgitating it back, people actually do!! (because they are probably already getting an opinion with the same agents)","createdAt":"2026-11-09T17:52:47.000Z","url":"https://x.com/nikunj/status/2119850705901191339","likes":13,"retweets":2,"replies":3}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"Vibe Check dropping soon:","createdAt":"2026-11-09T19:17:05.000Z","url":"https://x.com/danshipper/status/2119871917104455924","likes":15,"retweets":0,"replies":0},{"text":"BREAKING: @AnthropicAI just dropped Claude Fable 5.2. It’s a paradigm-shifting model if you have a project ambitious enough to give it. We’ve been testing it at @every, and I’ve seen this crazy explosion of creativity on the team. People are making their own creative software, games for their kids, and documentaries instead of slide decks. Here’s your day zero vibe check: • Coding: @kieranklaassen built Everycut, a video editor with the features we use from Premiere, Descript, and other tools—all in one app, with an agent built in. The first version was live in 3 days, and we immediately used it for our internal show-and-tell. This feels like a new era of professionals building their own pr…","createdAt":"2026-11-09T19:06:23.000Z","url":"https://x.com/danshipper/status/2119869228207546638","likes":776,"retweets":53,"replies":60},{"text":"Fable 5.2 Vibe Check","createdAt":"2026-11-09T19:02:57.000Z","url":"https://x.com/danshipper/status/2119868362838663650","likes":23,"retweets":1,"replies":3}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"Huge launch from the @nuance_ai team today. Try it out now.","createdAt":"2026-11-09T18:21:57.000Z","url":"https://x.com/adityaag/status/2119858043869683935","likes":23,"retweets":3,"replies":0}]},{"name":"Claude","handle":"claudeai","bio":"Claude is an AI assistant built by @anthropicai to be safe, accurate, and secure. Talk to Claude on or download the app.","tweets":[{"text":"Claude Fable 5.2 is available today on all paid plans. Organizations pursuing beneficial applications in cybersecurity or biomedical research can apply for access to Claude Mythos 5.2. Read more:","createdAt":"2026-11-09T21:06:39.000Z","url":"https://x.com/claudeai/status/2119899492778398163","likes":546,"retweets":41,"replies":16},{"text":"Both physics results are written up in preprints. On the abrupt transition in very small universes: On the exact limit of a technique used to rule out candidate theories of quantum gravity:","createdAt":"2026-11-09T21:06:39.000Z","url":"https://x.com/claudeai/status/2119899491310432269","likes":328,"retweets":15,"replies":8},{"text":"In the second physics problem, Fable 5.2 found the exact limit of the simplest version of a 15-year-old technique known as “modular bootstrapping.” The technique is used to rule out candidate theories of quantum gravity in theoretical universes.","createdAt":"2026-11-09T21:06:38.000Z","url":"https://x.com/claudeai/status/2119899488995131439","likes":410,"retweets":12,"replies":3}]}]},"errors":[],"partial":false},{"date":"2026-11-10","dateLabel":"2026年11月10日","generatedAt":"2026-11-10T00:00:00+08:00","sourceGeneratedAt":"2026-11-09T06:36:37.960Z","stats":{"podcastEpisodes":1,"xBuilders":10,"totalTweets":21,"blogPosts":0},"highlights":[{"tag":"实践","title":"生成能力越强，需求不清的成本越快累积","body":"作者指出，方向清晰时可以直接到达方案，方向模糊时却会快速产出大量无用内容。由此看，动手前把使用者、场景和验收条件说清，能减少后续反复推翻的成本。","evidence":[{"quote":"Software got a lot easier if you know what you wanna build, and a lot harder if you don’t.","translation":"知道要做什么，软件开发就容易很多；不知道，则更难。","attribution":"Nan Yu","url":"https://x.com/thenanyu/status/2119462224721002560","publishedAt":"2026-11-08T16:09:06.000Z"}]},{"tag":"实践","title":"旧失败案例值得成为模型升级后的复测集","body":"作者建议每三到六个月重试过去不可行的任务。相比只看新能力演示，保留失败输入和验收标准，可以更直接地判断升级是否解决自己的障碍，也更容易识别仍需人工介入的步骤。","evidence":[{"quote":"try something that wasn’t possible before and see if it works again.","translation":"重新尝试以前做不到的事情，看看如今是否可行。","attribution":"Aaron Levie","url":"https://x.com/levie/status/2119502716770902234","publishedAt":"2026-11-08T18:50:00.000Z"}]},{"tag":"实践","title":"架构的复杂性会转移成使用者的理解成本","body":"作者建议从能工作的直接方案开始。由此推断，如果一个方案依赖许多隐含规则，维护者和用户就要不断重建作者的思路。先用容易解释的方式实现，再依据真实问题迭代，更利于验证取舍。","evidence":[{"quote":"Being clever means your users also have to be just as clever to understand your cleverness","translation":"过于巧妙的设计，要求用户也足够聪明才能理解。","attribution":"Nan Yu","url":"https://x.com/thenanyu/status/2119462979179892925","publishedAt":"2026-11-08T16:12:06.000Z"}]}],"matters":[{"kind":"动态","title":"WebGL 唱机从沟槽模拟声音","detail":"作者用 WebGL2 和 Web Audio 把歌曲转换成沟槽形状，再模拟唱针运动产生声音。其描述中，杂音、抖动和内圈音质变化来自模拟过程，代码可供改编。","url":"https://x.com/rauchg/status/2119536313712230802"},{"kind":"动态","title":"gstack-evals 尝试复现 Jev 文章","detail":"作者称项目复现了 Jev Engineering 的文章结果，并试用了 particle-1，后者在其尝试中更好。采集帖未包含测试配置和具体分数。","url":"https://x.com/garrytan/status/2119624260675350605"},{"kind":"动态","title":"Ryo Lu 分享上海演讲完整版","detail":"演讲围绕“当我们能做任何事，还知道自己想要什么吗”展开，作者称幻灯片用 Keynote 手工制作，并提供中英文字幕。","url":"https://x.com/ryolu_/status/2119586846657454152"},{"kind":"动态","title":"AI 编程是否需要新的称呼","detail":"作者认为 vibe coding 容易让人误以为作品缺少投入，而使用 AI 工具也可以认真打磨作品，因此提出寻找更贴切的说法。","url":"https://x.com/zarazhangrui/status/2119592080318341128"}],"articles":{"blogs":[],"podcasts":[{"title":"Mihail Eric：AI 原生工程从理解工具走向组织交付","sourceName":"Latent Space","sourceTitle":"[One Million AI Engineer Special] How Stanford Teaches AI-Native Engineering — Mihail Eric, Monaco","sourceId":"01a1bcf7-771f-7da1-affb-a7ead0a1434c","sourceUrl":"https://www.youtube.com/watch?v=dpY7YzZo4kE","publishedAt":"2026-11-08T21:23:29.000Z","sourceTextSha256":"7ce4a01024b0380bd78f8b28a67a94e6ce04346d5ffc7b7809b73c60fb7ca690","blocks":[{"type":"paragraph","text":"Mihail Eric 在 Stanford 教授现代软件开发，也在 Monaco 负责 AI 工作。Latent Space 的这场访谈把课程与实践放在一起，讨论工程师怎样掌握不断变化的工具，以及团队怎样把生成代码纳入可持续的交付流程。"},{"type":"heading","text":"先理解 agent 如何工作"},{"type":"paragraph","text":"课程从搭建编码 agent 开始，让学生看到模型之外的控制循环、工具调用和上下文管理。第二步进入更大规模的上下文组织与工具设计，再讨论如何把重复步骤写成 skills。这样的顺序让学生先理解单次调用，再考虑多步骤工作。"},{"type":"paragraph","text":"Eric 邀请一线实践者讲课，因为工具变化很快，一个教师的经验难以覆盖所有情况。客座讲者带来的观点也让学生看到，同一类问题可以有不同的实现办法。"},{"type":"heading","text":"把重复经验整理成可执行流程"},{"type":"paragraph","text":"访谈将单一工具和完整操作程序区分开。工具完成一个动作，skill 则可以记录一组反复执行的步骤。团队能从过去几次真实任务里提炼做法，再根据结果修改。"},{"type":"paragraph","text":"不过，积累大量 Markdown 文件也带来维护问题。说明是否仍然适用、是否与工具实际行为一致，都需要持续整理。把经验写下来只是开始，使用结果还要返回到这些说明里。"},{"type":"heading","text":"从课堂到 Monaco 的实际系统"},{"type":"paragraph","text":"Eric 介绍，Monaco 把 agent 用在销售相关工作中，包括客户画像、市场评估、流程推进和会议准备。领域任务决定了系统需要哪些信息和动作，基础模型提供通用能力，周边软件负责把它们接入业务。"},{"type":"paragraph","text":"团队也构建开发辅助工具。名为 Hal 的 Slack 助手既帮助排查问题、提交修复，也让销售人员了解产品如何工作。这种跨角色使用让团队必须考虑不同问题该读取哪些信息，以及谁能发起什么操作。"},{"type":"heading","text":"代码越多，审查越需要明确边界"},{"type":"paragraph","text":"讨论进入 AI 代码审查后，问题变成哪些改动可以自动批准，哪些必须让人判断。生成能力提高，并没有消除理解变更后果的工作。团队需要让审查关注真正影响交付的差异。"},{"type":"paragraph","text":"依赖管理同样存在取舍。把外部代码全部收进项目，可能便于控制，却也让团队承担独自发现问题的责任。广泛使用的开源依赖能获得更多用户的反馈。访谈强调根据实际情况判断，避免把一种策略推广到所有项目。"},{"type":"heading","text":"工程师承担更高层的判断"},{"type":"paragraph","text":"最后，双方讨论软件生产越来越自动化之后的角色变化。工程师需要理解组成系统的各部分，能够判断结果是否满足目标，也能够组织多个 agent 的工作。工具熟练度只是其中一部分，提出正确任务、安排反馈和保持对系统的理解，仍然贯穿整个流程。"}]}]},"sources":{"podcasts":[{"title":"[One Million AI Engineer Special] How Stanford Teaches AI-Native Engineering — Mihail Eric, Monaco","name":"Latent Space","publishedAt":"2026-11-08T21:23:29.000Z","url":"https://www.youtube.com/watch?v=dpY7YzZo4kE","excerpts":["Okay, this is a pretty special episode because we're celebrating one million subscribers on the AIU Code, uh, AI, AI Engineer YouTube channel. So go over there and subscribe if you haven't heard about it already.","The guest is Mihail Eric, who is not only teaching the Modern Software Developer at Stanford, which is going viral right now for basically covering all the AI-native development pract- best practices, uh, but also he is head of AI at Monaco.","So he's not only a teacher, but he's a practitioner. Um, and those of you coming to AIU Code Summit next week, um, it's gonna be the celebration of all the extreme progress that you've seen in coding in the last year."]}],"blogs":[],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @cognition - @temporalio - @aidotengineer - @latentspacepod","tweets":[{"text":"are you listening anon?","createdAt":"2026-11-09T02:00:31.000Z","url":"https://x.com/swyx/status/2119611058881192187","likes":134,"retweets":2,"replies":20},{"text":"and a special pod!","createdAt":"2026-11-08T21:59:47.000Z","url":"https://x.com/swyx/status/2119550477629379009","likes":3,"retweets":0,"replies":0},{"text":"if youre wondering how, ask their VP of FDE Pauline Brunet (thanks @realbasilchatha for curating this)","createdAt":"2026-11-08T21:33:12.000Z","url":"https://x.com/swyx/status/2119543788192600450","likes":1,"retweets":0,"replies":1}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"This affair is going to destroy billions in shareholder value isn’t it","createdAt":"2026-11-09T05:06:23.000Z","url":"https://x.com/petergyang/status/2119657833516171384","likes":60,"retweets":1,"replies":12},{"text":"“Both of my parents got diagnosed with two cancers each within a week of each other.” From @AshleyYuki, VP of Product at @OpenAI: “I just decided to take a month [off work]. It was one of the best things I could have done in that moment to care for my parents. You also have to care for yourself as a caregiver. We don’t talk about that enough. It’s still a really big cognitive load, emotional load, just pure time load to be a caregiver. You have to make sure you’re budgeting time for your own mental health.” 📌 Watch our full episode here:","createdAt":"2026-11-09T01:00:07.000Z","url":"https://x.com/petergyang/status/2119595860057288967","likes":46,"retweets":8,"replies":2},{"text":"Anecdotally, I think cheating is far more common in Asia. Plenty of guys who have their wife and kids living in the US/Canada, while they do business in Asia and have another girlfriend or even family in a 二奶村. Most of the time their wife knows about this too. Not saying any of this is right but just what I've seen and heard 🤷 Just randomly came across this article","createdAt":"2026-11-08T22:24:19.000Z","url":"https://x.com/petergyang/status/2119556651636441416","likes":280,"retweets":14,"replies":43}]},{"name":"Nan Yu","handle":"thenanyu","bio":"product, codex @openai. prev head of product @linear","tweets":[{"text":"This is a good question. And you should definitely pick \"dumbest\" over \"simplest\". Simple is something you iterate to. Dumb is the correct starting point. Otherwise, you start to outsmart yourself.","createdAt":"2026-11-08T18:11:27.000Z","url":"https://x.com/thenanyu/status/2119493015190249556","likes":9,"retweets":1,"replies":1},{"text":"This is basically true in all aspects of software. Choose the dumbest architecture that’ll work. choose the dumbest design that gets the job done. Being clever means your users also have to be just as clever to understand your cleverness","createdAt":"2026-11-08T16:12:06.000Z","url":"https://x.com/thenanyu/status/2119462979179892925","likes":263,"retweets":11,"replies":22},{"text":"Software got a lot easier if you know what you wanna build, and a lot harder if you don’t. With clarity, you can straight-shot to the solution. Without it, you’ll ship a pile of junk and spend a lot of money doing it. Pre-AI era you would ship nothing, which is an improvement.","createdAt":"2026-11-08T16:09:06.000Z","url":"https://x.com/thenanyu/status/2119462224721002560","likes":193,"retweets":11,"replies":14}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Built a physical simulation of a record player with WebGL2 and Web Audio. It's *shockingly* accurate: Instead of playing a song, it works by converting it into the physical shape of a groove. Then a simulated stylus rides those walls 384,000 times a second, and you hear the voltage that motion would induce in a cartridge. So the crackle, the pops, the wow/flutter, the dull inner grooves are natural byproducts of the simulation. You can also \"DJ\" the record. (The converted songs are in the public domain or CC-licensed. Code is linked for you to remix and re-deploy.)","createdAt":"2026-11-08T21:03:30.000Z","url":"https://x.com/rauchg/status/2119536313712230802","likes":2242,"retweets":143,"replies":187}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"We’re moving from an era of AI where the output comes roughly at the rate that you can chat back and forth with the AI to work with you, to a period where you can set a problem for a set of agents to go off and do an arbitrarily large amount of work for you. This means productivity gains that are maybe 20-50% to gains that don’t really have an upper limit. Agent swarms and the ability to fan out complex work across many agents doing tasks in parallel provide a massive unlock in a lot of spaces. This will lead to qualitatively different outcomes in my fields. This has already been seen across the coding domain. Next, cyber is almost entirely a problem space where more agents reviewing more t…","createdAt":"2026-11-09T00:44:53.000Z","url":"https://x.com/levie/status/2119592025440092192","likes":256,"retweets":18,"replies":81},{"text":"A good lesson in AI is that you need to check back in on the latest with every 3 to 6 months to try something that wasn’t possible before and see if it works again. At no point in AI’s history is that more true than today. Just the past six months of model progress around computer and tool use, less context rot, better reasoning, multimodality, and deeper domain expertise in a number of key fields, these models are vastly more capable on what they can execute. This is opening up a new vector of what AI systems will be able to autonomously work on. Essentially, anything with an API (and even many things without), we can anticipate that an agent will be able to control and utilize as an under…","createdAt":"2026-11-08T18:50:00.000Z","url":"https://x.com/levie/status/2119502716770902234","likes":278,"retweets":19,"replies":105}]},{"name":"Ryo Lu","handle":"ryolu_","bio":"Designed @Cursor_ai, @NotionHQ, @Stripe, built startups. I make a world where anyone can make software. Aspiring k-pop idol.","tweets":[{"text":"when we can do anything, do we still know what we want? the full talk from @aiDotEngineer shanghai. every slide handmade in keynote, subs in 中文 and english","createdAt":"2026-11-09T00:24:18.000Z","url":"https://x.com/ryolu_/status/2119586846657454152","likes":704,"retweets":70,"replies":29}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"My gstack-evals project took a look at this Jev Engineering article and tried to replicate it, and I also told it to try particle-1 and it turns out this article replicates, and particle-1 is even better","createdAt":"2026-11-09T02:52:59.000Z","url":"https://x.com/garrytan/status/2119624260675350605","likes":140,"retweets":8,"replies":24},{"text":"You're really going to want your own software factory","createdAt":"2026-11-09T02:18:45.000Z","url":"https://x.com/garrytan/status/2119615647592395037","likes":344,"retweets":24,"replies":32},{"text":"Once you realize software is so easily changed with frontier models, these bugs become a little bit unbearable And simultaneously, it seems obvious personal just-in-time software will be inevitable","createdAt":"2026-11-09T02:04:36.000Z","url":"https://x.com/garrytan/status/2119612084220842483","likes":22,"retweets":0,"replies":2}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven ail":"作者称用 Claude Code 在三分钟内生成了包含约 4.7 万条视频和电视模式的站点，这是其个人制作经历。","url":"https://x.com/karpathy/status/2119114537442189652"},{"kind":"动态","title":"Pro 用量说明","detail":"发帖人澄清所列 Pro 套餐没有五小时限制，分别提供相对 Plus 的 10、20、50 倍用量，最高档包含 ultrafast。","url":"https://x.com/thsottiaux/status/2119296267545419987"},{"kind":"动态","title":"训练数据市场交流预告","detail":"作者预告 11 月 11 日中午在旧金山与 Arcanum Labs 联合创始人交流，讨论实验室买什么数据、谁在供应和市场持续性。","url":"https://x.com/nikunj/status/2119229917019971879"},{"kind":"动态","title":"Asahi 开放性讨论","detail":"作者质疑增加妨碍其他项目继续构建的限制，并反对针对 AI 的拒绝立场。采集帖未附具体政策条文。","url":"https://x.com/steipete/status/2119264334627090514"}],"articles":{"blogs":[],"podcasts":[{"title":"Vlad Tenev：扩大工具和资产的参与机会","sourceName":"No Priors","sourceTitle":"Tokenization, Agentic Trading, Harmonic: Robinhood's Mission to Expand Ownership with CEO Vlad Tenev","sourceId":"03f99d40-d8c2-11f1-9c96-7b13ace0b070","sourceUrl":"https://www.youtube.com/@NoPriorsPodcast","publishedAt":"2026-11-05T11:00:00.000Z","linkScope":"channel","sourceTextSha256":"f6dfb57a89e54e90e5c3017b739b9513fd0460b51353aa2d24c8a2ae832d7938","blocks":[{"type":"paragraph","text":"Vlad Tenev 在 No Priors 中把 Robinhood 的业务扩展与个人经历联系起来。从东欧移民到美国、学习数学再进入高频交易，他关注的是强大工具如何让更多普通人使用。"},{"type":"heading","text":"数学研究与软件工程靠近"},{"type":"paragraph","text":"他介绍参与创办的 Harmonic，描述研究者使用版本控制、Lean 验证和模型协作的变化。他希望模型团队与数学家合作，让研究工具进入日常流程，而让少数公司独占发现的方式可能引起外部研究者抵触。"},{"type":"heading","text":"扩大资产访问"},{"type":"paragraph","text":"他从稳定币的美元访问经验谈到代币化，设想把平台上的资产与服务延伸到更多国家。他也介绍围绕具体经营指标的合约计划。如果用户判断公司业绩会上升，股票价格却可能受到其他消息影响，这类产品希望使交易对象更直接对应用户判断的事件。"},{"type":"heading","text":"从策略编写到自动执行"},{"type":"paragraph","text":"Tenev 称超过十五万名客户开设 agent 交易账户。其产品目标是减少编写、部署和运行策略所需的专业技术步骤。主持人进一步追问，大量自动策略会怎样改变系统负荷，正如更多代码生成会给测试与交付系统施压一样。"},{"type":"paragraph","text":"账户采用量与投资结果是不同指标。访谈提供的是受访者的业务描述，没有给出可据此评估收益的交易数据。"},{"type":"heading","text":"参与机会与社会支持"},{"type":"paragraph","text":"Tenev 认为，公司更长时间保持私有状态，会减少普通投资者参与早期增长的机会。他把扩大参与与技术产业的社会支持联系起来，继而讨论投资者准入和儿童账户。相关陈述是他的政策与产品主张。"},{"type":"paragraph","text":"访谈最后回到经营经历。他强调面对压力保持稳定判断，并从困难中积累经验。整场谈话围绕工具和资产的可获得性展开，从研究协作、交易自动化到更广泛的所有权，落地都需要产品和基础设施配合。"}]}]},"sources":{"podcasts":[{"title":"Tokenization, Agentic Trading, Harmonic: Robinhood's Mission to Expand Ownership with CEO Vlad Tenev","name":"No Priors","publishedAt":"2026-11-05T11:00:00.000Z","url":"https://www.youtube.com/@NoPriorsPodcast","excerpts":["Prediction markets are an evolution of news. You just can see what's happening and what's likely to happen in the future through the odds.","It's too centralized, right? It's like AI companies with their big data centers and their employees using secret models to sort of do all this work.","So AgenTik trading, clearly product market fit. We're seeing really strong adoption. Like, over a 150,000 customers have opened agentic trading accounts with us."]}],"blogs":[],"x":[{"name":"Andrej Karpathy","handle":"karpathy","bio":"","tweets":[{"text":"Earlier this week Tristan published his top YouTube channels: Which looked excellent so clearly I had to turn it into TristanTube: 47K super nerdy videos +TV mode for laid back watching. (One-shotted with Claude Code in 3 minutes)","createdAt":"2026-11-07T17:07:31.000Z","url":"https://x.com/karpathy/status/2119114537442189652","likes":6445,"retweets":515,"replies":475}]},{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @cognition - @temporalio - @aidotengineer - @latentspacepod","tweets":[{"text":"sticker game inspired by @dexhorthy @CompleteSkeptic et al","createdAt":"2026-11-08T01:37:19.000Z","url":"https://x.com/swyx/status/2119242830707311005","likes":74,"retweets":0,"replies":9},{"text":"","createdAt":"2026-11-07T23:29:19.000Z","url":"https://x.com/swyx/status/2119210618976944259","likes":1,"retweets":0,"replies":0},{"text":"just arrived… best swag game in the business. u guys are in for a treat next week","createdAt":"2026-11-07T23:29:10.000Z","url":"https://x.com/swyx/status/2119210582654210255","likes":92,"retweets":2,"replies":18}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Would a Pro 50 make sense? Wdyt?","createdAt":"2026-11-08T05:45:31.000Z","url":"https://x.com/thsottiaux/status/2119305294291612140","likes":1369,"retweets":58,"replies":855},{"text":"Saw some confusions, but all Pro plans have no 5-hour limits, and give the following usage compared to Plus. ✅ Pro 100 = 10X ✅ Pro 200 = 20X ✅ Pro 500 = 50X, access to ultrafast","createdAt":"2026-11-08T05:09:39.000Z","url":"https://x.com/thsottiaux/status/2119296267545419987","likes":2756,"retweets":86,"replies":650},{"text":"Cyber","createdAt":"2026-11-07T06:27:04.000Z","url":"https://x.com/thsottiaux/status/2118953362725159104","likes":1601,"retweets":39,"replies":417}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"The Better Lesson:","createdAt":"2026-11-07T23:55:53.000Z","url":"https://x.com/amasad/status/2119217304953053419","likes":255,"retweets":12,"replies":37},{"text":"Really enjoyed Kazakhstan — super AI pilled government. And a great place for the Network School.","createdAt":"2026-11-07T17:53:19.000Z","url":"https://x.com/amasad/status/2119126064815608270","likes":454,"retweets":22,"replies":37}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"This sounds extreme and I wouldn’t have believed it even a year ago, but we’re starting to see plenty of examples of productivity gains that are an order of magnitude or two above output levels pre-AI. With the right harness, a deep understanding of your domain of what you want to build, likely a relatively new codebase (with some exceptions), a fluency of how to work with multiple agents at once, and a setup that makes it so you can test and deploy with limited friction, outputs on this level feel realistic in coding. What’s crazy is this gap doesn’t appear to be diminishing over time. You’d think that we’d see a convergence in the lines because of AI, but it turns out the more depth you h…","createdAt":"2026-11-07T16:54:46.000Z","url":"https://x.com/levie/status/2119111328099168409","likes":582,"retweets":51,"replies":99},{"text":"The interesting thing about AI agents is that as a theoretical matter, their inference can kind of run anywhere. AI is one of the few areas of technology that isn’t *as* sensitive to latency back to the user. Long running agents are now going to be the norm, which means it’s ok to send off work to an AI factory somewhere and that work can essentially be largely done within that remote data center and a final result spit back to the user. The data can pass into these systems in an encrypted manner, be combed through by agents, and then disregarded right after. And because the economic value of the task is so high relative to the latency sensitivity (eg getting back $500 in value from an auto…","createdAt":"2026-11-07T06:29:14.000Z","url":"https://x.com/levie/status/2118953909524050288","likes":256,"retweets":37,"replies":105}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"WIRED is a shell of its former self","createdAt":"2026-11-07T20:59:08.000Z","url":"https://x.com/garrytan/status/2119172824271360124","likes":110,"retweets":3,"replies":16},{"text":"We could have abundance This is going to be the defining political issue of the next decade: can we have human progress in science, medicine and engineering through superintelligence? Or will we choose the darkness?","createdAt":"2026-11-07T19:16:16.000Z","url":"https://x.com/garrytan/status/2119146939514278238","likes":314,"retweets":21,"replies":55},{"text":"Man don’t show this essay to the NIMBYs","createdAt":"2026-11-07T18:59:22.000Z","url":"https://x.com/garrytan/status/2119142686422859899","likes":84,"retweets":0,"replies":5}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Harvard’17. Instagram: GitHub:","tweets":[{"text":"So many people speak of startup as if their fates are predestined: X idea will never work out; the market for Y is too niche... But startups' fates are MADE, not predetermined. Given one idea, there are 1000 ways to execute it, 100 people will have 100 different approaches. Brilliant people with brilliant execution often create something when there was nothing, or make the impossible seem obvious in hindsight.","createdAt":"2026-11-07T07:28:40.000Z","url":"https://x.com/zarazhangrui/status/2118968862557475298","likes":146,"retweets":5,"replies":29}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"Next guest up is @danielrupawalla, cofounder of @ArcanumLabs_ next Wednesday, Nov 11th at noon. For this session, we'll be chatting about all things data (what the labs are buying, who is selling, how do i get into this business, will this market even last..) Format: > 60 minute sessions (IRL only) in SF > For the first 45 mins, I get to ask the guest spicy questions about their expertise > For the last 15 mins, they get to ask me anything they want to learn about venture > All off the record, chatham house rules > Open to 10-12 guests who listen in and can ask some of their own questions Register here if you want to join, and subscribe to the Luma for future guests:","createdAt":"2026-11-08T00:46:00.000Z","url":"https://x.com/nikunj/status/2119229917019971879","likes":13,"retweets":1,"replies":3},{"text":"ok here’s how we get investors to fomo our series A and get seven term sheets.. first, we have to vague post revenue. or customers. this is absolutely critical. no y axis, just keep showing numbers and to the right. graphs work and of course get your investors to quote tweet it and take credit. they love doing that anyway. make it vague like “slowly but surely” or “i see an exponential when I see one” ok, once you do that, you know you can do another launch video for features or even better multiple for features so you get maximum airtime. after that case studies are critical - get a trendsetter company to talk about you or even better have the labs mention you in articles. this will guaran…","createdAt":"2026-11-07T20:16:58.000Z","url":"https://x.com/nikunj/status/2119162212044742938","likes":80,"retweets":3,"replies":8}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"The Asahi project was all about taking something closed and restricted and opening it up. Adding new restrictions that make it harder for other projects to build on that is not the way. And that AI rejection is just silly.","createdAt":"2026-11-08T03:02:46.000Z","url":"https://x.com/steipete/status/2119264334627090514","likes":1053,"retweets":44,"replies":85}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"If building datacenters becomes harder, it is obvious that you should be super long anyone who has existing capacity (aka hyperscalers). It's not like the demand for the spice is going way -- it is only continuing to go up. Thus the spice holders will win big. What will suffer is the rate of new model training. I guess we will pace the frontier after all. The body politic speaketh.","createdAt":"2026-11-07T19:57:26.000Z","url":"https://x.com/adityaag/status/2119157297167372646","likes":41,"retweets":3,"replies":5}]}]},"errors":["Podcast feed problem: Podcast: Transcript error for \"Deep Dive: Anthropic S-1 Myths and Mythos — Jamin Ball, Altimeter\": HTTP 502: {\"status\":\"error\",\"code\":\"transcription_submit_failed\",\"message\":\"The transcription service couldn't start this episode.\"}"],"partial":false},{"date":"2026-11-08","dateLabel":"2026年11月08日","generatedAt":"2026-11-08T00:00:00+08:00","sourceGeneratedAt":"2026-11-07T06:25:13.003Z","stats":{"podcastEpisodes":1,"xBuilders":13,"totalTweets":29,"blogPosts":0},"highlights":[{"tag":"产品","title":"让 agent 的成果回到用户熟悉的编辑器","body":"作者注意到创作软件内置 MCP 的模式。agent 完成一部分工作后，用户能在原工具继续修改，交接成本因此下降。对创作产品，自动生成结果能否继续编辑，会直接影响人愿不愿意把它用于正式项目。","evidence":[{"quote":"power users can collaborate and continue the work in tools that they're used to","translation":"熟练用户能在习惯的工具中协作并接着完成工作。","attribution":"Thariq","url":"https://x.com/trq212/status/2118822238262853904","publishedAt":"2026-11-06T21:46:02.000Z"}]},{"tag":"产品","title":"模型升级后，旧 skill 也需要重新验收","body":"作者介绍自己删除一个调查 skill 的经历，理由是新模型直接执行效果更好。由此看，过去为补足能力而加入的步骤，可能逐渐变成额外成本。升级时用相同任务比较有无 skill 的结果，才能判断哪些步骤值得保留。","evidence":[{"quote":"You can remove things you don't need anymore.","translation":"可以删掉那些已经不再需要的东西。","attribution":"Garry Tan","url":"https://x.com/garrytan/status/2118920030243139596","publishedAt":"2026-11-07T04:14:37.000Z"}]},{"tag":"产品","title":"多模型应用的价值在于保留选择空间","body":"作者观察到部分应用被模型实验室收购，并认为跨厂商需求仍在。对用户，统一工作环境能够降低比较和更换模型的成本。由此推断，应用若能保留任务记录和工具配置，让用户随任务选择模型，就有独立的产品价值。","evidence":[{"quote":"there’s still a lot of user and enterprise demand for apps that can use models from different labs.","translation":"用户和企业仍然很需要能使用不同实验室模型的应用。","attribution":"Peter Yang","url":"https://x.com/petergyang/status/2118811231545122998","publishedAt":"2026-11-06T21:02:17.000Z"}]}],"matters":[{"kind":"动态","title":"对话平台里的生成式界面","detail":"Guillermo Rauch 介绍将 AI SDK、Chat SDK 与 json-render 组合，把模型输出转换成 Slack、Teams 等平台中的界面，并预测这会成为常见的人机交互方式。","url":"https://x.com/rauchg/status/2118856239719608353"},{"kind":"动态","title":"Texts Wrapped 更新本地通信统计","detail":"作者介绍新版工具，可在 Mac 本地分析 iMessage、WhatsApp 和通话记录。其自述为开源、完全本地运行，并更新了界面、洞察和准确性，需要完整磁盘访问权限。","url":"https://x.com/nikunj/status/2118840414853861627"},{"kind":"动态","title":"个人网站让实际作品更容易被看见","detail":"作者提议把个人网站作为简历，展示审美、思考和实际工作。相比仅罗列职位，这种呈现让读者能直接查看作品如何完成。","url":"https://x.com/zarazhangrui/status/2118939184841052386"},{"kind":"动态","title":"Swyx 计划持续跟踪 Anthropic IPO","detail":"Swyx 表示将与 Jamin Ball 每周跟踪这一议题，直到上市发生或最终没有发生。帖子宣布的是报道计划。","url":"https://x.com/swyx/status/2118905788915982341"}],"articles":{"blogs":[],"podcasts":[{"title":"Fabian Theis：从细胞图谱走向下一次实验","sourceName":"Latent Space","sourceTitle":"Controlling Biology - Fabian Theis, Helmholtz Munich","sourceId":"01a1a3f4-4773-7ef4-9673-59b03a12c34b","sourceUrl":"https://www.youtube.com/@LatentSpacePod","publishedAt":"2026-11-06T14:48:24.000Z","linkScope":"channel","sourceTextSha256":"9503f0923ddf12960a0867517778959ab9ba10eab6d0728c17fa9ceeac3387c6","blocks":[{"type":"paragraph","text":"Fabian Theis 在 Latent Space 访谈中，把计算生物学的进展串成三个阶段：先记录细胞是什么样，再预测干预之后会怎样，最后用预测来选择下一次实验。这条路的难处，是模型每前进一步，都要面对真实实验的成本和时间。"},{"type":"heading","text":"细胞图谱提供了起点"},{"type":"paragraph","text":"人体不同细胞拥有基本相同的基因组，却表达不同的 RNA。单细胞测量让研究者看到这种差异，也为模型提供了描述细胞状态的数据。但描述状态只完成了一部分工作。所谓虚拟细胞，还需要回答药物、基因变化、环境和时间如何共同改变细胞。"},{"type":"paragraph","text":"类器官和干预实验因此重要。研究者需要主动改变条件，才能观察系统怎样响应。仅把更多静态测量放在一起，并不能自动补齐所有干预结果。"},{"type":"heading","text":"模型复杂度要和问题一起判断"},{"type":"paragraph","text":"Theis 承认，在部分现有任务和数据条件下，线性模型仍然表现不错，判断细胞类型也常能用逻辑回归完成。他把原因与任务难度联系起来。预测更复杂的变化，需要同时考虑细胞状态、环境和作用方式。"},{"type":"paragraph","text":"他介绍的方法先学习细胞的潜在表示，再用生成模型预测干预后的状态。好的表示为后续预测提供基础，生成方法本身也需要评估。他提到部分竞赛指标可能被利用，因此主张让评测更贴近细胞数据中的真实差异，而非仅追逐固定分数。"},{"type":"heading","text":"把预测带回实验室"},{"type":"paragraph","text":"从正向预测走到逆向设计，研究问题变成：想得到某种状态，应该施加什么干预？他用 Lab Compass 解释这一方向，并谈到通过多轮实验逐步改进模型。"},{"type":"paragraph","text":"真正启动循环，需要实验人员愿意投入。建新细胞系、培养材料和完成测量都需要时间。计算团队提出一个预测，只是合作的开头，实验团队还要认可这个问题值得做。模型是否有用，最终要在这种持续交接中体现。"},{"type":"heading","text":"数据生成也是产品能力"},{"type":"paragraph","text":"访谈随后谈到科研成果如何走向产业。Theis 举出癌症类器官干预图谱合作，药企参与以提前获得相关数据。他认为，把建模和数据生成连接起来，能够让合作形成更具体的价值。"},{"type":"paragraph","text":"这一思路也解释了为什么科研团队需要同时理解方法和领域问题。能训练模型的人，还要知道缺什么数据、哪项实验能减少不确定性，以及结果如何影响下一步。控制生物系统的愿景，最终依赖这些可以一次次执行的研究步骤。"}]}]},"sources":{"podcasts":[{"title":"Controlling Biology - Fabian Theis, Helmholtz Munich","name":"Latent Space","publishedAt":"2026-11-06T14:48:24.000Z","url":"https://www.youtube.com/@LatentSpacePod","excerpts":["We can really now start guiding the experimentation. So where before you, we built these human cell atlases, we had sort of this mapping aspect. Then we talked about the world models prediction problem.","From mapping, we went to prediction. But now we can go to actually steering the next experiment. But quite frankly, very often the papers ended with some model, right?","Maybe some sort of concept figure, maybe add a little bit validation. But then typically you start the next project, right? And of course you learn a bit, but it's not like, not like a continual learning type of thing."]}],"blogs":[],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @cognition - @temporalio - @aidotengineer - @latentspacepod","tweets":[{"text":"we are committing to weekly coverage of the Anthropic IPO all the way until it does or doesn't happen. Having covered mega-IPOs from $BABA to $TEAM, I get to dust off my equity hedge fund analyst hat with my AI Engineer hat once more, this time with my good friend @jaminball who is challenging @ttunguz for writer-VC-extraordinare of his generation.","createdAt":"2026-11-07T03:18:02.000Z","url":"https://x.com/swyx/status/2118905788915982341","likes":78,"retweets":0,"replies":44},{"text":"@StandupPartners @ryolu_ @Microsoft @MiniMax_AI @theworldlabs @HeyGen @ExaAILabs recap video","createdAt":"2026-11-06T22:21:42.000Z","url":"https://x.com/swyx/status/2118831214308262043","likes":2,"retweets":0,"replies":0},{"text":"@aditabrm @reductoai @barsisyphus unironically, @allenpark cooked","createdAt":"2026-11-06T22:14:51.000Z","url":"https://x.com/swyx/statu 入检索流程。","evidence":[{"quote":"so agents only work with the data they’re allowed to.","translation":"让 agent 只处理获准使用的数据。","attribution":"Aaron Levie","url":"https://x.com/levie/status/2118498574497665316","publishedAt":"2026-11-06T00:19:54.000Z"}]},{"tag":"实践","title":"提醒的价值取决于人何时能行动","body":"作者举了洗衣的例子：距上次洗衣超过五天，再等工作日到家半小时才提醒。经过天数决定事情是否到期，位置和时间决定眼下是否做得了。要复现这种体验，系统得保存上次完成时间，也得可靠识别到家事件。","evidence":[{"quote":"one of my favorite prompts for agents like Instinct is location based reminders","translation":"我最喜欢给 Instinct 这类 agent 的指令之一是基于位置的提醒。","attribution":"Thariq","url":"https://x.com/trq212/status/2118399561324699655","publishedAt":"2026-11-05T17:46:28.000Z"}]}],"matters":[{"kind":"议题","title":"Replit 披露定制内核的沙箱设计","detail":"Amjad Masad 称其定制内核能避开所指 Linux 零日漏洞中的 96%。这是团队自报的覆盖比例，原帖未给出样本清单。","url":"https://x.com/amasad/status/2118503241390665776"},{"kind":"议题","title":"Claude 在美国试推个人财务功能","detail":"用户可选择连接账户，用自然语言查询自己的余额和交易。账户访问为只读，功能处于测试阶段。","url":"https://x.com/claudeai/status/2118403114890137895"},{"kind":"议题","title":"私募股权与投行业务出现长程任务评测","detail":"发帖人将这项评测称为该领域首个长程基准。它关注需要连续完成的金融工作，原帖没有给出模型得分。","url":"https://x.com/garrytan/status/2118527182092071179"},{"kind":"议题","title":"有人愿意出价，公司该接受这个估值吗","detail":"发帖人指出，投资人愿意按某个估值投资，只能说明有人愿意成交。创始人仍需判断这一定价是否适合公司。","url":"https://x.com/adityaag/status/2118477020325884357"}],"articles":{"blogs":[],"podcasts":[{"title":"Jev 创作者谈决策模型：当读者是软件，模型该交付什么","sourceName":"Unsupervised Learning","sourceTitle":"Ep 97: Jev Creator on Decision Models, Benchmark Fatigue &amp; Why the Labs Missed It","sourceId":"9e93ce06-533a-4c12-aecb-7c10e60bb02a","sourceUrl":"https://www.youtube.com/@RedpointAI","publishedAt":"2026-11-05T14:05:50.000Z","linkScope":"channel","sourceTextSha256":"5f527bd6bff3b2affa4992621392e68c350acd1173479c30a21dc52878313742","blocks":[{"type":"paragraph","text":"Jev 的创作者在 Unsupervised Learning 里提出一个设计问题：模型的回答最后交给谁？人读一段解释，会在意措辞和条理。软件调用模型，往往只是要从几种动作中选一个。若每次都让模型写一段话，再从中猜它选了什么，就给原本简单的决定增加了一层不确定性。"},{"type":"heading","text":"让程序掌握流程"},{"type":"paragraph","text":"他把 Jev 的切入点放在这些小决定上。工程师编写业务逻辑，规定输入和可选动作，只在难以写成确定规则的地方调用模型。这样，一个团队积累的经验可以落实到可检查、可修改的软件里。遇到新场景，工程师也可以先用临时办法验证是否真有价值，再决定要不要为它设计长期接口。"},{"type":"paragraph","text":"他举了工具调用的例子。同一次调用，在一家公司的某段代码里合乎要求，换到另一个模块就可能越界。如果检查能读懂组织自己的约束，就有机会在执行前发现问题。这里的难点是每次调用都要检查，单次的成本和延迟会反复累积。"},{"type":"heading","text":"编程助手之间怎样交接"},{"type":"paragraph","text":"接着他谈到共享状态。一个助手试错、修改代码之后，另一个助手要解释它做了什么，难道只能重读全部交互，或者面对最终提交从头推理？他设想给第二个助手代码库的只读权限，让它在旁边生成可视化，帮助人跟上第一个助手的工作。两者需要看见同一项工作的进展，又各自拥有合适的写入权限。"},{"type":"paragraph","text":"这也是他对排行榜感到疲劳的原因。团队实际关心的是某种输入会导致什么错误、这样的错误多久发生一次，以及能否把后果限制在局部。通用评测很难替产品团队回答这些问题。他主张先自动化容易界定、容易检查的工作，逐步积累对可靠性的认识。"},{"type":"heading","text":"把返工也算进效率"},{"type":"paragraph","text":"谈到编码 agent，受访者个人估计提速约为 20% 至 40%，并明确说明任务和使用者水平会改变结果。短期能数出写代码节省的时间，技术债和技能退化却可能晚得多才显现。对采用工具的团队，更有意义的观察是哪些任务可以隔离副作用、快速验收，以及交付之后还要付出多少维护成本。"}]}]},"sources":{"podcasts":[{"title":"Ep 97: Jev Creator on Decision Models, Benchmark Fatigue &amp; Why the Labs Missed It","name":"Unsupervised Learning","publishedAt":"2026-11-05T14:05:50.000Z","url":"https://www.youtube.com/@RedpointAI","excerpts":["As you think about Anthropic, is that something you're optimistic on? It's like, hey. That's that's undervalued or something you're like, oh, I don't know what's gonna happen to that.","I get the sense that a lot of the expectations baked in are ones that are not just product level, but based on, like, misunderstandings of the future of AI and what it can do. So my guess is that because some people might be valuing, like, building god as basically infinite, there'll be some amount of miscalibration miscalibration there. And I think that, y…","Jeb took the AI world by storm about a month ago, and I've been wanting to talk to Jogo, their CEO of TypeSave, for quite some time. So it was really fun to have him on the podcast. I think maybe even better, with with a month to reflect on everything that's happened because we talked about a ton of different things. It was really awesome to get Jogo's pers…"]}],"blogs":[],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @cognition - @temporalio - @aidotengineer - @latentspacepod","tweets":[{"text":"also we need: - trumpet/clarinet guy - woodwinds guy - horn guy for next year’s show. tagging @creatine_cycle for musician friends","createdAt":"2026-11-06T06:20:51.000Z","url":"https://x.com/swyx/status/2118589412011622728","likes":0,"retweets":0,"replies":0},{"text":"for those who want a GREAT scout experience i cannot recommend highly enough @brittwalker_ who has been thru thick and thin with me and is honestly sharper than me on many things, always learn lots talking to her","createdAt":"2026-11-06T03:15:49.000Z","url":"https://x.com/swyx/status/2118542845556691411","likes":17,"retweets":0,"replies":4},{"text":"ok guys pitchforks down pls we chatted and i learned a lot about why i had been missing context and communication - not a sequoia wide thing, just a small gap i got caught in. also the quoted tweet has impt inaccuracies/incomplete info i can’t share but basically treat it as unrelated to the broader sequoia restructuring that was announced this week","createdAt":"2026-11-06T03:00:08.000Z","url":"https://x.com/swyx/status/2118538896434999759","likes":30,"retweets":0,"replies":1}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Formal proofs of tens of millions of lines of code are not a ridiculous thing anymore and within the realm of what should be considered when designing new systems.","createdAt":"2026-11-06T05:01:30.000Z","url":"https://x.com/thsottiaux/status/2118569441860723112","likes":543,"retweets":20,"replies":55},{"text":"I can confidently say that humans were not very good at writing secure infrastructure. The endstate will be hypersecure infrastructure and software for all, but we're going to go through some turbulence before we reach that.","createdAt ng to have 100X more agents in the enterprise working with our data and systems than even people do today. Every AI agent deployment comes down to how successfully they can get access to the critical context to make a decision, do research, or execute tasks. 90% of the data in an enterprise is unstructured data, which means this critical context is living inside of our documents, contracts, marketing assets, research materials, financial plans, design files, and more. Which means we need effective ways for agents to get access to this critical enterprise content to other work. We’re excited to partner with NVIDIA to deliver advanced context retrieval -combining lexical and semantic…","createdAt":"2026-11-06T00:19:54.000Z","url":"https://x.com/levie/status/2118498574497665316","likes":140,"retweets":18,"replies":56},{"text":"","createdAt":"2026-11-05T19:43:28.000Z","url":"https://x.com/levie/status/2118429008711102831","likes":131,"retweets":17,"replies":34}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"From @WalterIsaacson's podcast with me that went live earlier this week. Watch the full convo here:","createdAt":"2026-11-06T04:15:06.000Z","url":"https://x.com/garrytan/status/2118557765610377611","likes":20,"retweets":3,"replies":1},{"text":"This week's results make me optimistic. We have an unprecedented bipartisan opportunity to take on Big Tech’s abuse of market power and open up markets for the next generation of founders. Inventing powerful AI is only half the job. People must be able to use it to make their lives better and their businesses more productive. That gets harder when a few trillion-dollar companies can block new products from reaching them. Congress can open those markets for Little Tech. Let thousands of startups compete to lower costs and grow the economy for everyone. We should ,"publishedAt":"2026-11-05T05:08:39.000Z"}]},{"tag":"设计","title":"当用户还没有答案时，过早生成成品可能帮倒忙","body":"Ryo Lu 区分了两种工作：实现一个已经明确的想法，以及弄清楚自己究竟想做什么。对后一种，工具若直接交付成品，用户容易围绕第一个结果修补。让用户先比较几种方向、说出取舍理由，更贴近他提出的设计目标。","evidence":[{"quote":"i want tools that help us find our own answers, not skip the process of forming them.","translation":"我想要的工具能帮我们找到自己的答案，而不是跳过形成答案的过程。","attribution":"Ryo Lu","url":"https://x.com/ryolu_/status/2118207967728451760","publishedAt":"2026-11-05T05:05:08.000Z"}]},{"tag":"实践","title":"当 agent 为整个项目工作，个人配额难以解释消耗","body":"Peter Steinberger 描述了一个持续循环、维护代码库的项目 agent：人负责挑选自动化任务，实际执行横跨多人。由此推断，如果只按操作人的额度看用量，很难判断是哪个工作流消耗了资源。先按项目记录成本，再决定是否调整限额，更容易看出问题所在。","evidence":[{"quote":"Do individual limits still make sense?","translation":"个人限额还有意义吗？","attribution":"Peter Steinberger","url":"https://x.com/steipete/status/2118116514700386439","publishedAt":"2026-11-04T23:01:44.000Z"}]}],"matters":[{"kind":"人事","title":"Cat Wu 加入 OpenAI 核心产品团队","detail":"Cat Wu 宣布将负责 Core Products 的产品管理。她将个人和团队保有对 agent 的控制权列为工作方向，未公布具体产品或时间表。","url":"https://x.com/_catwu/status/2118137612577968402"},{"kind":"应用","title":"Replit 与日本金融机构 SMFL 合作","detail":"Amjad Masad 称，SMFL 一名员工用一周完成了此前需要六人做六个月的项目。帖子没有给出项目范围与验收条件，不能据此估算其他团队的提效幅度。","url":"https://x.com/amasad/status/2118180254300688857"},{"kind":"安全","title":"Vercel 披露安全审查首日修复量","detail":"据 Guillermo Rauch 披露，24 小时内识别出 6,817 个漏洞，其中 580 个属高危或严重，agent 已修复 1,411 个。两组数字的交集未披露，不能由此得出高危漏洞修复率。","url":"https://x.com/rauchg/status/2118152230260092940"},{"kind":"产品","title":"Dialpad 与 Ada 瞄准跨渠道客户服务","detail":"投资人 Matt Turck 描述的目标是：客户无论打字还是通话、购买还是求助，都能由同一套系统理解意图并执行操作。这是他对两者结合的期待，尚非已交付功能清单。","url":"https://x.com/mattturck/status/2118010883754299884"}],"articles":{"blogs":[],"podcasts":[{"title":"Kevin Roose：用 AI 整理采访，留下必须亲自做的判断","sourceTitle":"The Inside Story of the 50 Who Built Modern AI With Kevin Roose","sourceId":"flightcast:01M6KJSKA8EAFY499K1BVMN3KK","sourceUrl":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL","sourceName":"AI & I by Every","author":"Kevin Roose","publishedAt":"2026-11-04T17:02:33.000Z","linkScope":"channel","sourceTextSha256":"228c9161a682b51799b5bddffadc073e7274ddf392f0a649d360080f246d94f4","blocks":[{"type":"paragraph","text":"Kevin Roose 想回答的不是下一个模型有多强，而是今天的 AI 究竟怎样走到了这一步。在 AI & I 的访谈中，他把这件事讲成了两个相连的问题：记者怎样保存一段正在消失的历史，又该把多少采访和写作工作交给自己报道的工具？"},{"type":"heading","text":"趁记录还在，先找到做决定的人"},{"type":"paragraph","text":"对许多读者来说，AI 仿佛突然闯入生活。实验室里的研究者看到的却是一连串尚无定论的选择。Roose 担心，保密协议挡住了外部观察，而 Slack 消息与加密聊天记录又可能随时间消失。等结果已成常识，再去问当初为什么这么做，能找到的往往只剩胜者的解释。"},{"type":"paragraph","text":"为了让受访者越过熟悉的概述，他先读对方的论文、听过去的采访，再带着具体分歧发问。访谈中提到的一条路线，就是把算力投向预测下一个词这类通用问题，观察智能能否从中产生。今天听来熟悉的办法，在当时是一项需要有人选择、也可能选错的赌注。"},{"type":"heading","text":"把检索交给模型，把判断留给记者"},{"type":"paragraph","text":"采访越多，困难越具体：究竟是谁讲过 GPT-4 预训练的那段故事？想追查 Anthropic 在 2021 年的一件事，应该再找哪三个人？Roose 把研究材料放进 NotebookLM 的多个笔记本，让它跨材料寻找线索。回答的价值在于能把记者带回某份记录、某位受访者，而不是替记者决定谁的叙述可信。"},{"type":"paragraph","text":"他也用模型核查草稿。过去他要花时间检查 AI，如今 AI 也能指出他的问题。这是他对自己工作方式的描述；这种反转之所以有用，关键是能找到原始文档，而不是模型说话有多肯定。"},{"type":"heading","text":"哪些力气不能省"},{"type":"paragraph","text":"写作进入编辑阶段，模型能找出该收紧的句子，也开始能讨论节奏和结构。但好编辑还会在作者泄气时鼓励他，或坚持让他再去采访一次。这些介入改变的是作者愿意做什么，和修好一段文字并不相同。"},{"type":"paragraph","text":"谈到视频，他也不满足于把播客对谈直接放到屏幕上。他想探索怎样让有野心的报道在画面上也成立，因此看视频时会研究哪些表达有效。这仍是一道要自己练习的题。Roose 最后用叉车和举重作比：搬货可以借力，锻炼时让叉车代劳，人就得不到训练。该不该自动化，得先问这件工作究竟要交付结果，还是要练出能力。"}]}]},"sources":{"podcasts":[{"title":"The Inside Story of the 50 Who Built Modern AI With Kevin Roose","name":"AI & I by Every","publishedAt":"2026-11-04T17:02:33.000Z","url":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL","excerpts":["A couple years ago, you know, we had to fact check the AIs, and now the AIs fact check me. I'm playing with everything. Literally, like, I can't keep track. I have agents now that are, like, correcting my other agents. It's a huge mess.","Like, it addresses the question that so many of us have when it comes to this moment in AI, which is just like, how did we get here?"," verwhelming, WhatsApp isn't widely used in the US, iMessage is too personal, Slack feels too corporate","createdAt":"2026-11-04T23:18:45.000Z","url":"https://x.com/zarazhangrui/status/2118120795780370768","likes":64,"retweets":1,"replies":59},{"text":"One thing I noticed: the vast majority of people who shared their personal websites in this thread are developers or designers. Is it because only developers and designers need personal websites, or because only they know how to make one?","createdAt":"2026-11-04T06:39:14.000Z","url":"https://x.com/zarazhangrui/status/2117869262505427072","likes":99,"retweets":3,"replies":43}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"This was really fun - thanks @PeterJ_Walker and guests for coming so spontaneously. Aim to do this every week so if you know someone who wants to be interviewed, please DM me. Looking for speakers who a) can speak about an area casually but in depth for 45 mins and b) who are not a household name now but will most likely be one in 12 months. Photo post event taken by @tedkornish","createdAt":"2026-11-05T00:48:47.000Z","url":"https://x.com/nikunj/status/2118143456799494541","likes":34,"retweets":0,"replies":11}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"Do individual limits still make sense? As capabilities increase you want to work with and support an agent that represents your project, that runs loops and evolves your codebase. The humans merely curate the automations.","createdAt":"2026-11-04T23:01:44.000Z","url":"https://x.com/steipete/status/2118116514700386439","likes":518,"retweets":22,"replies":118}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"all of these new @openai hires obvoiusly because they read my codex piece","createdAt":"2026-11-05T02:37:29.000Z","url":"https://x.com/danshipper/status/2118170810841965023","likes":57,"retweets":4,"replies":13},{"text":"omfg","createdAt":"2026-11-05T00:30:51.000Z","url":"https://x.com/danshipper/status/2118138941765280149","likes":201,"retweets":0,"replies":9}]}]},"errors":[],"partial":false},{"date":"2026-11-05","dateLabel":"2026年11月05日","generatedAt":"2026-11-05T00:00:00+08:00","sourceGeneratedAt":"2026-11-04T06:28:22.825Z","stats":{"podcastEpisodes":1,"xBuilders":18,"totalTweets":29,"blogPosts":0},"highlights":[{"tag":"实践","title":"安全审查应成为交付流程的一部分","body":"Guillermo Rauch 发布自动安全审查产品，并强调不能依赖工程师临时安装技能或提醒模型写安全代码。由此看，稳定的覆盖来自每次交付都触发检查，而不是个人是否记得操作；产品效果仍是供应商自述，不能把自动扫描当作无漏洞保证。","evidence":[{"quote":"Every single line of code gets audited, automatically.","translation":"每一行代码都会自动接受审查。","attribution":"Guillermo Rauch","url":"https://x.com/rauchg/status/2117734833824948373","publishedAt":"2026-11-03T21:45:04.000Z"}]},{"tag":"实践","title":"企业 agent 的使用门槛，也在身份连接环节","body":"Boris Cherny 介绍由管理员配置插件、成员首次使用时自动连接的机制。减少重复登录能缩短从发现工具到实际使用的路径，但真正的价值取决于连接是否沿用正确的成员权限；原帖没有说明权限撤销和审计细节。","evidence":[{"quote":"Team and Enterprise admins can set them up, and teammates are connected automatically the first time they use the plugins.","translation":"Team 和 Enterprise 管理员可以完成配置，成员首次使用插件时会自动连接。","attribution":"Boris Cherny","url":"https://x.com/bcherny/status/2117693181651542387","publishedAt":"2026-11-03T18:59:33.000Z"}]},{"tag":"实践","title":"工作流改进可以有固定节奏，而不是追逐每次发布","body":"Nikunj 将使用回顾安排为每两周一次，再结合行业实践调整配置。可借鉴之处是把真实使用问题与外部新方法放到同一个反馈循环中；是否有效仍应看任务表现，不能把增加工具数量当作改进。","evidence":[{"quote":"For insights, I have a regular cron job that runs this now every two weeks.","translation":"对于 insights，我现在设置了每两周运行一次的定时任务。","attribution":"Nikunj Kothari","url":"https://x.com/nikunj/status/2117773647868018897","publishedAt":"2026-11-04T00:19:18.000Z"}]}],"matters":[{"kind":"x","title":"电话 agent 覆盖等待、预约和报价收集","detail":"Peter Yang 展示 Grok Bot 电话功能的五类用法，包括账单协商、取消订阅、等待客服、订位和询价；原帖明确目前仅支持美国号码。","url":"https://x.com/petergyang/status/2117783921748558185","publishedAt":"2026-11-04T01:00:08.000Z"},{"kind":"x","title":"Cat Wu 宣布离开 Anthropic","detail":"Cat Wu 回顾 Claude Code 从内部工具、人工逐项批准，到更广泛委托执行的变化，并感谢用户反馈。她没有在原帖宣布下一份工作。","url":"https://x.com/_catwu/status/2117731934340337676","publishedAt":"2026-11-03T21:33:33.000Z"},{"kind":"x","title":"SurrealDB 4 强调多模型数据与引擎重建","detail":"Matt Turck 介绍向量、图和文档能力、ACID 及 Postgres/MySQL 支持。原帖中的峰值吞吐量没有给出测试条件，不作可比性能结论。","url":"https://x.com/mattturck/status/2117741948609949932","publishedAt":"2026-11-03T22:13:20.000Z"},{"kind":"x","title":"更聪明的模型是否意味着更少验证","detail":"Thariq 预测更强模型将需要更少 token，甚至不必检查错误。原帖未提供实验，这是对未来能力的判断，尚不能据此取消现有验证。","url":"https://x.com/trq212/status/2117670540148347273","publishedAt":"2026-11-03T17:29:35.000Z"}],"articles":{"blogs":[],"podcasts":[{"title":"Nebius 的 AI 云路线：用软件能力争取扩张窗口","sourceTitle":"Ep 96: Nebius CTO on Racing the Hyperscalers Before AWS Wakes Up","sourceId":"4248d1df-1156-4e68-b67a-5f3cfd063aea","sourceUrl":"https://www.youtube.com/@RedpointAI","sourceName":"Unsupervised Learning","author":"Danila","publishedAt":"2026-11-02T13:54:35.000Z","linkScope":"channel","sourceTextSha256":"d7d07d7bb1624313e18b4d787f928a9d3bab3f9597db792357b7fb08e765d3d0","blocks":[{"type":"paragraph","text":"Nebius CTO Danila 在 Unsupervised Learning 中讨论了独立 AI 云的机会：同一平台既要支持大型 GPU 集群，也要服务只运行半小时单卡任务的开发者。以下依据 11 月 2 日发布的访谈整理，经营与性能描述均为受访者自述。"},{"type":"heading","text":"买到 GPU 只是起点"},{"type":"paragraph","text":"Danila 把软件视为公司的核心能力。他认为，大型平台要同时照顾内部 AI 团队和外部客户，容量分配形成了独立供应商的机会。但这并不意味着大型云没有参与竞争，也不意味着这个窗口会永久存在。"},{"type":"paragraph","text":"Nebius 从原有团队中继承了大规模硬件运维经验，软件平台则重新建设，并快速招募更多工程师。其目标是完整的云体验，而非裸机租赁或第三方服务拼接；访谈以早期硬件团队约四五十人、软件团队约两百人的对比，解释这一投入方向。"},{"type":"heading","text":"新硬件上线是一轮轮系统适配"},{"type":"paragraph","text":"NVIDIA 的原型、样品和最终设计会持续变化。云厂商拿到芯片后，还要验证虚拟化、存储、网络以及工作负载隔离，并把大规模测试中发现的问题反馈给供应商。"},{"type":"paragraph","text":"当系统从服务器走向机架级互联，维护单位也随之变化：过去可以迁移任务后关闭一台服务器，现在需要考虑整架资源的运行与维护。芯片性能提升并不自动完成产品交付，软件与运维必须同步跟上。"},{"type":"heading","text":"存储吞吐与企业要求改变产品边界"},{"type":"paragraph","text":"Danila 承认，团队最初低估了存储的重要性。训练需要的不只是容量，还包括共享文件系统的吞吐和延迟。他举出单个共享存储达到每秒数百 GB 读取的客户场景，说明大客户的规模与传统云经验存在差距；访谈未提供独立性能测试。"},{"type":"paragraph","text":"客户差别也不只在合同金额。新模型团队可能主要关注 GPU、可用性和性能；更成熟的企业即使采购规模较小，也需要认证、合规、安全审查和明确的客户责任。成为通用云，意味着同时支持这两类要求。"},{"type":"heading","text":"推理优化先匹配真实流量"},{"type":"paragraph","text":"Nebius 的思路是先建立足够高的硬件与基础设施基线，再在编排、模型和请求路径上满足不同 SLA。首 token 延迟、总响应时间和流量形态，会决定优化方向。"},{"type":"paragraph","text":"对于预填充与解码分离，Danila 态度谨慎：部分高需求客户已经采用，但仍依赖精细配置，并不是所有任务的默认方案。快速机架互联能缓解数据搬运成本，资源如何分配、多个负载如何装入同一机架，依然需要具体分析。"},{"type":"paragraph","text":"他认为还有很多更直接的改进空间，包括请求处理、推理服务配置、kernel、剪枝、压缩和推测解码。对于边界明确的领域，模型可以保留必要能力、减少其他能力，但这不适合直接套用到开放式研究或广泛编码任务。"},{"type":"heading","text":"平台扩展围绕 agent 的构件"},{"type":"paragraph","text":"团队投入模型优化人才，也讨论搜索和沙箱如何与托管推理组合。访谈中的搜索业务尚未完全融入其他产品，更多整合仍在探索，因此不能把路线图视为现成的一体化能力。"},{"type":"paragraph","text":"这种扩展对应一个需求变化：用户要的是可预测的任务结果和完成时间，不只是更便宜的 token。模型外的工具与执行环境，也成为平台需要提供的能力。"},{"type":"heading","text":"扩建的难点在同时解决多个约束"},{"type":"paragraph","text":"Danila 表示，即使机房由第三方提供，内部网络、服务器和软件栈仍按统一规范建设。外部资本参与并不意味着可以随意采用陌生硬件，否则难以保证服务水平。"},{"type":"paragraph","text":"GPU、CPU、存储、电力、变压器、光模块和施工人员都可能成为限制。他将竞争力归结为协调这些约束的执行能力：调整部署次序、在设施之间重新分配资源，并持续处理变化。只把短缺归因于一个组件，难以解释真实交付过程。"},{"type":"heading","text":"大型云迟早会更认真地竞争"},{"type":"paragraph","text":"Danila 认为，大型云当前既受芯片供给限制，也要权衡改造既有网络与存储架构的投入。公开报价不能代表大型合同的真实价格，现有巨头已经具有竞争力。"},{"type":"paragraph","text":"如果供给增加、AI 业务占比扩大，它们可能投入更多资源。Nebius 的押注是赶在这个阶段前扩大规模。与此同时，他认为市场足够大，仍可能容纳区域供应商和专门产品；平台打包销售的优势，不等于所有独立服务都将消失。这些是他的市场判断。"},{"type":"heading","text":"对内部编码 agent 保持明确责任"},{"type":"paragraph","text":"团队允许较广泛的 AI 工具使用，不按个人简单限制 token，但关注低效使用和低质量产出。无论代码如何生成，提交者仍对结果、合并请求和后续值班负责；完全自主生成的内容要标识，核心服务暂不交给完全自主 agent 操作。"},{"type":"paragraph","text":"访谈最后，他将注意力转向结果可靠性：改变工具、执行框架和质量检查，有时比换一个更大模型更关键。部分任务会长时间运行普通代码而不调用模型，因此 CPU、工具链与模型之外的优化循环，也会影响 AI 应用最终能否稳定完成工作。"}]}]},"sources":{"podcasts":[{"title":"Ep 96: Nebius CTO on Racing the Hyperscalers Before AWS Wakes Up","name":"Unsupervised Learning","publishedAt":"2026-11-02T13:54:35.000Z","url":"https://www.youtube.com/@RedpointAI","excerpts":["If NVIDIA could have bought... Like, could have produced, like, 10 x the chips, this whole market would have been shaped differently. Yeah. Because there is not enough capacity for their scale, this is a relatively small business for them. For the hyperscalers, it's not just a matter of, like, sales.","It's also a matter of changing the infrastructure that was built at scale for other kinds of workloads. This is a massive investment on their part that needs to be justified by the size of a potential business, and it's not that there yet.","The emergence of Nebius and the other hyperscaler competitors these past years has been a fascinating part of the AI story. It's something I've really been interested in, and so it was a lot of fun to have Nebius' CTO, Neela, on the podcast because we're able to dig into a bunch of interesting things about the business and how the space has unfolded. We tal…"]}],"blogs":[],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @cognition - @temporalio - @aidotengineer - @latentspacepod","tweets":[{"text":"As part of the most insane AIE lineup to end 2026, we're also excited to announce our final track theme: *Raising your Ambition* featuring @jxnlco, @trq212, @jarredsumner, @sqs, @mitsuhiko, @dexhorthy, @BuiltByJustin (StrongDM Dark Factory) and a special keynote from @echelon in his first big appearance since cloning the entire Adobe suite last month... and talking about how and what's next! gathering 1000 of the top agentic engineers in person in SF and livestreamed to 2M MAU online on youtube. join here: <- see you in SF!","createdAt":"2026-11-03T18:03:50.000Z","url":"https://x.com/swyx/status/2117679157035602065","likes":83,"retweets":7,"replies":41},{"text":"btw here's @addyosmani how anthropic yolos 30k code changes a day in a dark factory approach, with @kapmani of @SonarSource giving more research on why every loop needs independent verification already one of the top talks of AIE NYC! (Sonar is both a sponsor and super relevant for the aie nyc focus on finance)","createdAt":"2026-11-03T10:03:37.000Z","url":"https://x.com/swyx/status/2117558305891746212","likes":17,"retweets":0,"replies":31}]},{"name":"Boris Cherny","handle":"bcherny","bio":"Claude @anthropicai","tweets":[{"text":"Signing in to your company's plugins one by one is annoying, so we let Claude auto-connect to them now. Team and Enterprise admins can set them up, and teammates are connected automatically the first time they use the plugins.","createdAt":"2026-11-03T18:59:33.000Z","url":"https://x.com/bcherny/status/2117693181651542387","likes":1941,"retweets":68,"replies":171}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Things will change again and again and again. We’re still very early and agents today are incredible, and yet so frustrating still. Can’t wait to crack things to get that flow state back. Long journey ahead.","createdAt":"2026-11-03T22:31:18.000Z","url":"https://x.com/thsottiaux/status/2117746467058405665","likes":8425,"retweets":192,"replies":1340}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"Remember when leaving a company before 2-3 years made you look like a job hopper? It feels increasingly normal to see very talented people leave AI-native companies after 1-2 years or less. People leave for all kinds of reasons. But I do wonder how sustainable these jobs are, especially for parents.","createdAt":"2026-11-04T03:47:15.000Z","url":"https://x.com/petergyang/status/2117825980115067035","likes":74,"retweets":1,"replies":
