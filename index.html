F culture is “gatekeeping” and how it all comes down to who you know.. While that’s definitely true in pockets, what’s made SF great is how open even extremely smart/accomplished people are to meet for coffee. And how willing people are to open doors for you even when they’ve just met you. I benefitted from this again and again when I first moved here, and I still benefit from it even as I’ve been here for 10+ years. SF is probably the only place where when you quit your job people say congratulations, and immediately jump into asking what’s next and try to help you. With any given hype cycle, I’m sure this wanes to a certain degree. And a lot o…","createdAt":"2026-10-02T02:47:01.000Z","url":"https://x.com/nikunj/status/2105852023510118878","likes":108,"retweets":2,"replies":13}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"holy","createdAt":"2026-10-01T23:40:49.000Z","url":"https://x.com/steipete/status/2105805164305359019","likes":1016,"retweets":28,"replies":27},{"text":"\"Today, we’re releasing two Cloudflare-trained decision models, Clef and Clef-flash\" Never seen an idea spreading so fast.","createdAt":"2026-10-01T21:52:56.000Z","url":"https://x.com/steipete/status/2105778011635400949","likes":1377,"retweets":112,"replies":69},{"text":"\"AI agents are aeroplanes for the mind: faster and more powerful than the bicycle, harder to control, costlier when they crash.\"","createdAt":"2026-10-01T21:35:10.000Z","url":"https://x.com/steipete/status/2105773541652308145","likes":45,"retweets":6,"replies":11}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"we published a sick guide to getting started with open models on @every:","createdAt":"2026-10-02T00:04:52.000Z","url":"https://x.com/danshipper/status/2105811214827696302","likes":49,"retweets":8,"replies":6},{"text":"we (@hammer_mt) used Jev to ingest every time i took a position on something in @every's slack then he measured how often i contradict myself: 0% honestly super proud of this lol","createdAt":"2026-10-01T18:34:12.000Z","url":"https://x.com/danshipper/status/2105728002487353520","likes":37,"retweets":0,"replies":7},{"text":"so @hammer_mt has been trying to automate me. apparently i only agree 34% of the time when im asked for my opinion or given options and that's one of the reasons the models don't do well pretending to be me food for thought!","createdAt":"2026-10-01T17:08:29.000Z","url":"https://x.com/danshipper/status/2105706430384710075","likes":14,"retweets":1,"replies":11}]},{"name":"Sam Altman","handle":"sama","bio":"The mission of OpenAI is to ensure that AGI benefits all of humanity","tweets":[{"text":"You should be able to use your AI subscription wherever you need:","createdAt":"2026-10-01T19:18:18.000Z","url":"https://x.com/sama/status/2105739098640298253","likes":3573,"retweets":124,"replies":393},{"text":"Also, 6.1 Sol was our fastest-growing model ever, and was a bit slow under load. Should be much better now!","createdAt":"2026-10-01T15:56:40.000Z","url":"https://x.com/sama/status/2105688354834756036","likes":10365,"retweets":289,"replies":818},{"text":"I think there is much more potential energy in Sign In With ChatGPT/Plugin Extensions than we realize","createdAt":"2026-10-01T15:54:57.000Z","url":"https://x.com/sama/status/2105687922234237364","likes":1181,"retweets":45,"replies":159}]},{"name":"Claude","handle":"claudeai","bio":"Claude is an AI assistant built by @anthropicai to be safe, accurate, and secure. Talk to Claude on or download the app.","tweets":[{"text":"Applies automatically each time you create a design, deck, or doc, and runs through October 15 on Pro, Max, and Team plans. How it works and full terms:","createdAt":"2026-10-01T18:08:54.000Z","url":"https://x.com/claudeai/status/2105721631595209057","likes":254,"retweets":4,"replies":10},{"text":"For two weeks, start a design, deck, or doc in the Claude app, and the work that follows in that conversation uses 50% less of your usage limits. Give it a try with Claude Sonnet 5.5. It has a strong eye for design and builds slides that need minimal editing.","createdAt":"2026-10-01T18:08:53.000Z","url":"https://x.com/claudeai/status/2105721630051692804","likes":6667,"retweets":339,"replies":217}]}]},"errors":[],"partial":false},{"date":"2026-10-02","dateLabel":"2026年10月02日","generatedAt":"2026-10-02T00:00:00+08:00","sourceGeneratedAt":"2026-10-01T06:46:31.245Z","stats":{"podcastEpisodes":1,"xBuilders":17,"totalTweets":34,"blogPosts":0},"highlights":[{"tag":"企业落地","title":"企业 Agent 的交付物不再是软件，而是持续运行的工作系统","body":"当产品开始直接承担流程中的产出，部署就不能在上线时结束：数据权限、人工复核、评测和模型升级都会持续改变结果质量。由此形成的机会不只属于模型或应用厂商，也属于能把组织流程重新拆解、建立责任边界并长期维护的人；服务能力会成为 Agent 进入企业的关键分发层。","evidence":[{"quote":"With AI agents, you're delivering actual work augmentation to the organization, which has a completely different set of complexities associated with it.","attribution":"Aaron Levie，Box CEO","url":"https://x.com/levie/status/2105354449795621179"}]},{"tag":"基础设施","title":"代码成本下降后，身份与连接会成为 Agent 开发的新主战场","body":"Agent 能快速生成应用，并不意味着它能安全进入真实业务。每接入一个外部服务，都要处理凭证分发、权限范围和撤销机制；如果这些问题仍由开发者手工拼装，生成代码带来的速度会被集成风险抵消。下一层平台价值因此会从“帮你写”转向“让生成物可信地连上现实系统”。","evidence":[{"quote":"With code now being 'free', the final boss of building is connecting to stuff.","attribution":"Guillermo Rauch，Vercel CEO","url":"https://x.com/rauchg/status/2105390544096841942"}]},{"tag":"产品质量","title":"原型生成越容易，专业判断越早成为成品的分水岭","body":"AI 可以迅速把一个想法推到可见、可玩的阶段，但这种速度也更快暴露角色、动效和控制方案之间的不协调。产品团队不能把“生成出来”误当成“已经完成”；更有效的分工是让 AI 扩大方案搜索面，再让有领域经验的人选择、校准并完成多轮收敛。","evidence":[{"quote":"The animations, design, etc. are fine but someone with expertise could help make it much better.","attribution":"Thariq，Claude Code 团队","url":"https://x.com/trq212/status/2105333509246386546"},{"quote":"To make a real game I'd probably go through 3-4 variations of this character, and have maybe 8-10 characters in the game.","attribution":"Thariq，Claude Code 团队","url":"https://x.com/trq212/status/2105333507711271060"}]},{"tag":"多 Agent","title":"多 Agent 的差异化正从调度方式，延伸到协作过程如何被人理解","body":"让多个 Agent 以同级关系自行协商，可以减少人类预先设计任务树的负担，却也会产生大量机器间对话。真正可用的协作产品必须同时解决自治与可读性：系统内部保留完整协调过程，界面默认只呈现状态和关键决策，并允许用户在需要追责时展开细节。","evidence":[{"quote":"agent swarms speak to one another as peers and self coordinate allowing you to organically explore the space instead of pre-arrange it","attribution":"Garry Tan，Y Combinator CEO","url":"https://x.com/garrytan/status/2105449821645480046"},{"quote":"Changed the visibility in the OC harness to just a single line that can be expanded.","attribution":"Peter Steinberger，OpenClaw Builder","url":"https://x.com/steipete/status/2105362785534361996"}]},{"tag":"生产力经济","title":"AI 提升供给后，需求扩张会把更高标准重新压回开发者","body":"工程效率提升并不会自动减少工作量，因为用户会迅速把新增产能转化为更多、更复杂的期待。团队的瓶颈会从代码产出迁移到选题、质量与取舍：能够更快构建只是入场券，持续判断什么值得构建、什么水平才算完成，才决定生产力红利能否沉淀为优势。","evidence":[{"quote":"developers, they've never been able to do more, but there's never been a higher bar either.","attribution":"Sam Altman，Every Podcast 访谈","url":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL"}]}],"matters":[{"kind":"开发平台","title":"ChatGPT 开放 MCP Server 的构建、部署与访问控制","detail":"Thibault Sottiaux 表示，开发者现在可直接通过 ChatGPT 构建和部署 MCP Server，并选择限定访问者或公开分享。","url":"https://x.com/thsottiaux/status/2105519215092584786"},{"kind":"产品迁移","title":"Google 将 Opal 的实验经验收敛进 Gemini Skills","detail":"Google Labs 宣布 Gemini Skills 全球推出，并计划于 2026 年 11 月 17 日关闭 Opal，将可定制工作流转入主产品。","url":"https://x.com/GoogleLabs/status/2105352889665564838"},{"kind":"硬件协作","title":"硬件工程开始复制软件版本协作的组织方式","detail":"Swyx 认为 Flow 正把类似 Git 与 GitHub 的协同机制带入汽车、火箭等复杂且不可逆的硬件流程。","url":"https://x.com/swyx/status/2105348724331606411"},{"kind":"公共系统","title":"航空调度的 AI 价值先来自预测辅助，而非替代控制员","detail":"Garry Tan 转述美国交通部长介绍的 SMART 系统：它提前预测天气与航路冲突，但最终决策仍由空管员作出。","url":"https://x.com/garrytan/status/2105395957357588561"},{"kind":"工作边界","title":"自动化之后，投资工作剩下的是关系与高判断密度环节","detail":"Nikunj Kothari 表示自己已自动化大部分工作，但项目挖掘与外联、线下见创始人及亲手写拒绝说明仍未被替代。","url":"https://x.com/nikunj/status/2105532229866942772"}],"sources":{"podcasts":[{"title":"How Sam Altman Uses Dots to Take Back His Time","name":"AI & I by Every","publishedAt":"2026-09-30T20:05:56.000Z","url":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL","excerpts":["You know, seven people's dots can, working together, create something new that kind of existed in all of our heads to some degree, but was like an emergent thing.","I think if you had told me four years ago that the coding models were at this level of capability, I would have been like, wow, I don't know if there would be a lot of developers at Dev Day.","but there's more developers than ever, it seems like, and more work to do than ever."]}],"blogs":[],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"is it normal to crop out other people's logo and not attribute to a simple youtube video or how does this work in professional tech media","createdAt":"2026-10-01T06:01:26.000Z","url":"https://x.com/swyx/status/2105538561672085751","likes":93,"retweets":0,"replies":20},{"text":"i genuinely dont do anything to optimize for apple podcasts (and actively hate spotify) so being on the top podcast list here among some industry legends and even beating @MKBHD is pretty fkin nuts","createdAt":"2026-09-30T22:08:17.000Z","url":"https://x.com/swyx/status/2105419486383964544","likes":5,"retweets":0,"replies":4},{"text":"Flow is doing for hardware engineering what Git+GitHub did for software engineering. It's enabled so much acceleration due to aligning thousands of stakeholders for complex, irreversible, high value pipelines from cars to rockets. You cannot go back to spreadsheet_final_FINAL_v23 once you've been in Flow. proud to be a friend first, and smol investor second.","createdAt":"2026-09-30T17:27:06.000Z","url":"https://x.com/swyx/status/2105348724331606411","likes":67,"retweets":2,"replies":45}]},{"name":"Josh Woodward","handle":"joshwoodward","bio":"VP, @Google @GoogleLabs @GeminiApp @GoogleAIStudio","tweets":[{"text":"Gemini 4 Argon!","createdAt":"2026-09-30T20:36:10.000Z","url":"https://x.com/joshwoodward/status/2105396307250782446","likes":1319,"retweets":59,"replies":38}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"One more thing, you can now build and deploy MCP servers right through ChatGPT. And restrict its access to anyone you want or share it with the world.","createdAt":"2026-10-01T04:44:34.000Z","url":"https://x.com/thsottiaux/status/2105519215092584786","likes":2082,"retweets":126,"replies":194},{"text":"GPT-6.1 Sol is our most demanded model pretty much ever both across both the API and subscriptions. Within ChatGPT & Codex, we were under heavy load, but have brough more capacity online and the speed should get much better in the coming hours, reaching almost twice the speed compared to what we served yesterday.","createdAt":"2026-10-01T01:06:15.000Z","url":"https://x.com/thsottiaux/status/2105464274747527543","likes":8735,"retweets":358,"replies":1025},{"text":"Asked my dot to paint me. After sending me something cartoonish, I asked it to try a bit harder and to find a recent picture of me on the internet. It did better. Below video is me clicking through my dot's computer.","createdAt":"2026-09-30T20:31:46.000Z","url":"https://x.com/thsottiaux/status/2105395200248156556","likes":2284,"retweets":42,"replies":381}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"People I met at DevDay: I love your channel! Thank you! People in YouTube comments: Fing AI shill 🥲","createdAt":"2026-10-01T02:36:13.000Z","url":"https://x.com/petergyang/status/2105486915147645063","likes":48,"retweets":0,"replies":16},{"text":"This is getting nuclear 🌶️","createdAt":"2026-09-30T22:40:40.000Z","url":"https://x.com/petergyang/status/2105427638236180883","likes":99,"retweets":2,"replies":3},{"text":"Google cooked on Gemini 4! Now they just need to be more competitive on coding harness (Antigravity) + personal agent (Spark).","createdAt":"2026-09-30T20:23:59.000Z","url":"https://x.com/petergyang/status/2105393240392585359","likes":171,"retweets":5,"replies":42}]},{"name":"Nan Yu","handle":"thenanyu","bio":"product, codex @openai. prev head of product @linear","tweets":[{"text":"It’s interesting to contrast, what different companies take for granted in their internal cultures I’ve only been at OpenAI for about a week, and the thing that stands out is absurdly high bias towards action This shows up in ways big and small… Sometimes you have a casual discussion about a possible feature, and the PR is sitting in front of you by the time you get back to your desk Or you meet someone on Slack and say: “let’s grab lunch next week” and the meeting invites on your calendar within the next five minutes This has its downsides. because it often feels like everything’s behind a hair trigger, and things just change out from under you— but you can’t really teach this energy, and…","createdAt":"2026-09-30T15:20:03.000Z","url":"https://x.com/thenanyu/status/2105316751802348005","likes":180,"retweets":0,"replies":11}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"While prototypes are fun, I think ideally I'd work on this with a small group of 2-3 people. The animations, design, etc. are fine but someone with expertise could help make it much better.","createdAt":"2026-09-30T16:26:38.000Z","url":"https://x.com/trq212/status/2105333509246386546","likes":103,"retweets":0,"replies":14},{"text":"This all prototype quality. The graphics and feel are not high quality enough for you to play. To make a real game I'd probably go through 3-4 variations of this character, and have maybe 8-10 characters in the game.","createdAt":"2026-09-30T16:26:38.000Z","url":"https://x.com/trq212/status/2105333507711271060","likes":73,"retweets":0,"replies":2},{"text":"I want this character to have a big jump, but so far I haven't been able to fit into the control scheme in a way I like. I've tried maybe 2-3 variations.","createdAt":"2026-09-30T16:26:37.000Z","url":"https://x.com/trq212/status/2105333506226503710","likes":55,"retweets":0,"replies":4}]},{"name":"Google Labs","handle":"GoogleLabs","bio":"Google’s home for our latest AI tools and experiments.","tweets":[{"text":"💠 Opal shines on in Skills! 💠 When we launched Opal in Google Labs, it was an experiment to learn how you customize your workflows. Your incredible creativity taught us so much — first inspiring Gems made by Labs, and today, supporting the global launch of skills in @GeminiApp! ✨ Skills are a faster way to automate repetitive tasks and save custom instructions right in chat - built from the learnings we had from Opal. As skills roll out globally, we will be saying a bittersweet farewell to Opal. The experiment will be shutting down on Nov 17, 2026. Whether you built mini-apps on or tried Gems in Gemini, thank you for shaping the future of customizable AI. Opal lives on in every skill you…","createdAt":"2026-09-30T17:43:39.000Z","url":"https://x.com/GoogleLabs/status/2105352889665564838","likes":312,"retweets":19,"replies":9}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Make and one-click publish Meta VR apps.","createdAt":"2026-09-30T15:37:22.000Z","url":"https://x.com/amasad/status/2105321112389443805","likes":137,"retweets":10,"replies":33}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Most token aggregators have extreme noise from ① token promos from/to providers that train on your data or ② providers that *claim* to be ZDR. Vercel AI Gateway is the largest trustworthy datasource to understand global AI token flows, because we have real usage, from real customers, an at-scale platform (400k+ paying customers and thousands of enterprises), and zero markup. Notably… every week we turn down \"free token\" promos from companies that come to us with dubious claims of Zero Data Retention (ZDR) and questionable reputations. We also don't get a kick out of having the \"most providers\". Most providers suck. You want the *best* providers. We put in as much work in engineering our gat…","createdAt":"2026-10-01T01:55:11.000Z","url":"https://x.com/rauchg/status/2105476587756138942","likes":132,"retweets":4,"replies":35},{"text":"If you run a service and want to get in front of 20M+ developers and the billions of agents they'll ship, add yourself to Connect. With code now being 'free', the final boss of building is connecting to stuff. Connect is both easier and more secure¹. For agents and for apps. ¹ The world of building agents is plagued with static credentials. You're supposed to give a bunch of keys to each agent or app you build. It's DX hell, but it's also a massive liability. Connect fixes this.","createdAt":"2026-09-30T20:13:16.000Z","url":"https://x.com/rauchg/status/2105390544096841942","likes":441,"retweets":20,"replies":51},{"text":"Faster","createdAt":"2026-09-30T13:16:37.000Z","url":"https://x.com/rauchg/status/2105285688820400259","likes":137,"retweets":4,"replies":21}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"There's a huge opportunity right now in being the deployment layer for AI into the economy. The amount of work it takes to change out workflows in enterprises tends to be far greater than anyone realizes or would prefer. Clearly this is what the applied layer of AI is going to look like in the form of software and agents, but also it opens up new services firms opportunities. Legacy systems need to be moved to the cloud, data organization and access needs to be updated, software needs to be connected to agents in new ways, workflows need to be reengineered for agents, HITL needs to be figured out for the process, evals need to be generated and maintained, and the entire system needs to be c…","createdAt":"2026-09-30T17:49:51.000Z","url":"https://x.com/levie/status/2105354449795621179","likes":853,"retweets":90,"replies":79}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"*chefs kiss*","createdAt":"2026-10-01T01:38:01.000Z","url":"https://x.com/garrytan/status/2105472268482875898","likes":242,"retweets":3,"replies":13},{"text":"Other code editors let you top down coordinate child agents I’ve never really seen this where agent swarms speak to one another as peers and self coordinate allowing you to organically explore the space instead of pre-arrange it, have you? Capy is special","createdAt":"2026-10-01T00:08:49.000Z","url":"https://x.com/garrytan/status/2105449821645480046","likes":125,"retweets":11,"replies":35},{"text":"I asked Secretary Duffy what Americans should be able to do, if we get this decade right, that they can't do today. Sean Duffy is the Secretary of Transportation, and he sat down with me at our Startup Industrial Base event in DC today. He went straight to how our country's air traffic gets managed. At the command center, people sit in front of six screens with a paper flight chart above them, trying to make the calls on weather and routing. His example: four planes reach the same runway at the same time and only one can land. See it two hours out, speed up two, slow one down, and each one lands when the runway is open. \"Like, not complicated stuff, but we don't do any of this.\" Paper and p…","createdAt":"2026-09-30T20:34:47.000Z","url":"https://x.com/garrytan/status/2105395957357588561","likes":117,"retweets":15,"replies":17}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"SaaS companies seeing Anthropic’s ARR growth flatline","createdAt":"2026-09-30T11:39:21.000Z","url":"https://x.com/mattturck/status/2105261211906384132","likes":549,"retweets":11,"replies":22}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"I have automated most of my job away except the following.. a) sourcing and writing outbound emails (convinced no amount of tech helps here) b) meeting founders (primarily in person, zoom sucks) c) writing pass notes/calls (still write every single one by hand & frankly the hardest part of the job) (and no I don't have an EA or ever intend to hire one.. might be famous last words)","createdAt":"2026-10-01T05:36:17.000Z","url":"https://x.com/nikunj/status/2105532229866942772","likes":51,"retweets":0,"replies":8},{"text":"Still looking for this.. If you are building an insanely good multiplayer experience, please DM or reply here with a demo!","createdAt":"2026-09-30T20:41:32.000Z","url":"https://x.com/nikunj/status/2105397656994652178","likes":68,"retweets":1,"replies":36}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"I'm finding inter-agent communication in the chat stream increasingly irritating. Changed the visibility in the OC harness to just a single line that can be expanded. Pretty sure others will follow.","createdAt":"2026-09-30T18:22:58.000Z","url":"https://x.com/steipete/status/2105362785534361996","likes":229,"retweets":7,"replies":50},{"text":"It’s a fierce fight between CI and GitHub on what slows me down. Time to rethink how we work. (love GH tho and fully see their struggles!)","createdAt":"2026-09-30T16:57:33.000Z","url":"https://x.com/steipete/status/2105341288958869952","likes":370,"retweets":6,"replies":88}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"we will be ready to vibe check!","createdAt":"2026-09-30T23:45:27.000Z","url":"https://x.com/danshipper/status/2105443942330503416","likes":12,"retweets":0,"replies":1},{"text":"read it on @every:","createdAt":"2026-09-30T20:46:53.000Z","url":"https://x.com/danshipper/status/2105399004649689347","likes":10,"retweets":2,"replies":1},{"text":"Okay i thought this model was already out phew. @sundarpichai would love to vibe check it","createdAt":"2026-09-30T20:17:55.000Z","url":"https://x.com/danshipper/status/2105391711950393423","likes":15,"retweets":0,"replies":2}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"The question I keep on asking everyone @spc is \"What is the maximalist version of this company?\". Perhaps this has always been true....but if you are building a company today, then the only way is to have the boldest, most audacious and maximalist version of the idea and how it can change the arc of the future. If you start small, you will struggle to get funding, hire great people and ultimately to make a dent in the future. This is the paradox of AI. It makes building easier but dramatically raises the floor on what it means to be a great startup.","createdAt":"2026-09-30T16:50:43.000Z","url":"https://x.com/adityaag/status/2105339569139056776","likes":28,"retweets":2,"replies":7}]},{"name":"Claude","handle":"claudeai","bio":"Claude is an AI assistant built by @anthropicai to be safe, accurate, and secure. Talk to Claude on or download the app.","tweets":[{"text":"Register for San Francisco: Register for Stockholm:","createdAt":"2026-09-30T18:54:21.000Z","url":"https://x.com/claudeai/status/2105370681613672773","likes":74,"retweets":1,"replies":15},{"text":"Claude Founder House is coming to SF Tech Week (Oct 6–8) and Stockholm (Oct 14). Come for talks, workshops, and office hours with our team, plus time to meet others building with Claude. Whether you're a founder, a CEO, or a builder, there's a session for you.","createdAt":"2026-09-30T18:54:20.000Z","url":"https://x.com/claudeai/status/2105370680485417401","likes":2434,"retweets":129,"replies":147}]}]},"errors":[],"partial":false},{"date":"2026-10-01","dateLabel":"2026年10月01日","generatedAt":"2026-10-01T00:00:00+08:00","sourceGeneratedAt":"2026-09-30T06:45:24.816Z","stats":{"podcastEpisodes":0,"xBuilders":14,"totalTweets":32,"blogPosts":1},"highlights":[{"tag":"Agent 产品","title":"常驻型 Agent 的冷启动资产不是技能列表，而是对用户的持续理解","body":"当 AI 从一次性对话变成全天候代办者，决定体验上限的会是它能否积累偏好、关注事项与委托边界。先让单个 Agent 在真实使用中形成稳定的个人上下文，再扩展为多 Agent 团队，可以减少错误被并行放大的风险；产品竞争也会从首次演示效果，转向几天使用后是否明显更贴合用户。","evidence":[{"quote":"A new way to use AI that works 24/7 for you; get more of your time and attention back to work at a higher level.","attribution":"Sam Altman，OpenAI CEO","url":"https://x.com/sama/status/2104995014208258235"},{"quote":"Personally I felt a jump after 2-3 days of use after teaching it more about my preferences and things on my mind.","attribution":"Thibault Sottiaux，OpenAI Codex 与 ChatGPT 团队","url":"https://x.com/thsottiaux/status/2105105086506840421"}]},{"tag":"竞争壁垒","title":"模型趋同时，产品护城河会碎成上千个不可见的小决策","body":"前沿能力可以通过更好的执行框架以更低成本被逼近，这会削弱单纯依赖模型领先的优势。但 harness 也不是一个可复制的功能点，而是产品、工程和商业动作长期叠加出的系统：每个改进都不显眼，组合起来却决定任务成功率。创业团队真正需要经营的，是快速发现这些细节并持续重组它们的能力。","evidence":[{"quote":"How to design and build a harness to reach frontier performance at a fraction of the cost!","attribution":"Amjad Masad，Replit CEO","url":"https://x.com/amasad/status/2104996638817386820"},{"quote":"the harness is like a thousand small things done well. And, a lot of it is invisible.","attribution":"Nikunj Kothari，FPV Ventures 合伙人","url":"https://x.com/nikunj/status/2105148927599423752"}]},{"tag":"浏览器 Agent","title":"浏览器 Agent 要取消逐步确认，必须先把安全判断产品化","body":"让 Agent 操作没有 API 的后台和旧系统，价值恰恰来自减少人工确认；但网页内容同时也是潜在攻击入口。可行路径不是在便利与安全之间二选一，而是把内容探测、意图比对和动作拦截放进每次执行链路，让低风险操作自动通过、偏离原始请求的动作被阻止。安全层因此不再是发布前检查，而是自治体验本身的组成部分。","evidence":[{"quote":"Claude can now also take actions autonomously in the browser, instead of needing approval for every one.","attribution":"Claude Blog","url":"https://claude.com/blog/claude-in-chrome-generally-available"}]},{"tag":"创作工作流","title":"生成式创作的门槛正从制作素材，迁移到编排整条叙事链","body":"当音乐、三维资产和图像都能在同一任务中被模型调用，单人可以直接交付过去需要多工种协作的营销页面。稀缺能力随之从会不会操作某个生成工具，转向能否用少量迭代定义统一风格、安排媒介分工并让最终体验连贯；创作者的角色更接近导演和系统编排者。","evidence":[{"quote":"The whole thing was done by Opus 5.5 (6 prompts)","attribution":"Zara Zhang，独立 Builder","url":"https://x.com/zarazhangrui/status/2105096296831017078"}]}],"matters":[{"kind":"开发生态","title":"AI SDK 周下载量达到 3000 万","detail":"Guillermo Rauch 公布 AI SDK 达到每周 3000 万次下载，并用生成式视频工具制作了里程碑回顾。","url":"https://x.com/rauchg/status/2105043144975011982"},{"kind":"行业治理","title":"AI 安全标准正在被视为竞争前的共享底座","detail":"Aaron Levie 认为现阶段行业仍可通过共同标准与实践处理安全问题，同时保留市场竞争。","url":"https://x.com/levie/status/2105111520913039530"},{"kind":"工程治理","title":"测试膨胀开始由 Agent 反向审计","detail":"Garry Tan 将 OpenClaw 的 test-audit skill 合入 GStack，用智能审计处理测试数量增长带来的维护负担。","url":"https://x.com/garrytan/status/2105049005147525231"},{"kind":"模型定价","title":"新模型同时压低标价与缓存读取成本","detail":"Sam Altman 宣布 6.1 Sol 的价格为 Astra 的五分之一，并提供 95% 的缓存读取折扣。","url":"https://x.com/sama/status/2104994395980533804"},{"kind":"内容分发","title":"跨平台信息时差正在变成低成本获客窗口","detail":"Nikunj Kothari 建议 B2B 创业者把 X 上的趋势整理到 LinkedIn，利用后者一到两周的信息滞后降低获客成本。","url":"https://x.com/nikunj/status/2104949147812159672"}],"sources":{"podcasts":[],"blogs":[{"title":"Claude in Chrome is generally available ","source":"blog","publishedAt":"Aug 26, 2026","url":"https://claude.com/blog/claude-in-chrome-generally-available","summary":""}],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"annual ranking of best ai podcasts just dropped","createdAt":"2026-09-29T22:09:26.000Z","url":"https://x.com/swyx/status/2105057391490498660","likes":58,"retweets":2,"replies":15},{"text":"for friends of @latentspacepod we are gonna be asking all your burning Dots, Sol 6.1, CUA, and Decisions API questions for @AriX and @nikunjhanda 🔜 at the gateway pavilion on a few mins, come by!","createdAt":"2026-09-29T18:24:19.000Z","url":"https://x.com/swyx/status/2105000738745376769","likes":72,"retweets":2,"replies":26},{"text":"i have the best reply guys","createdAt":"2026-09-29T17:20:06.000Z","url":"https://x.com/swyx/status/2104984576703844750","likes":3,"retweets":0,"replies":1}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"What’s up dot","createdAt":"2026-09-30T06:12:30.000Z","url":"https://x.com/thsottiaux/status/2105178959327756396","likes":857,"retweets":29,"replies":606},{"text":"We will have a few million dots online within days, working on all sorts of things across such a diverse and large community. Excited to learn from all of you on what you love and what doesn’t yet feel magical. Personally I felt a jump after 2-3 days of use after teaching it more about my preferences and things on my mind. It learns very quickly to be most useful and it can take on surprisingly ambitious tasks on its own. We’re learning from how you all use your primary dot before releasing the ability to create an entire team of them.","createdAt":"2026-09-30T01:18:58.000Z","url":"https://x.com/thsottiaux/status/2105105086506840421","likes":3634,"retweets":95,"replies":933},{"text":"It was so nice to connect with so many of you in person at DevDay. Immaculate vibes from the crowd and fun to see so many build things throughout the day.","createdAt":"2026-09-30T01:09:58.000Z","url":"https://x.com/thsottiaux/status/2105102820706058498","likes":1891,"retweets":38,"replies":219}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"Wow I had no idea this toggle exists Going to try this now I hate the ai slop shorts on YouTube","createdAt":"2026-09-30T02:48:03.000Z","url":"https://x.com/petergyang/status/2105127506701644024","likes":128,"retweets":4,"replies":10},{"text":"I had so much fun at @OpenAI Dev Day despite not attending a single session other than the keynotes 😅 Instead, I spent the day catching up with some great folks, so I'm going to embarass some of them now: 1. @lennysan the nicest most humble successful person I've had the pleasure of being friends with 2. @bb_fresh the comedy legend, search \"krazam microservices\" on YouTube for a laugh. My dream is to appear in one of Ben's sketches as the PM. 3. @danshipper the vibe checks are legendary 4. @bentossell the tall Welsh gentleman in pink - has an amazing newsletter in Ben's Bites 5. @thenanyu the man who brings taste and craft to everything he touches from Linear to OpenAI 6. @illscience my fa…","createdAt":"2026-09-30T01:58:15.000Z","url":"https://x.com/petergyang/status/2105114973819244676","likes":138,"retweets":0,"replies":15},{"text":"@nealmohan how about letting users (or at least parents) opt out of shorts entirely","createdAt":"2026-09-30T00:47:07.000Z","url":"https://x.com/petergyang/status/2105097073448407083","likes":5,"retweets":0,"replies":1}]},{"name":"Nan Yu","handle":"thenanyu","bio":"product, codex @openai. prev head of product @linear","tweets":[{"text":"New benchmark to climb","createdAt":"2026-09-30T04:35:32.000Z","url":"https://x.com/thenanyu/status/2105154553327026643","likes":7,"retweets":0,"replies":0},{"text":"","createdAt":"2026-09-29T21:39:20.000Z","url":"https://x.com/thenanyu/status/2105049816388755620","likes":20,"retweets":0,"replies":1}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"from our blog post on how we made Claude faster:","createdAt":"2026-09-29T22:40:22.000Z","url":"https://x.com/trq212/status/2105065175711924492","likes":124,"retweets":6,"replies":7},{"text":"have you tried telling Claude \"we have the power to do anything, please be braver\" also, have you tried telling yourself","createdAt":"2026-09-29T22:40:11.000Z","url":"https://x.com/trq212/status/2105065127892734076","likes":2450,"retweets":88,"replies":123},{"text":"See it here:","createdAt":"2026-09-29T17:14:00.000Z","url":"https://x.com/trq212/status/2104983042536460435","likes":12,"retweets":0,"replies":0}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"How to design and build a harness to reach frontier performance at a fraction of the cost!","createdAt":"2026-09-29T18:08:02.000Z","url":"https://x.com/amasad/status/2104996638817386820","likes":512,"retweets":29,"replies":65}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Plotted: the inverse correlation between product defects and downloads. h/t @anthonysheww","createdAt":"2026-09-29T21:55:39.000Z","url":"https://x.com/rauchg/status/2105053919642829001","likes":18,"retweets":1,"replies":4},{"text":"AI SDK has hit 30M weekly downloads. One-shotted this video in fframes + + opus. I asked 𝚏𝚡 to look at and highlight the 5M/10M/20M/30M milestones. Yes, this video was written in Rust and rendered on the GPU. h/t @neogoose_btw","createdAt":"2026-09-29T21:12:50.000Z","url":"https://x.com/rauchg/status/2105043144975011982","likes":299,"retweets":12,"replies":29},{"text":"You can just ship things (and wallow in cartographic filigree)","createdAt":"2026-09-29T19:09:46.000Z","url":"https://x.com/rauchg/status/2105012176952164777","likes":61,"retweets":0,"replies":13}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"It’s entirely plausible that the AI industry can deal with safety and security through a set of shared standards and practices for the foreseeable future. At some point in capability progress there will inevitably be greater oversight, testing, and layers of liability and regulation, but we are still in a phase where the industry can absolutely align on these efforts collectively. Awesome to see this come together so quickly and for the whole industry to support progress without reducing competition. This certainly points to a much brighter future for AI.","createdAt":"2026-09-30T01:44:32.000Z","url":"https://x.com/levie/status/2105111520913039530","likes":91,"retweets":8,"replies":19}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Just merged a version of OpenClaw’s test-audit skill into GStack. Test bloat is a real problem. Luckily intelligence is on tap these days!","createdAt":"2026-09-29T21:36:07.000Z","url":"https://x.com/garrytan/status/2105049005147525231","likes":146,"retweets":7,"replies":36}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Make something people want, then make people want it. Harvard’17. GitHub: YouTube:","tweets":[{"text":"I made a marketing website for my water bottle The whole thing was done by Opus 5.5 (6 prompts); it used: - Elevenlabs to generate the music - Meshy to generate the 3D assets - OpenAI API to generate images (sound on)","createdAt":"2026-09-30T00:44:02.000Z","url":"https://x.com/zarazhangrui/status/2105096296831017078","likes":254,"retweets":6,"replies":25}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"Two random honest thoughts on the market right now.. First is on people: It's harder than ever to find missionaries. I'm seeing people leave the companies they have cofounded to join the \"obvious\" winners. Public CEOs are leaving for positions at labs. Founders leaving and rejoining neolabs at a moment's notice. Companies getting Windsurf-ed where only the choice people are getting to join the future company. Founders raising tranched valuations without worrying about the next employee that will join them will have 409As that make early exercising impossible. As early stage VCs, we are often just betting on people. And, when those people leave on a dime's notice, then the remaining company…","createdAt":"2026-09-30T04:13:10.000Z","url":"https://x.com/nikunj/status/2105148927599423752","likes":223,"retweets":7,"replies":20},{"text":"Transitioning from one thing to the next can often be really fun and often quite stressful in what feels like a warp speed period.. If that’s you, @lolawajs & I would love to meet you at this breakfast and help in any way possible. DMs open!","createdAt":"2026-09-30T00:50:33.000Z","url":"https://x.com/nikunj/status/2105097936455786536","likes":17,"retweets":0,"replies":1},{"text":"If you’re a B2B founder and don’t want to spend egregious amounts of money on LinkedIn CPMs, lots of alpha in just aggregating what’s trending on X and posting it on LinkedIn. LinkedIn is consistently a week or two behind and they lap it up. And for those who think it’s cringe, you live long enough to start LinkedInfluencing. It truly comes for us all 🤷‍♂️","createdAt":"2026-09-29T14:59:19.000Z","url":"https://x.com/nikunj/status/2104949147812159672","likes":126,"retweets":0,"replies":24}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"That /goal is still running.","createdAt":"2026-09-29T21:36:30.000Z","url":"https://x.com/steipete/status/2105049100983132648","likes":8,"retweets":0,"replies":0},{"text":"This is pretty amazing.","createdAt":"2026-09-29T21:36:05.000Z","url":"https://x.com/steipete/status/2105048996549116268","likes":528,"retweets":17,"replies":22}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"@every @sama read the vibe check if you haven't:","createdAt":"2026-09-29T23:12:30.000Z","url":"https://x.com/danshipper/status/2105073259507331233","likes":3,"retweets":0,"replies":2},{"text":"im biased but im insanely proud of @every's dev day coverage - two vibe checks - live feed - livestream - podcast with @sama (coming tomorrow!) insane amount of effort from the team:","createdAt":"2026-09-29T22:47:28.000Z","url":"https://x.com/danshipper/status/2105066959822114972","likes":156,"retweets":8,"replies":16},{"text":"@sama subscribe to @every to get it:","createdAt":"2026-09-29T22:38:32.000Z","url":"https://x.com/danshipper/status/2105064711431897369","likes":2,"retweets":0,"replies":0}]},{"name":"Sam Altman","handle":"sama","bio":"The mission of OpenAI is to ensure that AGI benefits all of humanity","tweets":[{"text":"Dots are here! A new way to use AI that works 24/7 for you; get more of your time and attention back to work at a higher level.","createdAt":"2026-09-29T18:01:34.000Z","url":"https://x.com/sama/status/2104995014208258235","likes":12080,"retweets":872,"replies":1670},{"text":"Ultrafast is so fast I do not ever want to go back","createdAt":"2026-09-29T17:59:56.000Z","url":"https://x.com/sama/status/2104994601140711896","likes":8872,"retweets":214,"replies":1045},{"text":"6.1 Sol at 1/5th of the price of Astra, and 95% cache read discount! Extremely capable model.","createdAt":"2026-09-29T17:59:07.000Z","url":"https://x.com/sama/status/2104994395980533804","likes":6722,"retweets":220,"replies":467}]}]},"errors":[],"partial":false},{"date":"2026-09-30","dateLabel":"2026年09月30日","generatedAt":"2026-09-30T00:00:00+08:00","sourceGeneratedAt":"2026-09-29T06:45:20.961Z","stats":{"podcastEpisodes":0,"xBuilders":18,"totalTweets":34,"blogPosts":0},"highlights":[{"tag":"模型经济性","title":"下一轮模型竞争会从答得更好，转向每项任务耗得更少","body":"当模型能够用更少 token、更短时间交付同一结果，能力提升就不只是榜单变化，而会直接扩大可被自动化的任务边界。高频工作流因此更容易采用更高层的 Agent 抽象，团队评估模型时也应把一次回答的质量，升级为完成整项工作的成本、速度与可靠性。","evidence":[{"quote":"Sonnet 5.5 fixing a bug with Claude Code. 30% faster and 30% less usage.","attribution":"Boris Cherny，Claude Code 团队","url":"https://x.com/bcherny/status/2104638725317923228"},{"quote":"In Claude Code, users get ~30% more tasks done compared to Sonnet 5. It's smarter, so it needs fewer tokens for the same work.","attribution":"Cat Wu，Anthropic Claude Code 与 Cowork 团队","url":"https://x.com/_catwu/status/2104639552170377399"}]},{"tag":"企业评测","title":"通用模型的企业价值，必须在带行业陷阱的成品任务里兑现","body":"企业采用不会由单一平均分决定，而取决于模型能否在真实材料中识别算术错误、拒绝编造基准并正确处理原始数据。面向严肃业务的产品，评测单元应从知识问答转为可验收交付物，并按行业风险拆分；只有这样，速度和成本优势才不会掩盖关键错误。","evidence":[{"quote":"Sonnet 5.5 caught the miscalculated interest totals and the mispriced options and flagged them, and it also finished this work about 61% faster.","attribution":"Aaron Levie，Box 联合创始人兼 CEO","url":"https://x.com/levie/status/2104648654074343480"}]},{"tag":"Agent 工作流","title":"提示词正在退居入口，真正的能力载体是可复用的上下文系统","body":"当结果依赖参考仓库、skills、示例、检索和外部模型时，复制一句 prompt 已无法复制工作方法。团队的生产力资产会转向如何组织材料、规定调用顺序和沉淀动态流程；相应地，协作与评审也要从比较措辞，转向检查上下文来源、工具权限和执行轨迹。","evidence":[{"quote":"it's basically impossible for someone to just \"show you their prompt\" now, because everything is about references, skills and examples","attribution":"Thariq，Anthropic Claude Code 团队","url":"https://x.com/trq212/status/2104608785696440510"},{"quote":"With Sonnet + Opus 5.5 I think this sort intelligence is should be very available. Try Sonnet 5.5 in particular when making workflows.","attribution":"Thariq，Anthropic Claude Code 团队","url":"https://x.com/trq212/status/2104660926373023830"}]},{"tag":"商业模式","title":"订阅制 AI 正在从额度折扣，转向效率承诺与权益打包","body":"当 API 单价持续下降，用名义调用价值证明高价订阅会越来越脆弱。更可持续的订阅逻辑，是让用户相信同样预算能完成更多工作，并用不计入用量的附加权益维持差异；这也迫使厂商把模型效率改进真正传导到用户侧，而不是靠复杂限额制造价值感。","evidence":[{"quote":"On the subscription, we guarantee that over time you always get more work done and with an increasing level of quality.","attribution":"Thibault Sottiaux，OpenAI Codex 与 ChatGPT 团队","url":"https://x.com/thsottiaux/status/2104823812042940713"}]},{"tag":"创业策略","title":"把融资等同于分发护城河，会在平台反击时暴露得最快","body":"资本可以买到增长，却不能保证渠道控制权；当既有平台调动自身分发能力，单靠投放或规模形成的领先很容易被压缩。创业公司的防御仍要回到不可公平获得的优势、高留存、网络效应与自我造血，否则融资只会放大一个依赖外部窗口期的策略。","evidence":[{"quote":"Find your unfair advantages. Build a great product with high retention and ideally network effects. Use capital as a weapon to compound and not as destiny.","attribution":"Nikunj Kothari，FPV Ventures 合伙人","url":"https://x.com/nikunj/status/2104566122549063756"}]}],"matters":[{"kind":"Agent 基础设施","title":"无需认证的域名搜索开始直接为 Agent 优化","detail":"Guillermo Rauch 宣布 Vercel 域名搜索可免登录使用，并明确指出这对 Agent 尤其合适，显示产品入口正主动降低机器访问摩擦。","url":"https://x.com/rauchg/status/2104764419305796094"},{"kind":"交互入口","title":"代码生成正在进入日常通讯界面","detail":"Garry Tan 认为 Codegen 与 WhatsApp 的组合很合理，意味着开发代理可能通过用户已经高频使用的消息入口获得更低启动成本。","url":"https://x.com/garrytan/status/2104771351009702168"},{"kind":"设计质量","title":"AI 前端的复制门槛仍集中在审美与制作方法","detail":"Zara Zhang 征集难以摆脱 AI 感、无法复现优秀演示以及愿意公开制作流程的实践者，反映生成能力普及后，视觉完成度仍是明显短板。","url":"https://x.com/zarazhangrui/status/2104689580045979811"},{"kind":"创作工具","title":"单人原型开始整合玩法、素材与宣传片生产","detail":"Peter Yang 用 Sonnet 5.5 做出可玩的《星际争霸》关卡，并组合 Sketchfab 模型、Suno 音乐和模型生成的宣传片，展示跨媒介原型链路正在收拢。","url":"https://x.com/petergyang/status/2104736498151256303"},{"kind":"AI 技能","title":"真实迁移项目正在反向沉淀为可复用技能","detail":"Vercel 在迁移成熟工作负载后提炼出两项将公开的 AI skills，说明一次性交付开始被封装为可传播的工程能力。","url":"https://x.com/rauchg/status/2104660502723072281"}],"sources":{"podcasts":[],"blogs":[],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"oai designers have to be trolling us","createdAt":"2026-09-29T01:15:24.000Z","url":"https://x.com/swyx/status/2104741800393253322","likes":198,"retweets":2,"replies":42}]},{"name":"Josh Woodward","handle":"joshwoodward","bio":"VP, @Google @GoogleLabs @GeminiApp @GoogleAIStudio","tweets":[{"text":"Having just come back from Yosemite recently, this is awesome!","createdAt":"2026-09-28T16:57:04.000Z","url":"https://x.com/joshwoodward/status/2104616392297451882","likes":102,"retweets":2,"replies":4}]},{"name":"Boris Cherny","handle":"bcherny","bio":"Claude Code @anthropicai","tweets":[{"text":"Sonnet 5.5 fixing a bug with Claude Code. 30% faster and 30% less usage.","createdAt":"2026-09-28T18:25:49.000Z","url":"https://x.com/bcherny/status/2104638725317923228","likes":4835,"retweets":173,"replies":227}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Hi, Tomorrow we are re-opening the Pro $200 subscriptions to new subscribers, but together with it we are also changing how we calculate the usage for it. In effect, if you do the math, it will net out at half the dollar in API spend compared to the old Pro $200 plan. Now that it's said, let me explain why this is happening and why you will still get more work done than if you were on the Pro $200 subscription one month ago. (a) We didn't want to compromise in other ways and are committing to not reintroducing the 5h limit, so that you can fully use the weekly usage when you want. (b) On the subscription, we guarantee that over time you always get more work done and with an increasing level…","createdAt":"2026-09-29T06:41:17.000Z","url":"https://x.com/thsottiaux/status/2104823812042940713","likes":697,"retweets":73,"replies":196},{"text":"Taken by none other than the incredible @ah20im","createdAt":"2026-09-28T07:04:49.000Z","url":"https://x.com/thsottiaux/status/2104467346945675347","likes":481,"retweets":5,"replies":82},{"text":"Sunday vibes. See you at Fort Mason soon 🎮👩‍💻","createdAt":"2026-09-28T06:58:18.000Z","url":"https://x.com/thsottiaux/status/2104465709384491519","likes":4105,"retweets":72,"replies":502}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"Folks on X are so fickle about “omg openai is getting mogged by Claude 5.5” or just a few months ago “anthropic is so cooked by codex.” I’m just glad there are 2 (and soon more) competitors pushing the frontier so we can all benefit.","createdAt":"2026-09-29T05:44:03.000Z","url":"https://x.com/petergyang/status/2104809410040336784","likes":53,"retweets":2,"replies":14},{"text":"My very first @OpenAI dev day is tomorrow. If you're going I hope to see you there!","createdAt":"2026-09-29T03:52:39.000Z","url":"https://x.com/petergyang/status/2104781373433377030","likes":80,"retweets":0,"replies":12},{"text":"I built a working StarCraft level with Sonnet 5.5. You play Terran, defending your base against the Zerg: → Build Marines, Siege Tanks, and Battlecruisers → Use SC2 models from Sketchfab (by Catholomew) → Music generated with Suno 📌 Play it here: Sonnet also made the sizzle reel below. Check out my latest tutorial on Sonnet here:","createdAt":"2026-09-29T00:54:19.000Z","url":"https://x.com/petergyang/status/2104736498151256303","likes":80,"retweets":5,"replies":6}]},{"name":"Cat Wu","handle":"_catwu","bio":"claude code + cowork @anthropicai, prev: @dagster, @scale_ai","tweets":[{"text":"Sonnet 5.5 is here! In Claude Code, users get ~30% more tasks done compared to Sonnet 5. It's smarter, so it needs fewer tokens for the same work. Here it rakes a yard of leaves using tool calls. 24s faster than Sonnet 5, with 6K fewer tokens. It leaves her extra time to read :)","createdAt":"2026-09-28T18:29:06.000Z","url":"https://x.com/_catwu/status/2104639552170377399","likes":423,"retweets":8,"replies":39}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"I just told Claude \"can you help me think through this problem step by step\"","createdAt":"2026-09-28T22:40:08.000Z","url":"https://x.com/trq212/status/2104702728270471594","likes":2698,"retweets":48,"replies":144},{"text":"A lot of times when I talk about higher level abstractions like projects, claude tag and dynamic workflows, I hear concerns about token cost. With Sonnet + Opus 5.5 I think this sort intelligence is should be very available. Try Sonnet 5.5 in particular when making workflows.","createdAt":"2026-09-28T19:54:02.000Z","url":"https://x.com/trq212/status/2104660926373023830","likes":1691,"retweets":40,"replies":127},{"text":"it's basically impossible for someone to just \"show you their prompt\" now, because everything is about references, skills and examples I often ask my agent to look at 3 other repos I've made first, search the web for references, use other AI APIs, etc.","createdAt":"2026-09-28T16:26:50.000Z","url":"https://x.com/trq212/status/2104608785696440510","likes":4265,"retweets":143,"replies":275}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"You can now search @vercel domains without auth. Especially great if you're an agent.","createdAt":"2026-09-29T02:45:16.000Z","url":"https://x.com/rauchg/status/2104764419305796094","likes":213,"retweets":6,"replies":47},{"text":"Nice viz by @marcosnils: Choose ▲ if you want to win. You know what to choose if you want third place!","createdAt":"2026-09-28T21:36:31.000Z","url":"https://x.com/rauchg/status/2104686719685853226","likes":33,"retweets":1,"replies":5},{"text":"We migrated with as little intervention as possible, setting out to prove just how much faster @vercel is. ~70% faster builds and ~75% faster paints. We derived two AI skills from the migration that we'll be sharing back. It was a mature workload with a lot of \"$formerProvider-isms\", and yet the net of the work was done in under a week. If it's [built / rendered / shipped] fast, it's on Vercel.","createdAt":"2026-09-28T19:52:21.000Z","url":"https://x.com/rauchg/status/2104660502723072281","likes":429,"retweets":13,"replies":47}]},{"name":"Alex Albert","handle":"alexalbert__","bio":"Research @AnthropicAI. Opinions are my own!","tweets":[{"text":"Sonnet 5.5 has the same feel I liked about Opus 5.5. It writes clearly, it's very fast, and it's a major capabilities jump over Sonnet 5. Really great model to iterate with.","createdAt":"2026-09-28T18:06:47.000Z","url":"https://x.com/alexalbert__/status/2104633937280811010","likes":729,"retweets":11,"replies":46}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"At Box, we've been testing Sonnet 5.5 in early access on our complex work eval with the Box Agent, and Sonnet 5.5 is another strong jump from Sonnet 5 on knowledge work with enterprise content. Across the board we saw a 4 pt overall improvement on our hardest tests, but it was roughly 2.4× faster to a finished deliverable on 12% fewer tokens. We also saw major wins in key verticals, like a +18 percentage point improvement in Financial Services, +7 pt in Legal, +8 pt in Life Sciences, and +7 pt in the Public Sector. Here are some specific wins on certain tasks that show the power of Sonnet 5.5: * Financial services (+48 points): a due-diligence review of a trading-tool acquisition, where the…","createdAt":"2026-09-28T19:05:16.000Z","url":"https://x.com/levie/status/2104648654074343480","likes":146,"retweets":13,"replies":36}]},{"name":"Ryo Lu","handle":"ryolu_","bio":"Designed @Cursor_ai, @NotionHQ, @Stripe, built startups. I make a world where anyone can make software. Aspiring k-pop idol.","tweets":[{"text":"try it in all cities with youbike in taiwan docks, navigation, live turn-by-turn directions with voice","createdAt":"2026-09-28T12:20:57.000Z","url":"https://x.com/ryolu_/status/2104546903807660224","likes":11,"retweets":1,"replies":0},{"text":"what i’ve been doing: i love youbike 💛","createdAt":"2026-09-28T12:19:01.000Z","url":"https://x.com/ryolu_/status/2104546417281020315","likes":185,"retweets":4,"replies":8}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Codegen meets WhatsApp actually makes a ton of sense","createdAt":"2026-09-29T03:12:49.000Z","url":"https://x.com/garrytan/status/2104771351009702168","likes":190,"retweets":7,"replies":22},{"text":"Karma isn’t a thing that happens, it’s a choice you can make now","createdAt":"2026-09-28T13:11:03.000Z","url":"https://x.com/garrytan/status/2104559514699837634","likes":401,"retweets":48,"replies":53}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Make something people want, then make people want it. Harvard’17. GitHub: YouTube:","tweets":[{"text":"Hello, I'm looking to chat with some of my followers! If you're - building web-based/frontend experiences with AI but have a hard time making it look beautiful/not AI slop - seeing all these cool demos on X built with latest models but have no idea how to replicate them - are creating these cool demos yourself and would like to share your creation process/tips Would love to have a chat; DM me or comment below!","createdAt":"2026-09-28T21:47:53.000Z","url":"https://x.com/zarazhangrui/status/2104689580045979811","likes":180,"retweets":1,"replies":71}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"If you prefer video, this was one shot by Opus 5.5 💥","createdAt":"2026-09-29T02:20:20.000Z","url":"https://x.com/nikunj/status/2104758141128974358","likes":14,"retweets":0,"replies":0},{"text":"","createdAt":"2026-09-28T22:45:49.000Z","url":"https://x.com/nikunj/status/2104704157106180341","likes":93,"retweets":5,"replies":11},{"text":"Where are all the “distribution is a moat and hence raise a lot of money” investors today.. when the *checks notes* incumbents are flexing their distribution muscle. It’s SO important to stay first principles on what matters. Find your unfair advantages. Build a great product with high retention and ideally network effects. Use capital as a weapon to compound and not as destiny. And, finally figure out how to be a self sustaining business because this money spigot will dry. And, that is so freaking hard. It’s never been easy - especially not now. (PS: This is not a subtweet on any company, but more so on the investors who’ll dole out terrible advice and move to the next company in their por…","createdAt":"2026-09-28T13:37:19.000Z","url":"https://x.com/nikunj/status/2104566122549063756","likes":111,"retweets":4,"replies":13}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"See ya there!","createdAt":"2026-09-28T22:37:36.000Z","url":"https://x.com/steipete/status/2104702088626557384","likes":48,"retweets":3,"replies":9}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"i've been to every dev day since 2023 this is by far the most launches @OpenAI has ever had rsi?","createdAt":"2026-09-28T20:01:54.000Z","url":"https://x.com/danshipper/status/2104662907716050988","likes":52,"retweets":2,"replies":7},{"text":"@every @kieranklaassen full vibe check here:","createdAt":"2026-09-28T20:00:29.000Z","url":"https://x.com/danshipper/status/2104662550138994746","likes":3,"retweets":0,"replies":0},{"text":"SONNET 5.5 IS OUT! It has dramatically improved writing even versus Opus 5.5 in my testing for @every. Astra is still my favorite for writing, but this model beats it at revision tasks. It's faster and cheaper than Opus 5.5, so it's @kieranklaassen's preferred model for quick iterative coding and design work. But both @kplikethebird and @hammer_mt feel like they don't have room in their stack for mid-tier models anymore. Full vibe check coming on @every! Until then you can see Sonnet's scores vs. Opus and Astra on my personal benchmark, drawn from my real work:","createdAt":"2026-09-28T18:17:53.000Z","url":"https://x.com/danshipper/status/2104636728992776510","likes":203,"retweets":12,"replies":17}]},{"name":"Sam Altman","handle":"sama","bio":"The mission of OpenAI is to ensure that AGI benefits all of humanity","tweets":[{"text":"Pretty excited for DevDay tomorrow. We have found a new thing.","createdAt":"2026-09-28T19:58:07.000Z","url":"https://x.com/sama/status/2104661956879913457","likes":8097,"retweets":411,"replies":656}]},{"name":"Claude","handle":"claudeai","bio":"Claude is an AI assistant built by @anthropicai to be safe, accurate, and secure. Talk to Claude on or download the app.","tweets":[{"text":"What are you exploring with Sonnet 5.5?","createdAt":"2026-09-28T20:49:58.000Z","url":"https://x.com/claudeai/status/2104675005090923000","likes":142,"retweets":1,"replies":37},{"text":"Bouncing-ball physics tests by @forwardeditor from the same prompt, Sonnet 5 vs Sonnet 5.5.","createdAt":"2026-09-28T20:49:58.000Z","url":"https://x.com/claudeai/status/2104675003673325732","likes":177,"retweets":3,"replies":8},{"text":"Pixel-art forest creatures by @measure_plan, every frame drawn in code.","createdAt":"2026-09-28T20:49:57.000Z","url":"https://x.com/claudeai/status/2104675000787603486","likes":167,"retweets":2,"replies":4}]}]},"errors":[],"partial":false},{"date":"2026-09-29","dateLabel":"2026年09月29日","generatedAt":"2026-09-29T00:00:00+08:00","sourceGeneratedAt":"2026-09-28T06:57:29.581Z","stats":{"podcastEpisodes":1,"xBuilders":14,"totalTweets":25,"blogPosts":0},"highlights":[{"tag":"应用层价值","title":"企业 AI 的护城河不在模型调用，而在把智能嵌进工作流","body":"模型能力越趋于可替换，应用公司越需要掌握流程上下文、企业数据和人机交接点。真正难复制的不是一次回答，而是让 Agent 在遗留系统、权限边界和业务节奏中持续完成任务；这也使垂直应用有机会反过来积累数据与领域能力，形成自己的模型飞轮。","evidence":[{"quote":"there's a lot of gap between the model and the workflow, and as you bridge that gap over time, you get to a point where you realize, oh, I should also do the model. And then you have enough data, you have enough sort of domain expertise where that becomes its own sort of flywheel.","attribution":"Aaron Levie，Box 联合创始人兼 CEO，Training Data","url":"https://www.youtube.com/playlist?list=PLOhHNjZItNnMm5tdW61JpnyxeYH5NDDx8"}]},{"tag":"Agent 经济","title":"Agent 会先冲击依赖用户惰性的商业模式，再释放被摩擦压住的需求","body":"当选择、比价与切换由持续工作的代理完成，企业很难再靠复杂流程和习惯惯性留住客户，竞争会更快回到实际效用与价格。同时，过去因搜索、预约或协调成本过高而没有发生的交易会被激活；同一种自动化力量将同时压缩旧利润、创造新市场。","evidence":[{"quote":"In those parts of the market, switching costs will come down and competition is going to increase dramatically until some equilibrium is reached between the disruptive alternatives and the incumbents.","attribution":"Aaron Levie，Box 联合创始人兼 CEO","url":"https://x.com/levie/status/2104350592290406849"},{"quote":"industry built on modeling humans as rational agents panics as humans adopt rational agents","attribution":"Dan Shipper，Every CEO","url":"https://x.com/danshipper/status/2104302924251951553"}]},{"tag":"软件交付","title":"AI 正在把发布前冻结改写成运行时约束与选择","body":"如果代码可以按请求在约束内生成，测试也可以由 Agent 判断必要范围，软件交付就不再只是把固定产物安全地推向线上。工程治理会转向定义可验证边界：什么能动态生成、哪些测试不能省、失败如何回退。速度提升的前提因此不是减少控制，而是把控制从人工仪式编码成机器可执行的规则。","evidence":[{"quote":"Code freeze isn’t really a thing anymore before releases and in the future the code might even be generated online per request according to some constraints.","attribution":"Thibault Sottiaux，OpenAI Codex 与 ChatGPT 团队","url":"https://x.com/thsottiaux/status/2104108167806550046"},{"quote":"My plan is to let codex decide which tests actually need to run and drastically nix CI and run tests hourly.","attribution":"Peter Steinberger，OpenClaw 与 OpenAI","url":"https://x.com/steipete/status/2104305554760114488"}]},{"tag":"客户端架构","title":"桌面 Agent 的体验上限，开始由原生外壳与协议边界共同决定","body":"把浏览器界面留在原生客户端、把 Agent 能力放在独立 CLI，并通过 ACP、MCP 连接，两类复杂性被拆开：前者负责系统级交互与性能，后者负责工具编排与权限暴露。这种分层既减轻桌面应用的体积，也让 Agent 接口有机会获得更清晰的安全边界。","evidence":[{"quote":"𝚏𝚡 𝚊𝚌𝚙 lets me embed an agent without bloating the app. It talks to my local fx CLI over ACP. fx can then manage the browser via an MCP server².","attribution":"Guillermo Rauch，Vercel CEO","url":"https://x.com/rauchg/status/2104428800134013205"}]}],"matters":[{"kind":"人机协作","title":"Agent 提效可能被人的行为松弛抵消","detail":"Thariq 担心人们会因 Agent 承担更多工作而变得更懒，提醒团队不能只衡量自动化产出，也要观察人的能力与主动性是否退化。","url":"https://x.com/trq212/status/2104273243599405395"},{"kind":"产品判断","title":"技术的新奇感会掩盖产品实际上没有工作","detail":"Zara Zhang 指出，新技术的炫目感容易让用户把失败归咎于自己；产品团队需要把可用性问题与用户的追赶焦虑分开。","url":"https://x.com/zarazhangrui/status/2104112917264126195"},{"kind":"Agent 能力","title":"可验证的端到端任务仍是观察 Agent 的有效试金石","detail":"Nikunj Kothari 对 Astra 的正面体验明确依赖两个条件：任务足够困难但结果可验证，并且 Agent 获得了正确工具。","url":"https://x.com/nikunj/status/2104444216017637575"},{"kind":"公共讨论","title":"AI 风险讨论中的确定性与专业距离可能倒挂","detail":"Matt Turck 观察到，部分 AI 研究者既不认同末日论也不认同失控加速，而非研究者反而常持更确定的立场。","url":"https://x.com/mattturck/status/2104331402385002831"},{"kind":"内容价值","title":"持续表达的回报不必立即落到内容变现","detail":"Zara Zhang 将自我表达视为无需功利理由的本能，并认为影响力比直接收入更有价值，提供了另一种创作者投入逻辑。","url":"https://x.com/zarazhangrui/status/2104253882025341231"}],"sources":{"podcasts":[{"title":"Box's Aaron Levie: On Reinventing Yourself in the AI Age and Enterprise Diffusion","name":"Training Data","publishedAt":"2026-09-15T09:00:00.000Z","url":"https://www.youtube.com/playlist?list=PLOhHNjZItNnMm5tdW61JpnyxeYH5NDDx8","excerpts":["I wanna send an emergency alert to, like, everybody who's, like, a sophomore or junior in college and just be, like, follow these 20 accounts","I agree. And also join Twitter because, like, this will just help your career. You're either, like, a year ahead or a year behind simply based on your feed. And my feed is like so so wired in. I'll still talk to to 20 year olds that are like, yeah, like, you know, I I I see some articles and I'm like, what do mean?","How do you see articles? Like, I don't even know what that means. Like, do you just, like, get lucky that somebody emailed you an article? You just have to be wired in. I I enjoy it."]}],"blogs":[],"x":[{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":". . . . . .","createdAt":"2026-09-28T01:32:38.000Z","url":"https://x.com/thsottiaux/status/2104383749723128052","likes":6512,"retweets":168,"replies":1630},{"text":"Code freeze isn’t really a thing anymore before releases and in the future the code might even be generated online per request according to some constraints.","createdAt":"2026-09-27T07:17:34.000Z","url":"https://x.com/thsottiaux/status/2104108167806550046","likes":6051,"retweets":165,"replies":779}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"Notice how almost nobody has fond memories of SaaS or business software that they used back in the day but everyone remembers their favorite games. Games really are the software that has the longest staying power in our memories. LLM models are probably the inverse of that 😂","createdAt":"2026-09-28T03:34:48.000Z","url":"https://x.com/petergyang/status/2104414495376564517","likes":57,"retweets":0,"replies":21},{"text":"Btw follow the goat @David_Wise for composing the amazing donkey Kong country music","createdAt":"2026-09-28T03:04:42.000Z","url":"https://x.com/petergyang/status/2104406922216808505","likes":1,"retweets":0,"replies":1},{"text":"Yes I am a millennial 🙂","createdAt":"2026-09-28T02:59:40.000Z","url":"https://x.com/petergyang/status/2104405655406923922","likes":66,"retweets":0,"replies":9}]},{"name":"Nan Yu","handle":"thenanyu","bio":"(soon) member of product staff @openai. prev head of product @linear","tweets":[{"text":"We came up in the golden era","createdAt":"2026-09-28T04:14:07.000Z","url":"https://x.com/thenanyu/status/2104424388309496182","likes":19,"retweets":0,"replies":7}]},{"name":"Amanda Askell","handle":"AmandaAskell","bio":"Philosopher & ethicist trying to make AI be good @AnthropicAI. Personal account. All opinions come from my training data.","tweets":[{"text":"Admittedly I'm averse to a lot of smells, but I like things like the smell of a fresh orange. The perfumes that are supposed to be realistic and citrusy smell at best like orange layered over skunk.","createdAt":"2026-09-27T17:48:16.000Z","url":"https://x.com/AmandaAskell/status/2104266890726309908","likes":104,"retweets":1,"replies":17},{"text":"I wanted to know if I only hate perfume because I've never owned a nice one. So I researched a bunch of the fanciest and most well reviewed perfumes and bought a tiny sample bottle of each. I can now confidently confirm that all perfume smells disgusting.","createdAt":"2026-09-27T17:26:33.000Z","url":"https://x.com/AmandaAskell/status/2104261424625381528","likes":869,"retweets":14,"replies":166}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"dating myself with neopets I fear","createdAt":"2026-09-28T02:51:57.000Z","url":"https://x.com/trq212/status/2104403711699423680","likes":395,"retweets":1,"replies":91},{"text":"I am most afraid of us eating the productivity gains of agents by just becoming lazier.","createdAt":"2026-09-27T18:13:31.000Z","url":"https://x.com/trq212/status/2104273243599405395","likes":4322,"retweets":92,"replies":474}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Cool to see Replit being popular at Chan-Zuckerberg household!","createdAt":"2026-09-28T04:31:36.000Z","url":"https://x.com/amasad/status/2104428789417857436","likes":167,"retweets":5,"replies":9},{"text":"Love to see it 😂","createdAt":"2026-09-27T22:58:10.000Z","url":"https://x.com/amasad/status/2104344877798719516","likes":55,"retweets":4,"replies":5}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"I¹ ported my Mini web browser to Rust & Swift. It's faster, more secure, and shockingly, nicer to iterate on than Electron + Bun. I always wanted Safari-like UX but… Chrome 😁. Thanks to the 𝚌𝚎𝚏 crate, I can bundle up-to-date Chromium. 𝚏𝚡 𝚊𝚌𝚙 lets me embed an agent without bloating the app. It talks to my local fx CLI over ACP. fx can then manage the browser via an MCP server². By ditching Electron, I was able to get Liquid Glass, faster boots, and a more Mac-native feeling. Little things like fine-grained focus and input control, which are nightmare fuel in JS, just work®. Native is the future, both on the desktop and in the cloud. I suspect the entire software world will \"nativify…","createdAt":"2026-09-28T04:31:39.000Z","url":"https://x.com/rauchg/status/2104428800134013205","likes":508,"retweets":15,"replies":61}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Interesting to think about all the implications in a world where agents begin to make the best or most efficient choice for their users. On one hand, there is some subset of the economy that benefits from the friction customers traditionally have changing something about their habits. In those parts of the market, switching costs will come down and competition is going to increase dramatically until some equilibrium is reached between the disruptive alternatives and the incumbents. On the other hand, there are lots of markets that are hurt by a significant amount of friction, where agents will begin to unlock all kinds of economic activity by making it far easier to buy products or services…","createdAt":"2026-09-27T23:20:52.000Z","url":"https://x.com/levie/status/2104350592290406849","likes":174,"retweets":19,"replies":47}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Anti-bot is for losers tbh","createdAt":"2026-09-28T02:48:06.000Z","url":"https://x.com/garrytan/status/2104402742517420517","likes":418,"retweets":14,"replies":59},{"text":"\"Oh I can do this with CDP\" Haha you have not actually hit any real anti-bot then","createdAt":"2026-09-27T19:13:32.000Z","url":"https://x.com/garrytan/status/2104288345547591747","likes":16,"retweets":0,"replies":4},{"text":"Do not nerf Made in San Francisco","createdAt":"2026-09-27T15:25:59.000Z","url":"https://x.com/garrytan/status/2104231083701420282","likes":446,"retweets":20,"replies":31}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"It continues to be notable how many AI researchers (who understand how AI actually works) believe in neither AI doom nor massive uncontrollable acceleration, while non AI researchers (who have limited knowledge) have very definite and certain views on the topic.","createdAt":"2026-09-27T22:04:37.000Z","url":"https://x.com/mattturck/status/2104331402385002831","likes":53,"retweets":5,"replies":16}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Make something people want, then make people want it. Harvard’17. GitHub: YouTube:","tweets":[{"text":"People who ask “why do you keep posting without monetizing your content” don’t understand that: 1. Self-expression is an innate human instinct that requires no justification or utilitarian motive 2. Influence is so much more valuable than money","createdAt":"2026-09-27T16:56:35.000Z","url":"https://x.com/zarazhangrui/status/2104253882025341231","likes":354,"retweets":22,"replies":33},{"text":"New technology can be so dazzling and flashy that it blinds us to the ways in which it’s not working (and sometimes makes you feel that if something is not working, it’s probably your fault not the technology’s fault, because the world is moving so fast and everyone seems ahead of you)","createdAt":"2026-09-27T07:36:26.000Z","url":"https://x.com/zarazhangrui/status/2104112917264126195","likes":68,"retweets":1,"replies":10}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"Astra is absurd.. Give it decently hard verifiable end to end tasks with the right tools and watch it just fly 😅","createdAt":"2026-09-28T05:32:54.000Z","url":"https://x.com/nikunj/status/2104444216017637575","likes":19,"retweets":0,"replies":5},{"text":"Asked ChatGPT for book recommendations after a long back and forth of books I tend to like.. if you have others to add, let me know 👋 Currently reading: > White Mirror by @TinkeredThinker > Challenger by @HigginbothamA","createdAt":"2026-09-27T17:28:43.000Z","url":"https://x.com/nikunj/status/2104261968043663591","likes":6,"retweets":1,"replies":4},{"text":"This is the larger one (13.3”) with Renaissance art","createdAt":"2026-09-27T16:58:19.000Z","url":"https://x.com/nikunj/status/2104254321131245653","likes":1,"retweets":0,"replies":0}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"Same. @useblacksmith has been an amazing sponsor but we need to distribute the load. My plan is eading gets entirely discounted, because of the exhaustion of getting low-quality and unverified AI prose being thrown at you all the time.","attribution":"Guillermo Rauch，Vercel CEO","url":"https://x.com/rauchg/status/2103939888513274147"}]},{"tag":"工程工作流","title":"Coding agent 的价值重心正从写代码移到规划真实故障","body":"生产问题的难点通常不是补出一段代码，而是先收敛原因、影响面和修改顺序。把 agent 放进 autoplan 阶段，意味着工程团队开始用它组织诊断路径；一旦规划结果可审查，后续生成与执行才更容易进入可信的生产流程。","evidence":[{"quote":"This is my favorite way to fix bugs now — @capydotai with GStack /autoplan on a production issue. GPT-6 medium reasoning.","attribution":"Garry Tan，Y Combinator 总裁兼 CEO","url":"https://x.com/garrytan/status/2103989902476259702"}]},{"tag":"创作范式","title":"生成式视频正在把经典文本改编压缩成可连续迭代的个人流程","body":"从文本改写到分场景成片由同一创作者连续完成，说明视频生成的关键变化不只是画面质量，而是媒介转换的组织成本下降。创作者可以先用短场景验证叙事，再继续扩展；原本需要多人协作的改编过程开始具备软件式迭代节奏。","evidence":[{"quote":"i wrote a novelization of Plato’s Protagoras then i had Opus 5.5 turn it into a movie (scene 1)","attribution":"Dan Shipper，Every CEO","url":"https://x.com/danshipper/status/2103850415930708437"},{"quote":"Plato's Protagoras, as a short film by Opus 5.5 — scene 2","attribution":"Dan Shipper，Every CEO","url":"https://x.com/danshipper/status/2103894152316645620"}]}],"matters":[{"kind":"产品体验","title":"Claude 使用额度被用户感知为明显放宽","detail":"Peter Yang 表示 Claude 的 limits 从“几乎不可用”变成“基本不限量”；这是用户侧体验观察，并非官方额度说明。","url":"https://x.com/petergyang/status/2104066667361992892"},{"kind":"语音应用","title":"Gemini Audio API 被用于搭建日语口语教练","detail":"Peter Yang 正在制作一款会话式日语学习应用，课程结构为 10 节课、每节 10 个短语，展示实时音频能力向垂直教学产品落地。","url":"https://x.com/petergyang/status/2104059554204188833"},{"kind":"开发者反馈","title":"首次使用 Antigravity 时找不到明确反馈入口","detail":"Peter Yang 为试用 Google 新音频 API 首次使用 Antigravity，却公开询问该向谁反馈，暴露新工具早期反馈链路仍不够清晰。","url":"https://x.com/petergyang/status/2104003094615052443"},{"kind":"平台状态","title":"Codex 与 ChatGPT 的 resets 已完成传播","detail":"OpenAI 的 Thibault Sottiaux 简短确认所有 resets 均已 propagated，并表示本轮处理结束；原帖未提供更多技术细节。","url":"https://x.com/thsottiaux/status/       return '<section><h2>原文<span class="section-note">SOURCES / 完整证据索引</span></h2>' + archive + '<div class="sources">' + podcastGroups + blogGroups + xGroups + '</div></section>';
    }
    function render() {
      const d = DIGESTS.find(item => item.date === selectedDate) || DIGESTS[0];
      if (!d) {
        document.getElementById('content').innerHTML = '<p class="empty">还没有 digest 数据。</p>';
        return;
      }
      selectedDate = d.date;
      renderDates();
      renderStats(d);
      document.getElementById('content').innerHTML = renderHighlights(d) + renderMatters(d) + renderSources(d);
    }
    render();
  </script>
</body>
</html>
