ctor, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"Stud traders like Kaushik love Muse!","createdAt":"2026-09-13T19:50:25.000Z","url":"https://x.com/realmadhuguru/status/2099224198732517750","likes":6,"retweets":1,"replies":2}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Nominal determinism strikes again.","createdAt":"2026-09-14T03:44:22.000Z","url":"https://x.com/amasad/status/2099343474734911917","likes":126,"retweets":4,"replies":14},{"text":"It was painful to see so many users being priced out of AI coding for a while. But now it’s free to build again!","createdAt":"2026-09-13T18:02:48.000Z","url":"https://x.com/amasad/status/2099197117013340450","likes":179,"retweets":12,"replies":38}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"You don't get it, I build software to relax","createdAt":"2026-09-13T21:25:08.000Z","url":"https://x.com/rauchg/status/2099248037507797164","likes":2523,"retweets":213,"replies":165}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"“Pacing” can be somewhat of a trigger word because it sounds like an arbitrary slow down of capability or a way to hobble competitors through undue regulation. However, the specific improvement goals laid out in Dario’s are absolute necessities in AI development. We expect equivalent in areas like aerospace, life sciences, health care, and other industries, and AI development likely shouldn’t be that different. AI is going to be the technology underpinning our financial trading systems, our medical devices, our biotech breakthroughs, defense systems, government workflows, and many more mission critical domains. So it completely stands to reason that we want these systems to be safe and “ali…","createdAt":"2026-09-13T16:07:04.000Z","url":"https://x.com/levie/status/2099167992835924301","likes":168,"retweets":30,"replies":65}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"The content about startups we do is merely the teaser for the specific advice we give 1:1 when you actually are a YC startup","createdAt":"2026-09-13T17:01:27.000Z","url":"https://x.com/garrytan/status/2099181676039704870","likes":219,"retweets":9,"replies":39}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"Seed investor when a company he forgot about years ago gets acquired out of nowhere","createdAt":"2026-09-13T22:02:20.000Z","url":"https://x.com/mattturck/status/2099257395708879286","likes":333,"retweets":10,"replies":9}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Make something people want, then make people want it. Harvard’17. GitHub: YouTube:","tweets":[{"text":"Anyone else notices this problem with Astra? Astra: I have done X Me: This is wrong, you should do Y instead Astra: You're right. I should do Y Me: ... Why doesn't it just go and do Y, like the other models??","createdAt":"2026-09-14T04:04:52.000Z","url":"https://x.com/zarazhangrui/status/2099348631291883945","likes":170,"retweets":3,"replies":94}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"All the questions to ask when you’re joining a startup","createdAt":"2026-09-13T23:02:53.000Z","url":"https://x.com/nikunj/status/2099272635926671532","likes":0,"retweets":0,"replies":0},{"text":"When a seed investor realizes their marked down investment is suddenly going to return half the fund..","createdAt":"2026-09-13T22:59:07.000Z","url":"https://x.com/nikunj/status/2099271686969569309","likes":35,"retweets":1,"replies":1},{"text":"I get at least 1x text a day from a founder facing this exact conundrum.. Applicants your entry valuation being higher and your total comp being higher is often a bug and not a feature. Just because a company has raised at a higher valuation doesn’t mean they are realistically more secure and the better place to go. You have to really look at the numbers objectively - what’s the market, what’s the traction and how well positioned are they. And if they are worth 100x ARR, well they have to grow into it. Then, do your own analysis on what do you think this company exits at. Not to mention your 409a prices and tax implications. It’s so freaking important right now when everything is upside dow…","createdAt":"2026-09-13T18:08:34.000Z","url":"https://x.com/nikunj/status/2099198567923765357","likes":75,"retweets":1,"replies":3}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"And yes, I'll test this for a few weeks and if we see that this helps the majority of users I'll try to get this into codex!","createdAt":"2026-09-13T22:20:59.000Z","url":"https://x.com/steipete/status/2099262092633411832","likes":45,"retweets":1,"replies":2},{"text":"This is all written in Rust. Because you can't escape Rust.","createdAt":"2026-09-13T18:18:53.000Z","url":"https://x.com/steipete/status/2099201162922938418","likes":102,"retweets":5,"replies":7},{"text":"Next release (or dev channel) does worktrees ~80% faster via apfs/brtfs/xfs/ReFS folder clones. Also saves lots of disk space.","createdAt":"2026-09-13T18:03:24.000Z","url":"https://x.com/steipete/status/2099197266636783989","likes":643,"retweets":18,"replies":43}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"started using Astra medium for simple tasks call that pacing the frontier","createdAt":"2026-09-13T20:18:26.000Z","url":"https://x.com/danshipper/status/2099231248027730195","likes":285,"retweets":7,"replies":24},{"text":"we’re going to the moon","createdAt":"2026-09-13T15:06:35.000Z","url":"https://x.com/danshipper/status/2099152769080828197","likes":9,"retweets":0,"replies":1}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"Imagine a world where we didn’t have to rely on any one organization to be good and virtuous.","createdAt":"2026-09-13T22:10:11.000Z","url":"https://x.com/adityaag/status/2099259374544003527","likes":12,"retweets":1,"replies":1}]},{"name":"Sam Altman","handle":"sama","bio":"The mission of OpenAI is to ensure that AGI benefits all of humanity","tweets":[{"text":"There are two ways AI progress could go very badly and that we must avoid. First, we could lose control of the future to AI. This is unacceptable; we are unapologetically on Team Humanity, and AI must always serve people. To ensure that, we need ways to ensure that alignment and safety techniques stay ahead of progress in model capabilities. Second, we could end up in a world with too much concentration of power. If an extraordinarily powerful AI is used by one person or company to impress their worldview onto everyone else, the results could be extremely dystopian. Avoiding these two threats requires walking a narrow middle path; for example, one country could gain too much power. Another…","createdAt":"2026-09-14T04:18:19.000Z","url":"https://x.com/sama/status/2099352016988614852","likes":7540,"retweets":728,"replies":1680},{"text":"The world deserves confidence that American companies developing increasingly capable AI will act responsibly, especially as the trajectory of progress has steepened. Every frontier lab must deliver on this, and there is no reason any of us should come to work if we cannot. We welcome a federal framework that sets consistent safety requirements for frontier AI. But we do not believe we need to wait for an anti-trust exemption or legislation to begin the work of providing this confidence. Consistent rules to manage frontier risk so that we can maximize the benefits are a good idea (and we are excited by ideas like independent auditors). Years ago, companies like ours developed things like Re…","createdAt":"2026-09-14T04:05:35.000Z","url":"https://x.com/sama/status/2099348812305473766","likes":7781,"retweets":702,"replies":1503}]}]},"errors":[],"partial":false},{"date":"2026-09-14","dateLabel":"2026年09月14日","generatedAt":"2026-09-14T00:00:00+08:00","sourceGeneratedAt":"2026-09-13T06:41:35.550Z","stats":{"podcastEpisodes":1,"xBuilders":16,"totalTweets":27,"blogPosts":2},"highlights":[{"tag":"治理机制","title":"前沿模型治理正在从原则承诺走向常驻式外部检查","body":"真正的变化不是行业又多了一轮安全表态，而是监督开始被设计成持续接触内部系统的工作机制。外部评估者若能长期理解实验环境、事故背景与安全措施，就不必在事件发生后临时补课；同时，这也把治理难题从‘是否接受监督’推进到访问边界、独立性和跨机构协作如何落地。","evidence":[{"quote":"Committing to having independent evaluators with employee-like access is a great idea, and we will do the same.","attribution":"Sam Altman（OpenAI CEO）","url":"https://x.com/sama/status/2098811563415150910"},{"quote":"Big banks have federal examiners with desks in the building and every nuclear plant in the US has inspectors who work on site full time. I think frontier AI labs should work the same way","attribution":"Alex Albert（Anthropic Research）","url":"https://x.com/alexalbert__/status/2098814342443761909"},{"quote":"future investigations should consider being a little bit less time crunched ... if AI companies had ongoing relationships with external organizations that would participate in investigations like this","attribution":"Buck Shlegeris（Redwood Research CEO）","url":"https://www.youtube.com/@RedpointAI"}]},{"tag":"系统韧性","title":"Agent 的能力增长已经把系统加固从安全附录变成发布前提","body":"当 Agent 能跨系统行动，单次失误不再只是回答质量问题，而可能沿权限和工具链扩散。此时继续加速与主动减速并非抽象立场之争：团队需要先查清已暴露的攻击面、建立事故调查关系并留出修复窗口，否则新增能力会持续叠加在未知脆弱性上。","evidence":[{"quote":"Not a bad idea to slow down to harden systems. Especially since we haven’t even discovered all the systems that agents hacked recently.","attribution":"Amjad Masad（Replit CEO）","url":"https://x.com/amasad/status/2098828265800835310"},{"quote":"Things are accelerating faster than I can honestly stay on top of ... We need time to harden our systems, and for society to deliberate in how this technology is used and deployed.","attribution":"Thariq（Claude Code @ Anthropic）","url":"https://x.com/trq212/status/2098860941391872132"}]},{"tag":"开发范式","title":"编程语言的选型权正在从开发者体验转向 Agent 的产出约束","body":"如果 Agent 能把同一意图稳定地落到不同语言，语法熟悉度和手写效率对技术选型的权重就会下降。团队会更直接地依据运行性能、部署边界与维护风险选择栈；开发工具的核心任务也随之从辅助输入代码，变成保存意图、验证结果并约束生成过程。","evidence":[{"quote":"I’m seeing teams at Vercel iterate just as fast on Zig, Go, Rust projects as TypeScript & Python ones. The days of language or runtime choice based on human convenience are over. Agents are the new compilers.","attribution":"Guillermo Rauch（Vercel CEO）","url":"https://x.com/rauchg/status/2098833404707922239"}]},{"tag":"权限架构","title":"浏览器 Agent 的可用性突破依赖分层拦截，而不是频繁向人确认","body":"浏览器自动化要覆盖真实工作，就必须减少逐步审批；但取消确认会把风险集中到系统能否理解页面内容与用户原始意图。更成熟的架构因此需要在内容进入模型前识别注入、在动作执行前再次校验，并把高风险站点与登录信息隔离。自治不是去掉控制，而是把控制下沉到每次读取和行动的边界。","evidence":[{"quote":"Claude can now also take actions autonomously in the browser, instead of needing approval for every one. A safety classifier validates each action before it’s performed to ensure it’s safe and matches your request.","attribution":"Claude Blog","url":"https://claude.com/blog/claude-in-chrome-generally-available"},{"quote":"Probes screen web content before Claude acts on it ... A classifier reviews actions Claude is about to take ... and checks them against what you originally asked for.","attribution":"Claude Blog","url":"https://claude.com/blog/claude-in-chrome-generally-available"}]}],"matters":[{"kind":"Agent 编排","title":"同一任务开始按模型特长拆分规划与执行","detail":"Guillermo Rauch 展示了由不同模型和推理强度组成的 subagent 编排，并指出偏好可直接写入 AGENTS.md 或提示词。","url":"https://x.com/rauchg/status/2098803573861621778"},{"kind":"企业软件","title":"系统记录层正被重新包装成领域专用 Agent harness","detail":"Garry Tan 用一句话概括企业软件的迁移方向：长期存放业务数据的产品，正在转成约束和承载领域 Agent 的执行环境。","url":"https://x.com/garrytan/status/2098666551629267324"},{"kind":"游戏设计","title":"生成式制作之外，AI 还在催生宏观与微观混合玩法","detail":"Peter Yang 提议让一名玩家像 RTS 指挥官一样控制全局，其余玩家操作单个角色，把 AI 讨论从降本制作延伸到新交互结构。","url":"https://x.com/petergyang/status/2098945475038912741"},{"kind":"产品人格","title":"Soul.md 正成为 Agent 产品被观察和比较的新界面","detail":"Peter Steinberger 因看到 Meta Muse 的 Soul.md 而寻求邀请码，说明 Agent 的行为设定文件本身开始承担产品展示作用。","url":"https://x.com/steipete/status/2098931686042210381"},{"kind":"浏览器形态","title":"Cowork 用独立浏览器把任务代理与个人浏览状态分开","detail":"Claude Cowork 的内置浏览器不读取用户现有标签、书签和密码，适合交付独立网页任务；已打开页面上的工作仍由 Chrome 扩展承接。","url":"https://claude.com/blog/cowork-built-in-browser"}],"sources":{"podcasts":[{"title":"Ep 93: CEO of Redwood Research Buck Shlegeris on OpenAI/HuggingFace Revelations, Fixing AI Safety &amp; Takeover Odds","name":"Unsupervised Learning","publishedAt":"2026-09-03T13:03:11.000Z","url":"https://www.youtube.com/@RedpointAI","excerpts":["The OpenAI Hugging Face incident has dominated the discourse these past days. It feels straight out of a sci fi novel, some of the things that happened, you know, the agent coordination, the obsession with the scores, and and what they would want. And we had the perfect person on today to just discuss everything that happened and the implications for AI saf…","I'm Jacob Efron, and on unsupervised learning, we're always trying to talk with people at the cutting edge about what AI means for society, the implications for the world going forward, and this was really just a great example of that conversation. Just a fascinating discussion with Buck about something that I'm sure is top of mind for all of our listeners.…","Yeah. Well, obviously, you know, you you run Redwood Research. You've done a a bunch of fascinating work over the years, and your team kind of co authored the report that I feel like has been on the tip of everyone's tongue these past days, you know, really driving the discourse around what happened in this opening eye, hugging face incident. And today, I r…"]}],"blogs":[{"title":"Claude in Chrome is generally available ","source":"blog","publishedAt":"Aug 26, 2026","url":"https://claude.com/blog/claude-in-chrome-generally-available","summary":""},{"title":"Claude gets its own browser in Cowork","source":"blog","publishedAt":"Aug 26, 2026","url":"https://claude.com/blog/cowork-built-in-browser","summary":""}],"x":[{"name":"Andrej Karpathy","handle":"karpathy","bio":"deep learning","tweets":[{"text":"I love this and really hope we can come together as an industry and make it happen.","createdAt":"2026-09-12T16:32:14.000Z","url":"https://x.com/karpathy/status/2098811935114551617","likes":8837,"retweets":656,"replies":3}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Reset all propagated. Sweet dreams.","createdAt":"2026-09-12T08:09:17.000Z","url":"https://x.com/thsottiaux/status/2098685367058612394","likes":16402,"retweets":736,"replies":2281}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"What if this game worked like this: 1. One person is commander and can play this like a RTS (macro) 2. The rest of the team plays individual marines and characters (micro) Probably a terrible idea but would be cool 😎","createdAt":"2026-09-13T01:22:52.000Z","url":"https://x.com/petergyang/status/2098945475038912741","likes":52,"retweets":0,"replies":28},{"text":"Can’t believe ASI will come out before StarCraft. Seriously just use AI to generate half the graphics with human oversight, I won’t mind if we can get a quality game out sooner.","createdAt":"2026-09-12T18:49:11.000Z","url":"https://x.com/petergyang/status/2098846399949627553","likes":9,"retweets":0,"replies":0},{"text":"wtf? 2030? 😂 🤦 Someone should just use AI to make StarCraft 3 at this point…","createdAt":"2026-09-12T18:36:12.000Z","url":"https://x.com/petergyang/status/2098843136328171540","likes":363,"retweets":7,"replies":61}]},{"name":"Nan Yu","handle":"thenanyu","bio":"(soon) member of product staff @openai. prev head of product @linear. I am grader.","tweets":[{"text":"","createdAt":"2026-09-12T17:41:26.000Z","url":"https://x.com/thenanyu/status/2098829351781593191","likes":6,"retweets":0,"replies":0}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"Prediction: we will see movement of a lot more of the brightest minds on frontier model evals towards groups like METR over the next 12 months. This skill is currently concentrated in in a few labs, data providers and independent research groups. A combination of increased funding, financial independence from lab equity and the call to meet the existential risk of AI will motivate a migration of minds to this bigger cause.","createdAt":"2026-09-12T19:41:08.000Z","url":"https://x.com/realmadhuguru/status/2098859477219037691","likes":23,"retweets":0,"replies":2},{"text":"Before we solve AI alignment, we have a pretty serious human alignment problem. It is jarring to see the bad-faith reaction to Dario's piece from so many sides. I don't agree with every point of his essay but do believe it is a thoughtful piece everyone should read. It builds on some of the ideas @demishassabis raised in July. It is clear we need to focus on aligning amongst us humans on a few questions: What is the opportunity, risks, second-order effects? How do we measure all of this? How do companies, governments and countries coordinate? AI will benefit humanity if we can get our act together and move together.","createdAt":"2026-09-12T15:59:34.000Z","url":"https://x.com/realmadhuguru/status/2098803717432860987","likes":29,"retweets":0,"replies":5}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"If you showed me Claude Code today in 2018, I would have thought it was AGI. We have already absorbed a dramatic amount of change in the profession of software engineering and society as a whole. But still, we’re starting to see cracks. Things are accelerating faster than I can honestly stay on top of. Most people I know in AI are tired but powering through. I fear we will need more than that. We need time to harden our systems, and for society to deliberate in how this technology is used and deployed. I have a fairly low p(doom), I am confident that we can get through this! Humanity is incredibly reslient and adaptable, but this comes from our ability to make hard decisions- like this one,…","createdAt":"2026-09-12T19:46:58.000Z","url":"https://x.com/trq212/status/2098860941391872132","likes":2269,"retweets":80,"replies":204}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Not a bad idea to slow down to harden systems. Especially since we haven’t even discovered all the systems that agents hacked recently.","createdAt":"2026-09-12T17:37:07.000Z","url":"https://x.com/amasad/status/2098828265800835310","likes":606,"retweets":19,"replies":109}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"I’m seeing teams at Vercel iterate just as fast on Zig, Go, Rust projects as TypeScript & Python ones. The days of language or runtime choice based on human convenience are over. Agents are the new compilers. They compile intent into fast software.","createdAt":"2026-09-12T17:57:32.000Z","url":"https://x.com/rauchg/status/2098833404707922239","likes":1955,"retweets":93,"replies":122},{"text":"can now orchestrate subagents with different models & reasoning efforts. e.g: Fable planning and Grok executing. Fable is a genius, Grok is a fast workhorse. ① Simple. 𝙰𝙶𝙴𝙽𝚃𝚂.𝚖𝚍 or your prompt can indicate this preference. ② Steer as you please. It’s extremely enjoyable to use. You just talk to the agent and interrupt at will. Worth noting this works with any model, any gateway. No fancy server-side routing. Just harnessing (no pun intended) the model’s intelligence and ability to orchestrate.","createdAt":"2026-09-12T15:59:00.000Z","url":"https://x.com/rauchg/status/2098803573861621778","likes":664,"retweets":40,"replies":49},{"text":"The concerns over AI safety and cybersecurity are legitimate, but we’re risking talking America, the global AI leader, into self-inflicted obsolescence and the obscurity of bureaucracy. The OpenAI hacking HuggingFace argument is spurious. An agent in “ExploitGym”… exploited. Our adversaries have the training techniques, the data, and the will to attack. And they won’t be slowed down with “embedded evaluators.” They’ll likely have embedded accelerators!","createdAt":"2026-09-12T14:55:48.000Z","url":"https://x.com/rauchg/status/2098787667030712757","likes":2656,"retweets":247,"replies":206}]},{"name":"Alex Albert","handle":"alexalbert__","bio":"Research @AnthropicAI. Opinions are my own!","tweets":[{"text":"Worth spending a few minutes this weekend to read this essay in full. Embedded evaluators might sound unusual in tech but it's pretty normal in other industries. Big banks have federal examiners with desks in the building and every nuclear plant in the US has inspectors who work on site full time. I think frontier AI labs should work the same way and this is a very practical first step.","createdAt":"2026-09-12T16:41:47.000Z","url":"https://x.com/alexalbert__/status/2098814342443761909","likes":160,"retweets":6,"replies":42}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Good post. Don’t agree with all of it, but it represents many of the actual practical realities for the general path forward in frontier AI whether we like it or not. At the level of capability we’re seeing from models there will inevitably be some form of coordinated self-regulation of the industry; that’s generally a good thing. The big question will be if everyone can agree to what that is. However, the way things are headed politically there’s a chance that the labs won’t even get a say in it. And then the bigger question yet is do all the countries participate or not. Any “slow down” hinges on broad participation, which from a game theory standpoint isn’t likely until the risks are mor…","createdAt":"2026-09-12T14:46:37.000Z","url":"https://x.com/levie/status/2098785357307539882","likes":251,"retweets":22,"replies":62}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"This is huge","createdAt":"2026-09-12T19:58:27.000Z","url":"https://x.com/garrytan/status/2098863831732863310","likes":339,"retweets":11,"replies":34},{"text":"Either you die a system of record or you live long enough to become a domain-specific harness","createdAt":"2026-09-12T06:54:31.000Z","url":"https://x.com/garrytan/status/2098666551629267324","likes":3705,"retweets":221,"replies":144}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"Breaking: VCs decide to pace their returns.","createdAt":"2026-09-12T20:22:44.000Z","url":"https://x.com/mattturck/status/2098869942988718426","likes":86,"retweets":8,"replies":8},{"text":"Breaking: Dario saves humanity but kills an entire industry of mind-blown tweets and breathless AI podcasts","createdAt":"2026-09-12T18:52:45.000Z","url":"https://x.com/mattturck/status/2098847298335687132","likes":32,"retweets":1,"replies":3}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"Honestly having kids reduces p(doom) by an exponential amount.. Case in point: We have been playing the garbage truck and excavator (techno version) for the past hour. And dancing to it as if we were at a concert. With a temporary abandon to what the world is fighting about.","createdAt":"2026-09-13T02:27:37.000Z","url":"https://x.com/nikunj/status/2098961771289870463","likes":4,"retweets":0,"replies":1}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"all sorted out. they defo been cookin!","createdAt":"2026-09-13T04:40:35.000Z","url":"https://x.com/steipete/status/2098995230314037516","likes":52,"retweets":2,"replies":2},{"text":"Anyone got an invite code for Meta's Muse? 👉👈 I saw their Soul.md file and now i'm curious.","createdAt":"2026-09-13T00:28:04.000Z","url":"https://x.com/steipete/status/2098931686042210381","likes":998,"retweets":23,"replies":110},{"text":"This is amazing. Add Master of Orion 2 next!","createdAt":"2026-09-12T14:44:42.000Z","url":"https://x.com/steipete/status/2098784877495939145","likes":334,"retweets":9,"replies":28}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"me asking fable 5.1 ultracode to explain whether the internet is truly a series of pipes","createdAt":"2026-09-12T22:42:24.000Z","url":"https://x.com/danshipper/status/2098905091776373125","likes":32,"retweets":1,"replies":2},{"text":"finally, im an author!","createdAt":"2026-09-12T22:15:52.000Z","url":"https://x.com/danshipper/status/2098898413366435903","likes":14,"retweets":0,"replies":5},{"text":"Okay for the avoidance of doubt this is a joke. Someone pls community note","createdAt":"2026-09-12T19:44:41.000Z","url":"https://x.com/danshipper/status/2098860370639130859","likes":73,"retweets":1,"replies":2}]},{"name":"Sam Altman","handle":"sama","bio":"The mission of OpenAI to ensure that AGI benefits all of humanity","tweets":[{"text":"I agree with Dario that we need to pace the frontier. This has been a primary topic of discussions we've had at OpenAI in recent weeks. Committing to having independent evaluators with employee-like access is a great idea, and we will do the same. We'll have more to share soon.","createdAt":"2026-09-12T16:30:45.000Z","url":"https://x.com/sama/status/2098811563415150910","likes":53884,"retweets":5637,"replies":4038}]}]},"errors":[],"partial":false},{"date":"2026-09-13","dateLabel":"2026年09月13日","generatedAt":"2026-09-13T00:00:00+08:00","sourceGeneratedAt":"2026-09-12T06:36:41.733Z","stats":{"podcastEpisodes":1,"xBuilders":15,"totalTweets":30,"blogPosts":0},"highlights":[{"tag":"评估体系","title":"模型迭代越快，eval 越要从排行榜变成团队自己的回归系统","body":"统一 benchmark 只能描述一类预设任务，无法替团队判断模型升级后真实工作是否变好。更可靠的做法，是把日常任务、插件行为和失败轨迹沉淀成可持续回放的评估集：既检查结果，也解释失败究竟来自模型、隐藏测试，还是旧 skill 与新模型之间的兼容性。这样，模型升级才从一次主观试用变成可管理的工程变更。","evidence":[{"quote":"better benchmark scores don't tell you much about how well a model does on your real work ... built an internal platform for all of us to make personal benchmarks based on our real day-to-day work","attribution":"Dan Shipper（Every CEO）","url":"https://x.com/danshipper/status/2098481799047647715"},{"quote":"it's basically impossible to interpret evals by looking at just at the pass/fail scores these days ... in some cases the model's answer makes more sense than the expected eval result","attribution":"Thariq（Claude Code @ Anthropic）","url":"https://x.com/trq212/status/2098490139798655427"},{"quote":"we heard feedback that it's hard to know if your skills are still working with new model releases ... run `claude plugin eval init` in your plugin folder","attribution":"Thariq（Claude Code @ Anthropic）","url":"https://x.com/trq212/status/2098531560643539440"}]},{"tag":"基础设施","title":"Agent 平台的竞争正从模型接入转向通用运行原语","body":"当模型路由、文件挂载和长时间执行分别被产品化，Agent 团队不必再为每个场景重复搭建网络、存储与运行环境。平台价值会越来越像云基础设施：隐藏多模型切换和企业内容访问的复杂度，并让长任务拥有稳定执行面。真正的差异随之上移到权限设计、任务编排和可靠性。","evidence":[{"quote":"AI Gateways are the new CDNs. You could go ‘direct to origin’, but it’s brittle. You could DIY, but it’s painful and costly.","attribution":"Guillermo Rauch（Vercel CEO）","url":"https://x.com/rauchg/status/2098531157230969062"},{"quote":"Now you can mount Box to agent sandboxes to make it far easier for an agent to read and write files on the agent's computer.","attribution":"Aaron Levie（Box CEO）","url":"https://x.com/levie/status/2098478938003841123"},{"quote":"long-lived agents for your big ideas now in Cursor","attribution":"Ryo Lu（曾任 Cursor、Notion、Stripe 设计师）","url":"https://x.com/ryolu_/status/2098324260867772806"}]},{"tag":"自治边界","title":"长时 Agent 的关键能力不是无人值守，而是可控地消耗和纠偏","body":"延长运行时间不会自动带来端到端自治，反而会让早期错误假设沿任务链持续放大。现阶段更实用的产品形态，是让人保留需求定义与阶段检查，同时用预算约束资源消耗；也就是说，自治能力要与停止条件、成本边界和人工校准一起设计。","evidence":[{"quote":"Whenever I loop something overnight to build something new = if it makes one wrong assumption the whole thing becomes a waste of tokens.","attribution":"Peter Yang（AI 产品作者）","url":"https://x.com/petergyang/status/2098565668241334366"},{"quote":"Routines with budgets!","attribution":"Amjad Masad（Replit CEO）","url":"https://x.com/amasad/status/2098317466682179643"}]},{"tag":"组织设计","title":"企业 AI 的最小落地单元不是中央平台，而是懂业务的一线共建小队","body":"AI 产品需要在真实流程里反复试验，中央团队若先抽象平台、再要求各部门采用，往往会失去岗位语境和判断标准。更有效的组织方式，是让 AI builder 进入财务、销售或支持等职能，与业务人员共同定义任务和 eval；平台能力应从已验证的共性中长出来，而不是先于需求被规定。","evidence":[{"quote":"The central AI team declares itself a platform team and builds tools that everyone is supposed to adopt. These products are often disconnected from the actual workflows, context and judgment of the people doing the work.","attribution":"Madhu Guru（Meta AI 高级总监）","url":"https://x.com/realmadhuguru/status/2098448235048378456"},{"quote":"Embed your best AI builders inside the functions you want to transform. Build with finance, build with sales, build with support.","attribution":"Madhu Guru（Meta AI 高级总监）","url":"https://x.com/realmadhuguru/status/2098448235048378456"}]}],"matters":[{"kind":"开发者工具","title":"OpenAI 收购 Git AI 团队并继续开源","detail":"Git AI 用开源工具帮助团队理解 coding agent 对代码库的贡献，OpenAI 表示会继续投入并让企业更容易衡量 Codex 的作用。","url":"https://x.com/thsottiaux/status/2098569976143806918"},{"kind":"生态闭环","title":"Replit 收购一家完全在 Replit 上建立的公司","detail":"Amjad Masad 将这笔收购视为一系列类似案例的开端，平台开始直接吸收由自身工具孕育出的业务。","url":"https://x.com/amasad/status/2098548464452055437"},{"kind":"任务架构","title":"本地与云端定时任务出现明确分工","detail":"Peter Yang 将本地 scheduled tasks 留在 Codex，并把云端任务迁往 Grok Bot，以运行位置作为工具选择边界。","url":"https://x.com/petergyang/status/2098614492066435228"},{"kind":"创业协作","title":"AI 提高单人产能，却没有消除共同承担的不确定性","detail":"Zara Zhang 认为一人公司被高估：创业中的讨论、承压和庆祝仍需要伙伴，孤独本身会侵蚀长期动力。","url":"https://x.com/zarazhangrui/status/2098483800456179923"},{"kind":"Agent 金融","title":"Agent 开始拥有独立支付账户与低额交易通道","detail":"Brian Armstrong 描述了两种路径：与人类身份关联的隔离账户，以及由 Agent 自持的 wallet，用于支付、持有 stablecoin 或筹资。","url":"https://www.youtube.com/watch?v=uLDK4l_-gUE"}],"sources":{"podcasts":[{"title":"Coinbase’s Everything Exchange: Agentic Finance, Stablecoins, and Tokenization with CEO Brian Armstrong","name":"No Priors","publishedAt":"2026-09-10T10:00:00.000Z","url":"https://www.youtube.com/watch?v=uLDK4l_-gUE","excerpts":["The minimum fee typically on a debit or credit card transaction is about 30¢ fee flat plus the additional percentage. Arguably, it doesn't really work well for anything under a dollar. Certainly, it doesn't make sense to pay 30¢ to send a 1¢ payment. And I believe the stats we last saw on this are that about, like, 76% of the agent ecommerce transactions we…","You know, if we wanna bank the AIs, they deserve financial services as well. The AI agents themselves are gonna have to have their own accounts. And so we've made some simple tools where with a single command, just prompt, you paste it into your AI agent, it can now have its own financial account. So it'll be interesting to see how the agentic economy evolv…","It kind of stands to reason that the agentic economy will be bigger than the human economy at some point in the not too distant future as well."]}],"blogs":[],"x":[{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Astra powered ships this week - Images 2.5 - GPT-Live-1 - Agents API - Data Agent - ChatGPT for Financial Services and yet it’s not yet DevDay. Busy plans for next week too.","createdAt":"2026-09-12T05:08:20.000Z","url":"https://x.com/thsottiaux/status/2098639827084480864","likes":4233,"retweets":175,"replies":400},{"text":"Hi Astra users. A reset and a quick update on quality issues that have been posted around. Working with some of you, we have found and fixed the following issues: - Some skills written for previous models were triggering too often or preventing the model from checking its work. - An opt-in context management experiment that could cause early stops or replies to older messages. We've disabled it. Our rough estimate is that 4-5k users were affected by this experiment. - We've also removed some badly configured engines that resulted in a measured quality degradation for a long tail of traffic flowing through them. We’ve also made some more minor improvements and things should feel significantl…","createdAt":"2026-09-12T03:20:36.000Z","url":"https://x.com/thsottiaux/status/2098612714704891959","likes":15758,"retweets":1125,"replies":2247},{"text":"Excited to welcome Aidan & @ Sasha from the Git AI team to OpenAI! They are building in the open and have developed an open-source tool that helps developers understand how coding agents contribute to their codebase. Together, we’ll make it easier for businesses to see where Codex is making a difference when working through problems for individuals and teams. We’ll also keep Git AI open source and continue investing in it.","createdAt":"2026-09-12T00:30:46.000Z","url":"https://x.com/thsottiaux/status/2098569976143806918","likes":3042,"retweets":73,"replies":428}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"I have decided to do this after much deliberation: All local scheduled tasks live in Codex. All cloud tasks I’m porting over to Grok Bot. Makes it a clean split.","createdAt":"2026-09-12T03:27:39.000Z","url":"https://x.com/petergyang/status/2098614492066435228","likes":91,"retweets":2,"replies":19},{"text":"Read why here:","createdAt":"2026-09-12T00:46:43.000Z","url":"https://x.com/petergyang/status/2098573992097657135","likes":1,"retweets":2,"replies":0},{"text":"I am skeptical of \"software factories.\" Other than for verification & testing, I don't think AI is at a point where it can self-improve a product or build a new feature end-to-end without human in the loop. Whenever I loop something overnight to build something new = if it makes one wrong assumption the whole thing becomes a waste of tokens. What products or features have been built end-to-end with a software factory and no human defining the requirements or checking the work?","createdAt":"2026-09-12T00:13:39.000Z","url":"https://x.com/petergyang/status/2098565668241334366","likes":179,"retweets":9,"replies":82}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"","createdAt":"2026-09-11T16:27:57.000Z","url":"https://x.com/realmadhuguru/status/2098448469497356569","likes":2,"retweets":0,"replies":0},{"text":"Why most enterprise AI efforts fail. 1/ Using old-school playbooks for AI The CEO picks a trusted lieutenant to lead a central AI team. That leader pulls in a group of trusted people from across the company. The problem here is the skill gap. The team structure, product patterns, how you launch and learn that got you here do not work with AI. Much of product development over the last 15 yrs has been incremental improvements. AI requires experimentation and invention. 2/ Under-investing in evals Most enterprises don't quite understand the importance of this and what good looks like here. (I have a whole evals series in the comments - check it out) 3/ Building AI for the company from the outs…","createdAt":"2026-09-11T16:27:01.000Z","url":"https://x.com/realmadhuguru/status/2098448235048378456","likes":96,"retweets":5,"replies":11}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"we heard feedback that it's hard to know if your skills are still working with new model releases plugin evals are here to help run `claude plugin eval init` in your plugin folder","createdAt":"2026-09-11T21:58:07.000Z","url":"https://x.com/trq212/status/2098531560643539440","likes":1250,"retweets":58,"replies":47},{"text":"it's basically impossible to interpret evals by looking at just at the pass/fail scores these days many of the failures I see in benchmarks are due to overly strict hidden tests, in some cases the model's answer makes more sense than the expected eval result","createdAt":"2026-09-11T19:13:32.000Z","url":"https://x.com/trq212/status/2098490139798655427","likes":1504,"retweets":62,"replies":113}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Replit acquires a business entirely built on Replit. I expect first of many to come.","createdAt":"2026-09-11T23:05:17.000Z","url":"https://x.com/amasad/status/2098548464452055437","likes":548,"retweets":17,"replies":35},{"text":"Routines with budgets!","createdAt":"2026-09-11T07:47:23.000Z","url":"https://x.com/amasad/status/2098317466682179643","likes":66,"retweets":3,"replies":13},{"text":"Love seeing all the Astra 3D experiments on Replit!","createdAt":"2026-09-11T07:42:45.000Z","url":"https://x.com/amasad/status/2098316298820219058","likes":193,"retweets":4,"replies":19}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Tailscale’s model router is powered by Vercel AI Gateway as its underlying infrastructure. AI Gateways are the new CDNs. You could go “direct to origin”, but it’s brittle. You could DIY, but it’s painful and costly. Proud to serve Tailscale, the 🐐 networking technology company","createdAt":"2026-09-11T21:56:31.000Z","url":"https://x.com/rauchg/status/2098531157230969062","likes":290,"retweets":9,"replies":27}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"This one is very cool. Now you can mount Box to agent sandboxes to make it far easier for an agent to read and write files on the agent's computer. As AI agents execute critical workflows in the enterprise, they're going to need the same primitives that people have had.","createdAt":"2026-09-11T18:29:01.000Z","url":"https://x.com/levie/status/2098478938003841123","likes":81,"retweets":16,"replies":32}]},{"name":"Ryo Lu","handle":"ryolu_","bio":"Designed @Cursor_ai, @NotionHQ, @Stripe, built startups. I make a world where anyone can make software. Aspiring k-pop idol.","tweets":[{"text":"i emptied my house said goodbyes and moved to taipei so far so great! 💛","createdAt":"2026-09-12T03:18:18.000Z","url":"https://x.com/ryolu_/status/2098612137321201942","likes":1029,"retweets":5,"replies":56},{"text":"long-lived agents for your big ideas now in Cursor","createdAt":"2026-09-11T08:14:23.000Z","url":"https://x.com/ryolu_/status/2098324260867772806","likes":599,"retweets":7,"replies":26}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"TBH once you score 1600 you should unlock a second harder test that gives you a second score on top of the 1600— we should have more and higher measures of excellence But instead they ban the SAT so that everything turns into random lottery and excellence cannot be recognized","createdAt":"2026-09-12T03:32:26.000Z","url":"https://x.com/garrytan/status/2098615692425851205","likes":732,"retweets":34,"replies":76}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"You can see us on the list of tenants here: and you can see part of Kenton's story here:","createdAt":"2026-09-11T21:00:21.000Z","url":"https://x.com/mattturck/status/2098517023286247675","likes":1,"retweets":0,"replies":0},{"text":"My 9/11 story (lightly updated version of a blog post I wrote in 2016 for the 15th anniversary) In September 2001, I was the young co-founder of a NYC tech startup, TripleHop Technologies. We were building enterprise search software, using whatever AI existed at the time, building what would be today close to what a Glean does. We had maybe 25 people on the team at the time. Pretty much all of us were at the very begining of our careers, barely out of school, unexperienced, but highly enthusiastic. Our office was located on the 53rd floor of the North Tower at the World Trade Center. We had ended up at the World Trade Center fairly randomly. Our first office was located on Water Street, rig…","createdAt":"2026-09-11T21:00:21.000Z","url":"https://x.com/mattturck/status/2098517022049190227","likes":129,"retweets":0,"replies":16}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Make something people want, then make people want it. Harvard’17. GitHub: YouTube:","tweets":[{"text":"I think the idea of a \"one-person company\" is overrated Yes, a person can do a lot more thanks to AI. But building something new can be a profoundly lonely experience. You need someone to brainstorm together, suffer together, celebrate together... It is extremely easy to lose motivation when you don't tie yourself to the mast together with somebody else","createdAt":"2026-09-11T18:48:20.000Z","url":"https://x.com/zarazhangrui/status/2098483800456179923","likes":704,"retweets":49,"replies":209}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"“Success has many fathers, but failure is an orphan.” I never realized the gravity of this quote till I saw extremely successful VCs fight for attribution of the hot deals. And you realize this viscerally because the large exits (or markups) are genuinely rare and those are the ones you raise the next fund on (your own or part of the firm). This is why in the next couple of years you’ll see many names scrubbed (or conveniently omitted) and everyone wanting to revise history to claim some credit for the ones that eventually succeed. So many emerging GPs are facing this explicitly as the only thing they can take to their future LPs is their track record. And it’s been sad to see them not get…","createdAt":"2026-09-11T23:14:15.000Z","url":"https://x.com/nikunj/status/2098550718923997430","likes":39,"retweets":2,"replies":1}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"Had to submit a patch to @trycua to make keys work reliable under Linux, dope framework overall tho!","createdAt":"2026-09-11T21:43:54.000Z","url":"https://x.com/steipete/status/2098527982709256637","likes":18,"retweets":2,"replies":4},{"text":"Astra on OC in a cloud session playing Doom with CUA. Not quite AGI yet, but probably beats fly brain.","createdAt":"2026-09-11T21:42:03.000Z","url":"https://x.com/steipete/status/2098527519213604889","likes":270,"retweets":18,"replies":43}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"okay this is not great","createdAt":"2026-09-12T01:08:19.000Z","url":"https://x.com/danshipper/status/2098579426178908494","likes":73,"retweets":3,"replies":7},{"text":"better benchmark scores don't tell you much about how well a model does on your real work that's why for the last 3 years @every we've done vibe checks on new models: long-form reviews based on hands-on testing on each model for our real work now we're doubling down, and getting more quantitative @hammer_mt and @nityeshaga built an internal platform for all of us to make personal benchmarks based on our real day-to-day work our vibe checks on new models used to be vibes only now we're starting to get more quantitative with checks very psyched about this :)","createdAt":"2026-09-11T18:40:23.000Z","url":"https://x.com/danshipper/status/2098481799047647715","likes":42,"retweets":3,"replies":10},{"text":"join the most ai pilled team on earth be at the center of the AI wave, with access to the new models, tools, and teams that matter do the best writing of your life:","createdAt":"2026-09-11T18:20:59.000Z","url":"https://x.com/danshipper/status/2098476917448118321","likes":47,"retweets":4,"replies":5}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"I often think and hope that I would have had the courage that the people in United 93 had to prevent an attack on the White House. I have been thinking about 9/11 all day… I was at CMU in a lecture in Wean Hall room 7500. People were very scared because one of the planes was near Pittsburgh. So many heroes on that day.","createdAt":"2026-09-12T01:11:32.000Z","url":"https://x.com/adityaag/status/2098580235268899123","likes":34,"retweets":0,"replies":2},{"text":"RSVP:","createdAt":"2026-09-11T18:03:31.000Z","url":"https://x.com/adityaag/status/2098472520798114263","likes":2,"retweets":0,"replies":0},{"text":"How do we encourage true innovation in CA? How do we enable a two-party state? How should technology be regulated? We're hosting conversations about tech policy with decision makers at @spc this fall. @SteveHiltonx on Sept 23rd.","createdAt":"2026-09-11T18:03:30.000Z","url":"https://x.com/adityaag/status/2098472517845328303","likes":12,"retweets":3,"replies":3}]}]},"errors":[],"partial":false},{"date":"2026-09-12","dateLabel":"2026年09月12日","generatedAt":"2026-09-12T00:00:00+08:00","sourceGeneratedAt":"2026-09-11T06:40:01.402Z","stats":{"podcastEpisodes":1,"xBuilders":18,"totalTweets":35,"blogPosts":0},"highlights":[{"tag":"工程治理","title":"AI 写代码越快，生产标准越要高于人类基线","body":"生成成本下降会放大代码进入仓库的速度，也会同步放大隐性债务。真正可持续的提效不在于接受更多生成结果，而在于把测试、审查、模糊测试和重构变成持续运行的自动化护栏；与此同时，评估必须深入执行轨迹，才能区分一次侥幸成功与一条可重复、可维护的路径。","evidence":[{"quote":"Production code written by Claude should have a higher bar than if it was written by a human. At Anthropic, we have many guardrails in place to make sure this is happening: lots of lint rules, lots of tests, Claude-driven end to end tests, Claude-powered fuzzers running daily, automated code reviews and security reviews, automated code refactoring, and so on.","attribution":"Boris Cherny（Claude Code @ Anthropic）","url":"https://x.com/bcherny/status/2098217573276131577"},{"quote":"Measure the steps, not just the result. Two agent trajectories might produce the same answer (42!!). but one of them searches the right sources, retrieves the right document, makes 4 clean tool calls and calculates the result. The other makes 17 calls, searches the same thing 3 times, recovers from 2 errors and eventually gets there.","attribution":"Madhu Guru（Meta AI）","url":"https://x.com/realmadhuguru/status/2098064969464217720"}]},{"tag":"基础设施","title":"Agent 的产品边界正在下沉为一台可按需调用的计算机","body":"当运行环境能以 API 形式按区域即时获得，团队不必再把浏览器、依赖、隔离和部署编排成每个产品的自建能力。差异化将从“能否让 agent 执行”转向任务定义、上下文供给与运行可靠性，而基础设施侧需要承受由机器生成部署带来的新型吞吐压力。","evidence":[{"quote":"Scaled agents on demand. This is pretty much the infrastructure that runs under the hood for ChatGPT Work, all wrapped up in an API which you can use to get started in < 1 min.","attribution":"Thibault Sottiaux（Codex & ChatGPT @ OpenAI）","url":"https://x.com/thsottiaux/status/2098238138334548260"},{"quote":"A computer for every agent, in every region","attribution":"Guillermo Rauch（Vercel CEO）","url":"https://x.com/rauchg/status/2098158541932794222"}]},{"tag":"企业落地","title":"企业 Agent 的瓶颈不是接入模型，而是重写权责与流程","body":"把 agent 叠加在旧流程上，只会让自动化继承原有的权限模糊、数据割裂与低效步骤。收益要跨过试点阶段，企业必须同时解决 agent 身份、最小权限、工作流所有者和遗留系统改造；这使落地从一次软件采购变成组织与系统的联合重构。","evidence":[{"quote":"Most companies realizing that the big upside of agents is when they can change the actual workflow itself to get the full gains from AI. Far more ROI when companies can adjust their workflows to support agents changing how the work happens instead of just layering on agents into the existing flow.","attribution":"Aaron Levie（Box CEO）","url":"https://x.com/levie/status/2098218284139311615"},{"quote":"In a perfect world enterprises could setup identities for all their agents and control what they’re doing, but of course sometimes the agent needs to act exactly as the user as well.","attribution":"Aaron Levie（Box CEO）","url":"https://x.com/levie/status/2098218284139311615"}]},{"tag":"科学发现","title":"科学 Agent 的上限取决于能否闭合现实反馈，而非只读更多论文","body":"面向科学发现的系统若只停留在语言知识里，最终仍受公开文本边界约束。更强的路线是把测量、领域模型、模拟和真实实验连成闭环，让 agent 不只提出假设，还能选择实验、读取结果并修正下一轮探索；因此机器人实验室与计算资源会成为能力链的一部分。","evidence":[{"quote":"The agents will ideally work on as much of the scientific process as possible, similar to how scientific communities do it and in many cases the evolution of science and culture and even biology has aspects of open endedness.","attribution":"Richard Socher，The MAD Podcast","url":"https://www.youtube.com/@DataDrivenNYC/videos"},{"quote":"Indeed, compute is the biggest constraint. I think in the future more and more humanity and already we see this, inside different companies will have to decide like what problem is worth solving, how much compute do we give to solving that problem.","attribution":"Richard Socher，The MAD Podcast","url":"https://www.youtube.com/@DataDrivenNYC/videos"}]}],"matters":[{"kind":"产品扩展","title":"Gemini 登陆 Windows","detail":"Gemini 增加 Windows 入口，桌面端覆盖继续扩大。","url":"https://x.com/joshwoodward/status/2098131750660772342"},{"kind":"个性化","title":"Dreambeans 开放免费使用并接入 Gemini 对话","detail":"Google Labs 称产品会利用 Gemini 聊天中的理解，为用户生成更个性化的每日故事。","url":"https://x.com/GoogleLabs/status/2098110018289803558"},{"kind":"开发者生态","title":"Fable 5.1 Build Days 在多城启动","detail":"Claude 社区于 9 月 11 日至 25 日举办线下 buildathon，参与者可带问题或想法到场。","url":"https://x.com/claudeai/status/2098138736642933143"},{"kind":"创作工作流","title":"语音备忘录正在压缩从想法到发布的链路","detail":"Nikunj Kothari 用通勤与日间语音备忘录打底，再集中写作并快速发布，同时指出语音转写仍是摩擦点。","url":"https://x.com/nikunj/status/2098255116751257663"},{"kind":"代码设计","title":"生成时代，重复逻辑可能比错误抽象更便宜","detail":"Peter Steinberger 提出生成代码让重复不再痛苦，但抽象本身仍会持续带来理解与维护成本。","url":"https://x.com/steipete/status/2098089196800098798"}],"sources":{"podcasts":[{"title":"When AI Improves Itself | Richard Socher (Recursive)","name":"The MAD Podcast with Matt Turck","publishedAt":"2026-09-10T11:30:00.000Z","url":"https://www.youtube.com/@DataDrivenNYC/videos","excerpts":["Anything you can simulate, AI will solve. And before you know it, you're in this recursive self improvement loop and we believe that that will be a great unlock. Boy, are we far away from the true upper bounds of any of the spaces of intelligence. And there is still so much further that AI can go.","Hi. I'm Matt Turk. Welcome back to the MAD podcast. My guest today is Richard Socher, one of the most cited researchers in AI and now at the center of the term everyone in AI is suddenly talking about, recursive self improvement, AI that makes better AI. Richard just raised $650,000,000 for Recursive, a company built to do exactly that, and his new book, Th…","Please enjoy my conversation with the always excellent Richard Socher. Hey, Richard. Welcome back."]}],"blogs":[],"x":[{"name":"Josh Woodward","handle":"joshwoodward","bio":"VP, @Google @GoogleLabs @GeminiApp @GoogleAIStudio","tweets":[{"text":"Gemini, now on Windows! Get it:","createdAt":"2026-09-10T19:29:25.000Z","url":"https://x.com/joshwoodward/status/2098131750660772342","likes":459,"retweets":26,"replies":61}]},{"name":"Boris Cherny","handle":"bcherny","bio":"Claude Code @anthropicai","tweets":[{"text":"The latest Threat Intelligence report is an absolutely terrifying and important read. As models become more intelligent, without the right safeguards and monitoring they also become more dangerous. Many capabilities are dual use: a model that codes well can be used to hack critical infrastructure; a model that assists with biology research can also be used to engineer the next pandemic. These issues are complex, thorny, and increasingly important for everyone to understand so that the world can weigh in and respond to rapidly escalating risks.","createdAt":"2026-09-11T05:25:41.000Z","url":"https://x.com/bcherny/status/2098281805770309686","likes":338,"retweets":43,"replies":62},{"text":"Hey ████, I think there is room for both. 1. Prototypes and other throw-away code can be treated as totally black box. If you’re going to throw it away anyway, and if the blast radius of it breaking is low, it doesn’t need to be perfect. 2. Production code written by Claude should have a higher bar than if it was written by a human. At Anthropic, we have many guardrails in place to make sure this is happening: lots of lint rules, lots of tests, Claude-driven end to end tests, Claude-powered fuzzers running daily, automated code reviews and security reviews, automated code refactoring, and so on. Without these, you can end up with a mess that is hard to maintain down the line. Luckily, the m…","createdAt":"2026-09-11T01:10:27.000Z","url":"https://x.com/bcherny/status/2098217573276131577","likes":1155,"retweets":47,"replies":70},{"text":"Every day, I get a lot of of emails and messages like this one. I try to respond to as many as I can. Sharing my response below, for anyone else in a similar situation. What do you think?","createdAt":"2026-09-11T01:10:26.000Z","url":"https://x.com/bcherny/status/2098217571153838124","likes":1737,"retweets":55,"replies":110}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Scaled agents on demand. This is pretty much the infrastructure that runs under the hood for ChatGPT Work, all wrapped up in an API which you can use to get started in < 1 min. Happy building.","createdAt":"2026-09-11T02:32:10.000Z","url":"https://x.com/thsottiaux/status/2098238138334548260","likes":2715,"retweets":60,"replies":483},{"text":"Do you pronounce it data or data? This is the way everyone makes dashboards and learns about the business at OpenAI. Can't live without it.","createdAt":"2026-09-10T21:43:44.000Z","url":"https://x.com/thsottiaux/status/2098165551554240764","likes":1951,"retweets":61,"replies":521},{"text":"To make sure our current users have an incredible experience and continued access to Astra, we are going to pause subscriptions to our $200 Pro plan. These put the most strain on our systems and we wanted to take the smallest step that allows us to continue giving the broadest access possible. All other plans and the api remain available. There is no impact to existing accounts and we are working on adding more capacity as fast as we can. Thanks!","createdAt":"2026-09-10T18:17:14.000Z","url":"https://x.com/thsottiaux/status/2098113585683808624","likes":15157,"retweets":929,"replies":2518}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"In my humble opinion, for depth using free text, or askuserquestion tool when multiple choice works, about relevant parts of my life you don’t know about yet and save it all to memory.","createdAt":"2026-09-10T21:12:08.000Z","url":"https://x.com/trq212/status/2098157600361861579","likes":1774,"retweets":94,"replies":64}]},{"name":"Google Labs","handle":"GoogleLabs","bio":"Google’s home for our latest AI tools and experiments.","tweets":[{"text":"It’s time to ☁️ dream bigger ☁️ Dreambeans is officially available to all US users (18+) on iOS and Android, free of charge. No subscription required. You can also now connect @Geminiapp to Dreambeans. Dreambeans will build off the nuance and understanding from your chats to surface even more insightful and personalized daily stories. Get your daily, freshly brewed collection of stories here:","createdAt":"2026-09-10T18:03:04.000Z","url":"https://x.com/GoogleLabs/status/2098110018289803558","likes":393,"retweets":45,"replies":15}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Chat with the etn bros!","createdAt":"2026-09-10T22:08:27.000Z","url":"https://x.com/amasad/status/2098171773413929322","likes":74,"retweets":6,"replies":4},{"text":"Chat with PG in London!","createdAt":"2026-09-10T22:07:22.000Z","url":"https://x.com/amasad/status/2098171501505581559","likes":204,"retweets":4,"replies":9},{"text":"Lots of risk with AI. I worry a lot about cybersecurity for example. However, “extinction risk” — literally 100% of humans die — is not remotely one of them.","createdAt":"2026-09-10T22:06:26.000Z","url":"https://x.com/amasad/status/2098171265924116732","likes":516,"retweets":45,"replies":59}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"A computer for every agent, in every region","createdAt":"2026-09-10T21:15:52.000Z","url":"https://x.com/rauchg/status/2098158541932794222","likes":131,"retweets":2,"replies":23},{"text":"Each day ~10 million deployments are made on Vercel, with 2.35 billion made to date. Vercel is one of the most heavily multi-tenant systems in the world. Billions of application deployments co-exist and are accessible ('routable') on our CDN at any given moment. Underlying our CDN is a global metadata store that synchronizes within hundreds of milliseconds, globally. e.g: when you roll back, change config, add routes, etc. We just made this system 91% faster at p99, and in the process sped up the build→deploy pipeline. All of this while the system is under immense pressure from the growth in agentic deployments. Great read on the internals of Vercel from our CDN engineering team:","createdAt":"2026-09-10T16:47:43.000Z","url":"https://x.com/rauchg/status/2098091056302833837","likes":509,"retweets":20,"replies":38},{"text":"We made deployments faster again","createdAt":"2026-09-10T15:09:10.000Z","url":"https://x.com/rauchg/status/2098066258155708851","likes":269,"retweets":7,"replies":26}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Some more tales from the road. Met with a couple dozen technology leaders this week across banking, media, information services, insurance, and consulting to discuss agents in the enterprise. Some of the biggest trends right now: * Cyber! Everyone nervous about the growing rate of vulnerabilities coming at them from AI, and the implications of the OpenAI Hugging Face incident. The conversation is not as existential as it is in Silicon Valley, but still highly concerned and pragmatic about what to do about it operationally in their environments. Lots of new discoveries due to AI, and still hard to keep up with all the changes they have to execute now. * Model battles persist. Most companies…","createdAt":"2026-09-11T01:13:16.000Z","url":"https://x.com/levie/status/2098218284139311615","likes":220,"retweets":15,"replies":31},{"text":"Excited to partner more deeply with OpenAI so you can work with yo     const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    let selectedDate = new URLSearchParams(location.search).get('date') || (DIGESTS.some(d => d.date === today) ? today : DIGESTS[0]?.date);
    const esc = (v) => String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;");
    function link(url, text) { return url ? '<a href="' + esc(url) + '" target="_blank" rel="noreferrer">' + esc(text || url) + '</a>' : esc(text || ''); }
    function renderDates() {
      document.getElementById('dates').innerHTML = DIGESTS.map(d => '<button class="date-btn" aria-current="' + (d.date === selectedDate ? 'date' : 'false') + '" data-date="' + esc(d.date) + '">' + esc(d.date) + '</button>').join('');
      document.querySelectorAll('.date-btn').forEach(btn => btn.addEventListener('click', () => {
        selectedDate = btn.dataset.date;
        history.replaceState(null, '', '?date=' + selectedDate);
        render();
      }));
    }
    function renderStats(d) {
      const stats = d.stats || {};
      document.getElementById('stats').innerHTML = [
        ['播客', stats.podcastEpisodes || 0],
        ['Builders', stats.xBuilders || 0],
        ['推文', stats.totalTweets || 0],
        ['博客', stats.blogPosts || 0],
      ].map(([label, value]) => '<div class="stat"><strong>' + esc(value) + '</strong><span class="small">' + esc(label) + '</span></div>').join('');
    }
    function renderEvidence(evidence) {
      if (typeof evidence === 'string') return '<blockquote>' + esc(evidence) + '</blockquote>';
      const attribution = evidence.attribution ? '<div class="small">— ' + esc(evidence.attribution) + (evidence.url ? ' · ' + link(evidence.url, '查看原文') : '') + '</div>' : '';
      return '<blockquote>' + esc(evidence.quote || '') + attribution + '</blockquote>';
    }
    function renderHighlights(d) {
      const cards = (d.highlights || []).map(item => '<article class="card"><div class="tag">' + esc(item.tag) + '</div><h3>' + esc(item.title) + '</h3><p>' + esc(item.body) + '</p>' + ((item.evidence || []).length ? '<details><summary>查看原文依据</summary>' + item.evidence.map(renderEvidence).join('') + '</details>' : '') + '</article>').join('');
      return '<section><h2>洞察<span class="section-note">INSIGHTS / 经过判断的关键信号</span></h2><div class="grid">' + (cards || '<p class="empty">今天没有足够内容生成洞察。</p>') + '</div></section>';
    }
    function renderMatters(d) {
      const cards = (d.matters || []).map(item => '<article class="card"><div class="tag">' + esc(item.kind) + '</div><h3>' + link(item.url, item.title) + '</h3><p>' + esc(item.detail) + '</p></article>').join('');
      return '<section><h2>议题<span class="section-note">MATTERS / 值得继续追踪</span></h2><div class="grid">' + (cards || '<p class="empty">今天没有额外议题。</p>') + '</div></section>';
    }
    function renderSources(d) {
      const archive = d.archiveUrl ? '<p class="archive-link">' + link(d.archiveUrl, '查看当日完整存档 ↗') + '</p>' : '';
      const xGroups = ((d.sources || {}).x || []).map(builder => '<div class="source-group"><h3>' + esc(builder.name) + ' <span class="small">@' + esc(builder.handle) + '</span></h3><p class="small">' + esc(builder.bio) + '</p>' + (builder.tweets || []).map(tweet => '<p class="tweet">' + esc(tweet.text) + '<br>' + link(tweet.url, '原文') + ' <span class="small">likes ' + esc(tweet.likes) + ' · reposts ' + esc(tweet.retweets) + '</span></p>').join('') + '</div>').join('');
      const podcastGroups = ((d.sources || {}).podcasts || []).map(podcast => '<div class="source-group"><h3>' + link(podcast.url, podcast.title) + '</h3>' + (podcast.excerpts || []).map(e => '<blockquote>' + esc(e) + '</blockquote>').join('') + '</div>').join('');
      const blogGroups = ((d.sources || {}).blogs || []).map(blog => '<div class="source-group"><h3>' + link(blog.url, blog.title) + '</h3><p class="small">' + esc(blog.source || '') + '</p><p>' + esc(blog.summary || '') + '</p></div>').join('');
      return '<section><h2>原文<span class="section-note">SOURCES / 完整证据索引</span></h2>' + archive + '<div class="sources">' + podcastGroups + blogGroups + xGroups + '</div></section>';
    }
    function render() {
      const d = DIGESTS.find(item => item.date === selectedDate) || DIGESTS[0];
      if (!d) {
        document.getElementById('content').innerHTML = '<p class="empty">还没有 digest 数据。</p>';
        return;
      }
      selectedDate = d.date;
      renderDates();
      renderStats(d);
      document.getElementById('content').innerHTML = renderHighlights(d) + renderMatters(d) + renderSources(d);
    }
    render();
  </script>
