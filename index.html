e the opportunity lies. You have a technology that will tirelessly do all the things that you could never fully do before. Not because you didn’t want to or it wasn’t valuable, but because it was just not even remotely practical. The upside with AI is to think about everything you can now throw intelligence at that won’t give up and what would the returns be. You just couldn’t possibly find every security vulnerability in your codebase, because you couldn’t simulate every risk vector. You couldn’t read every contract or document to process the data and capture it to query later. You couldn’t comb through your customer base and lo…","createdAt":"2026-08-17T04:34:07.000Z","url":"https://x.com/levie/status/2089209131391729763","likes":88,"retweets":5,"replies":17},{"text":"AI spend is nowhere close to hitting any walls. Obviously this data is weighted toward engineering-centric companies, with the top 1% spending $7,500/mo and top 10% spending $660/mo per employee on AI. But the general trend of continued exponential growth is occurring throughout all firm types. And what the top 10% is doing today may easily be what the top 50% is doing in 3 years from now, at least in terms of token volume if not in dollars. This is why there’s still so much opportunity right now in the diffusion of AI in the enterprise. Especially as token costs come down, we will throw larger portions of work at agents. They’ll be scanning all our code for security issues, testing all of…","createdAt":"2026-08-16T14:26:30.000Z","url":"https://x.com/levie/status/2088995821056659901","likes":361,"retweets":50,"replies":58}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Everyone go follow this guy on instagram, he's amazing","createdAt":"2026-08-16T15:34:30.000Z","url":"https://x.com/garrytan/status/2089012934953599263","likes":20,"retweets":0,"replies":0},{"text":"There's nothing more conservative than a liberal with a house.","createdAt":"2026-08-16T15:34:00.000Z","url":"https://x.com/garrytan/status/2089012811007688746","likes":322,"retweets":17,"replies":27}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"What are your favorite technical papers that you have read end to end this year? And separately what are the most riveting reads (scifi ideally) that I should read this year? I try to parallelize both to keep things interesting 😅","createdAt":"2026-08-17T04:48:20.000Z","url":"https://x.com/nikunj/status/2089212708621291766","likes":3,"retweets":1,"replies":2}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"Was wondering what this new icon in my menu bar is that I didn't enable and that loaded a slow html box. Time for Chrome Lite?","createdAt":"2026-08-17T00:55:07.000Z","url":"https://x.com/steipete/status/2089154019885490449","likes":147,"retweets":4,"replies":33}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"i am also skeptical of the centralization of power hypothesis it comes from Lewis Mumford in 1964 who argued: \"from late Neolithic times in the Near East, right down to our own day, two technologies have recurrently existed side by side: one authoritarian, the other democratic, the first system-centered, immensely powerful, but inherently unstable, the other man-centered, relatively weak, but resourceful and durable.\" this echoes around the valley. peter thiel said in 2018, \"crypto is libertarian and AI is communist\" certainly today, it seems like we're on track for AI to look more centralized. if you are a hardcore AGI person you believe this will continue. but we're also seeing a resurgen…","createdAt":"2026-08-16T23:11:12.000Z","url":"https://x.com/danshipper/status/2089127868903375257","likes":27,"retweets":3,"replies":8},{"text":"used fable to vibe code an app that visualizes and groups everyone who applied to come to Thesis we live in incredible times where detailed understanding of each of your customers—and how they cluster together in groups—is possible with very little effort","createdAt":"2026-08-16T22:46:17.000Z","url":"https://x.com/danshipper/status/2089121597017759800","likes":88,"retweets":0,"replies":13}]}]},"errors":[],"partial":false},{"date":"2026-08-17","dateLabel":"2026年08月17日","generatedAt":"2026-08-17T00:00:00+08:00","sourceGeneratedAt":"2026-08-16T06:27:46.023Z","stats":{"podcastEpisodes":1,"xBuilders":12,"totalTweets":23,"blogPosts":0},"highlights":[{"tag":"产品范式","title":"消费级 AI 的下一次爆发，先拼的不是更强模型，而是把高手经验做成可流动的社交层","body":"今天最明确的共同信号，是会用的人已经能拉开巨大差距，但这种差距还没有被产品化地分发出去。如果用户仍要靠自写 custom instructions、手抄 prompt、外部社区找范式，那说明竞争焦点正在从底层能力转向经验分发。谁先把优秀用法做成可发现、可跟随、可复用的网络，谁更可能把 AI 从单人高手玩具推成大众产品。","evidence":[{"quote":"Custom GPTs and chat GPT feels criminal to me. It's clearly made by a team that is unbelievably capable but isn't social. What's the multiplayer network effect type experience? Someone's gonna create a UGC type community where there are people who are really, really good, make it so much easier for the rest of us.","attribution":"Sarah（AI & I by Every）","url":"https://www.youtube.com/watch?v=dlI-5W7d7uU"},{"quote":"Most people use ChatGPT like they would use Google. The learning curve, the step function changes that happen when you have better custom instructions, when you have projects, whatever, are so huge. How do you democratize that?","attribution":"Sarah（AI & I by Every）","url":"https://www.youtube.com/watch?v=dlI-5W7d7uU"}]},{"tag":"商业模型","title":"模型价格战会把采购指标从单价拉回到结果成本","body":"按 token 单价比模型，会越来越像用切片数比披萨价格。只要 tokenizer、生成长度和成功率都不一致，采购侧就会被表面便宜误导。接下来更稳的决策方式不是看公开报价，而是把真实任务跑完后再看每次成功交付的成本；这会让评测、路由和 workload 细分比统一替换更重要。","evidence":[{"quote":"an OpenAI token != another model’s token. Different models use and produce the exact same text using different numbers of tokens, which means a lower price per token does not necessarily mean a lower bill.","attribution":"Thibault Sottiaux","url":"https://x.com/thsottiaux/status/2088866513008873560"},{"quote":"What actually matters is price per successful outcome, and for that you can use benchmarks as a starting point, but really you have to try it and measure on your own use cases.","attribution":"Thibault Sottiaux","url":"https://x.com/thsottiaux/status/2088866513008873560"}]},{"tag":"体验竞争","title":"企业软件的“先把功能堆上去再说”正在失效，AI 让糟糕 UX 直接暴露成产品债","body":"当连高阶用户都在抱怨“不该这么难”，说明复杂度已经开始吞噬价值。AI 一方面能替团队补齐交互和流程细节，另一方面也抬高了用户对顺滑体验的基线。结果不是大家都会变好，而是解释成本高、操作门槛高、默认路径差的产品，会更快被拿来与消费级体验直接比较。","evidence":[{"quote":"It shouldn't be this hard... We shouldn't have to put that in a custom instruction. There are so many different tweaks that we all have to get what we want out.","attribution":"Sarah（AI & I by Every）","url":"https://www.youtube.com/watch?v=dlI-5W7d7uU"},{"quote":"There is no longer an excuse for B2B software to have such poor UX. Thanks to AI, every software product can and should be as easy to use as the best consumer software.","attribution":"Madhu Guru","url":"https://x.com/realmadhuguru/status/2088710566689018103"}]},{"tag":"生产方式","title":"AI 原生工作流正在把“成品软件”拆成可被模型吸收和重混的素材链","body":"从组件到内容模板，价值正在从封闭成品转向可组合的中间层。只要模型能读懂某段代码、某组缩略图样本、某套上下文规则，产品就不必把一切都固化在单一界面里。未来更有势能的，不一定是功能最多的应用，而是最容易被模型接入、被团队二次重混的资产结构。","evidence":[{"quote":"Shadcn is what people actually wanted from React. Reusable high quality components that also tunable. It’s a pseudo-library. There’s code but it’s actually meant to be digested into your context window and remixed.","attribution":"Guillermo Rauch","url":"https://x.com/rauchg/status/2088757738037989755"},{"quote":"He uses Codex to find 100 top-performing thumbnails in his niche and add them to a Paper canvas. He uses Paper to mix and match those thumbnails with photos of himself until he creates something he’s happy with.","attribution":"Peter Yang","url":"https://x.com/petergyang/status/2088626815166464507"}]},{"tag":"护城河","title":"当信息差越来越薄，真正难抄的优势会回到关系、流程和落地摩擦","body":"如果头部从业者看到的公开信息与外界并没有本质不同，那么“知道什么消息”就不再构成长期壁垒。相反，难以复制的会是那些推进合同、拿下合作、嵌入行业流程的长期摩擦。这类阻力短期看像拖慢节奏，长期看却会把后来者挡在门外。","evidence":[{"quote":"top tier folks actually meet/know each other... what you see of the major headlines is pretty much what they also see. most effort is still on doing the work rather than working the narrative or the gossip.","attribution":"Swyx","url":"https://x.com/swyx/status/2088755688361378082"},{"quote":"critical contracts and partnerships... might cause them to not reach their ambitious timelines... in the long term becomes such a strong moat... building entrenched software and relationships that take a lot of pain is a moat.","attribution":"Nikunj Kothari","url":"https://x.com/nikunj/status/2088716743615352963"}]}],"matters":[{"kind":"产品接入","title":"Grok Bot 的 X 连接器与云端登录被用户质疑不可用","context":"Peter Yang 反馈，Grok Bot 最该打通的差异化数据源就是 X，但连接器失效，云端电脑里也无法登录 X；这类接入问题会直接削弱“用平台独有数据做助手”的卖点。","detail":"Peter Yang 反馈，Grok Bot 最该打通的差异化数据源就是 X，但连接器失效，云端电脑里也无法登录 X；这类接入问题会直接削弱“用平台独有数据做助手”的卖点。","url":"https://x.com/petergyang/status/2088773343629750535"},{"kind":"工具稳定性","title":"Codex Desktop 聊天报错开始被高可见度用户公开提问","context":"Garry Tan 公开询问是否有人在 Codex Desktop 聊天中遇到报错，说明稳定性问题至少已经进入公开讨论范围，而不只是私下个别抱怨。","detail":"Garry Tan 公开询问是否有人在 Codex Desktop 聊天中遇到报错，说明稳定性问题至少已经进入公开讨论范围，而不只是私下个别抱怨。","url":"https://x.com/garrytan/status/2088642982614651196"},{"kind":"研究传播","title":"Claude 被拿来做“无损水印”教学 artifact","context":"Thariq 分享了一个用 Claude 帮自己理解 watermarking without quality loss 的说明材料，信号不是功能发布，而是复杂技术正在被快速包装成可传播的学习资产。","detail":"Thariq 分享了一个用 Claude 帮自己理解 watermarking without quality loss 的说明材料，信号不是功能发布，而是复杂技术正在被快速包装成可传播的学习资产。","url":"https://x.com/trq212/status/2088721023223132213"},{"kind":"基础判断","title":"“AI 必然中心化”这一前提正在被 builder 公开反驳","context":"Amjad Masad 认为，把当前算力饥渴直接外推成长期中心化结论并不成立，因为算法与硬件效率还在改写成本曲线；这会继续影响大家对本地运行与平台权力结构的判断。","detail":"Amjad Masad 认为，把当前算力饥渴直接外推成长期中心化结论并不成立，因为算法与硬件效率还在改写成本曲线；这会继续影响大家对本地运行与平台权力结构的判断。","url":"https://x.com/amasad/status/2088867492907327573"}],"sources":{"podcasts":[{"title":"Why the Next Hit AI Product Will Be Social Why the Next Hit AI Product Will Be Social (Best of the Pod)","name":"AI & I by Every","publishedAt":"2026-08-05T16:02:13.000Z","url":"https://www.youtube.com/watch?v=dlI-5W7d7uU","excerpts":["Google was a founding team that was deeply, deeply technical. As the technology, the underlying technology got more mature, the slider goes forward, forward, forward, more towards the product thinker, product experience. Pinterest, where I was, Snap, Instagram. The CEOs weren't technical at all. They were product geniuses.","What are the big consumer wins so far in AI? Of course, it's ChatGPT, which is, in a way, not that dissimilar from Google in terms of what it was. Just a text box. Custom GPTs and and chat GPT feels criminal to me. It's clearly made by a team that is unbelievably capable but isn't social.","What's the multiplayer network effect type experience? Someone's gonna create a UGC type community where there are people who are really, really good, make it so much easier for the rest of us."]}],"blogs":[],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"in case you’re not living in the tech bubble, as a general rule i’ve been surprised by how infrequently top tier folks actually meet/know each other. as an outsider i might have assumed that everyone is in secret illuminati group chats. those exist, but are very much short lived exceptions rather than the rule. what you see of the major headlines is pretty much what they also see. i guess one way to interpret this is also simply that most effort is still on doing the work rather than working the narrative or the gossip. and that, to me at least, is genuinely quite reassuring, this far in to my career.","createdAt":"2026-08-15T22:32:17.000Z","url":"https://x.com/swyx/status/2088755688361378082","likes":233,"retweets":5,"replies":18}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"On tokens and prices per token. I said I’d write more about this, so here goes: an OpenAI token != another model’s token. We compare AI prices in dollars per million tokens as if a token were a standardized unit, like a gram or a kilowatt-hour. It isn’t. Different models use and produce the exact same text using different numbers of tokens, which means a lower price per token does not necessarily mean a lower bill. Imagine two identical pizzas. One is cut into 8 slices at $2 each. The other is cut into 16 slices at $1.25 each. The second place advertises cheaper slices, but the whole pizza costs $20 instead of $16. Bummer ... your stomach doesn't actually care about the number of slices you…","createdAt":"2026-08-16T05:52:40.000Z","url":"https://x.com/thsottiaux/status/2088866513008873560","likes":1006,"retweets":74,"replies":280},{"text":"If you have a company and still use Opus instead of Sol, why so? Does price not matter to you? What's something that would convince you to switch?","createdAt":"2026-08-16T04:51:00.000Z","url":"https://x.com/thsottiaux/status/2088850995430477882","likes":2607,"retweets":57,"replies":1503},{"text":"Incredible things are happening at OpenAI right now. Energy is high.","createdAt":"2026-08-15T20:32:23.000Z","url":"https://x.com/thsottiaux/status/2088725514542575903","likes":9357,"retweets":220,"replies":1264}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"I am a fan of Grok Bot but @X is the #1 differentiated data source that it should have access to and it doesn't seem to work? The connector doesn't work and I can't even login to X on the cloud computer. Am I doing something wrong?","createdAt":"2026-08-15T23:42:27.000Z","url":"https://x.com/petergyang/status/2088773343629750535","likes":137,"retweets":3,"replies":31},{"text":"I 100% agree with Dario that using AI to cure diseases (and speeding up the regulatory approval of AI breakthroughs in healthcare) could bring 10x the benefit to humanity as everything else combined.","createdAt":"2026-08-15T23:39:31.000Z","url":"https://x.com/petergyang/status/2088772605323214999","likes":71,"retweets":3,"replies":11},{"text":"Tomorrow, I’m really excited to share a new episode with @rileybrown on how he uses Codex to run his entire content business. I particularly loved watching him demo how he creates YouTube thumbnails with AI: 1. He uses Codex to find 100 top-performing thumbnails in his niche and add them to a Paper canvas. 2. He uses Paper to mix and match those thumbnails with photos of himself until he creates something he’s happy with. Honestly, you have to watch the workflow to see how crazy it is. 📌 Subscribe to get the full episode tomorrow:","createdAt":"2026-08-15T14:00:12.000Z","url":"https://x.com/petergyang/status/2088626815166464507","likes":94,"retweets":7,"replies":9}]},{"name":"Nan Yu","handle":"thenanyu","bio":"head of product @linear","tweets":[{"text":"These two were ahead of their time","createdAt":"2026-08-16T02:12:46.000Z","url":"https://x.com/thenanyu/status/2088811172090769461","likes":8,"retweets":0,"replies":1},{"text":"This is also my dream. I want to sit in a park all day and record content with the homies… and have a fleet of agents turn that content into actions and working software.","createdAt":"2026-08-16T02:10:45.000Z","url":"https://x.com/thenanyu/status/2088810666958196988","likes":18,"retweets":1,"replies":5},{"text":"Watches","createdAt":"2026-08-16T02:01:48.000Z","url":"https://x.com/thenanyu/status/2088808413744558266","likes":3,"retweets":0,"replies":1}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"There is no longer an excuse for B2B software to have such poor UX. Thanks to AI, every software product can and should be as easy to use as the best consumer software.","createdAt":"2026-08-15T19:33:00.000Z","url":"https://x.com/realmadhuguru/status/2088710566689018103","likes":55,"retweets":1,"replies":9}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"","createdAt":"2026-08-15T20:14:33.000Z","url":"https://x.com/trq212/status/2088721024825344289","likes":81,"retweets":4,"replies":6},{"text":"Watermarking without quality loss is a bit unintuitive, doesn't feel like it should work. I made this artifact with Claude to help me understand how it works, sharing in case it's helpful.","createdAt":"2026-08-15T20:14:33.000Z","url":"https://x.com/trq212/status/2088721023223132213","likes":2565,"retweets":128,"replies":427}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"The argument that “AI structurally centralizes power” because it’s currently compute hungry ignores 125 years of super exponential growth in compute price-performance. Improvement in algorithms and continued hardware efficiency gains means there is no reason to assume AGI-level capabilities will always require a data center to run. Scaling laws are not laws of physics. They’re simply empirical relationships observed for particular architectures, objectives, datasets etc. Change any one of those factors and you get a different scaling curve. If the brain is any guide, true AGI will likely be very efficient. In fact, current scaling laws might a bug and not a feature. It shows how inefficienc…","createdAt":"2026-08-16T05:56:34.000Z","url":"https://x.com/amasad/status/2088867492907327573","likes":21,"retweets":3,"replies":8}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Recursive self improvement","createdAt":"2026-08-16T04:00:34.000Z","url":"https://x.com/rauchg/status/2088838302367732178","likes":131,"retweets":5,"replies":19},{"text":"Impressive","createdAt":"2026-08-16T01:32:39.000Z","url":"https://x.com/rauchg/status/2088801077659635715","likes":168,"retweets":6,"replies":10},{"text":"I think people don’t realize how much of the success of React is actually @shadcn. I once referred to React as the actual “LEGO brick for adults.” But in reality it was more the description of the geometry of the bricks. The spec. Shadcn is what people actually wanted from React. Reusable high quality components that also tunable. It’s a pseudo-library. There’s code but it’s actually meant to be digested into your context window and remixed.","createdAt":"2026-08-15T22:40:26.000Z","url":"https://x.com/rauchg/status/2088757738037989755","likes":1072,"retweets":27,"replies":80}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Whitepill timeline cleanser: Progress and abundance looks like record production of crops, year on year, progressing upwards and to the right. This is the output of markets and technology working together for millenia.","createdAt":"2026-08-15T16:16:13.000Z","url":"https://x.com/garrytan/status/2088661047913914847","likes":117,"retweets":10,"replies":24},{"text":"Anyone else's Codex Desktop app erroring out on chats?","createdAt":"2026-08-15T15:04:26.000Z","url":"https://x.com/garrytan/status/2088642982614651196","likes":223,"retweets":6,"replies":83}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"Last week I’m sitting across a stealth portfolio founder working in a deeply unsexy space (at least from Bay Area standards).. They’re lamenting about how how some of the critical contracts and partnerships that would give them credibility (and revenue and network effects) are basically stuck at the 1-yard line. This is a massively fragmented market. And this is btw just straight up pure bureaucracy. The champions, terms and everything is lined up. It’s purely a win win situation but summer and one random clause is the issue. And, it might cause them to not reach their ambitious timelines. And I’m sitting there smiling and eventually laughing and at some point they ask what’s funny. I tell…","createdAt":"2026-08-15T19:57:32.000Z","url":"https://x.com/nikunj/status/2088716743615352963","likes":96,"retweets":1,"replies":5}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"Dario should tweet more","createdAt":"2026-08-16T00:12:25.000Z","url":"https://x.com/danshipper/status/2088780884048552202","likes":160,"retweets":0,"replies":16}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"America turned 250 years old earlier this year. India turns 80 today...80 years young. Building countries is really hard. 80 years in...America was struggling with a civil war. Indians should be damn proud of the country they have built. Like America, India wants more. She wants to be better and stronger and more successful. She will get there.","createdAt":"2026-08-15T21:09:03.000Z","url":"https://x.com/adityaag/status/2088734739893293175","likes":880,"retweets":45,"replies":34},{"text":"This is remarkably well done. And of course featuring our very own @shreepoorna365. Let's go.","createdAt":"2026-08-15T14:09:34.000Z","url":"https://x.com/adityaag/status/2088629172512195035","likes":90,"retweets":5,"replies":3}]}]},"errors":[],"partial":false},{"date":"2026-08-16","dateLabel":"2026年08月16日","generatedAt":"2026-08-16T00:00:00+08:00","sourceGeneratedAt":"2026-08-15T06:27:33.693Z","stats":{"podcastEpisodes":1,"xBuilders":16,"totalTweets":32,"blogPosts":1},"highlights":[{"tag":"Agent 工程","title":"长周期 agent 的真实门槛，不是把 eval 跑满，而是把上下文和审阅链路做成系统","body":"Mitch Troyanovsky 这期播客把一个常见误判说透了：长周期 agent 失败，很多时候不是因为模型不会，而是因为系统没有持续喂给它足够上下文，也没有把“它为什么这么做”整理成可审阅结果。只盯着 benchmark 或单次通过率，会让团队高估上线可靠性；真正的工程重点会转到上下文采集、状态整理和交付可审阅性这些更像工作流基础设施的地方。","evidence":[{"quote":"They all pass. That looks good. Are you confident that that now generalizes to the real world to production? And our answer has been no.","attribution":"Mitch Troyanovsky on The MAD Podcast with Matt Turck","url":"https://www.youtube.com/@DataDrivenNYC/videos"},{"quote":"you need to give it as much context as possible because it by definition is always missing context in some way.","attribution":"Mitch Troyanovsky on The MAD Podcast with Matt Turck","url":"https://www.youtube.com/@DataDrivenNYC/videos"},{"quote":"I'm done, here were the big decisions I made, here were my assumptions, here were the different things you need to look at, let's go and review together.","attribution":"Mitch Troyanovsky on The MAD Podcast with Matt Turck","url":"https://www.youtube.com/@DataDrivenNYC/videos"}]},{"tag":"应用层","title":"AI coding 已经证明，真正吃到红利的不是模型包装壳，而是重新编排工作流的产品层","body":"Aaron Levie 和 Madhu Guru 的两条信号放在一起看，Cursor 的意义不只是某个产品跑出来了，而是它验证了“用户和模型之间”仍然有巨大的产品空间。只要模型持续同质化，应用层就更要把价值做在工作流切面、成本控制、后训练、分发和 go-to-market 上；所谓“cursor for x”之所以成为模式，是因为它对应的是一整套应用层施工方法，而不是一句营销口号。","evidence":[{"quote":"There was actually tons and tons of room to innovate between the user and the underlying model, and even on the model itself.","attribution":"Aaron Levie on X","url":"https://x.com/levie/status/2088476232933577124"},{"quote":"Cursor provided out the applied AI playbook by figuring out the right product shape for agentic coding work, acting as a neutral layer between models and the workflows","attribution":"Aaron Levie on X","url":"https://x.com/levie/status/2088476232933577124"},{"quote":"it was then that “cursor for x” came along and inspired a whole new product pattern.","attribution":"Madhu Guru on X","url":"https://x.com/realmadhuguru/status/2088489059115270532"}]},{"tag":"系统架构","title":"原生应用的默认 AI 架构，正在从“选一个模型”变成“先端侧结构化，再云端重推理”","body":"Claude 这篇 Apple 平台更新的关键，不是又多了一个 SDK，而是把模型分层路由写进了原生应用架构：本地模型先做快而轻的理解与结构化，复杂推理再切到 Claude。这样一来，开发者不再需要在“端侧快”和“云端强”之间二选一，而是开始把两者当成同一条产品链路上的不同工位，这会直接改变后续 app 的交互设计和数据流设计。","evidence":[{"quote":"Developers can use this to tap into Apple’s on-device models for fast, local tasks like summarization or extraction.","attribution":"Claude Blog, Building intelligent apps for Apple platforms with Claude in the Foundation Models framework","url":"https://claude.com/blog/claude-for-foundation-models"},{"quote":"Developers can now use Apple’s Foundation Models framework to hand off to Claude when a request calls for multi-step reasoning, code generation, and more.","attribution":"Claude Blog, Building intelligent apps for Apple platforms with Claude in the Foundation Models framework","url":"https://claude.com/blog/claude-for-foundation-models"},{"quote":"Because Apple’s framework returns typed Swift values from @Generable annotations, developers arrive at the Claude API call with clean inputs instead of raw user text.","attribution":"Claude Blog, Building intelligent apps for Apple platforms with Claude in the Foundation Models framework","url":"https://claude.com/blog/claude-for-foundation-models"}]},{"tag":"工作方式","title":"AI 没把工作变轻松，它只是把流程劳动压缩成了更密集的判断劳动","body":"Matt Turck 的工作日对比和 Madhu Guru 的两条判断指向同一件事：当执行成本被 AI 压低，组织不会因此停止做事，而会把更多精力转向判断哪些事值得做、该如何做、以及如何把结果分发出去。也因此，下一阶段最稀缺的不会是“会不会用 AI”，而是产品 sense、领域理解和执行能力这些决定方向与取舍的上层能力。","evidence":[{"quote":"Before AI: [decision] [process] [process] [decision] [process] [process] [process] ... With AI: [decision] [decision] [decision] [decision] [decision]","attribution":"Matt Turck on X","url":"https://x.com/mattturck/status/2088323186819539041"},{"quote":"when everyone can build with ai, your differentiators are product sense, domain knowledge, distribution, execution.","attribution":"Madhu Guru on X","url":"https://x.com/realmadhuguru/status/2088425380130783287"},{"quote":"When the cost and complexity of a task falls, new use cases become economically viable. AI + software engineering will likely follow the same pattern","attribution":"Madhu Guru on X","url":"https://x.com/realmadhuguru/status/2088294414255112329"}]},{"tag":"协作基础设施","title":"当团队开始用 agent 开发 agent，最先补齐的不是新模型，而是可分享的过程证据","body":"Peter Steinberger 的两条动态透露出一个很具体的转向：团队一旦真的把 agent 放进日常开发，评审机制就得补上新的“证据层”。可分享的 session URL 让协作从口头转述变成可回放过程，PR 附视频则让 UI 变化不再只靠 diff 猜测。换句话说，agent 进入团队后，最先成为基础设施的不是更大模型，而是让别人看懂过程和结果的审计介质。","evidence":[{"quote":"We moved the team over to build openclaw with openclaw.","attribution":"Peter Steinberger on X","url":"https://x.com/steipete/status/2088473882357530979"},{"quote":"Being able to share agent sessions as URLs is a superpower.","attribution":"Peter Steinberger on X","url":"https://x.com/steipete/status/2088473882357530979"},{"quote":"Added a short instruction to our shared AGENTS MD file to upload videos to each PR that changes UI state.","attribution":"Peter Steinberger on X","url":"https://x.com/steipete/status/2088486859244741020"}]}],"matters":[{"kind":"产品接入","title":"ChatGPT 把餐厅预订这类日常动作继续往对话流里收","detail":"Thibault Sottiaux 说“快速找餐厅预订”现在在 ChatGPT 里已经很容易，连同更多新 ship 一起上线。信号不在单个功能，而在高频生活动作被继续并入同一条 agent 式入口。","url":"https://x.com/thsottiaux/status/2088493756391768252"},{"kind":"内容治理","title":"X 的反 AI slop 机制更像行为风控，还没有真正碰内容层","detail":"Peter Yang 读开源算法后认为 TweetSpamBot 主要看 burst、quote 行为和停留模式，但并不读帖文内容本身。这意味着模板化内容农场只要控制行为节奏，仍可能大规模绕过现有护栏。","url":"https://x.com/petergyang/status/2088261100202868768"},{"kind":"Agent 执行","title":"/goal 这种长时执行形态已经开始被拿来直接吞下超细规格","detail":"Nikunj Kothari 提到 `/goal` 能在 generous CLI tools 条件下，用 14 小时 one-shot 一个极其详细的 spec。它未必 token 最省，但说明“长时间保持任务连续性”已经是可以被公开展示的产品特性。","url":"https://x.com/nikunj/status/2088351343434138111"},{"kind":"代码信任","title":"对某些 one-way-door 决策，开发者已经开始愿意直接全盘接受 Claude Code 建议","detail":"Garry Tan 说 GStack 在 Fable 5 前后最惊讶的变化之一，是许多 one-way-door 问题现在都可以直接说“Take all recommendations”并满意收下。这里最值得追踪的是信任阈值变化，而不只是模型能力数字。","url":"https://x.com/garrytan/status/2088388000267002195"},{"kind":"创业模式","title":"Dan Shipper 认为 AI-native 公司未必需要长期陷在融资与烧钱肉搏里","detail":"他明确反驳了“AI rocketship 就必须 permanent fundraising”的默认叙事，同时补了一句规则会非常不同。这更像是在提醒大家：AI-native 增长路径可能存在另一套经营模型，而不是把 SaaS 竞争逻辑原样放大。","url":"https://x.com/danshipper/status/2088270756043993503"}],"sources":{"podcasts":[{"title":"How to Build Long-Horizon AI Agents — Mitch Troyanovsky, Basis","name":"The MAD Podcast with Matt Turck","publishedAt":"2026-08-06T11:30:01.000Z","url":"https://www.youtube.com/@DataDrivenNYC/videos","excerpts":["Humans are already used to working with non deterministic systems, it's just the systems are normally their co workers, not their computers. And in many ways, like companies and processes is all about how do you design a system for non deterministic entities to coordinate together to solve a problem? And once you realize that, it's like, well, now it's like…","They all pass. That looks good. Are you confident that that now generalizes to the real world to production? And our answer has been no. Even if you got it right a 100 out of a 100 times, if a person is just getting it right because they're going to Wikipedia, the accounting firm wouldn't hire them, and so they shouldn't hire us either.","You'll see people, like, freaking out over a code file that isn't abstracted properly, and yet their context is, like, total shit. The English is more precious because the English affects the performance. The code does not affect the performance."]}],"blogs":[{"title":"Building intelligent apps for Apple platforms with Claude in the Foundation Models framework","source":"blog","publishedAt":"Jun 08, 2026","url":"https://claude.com/blog/claude-for-foundation-models","summary":""}],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"the reason @databricks \"ipo is lava\" fundraises are a meme is this but unironically the M in their $188B series M stands for \"we are going to kill so many meetings\"","createdAt":"2026-08-14T21:46:07.000Z","url":"https://x.com/swyx/status/2088381680478540096","likes":91,"retweets":1,"replies":16},{"text":"ask away","createdAt":"2026-08-14T20:14:31.000Z","url":"https://x.com/swyx/status/2088358628000768263","likes":65,"retweets":0,"replies":12},{"text":"AIE NYC CFP wave 1 acceptances are being finalized today. last day to get in for wave 1! our NYC event last year was the most successful summit we've ever had. excited to head back to 🗽 bigger and better than ever - note the special requirements for our mainstage finance keynotes","createdAt":"2026-08-14T17:49:48.000Z","url":"https://x.com/swyx/status/2088322211241447801","likes":31,"retweets":1,"replies":9}]},{"name":"Josh Woodward","handle":"joshwoodward","bio":"VP, @Google @GoogleLabs @GeminiApp @GoogleAIStudio","tweets":[{"text":"3.7 Flash is in the @GeminiApp","createdAt":"2026-08-14T19:19:30.000Z","url":"https://x.com/joshwoodward/status/2088344782821326980","likes":735,"retweets":38,"replies":67},{"text":"Pomelli is our Google Labs experiment popular with a growing number of small businesses. Why? It's one of the easiest ways to make your products look good in any setting. With this launch, turn those amazing photoshoots into short videos or gifs with that same ease!","createdAt":"2026-08-14T13:49:22.000Z","url":"https://x.com/joshwoodward/status/2088261701028503965","likes":182,"retweets":13,"replies":9},{"text":"This fix addresses #6 in","createdAt":"2026-08-14T13:39:37.000Z","url":"https://x.com/joshwoodward/status/2088259247184507170","likes":39,"retweets":1,"replies":0}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"What’s a hard problem codex solved for you this week? Where do you learn from others on how to push the frontier?","createdAt":"2026-08-15T05:36:23.000Z","url":"https://x.com/thsottiaux/status/2088500028721832432","likes":666,"retweets":17,"replies":527},{"text":"Looking for a quick restaurant reservation is now super easy in ChatGPT. Together with a bunch more ships","createdAt":"2026-08-15T05:11:28.000Z","url":"https://x.com/thsottiaux/status/2088493756391768252","likes":583,"retweets":31,"replies":137}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"I was curious how X is fighting AI slop, so I looked at its open-source algorithm. It has a behavioral model called TweetSpamBot that analyzes up to 512 recent account actions, looking at signals like posting bursts, quote-post behavior, timing, and normal browsing or dwell between actions. The model is trained to recognize patterns such as: → TWEET_CREATE_BURST → QUOTE_TWEET_SPAMMER → CONTENT_AMPLIFIER A high score on the above can feed into an account challenge but doesn't seem to downrank the slop posts themselves. I think the gap here is that the model doesn’t read the actual post content. So a sophisticated AI content mill can still post slop all day long: 1. Find viral posts 2. Quote…","createdAt":"2026-08-14T13:46:58.000Z","url":"https://x.com/petergyang/status/2088261100202868768","likes":35,"retweets":0,"replies":7}]},{"name":"Nan Yu","handle":"thenanyu","bio":"head of product @linear","tweets":[{"text":"There’s no force in tech as destructive as the PM promo packe     const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    let selectedDate = new URLSearchParams(location.search).get('date') || (DIGESTS.some(d => d.date === today) ? today : DIGESTS[0]?.date);
    const esc = (v) => String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;");
    function link(url, text) { return url ? '<a href="' + esc(url) + '" target="_blank" rel="noreferrer">' + esc(text || url) + '</a>' : esc(text || ''); }
    function renderDates() {
      document.getElementById('dates').innerHTML = DIGESTS.map(d => '<button class="date-btn" aria-current="' + (d.date === selectedDate ? 'date' : 'false') + '" data-date="' + esc(d.date) + '">' + esc(d.date) + '</button>').join('');
      document.querySelectorAll('.date-btn').forEach(btn => btn.addEventListener('click', () => {
        selectedDate = btn.dataset.date;
        history.replaceState(null, '', '?date=' + selectedDate);
        render();
      }));
    }
    function renderStats(d) {
      const stats = d.stats || {};
      document.getElementById('stats').innerHTML = [
        ['播客', stats.podcastEpisodes || 0],
        ['Builders', stats.xBuilders || 0],
        ['推文', stats.totalTweets || 0],
        ['博客', stats.blogPosts || 0],
      ].map(([label, value]) => '<div class="stat"><strong>' + esc(value) + '</strong><span class="small">' + esc(label) + '</span></div>').join('');
    }
    function renderEvidence(evidence) {
      if (typeof evidence === 'string') return '<blockquote>' + esc(evidence) + '</blockquote>';
      const attribution = evidence.attribution ? '<div class="small">— ' + esc(evidence.attribution) + (evidence.url ? ' · ' + link(evidence.url, '查看原文') : '') + '</div>' : '';
      return '<blockquote>' + esc(evidence.quote || '') + attribution + '</blockquote>';
    }
    function renderHighlights(d) {
      const cards = (d.highlights || []).map(item => '<article class="card"><div class="tag">' + esc(item.tag) + '</div><h3>' + esc(item.title) + '</h3><p>' + esc(item.body) + '</p>' + ((item.evidence || []).length ? '<details><summary>查看原文依据</summary>' + item.evidence.map(renderEvidence).join('') + '</details>' : '') + '</article>').join('');
      return '<section><h2>洞察<span class="section-note">INSIGHTS / 经过判断的关键信号</span></h2><div class="grid">' + (cards || '<p class="empty">今天没有足够内容生成洞察。</p>') + '</div></section>';
    }
    function renderMatters(d) {
      const cards = (d.matters || []).map(item => '<article class="card"><div class="tag">' + esc(item.kind) + '</div><h3>' + link(item.url, item.title) + '</h3><p>' + esc(item.detail) + '</p></article>').join('');
      return '<section><h2>议题<span class="section-note">MATTERS / 值得继续追踪</span></h2><div class="grid">' + (cards || '<p class="empty">今天没有额外议题。</p>') + '</div></section>';
    }
    function renderSources(d) {
      const archive = d.archiveUrl ? '<p class="archive-link">' + link(d.archiveUrl, '查看当日完整存档 ↗') + '</p>' : '';
      const xGroups = ((d.sources || {}).x || []).map(builder => '<div class="source-group"><h3>' + esc(builder.name) + ' <span class="small">@' + esc(builder.handle) + '</span></h3><p class="small">' + esc(builder.bio) + '</p>' + (builder.tweets || []).map(tweet => '<p class="tweet">' + esc(tweet.text) + '<br>' + link(tweet.url, '原文') + ' <span class="small">likes ' + esc(tweet.likes) + ' · reposts ' + esc(tweet.retweets) + '</span></p>').join('') + '</div>').join('');
      const podcastGroups = ((d.sources || {}).podcasts || []).map(podcast => '<div class="source-group"><h3>' + link(podcast.url, podcast.title) + '</h3>' + (podcast.excerpts || []).map(e => '<blockquote>' + esc(e) + '</blockquote>').join('') + '</div>').join('');
      const blogGroups = ((d.sources || {}).blogs || []).map(blog => '<div class="source-group"><h3>' + link(blog.url, blog.title) + '</h3><p class="small">' + esc(blog.source || '') + '</p><p>' + esc(blog.summary || '') + '</p></div>').join('');
      return '<section><h2>原文<span class="section-note">SOURCES / 完整证据索引</span></h2>' + archive + '<div class="sources">' + podcastGroups + blogGroups + xGroups + '</div></section>';
    }
    function render() {
      const d = DIGESTS.find(item => item.date === selectedDate) || DIGESTS[0];
      if (!d) {
        document.getElementById('content').innerHTML = '<p class="empty">还没有 digest 数据。</p>';
        return;
      }
      selectedDate = d.date;
      renderDates();
      renderStats(d);
      document.getElementById('content').innerHTML = renderHighlights(d) + renderMatters(d) + renderSources(d);
    }
    render();
  </script>
