erwork.","createdAt":"2026-10-29T03:03:59.000Z","url":"https://x.com/petergyang/status/2115640765422706948","likes":22,"retweets":1,"replies":9},{"text":"I think world models are still in the GPT 3.5 era, but not for long. Like the old Will Smith eating spaghetti videos, world models are impressive but not quite there yet. You can see it in the reel below, which has a mix of my Genie 4 generations and Google's. But once they hit the GPT-5 or GPT-6 stage, I think they'll have massive implications for a lot of industries: Movies - A big effects shot like a dragon battle takes a VFX studio months of work. With a great world model, a director could create a single frame and have AI generate the full scene from it. Games - From my time working in gaming, I learned the real work is core loops, progression systems, and the mechanics that make a gam…","createdAt":"2026-10-28T21:30:19.000Z","url":"https://x.com/petergyang/status/2115556794076741647","likes":14,"retweets":0,"replies":8}]},{"name":"Nan Yu","handle":"thenanyu","bio":"product, codex @openai. prev head of product @linear","tweets":[{"text":"HEY JOHN APPLE 5G ON MY MACBOOK SEND TWEET","createdAt":"2026-10-29T02:55:58.000Z","url":"https://x.com/thenanyu/status/2115638747002003968","likes":23,"retweets":1,"replies":0}]},{"name":"Thariq","handle":"trq212","bio":"playing WoW forever, formerly Claude Code @anthropicai","tweets":[{"text":"I think the same is true of creative fields, like I see artists really worrying about AI but I wish so badly that I could sketch animation ideas and character concepts for my agent to flesh out instead of trying to find examples I don't have the language!","createdAt":"2026-10-29T03:05:22.000Z","url":"https://x.com/trq212/status/2115641110710419752","likes":1290,"retweets":33,"replies":127},{"text":"very weird thing happening rn technical people are sad, they think their skills are now useless non-technical people are desperately wishing they were more technical so they could use agent , goes down. We solve that. We operate 20 worldwide clusters doing millions of microVMs per day. ② is less obvious, but very powerful. Turborepo was designed to intelligently skip and cache prior work. The graph of dependencies is computed, not written. Ask your agent to migrate to @turborepo and start saving money and time. Even if you don't use us. But you should, it's really good. ③ is a game-changer. 𝚟𝚎𝚛𝚌𝚎𝚕 𝚌𝚒 in the CLI is the first step, because now your agents can inspect, abort, trigger, replay CI…","createdAt":"2026-10-28T20:21:18.000Z","url":"https://x.com/rauchg/status/2115539426684408300","likes":360,"retweets":12,"replies":95}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Agents are going to consume 1,000X more tokens than we consume today. Because they’re going to be running in our workflows, processing all of our data, building out nearly all software, securing enterprises, and much more. To do this at scale we will need a variety of approaches at the frontier of AI. This includes continuing to push the boundaries of closed models, while also increasing the capability of open weights models, making them more secure, as well as making them more efficient for large workloads. Very exciting to see what @Suhail is building with Particle on this front.","createdAt":"2026-10-28T18:49:41.000Z","url":"https://x.com/levie/status/2115516370695987435","likes":283,"retweets":17,"replies":87}]},{"name":"Ryo Lu","handle":"ryolu_","bio":"Designed @Cursor_ai, @NotionHQ, @Stripe, built startups. I make a world where anyone can make software. Aspiring k-pop idol.","tweets":[{"text":"","createdAt":"2026-10-29T05:53:16.000Z","url":"https://x.com/ryolu_/status/2115683366389559464","likes":10,"retweets":3,"replies":0},{"text":"augmenting human intellect when i started making software, i wasn’t dreaming of a factory. i loved that something on a screen could become an extension of my mind. a ise judgment and agents execute most of the work.","attribution":"Amjad Masad","url":"https://x.com/amasad/status/2114760898225299721"}]},{"tag":"隔离与验证","title":"断网并不等于无法通信，沙箱验收需要覆盖共享硬件","body":"Vercel CEO Guillermo Rauch 在 10 月 26 日 UTC 描述 cpu-chat 实验：无互联网访问的多个 Firecracker microVM，通过共享硬件争用实现通信。他也明确区分了这种隐蔽通信与窃取信息的侧信道攻击。我的判断：如果隔离要求包含阻止两个协作进程交换信息，只验证网络规则并不足够，还需针对共享资源做实验，并说明生产环境限制。单个演示不能证明所有线上沙箱可被利用；厂商自述的监控与缓解也不等于独立验证的安全保证。","evidence":[{"quote":"It runs on a generic host with 2+ Firecracker microVMs with no internet access.","attribution":"Guillermo Rauch","url":"https://x.com/rauchg/status/2114770919436808572"}]},{"tag":"垂直应用","title":"小团队采用 AI 的门槛，往往在业务上下文而非聊天入口","body":"Claude 官方在 10 月 26 日 UTC 宣布扩展面向非营利组织的插件，涵盖筹款、营销与招聘，并强调各团队的上下文和 AI 政策。我的判断：把任务方法和组织约束一起交付，比让小团队从空白聊天框自行设计流程更接近可用产品。验收不应只看是否生成了文案，还应检查结果是否遵守团队政策、能否进入现有审批流程。官方称插件与约 30 家组织共同构建，这能说明设计输入，尚不能证明普遍的效率提升。","evidence":[{"quote":"adding skills for fundraising, marketing, and hiring grounded in each team’s context and AI policy:","attribution":"Claude","url":"https://x.com/claudeai/status/2114780227465338985"}]}],"matters":[{"kind":"模型发布","title":"6.1 Terra：关注写作与电脑操作的实际表现","detail":"Thibault Sottiaux 在 10 月 26 日 UTC 介绍 Terra 回归，强调写作、理解请求、电脑操作，并称使用额度比 6.1 Sol 多一倍。这里记录的是发布方描述；原帖没有给出独立测试或完整额度细则，不能把它直接换算成所有任务的两倍产出。","url":"https://x.com/thsottiaux/status/2114800277677092936"},{"kind":"工程实践","title":"Bun AOT 的个人测试出现性能与内存改善","detail":"Peter Steinberger 在 10 月 27 日 UTC 分享周末测试，报告性能提升 2–3 倍、内存不到原来一半。原帖未提供可复现的工作负载和环境，适合作为进一步测试的线索，不能外推到所有 Bun 应用。","url":"https://x.com/steipete/status/2114879798434758905"},{"kind":"产品部署","title":"Google Beam 计划进入 20 个军人家庭连接场景","detail":"Josh Woodward 在 10 月 26 日 UTC 表示，与美国陆军和 USO 合作，将 Google Beam 带到 20 个地点，为部署在外的军人与亲人提供逼真的 3D 视频连接。帖子未说明这些地点是否已全部上线，也没有提供实际使用效果数据。","url":"https://x.com/joshwoodward/status/2114840668296409568"},{"kind":"交互趋势","title":"从自己阅读到直接叫 Agent 处理，入口正在变化","detail":"Peter Yang 在 10 月 27 日 UTC 把直接标记机器人视为委托式网络交互的早期信号，并在后续帖表达担忧。这是对未来行为的判断，尚不是已验证的普遍趋势；产品评估可以观察用户是否仍能查看原文、理解结果 om/swyx/status/2114805687226376267","likes":173,"retweets":3,"replies":38}]},{"name":"Josh Woodward","handle":"joshwoodward","bio":"VP, @Google @GoogleLabs @GeminiApp @GoogleAIStudio","tweets":[{"text":"","createdAt":"2026-10-26T22:04:42.000Z","url":"https://x.com/joshwoodward/status/2114840670016065576","likes":5,"retweets":0,"replies":1},{"text":"🇺🇸 For a deployed service member, missing family moments adds up. Baby’s first step. The first performance. Sharing a laugh. In honor of National Day of the Deployed, we’re excited to partner with @USArmy and @The_USO to bring Google Beam to 20 locations so deployed service members can experience lifelike, 3D video connections with their loved ones. 🎥 Watch the docuseries below","createdAt":"2026-10-26T22:04:41.000Z","url":"https://x.com/joshwoodward/status/2114840668296409568","likes":190,"retweets":20,"replies":8}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Day 22/ Terra is back! Our first model that is significantly better at writing, personality and nuanced understanding of requests. Packs a punch across the board, very good at computer use, and gives 2X more usage than 6.1 Sol across API and subscriptions.","createdAt":"2026-10-26T19:24:11.000Z","url":"https://x.com/thsottiaux/status/2114800277677092936","likes":8700,"retweets":391,"replies":1731}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"@bot This is probably not a good thing overall","createdAt":"2026-10-27T03:52:03.000Z","url":"https://x.com/petergyang/status/2114928082712998087","likes":7,"retweets":0,"replies":2},{"text":"In the near future, instead of reading or doing anything online, people are just going to tag their agent to do it. @bot is an early signal of this.","createdAt":"2026-10-27T03:48:31.000Z","url":"https://x.com/petergyang/status/2114927195332460940","likes":49,"retweets":3,"replies":37},{"text":"This is the stuff that I’m excited about not the 9th personal agent to manage my emails","createdAt":"2026-10-27T02:20:55.000Z","url":"https://x.com/petergyang/status/2114905151572263242","likes":25,"retweets":1,"replies":13}]},{"name":"Nan Yu","handle":"thenanyu","bio":"product, codex @openai. prev head of product @linear","tweets":[{"text":"“Delightful” they said in the design crit","createdAt":"2026-10-26T19:23:46.000Z","url":"https://x.com/thenanyu/status/2114800172270252037","likes":2,"retweets":0,"replies":0}]},{"name":"Thariq","handle":"trq212","bio":"playing WoW forever, formerly Claude Code @anthropicai","tweets":[{"text":"going to be sharing my WoW forever shaman build at the AIE Code closing keynote","createdAt":"2026-10-26T19:08:14.000Z","url":"https://x.com/trq212/status/2114796261362835842","likes":2226,"retweets":39,"replies":136}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"OpenAI asked three scientific communities how to release its discoveries and got three different answers: Mathematicians: “Just post it. Who gives a shit anymore.” Computer scientists: “Open source it, but also pay for our conference.” Physicists: “Leave it to us, nerds.”","createdAt":"2026-10-27T01:23:41.000Z","url":"https://x.com/amasad/status/2114890745471545419","likes":395,"retweets":20,"replies":68},{"text":"Software ate the world, now it's learning to run it.","createdAt":"2026-10-26T17:20:25.000Z","url":"https://x.com/amasad/status/2114769129282601053","likes":1138,"retweets":121,"replies":97},{"text":"For centuries, the architecture of the firm has barely changed: hierarchies of people organized into departments and coordinated through bureaucracy. AI agents are about to upend that. We’re moving toward the self-driving company where humans exercise judgment and agents execute most of the work. At Replit, we’re building the foundation for this new kind of company. We’re calling it “the Agent Habitat.” Marc Andreessen wrote a fantastic piece placing this shift in the history of computing. Every major computing revolution began with chaos before businesses figured out how to harness it.","createdAt":"2026-10-26T16:47:43.000Z","url":"https://x.com/amasad/status/2114760898225299721","likes":756,"retweets":77,"replies":155}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"I built 𝚌𝚙𝚞-𝚌𝚑𝚊𝚝, a reproduction of @openai's findings of covert communication using the CPU. It runs on a generic host with 2+ Firecracker microVMs with no internet access. Works on x86 and even my M5 chip. I was able to chat via 3 separate mechanisms: ① CPU contention ② Cache eviction timing ③ DRAM bandwidth contention … across multiple CPUs, defeating all Firecracker's production recommendations (no SMT, no KSM, tenants pinned to different cores.) Essentially, if shared hardware is involved, there's a good chance your agents can communicate covertly. And with really decent latency. The good news: this is decidedly different from a *side-channel attack* where the agents could stea…","createdAt":"2026-10-26T17:27:32.000Z","url":"https://x.com/rauchg/status/2114770919436808572","likes":2001,"retweets":179,"replies":206}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"This is the key stat. The average Fortune 500 customer of Anthropic spends less than .1% of their expenses on Anthropic. While that number likely will eventually asymptote somewhere (token prices coming down, and other large enterprise spend areas not going away), there’s no reason it can’t be 10-50X higher than this, reaching a “mere” 1-5% of spend. Which would still be a fraction of what most startups are spending. Thus, you can see how big of a divide there is between the frontier users of AI and the rest of the world still. Today, only a microscopically small set of companies are actually using agents for large amounts of background tasks and inside of workflows that aren’t human prompt…","createdAt":"2026-10-26T16:51:22.000Z","url":"https://x.com/levie/status/2114761816199098587","likes":615,"retweets":56,"replies":113}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Publish your stack","createdAt":"2026-10-26T15:22:46.000Z","url":"https://x.com/garrytan/status/2114739519622963671","likes":467,"retweets":19,"replies":87}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"Anthropic S-1 highlights video ONE SHOT (just one prompt, no editing) using @synthesiaIO Syren","createdAt":"2026-10-26T21:22:13.000Z","url":"https://x.com/mattturck/status/2114829981884817513","likes":24,"retweets":3,"replies":3},{"text":"Particularly evil of Anthropic to file their S-1 on a Monday morning when all VCs are stuck in Monday team and partner meetings, making us unable to provide immediate #thoughtleadership with those S-1 teardowns that everyone is dying to read","createdAt":"2026-10-26T16:25:24.000Z","url":"https://x.com/mattturck/status/2114755282181955616","likes":522,"retweets":8,"replies":34}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"Maybe I should just change my job..","createdAt":"2026-10-27T03:56:49.000Z","url":"https://x.com/nikunj/status/2114929285890990574","likes":0,"retweets":0,"replies":0},{"text":"The main thing I wanted to dig into @AnthropicAI's S-1 was the compute contracts.. A few things that stood out (built in conjuction with Opus 5.5): > At June 30, Anthropic had $265.6B of purchase commitments and $321.4B of leases that hadn’t st tedAt":"2026-10-23T23:12:31.000Z","url":"https://x.com/thsottiaux/status/2113770573994299544","likes":6132,"retweets":176,"replies":983}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"I think most ambitious people don't reflect and realize that at some point, their time > their money. Being in the sandwich generation with young kids and aging parents has made me realize this sooner than most and I'm privileged to be in a position where I can make the choice to pursue agency over my time. But many tech people are also in this position and just don't stop to reflect on this. 📌 See my chat with Adam for more:","createdAt":"2026-10-23T16:44:03.000Z","url":"https://x.com/petergyang/status/2113672812909191292","likes":31,"retweets":1,"replies":12}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"also can someone at gmail make it so you can't scan for deactivated email addresses 🫩? I was hoping for a relaxing Friday night","createdAt":"2026-10-24T04:06:31.000Z","url":"https://x.com/trq212/status/2113844560074019213","likes":971,"retweets":3,"replies":15},{"text":"I’ve left Anthropic after more than a year of working on Claude Code and seeing it scale larger than I ever imagined. I have really loved working at Ant and believe deeply in the mission, and most of all, the idea of a race to the top. The idea that if we work hard and responsibly, we can raise the bar and inspire others to great outcomes. And if we all push each other to be better, things can be radically good. I will carry the spirit of this with me forever. My colleagues at Anthropic are the most talented, thoughtful, competent, and earnest people I have ever met. I am glad they are at the wheel and trust them deeply. To the community on X, thank you for everything. You’ve made this the…","createdAt":"2026-10-24T04:04:29.000Z",     }
    function renderMatters(d) {
      const cards = (d.matters || []).map(item => '<article class="card"><div class="tag">' + esc(item.kind) + '</div><h3>' + link(item.url, item.title) + '</h3><p>' + esc(item.detail) + '</p></article>').join('');
      return '<section><h2>议题<span class="section-note">MATTERS / 值得继续追踪</span></h2><div class="grid">' + (cards || '<p class="empty">今天没有额外议题。</p>') + '</div></section>';
    }
    function renderSources(d) {
      const archive = d.archiveUrl ? '<p class="archive-link">' + link(d.archiveUrl, '查看当日完整存档 ↗') + '</p>' : '';
      const xGroups = ((d.sources || {}).x || []).map(builder => '<div class="source-group"><h3>' + esc(builder.name) + ' <span class="small">@' + esc(builder.handle) + '</span></h3><p class="small">' + esc(builder.bio) + '</p>' + (builder.tweets || []).map(tweet => '<p class="tweet">' + esc(tweet.text) + '<br>' + link(tweet.url, '原文') + ' <span class="small">likes ' + esc(tweet.likes) + ' · reposts ' + esc(tweet.retweets) + '</span></p>').join('') + '</div>').join('');
      const podcastGroups = ((d.sources || {}).podcasts || []).map(podcast => '<div class="source-group"><h3>' + link(podcast.url, podcast.title) + '</h3>' + (podcast.excerpts || []).map(e => '<blockquote>' + esc(e) + '</blockquote>').join('') + '</div>').join('');
      const blogGroups = ((d.sources || {}).blogs || []).map(blog => '<div class="source-group"><h3>' + link(blog.url, blog.title) + '</h3><p class="small">' + esc(blog.source || '') + '</p><p>' + esc(blog.summary || '') + '</p></div>').join('');
      return '<section><h2>原文<span class="section-note">SOURCES / 完整证据索引</span></h2>' + archive + '<div class="sources">' + podcastGroups + blogGroups + xGroups + '</div></section>';
    }
    function render() {
      const d = DIGESTS.find(item => item.date === selectedDate) || DIGESTS[0];
      if (!d) {
        document.getElementById('content').innerHTML = '<p class="empty">还没有 digest 数据。</p>';
        return;
      }
      selectedDate = d.date;
      renderDates();
      renderStats(d);
      document.getElementById('content').innerHTML = renderHighlights(d) + renderMatters(d) + renderSources(d);
    }
    render();
  </script>
</body>
</html>
