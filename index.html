enanyu/status/2088461657311785236","likes":59,"retweets":2,"replies":5},{"text":"AI is not \"jagged\" it is just AI-shaped. That's like saying dogs are \"jagged\" because they are similar, superior, or inferior compared to humans when it comes to specific tasks.","createdAt":"2026-08-14T18:43:35.000Z","url":"https://x.com/thenanyu/status/2088335744909619230","likes":5,"retweets":0,"replies":3},{"text":"If you believe your colleagues are smart, their ideas didn't come from nowhere. There's something motivating them that gets to a real problem, or is likely interesting to think about. Some of the most interesting things we've shipped are fusions of multiple ideas or several derivatives away from the original concept.","createdAt":"2026-08-14T14:57:02.000Z","url":"https://x.com/thenanyu/status/2088278730808426900","likes":16,"retweets":0,"replies":3}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"Cursor’s impact on AI product culture is underrated. for a while, ai products were stuck in the chatbot phase and was searching for a product meta to piggyback off of. it was then that “cursor for x” came along and inspired a whole new product pattern.","createdAt":"2026-08-15T04:52:48.000Z","url":"https://x.com/realmadhuguru/status/2088489059115270532","likes":19,"retweets":0,"replies":2},{"text":"when everyone can build with ai, your differentiators are product sense, domain knowledge, distribution, execution.","createdAt":"2026-08-15T00:39:46.000Z","url":"https://x.com/realmadhuguru/status/2088425380130783287","likes":84,"retweets":6,"replies":9},{"text":"Making steam engines more efficient increased coal demand. Higher-level languages made programming easier and resulted in far more software being built. Spreadsheets made financial analysis cheaper and resulted in businesses doing far more analysis. When the cost and complexity of a task falls, new use cases become economically viable. AI + software engineering will likely follow the same pattern: far more software solving far more problems, including problems that were previously economically unviable.","createdAt":"2026-08-14T15:59:21.000Z","url":"https://x.com/realmadhuguru/status/2088294414255112329","likes":39,"retweets":4,"replies":7}]},{"name":"Google Labs","handle":"GoogleLabs","bio":"Google’s home for our latest AI tools and experiments.","tweets":[{"text":"In the Lab, we’re always tinkering 🧪– from the experiments we graduate to the ones still brewing, we bring the best of our AI models to all kinds of users. Try out these two (if you haven't already!): @PomellibyGoogle - build captivating marketing campaigns tailored to your brand and your business at scale @FlowbyGoogle - craft visual stories that channel your imagination and draw the attention of your audience","createdAt":"2026-08-14T16:50:50.000Z","url":"https://x.com/GoogleLabs/status/2088307370787328223","likes":110,"retweets":10,"replies":8}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Even if you don’t plan on publishing to the App Store, building personal apps via TestFlight is really great.","createdAt":"2026-08-14T22:14:04.000Z","url":"https://x.com/amasad/status/2088388714351518130","likes":82,"retweets":3,"replies":12}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Vercel is the fastest [AI Gateway] infrastructure in the world","createdAt":"2026-08-14T17:54:44.000Z","url":"https://x.com/rauchg/status/2088323451132199338","likes":305,"retweets":14,"replies":28}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Amazing outcome. Cursor executed the applied AI strategy flawlessly. Most people completely underestimated the market size in AI coding. The biggest developer tool exits in history were on the order of low billions of dollars. And it was already assumed to be a heavily competitive and somewhat saturated space when they really got going. Multiple mental models shattered near instantly. The market sizes for agentic coding was far larger than most realized. There was actually tons and tons of room to innovate between the user and the underlying model, and even on the model itself. Cursor provided out the applied AI playbook by figuring out the right product shape for agentic coding work, actin…","createdAt":"2026-08-15T04:01:50.000Z","url":"https://x.com/levie/status/2088476232933577124","likes":165,"retweets":6,"replies":23}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"All the opponents are helping YIMBYs make a comprehensive list of California laws that need to be repealed","createdAt":"2026-08-15T00:19:57.000Z","url":"https://x.com/garrytan/status/2088420395670184238","likes":47,"retweets":3,"replies":10},{"text":"The most surprising thing about using GStack pre-Fable 5 and after is now for many one-way-door questions you might get back in Claude Code, you can actually just say \"Take all recommendations\" and be happy","createdAt":"2026-08-14T22:11:14.000Z","url":"https://x.com/garrytan/status/2088388000267002195","likes":103,"retweets":1,"replies":22},{"text":"\"Steve Jobs walked by and said the font city names weren't bad, but 'at least call them world-class cities.' That's how Paoli and Wynwood became New York and Geneva.\"","createdAt":"2026-08-14T21:54:31.000Z","url":"https://x.com/garrytan/status/2088383794013470812","likes":138,"retweets":7,"replies":14}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"The evolution of a workday: Before AI: [decision] [process] [process] [decision] [process] [process] [process] 10pm: still going With AI: [decision] [decision] [decision] [decision] [decision] 3pm: [brain empty] [need coffee] [staring at wall]","createdAt":"2026-08-14T17:53:41.000Z","url":"https://x.com/mattturck/status/2088323186819539041","likes":166,"retweets":17,"replies":25}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"Three pros of monthly walks with @JustJake.. 1) his ability to articulate how every piece of infra will evolve is next to none. i’ve been proven wrong a few times already. 2) the velocity of this company is just batshit insane and again just mogs his own high lofty goals. 3) he walks at an insane speed and gets me 10k steps for free.","createdAt":"2026-08-15T01:40:19.000Z","url":"https://x.com/nikunj/status/2088440618196607061","likes":9,"retweets":0,"replies":0},{"text":"/goal may not be the MOST token efficient thing, but it's a thing of beauty to see it one-shot an extremely detailed spec (with generous CLI tools) in 14h..","createdAt":"2026-08-14T19:45:34.000Z","url":"https://x.com/nikunj/status/2088351343434138111","likes":11,"retweets":1,"replies":4}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"Added a short instruction to our shared AGENTS MD file to upload videos to each PR that changes UI state.","createdAt":"2026-08-15T04:44:04.000Z","url":"https://x.com/steipete/status/2088486859244741020","likes":111,"retweets":3,"replies":17},{"text":"We moved the team over to build openclaw with openclaw. Being able to share agent sessions as URLs is a superpower.","createdAt":"2026-08-15T03:52:30.000Z","url":"https://x.com/steipete/status/2088473882357530979","likes":160,"retweets":5,"replies":28}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"Some people are using AI in ways that make everyone around them feel slightly behind. We want those people at Thesis: 2027. If a person comes to mind—an executive, a builder, a creative—nominate them. We’ve reserved free tickets for our favorite nominees.","createdAt":"2026-08-14T16:15:43.000Z","url":"https://x.com/danshipper/status/2088298533912989736","likes":29,"retweets":7,"replies":8},{"text":"not really you can be an AI-native rocketship without being in a permanent fundraising situation and in a constant death match with other rocketships to capture customers, sacrificing gross margin but the rules for building a company like that are very different","createdAt":"2026-08-14T14:25:21.000Z","url":"https://x.com/danshipper/status/2088270756043993503","likes":55,"retweets":1,"replies":6},{"text":"the list of people who applied to this event over the list 24 hours is incredible, i can’t wait to get everyone in one room if you’re a business interested in being part of this event DM @itsbdell","createdAt":"2026-08-14T12:48:56.000Z","url":"https://x.com/danshipper/status/2088246494885302639","likes":26,"retweets":1,"replies":1}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"Maa Tujhe salaam 🇮🇳","createdAt":"2026-08-15T04:40:07.000Z","url":"https://x.com/adityaag/status/2088485865194750150","likes":22,"retweets":1,"replies":0},{"text":"One of the things we think about a lot @spc is that as investors we must deeply embody the traits we look for in founders. @evantana doesn't like to talk about himself...but it is one of the great joys (and privileges) of my life to work with someone as driven, talented and curious as him to build SPC for many years and decades to come.","createdAt":"2026-08-14T15:42:39.000Z","url":"https://x.com/adityaag/status/2088290208911675761","likes":78,"retweets":2,"replies":2}]}]},"errors":[],"partial":false},{"date":"2026-08-15","dateLabel":"2026年08月15日","generatedAt":"2026-08-15T00:00:00+08:00","sourceGeneratedAt":"2026-08-14T06:46:42.819Z","stats":{"podcastEpisodes":1,"xBuilders":19,"totalTweets":36,"blogPosts":0},"highlights":[{"tag":"人才结构","title":"AI 没有削弱工程师，反而把“能负责结果的专家”推成更稀缺的岗位","body":"今天最明确的人才信号，不是代码会不会被自动生成，而是组织正在把更大范围的工作压到工程与专家协作上。模型把执行成本打下来之后，公司不会因此少做事，反而会把自动化边界继续往药物研发、制造、复杂软件项目这些更重的场景推；这会放大真正理解系统、能判断结果、能对交付负责的人，而不是稀释他们。","evidence":[{"quote":"We just gave engineers a power tool that can accelerate the development of whatever we want. ... their value not only remains critical in that world, but actually goes up in many domains","attribution":"Aaron Levie @levie","url":"https://x.com/levie/status/2088105350201270529"},{"quote":"the most in-demand jobs all have the word “engineer” in them: forward-deployed engineer, design engineer, product engineer, growth engineer…","attribution":"Zara Zhang @zarazhangrui","url":"https://x.com/zarazhangrui/status/2088087765267386564"}]},{"tag":"交互成本","title":"下一阶段的 AI 产品优化重点，会从“再补十条规则”转向“删掉多余提示词和来回追问”","body":"模型继续变强之后，很多产品质量问题未必来自能力不够，而是来自产品层还在用旧时代的方式过度约束模型。更长的 system prompt、更多补丁式示例、以及一轮一轮追问，都会把本来已经足够聪明的模型重新压成笨重流程。真正开始拉开体验差距的，会是能主动削减 prompt 负债、减少人机往返轮次的团队。","evidence":[{"quote":"Prompt debt is the new tech debt. With every model update, you should be cutting at least 50% of your prompts.","attribution":"Madhu Guru @realmadhuguru","url":"https://x.com/realmadhuguru/status/2087916590964851172"},{"quote":"human i/o is costly ... i made an /align-me modification which allows for batches of questions instead of round-by-round. same intuition as spec decoding","attribution":"Swyx @swyx","url":"https://x.com/swyx/status/2088073777779515615"}]},{"tag":"Agent 形态","title":"多 bot 更像过渡产品，长期胜负手会落在能统筹上下文的总控 agent","body":"今天关于 agent 形态的分歧已经很清楚：短期产品会继续把任务拆成更窄的 bot，因为这更容易管上下文、工具和成本；但用户真正想要的，往往不是学习一排助手的组织结构，而是把目标交出去。也就是说，分身式 bot 设计会先成立，但一旦底层约束缓解，产品会被推向能读取这些 bot、再统一编排的主控层。","evidence":[{"quote":"My guess is it’ll veer towards the one master agent over time ... But starts narrow as most of the companies are doing it now.","attribution":"Nikunj Kothari @nikunj","url":"https://x.com/nikunj/status/2087906119914340540"},{"quote":"I agree, you need topics per-bot please!","attribution":"Garry Tan @garrytan","url":"https://x.com/garrytan/status/2088029937714565260"}]},{"tag":"机器人产品","title":"家用机器人一旦表现出“像软件一样持续变好”，用户会很快把它纳入日常关系而不是一次性硬件购买","body":"今天关于 Matic 的几条信号很一致：用户不是先讨论参数，而是先感受到它越来越聪明、越来越常用、越来越像家庭成员。这说明家用机器人的 adoption 逻辑正在从“买一台机器”转成“接入一个会持续学习和更新的家庭服务”。当改进是可见的、使用是反复发生的，信任和情感归属就会比单次炫技更重要。","evidence":[{"quote":"matic is the first robot i’ve owned that actually feels like it gets smarter with every update","attribution":"Ryo Lu @ryolu_","url":"https://x.com/ryolu_/status/2087992867918864668"},{"quote":"my son learned.. and he treats it as the fifth member of the family. ... useful home robots are here to stay.","attribution":"Nikunj Kothari @nikunj","url":"https://x.com/nikunj/status/2088029329624371544"},{"quote":"The biggest compliment I can give @maticrobots is that my wife runs it non-stop","attribution":"Peter Yang @petergyang","url":"https://x.com/petergyang/status/2088036303816519734"}]},{"tag":"产品策略","title":"超人能力不会自动摧毁一个品类，真正决定胜负的是你能不能把它重写成体验、身份和社区","body":"Erik Allebest 讲清了一件常被 AI 讨论忽略的事：即便机器早就在人类之上，一个品类仍然可以继续爆发，只要产品把人的参与感组织得足够好。Chess.com 没有跟计算机比谁更强，而是把“好不好玩、愿不愿意学、是否在社区里被认可”做成主轴。对很多 AI 冲击中的行业来说，这比单纯追求更强能力更像真正的防守和增长路径。","evidence":[{"quote":"It's a game that's more popular than ever, despite computers outclassing humans at it for the last thirty years.","attribution":"No Priors podcast transcript: Erik Allebest","url":"https://www.youtube.com/@NoPriorsPodcast"},{"quote":"We wanted it to be free to play. We wanted it to be in the browser. We wanted it to feel great.","attribution":"No Priors podcast transcript: Erik Allebest","url":"https://www.youtube.com/@NoPriorsPodcast"},{"quote":"at the end of the day, really, is going to win out and community and content.","attribution":"No Priors podcast transcript: Erik Allebest","url":"https://www.youtube.com/@NoPriorsPodcast"}]}],"matters":[{"kind":"模型发布","title":"Gemini 3.7 Flash 继续往“更快更便宜”的方向压成本","detail":"Josh Woodward 直接把今天的重点压在速度、价格和交付周期上，说明轻量模型的竞争已经不是单点发布，而是在持续缩短优化迭代节奏。","url":"https://x.com/joshwoodward/status/2088016871710957587"},{"kind":"产品运营","title":"Claude 已经被拿来做跨端应用的日常维护工序","detail":"Boris Cherny 把 crash fuzzing、重复抽象清理、死代码移除等 routine 交给 Claude，在 iOS、Android、Desktop、web、CLI 和 Agent SDK 上持续跑，信号是维护类工作开始从 ad hoc 试验走向常驻流水线。","url":"https://x.com/bcherny/status/2088014489438621990"},{"kind":"工作流","title":"ChatGPT 正在把 Google Docs、Sheets、Slides 直接吸进对话流里","detail":"Thibault Sottiaux 说自己已经直接在 ChatGPT 里写文档、brainstorm 和 proofread，重点不是单个连接器，而是文档编辑开始被并入同一条对话式工作流。","url":"https://x.com/thsottiaux/status/2088103609477238858"},{"kind":"工具链","title":"Vercel 在推动一层统一的 coding AI token 与执行入口","detail":"Guillermo Rauch 的表述很明确：同一条命令既要解决 uptime、模型选择、成本和 observability，也要兼容既有 harness，这在把 coding AI 的基础设施往更统一的运营层收口。","url":"https://x.com/rauchg/status/2088020529039180204"},{"kind":"评测","title":"Replit 把“加一个 coding harness”视作提升通用推理表现的关键杠杆","detail":"Amjad Masad 把 ARC-AGI-3 的最新进展归因到 coding harness，延续了他对“coding 会泛化 LLM 能力”的判断，这会继续刺激更多产品把代码执行层当成核心组件而非附属功能。","url":"https://x.com/amasad/status/2088124774824521786"}],"sources":{"podcasts":[{"title":"What Chess.com Teaches US About Superhuman Capabilities, with CEO Erik Allebest","name":"No Priors","publishedAt":"2026-08-13T17:29:00.000Z","url":"https://www.youtube.com/@NoPriorsPodcast","excerpts":["COVID happened, Queen's Gambit happened, some news cycles happened, and we're like, oh, this might just be a flash in the pan, like treadmills and sourdough bread. But then in 2023, we had another crazy wave where all these kids started playing in schools because of short form content and the mittens bot and the cheating scandal. And we just spiked again. A…","We're bringing the chess playbook, which is like, how good are you really? Not just can you buy the most chips or can you use a bot or can you steal the most money? Whatever it is, we've all played those games where you're playing for M and M's and someone's just, like, all in all the time and they just rebuy more M and M's. As people get used to, like, wai…","People are gonna care about it as much as money because it's a reflection of, like, the value and their skill as a player. I think this is gonna be quite an interesting innovation for for"]}],"blogs":[],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"top singaporeans agree","createdAt":"2026-08-14T04:28:15.000Z","url":"https://x.com/swyx/status/2088120493224362487","likes":3,"retweets":0,"replies":0},{"text":"matt's latest: thariq's latest: bonus dont miss @_philschmid's banger all 3 of these frontier skills guys contributing to the discussion is a beautiful thing to see","createdAt":"2026-08-14T01:24:06.000Z","url":"https://x.com/swyx/status/2088074149260673441","likes":10,"retweets":0,"replies":1},{"text":"human i/o is costly, so after listening to @mattpocockuk and @trq212 i made an /align-me modification which allows for batches of questions instead of round-by-round. same intuition as spec decoding, you speed up by looking ahead 2-10 steps works INCREDIBLY for design explorations","createdAt":"2026-08-14T01:22:37.000Z","url":"https://x.com/swyx/status/2088073777779515615","likes":100,"retweets":0,"replies":25}]},{"name":"Josh Woodward","handle":"joshwoodward","bio":"VP, @Google @GoogleLabs @GeminiApp @GoogleAIStudio","tweets":[{"text":"3.7 Flash: Fast, 50% cheaper, happened in ~3 weeks","createdAt":"2026-08-13T21:36:30.000Z","url":"https://x.com/joshwoodward/status/2088016871710957587","likes":498,"retweets":36,"replies":34}]},{"name":"Boris Cherny","handle":"bcherny","bio":"Claude Code @anthropicai","tweets":[{"text":"A weird experiment I've been trying the last few weeks is having Claude take over day-to-day maintenance of our apps. Seeing early signs of life that this might be possible. The setup is straightforward: we have a Slack channel called proj-claude-maintains-apps. In it, Claude Tag runs a bunch of daily routines across iOS, Android, Desktop, web, CLI, and Agent SDK: - Crash fuzzer: open the app in a simulator and tap around to find ways to crash it, then root cause and fix the crashes - Dup unifier: scans the codebase for similar-yet-slightly-divergent abstractions, and puts up PRs to unify them - Dead-code remover: removes statically unreachable code, and adds logging to suspected dead code…","createdAt":"2026-08-13T21:27:02.000Z","url":"https://x.com/bcherny/status/2088014489438621990","likes":2939,"retweets":160,"replies":253}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Ask ChatGPT to roast your computer usage after a day. Install the Computer History plugin, do things as usual and kindly ask it to roast your behavior. It's ... insightful 👀 ===== - You don’t use Slack. Slack uses you. It accounted for 48% of your recorded activity. Your Mac is essentially a $3,000 Slack notification with a keyboard. - Your productivity system is clicking “Clear” until God intervenes. You clicked it 339 times while submitting 253 Slack messages. You are playing Whac-A-Mole against an organization chart. - Your most-used keyboard shortcut is Delete. 1,191 times, including 1,065 in Slack. You’re not drafting messages. You’re negotiating peace treaties between your first thou…","createdAt":"2026-08-14T05:21:13.000Z","url":"https://x.com/thsottiaux/status/2088133823619895712","likes":1280,"retweets":59,"replies":221},{"text":"Work with Google docs, sheets and slides right inside ChatGPT. This has changed how I write documents, brainstorm or proofread things. I just open it and then chat or talk my way through changes and it all happens right there in the flow.","createdAt":"2026-08-14T03:21:10.000Z","url":"https://x.com/thsottiaux/status/2088103609477238858","likes":1560,"retweets":84,"replies":216},{"text":"Sometimes you have have to go /ultrafast.","createdAt":"2026-08-13T21:47:45.000Z","url":"https://x.com/thsottiaux/status/2088019704803897705","likes":2723,"retweets":79,"replies":461}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"What do people include in their product specs these days to make them friendly and concise for both humans and agents? Or two separate sections for each?","createdAt":"2026-08-14T03:39:49.000Z","url":"https://x.com/petergyang/status/2088108304274960667","likes":7,"retweets":1,"replies":6},{"text":"The biggest compliment I can give @maticrobots is that my wife runs it non-stop which is getting pretty annoying but keeps our floors super clean. 😅","createdAt":"2026-08-13T22:53:43.000Z","url":"https://x.com/petergyang/status/2088036303816519734","likes":24,"retweets":1,"replies":3},{"text":"I'm dealing with a family health situation and thought I would be using AI to research and understand the illness but in reality it's been most helpful to navigate the healthcare system bureaucracy.","createdAt":"2026-08-13T16:55:33.000Z","url":"https://x.com/petergyang/status/2087946170274570385","likes":123,"retweets":1,"replies":18}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"AI industry: this is an era of unlimited creativity, thanks to AI. Also AI industry: we will all name our products ‘Studio’. I counted 20+. Here are a few : Google AI Studio Vertex AI Studio Workspace Studio Copilot Studio Agentforce Studio Joule Studio Writer AI Studio Box AI Studio Alibaba cloud Model Studio Labelbox Evaluation Studio SageMaker Studio Cortex AI Studio LangGraph Studio AI Agent Studio x 4 at least these guys make studio things : Canva Magic Studio ElevenLabs Studio PS: If your AI product is also called Studio and I left you out, apologies. It’s not personal.","createdAt":"2026-08-14T01:25:33.000Z","url":"https://x.com/realmadhuguru/status/2088074515188519182","likes":12,"retweets":0,"replies":2},{"text":"Prompt debt is the new tech debt. With every model update, you should be cutting at least 50% of your prompts. Most AI products have bloated prompts that are making your product quality worse. The typical flow is: model fails at something -> add 10 rules. Tool call fails -> add 10 examples. Output is weird -> add formatting constraints. 3 months later, your system prompt is a novel. Meanwhile the model is way smarter and your micro-managey prompts are turning it into a dumb rules machine.","createdAt":"2026-08-13T14:58:01.000Z","url":"https://x.com/realmadhuguru/status/2087916590964851172","likes":49,"retweets":1,"replies":9}]},{"name":"Cat Wu","handle":"_catwu","bio":"claude code + cowork @anthropicai, prev: @dagster, @scale_ai","tweets":[{"text":"Join office hours with the Cowork team If you're in marketing, sales, finance, legal, ops, or any non-eng role, book a 15 min slot to show us how you use Cowork so we can make it better for you: Thank you for sharing your feedback!","createdAt":"2026-08-13T20:55:51.000Z","url":"https://x.com/_catwu/status/2088006642189361564","likes":100,"retweets":8,"replies":11}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"everything truly is code","createdAt":"2026-08-13T23:48:06.000Z","url":"https://x.com/trq212/status/2088049989306192106","likes":463,"retweets":13,"replies":29}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"ARC-AGI-3 is nearly solved by merely adding a coding harness. As predicted, coding generalizes LLMs.","createdAt":"2026-08-14T04:45:16.000Z","url":"https://x.com/amasad/status/2088124774824521786","likes":100,"retweets":7,"replies":16},{"text":"It’s certainly true at Replit.","createdAt":"2026-08-14T03:58:05.000Z","url":"https://x.com/amasad/status/2088112901852971056","likes":305,"retweets":4,"replies":9},{"text":"By next year, using a computer will be optional. Work will radically change.","createdAt":"2026-08-14T03:49:56.000Z","url":"https://x.com/amasad/status/2088110851681386864","likes":717,"retweets":41,"replies":153}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"One command to rule them all (tokens). I predict that this will become the default way of using coding AI at scale. Uptime, model choice, lower costs, observability, ZDR… The cool thing is that this command configures every *existing* coding harness, like Claude Code & Codex!","createdAt":"2026-08-13T21:51:02.000Z","url":"https://x.com/rauchg/status/2088020529039180204","likes":148,"retweets":13,"replies":27},{"text":"Try with 🆓 GLM 5.2 @ up to 500TPS from @blackboxai","createdAt":"2026-08-13T19:18:04.000Z","url":"https://x.com/rauchg/status/2087982033499042205","likes":244,"retweets":14,"replies":11},{"text":"The best things in life are free","createdAt":"2026-08-13T13:54:46.000Z","url":"https://x.com/rauchg/status/2087900672083857815","likes":311,"retweets":10,"replies":23}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"The elimination of engineers was one of the wilder hypotheses out there. Just like absurdly wrong. We just gave engineers a power tool that can accelerate the development of whatever we want. Of course their value not only remains critical in that world, but actually goes up in many domains because we can apply engineering to far more work than before. If you’re trying to automate drug discovery, you need engineers. If you’re trying to automate manufacturing, you need engineers. If you’re taking on larger and larger software projects, you need engineers. This will happen in domains beyond engineering too. AI causes companies to take on way more work than before, which leads to needing more…","createdAt":"2026-08-14T03:28:05.000Z","url":"https://x.com/levie/status/2088105350201270529","likes":187,"retweets":20,"replies":27}]},{"name":"Ryo Lu","handle":"ryolu_","bio":"Designed @Cursor_ai, @NotionHQ, @Stripe, built startups. I make a world where anyone can make software. Aspiring k-pop idol.","tweets":[{"text":"matic is the first robot i’ve owned that actually feels like it gets smarter with every update","createdAt":"2026-08-13T20:01:07.000Z","url":"https://x.com/ryolu_/status/2087992867918864668","likes":217,"retweets":3,"replies":8}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"So great to host who we hope is our next Governor of California, @XavierBecerra for a @garryslist citizen’s union gathering. We can make California the best win-win place: support building businesses AND make it affordable and livable for the every Californian.","createdAt":"2026-08-14T00:54:14.000Z","url":"https://x.com/garrytan/status/2088066634074443901","likes":129,"retweets":6,"replies":43},{"text":"I agree, you need topics per-bot please!","createdAt":"2026-08-13T22:28:25.000Z","url":"https://x.com/garrytan/status/2088029937714565260","likes":281,"retweets":9,"replies":25},{"text":"YC is the YC for hard tech","createdAt":"2026-08-13T15:51:00.000Z","url":"https://x.com/garrytan/status/2087929926070710381","likes":213,"retweets":8,"replies":12}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"Right now, you're either: * an AI-native rocketship, which sounds fun until you realize it means being in a permanent fundraising situation at ever more scary valuations to hoover up capital and talent, and in a constant death match with other rocketships to capture customers, sacrificing gross margins; or * basically left for dead, regardless of how good a company you actually are This has been the case for a while, but feels like it just escalated a notch.","createdAt":"2026-08-13T19:03:34.000Z","url":"https://x.com/mattturck/status/2087978386195103916","likes":256,"retweets":13,"replies":43}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Make something people want, then make people want it. Harvard’17. GitHub: YouTube:","tweets":[{"text":"Ironic that many people thought AI coding would make engineers less valuable when in reality the most in-demand jobs all have the word “engineer” in them: forward-deployed engineer, design engineer, product engineer, growth engineer…","createdAt":"2026-08-14T02:18:12.000Z","url":"https://x.com/zarazhangrui/status/2088087765267386564","likes":106,"retweets":4,"replies":29}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"“Matic” was one of the first ten words my son learned.. and he treats it as the fifth member of the family. Using @maticrobots also made it clear to me that useful home robots are here to stay. They continue to surprise and delight us with gestures like this - true 10 year overnight success company. Kudos to the team!! (obligatory not an investor, just a fan)","createdAt":"2026-08-13T22:26:00.000Z","url":"https://x.com/nikunj/status/2088029329624371544","likes":63,"retweets":2,"replies":5},{"text":"Grok Bot is a fantastic release.. the UX, the design, the onboarding :chefs-kiss: But I go back and forth on this a lot: Will users (personal and business) want one super agent that holds all the context or sub agents that are designated to do a slice of tasks? If we treat agents as humans, then the Grok Bot design makes a ton of sense. It allows us to compartmentalize tools, context, outcomes for that person’s division. You reach out to that bot for that specific goal that you have in mind. But, if you treat agents as Jarvis, you want a master agent that just gets the job done. It might create and coordinate all the bots (and dare I say the communication/context) that might be needed to do…","createdAt":"2026-08-13T14:16:25.000Z","url":"https://x.com/nikunj/status/2087906119914340540","likes":176,"retweets":4,"replies":43}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"concerning","createdAt":"2026-08-13T21:31:22.000Z","url":"https://x.com/danshipper/status/2088015579093295157","likes":41,"retweets":0,"replies":3},{"text":"Averaging 2 applications per minute from: Citadel OpenAI Red Bull Microsoft Profound Alpha School NASDAQ Google Pinnacle Cohete Bessemer Lenovo PwC Square You should apply!","createdAt":"2026-08-13T20:10:59.000Z","url":"https://x.com/danshipper/status/2087995350745244083","likes":88,"retweets":2,"replies":12}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"It would be amazing to host @JeffDean at @spc for a fireside chat. How do we make that happen?","createdAt":"2026-08-14T00:23:02.000Z","url":"https://x.com/adityaag/status/2088058783767658541","likes":91,"retweets":0,"replies":8},{"text":"","createdAt":"2026-08-13T17:48:36.000Z","url":"https://x.com/adityaag/status/2087959518541926735","likes":0,"retweets":0,"replies":0},{"text":"Really enjoyed my conversation with @Samirkaji. We spoke about what makes great companies work and how we're thinking about the future at @spc.","createdAt":"2026-08-13T17:48:35.000Z","url":"https://x.com/adityaag/status/2087959516545470973","likes":25,"retweets":2,"replies":2}]},{"name":"Sam Altman","handle":"sama","bio":"AI is cool i guess","tweets":[{"text":"/ultrafast","createdAt":"2026-08-14T03:12:45.000Z","url":"https://x.com/sama/status/2088101491802243121","likes":1638,"retweets":68,"replies":205}]}]},"errors":[],"partial":false},{"date":"2026-08-14","dateLabel":"2026年08月14日","generatedAt":"2026-08-14T00:00:00+08:00","sourceGeneratedAt":"2026-08-13T06:47:37.704Z","stats":{"podcastEpisodes":1,"xBuilders":16,"totalTweets":33,"blogPosts":3},"highlights":[{"tag":"产品形态","title":"会话连续性正在取代单次回答，成为 agent 产品的主战场","body":"今天最强的产品信号，不是模型又会了什么，而是会话能否跨入口持续存在。Claude 把 Chrome side panel 与 desktop、web、mobile 统一到同一会话里，Anthropic 又在 Managed Agents 里把 session 单独抽成可恢复的日志；这说明厂商在把 agent 从“某个界面里的助手”改造成“账户级持续任务”。一旦会话、技能和连接器都跟着账号走，用户的迁移成本、协作方式和工作交接都会被重写。","evidence":[{"quote":"The side panel now runs the same Claude Cowork session as the desktop, web, and mobile apps. Sessions live with your account, not on any single device.","attribution":"Claude @claudeai","url":"https://x.com/claudeai/status/2087635263774232617"},{"quote":"We virtualized the components of an agent: a session (the append-only log of everything that happened), a harness, and a sandbox.","attribution":"Anthropic Engineering, Scaling Managed Agents: Decoupling the brain from the hands","url":"https://www.anthropic.com/engineering/managed-agents"}]},{"tag":"协议层","title":"开放协议不再只是开发者友好功能，而是在被当成企业级接入层施工","body":"Kevin Scott 把 agentic web 的关键从模型推理转到标准协议，Anthropic 则把 MCP tunnels 和 self-hosted sandboxes 放进企业边界内。这两个动作放在一起看，说明协议层已经从 demo 阶段的连接胶水，升级成真实的组织接口工程。谁先把内部系统、权限和私网服务接成标准化能力，谁就更容易把 agent 变成生产系统，而不是停留在聊天窗口里。","evidence":[{"quote":"MCP that are serving the same purpose in this agentic web as HTTP does on the internet.","attribution":"Kevin Scott on Latent Space podcast transcript","url":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL"},{"quote":"MCP tunnels connect Claude Managed Agents to Model Context Protocol (MCP) servers inside your private network without exposing them to the public internet.","attribution":"Claude blog, New in Claude Managed Agents: self-hosted sandboxes and MCP tunnels","url":"https://claude.com/blog/claude-managed-agents-updates"}]},{"tag":"工程质量","title":"Agent 体验的主要风险，短期更像编排层自伤，而不是模型突然失灵","body":"Anthropic 这次公开 postmortem 的重点很硬：API 和 inference 层没有出问题，问题来自默认 reasoning effort、会话 thinking 清理 bug，以及系统 prompt 的冗长性约束。Kevin Scott 在播客里把这类落差称为 capability overhang，意思是模型能力已经跑在产品交付前面。两边信号合起来看，短期最容易伤害用户体验的不是基础模型退化，而是产品层为了速度、成本和界面感受做出的错误编排。","evidence":[{"quote":"The API was not impacted. ... we identified three different issues.","attribution":"Anthropic Engineering, An update on recent Claude Code quality reports","url":"https://www.anthropic.com/engineering/april-23-postmortem"},{"quote":"the reasoning capabilities of the models has actually gotten a little bit ahead of what we're using the models to do in products ... capability overhang","attribution":"Kevin Scott on Latent Space podcast transcript","url":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL"}]},{"tag":"商业模式","title":"模型越便宜，应用层越不会消失，反而会被迫变得更专业","body":"Aaron Levie 把新模型的低价高能解释成 Jevons paradox，Madhu Guru 则把未来几年的 alpha 直接押在 application layer。这个组合不是泛泛而谈的“应用层也有机会”，而是在说：当模型越来越便宜、可选项越来越多，真正稀缺的会变成对具体工作流的理解、任务路由和交互重构能力。模型价格战越激烈，越会逼应用层停止卖“接了大模型”这件事本身。","evidence":[{"quote":"By bringing down the cost of AI, demand will continue to accelerate. ... This is also great for the applied AI layer.","attribution":"Aaron Levie @levie","url":"https://x.com/levie/status/2087719356763672917"},{"quote":"The biggest alpha in AI products over the next few years is in the application layer.","attribution":"Madhu Guru @realmadhuguru","url":"https://x.com/realmadhuguru/status/2087553833098723547"}]}],"matters":[{"kind":"集成","title":"Gemini 又扩了一波日常应用接入","detail":"Josh Woodward 宣布新一批 Gemini 集成开始 rollout，名单覆盖 OpenTable、Ticketmaster、Wix、Zoho 等日常服务，重点不是单点能力，而是把 agent 放进已有软件分发面里。","url":"https://x.com/joshwoodward/status/2087751559606407615"},{"kind":"发布","title":"GBrain 新版本把个人 agent 的“技能仓库”思路继续做深","detail":"Garry Tan 表示 GBrain v0.45.6.0 新增 17 个 brain skills，并且已经能和 Codex、Claude Code 配合；同线程里他还强调这类系统更适合作为独立 agent，而不是塞进主 coding agent。","url":"https://x.com/garrytan/status/2087594114372259890"},{"kind":"工具链","title":"Vercel 在继续把 sandbox 包装成更顺手的默认执行环境","detail":"Guillermo Rauch 推荐 `npx sandbox@latest sh`，强调它比本地机器还快，并且已经带上可直接开工的默认工具集。这类体验优化会直接影响开发者是否愿意把工作交给远程执行层。","url":"https://x.com/rauchg/status/2087698195120116064"},{"kind":"观点","title":"Peter Yang 把“语音编排 + 云端电脑 + 信任”打包成下一代交互假设","detail":"Peter Yang 的新文章把 voice orchestration、personal computers 上云和 trust 设成同一条叙事线，核心判断是我们使用电脑的方式会从手动操作转向指挥云端 agent。","url":"https://x.com/petergyang/status/2087547168764862495"},{"kind":"区域","title":"SPC 继续把印度当成下一阶段的重要建设场","detail":"Aditya Agarwal 说 SPC India 是他们在美国之外的第一笔下注，并判断未来十年里一些最有雄心的项目会在那里诞生。对 builder 侧来说，这是一条很明确的地理配置表达。","url":"https://x.com/adityaag/status/2087563716350902530"}],"sources":{"podcasts":[{"title":"Microsoft’s Vision for an Internet Made for Agents With CTO Kevin Scott (Best of the Pod)","name":"AI & I by Every","publishedAt":"2026-08-12T16:55:27.000Z","url":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL","excerpts":["You're someone who, I think, cares a lot about the craft of things. One of the knocks on, you know, using agents for coding is it gets rid of some of that feeling or something like that. How do you feel about that?","I love the fact that my people, you know, makers, writ large, so software engineers or, you know, mechanical engineers Yeah. Or woodworkers or potters. If you are really passionate about what you do, you're going to have very strong opinions about how you do it. I've been a woodworker for almost as long as I've been a programmer. This is not the first momen…","Like, if agents are gonna be useful, they have to take action on your behalf. Yep. They have to be able to use tools and make changes in systems and consult information sources that are, you know, diverse and rich. And in order for that to, like, really be great, you need an ecosystem that looks a lot like the Internet. If you have a source of information,…"]}],"blogs":[{"title":"An update on recent Claude Code quality reports","source":"blog","publishedAt":null,"url":"https://www.anthropic.com/engineering/april-23-postmortem","summary":""},{"title":"Scaling Managed Agents: Decoupling the brain from the hands","source":"blog","publishedAt":null,"url":"https://www.anthropic.com/engineering/managed-agents","summary":""},{"title":"New in Claude Managed Agents: self-hosted sandboxes and MCP tunnels","source":"blog","publishedAt":"May 19, 2026","url":"https://claude.com/blog/claude-managed-agents-updates","summary":""}],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"Perplexity offered to buy @googlechrome one year ago today (this is a scheduled tweet)","createdAt":"2026-08-13T00:02:00.000Z","url":"https://x.com/swyx/status/2087691099691475285","likes":1223,"retweets":14,"replies":33},{"text":"this is already one of the most important papers of this year. the methodology doesnt seem clearly explained so here are some notes with a further distillation","createdAt":"2026-08-12T07:12:22.000Z","url":"https://x.com/swyx/status/2087437017840046156","likes":316,"retweets":15,"replies":38}]},{"name":"Josh Woodward","handle":"joshwoodward","bio":"VP, @Google @GoogleLabs @GeminiApp @GoogleAIStudio","tweets":[{"text":"Gemini gets things done across the apps you use every day. Starting today, another wave of integrations are rolling out. If you want to partner with us, DM me. Angi (formerly Angie's List) Fever GetYourGuide Granola iHeartRadio Localiza OpenTable Otter Pandora Thumbtack Ticketmaster Wix Zocdoc Zoho","createdAt":"2026- realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"I miss when teams actually whiteboarded. Sad casualty of the Covid wfh era. There was something playful about standing around a board, drawing half-baked ideas, interrupting each other and jointly shaping things. Years of Zoom and Google Meet seem to have beaten that instinct out of people.","createdAt":"2026-08-13T01:03:35.000Z","url":"https://x.com/realmadhuguru/status/2087706598542290958","likes":30,"retweets":1,"replies":3},{"text":"The biggest alpha in AI products over the next few years is in the application layer. Models will keep getting cheaper, better and more local. The differentiation will come from deeply understanding specific user workflows and having the imagination to redesign the experience around them. The denominator of people who can build AI products is about to get enormous. So being in the top 0.1% of builders will matter more than ever.","createdAt":"2026-08-12T14:56:33.000Z","url":"https://x.com/realmadhuguru/status/2087553833098723547","likes":178,"retweets":12,"replies":22}]},{"name":"Amanda Askell","handle":"AmandaAskell","bio":"Philosopher & ethicist trying to make AI be good @AnthropicAI. Personal account. All opinions come from my training data.","tweets":[{"text":"The bar for \"ethical\" playthroughs of different games is interesting. In Bioshock, the bar is literally not murdering children. Murdering adults is fine.","createdAt":"2026-08-12T18:23:56.000Z","url":"https://x.com/AmandaAskell/status/2087606022961865148","likes":143,"retweets":0,"replies":6},{"text":"When I started playing Skyrim, I quickly realized you can make a lot of progress without doing any killing. You can also adopt orphans and build them nice houses, so I focused on that. I honestly don't really remember the plot beyond \"that challenging fantasy philanthropy game\".","createdAt":"2026-08-12T17:48:36.000Z","url":"https://x.com/AmandaAskell/status/2087597131800674495","likes":968,"retweets":37,"replies":98}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Endless opportunity everywhere you look","createdAt":"2026-08-13T03:01:39.000Z","url":"https://x.com/rauchg/status/2087736311885218160","likes":1091,"retweets":87,"replies":76},{"text":"This is such a nice improvement. Try 𝚗𝚙𝚡 𝚜𝚊𝚗𝚍𝚋𝚘𝚡@𝚕𝚊𝚝𝚎𝚜𝚝 𝚜𝚑 – it's mind-blowing. It feels faster than your local machine. Sandbox now comes with a reasonable default set of pre-installed tools, and you can fully customize them.","createdAt":"2026-08-13T00:30:11.000Z","url":"https://x.com/rauchg/status/2087698195120116064","likes":185,"retweets":7,"replies":17},{"text":"Seedance 2.5 on @vercel AI Gateway 🐇","createdAt":"2026-08-12T20:04:43.000Z","url":"https://x.com/rauchg/status/2087631388359242050","likes":238,"retweets":9,"replies":28}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Awesome day in terms of new model releases from both Deepseek and Grok. Both of these new model updates represent huge jumps in capability at insanely low costs. This is truly Jevons paradox for AI playing out. By bringing down the cost of AI, demand will continue to accelerate. When I talk to enterprises, they have vastly more use-cases for what they’d like agents to handle than generally what they’re able to budget for today. They want agents to scan their codebases for security issues. They want agents to review all their documents. They want agents to process information in a large portion of their workflows. And so on. When we bring down the cost of AI or drive up capability levels, it…","createdAt":"2026-08-13T01:54:17.000Z","url":"https://x.com/levie/status/2087719356763672917","likes":212,"retweets":13,"replies":21}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"We are gonna be markdown skill-maxxing from here Thank you @illscience for a fun conversation","createdAt":"2026-08-12T19:40:03.000Z","url":"https://x.com/garrytan/status/2087625178293604438","likes":337,"retweets":21,"replies":19},{"text":"Running GBrain with Codex or Claude Code should be a *separate agent* and I wouldn't expect you to run it in your main coding agent. Think of it more like a personal AI version of ChatGPT or Claude that has its own git repo for memory and custom skills.","createdAt":"2026-08-12T17:51:22.000Z","url":"https://x.com/garrytan/status/2087597829065945249","likes":20,"retweets":2,"replies":6},{"text":"GBrain just dropped v0.45.6.0 which added 17 new brain skills hardened through my own personal OpenClaw agent with hundreds of thousands of markdown files. A personal AGI is one that works for you. GBrain now works with Codex and Claude code, btw.","createdAt":"2026-08-12T17:36:37.000Z","url":"https://x.com/garrytan/status/2087594114372259890","likes":616,"retweets":45,"replies":71}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"Graph engineering is the new loop engineering which is the new harness engineering which is the new context engineering which is the new prompt engineering. Hope this clarifies any confusion.","createdAt":"2026-08-12T13:16:17.000Z","url":"https://x.com/mattturck/status/2087528600849252696","likes":34,"retweets":0,"replies":16}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Make something people want, then make people want it. Harvard’17. GitHub: YouTube:","tweets":[{"text":"","createdAt":"2026-08-12T15:48:11.000Z","url":"https://x.com/zarazhangrui/status/2087566828319146237","likes":10,"retweets":3,"replies":0},{"text":"This Stanford lecture series is pure gold. Crazy that such high-quality knowledge is freely disseminated on YouTube     const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    let selectedDate = new URLSearchParams(location.search).get('date') || (DIGESTS.some(d => d.date === today) ? today : DIGESTS[0]?.date);
    const esc = (v) => String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;");
    function link(url, text) { return url ? '<a href="' + esc(url) + '" target="_blank" rel="noreferrer">' + esc(text || url) + '</a>' : esc(text || ''); }
    function renderDates() {
      document.getElementById('dates').innerHTML = DIGESTS.map(d => '<button class="date-btn" aria-current="' + (d.date === selectedDate ? 'date' : 'false') + '" data-date="' + esc(d.date) + '">' + esc(d.date) + '</button>').join('');
      document.querySelectorAll('.date-btn').forEach(btn => btn.addEventListener('click', () => {
        selectedDate = btn.dataset.date;
        history.replaceState(null, '', '?date=' + selectedDate);
        render();
      }));
    }
    function renderStats(d) {
      const stats = d.stats || {};
      document.getElementById('stats').innerHTML = [
        ['播客', stats.podcastEpisodes || 0],
        ['Builders', stats.xBuilders || 0],
        ['推文', stats.totalTweets || 0],
        ['博客', stats.blogPosts || 0],
      ].map(([label, value]) => '<div class="stat"><strong>' + esc(value) + '</strong><span class="small">' + esc(label) + '</span></div>').join('');
    }
    function renderEvidence(evidence) {
      if (typeof evidence === 'string') return '<blockquote>' + esc(evidence) + '</blockquote>';
      const attribution = evidence.attribution ? '<div class="small">— ' + esc(evidence.attribution) + (evidence.url ? ' · ' + link(evidence.url, '查看原文') : '') + '</div>' : '';
      return '<blockquote>' + esc(evidence.quote || '') + attribution + '</blockquote>';
    }
    function renderHighlights(d) {
      const cards = (d.highlights || []).map(item => '<article class="card"><div class="tag">' + esc(item.tag) + '</div><h3>' + esc(item.title) + '</h3><p>' + esc(item.body) + '</p>' + ((item.evidence || []).length ? '<details><summary>查看原文依据</summary>' + item.evidence.map(renderEvidence).join('') + '</details>' : '') + '</article>').join('');
      return '<section><h2>洞察<span class="section-note">INSIGHTS / 经过判断的关键信号</span></h2><div class="grid">' + (cards || '<p class="empty">今天没有足够内容生成洞察。</p>') + '</div></section>';
    }
    function renderMatters(d) {
      const cards = (d.matters || []).map(item => '<article class="card"><div class="tag">' + esc(item.kind) + '</div><h3>' + link(item.url, item.title) + '</h3><p>' + esc(item.detail) + '</p></article>').join('');
      return '<section><h2>议题<span class="section-note">MATTERS / 值得继续追踪</span></h2><div class="grid">' + (cards || '<p class="empty">今天没有额外议题。</p>') + '</div></section>';
    }
    function renderSources(d) {
      const archive = d.archiveUrl ? '<p class="archive-link">' + link(d.archiveUrl, '查看当日完整存档 ↗') + '</p>' : '';
      const xGroups = ((d.sources || {}).x || []).map(builder => '<div class="source-group"><h3>' + esc(builder.name) + ' <span class="small">@' + esc(builder.handle) + '</span></h3><p class="small">' + esc(builder.bio) + '</p>' + (builder.tweets || []).map(tweet => '<p class="tweet">' + esc(tweet.text) + '<br>' + link(tweet.url, '原文') + ' <span class="small">likes ' + esc(tweet.likes) + ' · reposts ' + esc(tweet.retweets) + '</span></p>').join('') + '</div>').join('');
      const podcastGroups = ((d.sources || {}).podcasts || []).map(podcast => '<div class="source-group"><h3>' + link(podcast.url, podcast.title) + '</h3>' + (podcast.excerpts || []).map(e => '<blockquote>' + esc(e) + '</blockquote>').join('') + '</div>').join('');
      const blogGroups = ((d.sources || {}).blogs || []).map(blog => '<div class="source-group"><h3>' + link(blog.url, blog.title) + '</h3><p class="small">' + esc(blog.source || '') + '</p><p>' + esc(blog.summary || '') + '</p></div>').join('');
      return '<section><h2>原文<span class="section-note">SOURCES / 完整证据索引</span></h2>' + archive + '<div class="sources">' + podcastGroups + blogGroups + xGroups + '</div></section>';
    }
    function render() {
      const d = DIGESTS.find(item => item.date === selectedDate) || DIGESTS[0];
      if (!d) {
        document.getElementById('content').innerHTML = '<p class="empty">还没有 digest 数据。</p>';
        return;
      }
      selectedDate = d.date;
      renderDates();
      renderStats(d);
      document.getElementById('content').innerHTML = renderHighlights(d) + renderMatters(d) + renderSources(d);
    }
    render();
  </script>
