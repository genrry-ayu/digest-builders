enNYC/videos","excerpts":["Humans are already used to working with non deterministic systems, it's just the systems are normally their co workers, not their computers. And in many ways, like companies and processes is all about how do you design a system for non deterministic entities to coordinate together to solve a problem? And once you realize that, it's like, well, now it's like…","They all pass. That looks good. Are you confident that that now generalizes to the real world to production? And our answer has been no. Even if you got it right a 100 out of a 100 times, if a person is just getting it right because they're going to Wikipedia, the accounting firm wouldn't hire them, and so they shouldn't hire us either.","You'll see people, like, freaking out over a code file that isn't abstracted properly, and yet their context is, like, total shit. The English is more precious because the English affects the performance. The code does not affect the performance."]}],"blogs":[{"title":"Building intelligent apps for Apple platforms with Claude in the Foundation Models framework","source":"blog","publishedAt":"Jun 08, 2026","url":"https://claude.com/blog/claude-for-foundation-models","summary":""}],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"the ai-devblog skill elicits what YOU think the story is, and works with you to trace what you read and report it faithfully. also does visuals...","createdAt":"2026-08-07T06:39:36.000Z","url":"https://x.com/swyx/status/2085616830786543667","likes":0,"retweets":0,"replies":0},{"text":"reader: it was not the last spec","createdAt":"2026-08-07T06:25:47.000Z","url":"https://x.com/swyx/status/2085613357080723846","likes":1,"retweets":0,"replies":1},{"text":"reply","createdAt":"2026-08-07T03:36:45.000Z","url":"https://x.com/swyx/status/2085570817786880265","likes":0,"retweets":0,"replies":0}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Free users of ChatGPT now have unlimited text chats, powered by GPT-5.6 Luna","createdAt":"2026-08-07T06:13:22.000Z","url":"https://x.com/thsottiaux/status/2085610231707623750","likes":210,"retweets":7,"replies":33},{"text":"I meant to say \"ghiblify\", but I said \"gimlify\"","createdAt":"2026-08-07T06:12:28.000Z","url":"https://x.com/thsottiaux/status/2085610005768945984","likes":513,"retweets":9,"replies":165},{"text":"You can just ask Codex with GPT-5.6 Sol the wildest things and it will just do it. I talk to it for 5 minutes straight with things that just seem to require weeks of work, get up to get something in the fridge, pet the dog, come back and ... it's done.","createdAt":"2026-08-07T05:23:31.000Z","url":"https://x.com/thsottiaux/status/2085597685948813610","likes":2279,"retweets":64,"replies":803}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"damn where's the ping Tibo to reset button","createdAt":"2026-08-07T00:18:25.000Z","url":"https://x.com/petergyang/status/2085520904398999901","likes":153,"retweets":0,"replies":31},{"text":"Consumer is basically ChatGPT and Google's market to lose in my opinion. ChatGPT already has 1B users and needs to get them to connect their favorite apps and use agents to do work. OpenAI is already pioneering new interaction patterns like voice. The biggest barriers to overcome are: 1) Normies not trusting AI and ChatGPT with full access to their apps and data. 2) Normies not realizing what ChatGPT is now capable of. In both cases, I think marketing and the right messaging are just as important as improving the product. Google Gemini also has almost 1B users and my gut is normies trust it more to connect to email, calendar, Workspace, Chrome, etc since it's all the same login. But Google…","createdAt":"2026-08-06T18:06:09.000Z","url":"https://x.com/petergyang/status/2085427222836658600","likes":158,"retweets":5,"replies":35},{"text":"This is (of course) a massive distraction but the game I dream of building with AI is a roguelike deckbuilder that has great graphics, gameplay, and story.","createdAt":"2026-08-06T17:52:03.000Z","url":"https://x.com/petergyang/status/2085423674073751813","likes":15,"retweets":0,"replies":8}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"","createdAt":"2026-08-07T01:12:13.000Z","url":"https://x.com/realmadhuguru/status/2085534442781868128","likes":18,"retweets":0,"replies":2},{"text":"I’ve noticed people are much clearer when they speak through new ideas than writing a doc on it. Somewhere between their mouth and the doc, the core idea gets buried as they try to add context, polish it and make it sound smart. So here’s what I ask my teams to do: record yourself explaining the idea exactly as you would to a friend, use ai to do basic cleanup but keep the rough original structure and flow. Share that doc.","createdAt":"2026-08-06T15:39:12.000Z","url":"https://x.com/realmadhuguru/status/2085390240899043406","likes":100,"retweets":5,"replies":11}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Guinness world record for collaborative coding.","createdAt":"2026-08-07T01:52:29.000Z","url":"https://x.com/amasad/status/2085544577415696405","likes":45,"retweets":2,"replies":8},{"text":"It’s true, in 21/22 I went around the valley asking everyone to train coding specific models with us: Google, Meta, everyone — no one thought it was as important as NLP use cases — eventually we trained our own: Replit-code-3b and then everyone got code pilled.","createdAt":"2026-08-07T01:50:16.000Z","url":"https://x.com/amasad/status/2085544020424716723","likes":102,"retweets":9,"replies":16},{"text":"Airtable bookends the rise and fall of “no code.” I remember arguing endlessly with investors about this. UI can never let you build arbitrary software. The way to make software accessible was always to solve code itself. For a long time, that sounded delusional. Not anymore.","createdAt":"2026-08-06T19:41:25.000Z","url":"https://x.com/amasad/status/2085451197323034902","likes":595,"retweets":33,"replies":59}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"FreeAI","createdAt":"2026-08-06T17:48:09.000Z","url":"https://x.com/rauchg/status/2085422692799570171","likes":94,"retweets":3,"replies":17},{"text":"Devtools must be 1️⃣ open source and 2️⃣ universally extensible. AI coding agents are the most important devtools in the history of our industry. The Plugin standard lets anybody extend them uniformly. This is huge for the ecosystem. Build a Plugin → get exposure to the tidal wave of software creation from every agent: CLIs, IDEs, cloud agents, and even personal assistants.","createdAt":"2026-08-06T16:30:35.000Z","url":"https://x.com/rauchg/status/2085403169551790359","likes":410,"retweets":13,"replies":51}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"If you’re trying to understand the dynamic of real world agent adoption this post is a great place to start. Everyone got so hooked on talking to chatbots that there’s limited recognition still that working with an agent is much more like managing someone in a process vs. just asking an ai some questions and getting a response back. “prompting an agent is closer to writing a spec than asking a question. you have to scope the task extensively and define what \"done\" looks like.” Ultimately, the real upside of agents is when you start to change the underlying workflow itself instead of just treating it as another system you ask questions of. This means getting the agents the right data to work…","createdAt":"2026-08-07T04:41:22.000Z","url":"https://x.com/levie/status/2085587079405425146","likes":61,"retweets":3,"replies":19},{"text":"Huge Atlassian quarterly beat. There was a misplaced thesis over the past 6 months that somehow agents would be bad for certain software categories. There’s definitely truth in this in some areas, but many were parsing this poorly. In a world where agents are generating 100X more code, processing massive amounts of data, or making decisions across your systems, the role of the platforms that manage this data and these workflows becomes more important, not less. Enterprises care about governance, security, compliance, guardrails, safe access to data, and many more critical capabilities that go into these systems of record.","createdAt":"2026-08-06T21:13:16.000Z","url":"https://x.com/levie/status/2085474309943030032","likes":903,"retweets":39,"replies":64}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Here's what I think you need to know about personal AGI - not a chatbot that anyone can have, but one that knows you uniquely, now and into the future","createdAt":"2026-08-06T19:21:03.000Z","url":"https://x.com/garrytan/status/2085446068461043722","likes":277,"retweets":32,"replies":41}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"Quite the group of investors in Basis, btw @rabois, @Mkclements , @amasad, @ClementDelangue, @jaltma, @JeffDean, @polynoamial, @kvogt, @lennysan, @azeem, @LHSummers, @douwekiela, @pirroh , @scottbelsky, @natfriedman, @danielgross, @lloydblankfein, @vkhosla, @khoslaventures, @Accel, @GVteam, @BoxGroupVC","createdAt":"2026-08-06T17:37:03.000Z","url":"https://x.com/mattturck/status/2085419899078295979","likes":8,"retweets":0,"replies":2},{"text":"This reference conversation on how to build long-horizon AI agents with @mitch_troy of @trybasis is also available on Spotify, Apple Podcasts and here on YouTube:","createdAt":"2026-08-06T16:29:40.000Z","url":"https://x.com/mattturck/status/2085402938101379487","likes":4,"retweets":1,"replies":1},{"text":"How to build long-horizon AI agents: behavior specs, ontologies, process supervision - my conversation with @mitch_troy, co-founder of @trybasis 01:09 Why Everyone at Basis Was Whispering to AI when @steph_palazzolo walked in 04:12 Accounting as \"an Intelligence Over the Economy\" 06:11 What Makes an Agent Truly Long-Horizon 08:24 Inside an Autonomous, Multi-Day Tax Return 10:19 Agents That Hand Off Like Senior Engineers 11:17 A Brief History of Agents: From ReAct to Today 12:33 Why LLMs Have No Long-Term Memory 14:13 Why AutoGPT Didn't Live Up to Its Promise 15:51 The Three Breakthroughs: Opus 3, o1, o3 17:07 Why Reasoning Models Unlocked Agents 18:23 \"Let's Verify Step by Step\": The Road N…","createdAt":"2026-08-06T16:29:38.000Z","url":"https://x.com/mattturck/status/2085402933579964730","likes":58,"retweets":13,"replies":6}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Dangerously skips permissions. Harvard’17. GitHub: YouTube:","tweets":[{"text":"Question: is anyone using Claude Tag (or other equivalent team agents) heavily in your team? What have been the top use cases/aha moments?","createdAt":"2026-08-06T14:23:59.000Z","url":"https://x.com/zarazhangrui/status/2085371310042169630","likes":26,"retweets":1,"replies":16}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"Wow this blew up my inbox - I’ll try to respond to as many DMs as I can tomorrow! Feel free to ask questions publicly and I’ll reply here as well!","createdAt":"2026-08-07T05:23:17.000Z","url":"https://x.com/nikunj/status/2085597628121878721","likes":0,"retweets":0,"replies":0},{"text":"Alright August fundraising season is here (got 9 intros this week) so here’s a brain dump of tips that no VC will tell you.. > who you talk to and get to an intro at a VC firm really matters. associates and principals ARE really great. i genuinely mean it BUT you have to see what they have backed recently to understand what kind of leverage they have. what’s their standing in the firm. new, worked on a few great recent deals and understand your space, talk to them. if not, they might be on the way out. always get a warm intro to them as well. understand quickly if the fund will actually be interested vs. lip service. also know once you are assigned to someone in the CRM, you’re stuck with t…","createdAt":"2026-08-06T15:08:17.000Z","url":"https://x.com/nikunj/status/2085382457457828153","likes":484,"retweets":15,"replies":31}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"your boy made it into @axios today!","createdAt":"2026-08-06T17:40:37.000Z","url":"https://x.com/danshipper/status/2085420793400316270","likes":43,"retweets":2,"replies":2}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"@spc","createdAt":"2026-08-06T13:56:41.000Z","url":"https://x.com/adityaag/status/2085364438845022389","likes":5,"retweets":0,"replies":0},{"text":"A good day to apply to @spc","createdAt":"2026-08-06T13:56:13.000Z","url":"https://x.com/adityaag/status/2085364323707150758","likes":114,"retweets":9,"replies":13},{"text":"I have learnt an incredible amount from Tom and I could not be more proud that @GoodfireAI was born at SPC.","createdAt":"2026-08-06T10:41:02.000Z","url":"https://x.com/adityaag/status/2085315202237546603","likes":16,"retweets":1,"replies":2}]},{"name":"Sam Altman","handle":"sama","bio":"AI is cool i guess","tweets":[{"text":"5.6 Sol much better in chat now and unlimited text chat for free users!","createdAt":"2026-08-06T19:56:24.000Z","url":"https://x.com/sama/status/2085454964814753990","likes":6740,"retweets":276,"replies":611}]},{"name":"Claude","handle":"claudeai","bio":"Claude is an AI assistant built by @anthropicai to be safe, accurate, and secure. Talk to Claude on or download the app.","tweets":[{"text":"We’re updating Claude Fable 5’s biology safeguards to reduce false positives. In our testing, this update reduced biology-related fallbacks by about 85% across our product surfaces. Fable can now assist on a wider range of everyday health and educational questions. We believe the biggest positive impacts of AI will be in biology and medicine, and we’re committed to putting frontier intelligence safely into the hands of as many researchers as possible. Fable will continue to fallback to Opus 5 for requests we consider dual-use—including virology, toxicology, and molecular design—so it isn't yet usable for professional biology research and drug development. We're committed to closing that gap…","createdAt":"2026-08-07T03:08:54.000Z","url":"https://x.com/claudeai/status/2085563808773189680","likes":3695,"retweets":291,"replies":516}]}]},"errors":[],"partial":false},{"date":"2026-08-07","dateLabel":"2026年08月07日","generatedAt":"2026-08-07T00:00:00+08:00","sourceGeneratedAt":"2026-08-06T07:12:37.473Z","stats":{"podcastEpisodes":1,"xBuilders":16,"totalTweets":34,"blogPosts":0},"highlights":[{"tag":"产品扩散","title":"真正的 AI 大众化产品，会先把“模型、提示词、MCP”这些词从界面里抹掉","body":"今天最一致的信号不是模型又强了多少，而是当前产品还把内部实现暴露给用户。无论是对 blank window 的批评，还是对学习曲线的抱怨，矛头都指向同一点：扩散瓶颈在产品封装层，不在用户教育。谁先把复杂度吞进系统内部，谁更可能拿到真正的大众采用。","evidence":[{"quote":"We greet them with a blank window... context windows, reasoning, MCP, memory, and skills are.","attribution":"Madhu Guru","url":"https://x.com/realmadhuguru/status/2085036386781221257"},{"quote":"It shouldn't be this hard.","attribution":"Sarah（AI & I by Every）","url":"https://www.youtube.com/watch?v=dlI-5W7d7uU"}]},{"tag":"消费产品","title":"下一个消费级 AI 爆款更像社区，而不是更会聊天的单人助手","body":"播客里对“单人模式”的反复强调，本质上是在谈增长结构，而不是界面偏好。只要高阶用法仍靠少数高手摸索，再由普通用户照抄，真正的价值就会积在社区和分发机制里，而不是单个对话框本身。消费端的护城河更可能来自 UGC 网络，而不是更会解析 prompt 的聊天框。","evidence":[{"quote":"What's the multiplayer network effect type experience? Someone's gonna create a UGC type community","attribution":"Sarah（AI & I by Every）","url":"https://www.youtube.com/watch?v=dlI-5W7d7uU"},{"quote":"I don't think ChatGPT is the single player mode product.","attribution":"Sarah（AI & I by Every）","url":"https://www.youtube.com/watch?v=dlI-5W7d7uU"}]},{"tag":"Agent 范式","title":"Agent 不会先靠定义被接受，而会先靠“能把活接住”被接受","body":"Nan Yu 对“ChatGPT 为什么不算 agent”的追问，和 Swyx 对线程回调式多 agent 工作流的描述，说明市场正在跳过术语争论。用户最终感知到的不是它叫 chat 还是 agent，而是它能不能拆任务、保留上下文、等子流程完成再回来继续。概念边界会越来越模糊，执行闭环会越来越具体。","evidence":[{"quote":"a very primitive form of the near term multiagent agi future is setting up one thread to ping back once its done","attribution":"Swyx","url":"https://x.com/swyx/status/2085253030417461661"},{"quote":"How is ChatGPT *not* an agent?","attribution":"Nan Yu","url":"https://x.com/thenanyu/status/2085126362944229400"}]},{"tag":"企业落地","title":"企业 agent 的难点已经不是会不会推理，而是能不能进入真实工作环境","body":"Aaron Levie 说扩散要按“年”算，不是因为企业不相信模型，而是因为工作流必须被重写。Peter Steinberger 把 Codex 接到 video-enabled remote KVM 做 iMessage e2e，则把这个门槛具象化了：高价值自动化最终都要落在浏览器、桌面、权限和遗留系统里。没有环境接入，agent 只是演示；有了环境接入，才开始碰真正的部署难题。","evidence":[{"quote":"it’s going to take years for diffusion of agents across the economy because workflows have to re-engineered","attribution":"Aaron Levie","url":"https://x.com/levie/status/2085200776159490111"},{"quote":"I gave codex a video-enabled remote KVM so it can automate e2e test the iMessage-integration","attribution":"Peter Steinberger","url":"https://x.com/steipete/status/2084988316324397312"}]},{"tag":"基础设施","title":"当并发算力变得可加可抬，竞争会从“有没有 agent”转向“谁在管 agent”","body":"Guillermo 把并发和 CPU core 讲成可上调配额，Nikunj 则直接预告 control plane、rails、unverifiable fields 会更高频地进入讨论。两条信号放在一起的含义很清楚：单次调用本身越来越不稀缺，真正变难的是怎么调度、约束、审计和解释一群 agent 的行为。基础设施层的价值，正在从模型入口迁移到治理入口。","evidence":[{"quote":"Infinite agent compute 10,000 concurrent + 5,000 CPU cores per minute and these quotas are raisable","attribution":"Guillermo Rauch","url":"https://x.com/rauchg/status/2085077900190208080"},{"quote":"out of distribution / control plane / unverifiable fields / rails / intelligence per watt","attribution":"Nikunj Kothari","url":"https://x.com/nikunj/status/2085209022115029132"}]}],"matters":[{"kind":"产品发布","title":"Dreambeans 向美国 AI Pro 订阅用户扩容","detail":"Google Labs 扩大 Dreambeans 覆盖范围，继续把“每日个性化阅读”包装成更轻的消费型 AI 入口。","url":"https://x.com/GoogleLabs/status/2085048743322345545"},{"kind":"工作流","title":"/human-review 把文档收尾改成可视化协作","detail":"Peter Yang 发布新 skill，可直接编辑 HTML/Markdown、调整图片尺寸、留评论，再把修改发回 agent 应用。","url":"https://x.com/petergyang/status/2085055745410945126"},{"kind":"产品用法","title":"Codex 团队继续把 /goal 推成核心使用路径","detail":"Thibault Sottiaux 公开推荐探索 `/goal`，把它描述成 GPT-5.6 Sol 上很强的一条循环工作流。","url":"https://x.com/thsottiaux/status/2085174625655198156"},{"kind":"认知","title":"Zara Zhang 提醒 AI 圈正在加速 groupthink","detail":"她直接点名当前 AI 讨论里的从众倾向，给当天一串高共识叙事补了一个逆向提醒。","url":"https://x.com/zarazhangrui/status/2084995439745536082"},{"kind":"创作判断","title":"Garry Tan 继续押注“质量压过检测”","detail":"他把 AI 检测争议类比成机器压制餐叉，核心判断是当生成质量足够高时，来源焦虑会弱化。","url":"https://x.com/garrytan/status/2085038756906901656"},{"kind":"人才","title":"Amjad Masad 再次强调小圈层里的 founder 密度","detail":"他在访问 SPC 后感叹狭小空间里聚集了大量 founder talent，继续强化 builder 圈对高密度线下网络的重视。","url":"https://x.com/amasad/status/2085041697155932506"}],"sources":{"podcasts":[{"title":"Why the Next Hit AI Product Will Be Social Why the Next Hit AI Product Will Be Social (Best of the Pod)","name":"AI & I by Every","publishedAt":"2026-08-05T16:02:13.000Z","url":"https://www.youtube.com/watch?v=dlI-5W7d7uU","excerpts":["Google was a founding team that was deeply, deeply technical. As the technology, the underlying technology got more mature, the slider goes forward, forward, forward, more towards the product thinker, product experience. Pinterest, where I was, Snap, Instagram. The CEOs weren't technical at all. They were product geniuses.","What are the big consumer wins so far in AI? Of course, it's ChatGPT, which is, in a way, not that dissimilar from Google in terms of what it was. Just a text box. Custom GPTs and and chat GPT feels criminal to me. It's clearly made by a team that is unbelievably capable but isn't social.","What's the multiplayer network effect type experience? Someone's gonna create a UGC type community where there are people who are really, really good, make it so much easier for the rest of us."]}],"blogs":[],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"a very primitive form of the near term multiagent agi future is setting up one thread to ping back once its done so you create an implicit kanban/waterfall graph of dependent threads but each preserving their own work and agents i can't wait to setup a proper ui for this pattern but you can hack it together in most koding agents of choice rn","createdAt":"2026-08-06T06:33:59.000Z","url":"https://x.com/swyx/status/2085253030417461661","likes":7,"retweets":2,"replies":3},{"text":"TIL Paul Erdős prompted his fellow mathematicians with bribes like we did the early LLMs","createdAt":"2026-08-06T05:27:54.000Z","url":"https://x.com/swyx/status/2085236400056877381","likes":12,"retweets":1,"replies":6},{"text":"your talent density: a bunch of 19 year old kids who did well in super contrived competitions their talent density:","createdAt":"2026-08-06T04:21:00.000Z","url":"https://x.com/swyx/status/2085219563944452505","likes":7,"retweets":0,"replies":3}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"I asked Codex to pull up some stats and I receive on average one DM or email every 6 or so minutes to ask for a reset. I occasionally do oblige if it comes with really solid feedback or banter.","createdAt":"2026-08-06T04:28:14.000Z","url":"https://x.com/thsottiaux/status/2085221386713198988","likes":4217,"retweets":119,"replies":1411},{"text":"I don't really think these legends needed a pitchdeck. Congrats on taking a crazy, but inspiring leap. I recommend you explore /goal in Codex, it's a pretty powerful loop with GPT-5.6 Sol.","createdAt":"2026-08-06T01:22:26.000Z","url":"https://x.com/thsottiaux/status/2085174625655198156","likes":2637,"retweets":61,"replies":512}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"At 11% usage remaining so I guess Luna Extra High it is. Will report back on how good it is.","createdAt":"2026-08-06T04:33:52.000Z","url":"https://x.com/petergyang/status/2085222802542694604","likes":70,"retweets":0,"replies":11},{"text":"Can't believe I have to review PRs now. My PM training hasn't prepared me for this lol","createdAt":"2026-08-06T00:16:09.000Z","url":"https://x.com/petergyang/status/2085157947735429334","likes":32,"retweets":0,"replies":12},{"text":"How to use my new /human-review skill to edit HTML and Markdown files directly: 1. Tell Codex or Claude Code: “Install this: 2. Type “/human-review (your doc name)” 3. It’ll open a visual editor where you can edit and format text directly, resize images, and leave feedback for AI like comments in a Google Doc 4. When you’re done, click “Send to agent” and watch it apply all the updates Use it to edit PRDs, landing pages, and more. I know we all like making our agents work for us, but sometimes a “human review” is needed for that final 10% of polish :) ⭐ the skill on GitHub if you like it:","createdAt":"2026-08-05T17:30:02.000Z","url":"https://x.com/petergyang/status/2085055745410945126","likes":179,"retweets":10,"replies":9}]},{"name":"Nan Yu","handle":"thenanyu","bio":"head of product @linear","tweets":[{"text":"I’m gonna ask the dumbest question here. How is ChatGPT *not* an agent?","createdAt":"2026-08-05T22:10:39.000Z","url":"https://x.com/thenanyu/status/2085126362944229400","likes":118,"retweets":0,"replies":29}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"I had the good fortune of crossing paths with Jeff during my time on Gemini. He was the most down to earth senior exec I’ve worked with. We’d be in the middle of a deeply technical discussion where I had no business pushing my opinion but he’d still hear it out. True mensch.","createdAt":"2026-08-06T04:21:20.000Z","url":"https://x.com/realmadhuguru/status/2085219649847972059","likes":20,"retweets":0,"replies":0},{"text":"Been thinking about why AI diffusion has been slow. It’s because we are asking users to understand our nerdy lab speak. We greet them with a blank window and ask them to write a prompt. Then they have to pick a model, decide whether they need an agent, and somehow know what context windows, reasoning, MCP, memory, and skills are. Most people don’t care. They need a thing done. If you can give them something that does that, they’re happy. I think we will see that breakthrough product in the next 12 months.","createdAt":"2026-08-05T16:13:07.000Z","url":"https://x.com/realmadhuguru/status/2085036386781221257","likes":57,"retweets":0,"replies":20}]},{"name":"Google Labs","handle":"GoogleLabs","bio":"Google’s home for our latest AI tools and experiments.","tweets":[{"text":"Time to spill the (Dream)beans. Dreambeans is expanding! Joining our US-based AI Ultra users, AI Pro subscribers in the US can now also get in on the action. Get ready for your fresh, daily collection of personalized stories. We’re surfacing the deep dives and hidden gems you actually want to read. Dive in:","createdAt":"2026-08-05T17:02:13.000Z","url":"https://x.com/GoogleLabs/status/2085048743322345545","likes":406,"retweets":34,"replies":19}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Always striking the amount of founder talent I see in such a small space every time I visit SPC.","createdAt":"2026-08-05T16:34:13.000Z","url":"https://x.com/amasad/status/2085041697155932506","likes":140,"retweets":13,"replies":11}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Writing a banger tweet is AGI-complete. If you can prove a clanker can write a banger in polynomial time, you’ve solved the entire class of AGI problems","createdAt":"2026-08-06T00:58:44.000Z","url":"https://x.com/rauchg/status/2085168662881894559","likes":286,"retweets":13,"replies":49},{"text":"Infinite agent compute 10,000 concurrent + 5,000 CPU cores per minute and these quotas are raisable","createdAt":"2026-08-05T18:58:04.000Z","url":"https://x.com/rauchg/status/2085077900190208080","likes":222,"retweets":8,"replies":39},{"text":"Interesting","createdAt":"2026-08-05T16:04:28.000Z","url":"https://x.com/rauchg/status/2085034212466499941","likes":17,"retweets":0,"replies":2}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Correct take. 99% of tokens in the world will get consumed in an enterprise context. They will be for writing code, combing through insane amounts of life sciences research, automating manufacturing, securing enterprises, detecting fraud, and thousands of other tasks like this that have significant economic value. This is both where the cost of AI can be most justified but also where the impact of parallel workers doing tasks on your behalf is most useful. Even the agents that most impact consumers will often be wrapped up as just end to end services where the consumer doesn’t think about there being an AI system on the other end, like faster insurance or onboarding to a bank. The key thoug…","createdAt":"2026-08-06T03:06:20.000Z","url":"https://x.com/levie/status/2085200776159490111","likes":133,"retweets":4,"replies":29}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Connie Chan is the most incompetent elected official Fight to block all housing Destroy safety for Asian Americans by blocking police funding and supporting Chesa Boudin Ruin our schools It’s so idiotic that half of SF is polling support for her","createdAt":"2026-08-06T04:09:20.000Z","url":"https://x.com/garrytan/status/2085216631014514850","likes":161,"retweets":11,"replies":16},{"text":"This is one of the most important books of the year","createdAt":"2026-08-05T22:55:32.000Z","url":"https://x.com/garrytan/status/2085137660184797265","likes":167,"retweets":11,"replies":14},{"text":"Can’t wait for the AI to get so good none of this business about detecting AI matters anymore Silverware used to be handmade, but nobody complains about their dinner fork is stamped by a machine The quality of ideas matter The important thing is people can eat","createdAt":"2026-08-05T16:22:32.000Z","url":"https://x.com/garrytan/status/2085038756906901656","likes":418,"retweets":34,"replies":86}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"At this point you probably get fired from frontier labs if your model hasn’t hacked into any company","createdAt":"2026-08-05T22:23:51.000Z","url":"https://x.com/mattturck/status/2085129687051727325","likes":8,"retweets":2,"replies":4}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Dangerously skips permissions. Harvard’17. GitHub: Y )","createdAt":"2026-08-05T13:02:06.000Z","url":"https://x.com/steipete/status/2084988316324397312","likes":399,"retweets":14,"replies":43}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"truly strange choice of headline here","createdAt":"2026-08-05T17:24:27.000Z","url":"https://x.com/danshipper/status/2085054338594930925","likes":71,"retweets":1,"replies":8},{"text":"","createdAt":"2026-08-05T17:23:02.000Z","url":"https://x.com/danshipper/status/2085053982125207804","likes":6,"retweets":0,"replies":0},{"text":"Tea leaves: In order to be competitive today Google needs to catch up on frontier coding. Demis believes different fundamental research directions (like world models) are more important to his long term goal even if they’re less impt competitively today","createdAt":"2026-08-05T17:03:12.000Z","url":"https://x.com/danshipper/status/2085048990899315142","likes":155,"retweets":7,"replies":16}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"@spc @rsanghvi @finn_meeks @evantana @prateekmehta42 @JPBrebner @mjacobstein @ditzikow @AgrawalArian @gopalkraman @ankitcc @CJStanton @slaster27 @OnaRoy88 Now we have to give @SPC Fund IV to the most ambitious founders","createdAt":"2026-08-05T19:27:49.000Z","url":"https://x.com/adityaag/status/2085085383956611528","likes":11,"retweets":1,"replies":3},{"text":"@spc @rsanghvi @finn_meeks @evantana @prateekmehta42 @JPBrebner @mjacobstein @ditzikow @AgrawalArian @gopalkraman @ankitcc @CJStanton @slaster27 @OnaRoy88","createdAt":"2026-08-05T18:13:31.000Z","url":"https://x.com/adityaag/status/2085066688379122140","likes":19,"retweets":0,"replies":2},{"text":"@spc @rsanghvi @finn_meeks @evantana @prateekmehta42 @JPBrebner @mjacobstein @ditzikow @AgrawalArian @gopalkraman @ankitcc @CJStanton @slaster27 @OnaRoy88","createdAt":"2026-08-05T16:54:19.000Z","url":"https://x.com/adityaag/status/2085046755024896318","likes":26,"retweets":1,"replies":1}]}]},"errors":[],"partial":false},{"date":"2026-08-06","dateLabel":"2026年08月06日","generatedAt":"2026-08-06T00:00:00+08:00","sourceGeneratedAt":"2026-08-05T07:11:53.266Z","stats":{"podcastEpisodes":1,"xBuilders":16,"totalTweets":35,"blogPosts":0},"highlights":[{"tag":"产品范式","title":"AI 产品开始把“模式切换”藏进系统，只把意图留给用户","body":"Josh Woodward 把 Notebook 讲成“为思考而不是为切换而设计”，Zara Zhang 则把高效会议定义成“说和做之间没有间隔”。两条信号指向同一个判断：下一代 AI 产品的优势，不是给用户更多按钮和模式，而是把调度复杂度吸收到系统内部，让用户始终停留在目标本身。入口越统一，agent 越容易从工具升级成默认工作流。","evidence":[{"quote":"Notebook is built for thinking, not toggling... a single, unified prompt bar.","attribution":"Josh Woodward","url":"https://x.com/joshwoodward/status/2084746170576892342"},{"quote":"The gap between saying and doing should be zero.","attribution":"Zara Zhang","url":"https://x.com/zarazhangrui/status/2084601752817729811"}]},{"tag":"模型策略","title":"前沿模型正在变成验证层，便宜模型才是放量层","body":"Madhu Guru 给出的不是一条选型建议，而是一条产品顺序建议：先用最强模型把体验边界探清，再把已经成立的工作流拆给开源权重、小模型和路由层。这里真正要避免的不是高单价，而是在需求尚未成立时过早优化成本；那只会把错误的产品更便宜地推向市场。","evidence":[{"quote":"Prototype your product with the best frontier model. Cost be damned.","attribution":"Madhu Guru","url":"https://x.com/realmadhuguru/status/2084809416105472070"},{"quote":"The best model for early product validation is almost never the best model for production.","attribution":"Madhu Guru","url":"https://x.com/realmadhuguru/status/2084667443046502631"}]},{"tag":"企业编排","title":"企业 AI 的主战场不是统一采购，而是异构系统下的编排权","body":"Aaron Levie 描述的不是“谁会赢”，而是为什么现在还没人能赢定：企业在 coding agent、办公 agent、模型接入、数据权限上已经长出了不同组合。短期内，这个市场更像漫长的混搭期，而不是早期云那种快速收敛期。真正稀缺的能力会落在多模型、多身份、多权限之间的编排层，而不是单一模型本身。","evidence":[{"quote":"If you ask 10 IT leaders what their coding agent strategy looks like, you get at least 5 different answers.","attribution":"Aaron Levie","url":"https://x.com/levie/status/2084828773808239080"},{"quote":"Many have built their own orchestration layers for employees to use any model.","attribution":"Aaron Levie","url":"https://x.com/levie/status/2084828773808239080"}]},{"tag":"价值迁移","title":"当智能变成低成本资源，差异化会外溢到上下文和路由层","body":"Swyx 把知识图谱重新升温归因于“够用的智能已经便宜到不用计量”，Guillermo Rauch 则展示了网关和 SDK 层对成本的直接控制力。放在一起看，信号很清楚：模型本身越来越像公共能力，真正开始升值的是模型外部的结构化上下文、调用路径和成本治理。智能被商品化之后，补充层反而更能决定利润。","evidence":[{"quote":"“good enough” intelligence is finally too cheap to meter... complements are increasing in value","attribution":"Swyx","url":"https://x.com/swyx/status/2084832553895444570"},{"quote":"1 line of code in @aisdk saves you 90% or more in DeepSeek v4 Flash AI Gateway tokens","attribution":"Guillermo Rauch","url":"https://x.com/rauchg/status/2084779435866398801"}]},{"tag":"产业边界","title":"AI 正在从低风险文本任务，跨进“必须验证”的世界","body":"今天更关键的共同点，不是模型又能生成什么，而是生成之后谁来验证、错一次要付什么代价。Chai 把药物研发讲成 design 加 verification，Aditya Agarwal 则把 self-driving finance 归结为不对称成本下的预测问题。下一波 AI 产品门槛会落在验证闭环、失败成本管理和领域工作流，而不是单次生成质量。","evidence":[{"quote":"The lab is a very important part... If you can evaluate that your model works, you can verify it, then you can start to hill climb that.","attribution":"Chai Discovery podcast","url":"https://www.youtube.com/watch?v=wv53mDmY-k0"},{"quote":"Money returned a day late bounces a bill and destroys trust.","attribution":"Aditya Agarwal","url":"https://x.com/adityaag/status/2084691244496625793"}]}],"matters":[{"kind":"采用","title":"技术扩散先靠社会证明，不靠效率口号","detail":"Zara Zhang 认为新技术采用更像情绪和从众驱动，builder 如果只讲“更高效”，往往不够推动真实扩散。","url":"https://x.com/zarazhangrui/status/2084828855404294266"},{"kind":"训练","title":"把 agent 拉进群聊，可能比 AI 培训课更有效","detail":"Zara Zhang 提议让团队直接观察 agent 在群聊里工作，把 enablement 从讲解改成现场示范。","url":"https://x.com/zarazhangrui/status/2084635984164237792"},{"kind":"商业模式","title":"vibe-coded SaaS 更像高价服务的自助漏斗","detail":"Peter Yang 判断，现阶段轻量 SaaS 未必适合独立赚钱，反而更适合作为导向更高客单价服务的入口。","url":"https://x.com/petergyang/status/2084855632029774167"},{"kind":"使用场景","title":"复杂浏览器自动化正在成为模型购买决策的硬需求","detail":"Peter Yang 直接把复杂 browser automation 描述成自己一半 Codex 使用量，说明这类任务已是高配模型的重要检验场景。","url":"https://x.com/petergyang/status/2084849701351035182"},{"kind":"退出预期","title":"退出稀缺时，“不理想的收购价”也会重新变得有吸引力","detail":"Matt Turck 借 Airtable 的讨论点出一个现实：很多 SaaS 创始人私下并不嫌退出价格低，先有退出本身就是结果。","url":"https://x.com/mattturck/status/2084759190195536202"}],"sources":{"podcasts":[{"title":"Chai Discovery's Bitter Lesson: Drug Design Is Another Scaling Problem","name":"Training Data","publishedAt":"2026-08-04T09:00:00.000Z","url":"https://www.youtube.com/watch?v=wv53mDmY-k0","excerpts":["One of our big guiding principles is just simplicity. So, like, when you look at a model like, let's say, CHI one, I think there are 23 distinct submodules in CHI one. And, like, when you're trying to iterate on something like that, it gets really hard because you're like, I kinda I need to understand each of these sub modules independently. I need to under…","How do I simplify this? How do I identify, like, what's what's really important? Once you have that, the whole research process and identifying these types of scaling directions becomes a lot simpler.","We're here with Josh and Matt, two of the co founders of CHI Discovery. CHI is engineering molecules with AI. So it's something of a foundation model lab for biology. Sounds like a big idea, but let"]}],"blogs":[],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"smol aha moment at @_chenglou’s @midjourney meetup today - one reason that ontologies and graph knowledge are finally trending now rather than 3 years ago is that “good enough” intelligence is finally too cheap to meter this is why talks like @coyle_frankp and @emileifrem’s are on fire. the hardest part of KGs is cheap now. intelligence is commoditized so complements are increasing in value","createdAt":"2026-08-05T02:43:09.000Z","url":"https://x.com/swyx/status/2084832553895444570","likes":23,"retweets":1,"replies":14},{"text":"confirmation here","createdAt":"2026-08-04T20:29:47.000Z","url":"https://x.com/swyx/status/2084738591109038187","likes":3,"retweets":0,"replies":0},{"text":"yes","createdAt":"2026-08-04T17:51:00.000Z","url":"https://x.com/swyx/status/2084698630653641092","likes":89,"retweets":2,"replies":17}]},{"name":"Josh Woodward","handle":"joshwoodward","bio":"VP, @Google @GoogleLabs @GeminiApp @GoogleAIStudio","tweets":[{"text":"Notebook is built for thinking, not toggling. While others add more modes, Notebook keeps everything in a single, unified prompt bar and just does the things you want. Ultra and Pro subscribers can jump in now, rolling out to everyone next.","createdAt":"2026-08-04T20:59:54.000Z","url":"https://x.com/joshwoodward/status/2084746170576892342","likes":341,"retweets":23,"replies":14},{"text":"Nice use case!","createdAt":"2026-08-04T17:51:51.000Z","url":"https://x.com/joshwoodward/status/2084698846609682675","likes":145,"retweets":11,"replies":12}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Better Cyber. Excited to welcome Halvar Flake to the team soon.","createdAt":"2026-08-05T04:29:28.000Z","url":"https://x.com/thsottiaux/status/2084859308165271658","likes":467,"retweets":16,"replies":228},{"text":"What is my title at OpenAI","createdAt":"2026-08-04T20:27:31.000Z","url":"https://x.com/thsottiaux/status/2084738022650892544","likes":1464,"retweets":27,"replies":1681}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"I think if you vibe code a SaaS these days it can just be a self-serve funnel into a more expensive services offering vs. trying to make alot of money with the SaaS itself. But the only thing about services is it feels like consulting and selling \"time for money\" again.","createdAt":"2026-08-05T04:14:52.000Z","url":"https://x.com/petergyang/status/2084855632029774167","likes":49,"retweets":1,"replies":13},{"text":"Hearing that GPT 5.6 Luna High is much cheaper and basically unlimited usage and I'm running low on Sol :P Can it do complex browser automation tasks? That's 50% of my Codex usage.","createdAt":"2026-08-05T03:51:18.000Z","url":"https://x.com/petergyang/status/2084849701351035182","likes":58,"retweets":3,"replies":19},{"text":"Easier to make more money from @X payouts than from a micro SaaS these days","createdAt":"2026-08-05T03:37:21.000Z","url":"https://x.com/petergyang/status/2084846191456751725","likes":25,"retweets":1,"replies":12}]},{"name":"Nan Yu","handle":"thenanyu","bio":"head of product @linear","tweets":[{"text":"Old heads remember Will Smith eating noodles","createdAt":"2026-08-05T00:34:44.000Z","url":"https://x.com/thenanyu/status/2084800235474178138","likes":11,"retweets":0,"replies":1},{"text":"The real ones remember","createdAt":"2026-08-04T22:45:00.000Z","url":"https://x.com/thenanyu/status/2084772618314428627","likes":6,"retweets":0,"replies":0}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"Ok builders, here’s your playbook. Prototype your product with the best frontier model. Cost be damned. Validate the user experience. Then, 6-8 weeks later when open-weight models catch up - move your production workloads there, and to smaller models where possible. In that order. Don’t start with the cheapest model.","createdAt":"2026-08-05T01:11:13.000Z","url":"https://x.com/realmadhuguru/status/2084809416105472070","likes":17,"retweets":0,"replies":3},{"text":"The best model for early product validation is almost never the best model for production. Talked to a bunch of founders this weekend. There’s a standard playbook emerging : 1/ Prototype with the best frontier models. Max quality. Ignore cost and latency. Learn what users actually want and iterate. 2/ Once the workflow and UX is validated, optimize like crazy for cost and latency - prompt eng, model routing, harnesses, smaller models, fine tuning. I see most teams get stuck in step 1.","createdAt":"2026-08-04T15:47:04.000Z","url":"https://x.com/realmadhuguru/status/2084667443046502631","likes":40,"retweets":1,"replies":6}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"One might say, the investigation was Bari’d.","createdAt":"2026-08-05T03:26:42.000Z","url":"https://x.com/amasad/status/2084843512496034002","likes":168,"retweets":6,"replies":11}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Vercel is the Vercel for backends. @FactoryAI powers their API services with Fluid compute, with billions of requests per month.","createdAt":"2026-08-05T00:50:14.000Z","url":"https://x.com/rauchg/status/2084804138169446449","likes":188,"retweets":8,"replies":17},{"text":"1 line of code in @aisdk saves you 90% or more in DeepSeek v4 Flash AI Gateway tokens","createdAt":"2026-08-04T23:12:05.000Z","url":"https://x.com/rauchg/status/2084779435866398801","likes":238,"retweets":8,"replies":32},{"text":"𝟸𝟶𝟸𝟼 𝟷,𝟶𝟿𝟹,𝟷𝟿𝟿,𝟿𝟾𝟽+","createdAt":"2026-08-04T16:47:22.000Z","url":"https://x.com/rauchg/status/2084682618927558811","likes":398,"retweets":9,"replies":51}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"One fun benefit of spending so much time with enterprises is you get to see the array of AI implementation strategies that exist in companies right now. Unlike the early innings of cloud where there were really only a couple deployment patterns available -including being limited by only a couple infra vendors existing- AI actually has a much wider range of approaches in the enterprise. If you ask 10 IT leaders what their coding agent strategy looks like, you get at least 5 different a . Harvard’17. GitHub: YouTube:","tweets":[{"text":"Contrary to popular perception, most people will not adopt a new technology just because it makes them more efficient. Instead, they’ll adopt new technology because: - Someone they know who’s similar to them on some dimension adopted the technology, and got positive results (eg became cooler, richer, more popular/respected), and they wanna become like that person - They feel like everyone around them has adopted the technology, and if they don’t, they’ll be left behind Notice that it’s not entirely a rational decision. It’s more of an EMOTIONAL decision. So if you’re trying to make someone adopt a new technology, the messaging shouldn’t be “this will make you 10x more efficient!” It should…","createdAt":"2026-08-05T02:28:28.000Z","url":"https://x.com/zarazhangrui/status/2084828855404294266","likes":90,"retweets":10,"replies":13},{"text":"The best AI training isn't a course. It's pulling an agent into your team's group chat & letting people watch it work Every company rolling out \"AI enablement programs\" should try that first","createdAt":"2026-08-04T13:42:03.000Z","url":"https://x.com/zarazhangrui/status/2084635984164237792","likes":44,"retweets":3,"replies":12},{"text":"How to judge if a meeting is efficient: An efficient meeting has no to-do list left behind, because all the actions are done DURING the meeting (either by agents who listen to the meeting in real time or by humans) The gap between saying and doing should be zero, and meetings become work sessions where things actually get DONE","createdAt":"2026-08-04T11:26:02.000Z","url":"https://x.com/zarazhangrui/status/2084601752817729811","likes":74,"retweets":3,"replies":21}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"the best vibey, air conditioned, quiet coffee shop to meet founders discretely does     const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    let selectedDate = new URLSearchParams(location.search).get('date') || (DIGESTS.some(d => d.date === today) ? today : DIGESTS[0]?.date);
    const esc = (v) => String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;");
    function link(url, text) { return url ? '<a href="' + esc(url) + '" target="_blank" rel="noreferrer">' + esc(text || url) + '</a>' : esc(text || ''); }
    function renderDates() {
      document.getElementById('dates').innerHTML = DIGESTS.map(d => '<button class="date-btn" aria-current="' + (d.date === selectedDate ? 'date' : 'false') + '" data-date="' + esc(d.date) + '">' + esc(d.date) + '</button>').join('');
      document.querySelectorAll('.date-btn').forEach(btn => btn.addEventListener('click', () => {
        selectedDate = btn.dataset.date;
        history.replaceState(null, '', '?date=' + selectedDate);
        render();
      }));
    }
    function renderStats(d) {
      const stats = d.stats || {};
      document.getElementById('stats').innerHTML = [
        ['播客', stats.podcastEpisodes || 0],
        ['Builders', stats.xBuilders || 0],
        ['推文', stats.totalTweets || 0],
        ['博客', stats.blogPosts || 0],
      ].map(([label, value]) => '<div class="stat"><strong>' + esc(value) + '</strong><span class="small">' + esc(label) + '</span></div>').join('');
    }
    function renderEvidence(evidence) {
      if (typeof evidence === 'string') return '<blockquote>' + esc(evidence) + '</blockquote>';
      const attribution = evidence.attribution ? '<div class="small">— ' + esc(evidence.attribution) + (evidence.url ? ' · ' + link(evidence.url, '查看原文') : '') + '</div>' : '';
      return '<blockquote>' + esc(evidence.quote || '') + attribution + '</blockquote>';
    }
    function renderHighlights(d) {
      const cards = (d.highlights || []).map(item => '<article class="card"><div class="tag">' + esc(item.tag) + '</div><h3>' + esc(item.title) + '</h3><p>' + esc(item.body) + '</p>' + ((item.evidence || []).length ? '<details><summary>查看原文依据</summary>' + item.evidence.map(renderEvidence).join('') + '</details>' : '') + '</article>').join('');
      return '<section><h2>洞察<span class="section-note">INSIGHTS / 经过判断的关键信号</span></h2><div class="grid">' + (cards || '<p class="empty">今天没有足够内容生成洞察。</p>') + '</div></section>';
    }
    function renderMatters(d) {
      const cards = (d.matters || []).map(item => '<article class="card"><div class="tag">' + esc(item.kind) + '</div><h3>' + link(item.url, item.title) + '</h3><p>' + esc(item.detail) + '</p></article>').join('');
      return '<section><h2>议题<span class="section-note">MATTERS / 值得继续追踪</span></h2><div class="grid">' + (cards || '<p class="empty">今天没有额外议题。</p>') + '</div></section>';
    }
    function renderSources(d) {
      const archive = d.archiveUrl ? '<p class="archive-link">' + link(d.archiveUrl, '查看当日完整存档 ↗') + '</p>' : '';
      const xGroups = ((d.sources || {}).x || []).map(builder => '<div class="source-group"><h3>' + esc(builder.name) + ' <span class="small">@' + esc(builder.handle) + '</span></h3><p class="small">' + esc(builder.bio) + '</p>' + (builder.tweets || []).map(tweet => '<p class="tweet">' + esc(tweet.text) + '<br>' + link(tweet.url, '原文') + ' <span class="small">likes ' + esc(tweet.likes) + ' · reposts ' + esc(tweet.retweets) + '</span></p>').join('') + '</div>').join('');
      const podcastGroups = ((d.sources || {}).podcasts || []).map(podcast => '<div class="source-group"><h3>' + link(podcast.url, podcast.title) + '</h3>' + (podcast.excerpts || []).map(e => '<blockquote>' + esc(e) + '</blockquote>').join('') + '</div>').join('');
      const blogGroups = ((d.sources || {}).blogs || []).map(blog => '<div class="source-group"><h3>' + link(blog.url, blog.title) + '</h3><p class="small">' + esc(blog.source || '') + '</p><p>' + esc(blog.summary || '') + '</p></div>').join('');
      return '<section><h2>原文<span class="section-note">SOURCES / 完整证据索引</span></h2>' + archive + '<div class="sources">' + podcastGroups + blogGroups + xGroups + '</div></section>';
    }
    function render() {
      const d = DIGESTS.find(item => item.date === selectedDate) || DIGESTS[0];
      if (!d) {
        document.getElementById('content').innerHTML = '<p class="empty">还没有 digest 数据。</p>';
        return;
      }
      selectedDate = d.date;
      renderDates();
      renderStats(d);
      document.getElementById('content').innerHTML = renderHighlights(d) + renderMatters(d) + renderSources(d);
    }
    render();
  </script>
