:46.000Z","url":"https://x.com/thenanyu/status/2120037431261184454","likes":9,"retweets":0,"replies":1}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"If you are a product leader, here is a simple exercise: draw out your product lifecycle. e.g. market understanding -> design -> development -> GTM. Chances are your PMs spend more time in some stages than others - because of the nature of your product, your org or their comfort zones. This is a handoff-heavy, lossy process. Now ask yourself: using AI, how much deeper can PMs go on every stage? PMs should be able to - build a much deeper, broader understanding of users and the market - iterate fast from ideas to working prototypes - explore the codebase to study technical constraints and tradeoffs - run their own analytics and investigate questions as they emerge - understand the GTM funnel…","createdAt":"2026-11-10T03:45:02.000Z","url":"https://x.com/realmadhuguru/status/2119999748086362466","likes":61,"retweets":3,"replies":0}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"I showed Paul Graham vibe coding before it was called that back in July ‘24, and this was his reaction:","createdAt":"2026-11-10T01:27:54.000Z","url":"https://x.com/amasad/status/2119965240066752682","likes":456,"retweets":21,"replies":58},{"text":"If you're in Japan, check out \"Enterprise Vibe Coding,\" a new book from SMFL's digital innovation team on how AI is transforming enterprise software development. Coming November 27. Honored to be on the cover!","createdAt":"2026-11-09T21:45:06.000Z","url":"https://x.com/amasad/status/2119909166764667292","likes":76,"retweets":8,"replies":17},{"text":"\"But who maintains vibe coded apps?\" How about self-healing software...","createdAt":"2026-11-09T20:41:48.000Z","url":"https://x.com/amasad/status/2119893236747780567","likes":173,"retweets":13,"replies":70}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"So bullish on MCP. Its utility exceeds the \"M\" part: even AI aside, it'll be a civilization-scale accomplishment to get all our systems communicating through one universal open protocol. A missing piece was how to get arbitrary callbacks across sessions. MCP could read and write, but it couldn't tell you later \"this event happened.\" MCP Events fixes this. We're adding support in our own MCP. Say an agent makes a deployment, and wants to know when it's complete. Instead of polling, it can subscribe to 𝚍𝚎𝚙𝚕𝚘𝚢𝚖𝚎𝚗𝚝.𝚜𝚞𝚌𝚌𝚎𝚎𝚍𝚎𝚍. PSA: With Vercel Queues and Workflows, writing the backend machinery for your own MCPs to do this is easy peasy.","createdAt":"2026-11-09T20:33:27.000Z","url":"https://x.com/rauchg/status/2119891138450755670","likes":663,"retweets":33,"replies":101},{"text":"At @vercel we got to test this model before release. Best way to summarize it: astonishingly brilliant. One interesting takeaway: it's very clear that this new generation of models can take on unprecedented bodies of parallel work. To actually seize this intelligence, you need cloud sandboxes. Full stop. The model can delegate and orchestrate far more than a single computer can handle. Likely far more than you can even imagine it can handle. Your bottleneck is now ① your ambition and ② your parallel computing power. Btw, I learned from @cramforce you don't need to overcomplicate it. Install Vercel CLI, setup the Plugin and tell the agent to use /𝚘𝚏𝚏𝚕𝚘𝚊𝚍-𝚝𝚘-𝚜𝚊𝚗𝚍𝚋𝚘𝚡 skill. It'…","createdAt":"2026-11-09T19:42:42.000Z","url":"https://x.com/rauchg/status/2119878364794372162","likes":1907,"retweets":58,"replies":114}]},{"name":"Alex Albert","handle":"alexalbert__","bio":"Research @AnthropicAI","tweets":[{"text":"I gave Fable 5.2 a PDF of one of Leonardo da Vinci’s 500-year-old notebooks and it made his inventions real for me to interact with. Such an exciting time for education. Anything from history that’s been stuck on a page can now be something you explore.","createdAt":"2026-11-09T22:16:02.000Z","url":"https://x.com/alexalbert__/status/2119916954337349737","likes":1418,"retweets":150,"replies":86},{"text":"Every time we have a new model, I run the same simple prompt on all my projects: \"Read this entire project and find everything that’s broken, inconsistent, inefficient, or no longer needed. Fix what you’re sure about and list the rest for me to review.\" highly recommend trying","createdAt":"2026-11-09T20:08:52.000Z","url":"https://x.com/alexalbert__/status/2119884951550386671","likes":6350,"retweets":292,"replies":214},{"text":"btw robotics will fall to the bitter lesson too","createdAt":"2026-11-09T19:09:10.000Z","url":"https://x.com/alexalbert__/status/2119869925288558799","likes":2790,"retweets":104,"replies":54}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"It turns out the advancements we’re getting in coding and computer use, combined with industry specific understand and general reasoning, can bring automation to a large number of areas of knowledge work. We’re entering the era of autonomous collaborators in a number of industries that haven’t yet had their claude code or codex moment yet. But now this is going to happen. We’ll see it in animation, film production, gaming, manufacturing, architecture, product design, robotics, and more. All of these fields have the potential of driving far more output similar to what we’ve seen in software engineering. There’s no inherent finite demand for these categories of work. “Software is eating the w…","createdAt":"2026-11-10T02:54:53.000Z","url":"https://x.com/levie/status/2119987129204047894","likes":227,"retweets":15,"replies":73}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Red letter day: New frontier model = every one of your projects gets a step function improvement I'm not sure if I'll ever get sick of frontier model release days","createdAt":"2026-11-09T19:57:54.000Z","url":"https://x.com/garrytan/status/2119882192088391751","likes":306,"retweets":11,"replies":57}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"Ever since I read Niklas Gruhn's excellent article ( I think about this every day.. If you don't think people notice that you are feeding everything to AI and regurgitating it back, people actually do!! (because they are probably already getting an opinion with the same agents)","createdAt":"2026-11-09T17:52:47.000Z","url":"https://x.com/nikunj/status/2119850705901191339","likes":13,"retweets":2,"replies":3}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"Vibe Check dropping soon:","createdAt":"2026-11-09T19:17:05.000Z","url":"https://x.com/danshipper/status/2119871917104455924","likes":15,"retweets":0,"replies":0},{"text":"BREAKING: @AnthropicAI just dropped Claude Fable 5.2. It’s a paradigm-shifting model if you have a project ambitious enough to give it. We’ve been testing it at @every, and I’ve seen this crazy explosion of creativity on the team. People are making their own creative software, games for their kids, and documentaries instead of slide decks. Here’s your day zero vibe check: • Coding: @kieranklaassen built Everycut, a video editor with the features we use from Premiere, Descript, and other tools—all in one app, with an agent built in. The first version was live in 3 days, and we immediately used it for our internal show-and-tell. This feels like a new era of professionals building their own pr…","createdAt":"2026-11-09T19:06:23.000Z","url":"https://x.com/danshipper/status/2119869228207546638","likes":776,"retweets":53,"replies":60},{"text":"Fable 5.2 Vibe Check","createdAt":"2026-11-09T19:02:57.000Z","url":"https://x.com/danshipper/status/2119868362838663650","likes":23,"retweets":1,"replies":3}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"Huge launch from the @nuance_ai team today. Try it out now.","createdAt":"2026-11-09T18:21:57.000Z","url":"https://x.com/adityaag/status/2119858043869683935","likes":23,"retweets":3,"replies":0}]},{"name":"Claude","handle":"claudeai","bio":"Claude is an AI assistant built by @anthropicai to be safe, accurate, and secure. Talk to Claude on or download the app.","tweets":[{"text":"Claude Fable 5.2 is available today on all paid plans. Organizations pursuing beneficial applications in cybersecurity or biomedical research can apply for access to Claude Mythos 5.2. Read more:","createdAt":"2026-11-09T21:06:39.000Z","url":"https://x.com/claudeai/status/2119899492778398163","likes":546,"retweets":41,"replies":16},{"text":"Both physics results are written up in preprints. On the abrupt transition in very small universes: On the exact limit of a technique used to rule out candidate theories of quantum gravity:","createdAt":"2026-11-09T21:06:39.000Z","url":"https://x.com/claudeai/status/2119899491310432269","likes":328,"retweets":15,"replies":8},{"text":"In the second physics problem, Fable 5.2 found the exact limit of the simplest version of a 15-year-old technique known as “modular bootstrapping.” The technique is used to rule out candidate theories of quantum gravity in theoretical universes.","createdAt":"2026-11-09T21:06:38.000Z","url":"https://x.com/claudeai/status/2119899488995131439","likes":410,"retweets":12,"replies":3}]}]},"errors":[],"partial":false},{"date":"2026-11-10","dateLabel":"2026年11月10日","generatedAt":"2026-11-10T00:00:00+08:00","sourceGeneratedAt":"2026-11-09T06:36:37.960Z","stats":{"podcastEpisodes":1,"xBuilders":10,"totalTweets":21,"blogPosts":0},"highlights":[{"tag":"实践","title":"生成能力越强，需求不清的成本越快累积","body":"作者指出，方向清晰时可以直接到达方案，方向模糊时却会快速产出大量无用内容。由此看，动手前把使用者、场景和验收条件说清，能减少后续反复推翻的成本。","evidence":[{"quote":"Software got a lot easier if you know what you wanna build, and a lot harder if you don’t.","translation":"知道要做什么，软件开发就容易很多；不知道，则更难。","attribution":"Nan Yu","url":"https://x.com/thenanyu/status/2119462224721002560","publishedAt":"2026-11-08T16:09:06.000Z"}]},{"tag":"实践","title":"旧失败案例值得成为模型升级后的复测集","body":"作者建议每三到六个月重试过去不可行的任务。相比只看新能力演示，保留失败输入和验收标准，可以更直接地判断升级是否解决自己的障碍，也更容易识别仍需人工介入的步骤。","evidence":[{"quote":"try something that wasn’t possible before and see if it works again.","translation":"重新尝试以前做不到的事情，看看如今是否可行。","attribution":"Aaron Levie","url":"https://x.com/levie/status/2119502716770902234","publishedAt":"2026-11-08T18:50:00.000Z"}]},{"tag":"实践","title":"架构的复杂性会转移成使用者的理解成本","body":"作者建议从能工作的直接方案开始。由此推断，如果一个方案依赖许多隐含规则，维护者和用户就要不断重建作者的思路。先用容易解释的方式实现，再依据真实问题迭代，更利于验证取舍。","evidence":[{"quote":"Being clever means your users also have to be just as clever to understand your cleverness","translation":"过于巧妙的设计，要求用户也足够聪明才能理解。","attribution":"Nan Yu","url":"https://x.com/thenanyu/status/2119462979179892925","publishedAt":"2026-11-08T16:12:06.000Z"}]}],"matters":[{"kind":"动态","title":"WebGL 唱机从沟槽模拟声音","detail":"作者用 WebGL2 和 Web Audio 把歌曲转换成沟槽形状，再模拟唱针运动产生声音。其描述中，杂音、抖动和内圈音质变化来自模拟过程，代码可供改编。","url":"https://x.com/rauchg/status/2119536313712230802"},{"kind":"动态","title":"gstack-evals 尝试复现 Jev 文章","detail":"作者称项目复现了 Jev Engineering 的文章结果，并试用了 particle-1，后者在其尝试中更好。采集帖未包含测试配置和具体分数。","url":"https://x.com/garrytan/status/2119624260675350605"},{"kind":"动态","title":"Ryo Lu 分享上海演讲完整版","detail":"演讲围绕“当我们能做任何事，还知道自己想要什么吗”展开，作者称幻灯片用 Keynote 手工制作，并提供中英文字幕。","url":"https://x.com/ryolu_/status/2119586846657454152"},{"kind":"动态","title":"AI 编程是否需要新的称呼","detail":"作者认为 vibe coding 容易让人误以为作品缺少投入，而使用 AI 工具也可以认真打磨作品，因此提出寻找更贴切的说法。","url":"https://x.com/zarazhangrui/status/2119592080318341128"}],"articles":{"blogs":[],"podcasts":[{"title":"Mihail Eric：AI 原生工程从理解工具走向组织交付","sourceName":"Latent Space","sourceTitle":"[One Million AI Engineer Special] How Stanford Teaches AI-Native Engineering — Mihail Eric, Monaco","sourceId":"01a1bcf7-771f-7da1-affb-a7ead0a1434c","sourceUrl":"https://www.youtube.com/watch?v=dpY7YzZo4kE","publishedAt":"2026-11-08T21:23:29.000Z","sourceTextSha256":"7ce4a01024b0380bd78f8b28a67a94e6ce04346d5ffc7b7809b73c60fb7ca690","blocks":[{"type":"paragraph","text":"Mihail Eric 在 Stanford 教授现代软件开发，也在 Monaco 负责 AI 工作。Latent Space 的这场访谈把课程与实践放在一起，讨论工程师怎样掌握不断变化的工具，以及团队怎样把生成代码纳入可持续的交付流程。"},{"type":"heading","text":"先理解 agent 如何工作"},{"type":"paragraph","text":"课程从搭建编码 agent 开始，让学生看到模型之外的控制循环、工具调用和上下文管理。第二步进入更大规模的上下文组织与工具设计，再讨论如何把重复步骤写成 skills。这样的顺序让学生先理解单次调用，再考虑多步骤工作。"},{"type":"paragraph","text":"Eric 邀请一线实践者讲课，因为工具变化很快，一个教师的经验难以覆盖所有情况。客座讲者带来的观点也让学生看到，同一类问题可以有不同的实现办法。"},{"type":"heading","text":"把重复经验整理成可执行流程"},{"type":"paragraph","text":"访谈将单一工具和完整操作程序区分开。工具完成一个动作，skill 则可以记录一组反复执行的步骤。团队能从过去几次真实任务里提炼做法，再根据结果修改。"},{"type":"paragraph","text":"不过，积累大量 Markdown 文件也带来维护问题。说明是否仍然适用、是否与工具实际行为一致，都需要持续整理。把经验写下来只是开始，使用结果还要返回到这些说明里。"},{"type":"heading","text":"从课堂到 Monaco 的实际系统"},{"type":"paragraph","text":"Eric 介绍，Monaco 把 agent 用在销售相关工作中，包括客户画像、市场评估、流程推进和会议准备。领域任务决定了系统需要哪些信息和动作，基础模型提供通用能力，周边软件负责把它们接入业务。"},{"type":"paragraph","text":"团队也构建开发辅助工具。名为 Hal 的 Slack 助手既帮助排查问题、提交修复，也让销售人员了解产品如何工作。这种跨角色使用让团队必须考虑不同问题该读取哪些信息，以及谁能发起什么操作。"},{"type":"heading","text":"代码越多，审查越需要明确边界"},{"type":"paragraph","text":"讨论进入 AI 代码审查后，问题变成哪些改动可以自动批准，哪些必须让人判断。生成能力提高，并没有消除理解变更后果的工作。团队需要让审查关注真正影响交付的差异。"},{"type":"paragraph","text":"依赖管理同样存在取舍。把外部代码全部收进项目，可能便于控制，却也让团队承担独自发现问题的责任。广泛使用的开源依赖能获得更多用户的反馈。访谈强调根据实际情况判断，避免把一种策略推广到所有项目。"},{"type":"heading","text":"工程师承担更高层的判断"},{"type":"paragraph","text":"最后，双方讨论软件生产越来越自动化之后的角色变化。工程师需要理解组成系统的各部分，能够判断结果是否满足目标，也能够组织多个 agent 的工作。工具熟练度只是其中一部分，提出正确任务、安排反馈和保持对系统的理解，仍然贯穿整个流程。"}]}]},"sources":{"podcasts":[{"title":"[One Million AI Engineer Special] How Stanford Teaches AI-Native Engineering — Mihail Eric, Monaco","name":"Latent Space","publishedAt":"2026-11-08T21:23:29.000Z","url":"https://www.youtube.com/watch?v=dpY7YzZo4kE","excerpts":["Okay, this is a pretty special episode because we're celebrating one million subscribers on the AIU Code, uh, AI, AI Engineer YouTube channel. So go over there and subscribe if you haven't heard about it already.","The guest is Mihail Eric, who is not only teaching the Modern Software Developer at Stanford, which is going viral right now for basically covering all the AI-native development pract- best practices, uh, but also he is head of AI at Monaco.","So he's not only a teacher, but he's a practitioner. Um, and those of you coming to AIU Code Summit next week, um, it's gonna be the celebration of all the extreme progress that you've seen in coding in the last year."]}],"blogs":[],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @cognition - @temporalio - @aidotengineer - @latentspacepod","tweets":[{"text":"are you listening anon?","createdAt":"2026-11-09T02:00:31.000Z","url":"https://x.com/swyx/status/2119611058881192187","likes":134,"retweets":2,"replies":20},{"text":"and a special pod!","createdAt":"2026-11-08T21:59:47.000Z","url":"https://x.com/swyx/status/2119550477629379009","likes":3,"retweets":0,"replies":0},{"text":"if youre wondering how, ask their VP of FDE Pauline Brunet (thanks @realbasilchatha for curating this)","createdAt":"2026-11-08T21:33:12.000Z","url":"https://x.com/swyx/status/2119543788192600450","likes":1,"retweets":0,"replies":1}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"This affair is going to destroy billions in shareholder value isn’t it","createdAt":"2026-11-09T05:06:23.000Z","url":"https://x.com/petergyang/status/2119657833516171384","likes":60,"retweets":1,"replies":12},{"text":"“Both of my parents got diagnosed with two cancers each within a week of each other.” From @AshleyYuki, VP of Product at @OpenAI: “I just decided to take a month [off work]. It was one of the best things I could have done in that moment to care for my parents. You also have to care for yourself as a caregiver. We don’t talk about that enough. It’s still a really big cognitive load, emotional load, just pure time load to be a caregiver. You have to make sure you’re budgeting time for your own mental health.” 📌 Watch our full episode here:","createdAt":"2026-11-09T01:00:07.000Z","url":"https://x.com/petergyang/status/2119595860057288967","likes":46,"retweets":8,"replies":2},{"text":"Anecdotally, I think cheating is far more common in Asia. Plenty of guys who have their wife and kids living in the US/Canada, while they do business in Asia and have another girlfriend or even family in a 二奶村. Most of the time their wife knows about this too. Not saying any of this is right but just what I've seen and heard 🤷 Just randomly came across this article","createdAt":"2026-11-08T22:24:19.000Z","url":"https://x.com/petergyang/status/2119556651636441416","likes":280,"retweets":14,"replies":43}]},{"name":"Nan Yu","handle":"thenanyu","bio":"product, codex @openai. prev head of product @linear","tweets":[{"text":"This is a good question. And you should definitely pick \"dumbest\" over \"simplest\". Simple is something you iterate to. Dumb is the correct starting point. Otherwise, you start to outsmart yourself.","createdAt":"2026-11-08T18:11:27.000Z","url":"https://x.com/thenanyu/status/2119493015190249556","likes":9,"retweets":1,"replies":1},{"text":"This is basically true in all aspects of software. Choose the dumbest architecture that’ll work. choose the dumbest design that gets the job done. Being clever means your users also have to be just as clever to understand your cleverness","createdAt":"2026-11-08T16:12:06.000Z","url":"https://x.com/thenanyu/status/2119462979179892925","likes":263,"retweets":11,"replies":22},{"text":"Software got a lot easier if you know what you wanna build, and a lot harder if you don’t. With clarity, you can straight-shot to the solution. Without it, you’ll ship a pile of junk and spend a lot of money doing it. Pre-AI era you would ship nothing, which is an improvement.","createdAt":"2026-11-08T16:09:06.000Z","url":"https://x.com/thenanyu/status/2119462224721002560","likes":193,"retweets":11,"replies":14}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Built a physical simulation of a record player with WebGL2 and Web Audio. It's *shockingly* accurate: Instead of playing a song, it works by converting it into the physical shape of a groove. Then a simulated stylus rides those walls 384,000 times a second, and you hear the voltage that motion would induce in a cartridge. So the crackle, the pops, the wow/flutter, the dull inner grooves are natural byproducts of the simulation. You can also \"DJ\" the record. (The converted songs are in the public domain or CC-licensed. Code is linked for you to remix and re-deploy.)","createdAt":"2026-11-08T21:03:30.000Z","url":"https://x.com/rauchg/status/2119536313712230802","likes":2242,"retweets":143,"replies":187}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"We’re moving from an era of AI where the output comes roughly at the rate that you can chat back and forth with the AI to work with you, to a period where you can set a problem for a set of agents to go off and do an arbitrarily large amount of work for you. This means productivity gains that are maybe 20-50% to gains that don’t really have an upper limit. Agent swarms and the ability to fan out complex work across many agents doing tasks in parallel provide a massive unlock in a lot of spaces. This will lead to qualitatively different outcomes in my fields. This has already been seen across the coding domain. Next, cyber is almost entirely a problem space where more agents reviewing more t…","createdAt":"2026-11-09T00:44:53.000Z","url":"https://x.com/levie/status/2119592025440092192","likes":256,"retweets":18,"replies":81},{"text":"A good lesson in AI is that you need to check back in on the latest with every 3 to 6 months to try something that wasn’t possible before and see if it works again. At no point in AI’s history is that more true than today. Just the past six months of model progress around computer and tool use, less context rot, better reasoning, multimodality, and deeper domain expertise in a number of key fields, these models are vastly more capable on what they can execute. This is opening up a new vector of what AI systems will be able to autonomously work on. Essentially, anything with an API (and even many things without), we can anticipate that an agent will be able to control and utilize as an under…","createdAt":"2026-11-08T18:50:00.000Z","url":"https://x.com/levie/status/2119502716770902234","likes":278,"retweets":19,"replies":105}]},{"name":"Ryo Lu","handle":"ryolu_","bio":"Designed @Cursor_ai, @NotionHQ, @Stripe, built startups. I make a world where anyone can make software. Aspiring k-pop idol.","tweets":[{"text":"when we can do anything, do we still know what we want? the full talk from @aiDotEngineer shanghai. every slide handmade in keynote, subs in 中文 and english","createdAt":"2026-11-09T00:24:18.000Z","url":"https://x.com/ryolu_/status/2119586846657454152","likes":704,"retweets":70,"replies":29}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"My gstack-evals project took a look at this Jev Engineering article and tried to replicate it, and I also told it to try particle-1 and it turns out this article replicates, and particle-1 is even better","createdAt":"2026-11-09T02:52:59.000Z","url":"https://x.com/garrytan/status/2119624260675350605","likes":140,"retweets":8,"replies":24},{"text":"You're really going to want your own software factory","createdAt":"2026-11-09T02:18:45.000Z","url":"https://x.com/garrytan/status/2119615647592395037","likes":344,"retweets":24,"replies":32},{"text":"Once you realize software is so easily changed with frontier models, these bugs become a little bit unbearable And simultaneously, it seems obvious personal just-in-time software will be inevitable","createdAt":"2026-11-09T02:04:36.000Z","url":"https://x.com/garrytan/status/2119612084220842483","likes":22,"retweets":0,"replies":2}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"ok lol trolls coming out in full force - Elon is a business genius, a visionary and and the richest man in the world, it’s ok for comedians to attempt to poke some fun, relax!","createdAt":"2026-11-08T20:20:12.000Z","url":"https://x.com/mattturck/status/2119525416780361766","likes":21,"retweets":0,"replies":2},{"text":"Lol not Elon now, after nailing the Tucker Carlson impersonation 😂Absolutely epic run from Jeremy Culhane","createdAt":"2026-11-08T15:52:09.000Z","url":"https://x.com/mattturck/status/2119457959625498698","likes":2018,"retweets":138,"replies":53}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Harvard’17. Instagram: GitHub:","tweets":[{"text":"I’ve almost stopped using the term “vibe coding” because there’s a negative connotation to it It implies that you didn’t put a lot of effort or soul into the output and it’s just AI slop But oftentimes people ARE putting their heart and soul into the work even when using AI coding tools. The 2 are not contradictory We need a better word for describing this","createdAt":"2026-11-09T00:45:06.000Z","url":"https://x.com/zarazhangrui/status/2119592080318341128","likes":404,"retweets":12,"replies":182},{"text":"The joy of building a product comes from the collision between the predictability of how technology behaves & the unpredictability of how humans behave","createdAt":"2026-11-08T08:13:03.000Z","url":"https://x.com/zarazhangrui/status/2119342420412510686","likes":168,"retweets":7,"replies":32}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"If you are visiting SF, and trying to meet more people, here are a random list of things you should remove from your vocabulary.. > swap notes > \"synergies\" > pick your brain > networking > \"san fran\" (tourist tell) > grab coffee if you're free If you want to meet interesting people here, show your work. The most interesting people I know in the city are not attending that fancy large conference - they are probably at their office. So what's the work? It can be as simple as a thoughtful cold email, a five line pointed DM, or complex as some side projects that you have shipped, or a meetup that you are organizing. If you put in the effort, it shows, yes, even in this AI era. I still get so m…","createdAt":"2026-11-09T05:56:50.000Z","url":"https://x.com/nikunj/status/2119670529254981756","likes":17,"retweets":0,"replies":2}]}]},"errors":[],"partial":false},{"date":"2026-11-09","dateLabel":"2026年11月09日","generatedAt":"2026-11-09T00:00:00+08:00","sourceGeneratedAt":"2026-11-08T06:25:57.526Z","stats":{"podcastEpisodes":1,"xBuilders":10,"totalTweets":19,"blogPosts":0},"highlights":[{"tag":"实践","title":"验收速度决定新增代码能交付多少","body":"作者将提效与领域理解、多 agent 协作、测试部署联系起来。由此看，如果生成速度超过验证速度，待验收改动就会堆积。改善测试与部署流程，才能把产出增长转成已完成工作的增长。","evidence":[{"quote":"a setup that makes it so you can test and deploy with limited friction","translation":"能低阻力地测试和部署的工作环境","attribution":"Aaron Levie","url":"https://x.com/levie/status/2119111328099168409","publishedAt":"2026-11-07T16:54:46.000Z"}]},{"tag":"实践","title":"长任务让算力部署多了一些选择","body":"作者认为后台长任务对通信延迟较不敏感。由此推断，只需要最终结果的任务，可以更多按容量和成本选择部署位置。具体收益仍要计入数据传输和工具访问耗时。","evidence":[{"quote":"Long running agents are now going to be the norm","translation":"长时间运行的 agent 将成为常态","attribution":"Aaron Levie","url":"https://x.com/levie/status/2118953909524050288","publishedAt":"2026-11-07T06:29:14.000Z"}]},{"tag":"实践","title":"执行路径也应该成为创业验证的对象","body":"作者反对仅凭点子判断公司的命运。目标客户、交付方式和渠道会改变同一需求的实现结果。因此早期验证具体到谁会使用、怎样交付，才更容易判断失败来自需求还是执行方式。","evidence":[{"quote":"Given one idea, there are 1000 ways to execute it","translation":"同一个想法可以有上千种执行方式","attribution":"Zara Zhang","url":"https://x.com/zarazhangrui/status/2118968862557475298","publishedAt":"2026-11-07T07:28:40.000Z"}]}],"matters":[{"kind":"动态","title":"TristanTube 整理推荐频道","detail":"作者称用 Claude Code 在三分钟内生成了包含约 4.7 万条视频和电视模式的站点，这是其个人制作经历。","url":"https://x.com/karpathy/status/2119114537442189652"},{"kind":"动态","title":"Pro 用量说明","detail":"发帖人澄清所列 Pro 套餐没有五小时限制，分别提供相对 Plus 的 10、20、50 倍用量，最高档包含 ultrafast。","url":"https://x.com/thsottiaux/status/2119296267545419987"},{"kind":"动态","title":"训练数据市场交流预告","detail":"作者预告 11 月 11 日中午在旧金山与 Arcanum Labs 联合创始人交流，讨论实验室买什么数据、谁在供应和市场持续性。","url":"https://x.com/nikunj/status/2119229917019971879"},{"kind":"动态","title":"Asahi 开放性讨论","detail":"作者质疑增加妨碍其他项目继续构建的限制，并反对针对 AI 的拒绝立场。采集帖未附具体政策条文。","url":"https://x.com/steipete/status/2119264334627090514"}],"articles":{"blogs":[],"podcasts":[{"title":"Vlad Tenev：扩大工具和资产的参与机会","sourceName":"No Priors","sourceTitle":"Tokenization, Agentic Trading, Harmonic: Robinhood's Mission to Expand Ownership with CEO Vlad Tenev","sourceId":"03f99d40-d8c2-11f1-9c96-7b13ace0b070","sourceUrl":"https://www.youtube.com/@NoPriorsPodcast","publishedAt":"2026-11-05T11:00:00.000Z","linkScope":"channel","sourceTextSha256":"f6dfb57a89e54e90e5c3017b739b9513fd0460b51353aa2d24c8a2ae832d7938","blocks":[{"type":"paragraph","text":"Vlad Tenev 在 No Priors 中把 Robinhood 的业务扩展与个人经历联系起来。从东欧移民到美国、学习数学再进入高频交易，他关注的是强大工具如何让更多普通人使用。"},{"type":"heading","text":"数学研究与软件工程靠近"},{"type":"paragraph","text":"他介绍参与创办的 Harmonic，描述研究者使用版本控制、Lean 验证和模型协作的变化。他希望模型团队与数学家合作，让研究工具进入日常流程，而让少数公司独占发现的方式可能引起外部研究者抵触。"},{"type":"heading","text":"扩大资产访问"},{"type":"paragraph","text":"他从稳定币的美元访问经验谈到代币化，设想把平台上的资产与服务延伸到更多国家。他也介绍围绕具体经营指标的合约计划。如果用户判断公司业绩会上升，股票价格却可能受到其他消息影响，这类产品希望使交易对象更直接对应用户判断的事件。"},{"type":"heading","text":"从策略编写到自动执行"},{"type":"paragraph","text":"Tenev 称超过十五万名客户开设 agent 交易账户。其产品目标是减少编写、部署和运行策略所需的专业技术步骤。主持人进一步追问，大量自动策略会怎样改变系统负荷，正如更多代码生成会给测试与交付系统施压一样。"},{"type":"paragraph","text":"账户采用量与投资结果是不同指标。访谈提供的是受访者的业务描述，没有给出可据此评估收益的交易数据。"},{"type":"heading","text":"参与机会与社会支持"},{"type":"paragraph","text":"Tenev 认为，公司更长时间保持私有状态，会减少普通投资者参与早期增长的机会。他把扩大参与与技术产业的社会支持联系起来，继而讨论投资者准入和儿童账户。相关陈述是他的政策与产品主张。"},{"type":"paragraph","text":"访谈最后回到经营经历。他强调面对压力保持稳定判断，并从困难中积累经验。整场谈话围绕工具和资产的可获得性展开，从研究协作、交易自动化到更广泛的所有权，落地都需要产品和基础设施配合。"}]}]},"sources":{"podcasts":[{"title":"Tokenization, Agentic Trading, Harmonic: Robinhood's Mission to Expand Ownership with CEO Vlad Tenev","name":"No Priors","publishedAt":"2026-11-05T11:00:00.000Z","url":"https://www.youtube.com/@NoPriorsPodcast","excerpts":["Prediction markets are an evolution of news. You just can see what's happening and what's likely to happen in the future through the odds.","It's too centralized, right? It's like AI companies with their big data centers and their employees using secret models to sort of do all this work.","So AgenTik trading, clearly product market fit. We're seeing really strong adoption. Like, over a 150,000 customers have opened agentic trading accounts with us."]}],"blogs":[],"x":[{"name":"Andrej Karpathy","handle":"karpathy","bio":"","tweets":[{"text":"Earlier this week Tristan published his top YouTube channels: Which looked excellent so clearly I had to turn it into TristanTube: 47K super nerdy videos +TV mode for laid back watching. (One-shotted with Claude Code in 3 minutes)","createdAt":"2026-11-07T17:07:31.000Z","url":"https://x.com/karpathy/status/2119114537442189652","likes":6445,"retweets":515,"replies":475}]},{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @cognition - @temporalio - @aidotengineer - @latentspacepod","tweets":[{"text":"sticker game inspired by @dexhorthy @CompleteSkeptic et al","createdAt":"2026-11-08T01:37:19.000Z","url":"https://x.com/swyx/status/2119242830707311005","likes":74,"retweets":0,"replies":9},{"text":"","createdAt":"2026-11-07T23:29:19.000Z","url":"https://x.com/swyx/status/2119210618976944259","likes":1,"retweets":0,"replies":0},{"text":"just arrived… best swag game in the business. u guys are in for a treat next week","createdAt":"2026-11-07T23:29:10.000Z","url":"https://x.com/swyx/status/2119210582654210255","likes":92,"retweets":2,"replies":18}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Would a Pro 50 make sense? Wdyt?","createdAt":"2026-11-08T05:45:31.000Z","url":"https://x.com/thsottiaux/status/2119305294291612140","likes":1369,"retweets":58,"replies":855},{"text":"Saw some confusions, but all Pro plans have no 5-hour limits, and give the following usage compared to Plus. ✅ Pro 100 = 10X ✅ Pro 200 = 20X ✅ Pro 500 = 50X, access to ultrafast","createdAt":"2026-11-08T05:09:39.000Z","url":"https://x.com/thsottiaux/status/2119296267545419987","likes":2756,"retweets":86,"replies":650},{"text":"Cyber","createdAt":"2026-11-07T06:27:04.000Z","url":"https://x.com/thsottiaux/status/2118953362725159104","likes":1601,"retweets":39,"replies":417}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"The Better Lesson:","createdAt":"2026-11-07T23:55:53.000Z","url":"https://x.com/amasad/status/2119217304953053419","likes":255,"retweets":12,"replies":37},{"text":"Really enjoyed Kazakhstan — super AI pilled government. And a great place for the Network School.","createdAt":"2026-11-07T17:53:19.000Z","url":"https://x.com/amasad/status/2119126064815608270","likes":454,"retweets":22,"replies":37}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"This sounds extreme and I wouldn’t have believed it even a year ago, but we’re starting to see plenty of examples of productivity gains that are an order of magnitude or two above output levels pre-AI. With the right harness, a deep understanding of your domain of what you want to build, likely a relatively new codebase (with some exceptions), a fluency of how to work with multiple agents at once, and a setup that makes it so you can test and deploy with limited friction, outputs on this level feel realistic in coding. What’s crazy is this gap doesn’t appear to be diminishing over time. You’d think that we’d see a convergence in the lines because of AI, but it turns out the more depth you h…","createdAt":"2026-11-07T16:54:46.000Z","url":"https://x.com/levie/status/2119111328099168409","likes":582,"retweets":51,"replies":99},{"text":"The interesting thing about AI agents is that as a theoretical matter, their inference can kind of run anywhere. AI is one of the few areas of technology that isn’t *as* sensitive to latency back to the user. Long running agents are now going to be the norm, which means it’s ok to send off work to an AI factory somewhere and that work can essentially be largely done within that remote data center and a final result spit back to the user. The data can pass into these systems in an encrypted manner, be combed through by agents, and then disregarded right after. And because the economic value of the task is so high relative to the latency sensitivity (eg getting back $500 in value from an auto…","createdAt":"2026-11-07T06:29:14.000Z","url":"https://x.com/levie/status/2118953909524050288","likes":256,"retweets":37,"replies":105}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"WIRED is a shell of its former self","createdAt":"2026-11-07T20:59:08.000Z","url":"https://x.com/garrytan/status/2119172824271360124","likes":110,"retweets":3,"replies":16},{"text":"We could have abundance This is going to be the defining political issue of the next decade: can we have human progress in science, medicine and engineering through superintelligence? Or will we choose the darkness?","createdAt":"2026-11-07T19:16:16.000Z","url":"https://x.com/garrytan/status/2119146939514278238","likes":314,"retweets":21,"replies":55},{"text":"Man don’t show this essay to the NIMBYs","createdAt":"2026-11-07T18:59:22.000Z","url":"https://x.com/garrytan/status/2119142686422859899","likes":84,"retweets":0,"replies":5}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Harvard’17. Instagram: GitHub:","tweets":[{"text":"So many people speak of startup as if their fates are predestined: X idea will never work out; the market for Y is too niche... But startups' fates are MADE, not predetermined. Given one idea, there are 1000 ways to execute it, 100 people will have 100 different approaches. Brilliant people with brilliant execution often create something when there was nothing, or make the impossible seem obvious in hindsight.","createdAt":"2026-11-07T07:28:40.000Z","url":"https://x.com/zarazhangrui/status/2118968862557475298","likes":146,"retweets":5,"replies":29}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"Next guest up is @danielrupawalla, cofounder of @ArcanumLabs_ next Wednesday, Nov 11th at noon. For this session, we'll be chatting about all things data (what the labs are buying, who is selling, how do i get into this business, will this market even last..) Format: > 60 minute sessions (IRL only) in SF > For the first 45 mins, I get to ask the guest spicy questions about their expertise > For the last 15 mins, they get to ask me anything they want to learn about venture > All off the record, chatham house rules > Open to 10-12 guests who listen in and can ask some of their own questions Register here if you want to join, and subscribe to the Luma for future guests:","createdAt":"2026-11-08T00:46:00.000Z","url":"https://x.com/nikunj/status/2119229917019971879","likes":13,"retweets":1,"replies":3},{"text":"ok here’s how we get investors to fomo our series A and get seven term sheets.. first, we have to vague post revenue. or customers. this is absolutely critical. no y axis, just keep showing numbers and to the right. graphs work and of course get your investors to quote tweet it and take credit. they love doing that anyway. make it vague like “slowly but surely” or “i see an exponential when I see one” ok, once you do that, you know you can do another launch video for features or even better multiple for features so you get maximum airtime. after that case studies are critical - get a trendsetter company to talk about you or even better have the labs mention you in articles. this will guaran…","createdAt":"2026-11-07T20:16:58.000Z","url":"https://x.com/nikunj/status/2119162212044742938","likes":80,"retweets":3,"replies":8}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"The Asahi project was all about taking something closed and restricted and opening it up. Adding new restrictions that make it harder for other projects to build on that is not the way. And that AI rejection is just silly.","createdAt":"2026-11-08T03:02:46.000Z","url":"https://x.com/steipete/status/2119264334627090514","likes":1053,"retweets":44,"replies":85}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"If building datacenters becomes harder, it is obvious that you should be super long anyone who has existing capacity (aka hyperscalers). It's not like the demand for the spice is going way -- it is only continuing to go up. Thus the spice holders will win big. What will suffer is the rate of new model training. I guess we will pace the frontier after all. The body politic speaketh.","createdAt":"2026-11-07T19:57:26.000Z","url":"https://x.com/adityaag/status/2119157297167372646","likes":41,"retweets":3,"replies":5}]}]},"errors":["Podcast feed problem: Podcast: Transcript error for \"Deep Dive: Anthropic S-1 Myths and Mythos — Jamin Ball, Altimeter\": HTTP 502: {\"status\":\"error\",\"code\":\"transcription_submit_failed\",\"message\":\"The transcription service couldn't start this episode.\"}"],"partial":false},{"date":"2026-11-08","dateLabel":"2026年11月08日","generatedAt":"2026-11-08T00:00:00+08:00","sourceGeneratedAt":"2026-11-07T06:25:13.003Z","stats":{"podcastEpisodes":1,"xBuilders":13,"totalTweets":29,"blogPosts":0},"highlights":[{"tag":"产品","title":"让 agent 的成果回到用户熟悉的编辑器","body":"作者注意到创作软件内置 MCP 的模式。agent 完成一部分工作后，用户能在原工具继续修改，交接成本因此下降。对创作产品，自动生成结果能否继续编辑，会直接影响人愿不愿意把它用于正式项目。","evidence":[{"quote":"power users can collaborate and continue the work in tools that they're used to","translation":"熟练用户能在习惯的工具中协作并接着完成工作。","attribution":"Thariq","url":"https://x.com/trq212/status/2118822238262853904","publishedAt":"2026-11-06T21:46:02.000Z"}]},{"tag":"产品","title":"模型升级后，旧 skill 也需要重新验收","body":"作者介绍自己删除一个调查 skill 的经历，理由是新模型直接执行效果更好。由此看，过去为补足能力而加入的步骤，可能逐渐变成额外成本。升级时用相同任务比较有无 skill 的结果，才能判断哪些步骤值得保留。","evidence":[{"quote":"You can remove things you don't need anymore.","translation":"可以删掉那些已经不再需要的东西。","attribution":"Garry Tan","url":"https://x.com/garrytan/status/2118920030243139596","publishedAt":"2026-11-07T04:14:37.000Z"}]},{"tag":"产品","title":"多模型应用的价值在于保留选择空间","body":"作者观察到部分应用被模型实验室收购，并认为跨厂商需求仍在。对用户，统一工作环境能够降低比较和更换模型的成本。由此推断，应用若能保留任务记录和工具配置，让用户随任务选择模型，就有独立的产品价值。","evidence":[{"quote":"there’s still a lot of user and enterprise demand for apps that can use models from different labs.","translation":"用户和企业仍然很需要能使用不同实验室模型的应用。","attribution":"Peter Yang","url":"https://x.com/petergyang/status/2118811231545122998","publishedAt":"2026-11-06T21:02:17.000Z"}]}],"matters":[{"kind":"动态","title":"对话平台里的生成式界面","detail":"Guillermo Rauch 介绍将 AI SDK、Chat SDK 与 json-render 组合，把模型输出转换成 Slack、Teams 等平台中的界面，并预测这会成为常见的人机交互方式。","url":"https://x.com/rauchg/status/2118856239719608353"},{"kind":"动态","title":"Texts Wrapped 更新本地通信统计","detail":"作者介绍新版工具，可在 Mac 本地分析 iMessage、WhatsApp 和通话记录。其自述为开源、完全本地运行，并更新了界面、洞察和准确性，需要完整磁盘访问权限。","url":"https://x.com/nikunj/status/2118840414853861627"},{"kind":"动态","title":"个人网站让实际作品更容易被看见","detail":"作者提议把个人网站作为简历，展示审美、思考和实际工作。相比仅罗列职位，这种呈现让读者能直接查看作品如何完成。","url":"https://x.com/zarazhangrui/status/2118939184841052386"},{"kind":"动态","title":"Swyx 计划持续跟踪 Anthropic IPO","detail":"Swyx 表示将与 Jamin Ball 每周跟踪这一议题，直到上市发生或最终没有发生。帖子宣布的是报道计划。","url":"https://x.com/swyx/status/2118905788915982341"}],"articles":{"blogs":[],"podcasts":[{"title":"Fabian Theis：从细胞图谱走向下一次实验","sourceName":"Latent Space","sourceTitle":"Controlling Biology - Fabian Theis, Helmholtz Munich","sourceId":"01a1a3f4-4773-7ef4-9673-59b03a12c34b","sourceUrl":"https://www.youtube.com/@LatentSpacePod","publishedAt":"2026-11-06T14:48:24.000Z","linkScope":"channel","sourceTextSha256":"9503f0923ddf12960a0867517778959ab9ba10eab6d0728c17fa9ceeac3387c6","blocks":[{"type":"paragraph","text":"Fabian Theis 在 Latent Space 访谈中，把计算生物学的进展串成三个阶段：先记录细胞是什么样，再预测干预之后会怎样，最后用预测来选择下一次实验。这条路的难处，是模型每前进一步，都要面对真实实验的成本和时间。"},{"type":"heading","text":"细胞图谱提供了起点"},{"type":"paragraph","text":"人体不同细胞拥有基本相同的基因组，却表达不同的 RNA。单细胞测量让研究者看到这种差异，也为模型提供了描述细胞状态的数据。但描述状态只完成了一部分工作。所谓虚拟细胞，还需要回答药物、基因变化、环境和时间如何共同改变细胞。"},{"type":"paragraph","text":"类器官和干预实验因此重要。研究者需要主动改变条件，才能观察系统怎样响应。仅把更多静态测量放在一起，并不能自动补齐所有干预结果。"},{"type":"heading","text":"模型复杂度要和问题一起判断"},{"type":"paragraph","text":"Theis 承认，在部分现有任务和数据条件下，线性模型仍然表现不错，判断细胞类型也常能用逻辑回归完成。他把原因与任务难度联系起来。预测更复杂的变化，需要同时考虑细胞状态、环境和作用方式。"},{"type":"paragraph","text":"他介绍的方法先学习细胞的潜在表示，再用生成模型预测干预后的状态。好的表示为后续预测提供基础，生成方法本身也需要评估。他提到部分竞赛指标可能被利用，因此主张让评测更贴近细胞数据中的真实差异，而非仅追逐固定分数。"},{"type":"heading","text":"把预测带回实验室"},{"type":"paragraph","text":"从正向预测走到逆向设计，研究问题变成：想得到某种状态，应该施加什么干预？他用 Lab Compass 解释这一方向，并谈到通过多轮实验逐步改进模型。"},{"type":"paragraph","text":"真正启动循环，需要实验人员愿意投入。建新细胞系、培养材料和完成测量都需要时间。计算团队提出一个预测，只是合作的开头，实验团队还要认可这个问题值得做。模型是否有用，最终要在这种持续交接中体现。"},{"type":"heading","text":"数据生成也是产品能力"},{"type":"paragraph","text":"访谈随后谈到科研成果如何走向产业。Theis 举出癌症类器官干预图谱合作，药企参与以提前获得相关数据。他认为，把建模和数据生成连接起来，能够让合作形成更具体的价值。"},{"type":"paragraph","text":"这一思路也解释了为什么科研团队需要同时理解方法和领域问题。能训练模型的人，还要知道缺什么数据、哪项实验能减少不确定性，以及结果如何影响下一步。控制生物系统的愿景，最终依赖这些可以一次次执行的研究步骤。"}]}]},"sources":{"podcasts":[{"title":"Controlling Biology - Fabian Theis, Helmholtz Munich","name":"Latent Space","publishedAt":"2026-11-06T14:48:24.000Z","url":"https://www.youtube.com/@LatentSpacePod","excerpts":["We can really now start guiding the experimentation. So where before you, we built these human cell atlases, we had sort of this mapping aspect. Then we talked about the world models prediction problem.","From mapping, we went to prediction. But now we can go to actually steering the next experiment. But quite frankly, very often the papers ended with some model, right?","Maybe some sort of concept figure, maybe add a little bit validation. But then typically you start the next project, right? And of course you learn a bit, but it's not like, not like a continual learning type of thing."]}],"blogs":[],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @cognition - @temporalio - @aidot       const shortDate = date => date.slice(5).replaceAll('-', '.');
      picker.textContent = shortDate(selectedDate);
      picker.setAttribute('aria-label', 'Select date, ' + selectedDate.replaceAll('-', '.'));
      picker.setAttribute('aria-expanded', 'false');
      menu.hidden = true;
      menu.innerHTML = DIGESTS.map(d => '<button type="button" class="date-option" role="menuitemradio" tabindex="-1" aria-checked="' + (d.date === selectedDate) + '" aria-label="' + esc(d.date.replaceAll('-', '.')) + '" data-date="' + esc(d.date) + '">' + esc(shortDate(d.date)) + '</button>').join('');
    }
    function setupDatePicker() {
      const picker = document.getElementById('dates');
      const menu = document.getElementById('date-menu');
      const container = picker.parentElement;
      const options = () => Array.from(menu.querySelectorAll('.date-option'));
      const close = (restoreFocus = false) => {
        menu.hidden = true;
        picker.setAttribute('aria-expanded', 'false');
        if (restoreFocus) picker.focus({ preventScroll: true });
      };
      const open = (focus = false, index) => {
        menu.hidden = false;
        picker.setAttribute('aria-expanded', 'true');
        if (focus) {
          const items = options();
          const target = index === undefined ? items.find(item => item.getAttribute('aria-checked') === 'true') : items[index];
          (target || items[0])?.focus({ preventScroll: true });
        }
      };
      picker.addEventListener('click', event => menu.hidden ? open(event.detail === 0) : close());
      picker.addEventListener('keydown', event => {
        if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
          event.preventDefault();
          open(true, event.key === 'ArrowUp' ? options().length - 1 : undefined);
        } else if (event.key === 'Escape') close();
      });
      menu.addEventListener('click', event => {
        const item = event.target.closest('.date-option');
        if (!item) return;
        selectedDate = item.dataset.date;
        history.replaceState(null, '', '?date=' + selectedDate);
        render();
        close(true);
      });
      menu.addEventListener('keydown', event => {
        const items = options();
        const index = items.indexOf(document.activeElement);
        let next;
        if (event.key === 'ArrowDown') next = (index + 1) % items.length;
        if (event.key === 'ArrowUp') next = (index - 1 + items.length) % items.length;
        if (event.key === 'Home') next = 0;
        if (event.key === 'End') next = items.length - 1;
        if (next !== undefined) {
          event.preventDefault();
          items[next]?.focus({ preventScroll: true });
        } else if (event.key === 'Escape') {
          event.preventDefault();
          close(true);
        }
      });
      container.addEventListener('keydown', () => container.setAttribute('data-keyboard', ''));
      document.addEventListener('keydown', event => { if (event.key === 'Tab') container.setAttribute('data-keyboard', ''); });
      document.addEventListener('pointerdown', event => {
        container.removeAttribute('data-keyboard');
        if (!container.contains(event.target)) close();
      });
      document.addEventListener('focusin', event => { if (!container.contains(event.target)) close(); });
    }
    function renderStats(d) {
      const stats = d.stats || {};
      document.getElementById('stats').innerHTML = [
        ['Podcast', stats.podcastEpisodes || 0],
        ['Builder', stats.xBuilders || 0],
        ['Tweet', stats.totalTweets || 0],
        ['Blog', stats.blogPosts || 0],
      ].map(([label, value]) => esc(value) + ' ' + label + (value === 1 ? '' : 's')).join(' · ');
    }
    function renderEvidence(evidence) {
      if (typeof evidence === 'string') return '<blockquote>' + esc(evidence) + '</blockquote>';
      const attribution = evidence.attribution ? '<div class="small">— ' + esc(evidence.attribution) + (evidence.url ? ' · ' + link(evidence.url, '查看原文') : '') + '</div>' : '';
      return '<blockquote>' + esc(evidence.translation || evidence.quote || '') + attribution + '</blockquote>';
    }
    function renderImages(item) {
      return (Array.isArray(item.images) ? item.images : []).map(image => {
        if (!image || !image.src || !image.alt) return '';
        try {
          if (!['http:', 'https:'].includes(new URL(image.src, location.href).protocol)) return '';
        } catch { return ''; }
        const dimensions = Number.isInteger(image.width) && image.width > 0 && Number.isInteger(image.height) && image.height > 0
          ? ' width="' + image.width + '" height="' + image.height + '"' : '';
        return '<figure class="article-image"><a href="' + esc(image.src) + '" target="_blank" rel="noreferrer" aria-label="' + esc('查看大图：' + image.alt) + '"><img src="' + esc(image.src) + '" alt="' + esc(image.alt) + '"' + dimensions + ' loading="lazy" decoding="async"></a></figure>';
      }).join('');
    }
    function renderHighlights(d) {
      const renderClaim = c => esc(c.text);
      function detailed(item) {
        const sources = item.detail.sources.map(summary => {
          const evidence = item.evidence.find(e => e.sourceId === summary.sourceId);
          const header = '<p class="small summary-source">' + esc(evidence.attribution) + ' · ' + link(evidence.url, '原文') + '</p>';
          const blocks = summary.blocks.map(b => b.type === 'heading' ? '<h4>' + esc(b.text) + '</h4>' : b.type === 'list' ? '<ul>' + b.items.map(c => '<li>' + renderClaim(c) + '</li>').join('') + '</ul>' : '<p>' + b.sentences.map(renderClaim).join('') + '</p>').join('');
          return '<div class="source-summary">' + header + blocks + '</div>';
        }).join('');
        const commentary = (item.detail.editorial || []).map(c => '<p>' + renderClaim(c) + (c.reviewedAs === 'insufficient' ? '<span class="small">（编辑推测，原文未直接证实）</span>' : '') + '</p>').join('');
        return sources + (commentary ? '<blockquote class="editor-note">' + commentary + '</blockquote>' : '');
      }
      const cards = (d.highlights || []).map(item => '<article class="card"><h3>' + esc(item.title) + '</h3>' + (item.detail ? detailed(item) : '<p>' + esc(item.body) + '</p>' + ((item.evidence || []).length ? '<div class="evidence">' + item.evidence.map(renderEvidence).join('') + '</div>' : '')) + renderImages(item) + '</article>').join('');
      return '<section><h2>Insights</h2><div class="grid">' + (cards || '<p class="empty">今天没有足够内容生成洞察。</p>') + '</div></section>';
    }
    function renderMatters(d) {
      const cards = (d.matters || []).map(item => '<article class="card"><h3>' + esc(item.title) + '</h3><p>' + esc(String(item.detail || '').split('来源：')[0].trim()) + '</p>' + renderImages(item) + '</article>').join('');
      return '<section><h2>Matters</h2><div class="grid">' + (cards || '<p class="empty">今天没有额外议题。</p>') + '</div></section>';
    }
    function renderArticles(d, kind, label) {
      const articles = (d.articles?.[kind] || []).filter(article => article.title &&
        Array.isArray(article.blocks) && article.blocks.some(block => block.type === 'paragraph' && block.text?.trim()));
      if (!articles.length) return '';
      const content = articles.map(article => {
        const metadata = [article.sourceName, article.author].filter(Boolean).map(esc).join(' · ');
        const original = article.sourceUrl ? link(article.sourceUrl, '原文') : '';
        const body = article.blocks.map(block => {
          if (block.type === 'paragraph') return '<p>' + esc(block.text) + '</p>';
          if (block.type === 'heading') return '<h4>' + esc(block.text) + '</h4>';
          if (block.type === 'image') return renderImages({images: [block]});
          return '';
        }).join('');
        return '<article class="longform"><h3>' + esc(article.title) + '</h3><p class="article-meta">' +
          metadata + (metadata && original ? ' · ' : '') + original + '</p><div class="article-copy">' + body + '</div></article>';
      }).join('');
      return '<section class="reading-section" data-kind="' + kind + '"><h2>' + label + '</h2><div class="reading-list">' + content + '</div></section>';
    }
    function setupArticleFolds() {
      document.querySelectorAll('.reading-section').forEach(section => {
        // The final module stays fully open, regardless of article length.
        if (!section.nextElementSibling) return;
        section.querySelectorAll('.longform').forEach((article, index) => {
          const copy = article.querySelector('.article-copy');
          if (copy.scrollHeight <= 600) return;
          const blocks = Array.from(copy.children);
          const start = copy.getBoundingClientRect().top;
          let split = blocks.findIndex((block, i) => i > 0 && block.getBoundingClientRect().bottom - start > 420);
          if (split < 1) return;
          // Do not leave a section heading alone at the end of the preview.
          if (blocks[split - 1].tagName === 'H4') split--;
          if (split < 1) return;
          const rest = document.createElement('div');
          rest.className = 'article-rest';
          rest.id = 'article-rest-' + section.dataset.kind + '-' + index;
          blocks.slice(split).forEach(block => rest.appendChild(block));
          rest.hidden = true;
          copy.appendChild(rest);
          const toggle = document.createElement('button');
          toggle.type = 'button';
          toggle.className = 'article-toggle';
          toggle.textContent = '展开全文';
          toggle.setAttribute('aria-expanded', 'false');
          toggle.setAttribute('aria-controls', rest.id);
          toggle.addEventListener('click', () => {
            const expand = rest.hidden;
            rest.hidden = !expand;
            toggle.textContent = expand ? '收起全文' : '展开全文';
            toggle.setAttribute('aria-expanded', String(expand));
            if (!expand) toggle.scrollIntoView({ block: 'nearest' });
          });
          article.appendChild(toggle);
        });
      });
    }
    function renderSources(d) {
      const archive = d.archiveUrl ? '<p class="archive-link">' + link(d.archiveUrl, '查看当日完整存档 ↗') + '</p>' : '';
      const xGroups = ((d.sources || {}).x || []).map(builder => '<div class="source-group"><h3>' + esc(builder.name) + ' <span class="small">@' + esc(builder.handle) + '</span></h3><p class="small">' + esc(builder.bio) + '</p>' + (builder.tweets || []).map(tweet => '<p class="tweet">' + esc(tweet.text) + '<br>' + link(tweet.url, '原文') + ' <span class="small">likes ' + esc(tweet.likes) + ' · reposts ' + esc(tweet.retweets) + '</span></p>').join('') + '</div>').join('');
      const podcastGroups = ((d.sources || {}).podcasts || []).map(podcast => '<div class="source-group"><h3>' + link(podcast.url, podcast.title) + '</h3>' + (podcast.excerpts || []).map(e => '<blockquote>' + esc(e) + '</blockquote>').join('') + '</div>').join('');
      const blogGroups = ((d.sources || {}).blogs || []).map(blog => '<div class="source-group"><h3>' + link(blog.url, blog.title) + '</h3><p class="small">' + esc(blog.source || '') + '</p><p>' + esc(blog.summary || '') + '</p></div>').join('');
      return '<section><h2>原文<span class="section-note">Sources / 来源索引</span></h2>' + archive + '<div class="sources">' + podcastGroups + blogGroups + xGroups + '</div></section>';
    }
    function render() {
      const d = DIGESTS.find(item => item.date === selectedDate) || DIGESTS[0];
      if (!d) {
        document.getElementById('content').innerHTML = '<p class="empty">还没有 digest 数据。</p>';
        return;
      }
      selectedDate = d.date;
      renderDates();
      renderStats(d);
      document.getElementById('content').innerHTML = renderHighlights(d) + renderMatters(d) + renderArticles(d, 'blogs', 'Blogs') + renderArticles(d, 'podcasts', 'Podcasts');
      setupArticleFolds();
    }
    render();
    setupDatePicker();
  </script>
</body>
</html>
