I think it'll soon be incredibly hard to make money from software unless you have proprietary data, distribution, or some other edge.","attribution":"Peter Yang，产品负责人及创作者","url":"https://x.com/petergyang/status/2107981547102245101"},{"quote":"Great engineering is still rare. But “I can build it” is becoming a weaker answer to why you, specifically, have an advantage.","attribution":"Aditya Agarwal，South Park Commons 普通合伙人","url":"https://x.com/adityaag/status/2107865115831988530"}]},{"tag":"工程治理","title":"无限算力不会消灭取舍，反而会让停止条件成为核心规格","body":"Agent 能不断补边界、跑优化，也能把团队拖进对用户无意义的局部完美。自动执行能力越强，产品和工程负责人越需要预先定义可接受质量、真实流量假设与机会成本，否则系统会把“还能改进”误当成“应该继续”。未来优秀的 Agent harness 不只会推进任务，也要能识别收益递减并请求决策。","evidence":[{"quote":"Even in an infinite token world, you need to know when to stop and what tradeoffs to accept. Agents will happily drill no matter what.","attribution":"Guillermo Rauch，Vercel CEO","url":"https://x.com/rauchg/status/2107962327169675566"}]},{"tag":"能力边界","title":"Agent 扩大行动半径的同时，也会放大“不知道自己不知道”","body":"低门槛执行让更多人跨入陌生领域，但模型无法自动补足用户未表达、也未意识到的约束。迭代轮次增加往往不是模型不够强，而是任务拥有者缺少定义问题所需的领域语言；更可靠的工作流应先帮助用户建立最低限度的领域模型，再进入计划与执行。","evidence":[{"quote":"the most common failure case I see is when people are working outside their domain of expertise and don't know how to be precise with their prompts and plans, so they have to spend a lot of turns iterating imprecisely https://t.co/mRT3knojCP","attribution":"Thariq，Claude Code 团队","url":"https://x.com/trq212/status/2108021247301062894"},{"quote":"and because agents make it easier, almost everyone is operating outside their expertise at some point","attribution":"Thariq，Claude Code 团队","url":"https://x.com/trq212/status/2108021248966135891"}]},{"tag":"产品护城河","title":"个人 Agent 的忠诚度不属于角色设定，而属于它嵌入的生态","body":"名字和人格能制造短期情感连接，但当更强工具出现时，用户仍会迁移。更耐久的留存来自对工作与生活系统的持续接入：替用户跨应用搬运信息、保护注意力，并在离开电脑后继续工作。于是竞争重点会从塑造一个讨喜角色，转向积累权限、上下文与可替换而不中断的长期任务状态。","evidence":[{"quote":"But having an agent connected to the ecosystem you already use for work and life is a real advantage.","attribution":"Dan Shipper，Every CEO","url":"https://x.com/danshipper/status/2107890633486582208"},{"quote":"When something better comes along, I switch. In a year, I expect to be using a persistent agent.","attribution":"Dan Shipper，Every CEO","url":"https://x.com/danshipper/status/2107890633486582208"}]}],"matters":[{"kind":"云端开发","title":"Codex Cloud 静默重新上线","detail":"Thibault Sottiaux 表示团队重新发布了 Codex Cloud，并称新版体验已经明显改善。","url":"https://x.com/thsottiaux/status/2108084615349170480"},{"kind":"桌面安全","title":"桌面 Agent 开始把隔离与可靠性放到产品前台","detail":"Amjad Masad 提醒桌面 AI 应用会带来供应链攻击和灾难性误操作风险，并称 Replit 正与 Microsoft、NVIDIA OpenShell 合作构建更安全可靠的桌面体验。","url":"https://x.com/amasad/status/2107926712277438503"},{"kind":"用户研究","title":"Agent 把高频用户识别与访谈邀约串成一条工作流","detail":"Cat Wu 分享的产品用例是让 Claude 找出上周某功能使用最多的用户、制作前十名清单，并主动联系安排 15 分钟访谈。","url":"https://x.com/_catwu/status/2107967210467803152"},{"kind":"生成式游戏","title":"零代码游戏生成进入面向普通用户的实验平台","detail":"Google Labs 发布 Playground，让没有编程经验的用户用自然想法创建并游玩自己的游戏，目前面向美国成年用户开放。","url":"https://x.com/GoogleLabs/status/2107800195748737042"},{"kind":"动态界面","title":"ChatGPT 开始按任务生成定制 UI","detail":"Sam Altman 宣布 ChatGPT 现在能够为用户生成定制界面，并表示自己不愿再回到旧版聊天体验。","url":"https://x.com/sama/status/2107924408597950702"}],"sources":{"podcasts":[{"title":"Why Every Traded Personal Agents for One Company Agent","name":"AI & I by Every","publishedAt":"2026-10-07T17:11:13.000Z","url":"https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL","excerpts":["The hot thing right now is dots. They're persistent agents from OpenAI. I was there at Dev Day when they launched them. I interviewed Sam about them, and I've been using dots since before they came out. And now we're into week two of dots.","So how's it going? If you read my vibe check, you know that I thought they were a little bit rough to begin with, but that the idea of a persistent proactive agent was obviously the future. Even before DOTS launched, they'd become my main way of interacting with ChatGPT, and they're still that way after launch. I'm really excited about the little things the…","We've got about 30 people seeing them start to adopt it and some of the use cases that have started to emerge. So in case you're looking for some use cases, I actually had my dot collect some use cases to talk to you about. So one thing that dots are really useful for is keeping up with school emails. So Kieran Klassen, who works at Every, says that it scan…"]}],"blogs":[],"x":[{"name":"Boris Cherny","handle":"bcherny","bio":"Claude @anthropicai","tweets":[{"text":"Ok back to reading","createdAt":"2026-10-08T01:57:44.000Z","url":"https://x.com/bcherny/status/2108013947144085714","likes":55,"retweets":0,"replies":10},{"text":"It was one prompt, claude verified pretty well too! No bugs so far","createdAt":"2026-10-08T01:34:09.000Z","url":"https://x.com/bcherny/status/2108008010253533397","likes":28,"retweets":0,"replies":5},{"text":"Try it","createdAt":"2026-10-08T01:26:38.000Z","url":"https://x.com/bcherny/status/2108006118966665463","likes":57,"retweets":0,"replies":9}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Day 3 (encore)/ We silently re-shipped codex cloud. It’s pretty good now","createdAt":"2026-10-08T06:38:33.000Z","url":"https://x.com/thsottiaux/status/2108084615349170480","likes":433,"retweets":23,"replies":116},{"text":"Confirmed landed across all accounts. How are we doing so far?","createdAt":"2026-10-08T03:44:55.000Z","url":"https://x.com/thsottiaux/status/2108040921044639779","likes":4525,"retweets":72,"replies":1158},{"text":"Will be there by EOD PST.","createdAt":"2026-10-07T19:19:33.000Z","url":"https://x.com/thsottiaux/status/2107913738791596286","likes":2203,"retweets":22,"replies":180}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":".@suno is so damn good honestly. It's probably going to overtake Spotify at some point.","createdAt":"2026-10-08T04:08:52.000Z","url":"https://x.com/petergyang/status/2108046949291315385","likes":40,"retweets":2,"replies":13},{"text":"AI already solved images, music, and video. It’s going to solve gaming soon","createdAt":"2026-10-08T03:13:08.000Z","url":"https://x.com/petergyang/status/2108032922527862851","likes":45,"retweets":2,"replies":34},{"text":"It seems like anything you ship can now be decompiled and rebuilt by AI. I think it'll soon be incredibly hard to make money from software unless you have proprietary data, distribution, or some other edge. Traditional SaaS is especially vulnerable, since it's expensive and full of features built for humans that agents don't need.","createdAt":"2026-10-07T23:48:59.000Z","url":"https://x.com/petergyang/status/2107981547102245101","likes":6,"retweets":1,"replies":1}]},{"name":"Nan Yu","handle":"thenanyu","bio":"product, codex @openai. prev head of product @linear","tweets":[{"text":"Dread it. Run from it. The One True Productivity App Layout arrives all the same.","createdAt":"2026-10-08T04:19:00.000Z","url":"https://x.com/thenanyu/status/2108049498648051747","likes":21,"retweets":0,"replies":1}]},{"name":"Cat Wu","handle":"_catwu","bio":"claude code + cowork @anthropicai, prev: @dagster, @scale_ai","tweets":[{"text":"One of my favorite PM use cases for Claude is asking \"who used <feature> the most last week? make me a artifact of the top 10 by usage, then reach out and schedule 15 min to chat.\" It's the fastest way to get user feedback!","createdAt":"2026-10-07T22:52:01.000Z","url":"https://x.com/_catwu/status/2107967210467803152","likes":246,"retweets":8,"replies":20}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"and because agents make it easier, almost everyone is operating outside their expertise at some point but luckily, you can just ask the model to teach you what you don't know","createdAt":"2026-10-08T02:26:45.000Z","url":"https://x.com/trq212/status/2108021248966135891","likes":148,"retweets":7,"replies":21},{"text":"the most common failure case I see is when people are working outside their domain of expertise and don't know how to be precise with their prompts and plans, so they have to spend a lot of turns iterating imprecisely","createdAt":"2026-10-08T02:26:45.000Z","url":"https://x.com/trq212/status/2108021247301062894","likes":1296,"retweets":41,"replies":86},{"text":"I think it's probably an incredible time to be a game dev content creator, for many people making games is a form of having fun and they're willing to pay for it!","createdAt":"2026-10-07T22:12:16.000Z","url":"https://x.com/trq212/status/2107957206327173484","likes":453,"retweets":17,"replies":44}]},{"name":"Google Labs","handle":"GoogleLabs","bio":"Google’s home for our latest AI tools and experiments.","tweets":[{"text":"🚨NEW EXPERIMENT 🚨 Playground is an experimental gaming platform that lets you create your own games with zero coding experience. If you can think it, you can play it. Go to to learn more! Available to users 18+ in the US.","createdAt":"2026-10-07T11:48:22.000Z","url":"https://x.com/GoogleLabs/status/2107800195748737042","likes":23081,"retweets":2384,"replies":771}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Math was bound to fall first. The purer the field the easier it is for AI to crack.","createdAt":"2026-10-07T20:43:47.000Z","url":"https://x.com/amasad/status/2107934939287273551","likes":1095,"retweets":90,"replies":76},{"text":"That’s because Replit is not a consumer app. Most of our creators are building businesses or working on one.","createdAt":"2026-10-07T20:12:33.000Z","url":"https://x.com/amasad/status/2107927076926038273","likes":513,"retweets":21,"replies":38},{"text":"Desktop AI apps are great but expose users to supply-chain attacks and catastrophic mistakes by agents. We’re building a powerful desktop experience with focus on security & reliability. Excited to partner with @Microsoft on this and be an early adopter of @nvidia’s OpenShell.","createdAt":"2026-10-07T20:11:06.000Z","url":"https://x.com/amasad/status/2107926712277438503","likes":224,"retweets":12,"replies":48}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"One thing the engineering community will (re)discover is that every program can be ① hardened (edge cases squashed, inputs tightened, errors handled) and ② optimized (profiled, benchmarked, rewritten) basically ad infinitum. There are real costs in every direction: time, attention, opportunity. You can literally explore input spaces that will never be hit or optimize performance of something that will never be used (\"you have no users\".) Even in an infinite token world, you need to know when to stop and what tradeoffs to accept. Agents will happily drill no matter what.","createdAt":"2026-10-07T22:32:37.000Z","url":"https://x.com/rauchg/status/2107962327169675566","likes":605,"retweets":39,"replies":100},{"text":"gm from the best city in the world","createdAt":"2026-10-07T15:50:46.000Z","url":"https://x.com/rauchg/status/2107861196506595398","likes":784,"retweets":11,"replies":50}]},{"name":"Alex Albert","handle":"alexalbert__","bio":"Research @AnthropicAI. Opinions are my own!","tweets":[{"text":"For reference, Haiku 4.5 came out on October 15th, 2025 so these two columns are less than a year apart. and oh yeah Haiku 5.5 is also much faster and 75% cheaper...","createdAt":"2026-10-07T19:15:42.000Z","url":"https://x.com/alexalbert__/status/2107912771568554415","likes":349,"retweets":15,"replies":46}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"The compute needed for the stage of AI we’re about to enter is going to be insane. Personal agents, agent swarms defending enterprises, agents that review all of our code for security issues, agents that process nearly all enterprise data in workflows, background agents working on tasks 24/7, and on and on. This will take a mix of inference volume that is going to keep growing by orders of magnitude, as well as infrastructure that agents need alongside the tokens. They need computers, networking, file systems, and so on. We’re only in the early stages of what this buildout is going to look like.","createdAt":"2026-10-08T04:47:08.000Z","url":"https://x.com/levie/status/2108056577697882402","likes":812,"retweets":65,"replies":89}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"Fun fact: Ben Affleck, the successful AI founder and Python/CNN/GPU expert, had a prior career in the entertainment industry.","createdAt":"2026-10-07T16:52:01.000Z","url":"https://x.com/mattturck/status/2107876612679020855","likes":158,"retweets":8,"replies":9},{"text":"Ofc everything is on X is mind-blowing, but having seen the beta version, this is... truly mind-blowing.","createdAt":"2026-10-07T15:20:40.000Z","url":"https://x.com/mattturck/status/2107853622402805803","likes":40,"retweets":3,"replies":7}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Make something people want, then make people want it. Harvard’17. GitHub: YouTube:","tweets":[{"text":"I love @stripepress because I absolutely judge a book by its cover","createdAt":"2026-10-08T06:41:27.000Z","url":"https://x.com/zarazhangrui/status/2108085347297161399","likes":3,"retweets":0,"replies":0},{"text":"Who has the coolest personal website?","createdAt":"2026-10-08T04:12:02.000Z","url":"https://x.com/zarazhangrui/status/2108047745936466373","likes":108,"retweets":7,"replies":71},{"text":"Remember that coding is a means to an end. The end matters more than the means","createdAt":"2026-10-08T02:51:14.000Z","url":"https://x.com/zarazhangrui/status/2108027410256166 dAt":"2026-10-07T06:45:10.543Z","stats":{"podcastEpisodes":1,"xBuilders":19,"totalTweets":40,"blogPosts":0},"highlights":[{"tag":"交互范式","title":"Prompt 工程正在从措辞技巧退化为任务管理能力","body":"当模型能自行拆解大多数任务，冗长模板的边际价值会下降，真正稀缺的反而是把目标、投入程度和验收方式讲清楚。这意味着高质量使用者与普通使用者的差距，不再主要来自记住特殊句式，而来自能否像管理同事一样定义结果、分配注意力并建立验证闭环。","evidence":[{"quote":"There's no secret to prompting. There's no need to be overly scaffolded or prescriptive for most tasks -- give Claude a goal, and it will figure it out.","attribution":"Boris Cherny，Claude Code 创建者","url":"https://x.com/bcherny/status/2107565388250874193"},{"quote":"Nowadays, it's much more important to communicate to the model:\n\n1. What you want it to do\n2. How much effort you want it to spend\n3. How it should verify that it did the right thing","attribution":"Boris Cherny，Claude Code 创建者","url":"https://x.com/bcherny/status/2107565388250874193"}]},{"tag":"系统架构","title":"“云端大脑、本地双手”真正难的不是连接，而是连续性","body":"把推理放在云端、执行留在本地，可以同时获得持续计算与个人环境访问，但也把设备离线、文件同步和状态冲突变成产品核心问题。下一轮桌面 Agent 的分水岭不会只是能否远程调用电脑，而是任务在本地不可用时能否安全等待、恢复，并让用户理解哪些数据被同步到了哪里。","evidence":[{"quote":"we're increasingly going to be moving towards Claude's \"brains\" in the cloud and giving Claude \"local hands\" to operate on your computer\n\nI talked about this a bit on latent space https://t.co/m6NVHyweBp","attribution":"Thariq，Claude Code 团队","url":"https://x.com/trq212/status/2107580785456976085"},{"quote":"if Claude can only access your files when your computer is online, it might be effectively blocked on doing work until your computer is back on, so perhaps you want some sort of sync but there are edge cases there","attribution":"Thariq，Claude Code 团队","url":"https://x.com/trq212/status/2107580787277340835"}]},{"tag":"组织智能","title":"企业 Agent 的护城河会沉淀在判断轨迹，而不是通用知识","body":"基础模型覆盖的知识边界会继续扩张，企业长期独有的部分更可能是风险阈值、审批取舍和专家如何做决定的过程。把生产使用转成可学习的反馈回路，等于把分散在人脑与流程里的判断逐步编码进系统；因此评测、反馈采集和训练基础设施会从技术配套变成组织知识的保管层。","evidence":[{"quote":"the proprietary data that will be out of distribution is things that are produced inside of the company","attribution":"Yash Patil，Applied Compute CEO","url":"https://www.youtube.com/@RedpointAI"},{"quote":"in five years from now, I think a lot of companies will basically have systems to basically gather input from experts and then turn that into better policies.","attribution":"Yash Patil，Applied Compute CEO","url":"https://www.youtube.com/@RedpointAI"}]},{"tag":"团队协作","title":"Agent 从个人工具升级为公司能力，关键是让技能在组织内复利","body":"个人 Agent 的收益常被锁在各自的提示词和操作习惯里；统一入口则能让一次学会的技能被全员调用，并随模型升级同步更新。当内部工作流足够稳定后，它还可以直接外化为客户产品，形成“先在组织内验证、再向市场发布”的低风险产品路径。","evidence":[{"quote":"To help the whole team share skills when a new model comes out, they built a company agent on Claude Managed Agents that everyone uses in Slack.","attribution":"Claude 官方账号","url":"https://x.com/claudeai/status/2107574195978641911"},{"quote":"Once it caught on internally, they released it to their subscribers.","attribution":"Claude 官方账号","url":"https://x.com/claudeai/status/2107574195978641911"}]}],"matters":[{"kind":"安全市场","title":"Agent 同时放大安全攻击面与防御需求","detail":"Aaron Levie 认为，vibe coding 漏洞、Agent 攻击和意外的数据搜寻会增加安全团队负担，而用于保护代码、企业系统和数据的安全 Agent 也会随之增长。","url":"https://x.com/levie/status/2107680435644039269"},{"kind":"推理调度","title":"置信度阈值开始控制模型何时投入更多思考","detail":"Guillermo Rauch 提到一种简单机制：默认快速决策，低于置信度阈值时再放慢推理，用动态算力分配服务大规模 AI 决策。","url":"https://x.com/rauchg/status/2107606246350266469"},{"kind":"办公协作","title":"Claude 把 Google 文件变成聊天旁的共同编辑面板","detail":"Claude 已支持通过粘贴链接或直接创建文档、表格和演示文稿，在聊天侧边与用户共同编辑，并沿用 Google 原有分享权限。","url":"https://x.com/claudeai/status/2107522599530139767"},{"kind":"软件产权","title":"AI 逆向工程正在削弱闭源代码的实际壁垒","detail":"Amjad Masad 观察到 AI 驱动的逆向工程和反编译快速进展，并判断软件可能因此趋向事实上的开源。","url":"https://x.com/amasad/status/2107671204639465961"},{"kind":"工作编排","title":"团队 Agent 开始从社交信号直接触发任务分派","detail":"Peter Steinberger 把团队 Agent 接入 X，由系统判断相关代码的历史贡献者并通知认领；团队服务器还可通过 prompt 和热加载插件自行扩展。","url":"https://x.com/steipete/status/2107697554448421160"}],"sources":{"podcasts":[{"title":"Ep 94: Applied Compute text":"Another example, my actual prompts","createdAt":"2026-10-06T20:15:45.000Z","url":"https://x.com/bcherny/status/2107565497680314831","likes":232,"retweets":7,"replies":8},{"text":"I am surprised that people are surprised this is how I prompt Claude. Talk to Claude the way you would a coworker. There's no secret to prompting. There's no need to be overly scaffolded or prescriptive for most tasks -- give Claude a goal, and it will figure it out. Back in the Sonnet 3.5 days, your prompt mattered a lot. Nowadays, it's much more important to communicate to the model: 1. What you want it to do 2. How much effort you want it to spend 3. How it should verify that it did the right thing","createdAt":"2026-10-06T20:15:19.000Z","url":"https://x.com/bcherny/status/2107565388250874193","likes":8943,"retweets":503,"replies":450},{"text":"Prompt","createdAt":"2026-10-06T18:06:34.000Z","url":"https://x.com/bcherny/status/2107532985897771152","likes":1119,"retweets":33,"replies":72}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Also! Good evening!!","createdAt":"2026-10-07T03:37:27.000Z","url":"https://x.com/thsottiaux/status/2107676653895967106","likes":1309,"retweets":6,"replies":59},{"text":"And we won't unship the improvements. You get to have your cake and eat it too. See you tomorrow for Day 3!","createdAt":"2026-10-07T03:35:54.000Z","url":"https://x.com/thsottiaux/status/2107676261099426030","likes":2256,"retweets":17,"replies":144},{"text":"We shipped four things that were deemed good to great and some math proofs, but the vote is clear and the community demands a reset. I did calibrate it and it *seems* that the game is rigged in reset's favor, but such are the rules at the moment. Therefore ... the reset has been processed. Enjoy!","createdAt":"2026-10-07T03:35:09.000Z","url":"https://x.com/thsottiaux/status/2107676072871600470","likes":10173,"retweets":497,"replies":1487}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"Do I know anyone at @Fourthwall or a related platform? My 8-year-old and I want to use her drawings to sell t-shirts and make her first dollar online. Here’s a design what do you all think? :)","createdAt":"2026-10-07T03:08:58.000Z","url":"https://x.com/petergyang/status/2107669485549400474","likes":7,"retweets":1,"replies":2},{"text":"The flip side of this is that if you live in the boring suburbs like me a glass of wine a few days a week is totally worth it","createdAt":"2026-10-07T01:11:28.000Z","url":"https://x.com/petergyang/status/2107639917287440537","likes":19,"retweets":0,"replies":1},{"text":"@dps not sure if this is possible but it’ll be incredible if muse can wait on a call for me then dial me in when there’s a human on the other line","createdAt":"2026-10-06T22:55:19.000Z","url":"https://x.com/petergyang/status/2107605650398462178","likes":43,"retweets":2,"replies":6}]},{"name":"Nan Yu","handle":"thenanyu","bio":"product, codex @openai. prev head of product @linear","tweets":[{"text":"I worry, though, that this will cause extreme degradation in systems that no one loves to maintain, but someone has to","createdAt":"2026-10-06T16:19:38.000Z","url":"https://x.com/thenanyu/status/2107506074370920796","likes":25,"retweets":2,"replies":2}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"there are some tricky technical problems to figure out! if Claude can only access your files when your computer is online, it might be effectively blocked on doing work until your computer is back on, so perhaps you want some sort of sync but there are edge cases there","createdAt":"2026-10-06T21:16:31.000Z","url":"https://x.com/trq212/status/2107580787277340835","likes":33,"retweets":0,"replies":8},{"text":"we're increasingly going to be moving towards Claude's \"brains\" in the cloud and giving Claude \"local hands\" to operate on your computer I talked about this a bit on latent space","createdAt":"2026-10-06T21:16:30.000Z","url":"https://x.com/trq212/status/2107580785456976085","likes":633,"retweets":23,"replies":99},{"text":"working at a higher level of abstraction has always required understanding the lower level ones, I don't think coding agents changes this","createdAt":"2026-10-06T16:14:05.000Z","url":"https://x.com/trq212/status/2107504677143368163","likes":4206,"retweets":287,"replies":224}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"What’s happening in the AI-powered reverse engineering and decompilation is absolutely insane. Pretty soon all software will be de facto open-source. AI is coming for everything and everyone.","createdAt":"2026-10-07T03:15:48.000Z","url":"https://x.com/amasad/status/2107671204639465961","likes":3239,"retweets":257,"replies":196},{"text":"Full conversation here:","createdAt":"2026-10-06T18:50:47.000Z","url":"https://x.com/amasad/status/2107544111482118237","likes":170,"retweets":17,"replies":14}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"“Thinking fast and s̶l̶o̶w̶ a bit less fast under a confidence threshold.” A very simple feature that I think will be extremely impactful for at-scale AI decision-making.","createdAt":"2026-10-06T22:57:41.000Z","url":"https://x.com/rauchg/status/2107606246350266469","likes":164,"retweets":6,"replies":42},{"text":"At this rate AI will get us GTA 7 before GTA 6","createdAt":"2026-10-06T12:35:04.000Z","url":"https://x.com/rauchg/status/2107449561451274688","likes":5598,"retweets":211,"replies":253}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Cyber will be one of the most defining domains for AI in the coming years, and a huge area of focus for most enterprises. AI is going to now create a whole n "retweets":9,"replies":10}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Make something people want, then make people want it. Harvard’17. GitHub: YouTube:","tweets":[{"text":"It's almost impossible to come up with a good product name these days All the good names have been taken 🫠","createdAt":"2026-10-06T22:52:15.000Z","url":"https://x.com/zarazhangrui/status/2107604881926459802","likes":99,"retweets":0,"replies":63}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"Too many VCs are chasing dopamine.. or rage baiting purposely just to get more views on this platform. X is not for nuance, so once you say something, you really can't take it back. I don't think they understand how it's actually destroying their long term brand. Unfortunately, it hurts the people \"under\" them more than the person talking. Case in point, I know of two folks who lost deals that were all set because of the drama going on X. Given how much a commodity \"capital\" actually is and the sheer number of venture funds, you'd think people would be smarter than this. But in this era of wanting airtime, I guess very few are playing long term games.","createdAt":"2026-10-07T05:36:08.000Z","url":"https://x.com/nikunj/status/2107706522457497753","likes":13,"retweets":0,"replies":2},{"text":"Blown away by the responses/DMs here - I'll aim to get back to most of you by tomorrow!!","createdAt":"2026-10-06T22:59:41.000Z","url":"https://x.com/nikunj/status/2107606751919087701","likes":1,"retweets":0,"replies":0},{"text":"Coming to New York next week for a board meeting.. who should I meet? 👋 Prioritizing founders, but open to meeting design engineers or builders who are not pacing the frontier. DMs open!","createdAt":"2026-10-06T13:50:30.000Z","url":"https://x.com/nikunj/status/2107468543373832463","likes":123,"retweets":0,"replies":28}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"I hooked up our team claw to X to trigger work faster. Unassigned sessions are for anyone to grab. Our agent looks who worked on the related code last and pings people on the server. Whole thing was a prompt and team server extended itself since plugins are now hot reloadable.","createdAt":"2026-10-07T05:00:30.000Z","url":"https://x.com/steipete/status/2107697554448421160","likes":82,"retweets":4,"replies":21}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"we couldn't have built the @every agent without Claude Managed Agents extremely fun to get to sit down and chat about it:","createdAt":"2026-10-06T20:53:52.000Z","url":"https://x.com/danshipper/status/2107575089441181861","likes":132,"retweets":10,"replies":12},{"text":"this is actually true","createdAt":"2026-10-06T17:15:42.000Z","url":"https://x.com/danshipper/status/2107520182789005726","likes":311,"retweets":0,"replies":5},{"text":"there's a pretty cool new featured app on the slack marketplace!","createdAt":"2026-10-06T16:25:11.000Z","url":"https://x.com/danshipper/status/2107507471807881262","likes":49,"retweets":4,"replies":7}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"It is wild to me that the only legally allowed form of spam is political campaigns. And it is also for the most intrusive channel of txt messaging. Insane,.","createdAt":"2026-10-06T22:16:32.000Z","url":"https://x.com/adityaag/status/2107595892849250477","likes":14,"retweets":0,"replies":0},{"text":"I have had the distinct pleasure of collaborating with @keithmadams for almost 15 years. We worked together at Facebook and now jam on startups together. It is such an interesting time to explore what it truly means to be a \"coder\" in today's ecosystem. Super fun pod.","createdAt":"2026-10-06T16:22:01.000Z","url":"https://x.com/adityaag/status/2107506675544682755","likes":11,"retweets":0,"replies":0}]},{"name":"Sam Altman","handle":"sama","bio":"The mission of OpenAI is to ensure that AGI benefits all of humanity","tweets":[{"text":"and thank you to the untold number of people who put in the technical work, brick by brick over the generations, to get us to the point where such a wonder is possible.","createdAt":"2026-10-07T04:36:45.000Z","url":"https://x.com/sama/status/2107691577015755196","likes":1639,"retweets":59,"replies":84},{"text":"thank you to the machines, and the structure of reality, for letting us understand a little more.","createdAt":"2026-10-07T04:35:30.000Z","url":"https://x.com/sama/status/2107691262795239805","likes":1458,"retweets":52,"replies":60},{"text":"looking up at the stars with extra awe tonight. \"thy sea is so great and my boat is so small.\"","createdAt":"2026-10-07T04:35:30.000Z","url":"https://x.com/sama/status/2107691261776052633","likes":4460,"retweets":238,"replies":578}]},{"name":"Claude","handle":"claudeai","bio":"Claude is an AI assistant built by @anthropicai to be safe, accurate, and secure. Talk to Claude on or download the app.","tweets":[{"text":"Watch the full conversation with @danshipper and Willie Williams on how they built it:","createdAt":"2026-10-06T20:50:20.000Z","url":"https://x.com/claudeai/status/2107574198482927900","likes":96,"retweets":6,"replies":5},{"text":"The Every team runs as much work as possible through agents. To help the whole team share skills when a new model comes out, they built a company agent on Claude Managed Agents that everyone uses in Slack. Once it caught on internally, they released it to their subscribers.","createdAt":"2026-10-06T20:50:19.000Z","url":"https://x.com/claudeai/status/2107574195978641911","likes":1669,"retweets":93,"replies":118},{"text":"In Claude, paste a Google file link or ask for a new doc, sheet, or deck, and it opens beside the chat for you and Claude to edit together. Access follows your Google sharing permissions. In beta on all paid plans. Give it a try:","createdAt":"2026-10-06T17:25:18.000Z","url":"https://x.com/claudeai/status/2107522599530139767","likes":947,"retweets":24,"replies":15}]}]},"errors":[],"partial":false},{"date":"2026-10-07","dateLabel":"2026年10月07日","generatedAt":"2026-10-07T00:00:00+08:00","sourceGeneratedAt":"2026-10-06T06:45:56.730Z","stats":{"podcastEpisodes":0,"xBuilders":15,"totalTweets":30,"blogPosts":0},"highlights":[{"tag":"产品工程","title":"Agent 产品的规格正在从需求文档迁移到可运行的评测系统","body":"传统 QA 在成品之后验证已知路径，但 Agent 的行为会随模型和工作流变化，静态验收无法持续定义什么叫“做对”。因此，eval 不只是质量门槛，而是把产品意图转成机器可执行约束的核心资产；谁能把真实工作环境、失败样本与回归标准沉淀成系统，谁才有能力稳定迭代 Agent。","evidence":[{"quote":"Your evals are your product spec.","attribution":"Madhu Guru，Meta AI 高级总监","url":"https://x.com/realmadhuguru/status/2107292113214091355"},{"quote":"Every enterprise is going to have someone managing evals, infrastructure for building and running evals and simulated environments, and more.","attribution":"Aaron Levie，Box CEO","url":"https://x.com/levie/status/2107283615247999257"}]},{"tag":"代码安全","title":"Agent 写得越多，安全设计越要从人工审查下沉到编译约束","body":"代码产量超过人工逐行审查能力后，依赖开发者记住授权前置条件会成为结构性风险。更可扩展的做法，是把权限检查留下的“证明”编码进类型与工具链，让错误调用无法通过编译；Agent 擅长在明确反馈中快速修正，过去让人嫌繁琐的强约束反而可能成为自动化开发的优势。","evidence":[{"quote":"Agents are writing more code than we can review, and they *thrive* in tight loops with hard constraints that would frustrate us.","attribution":"Guillermo Rauch，Vercel CEO","url":"https://x.com/rauchg/status/2107119811444748555"}]},{"tag":"推理经济","title":"降低 Agent 成本的关键不只在模型，而在把重复推理固化成可复用结构","body":"让模型每次从原始 HTML 重新理解组件、状态机和图表，相当于反复为同一类问题支付推理成本。若规划层提供稳定的语义原语，并把反复出现的行为编译为经过测试的确定性代码，token 就能集中在真正需要判断的部分；这会把 Agent harness 的竞争焦点从“多调用模型”转向“少让模型重做”。","evidence":[{"quote":"the model doesn’t need to remake the components or logic to do common things like state machines, diagrams, code snippets, etc.","attribution":"Thariq，Claude Code 团队","url":"https://x.com/trq212/status/2107294499282293017"},{"quote":"Harnesses from labs have an incentive to burn tokens, which means harnesses from startups have a real utility, like how Grep can automatically swap token burn into deterministic tested code that is repeatable just by observing agent use","attribution":"Garry Tan，Y Combinator 总裁兼 CEO","url":"https://x.com/garrytan/status/2107129959550685660"}]},{"tag":"系统架构","title":"通用 Agent 的落点正在变成“云端大脑、本地双手”","body":"云端运行有利于持续计算与统一升级，本地接入则保留文件、工具和个人环境的实际操作权。两端分工能绕开把完整桌面搬进云端的摩擦，也避免智能能力被单一操作系统边界锁死；接下来真正决定可用性的，会是本地权限、执行环境与远程推理之间能否形成可靠而可控的桥梁。","evidence":[{"quote":"my favorite name for this pattern is \"local hands\", Claude runs in the cloud but can access your files locally- also coming to cowork","attribution":"Thariq，Claude Code 团队","url":"https://x.com/trq212/status/2107229483015258493"},{"quote":"Feels like that is a better agent environment than increasingly locked down MacOS.","attribution":"Aditya Agarwal，SPC 普通合伙人","url":"https://x.com/adityaag/status/2107133989941387282"}]}],"matters":[{"kind":"协作产品","title":"ChatGPT 内的协作空间正在快速迭代","detail":"OpenAI 的 Thibault Sottiaux 提到，Sergio 正在 ChatGPT 内构建 collaborative space，而且产品每天都有明显进展。","url":"https://x.com/thsottiaux/status/2107200530477101461"},{"kind":"语音应用","title":"实时语音开始成为语言学习产品的核心交互","detail":"Peter Yang 用 Gemini Live API 做了通过实时语音通话教授日语的应用，并把设计、语音和视觉素材流程整理成教程。","url":"https://x.com/petergyang/status/2107108755699900459"},{"kind":"学习工具","title":"双语字幕把观看内容直接变成语言练习界面","detail":"Ryo Lu 发布的工具支持 Netflix 同时显示任意两种语言字幕，并为中日韩语提供发音辅助与可定制样式。","url":"https://x.com/ryolu_/status/2107146629338042853"},{"kind":"市场渗透","title":"无代码式开发正在进入家庭经营的小型企业","detail":"Amjad Masad 表示，已有许多 family-run businesses 依靠 Replit 运行，AI 开发工具的用户边界继续向非专业团队外扩。","url":"https://x.com/amasad/status/2107222889946898893"},{"kind":"机器人学习","title":"机器人研究继续连接视觉理解与动作学习","detail":"Aditya Agarwal 介绍，Sergey Levine 正在构建让机器人从经验中学习、把所见与动作连接起来的算法。","url":"https://x.com/adityaag/status/2107171588194152936"}],"sources":{"podcasts":[],"blogs":[],"x":[{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"This might have been my best day so far at oai. Ridiculous amounts of fun and intensity. Future is bright","createdAt":"2026-10-06T03:27:22.000Z","url":"https://x.com/thsottiaux/status/2107311729768353844","likes":4541,"retweets":70,"replies":760},{"text":"The real story is this one","createdAt":"2026-10-06T02:24:14.000Z","url":"https://x.com/thsottiaux/status/2107295839655952486","likes":1858,"retweets":58,"replies":519},{"text":"Sergio is cooking up magic with collaborative space right in ChatGPT. Improving leaps and bounds every day.","createdAt":"2026-10-05T20:05:31.000Z","url":"https://x.com/thsottiaux/status/2107200530477101461","likes":1736,"retweets":25,"replies":287}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"Learn more about Gemini 3.8 Live here:","createdAt":"2026-10-05T14:00:53.000Z","url":"https://x.com/petergyang/status/2107108768240796093","likes":0,"retweets":0,"replies":0},{"text":"I built an AI language learning app that teaches me Japanese via live voice calls. Here's my new tutorial that shows you exactly how I built this, including: → Using my spec skill to create key designs → Setting up Gemini Live APIs for voice → Creating diorama art with Nano Banana You can follow along to build your own app to learn 100 phrases for any language before a trip. 📌 Watch now:","createdAt":"2026-10-05T14:00:50.000Z","url":"https://x.com/petergyang/status/2107108755699900459","likes":75,"retweets":7,"replies":19}]},{"name":"Nan Yu","handle":"thenanyu","bio":"product, codex @openai. prev head of product @linear","tweets":[{"text":"You can just fix things","createdAt":"2026-10-06T00:11:36.000Z","url":"https://x.com/thenanyu/status/2107262460675891640","likes":36,"retweets":2,"replies":4}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"The most common mistake teams make is to treat evals as an additional QA step once the agent is built. AI products are fundamentally different. Your evals are your product spec.","createdAt":"2026-10-06T02:09:26.000Z","url":"https://x.com/realmadhuguru/status/2107292113214091355","likes":68,"retweets":4,"replies":23}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"if you're getting into game design, there are so many good resources out there to learn from!","createdAt":"2026-10-06T05:22:36.000Z","url":"https://x.com/trq212/status/2107340728380870868","likes":116,"retweets":4,"replies":6},{"text":"a big advantage of doing planning like this is that it’s a lot more token efficient compared to raw HTML- the model doesn’t need to remake the components or logic to do common things like state machines, diagrams, code snippets, etc.","createdAt":"2026-10-06T02:18:54.000Z","url":"https://x.com/trq212/status/2107294499282293017","likes":898,"retweets":29,"replies":58},{"text":"my favorite name for this pattern is \"local hands\", Claude runs in the cloud but can access your files locally- also coming to cowork","createdAt":"2026-10-05T22:00:33.000Z","url":"https://x.com/trq212/status/2107229483015258493","likes":828,"retweets":16,"replies":95}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"“Promote my app on tiktok”","createdAt":"2026-10-05T23:32:48.000Z","url":"https://x.com/amasad/status/2107252697162543255","likes":75,"retweets":6,"replies":13},{"text":"Really proud of how many family-run businesses are powered by Replit.","createdAt":"2026-10-05T21:34:21.000Z","url":"https://x.com/amasad/status/2107222889946898893","likes":111,"retweets":7,"replies":12},{"text":"The US is catching up on open-weights models.","createdAt":"2026-10-05T21:32:22.000Z","url":"https://x.com/amasad/status/2107222388429766970","likes":278,"retweets":20,"replies":29}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Introducing gdp-ts: Ghosts of Departed Proofs for TypeScript. gdp-ts is a library, linter and AI skill for safer API design. Under this contract, sensitive functions require 'proofs' that the caller performed an authorization check. The typechecker verifies these proofs at compile time, preventing your team and agents from shipping catastrophic security (and other kinds of) bugs. While these patterns have existed for quite some time, especially in ecosystems like Haskell, ① human code review and ② cognitive and syntactic overhead made these solutions niche. The situation is now inverted. Agents are writing more code than we can review, and they *thrive* in tight loops with hard constraints…","createdAt":"2026-10-05T14:44:46.000Z","url":"https://x.com/rauchg/status/2107119811444748555","likes":2176,"retweets":107,"replies":152}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"A decent amount of agent adoption and deployment is bottlenecked by being able to test, tune, and optimize agents on “real” work environments. The files agents need to access, the CRM environments, email, and more. It’s impossible to know how agents are performing if you don’t understand how well they’re executing on your evals and how they’ll perform in the future with a model change or workflow upgrade. Every enterprise has to do this 1 by 1 right now, which is obviously slow and tedious. Every enterprise is going to have someone managing evals, infrastructure for building and running evals and simulated environments, and more. Huge space.","createdAt":"2026-10-06T01:35:39.000Z","url":"https://x.com/levie/status/2107283615247999257","likes":143,"retweets":11,"replies":51}]},{"name":"Ryo Lu","handle":"ryolu_","bio":"Designed @Cursor_ai, @NotionHQ, @Stripe, built startups. I make a world where anyone can make software. Aspiring k-pop idol.","tweets":[{"text":"remembering Steve i grew up with beige boxes. then i moved to Canada and saw the iMac G4. how can computers be so beautiful? i couldn’t afford a Mac, so i made my PC look like one. changed the icons, the fonts, the windows. learned to make those shiny, lickable buttons. that’s how i got into interface design. i saw something i loved and wanted to make things like it. i burned DVDs of Steve’s keynotes and studied them. watched them again and again. there was so much care in the products, and so much joy in showing people what they could do. my first iPod was a black nano. i carried it everywhere. then the iPhone happened and changed the world. it felt like anything was possible. since he die…","createdAt":"2026-10-05T23:09:44.000Z","url":"https://x.com/ryolu_/status/2107246891977335049","likes":566,"retweets":27,"replies":27},{"text":"add ryOS Subtitles to Chrome","createdAt":"2026-10-05T16:31:41.000Z","url":"https://x.com/ryolu_/status/2107146721591726323","likes":25,"retweets":0,"replies":2},{"text":"made a lil thing for language learners: watch Netflix with subtitles in any two languages, plus pronunciation guides for Japanese, Chinese, and Korean. customizable styles, hand-picked defaults. enjoy 🍿","createdAt":"2026-10-05T16:31:19.000Z","url":"https://x.com/ryolu_/status/2107146629338042853","likes":798,"retweets":29,"replies":37}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"AGI Science Loops are coming, and there will be Muse/Instinct for those AGI Science Loops. Halmos is building that.","createdAt":"2026-10-05T18:18:47.000Z","url":"https://x.com/garrytan/status/2107173670699622830","likes":481,"retweets":33,"replies":27},{"text":"Harnesses from labs have an incentive to burn tokens, which means harnesses from startups have a real utility, like how Grep can automatically swap token burn into deterministic tested code that is repeatable just by observing agent use","createdAt":"2026-10-05T15:25:05.000Z","url":"https://x.com/garrytan/status/2107129959550685660","likes":512,"retweets":41,"replies":91},{"text":"We should have competence and good outcomes but we can’t do that without leadership and accountability High speed rail has been waylaid into a bulk transfer of taxpayer dollars into special interests with no good working outcome in sight","createdAt":"2026-10-05T15:17:04.000Z","url":"https://x.com/garrytan/status/2107127940635070905","likes":187,"retweets":8,"replies":21}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"The guy who thought he was too late to crypto investing","createdAt":"2026-10-05T18:52:18.000Z","url":"https://x.com/mattturck/status/2107182105201696858","likes":46,"retweets":2,"replies":5}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Make something people want, then make people want it. Harvard’17. GitHub: YouTube:","tweets":[{"text":"Cool!","createdAt":"2026-10-06T06:28:31.000Z","url":"https://x.com/zarazhangrui/status/2107357316844802298","likes":8,"retweets":0,"replies":1}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"","createdAt":"2026-10-05T22:35:52.000Z","url":"https://x.com/nikunj/status/2107238370669941082","likes":56,"retweets":0,"replies":4}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to 在采集和校正上下文时提供最佳体验，但后续价值必须能进入组织已有的自动化链路；因此，能否成为可信的上下文节点，比能否把用户时长锁在界面里更重要。","evidence":[{"quote":"At this point we're at peace with the fact that for a bunch of workflows, the best way to use Granola is to capture the context, then use it through your internal agent.","attribution":"Sam Stephenson，Granola 联合创始人，经 Peter Yang 转述","url":"https://x.com/petergyang/status/2106897211766530299"},{"quote":"in a year, i bet i'll still be interacting in this way with @ChatGPT—e.g. as an always-on persistent agent—but boo will have disappeared.","attribution":"Dan Shipper，Every CEO","url":"https://x.com/danshipper/status/2106892868564431255"}]},{"tag":"系统性能","title":"模型越快，Agent 体验越由模型之外的系统工程决定","body":"推理延迟下降后，编排、会话存取与状态持久化不再是可忽略的外围成本，而会直接主导用户感知。团队若只追逐更快模型，却不压缩 harness 的固定开销，端到端收益会迅速递减；性能竞争因此正在从单点模型指标转向整条执行链路。","evidence":[{"quote":"As models speed up (as with Astra 𝚞𝚕𝚝𝚛𝚊𝚏𝚊𝚜𝚝), harness overhead matters more and more.","attribution":"Guillermo Rauch，Vercel CEO","url":"https://x.com/rauchg/status/2106885457212825983"}]},{"tag":"工程经济","title":"Agent 正在改写编程语言的组织成本曲线","body":"过去技术选型必须在运行时优势与团队迁移、招聘和迭代速度之间折中；当 Agent 承担更多代码生产与维护，人类学习成本的权重会下降，底层性能与系统访问能力的权重会上升。这不会自动证明某种语言胜出，却意味着基于“人最容易写什么”的旧决策框架需要重算。","evidence":[{"quote":"The calculus has now changed. What's \"best for humans\" is no longer necessarily \"best for business\".","attribution":"Guillermo Rauch，Vercel CEO","url":"https://x.com/rauchg/status/2106863842450133114"}]},{"tag":"企业重构","title":"企业 AI 转型的最小单位不是岗位，而是整套组织设计","body":"给每个员工增加 Agent 只能加速既有流水线，无法释放持续运行、可规模复制的软件劳动力。真正的转型需要同时调整流程、人才地位、决策权和投资期限；如果工程能力仍是辅助部门、资本仍按短期退出安排，技术改造就很难触及企业的竞争方式。","evidence":[{"quote":"the right answer is to think about how do you start to reorganize what an organization should be to meet the opportunity of what's available to you with technology.","attribution":"Michael Lee，Sequence Holdings 联合创始人兼 CEO，No Priors","url":"https://www.youtube.com/watch?v=TCpRwJBQvW0"},{"quote":"How do we align the duration of capital with the sustained investment and operational commitments that are going to be required to drive the transformation end to end?","attribution":"Michael Lee，Sequence Holdings 联合创始人兼 CEO，No Priors","url":"https://www.youtube.com/watch?v=TCpRwJBQvW0"}]}],"matters":[{"kind":"产品质量","title":"低成本开发让“每日价值”取代发布本身成为产品验收线","detail":"Granola 联合创始人 Sam Stephenson 认为，多数人把第一版推出后就停止，团队还应追问用户是否真正获得每日价值。","url":"https://x.com/petergyang/status/2106825485624004691"},{"kind":"内容分层","title":"面向人的叙事与面向 Agent 的文档开始采用不同写法","detail":"Guillermo Rauch 手写供人阅读的 README，同时把内部文档写成供 Agent 消费的 AI English。","url":"https://x.com/rauchg/status/2106848085267902815"},{"kind":"人才结构","title":"Agent 部署正在创造实施岗位并重组既有技术角色","detail":"Aaron Levie 观察到，企业不仅招聘 AI 工程师和 FDE，也在把数据、研究与软件岗位转向 AI 部署工作。","url":"https://x.com/levie/status/2106893015063421357"},{"kind":"模型科学","title":"可解释性仍是理解“生长出来的模型”的关键缺口","detail":"Matt Turck 指出，外界仍低估模型并非按可完全理解的机制被构建，由此凸显更好可解释性工具的紧迫性。","url":"https://x.com/mattturck/status/2106821381765956044"},{"kind":"投资尽调","title":"线下办公现场仍能提供视频会议无法压缩的组织信号","detail":"Nikunj Kothari 认为，到创始团队办公室能观察协作方式、联合创始人互补关系和测试版产品，仅靠会议室里的同一份材料无法替代。","url":"https://x.com/nikunj/status/2106957269212742135"}],"sources":{"podcasts":[{"title":"Re-Founding Incumbents for the AI Era with Sequence Holdings Co-Founder and CEO Michael Lee","name":"No Priors","publishedAt":"2026-09-24T10:00:00.000Z","url":"https://www.youtube.com/watch?v=TCpRwJBQvW0","excerpts":["Every company on the planet has a celebrated persona. In a world where you believe that alpha comes from engineering and AI, you need to create a culture whereby the celebrated persona is the engineer, and that's what's required. You think about your typical investment in a fund, and you're typically trying to figure out how do we start to package to sell t…","Hi, listeners. Welcome back to No Priors. Today, I'm here with Michael Lee, cofounder and CEO of Sequence Holdings. They just announced the largest AI take private to date with the Dell family office of Baldwin for $7,700,000,000. We talk about this, the Sequence story, how AI transformation is actually going to permeate the economy and what transfers from…","So you started Sequence Holdings, which is a permanent holding company that works with management teams to buy and refound their businesses to be market leaders with AI. We should talk about that, and it's a very exciting model. But you also announced this big transaction in Baldwin. Tell us about it."]}],"blogs":[],"x":[{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Over the next 28 days, each day we’ll either ship one thing that is a clear improvement and relevant for most codex/work users or ship a full reset. Let the improvements begin.","createdAt":"2026-10-04T20:33:43.000Z","url":"https://x.com/thsottiaux/status/2106845241357824205","likes":20724,"retweets":1140,"replies":3210}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"I'm glad OpenAI is focusing on simplifying ChatGPT because it has become a mess (sorry). Here's a clip from my dots review about this. What I'd simplify: 1. Work vs. Codex 2. Spaces vs. Pages vs. Sites 3. The model and effort picker Probably alot more My hot take is that the whole Work launch was a mistake. Just like Claude folded Cowork back into Chat, I don't think Work needs its own brand. Anyway, excited to see my primary harness get much better. 📌 See my full dots review here:","createdAt":"2026-10-05T01:58:25.000Z","url":"https://x.com/petergyang/status/2106926956554195018","likes":67,"retweets":2,"replies":22},{"text":"I asked Sam, co-founder of @meetgranola, how he feels about people skipping his UI and instead just using the MCP to get the job done. Here's what he said: \"There's definitely a pang of sadness to that as a UI designer. We fought it for a while. We were like, no, we really need to keep everybody in the Granola UI for everything. But as soon as you become a big enough enterprise, it's inevitable you have all of this internal tooling. If Granola doesn't play nice with that internal tooling, then it's a non-starter. At this point we're at peace with the fact that for a bunch of workflows, the best way to use Granola is to capture the context, then use it through your internal agent.\" 📌 Watch…","createdAt":"2026-10-05T00:00:14.000Z","url":"https://x.com/petergyang/status/2106897211766530299","likes":77,"retweets":2,"replies":14},{"text":"\"The easier it gets to build stuff, the more it matters to really sweat the details and go the extra mile.\" From Sam, co-founder of @meetgranola: \"One, you've got to build something interesting. Two, [most people] get to version one and push it out the door. Instead, hold yourself accountable, not just to shipping something, but to answering: Does the person actually get daily value out of it?\" 📌 Watch the full episode here:","createdAt":"2026-10-04T19:15:13.000Z","url":"https://x.com/petergyang/status/2106825485624004691","likes":25,"retweets":0,"replies":7}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"It’s hard to fathom getting even faster, but it’s now… much faster 😂 As models speed up (as with Astra 𝚞𝚕𝚝𝚛𝚊𝚏𝚊𝚜𝚝), harness overhead matters more and more. Next release will feature even better performance for session storage and retrieval, and a big unlock for cloud durability in libfx.","createdAt":"2026-10-04T23:13:31.000Z","url":"https://x.com/rauchg/status/2106885457212825983","likes":202,"retweets":7,"replies":40},{"text":"DHH is fundamentally right about Rust. For context, Vercel has been undergoing a Rust-ification (carcinization, technically 🦀) for a while. One of the first projects we migrated was Turborepo, from Go to Rust¹. The migration completed, but the RoI was actually quite controversial internally. While Rust was in our eyes better for low-level OS access, something crucial for a build system like Turbo, the human migration costs were very sustantive. Go is very fast. It's beautifully designed. It's easy to iterate on. We were very conflicted about the migration, because it was *humans* writing the code, *even if we knew Rust was a better choice*. The calculus has now changed. What's \"best for hu…","createdAt":"2026-10-04T21:47:38.000Z","url":"https://x.com/rauchg/status/2106863842450133114","likes":1918,"retweets":87,"replies":118},{"text":"Working on a new little project. The 𝚁𝙴𝙰𝙳𝙼𝙴 is fully written by hand, because it's for human consumption. The documentation internals are AI English, because they're for agents. This little rule of thumb can make the world better. Blogs, tweets, READMEs: human communication. It's not even about \"em dashes\" or lack thereof. It's that it's the story-telling moment where you want to connect with other humans through their words.","createdAt":"2026-10-04T20:45:01.000Z","url":"https://x.com/rauchg/status/2106848085267902815","likes":993,"retweets":36,"replies":119}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"We’re already starting to see what kind of new jobs AI is creating. AI requires significant technical work and surrounding services to deploy into the economy. This means jobs for AI engineers that build applied AI products sold to (or within) enterprises, FDEs to deploy agents into companies, new services firms for deploying AI, and more. And even the published stats of new jobs undercount all the existing jobs that are transitioning to new areas of AI work in an enterprise. Many prior data, research, and software jobs large enterprises are also being repositioned for working with AI. Every bank, life sciences company, manufacturer, and even law firm is bringing on more technical talent -o…","createdAt":"2026-10-04T23:43:33.000Z","url":"https://x.com/levie/status/2106893015063421357","likes":565,"retweets":63,"replies":79},{"text":"This metric may tell us more about the business model of consumer AI than the state of AI. AI for consumers almost inevitably will be subsidized and monetized via commerce, ads, or purchases of devices and other services. This metric may level off lower than we think.","createdAt":"2026-10-04T17:45:38.000Z","url":"https://x.com/levie/status/2106802940879192260","likes":259,"retweets":22,"replies":55}]},{"name":"Ryo Lu","handle":"ryolu_","bio":"Designed @Cursor_ai, @NotionHQ, @Stripe, built startups. I make a world where anyone can make software. Aspiring k-pop idol.","tweets":[{"text":"a bit more work later… full bleed desktop + side dock lil computer in your pocket","createdAt":"2026-10-04T16:05:00.000Z","url":"https://x.com/ryolu_/status/2106777615801713054","likes":399,"retweets":10,"replies":10}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"When everyone is building the same primitives it does speak to needs that will only intensify from here And we will eventually converge on the correct OS","createdAt":"2026-10-05T00:15:43.000Z","url":"https://x.com/garrytan/status/2106901111106097210","likes":310,"retweets":15,"replies":51}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"Still one aspect of AI that's most poorly understood outside AI circles... \"models are grown, not built\" and we don't *really* know how they work. Hence the urgent need for better interpretability -- @eric_ho @GoodfireAI","createdAt":"2026-10-04T18:58:54.000Z","url":"https://x.com/mattturck/status/2106821381765956044","likes":5,"retweets":1,"replies":4}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Make something people want, then make people want it. Harvard’17. GitHub: YouTube:","tweets":[{"text":"The way Opus 5.5 just silently goes off to make something for 20+ minutes and comes back with a complete masterpiece","createdAt":"2026-10-04T22:39:36.000Z","url":"https://x.com/zarazhangrui/status/2106876921082712250","likes":511,"retweets":9,"replies":42},{"text":"X profiles are replacing resumes","createdAt":"2026-10-04T16:23:22.000Z","url":"https://x.com/zarazhangrui/status/2106782239493427588","likes":151,"retweets":4,"replies":18},{"text":"Currently reading","createdAt":"2026-10-04T16:10:43.000Z","url":"https://x.com/zarazhangrui/status/2106779057220378725","likes":112,"retweets":1,"replies":13}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"Maybe I’m just old school, but I just can’t believe how people make investments over a Zoom call.. and sometimes by just meeting the CEO. There’s so much alpha in meeting founders at their own office. Besides “vibes”, you get to see what the energy of the office is like, how the coworkers react and work with each other, how the cofounders answer and complement each other, what the beta product releases look like, how they collaborate etc etc. Yes, I get it there’s time pressure, and you often have to move fast. But even then I always ask to meet at offices for final meetings and founders often tell me I’m the only one that has ever asked. What’s the point of calling them into your own confe…","createdAt":"2026-10-05T03:58:53.000Z","url":"https://x.com/nikunj/status/2106957269212742135","likes":104,"retweets":0,"replies":19}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. Came back from retirement to mess with AI and help a lobster take over the world. @OpenClaw🦞 + @OpenAI","tweets":[{"text":"bug fixes & performance improvements","createdAt":"2026-10-04T17:20:16.000Z","url":"https://x.com/steipete/status/2106796559400882209","likes":484,"retweets":6,"replies":26}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"dot has become my primary interface to AI over the last few weeks. my dot's name is boo. he's cute! in a year, i bet i'll still be interacting in this way with @ChatGPT—e.g. as an always-on persistent agent—but boo will have disappeared. it reminds me a lot of early OpenClaw days—we loved the little personality quirks of our Claws, but we dropped them as soon as there was something functionally more powerful available","createdAt":"2026-10-04T23:42:58.000Z","url":"https://x.com/danshipper/status/2106892868564431255","likes":114,"retweets":4,"replies":21}]}]},"errors":[],"partial":false},{"date":"2026-10-05","dateLabel":"2026年10月05日","generatedAt":"2026-10-05T00:00:00+08:00","sourceGeneratedAt":"2026-10-04T08:22:04.655Z","stats":{"podcastEpisodes":1,"xBuilders":13,"totalTweets":25,"blogPosts":1},"highlights":[{"tag":"产品门槛","title":"AI 普及的下一道门槛不是能力，而是让复杂性退出用户界面","body":"模型、权限与连接器越丰富，产品越容易把技术栈的复杂度转嫁给用户，反而压低真实使用深度。下一阶段的领先者会把选择与编排留在系统内部，让用户只表达目标；这意味着产品团队的核心工作将从继续增加控制项，转向删减决策、建立可靠默认值，并让高级能力按需显现。","evidence":[{"quote":"AI adoption is largely a product problem today. Even among the 2% that are paying for AI today, the depth of usage is shallow. The main reason : most AI products look like airplane cockpits with 100 levers - connectors, permissions, model selection, token usage etc.","attribution":"Madhu Guru，Meta AI 高级总监","url":"https://x.com/realmadhuguru/status/2106450089938157720"},{"quote":"Only things being worked on are simplifications, more efficiency for more usage, groundbreaking features or new models. Sometimes you have to invest ahead of the curve, but feedback is clear that you all want things to get simpler.","attribution":"Thibault Sottiaux，OpenAI Codex 与 ChatGPT","url":"https://x.com/thsottiaux/status/2106610099720720811"}]},{"tag":"Agent 落地","title":"Agent 从聊天走向生产，真正要重做的是工作流的责任边界","body":"把 Agent 接入现有流程并不会自然产生自动化，因为原流程默认由人补足上下文、判断异常并承担责任。产品只有同时重构数据流、审批点与结果归责，才能把自治能力变成可持续的生产方式；统一入口能减少模式切换，但组织仍需明确哪些动作可默认执行、哪些节点必须由人接管。","evidence":[{"quote":"The reason for this is that most of the workflows still need to reengineered to work with agents. This isn’t the same as deploying a chat system for better research efficiency, but instead requires workflows to be rebuilt, data to be wired up in new ways, new practices for accountability and liability of decisions when agents are in the mix, governance and compliance paradigm changes, security upgrades, and more.","attribution":"Aaron Levie，Box CEO","url":"https://x.com/levie/status/2106583814709633413"},{"quote":"We built Cowork as a separate place for bigger work, and Design for visual work. People used both, and told us the frustrating part was deciding where a task belonged. What they’d started in one also didn’t carry into the other. So we stopped making you choose.","attribution":"Claude 官方博客","url":"https://claude.com/blog/cowork-is-now-claude"}]},{"tag":"创作判断","title":"当 AI 把制作成本压低，产品差异反而更依赖不可外包的判断","body":"生成速度让团队更容易复刻市场语言、视觉与功能，也会加速产品向平均值收敛。真正稀缺的不再是把方案做出来，而是决定什么值得存在、希望用户感受到什么，以及哪些细节必须保留；如果团队不先形成自身立场，AI 只会更高效地复制已经被验证的同一种答案。","evidence":[{"quote":"ai makes this loop frictionless. it can draw from more references than we could see in a lifetime. but access to every perspective isn’t the same as having one.","attribution":"Ryo Lu，前 Cursor、Notion、Stripe 设计师","url":"https://x.com/ryolu_/status/2106337039201505453"}]},{"tag":"基础设施","title":"企业 AI 的长期资产可能从数据仓库迁移到持续学习的模型权重","body":"如果组织经验不断通过 Agent 的执行与反馈进入专属模型，基础设施就不只是算力采购，而是承载企业知识积累的系统。规模扩大后，数据、训练与推理能否形成闭环会影响知识沉淀效率；因此企业对 AI 栈的控制需求，可能从访问通用模型进一步延伸到管理自身数据与权重。","evidence":[{"quote":"over time I think all of these organizations' IP will be distilled in models, it will be weights and they don't necessarily need to build the base model","attribution":"Renen Hallak，VAST Data 创始人兼 CEO，MAD Podcast","url":"https://www.youtube.com/watch?v=awoR908Yu5Y"}]}],"matters":[{"kind":"个人 Agent","title":"OpenAI 的 dot 被用于主动完成收件箱清零","detail":"Thibault Sottiaux 把 inbox zero 设为 dot 的主动目标，并称自己首次实现了收件箱清零。","url":"https://x.com/thsottiaux/status/2106602729875685780"},{"kind":"商业接口","title":"个人 Agent 正在迫使平台重新考虑交易入口","detail":"Nikunj Kothari 对比称，Amazon 仍需保护广告业务与品牌，而 DoorDash 正通过 CLI 逐步开放文本下单。","url":"https://x.com/nikunj/status/2106488814940414455"},{"kind":"专业服务","title":"AI 同时扩展专业能力的可及性与服务时长","detail":"Aditya Agarwal 指出，顶尖医生等专业人士的时间无法靠财富无限购买，而 AI 能同时降低接触门槛并增加每个人可获得的服务时间。","url":"https://x.com/adityaag/status/2106503075209044336"},{"kind":"模型安全","title":"把判断权让渡给模型被明确视为安全问题","detail":"Sam Altman 表示，他对人们赋予 AI 模型宗教性力量或放弃人类判断感到不安，并认为这是现实的安全风险。","url":"https://x.com/sama/status/2106388373221118198"},{"kind":"分发摩擦","title":"OpenClaw Android 应用陷入一周以上审核停滞","detail":"Peter Steinberger 公开求助 Google 内部联系人，称 OpenClaw 的 Android 应用已在审核中停滞超过一周。","url":"https://x.com/steipete/status/2106446147791597774"}],"sources":{"podcasts":[{"title":"Who Feeds the GPUs? Inside AI's Hidden $30B Layer | Renen Hallak, VAST Data","name":"The MAD Podcast with Matt Turck","publishedAt":"2026-09-24T11:30:00.000Z","url":"https://www.youtube.com/watch?v=awoR908Yu5Y","excerpts":["Sometimes it scares me. We had a customer, one of these AI clouds, they said we're probably going to need about 500 petabytes over the next three years. Last week, came back to us and said, we're gonna need an extra two exabytes on top of that 500 petabytes. I think in the next ten years, we'll see more difference than we did in the last thousand years.","Hi. I'm Matt Turk. Welcome to the MAD podcast. We talk a lot about AI models on this show, and we talk a lot about compute. But today is about the layer in between, the crucial software infrastructure layer that feeds massive amounts of data to all those GPUs.","My guest today is Renan Halleck, founder and CEO of VAST Data, a company that is surprisingly under the radar considering it's been most recently valued at $30,000,000,000 and powers top AI players like xAI and some rns, with some likely a small percentage of developers deploying background agents working on projects in parallel, and the rest of everyone else still working with agents 1:1. Then, there’s the entire rest of knowledge work where real agentic adoption is still very early. The reason for this is that most of the workflows still need to reengineered to work with agents. This isn’t the same as deploying a chat system for better research efficiency, but instead requires workflows to b…","createdAt":"2026-10-04T03:14:54.000Z","url":"https://x.com/levie/status/2106583814709633413","likes":187,"retweets":15,"replies":63}]},{"name":"Ryo Lu","handle":"ryolu_","bio":"Designed @Cursor_ai, @NotionHQ, @Stripe, built startups. I make a world where anyone can make software. Aspiring k-pop idol.","tweets":[{"text":"","createdAt":"2026-10-03T11:18:17.000Z","url":"https://x.com/ryolu_/status/2106343073127256507","likes":124,"retweets":5,"replies":2},{"text":"convergence to the mean when everyone looks at everyone else to decide what to make, we eventually stop making anything of our own. we copy what works. borrow the language, the aesthetic, the features. we call it learning from the market, following best practices, staying competitive. together, everything starts to feel familiar. polished, interchangeable. nothing wrong. nothing alive. the mean isn’t necessarily bad. it’s where everything lands when we remove the reasons for it to be different. numbers are easier to compare than feelings, so we make things that produce numbers. we study what gets attention, then shape ourselves around it. eventually the feedback stops informing the work and…","createdAt":"2026-10-03T10:54:18.000Z","url":"https://x.com/ryolu_/status/2106337039201505453","likes":1776,"retweets":224,"replies":94}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Make something people want, then make people want it. Harvard’17. GitHub: YouTube:","tweets":[{"text":"How will the world change if coding age     }
    function renderEvidence(evidence) {
      if (typeof evidence === 'string') return '<blockquote>' + esc(evidence) + '</blockquote>';
      const attribution = evidence.attribution ? '<div class="small">— ' + esc(evidence.attribution) + (evidence.url ? ' · ' + link(evidence.url, '查看原文') : '') + '</div>' : '';
      return '<blockquote>' + esc(evidence.quote || '') + attribution + '</blockquote>';
    }
    function renderHighlights(d) {
      const cards = (d.highlights || []).map(item => '<article class="card"><div class="tag">' + esc(item.tag) + '</div><h3>' + esc(item.title) + '</h3><p>' + esc(item.body) + '</p>' + ((item.evidence || []).length ? '<details><summary>查看原文依据</summary>' + item.evidence.map(renderEvidence).join('') + '</details>' : '') + '</article>').join('');
      return '<section><h2>洞察<span class="section-note">INSIGHTS / 经过判断的关键信号</span></h2><div class="grid">' + (cards || '<p class="empty">今天没有足够内容生成洞察。</p>') + '</div></section>';
    }
    function renderMatters(d) {
      const cards = (d.matters || []).map(item => '<article class="card"><div class="tag">' + esc(item.kind) + '</div><h3>' + link(item.url, item.title) + '</h3><p>' + esc(item.detail) + '</p></article>').join('');
      return '<section><h2>议题<span class="section-note">MATTERS / 值得继续追踪</span></h2><div class="grid">' + (cards || '<p class="empty">今天没有额外议题。</p>') + '</div></section>';
    }
    function renderSources(d) {
      const archive = d.archiveUrl ? '<p class="archive-link">' + link(d.archiveUrl, '查看当日完整存档 ↗') + '</p>' : '';
      const xGroups = ((d.sources || {}).x || []).map(builder => '<div class="source-group"><h3>' + esc(builder.name) + ' <span class="small">@' + esc(builder.handle) + '</span></h3><p class="small">' + esc(builder.bio) + '</p>' + (builder.tweets || []).map(tweet => '<p class="tweet">' + esc(tweet.text) + '<br>' + link(tweet.url, '原文') + ' <span class="small">likes ' + esc(tweet.likes) + ' · reposts ' + esc(tweet.retweets) + '</span></p>').join('') + '</div>').join('');
      const podcastGroups = ((d.sources || {}).podcasts || []).map(podcast => '<div class="source-group"><h3>' + link(podcast.url, podcast.title) + '</h3>' + (podcast.excerpts || []).map(e => '<blockquote>' + esc(e) + '</blockquote>').join('') + '</div>').join('');
      const blogGroups = ((d.sources || {}).blogs || []).map(blog => '<div class="source-group"><h3>' + link(blog.url, blog.title) + '</h3><p class="small">' + esc(blog.source || '') + '</p><p>' + esc(blog.summary || '') + '</p></div>').join('');
      return '<section><h2>原文<span class="section-note">SOURCES / 完整证据索引</span></h2>' + archive + '<div class="sources">' + podcastGroups + blogGroups + xGroups + '</div></section>';
    }
    function render() {
      const d = DIGESTS.find(item => item.date === selectedDate) || DIGESTS[0];
      if (!d) {
        document.getElementById('content').innerHTML = '<p class="empty">还没有 digest 数据。</p>';
        return;
      }
      selectedDate = d.date;
      renderDates();
      renderStats(d);
      document.getElementById('content').innerHTML = renderHighlights(d) + renderMatters(d) + renderSources(d);
    }
    render();
  </script>
</body>
</html>
