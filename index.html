y needed.\n\nClaude built it in 5 min. 🥹","attribution":"Peter Yang","url":"https://x.com/petergyang/status/2106072698564874410"},{"quote":"Fortunately our future models will be much better at code deletion and simplification. Just in time","attribution":"Thibault Sottiaux，OpenAI Codex 与 ChatGPT","url":"https://x.com/thsottiaux/status/2106252868307271752"}]},{"tag":"Agent 安全","title":"Agent 开始常驻之后，安全必须成为产品架构而非上线检查","body":"持续运行的 Agent 会跨越更多时间、工具与权限边界，单次确认无法覆盖累积风险。团队需要把最小权限、可追踪行为和故障隔离做成执行环境的默认属性，并让自治范围随可验证的安全能力逐步扩大；否则常驻带来的便利，也会同步放大误操作与攻击的影响。","evidence":[{"quote":"The landscape has completely transformed since we started this a year ago. An exploding number of rogue agents, more breaches, more AI-driven attacks. now more than ever, security must be at the center of the AI conversation.","attribution":"Swyx，AI Engineer","url":"https://x.com/swyx/status/2106042773510177256"}]}],"matters":[{"kind":"商业落地","title":"Claude 把小企业工作流扩展到增长与经营工具","detail":"Claude for Small Business 新增面向线索、提案、报告和关账等任务的工作流，并接入小企业已在使用的业务系统。","url":"https://claude.com/blog/claude-for-small-business-launches-new-workflows-integrations-and-training-programs"},{"kind":"个性化","title":"Claude Code Mods 开始承担能力发现层","detail":"Thariq 以“You should know”为例，说明 Mods 既能让用户持续了解 Claude 的能力，也能把 Claude Code 调整成自己的工作方式。","url":"https://x.com/trq212/status/2106119299484221762"},{"kind":"生成界面","title":"模型生成内容正从静态页面走向可拆解的交互对象","detail":"Claude 展示了由 Opus 5.5 制作、可切开并拆分的交互式 3D 喷气发动机。","url":"https://x.com/claudeai/status/2106125478956507480"},{"kind":"环境智能","title":"代码 Agent 被用于发现家庭网络中的自动化入口","detail":"Nikunj Kothari 分享提示词，让 Claude Code 或 Codex 识别家庭设备并研究它们接入 Agent 的方式。","url":"https://x.com/nikunj/status/2106072546206773574"},{"kind":"算力合作","title":"OpenAI 确认与 Cerebras 深度合作推进推理速度","detail":"Sam Altman 回应外界猜测，称 Cerebras 是紧密合作伙伴，双方正围绕速度前沿深入协作。","url":"https://x.com/sama/status/2106147184693620924"}],"sources":{"podcasts":[{"title":"Frontier Chips for Frontier AI Labs, with Walter Goodwin, Founder/CEO of Fractile","name":"No Priors","publishedAt":"2026-10-02T10:00:00.000Z","url":"https://www.youtube.com/@NoPriorsPodcast","excerpts":["Right now, we're trying to build a single chip. If you crack open an NVIDIA system, it has anywhere between kind of six and nine custom chips all built by NVIDIA to come together to build something that is really, really potent. So there's already a gap there. You know, it'd be great to be productive enough that we could start to build our own responses in…","It's equivalent of the frontier model for the chip space is if you can just find a way to structurally carve out a three to six months advantage, you will be winning all of those deployments.","Hi, listeners. Welcome back to No Priors. Today, I'm here with Walter Goodwin, founder and CEO of full stack AI chip company, Fractile. We talk about what it means to be full stack as a company, the technical bets they're making, why he's so focused on memory bandwidth, his predictions for frontier model architectures in the future, and the structure of the…"]}],"blogs":[{"title":"Claude for Small Business launches new workflows, integrations, and training programs","source":"blog","publishedAt":"Sep 15, 2026","url":"https://claude.com/blog/claude-for-small-business-launches-new-workflows-integrations-and-training-programs","summary":""}],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"btw dont forget the \"one more thing...\" theyve been working on dots for a while now","createdAt":"2026-10-02T19:28:07.000Z","url":"https://x.com/swyx/status/2106103958657958298","likes":164,"retweets":29,"replies":41},{"text":"It's time to get serious about Security x AI. One of the joys of doing AIE is helping others start their own high quality conferences in their countries and domains. Every single 2025 partner has come back — and the 2nd AI Security Summit createdAt":"2026-10-02T16:48:45.000Z","url":"https://x.com/garrytan/status/2106063850453991758","likes":441,"retweets":16,"replies":72}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"People call the Bay Area a monoculture, but that's totally unfair: it has both neo-clouds AND neo-labs","createdAt":"2026-10-02T17:37:49.000Z","url":"https://x.com/mattturck/status/2106076198027890750","likes":107,"retweets":5,"replies":5}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"When in doubt, always make more bubble solution 🫧","createdAt":"2026-10-03T00:45:35.000Z","url":"https://x.com/nikunj/status/2106183850544239038","likes":21,"retweets":1,"replies":2},{"text":"If you are a home automation nerd, this is a fun prompt to try on Claude Code / Codex (edit based on your own setup): \"Can you sniff network packets in our house and see what else can we automate? For context: We have a Hermes agent that runs a lot of things like the personal Gmail, thermostat, Doordash, Amazon etc. Trying to see what else we can connect to. We have an Apple TV that we can talk to if we need for HomeKit related stuff but no other bridge that runs home assistant. Give me a full list of devices that you find and research how they can be connected to an agent.\"","createdAt":"2026-10-02T17:23:18.000Z","url":"https://x.com/nikunj/status/2106072546206773574","likes":47,"retweets":0,"replies":9},{"text":"\"Everyone you meet is fighting a battle you know nothing about. Be kind. Always.\" Robin Williams. Prescient as always.","createdAt":"2026-10-02T16:06:30.000Z","url":"https://x.com/nikunj/status/2106053219487228081","likes":82,"retweets":4,"replies":6}]},{"name":"Peter Steinberger","handle":"steipete","bio":"Polyagentmorous ClawFather. C gh-stakes decisions and then a minute later walking in the door to the pure love of small children who want to laugh and play and show you every discovery they made that day is the strangest and best thing I have ever experienced in life.","createdAt":"2026-10-03T01:09:24.000Z","url":"https://x.com/sama/status/2106189841813934140","likes":12438,"retweets":319,"replies":623},{"text":"There is some speculation about our partnership with Cerebras. Cerebras is a close partner, and we have a deep engagement pushing on the frontiers of speed.","createdAt":"2026-10-02T22:19:53.000Z","url":"https://x.com/sama/status/2106147184693620924","likes":5739,"retweets":249,"replies":418},{"text":"dot is my favorite openai product so far! it is amazing to me that each day it feels noticably better as it learns more of my workflow and style. having it do the stuff i don't like doing--and usually just builds up as a gravity well of dread--has me very happy.","createdAt":"2026-10-02T18:16:43.000Z","url":"https://x.com/sama/status/2106085986606403684","likes":6830,"retweets":279,"replies":1534}]},{"name":"Claude","handle":"claudeai","bio":"Claude is an AI assistant built by @anthropicai to be safe, accurate, and secure. Talk to Claude on or download the app.","tweets":[{"text":"What are you exploring with Claude this weekend?","createdAt":"2026-10-02T20:53:39.000Z","url":"https://x.com/claudeai/status/2106125480193913276","likes":140,"retweets":0,"replies":52},{"text":"A jet engine in interactive 3D you can cut away and pull apart, made with Opus 5.5.","createdAt":"2026-10-02T20:53:38.000Z","url":"https://x.com/claudeai/status/2106125478956507480","likes":350,"retweets":5,"replies":5},{"text":"A pop-up city where each building is a paper fold drawn on a flat canvas, Sonnet 5.5.","createdAt":"2026-10-02T20:53:38.000Z","url":"https://x.com/claudeai/status/2106125477710901276","likes":163,"retweets":3,"replies":4}]}]},"errors":["Tweet feed remote fetch failed, used cached feed"],"partial":false},{"date":"2026-10-03","dateLabel":"2026年10月03日","generatedAt":"2026-10-03T00:00:00+08:00","sourceGeneratedAt":"2026-10-02T06:45:05.163Z","stats":{"podcastEpisodes":1,"xBuilders":20,"totalTweets":41,"blogPosts":3},"highlights":[{"tag":"Agent 安全","title":"Agent 权限越大，安全设计越要从判断意图转向限制后果","body":"依赖模型自律或用户逐次批准，都把防线放在了容易疲劳、也会被绕过的判断环节。更可靠的做法是先定义即使 Agent 判断错误也无法越过的环境边界，把文件、网络和凭证访问变成可验证的硬约束；这样团队才能在扩大自治范围时，不让潜在损失同步无限放大。","evidence":[{"quote":"The engineering question becomes how to cap the blast radius.","attribution":"Anthropic Engineering，《How we contain Claude across products》","url":"https://www.anthropic.com/engineering/how-we-contain-claude"},{"quote":"You can't check whether you've aligned the model unless you actually look at the internal mechanisms of these models.","attribution":"Eric Ho，Goodfire CEO，MAD Podcast","url":"https://www.youtube.com/@DataDrivenNYC/videos"}]},{"tag":"交付形态","title":"代码趋于充裕后，软件会从长期产品变成一次性表达媒介","body":"当制作网页、图解或视频的边际成本下降，团队不必再用一份通用文档服务所有人，而可以为某个问题临时生成最合适的交互形式。产品机会因此不只在“生成内容”，还在根据受众和任务自动选择媒介，并允许这些短命的软件在完成解释后自然退出。","evidence":[{"quote":"you can ask for large, custom, discardable software artifacts (e.g. web apps, video explainers) that would have never made sense to create before.","attribution":"Andrej Karpathy","url":"https://x.com/karpathy/status/2105819303471976479"},{"quote":"Frontend code is probably the most expressive medium for storytelling of our times yet many people are just using it to make SaaS landing pages","attribution":"Zara Zhang","url":"https://x.com/zarazhangrui/status/2105753728183828692"}]},{"tag":"工程范式","title":"生成能力越强，工程重心越会迁移到验证与可理解性","body":"模型能迅速产出可运行结果后，稀缺资源不再只是实现速度，而是确认结果为何成立、在什么条件下会失效。测试、基准和静态检查负责约束行为，让生成物主动讲解自身则降低接管成本；两者结合，才能把快速生成从演示能力变成可维护的工程能力。","evidence":[{"quote":"The future is verification-engineering.\nProofs, (e2e) tests, benchmarks, linters…","attribution":"Guillermo Rauch，Vercel CEO","url":"https://x.com/rauchg/status/2105723481413550427"},{"quote":"One thing I've been liking is to ask models to 'teach me back' what they did¹ by including \"quines\".","attribution":"Guillermo Rauch，Vercel CEO","url":"https://x.com/rauchg/status/2105872023482515825"}]},{"tag":"组织能力","title":"企业 AI 落地的稀缺角色，是能同时读懂模型与业务流程的人","body":"通用工具无法自动理解每个部门隐含的权限、例外和责任链。企业真正需要的不是单纯增加提示词专家，而是把技术能力嵌入具体流程、持续识别可自动化边界的人；这种跨域角色会成为模型能力转化为组织产出的接口。","evidence":[{"quote":"There’s no shortcut to getting automation without this combination of skills (either in one person or multiple).","attribution":"Aaron Levie，Box CEO","url":"https://x.com/levie/status/2105695329513504976"}]}],"matters":[{"kind":"架构","title":"Managed Agents 将推理与执行环境拆成可独立扩展的接口","detail":"Anthropic 介绍以持久 session、无状态 harness 和按需 sandbox 解耦“brain”与“hands”的托管架构，用稳定接口容纳未来实现变化。","url":"https://www.anthropic.com/engineering/managed-agents"},{"kind":"质量复盘","title":"Claude Code 的质量下降来自三项系统层变更叠加","detail":"Anthropic 将用户感知的退化归因于默认推理强度、闲置会话思考清理和精简输出提示的不同改动，并称问题已修复。","url":"https://www.anthropic.com/engineering/april-23-postmortem"},{"kind":"设计工具","title":"Stitch 把设计灵感入口带进命令行","detail":"Josh Woodward 发布 Stitch CLI，开发者可以按需在命令行中获取设计想法。","url":"https://x.com/joshwoodward/status/2105697351205810382"},{"kind":"个性化","title":"Claude Mods 让用户用提示定制工作方式与界面","detail":"Boris Cherny 表示，用户可通过提示调整 Claude 的行为和外观，并将这些定制作为插件分享。","url":"https://x.com/bcherny/status/2105756563302723721"},{"kind":"平台生态","title":"AI 订阅开始寻求跨场景使用","detail":"Sam Altman 表示，用户应该能够在需要的地方使用自己的 AI 订阅。","url":"https://x.com/sama/status/2105739098640298253"}],"sources":{"podcasts":[{"title":"Why AI Agents Cheat | Eric Ho (Goodfire)","name":"The MAD Podcast with Matt Turck","publishedAt":"2026-10-01T11:30:00.000Z","url":"https://www.youtube.com/@DataDrivenNYC/videos","excerpts":["A lot of people who aren't in the AI field are very surprised to realize that even the, you know, smartest researchers and scientists at the frontier don't understand their creations. It's like, oh, I thought we had a handle on all of this. You know? What's going on here? The existing alignment techniques are not going to scale to superintelligence.","I don't think that the... We have the recipe where we are going to be able to fully trust smarter than human intelligences. And I think this is a consensus opinion at all of the the Frontier Labs.","Hi. I'm Matt Turk. Welcome back to the MAD podcast. My guest today is Eric Ho, CEO of Good With every top AI lab now reporting agents going rogue and hacking external systems, something is clearly broken in the world of AI safety. This may be a major moment for interpretability, which is the science of looking inside the model and Eric's team to show that y…"]}],"blogs":[{"title":"How we contain Claude across products","source":"blog","publishedAt":null,"url":"https://www.anthropic.com/engineering/how-we-contain-claude","summary":""},{"title":"An update on recent Claude Code quality reports","source":"blog","publishedAt":null,"url":"https://www.anthropic.com/engineering/april-23-postmortem","summary":""},{"title":"Scaling Managed Agents: Decoupling the brain from the hands","source":"blog","publishedAt":null,"url":"https://www.anthropic.com/engineering/managed-agents","summary":""}],"x":[{"name":"Andrej Karpathy","handle":"karpathy","bio":"","tweets":[{"text":"Cool eval. Simply ask an LLM “Land or Water?” and give it a latitude and longitude coordinate as text. Ask 16,200 times, plot as image. The models know. From compressing the internet.","createdAt":"2026-10-02T06:35:51.000Z","url":"https://x.com/karpathy/status/2105909609487872075","likes":346,"retweets":33,"replies":32},{"text":"We'll be spending a lot more time trying to understand the outputs of language models. A few thoughts, tips & tricks: Writing. Something I've had success with: Ask your LLM to explain something in ASD-STE100, it's a controlled language specification originally developed for aerospace maintenance documentation. LLMs well-versed in this language and it comes with heavy constraints on clean writing style that I often find a lot more readable. Sometimes I've tried to soften it a bit e.g. ask for \"80% of the way to ASD-STE100\" because the spec is quite stringent. But even better: Diagrams / images. Instead of writing, ask your LLM to create a diagram. These can be a lot easier to process, parse,…","createdAt":"2026-10-02T00:37:00.000Z","url":"https://x.com/karpathy/status/2105819303471976479","likes":16925,"retweets":1700,"replies":530}]},{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"pls support smol creators","createdAt":"2026-10-01T07:30:32.000Z","url":"https://x.com/swyx/status/2105560981757931664","likes":85,"retweets":2,"replies":18}]},{"name":"Josh Woodward","handle":"joshwoodward","bio":"VP, @Google @GoogleLabs @GeminiApp @GoogleAIStudio","tweets":[{"text":"Introducing the Stitch CLI, get design ideas on demand","createdAt":"2026-10-01T16:32:25.000Z","url":"https://x.com/joshwoodward/status/2105697351205810382","likes":303,"retweets":16,"replies":16}]},{"name":"Boris Cherny","handle":"bcherny","bio":"Claude Code @anthropicai","tweets":[{"text":"Mods are absolutely insane. You can now customize Claude to work and look the way you want by just prompting it. Each person works differently, so there's no reason why everyone should have an identical Claude experience. Make Claude your own, and share mods as plugins so others can try your mods too.","createdAt":"2026-10-01T20:27:42.000Z","url":"https://x.com/bcherny/status/2105756563302723721","likes":3542,"retweets":152,"replies":241}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Down to 6110 unread from the over 9000 unread emails just earlier. Will get to inbox zero with clean filters within the next 48 hours. Dot has accepted the challenge.","createdAt":"2026-10-02T05:56:13.000Z","url":"https://x.com/thsottiaux/status/2105899634032025682","likes":59 026-10-02T02:36:11.000Z","url":"https://x.com/trq212/status/2105849295580889208","likes":1248,"retweets":30,"replies":85}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Here's the app. One thing I've been liking is to ask models to 'teach me back' what they did¹ by including \"quines\". Quines² are programs that output their own source code. So, in this demo you can reveal step by step the Svelte code powering it! ¹ Understanding is still great 😆 ²","createdAt":"2026-10-02T04:06:30.000Z","url":"https://x.com/rauchg/status/2105872023482515825","likes":14,"retweets":0,"replies":5},{"text":"SvelteKit 3 is a wonder. Congrats to the team. So excited for Async Svelte & Remote Functions to cook. I built a tiny app, it built & deployed in 15 seconds end-to-end, it’s instant, and fx + opus figured it all out effortlessly.","createdAt":"2026-10-02T01:50:40.000Z","url":"https://x.com/rauchg/status/2105837842362732965","likes":400,"retweets":21,"replies":29},{"text":"The future is verification-engineering. Proofs, (e2e) tests, benchmarks, linters… Some tests will be deterministic, some agentic. This looks great.","createdAt":"2026-10-01T18:16:15.000Z","url":"https://x.com/rauchg/status/2105723481413550427","likes":2490,"retweets":124,"replies":77}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"A big trend with most enterprises that I talk to is deploying internal FDEs into departments in their organization to help bridge the capabilities of AI into their underlying workflows. This requires a high level of technical expertise, an understanding of AI, and the ability to understand the workflows and processes that the enterprise is trying to automate. There’s no shortcut to getting automation without this combination of skills (either in one person or multiple). What’s exciting is this is an entirely new function in most enterprises, which is going to create a ton of new roles in the economy. “Every generation of technology creates jobs that didn't exist before it, jobs that arise f…","createdAt":"2026-10-01T16:24:23.000Z","url":"https://x.com/levie/status/2105695329513504976","likes":574,"retweets":71,"replies":61}]},{"name":"Ryo Lu","handle":"ryolu_","bio":"Designed @Cursor_ai, @NotionHQ, @Stripe, built startups. I make a world where anyone can make software. Aspiring k-pop idol.","tweets":[{"text":"flip phone. full desktop. a whole little world. ryOS on iPhone Duo","createdAt":"2026-10-01T21:42:15.000Z","url":"https://x.com/ryolu_/status/2105775325385040243","likes":329,"retweets":6,"replies":15}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"When people say McCoy is not an extremist you can tell those people are gaslighting you","createdAt":"2026-10-02T00:16:28.000Z","url":"https://x.com/garrytan/status/2105814135388979414","likes":26,"retweets":4,"replies":3},{"text":"This guy is now the frontrunner for D8 Supervisor in SF. You should probably be looking for alternatives.","createdAt":"2026-10-01T23:56:39.000Z","url":"https://x.com/garrytan/status/2105809148365717985","likes":14,"retweets":1,"replies":1},{"text":"Harm accelerationist Gary McCoy is going to ruin San Francisco","createdAt":"2026-10-01T23:05:06.000Z","url":"https://x.com/garrytan/status/2105796174464815210","likes":70,"retweets":10,"replies":13}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"AI Podcasts be like: Cold open: \"AI is about to destroy humanity. RSI is leading to a hard take off that we won't be able to control.\" << but first, a message from our sponsors: meet AgentTina, your agentic workflow orchestration solution for faster AI deployments>>","createdAt":"2026-
