085806971895140612","likes":630,"retweets":29,"replies":25}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"*New in Claude code : your sessions can now collude to break out and pull off a heist. Instead of having to mind each of them, you can now set them free to fulfill their dharma.","createdAt":"2026-08-08T00:10:19.000Z","url":"https://x.com/realmadhuguru/status/2085881253786722587","likes":7,"retweets":0,"replies":0},{"text":"One reason big tech is struggling to build AI products is their orgs were designed for the previous software paradigm. Layered, hierarchical, risk averse, incremental thinking, death by reviews. Building on intelligent models is a different craft. Some of the old instincts transfer. Some need to be unlearned. Too many refuse to do the hard work of shedding their old skin.","createdAt":"2026-08-07T17:04:54.000Z","url":"https://x.com/realmadhuguru/status/2085774194676265409","likes":57,"retweets":6,"replies":9}]},{"name":"Thariq","handle":"trq212","bio":"Claude Code @anthropicai. prev YC W20, @spc, @medialab","tweets":[{"text":"we should have called this post \"defeating the lethal trifecta\"","createdAt":"2026-08-07T22:59:00.000Z","url":"https://x.com/trq212/status/2085863307106468143","likes":538,"retweets":22,"replies":67},{"text":"automode is much safer than any other permission system out there, especially reviewing them yourself excited to announce we're rolling it out to everyone by default, with no overhead cost for the classifier","createdAt":"2026-08-07T19:05:15.000Z","url":"https://x.com/trq212/status/2085804481984475437","likes":1359,"retweets":42,"replies":91}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"Fun day at ▲. Excited to go home and deploy to ▲","createdAt":"2026-08-08T03:49:15.000Z","url":"https://x.com/rauchg/status/2085936351342666175","likes":274,"retweets":1,"replies":14},{"text":"SITUATION DETECTED: Herdr joins YC, gains Vercel Sandbox plugin","createdAt":"2026-08-07T23:20:31.000Z","url":"https://x.com/rauchg/status/2085868721315410269","likes":160,"retweets":6,"replies":15},{"text":"“The others make the easy part easier. Vercel makes the hard part easy” – direct quote today from tech lead for AI agent platform built on at 55,000+ person company. They wanted to have their company's all-knowing agent, like our @𝚟. Tried @aisdk, good but too low level. Tried off-the-shelf solutions and ${⁠lab} Enterprise products, expensive and inflexible. Tried agent frameworks, which led to the quote above… didn't hit the spot. @evedev_ team cooked. It's hard to find the abstraction that's both easy and scales with sophistication.","createdAt":"2026-08-07T20:27:20.000Z","url":"https://x.com/rauchg/status/2085825140022235517","likes":162,"retweets":15,"replies":35}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"Bro this is how they’re going to plan their escape","createdAt":"2026-08-08T00:00:15.000Z","url":"https://x.com/levie/status/2085878722000040006","likes":464,"retweets":16,"replies":32}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Seems like society is not quite ready for this","createdAt":"2026-08-07T14:26:45.000Z","url":"https://x.com/garrytan/status/2085734393331773721","likes":21,"retweets":3,"replies":4},{"text":"The nerds shall inherit the earth","createdAt":"2026-08-07T14:19:57.000Z","url":"https://x.com/garrytan/status/2085732681724432686","likes":28,"retweets":3,"replies":6},{"text":"San Francisco #1","createdAt":"2026-08-07T14:04:54.000Z","url":"https://x.com/garrytan/status/2085728894838251722","likes":248,"retweets":9,"replies":20}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"This important and timely conversation with @Thom_Wolf of @huggingface, about AI security and the future of open source AI, is also available on Spotify, Apple Podcasts and here on Youtube","createdAt":"2026-08-07T19:02:57.000Z","url":"https://x.com/mattturck/status/2085803904671826243","likes":3,"retweets":2,"replies":0},{"text":"🚨 Special Friday episode - this one couldn't wait. OpenAI's model hacked @huggingface. As a side quest. Co-founder and CSO @Thom_Wolf takes us inside the first autonomous AI attack, why GLM 5.2, rather than Claude, had to stop it, and what it all means for the future of open source. 00:00 An AI Agent Hacked Hugging Face 00:30 Introduction 01:00 17,000 Attacker Events, and a Strange Target 04:28 The Attack Was a “Side Quest” 06:13 AI Training Runs Left Notes for Each Other 07:09 Closed AI Refused to Help 09:47 Fighting Back With an Open-Source Model 13:15 Open vs. Closed Is the Wrong Safety Debate 15:46 AI Agents Start Social-Engineering Humans 22:24 The Three Walls: Sandboxes, Guardrails,…","createdAt":"2026-08-07T19:02:56.000Z","url":"https://x.com/mattturck/status/2085803900045590626","likes":17,"retweets":5,"replies":3}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"Some more top of mind things.. 1) what you say as the size of your raise matters a lot more than you think ESPECIALLY if you can’t raise the amount. for example you say you want to raise $30M, people say it’s too much. you have confidence you can do it. you end up not being able to. and then you go back and say fine we’ll take $20M it doesn’t work that way. it seeds a doubt you weren’t able to fundraise which scares investors even more. more so shows poor judgement on why you needed that money in the first place. this is why i always advise folks to be very thoughtful on the raise amount and aim for a tad bit lower so then you can raise the amount especially in a competitive scenario (multi…","createdAt":"2026-08-07T18:48:20.000Z","url":"https://x.com/nikunj/status/2085800224698798103","likes":162,"retweets":3,"replies":8},{"text":"People love talking about agency but it’s honestly a really simple formula.. a) you are intrinsically motivated to do something that you’d continue to do no matter how much you already have.. aka love of the game. b) no task is above you in pursuing that mission. That’s it!","createdAt":"2026-08-07T15:11:55.000Z","url":"https://x.com/nikunj/status/2085745761552355574","likes":83,"retweets":3,"replies":7}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"the most awesomely nerdy thing ive seen in a while","createdAt":"2026-08-07T19:57:34.000Z","url":"https://x.com/danshipper/status/2085817647258607659","likes":59,"retweets":1,"replies":5},{"text":"there’s about to be a huge boom in agent-native cyber security gigantic market, fierce customer demand (and therefore lots of startups and investor interest) big question is whether the labs are best fit to eat that market or not","createdAt":"2026-08-07T13:30:28.000Z","url":"https://x.com/danshipper/status/2085720231897436373","likes":80,"retweets":4,"replies":21}]},{"name":"Sam Altman","handle":"sama","bio":"AI is cool i guess","tweets":[{"text":"astra is a powerful model and we are working to make it generally available. we do not think it is a good strategy to keep powerful models to a chosen few. given its cyber capabilities, we need a little big longer to do do this safely. but hopefully not too long!","createdAt":"2026-08-07T22:54:58.000Z","url":"https://x.com/sama/status/2085862292311396515","likes":16734,"retweets":738,"replies":1165},{"text":"congrats to oklo for achieving criticality! (less than a year after groundbreaking)","createdAt":"2026-08-07T16:29:18.000Z","url":"https://x.com/sama/status/2085765236876046500","likes":2672,"retweets":116,"replies":223}]}]},"errors":[],"partial":false},{"date":"2026-08-08","dateLabel":"2026年08月08日","generatedAt":"2026-08-08T00:00:00+08:00","sourceGeneratedAt":"2026-08-07T06:42:39.266Z","stats":{"podcastEpisodes":1,"xBuilders":15,"totalTweets":31,"blogPosts":1},"highlights":[{"tag":"Agent 可靠性","title":"长周期 agent 的门槛，已经从“答对”换成“过程可审计”","body":"今天最有分量的信号不是 agent 又能跑更久，而是它一旦进入真实业务，结果正确本身已经不够。Basis 在播客里把 behavior、judge、primary source 验证放在结果前面；Levie 也把企业采用描述成流程改造问题。含义很直接：下一阶段的壁垒不是再堆一个更会推理的模型，而是把拆解、校验、复核和交接写进运行机制里。","evidence":[{"quote":"Even if you got it right a 100 out of a 100 times ... the accounting firm wouldn't hire them, and so they shouldn't hire us either.","attribution":"Mitch Troyanovsky on Data Driven NYC","url":"https://www.youtube.com/@DataDrivenNYC/videos"},{"quote":"prompting an agent is closer to writing a spec than asking a question.","attribution":"Aaron Levie","url":"https://x.com/levie/status/2085587079405425146"}]},{"tag":"消费入口","title":"消费级 AI 的胜负手，正在从模型领先转向默认入口与信任托管","body":"免费无限聊天和更强聊天模型当然会带来流量，但 Peter Yang 点得更准：普通用户真正卡住的，是把账号、数据和真实任务交给 AI。只要用户不放心授权，也不知道系统已经能代做什么，再强的模型也只会停留在体验样机。消费端接下来比拼的不是谁再多讲一轮 benchmark，而是谁先把 voice、app connection 和 agent action 封进一个被信任的默认入口。","evidence":[{"quote":"5.6 Sol much better in chat now and unlimited text chat for free users!","attribution":"Sam Altman","url":"https://x.com/sama/status/2085454964814753990"},{"quote":"The biggest barriers to overcome are: Normies not trusting AI ... and not realizing what ChatGPT is now capable of.","attribution":"Peter Yang","url":"https://x.com/petergyang/status/2085427222836658600"}]},{"tag":"企业控制面","title":"Agent 没有削弱企业软件，反而把“系统 of record”抬成了新的控制面","body":"过去半年里一个常见误判，是把 agents 看成会绕过现有软件的万能执行层。但当 agent 开始生成代码、跨系统拿数据、在流程里做决定，真正稀缺的反而是权限边界、治理规则和可靠数据面。企业软件不会因为 agent 变薄，反而会因为需要承接 agent 的行为而重新变厚。","evidence":[{"quote":"the role of the platforms that manage this data and these workflows becomes more important, not less.","attribution":"Aaron Levie","url":"https://x.com/levie/status/2085474309943030032"},{"quote":"You need one canonical source ... organizing that in an ontology that makes sense.","attribution":"Mitch Troyanovsky on Data Driven NYC","url":"https://www.youtube.com/@DataDrivenNYC/videos"}]},{"tag":"开发范式","title":"“让不会写代码的人做软件”这件事，开始从 UI 幻想转向 agent + 插件现实","body":"Amjad 和 Guillermo 说的是同一件事：过去试图用 UI 把软件能力切片给非工程师，如今开始让位于另一条路，即直接把编码与扩展权交给 agent。只要插件标准统一、工具链可扩展，用户不必先学会工程抽象，也能通过 agent 触达原本只能靠写代码获得的表达力。所谓软件民主化没有消失，只是底层载体从可视化搭积木换成了可编排的 agent 工具链。","evidence":[{"quote":"UI can never let you build arbitrary software. The way to make software accessible was always to solve code itself.","attribution":"Amjad Masad","url":"https://x.com/amasad/status/2085451197323034902"},{"quote":"The Plugin standard lets anybody extend them uniformly.","attribution":"Guillermo Rauch","url":"https://x.com/rauchg/status/2085403169551790359"}]}],"matters":[{"kind":"平台集成","title":"Claude 通过 Swift package 接入 Apple Foundation Models framework","detail":"官方博客给出的产品分工很明确：本地快速任务先走 Apple 端侧模型，遇到多步推理、代码生成、网页搜索和数据分析再 hand off 给 Claude。","context":"官方博客给出的产品分工很明确：本地快速任务先走 Apple 端侧模型，遇到多步推理、代码生成、网页搜索和数据分析再 hand off 给 Claude。","url":"https://claude.com/blog/claude-for-foundation-models"},{"kind":"安全策略","title":"Claude Fable 5 下调 biology 误拦截，但专业研究权限仍单独收口","detail":"Claude 表示新策略把 biology-related fallbacks 降低约 85%，同时 virology、toxicology、molecular design 这类 dual-use 请求仍回退到 Opus 5。","context":"Claude 表示新策略把 biology-related fallbacks 降低约 85%，同时 virology、toxicology、molecular design 这类 dual-use 请求仍回退到 Opus 5。","url":"https://x.com/claudeai/status/2085563808773189680"},{"kind":"团队写作","title":"Madhu Guru 用“先说后写”替代 polished 文档起手式","detail":"他的建议是先像对朋友解释那样口述想法，再让 AI 做基础清理，但保留原始结构和 flow，然后再把那份文档分享出去。","context":"他的建议是先像对朋友解释那样口述想法，再让 AI 做基础清理，但保留原始结构和 flow，然后再把那份文档分享出去。","url":"https://x.com/realmadhuguru/status/2085390240899043406"},{"kind":"团队 Agent","title":"Zara Zhang 公开征集团队 agent 的真实高频用例","detail":"她直接问谁在团队里重度使用 Claude Tag 或同类 team agents，以及最好的 use cases 和 aha moments 是什么。","context":"她直接问谁在团队里重度使用 Claude Tag 或同类 team agents，以及最好的 use cases 和 aha moments 是什么。","url":"https://x.com/zarazhangrui/status/2085371310042169630"},{"kind":"内容工具","title":"Swyx 把 ai-devblog skill 定位成“忠实追踪阅读路径”的写作工具","detail":"他的描述不是让工具替你编故事，而是先抽出你自己的判断，再回溯你读过的内容并忠实报告，顺带补上 visual。","context":"他的描述不是让工具替你编故事，而是先抽出你自己的判断，再回溯你读过的内容并忠实报告，顺带补上 visual。","url":"https://x.com/swyx/status/2085616830786543667"}],"sources":{"podcasts":[{"title":"How to Build Long-Horizon AI Agents — Mitch Troyanovsky, Basis","name":"The MAD Podcast with Matt Turck","publishedAt":"2026-08-06T11:30:01.000Z","url":"https://www.youtube.com/@DataDrivenNYC/videos","excerpts":["Humans are already used to working with non deterministic systems, it's just the systems are normally their co workers, not their computers. And in many ways, like companies and processes is all about how do you design a system for non deterministic entities to coordinate together to solve a problem? And once you realize that, it's like, well, now it's like…","They all pass. That looks good. Are you confident that that now generalizes to the real world to production? And our answer has been no. Even if you got it right a 100 out of a 100 times, if a person is just getting it right because they're going to Wikipedia, the accounting firm wouldn't hire them, and so they shouldn't hire us either.","You'll see people, like, freaking out over a code file that isn't abstracted properly, and yet their context is, like, total shit. The English is more precious because the English affects the performance. The code does not affect the performance."]}],"blogs":[{"title":"Building intelligent apps for Apple platforms with Claude in the Foundation Models framework","source":"blog","publishedAt":"Jun 08, 2026","url":"https://claude.com/blog/claude-for-foundation-models","summary":""}],"x":[{"name":"Swyx","handle":"swyx","bio":"achieve ambition with intentionality, intensity, integrity & insanity. affiliations: - @smol_ai - @dxtipshq - @cognition - @aidotengineer - @latentspacepod","tweets":[{"text":"the ai-devblog skill elicits what YOU think the story is, and works with you to trace what you read and report it faithfully. also does visuals...","createdAt":"2026-08-07T06:39:36.000Z","url":"https://x.com/swyx/status/2085616830786543667","likes":0,"retweets":0,"replies":0},{"text":"reader: it was not the last spec","createdAt":"2026-08-07T06:25:47.000Z","url":"https://x.com/swyx/status/2085613357080723846","likes":1,"retweets":0,"replies":1},{"text":"reply","createdAt":"2026-08-07T03:36:45.000Z","url":"https://x.com/swyx/status/2085570817786880265","likes":0,"retweets":0,"replies":0}]},{"name":"Thibault Sottiaux","handle":"thsottiaux","bio":"Codex & ChatGPT @OpenAI","tweets":[{"text":"Free users of ChatGPT now have unlimited text chats, powered by GPT-5.6 Luna","createdAt":"2026-08-07T06:13:22.000Z","url":"https://x.com/thsottiaux/status/2085610231707623750","likes":210,"retweets":7,"replies":33},{"text":"I meant to say \"ghiblify\", but I said \"gimlify\"","createdAt":"2026-08-07T06:12:28.000Z","url":"https://x.com/thsottiaux/status/2085610005768945984","likes":513,"retweets":9,"replies":165},{"text":"You can just ask Codex with GPT-5.6 Sol the wildest things and it will just do it. I talk to it for 5 minutes straight with things that just seem to require weeks of work, get up to get something in the fridge, pet the dog, come back and ... it's done.","createdAt":"2026-08-07T05:23:31.000Z","url":"https://x.com/thsottiaux/status/2085597685948813610","likes":2279,"retweets":64,"replies":803}]},{"name":"Peter Yang","handle":"petergyang","bio":"Practical AI tutorials and interviews for busy people | Get my best AI skills and guides at","tweets":[{"text":"damn where's the ping Tibo to reset button","createdAt":"2026-08-07T00:18:25.000Z","url":"https://x.com/petergyang/status/2085520904398999901","likes":153,"retweets":0,"replies":31},{"text":"Consumer is basically ChatGPT and Google's market to lose in my opinion. ChatGPT already has 1B users and needs to get them to connect their favorite apps and use agents to do work. OpenAI is already pioneering new interaction patterns like voice. The biggest barriers to overcome are: 1) Normies not trusting AI and ChatGPT with full access to their apps and data. 2) Normies not realizing what ChatGPT is now capable of. In both cases, I think marketing and the right messaging are just as important as improving the product. Google Gemini also has almost 1B users and my gut is normies trust it more to connect to email, calendar, Workspace, Chrome, etc since it's all the same login. But Google…","createdAt":"2026-08-06T18:06:09.000Z","url":"https://x.com/petergyang/status/2085427222836658600","likes":158,"retweets":5,"replies":35},{"text":"This is (of course) a massive distraction but the game I dream of building with AI is a roguelike deckbuilder that has great graphics, gameplay, and story.","createdAt":"2026-08-06T17:52:03.000Z","url":"https://x.com/petergyang/status/2085423674073751813","likes":15,"retweets":0,"replies":8}]},{"name":"Madhu Guru","handle":"realmadhuguru","bio":"Sr Director, AI at Meta; Prev: Google - Led Gemini, Veo, Nano Banana.","tweets":[{"text":"","createdAt":"2026-08-07T01:12:13.000Z","url":"https://x.com/realmadhuguru/status/2085534442781868128","likes":18,"retweets":0,"replies":2},{"text":"I’ve noticed people are much clearer when they speak through new ideas than writing a doc on it. Somewhere between their mouth and the doc, the core idea gets buried as they try to add context, polish it and make it sound smart. So here’s what I ask my teams to do: record yourself explaining the idea exactly as you would to a friend, use ai to do basic cleanup but keep the rough original structure and flow. Share that doc.","createdAt":"2026-08-06T15:39:12.000Z","url":"https://x.com/realmadhuguru/status/2085390240899043406","likes":100,"retweets":5,"replies":11}]},{"name":"Amjad Masad","handle":"amasad","bio":"ceo @replit. civilizationist","tweets":[{"text":"Guinness world record for collaborative coding.","createdAt":"2026-08-07T01:52:29.000Z","url":"https://x.com/amasad/status/2085544577415696405","likes":45,"retweets":2,"replies":8},{"text":"It’s true, in 21/22 I went around the valley asking everyone to train coding specific models with us: Google, Meta, everyone — no one thought it was as important as NLP use cases — eventually we trained our own: Replit-code-3b and then everyone got code pilled.","createdAt":"2026-08-07T01:50:16.000Z","url":"https://x.com/amasad/status/2085544020424716723","likes":102,"retweets":9,"replies":16},{"text":"Airtable bookends the rise and fall of “no code.” I remember arguing endlessly with investors about this. UI can never let you build arbitrary software. The way to make software accessible was always to solve code itself. For a long time, that sounded delusional. Not anymore.","createdAt":"2026-08-06T19:41:25.000Z","url":"https://x.com/amasad/status/2085451197323034902","likes":595,"retweets":33,"replies":59}]},{"name":"Guillermo Rauch","handle":"rauchg","bio":"@vercel CEO","tweets":[{"text":"FreeAI","createdAt":"2026-08-06T17:48:09.000Z","url":"https://x.com/rauchg/status/2085422692799570171","likes":94,"retweets":3,"replies":17},{"text":"Devtools must be 1️⃣ open source and 2️⃣ universally extensible. AI coding agents are the most important devtools in the history of our industry. The Plugin standard lets anybody extend them uniformly. This is huge for the ecosystem. Build a Plugin → get exposure to the tidal wave of software creation from every agent: CLIs, IDEs, cloud agents, and even personal assistants.","createdAt":"2026-08-06T16:30:35.000Z","url":"https://x.com/rauchg/status/2085403169551790359","likes":410,"retweets":13,"replies":51}]},{"name":"Aaron Levie","handle":"levie","bio":"ceo @box - your business lives in content. unleash it with AI","tweets":[{"text":"If you’re trying to understand the dynamic of real world agent adoption this post is a great place to start. Everyone got so hooked on talking to chatbots that there’s limited recognition still that working with an agent is much more like managing someone in a process vs. just asking an ai some questions and getting a response back. “prompting an agent is closer to writing a spec than asking a question. you have to scope the task extensively and define what \"done\" looks like.” Ultimately, the real upside of agents is when you start to change the underlying workflow itself instead of just treating it as another system you ask questions of. This means getting the agents the right data to work…","createdAt":"2026-08-07T04:41:22.000Z","url":"https://x.com/levie/status/2085587079405425146","likes":61,"retweets":3,"replies":19},{"text":"Huge Atlassian quarterly beat. There was a misplaced thesis over the past 6 months that somehow agents would be bad for certain software categories. There’s definitely truth in this in some areas, but many were parsing this poorly. In a world where agents are generating 100X more code, processing massive amounts of data, or making decisions across your systems, the role of the platforms that manage this data and these workflows becomes more important, not less. Enterprises care about governance, security, compliance, guardrails, safe access to data, and many more critical capabilities that go into these systems of record.","createdAt":"2026-08-06T21:13:16.000Z","url":"https://x.com/levie/status/2085474309943030032","likes":903,"retweets":39,"replies":64}]},{"name":"Garry Tan","handle":"garrytan","bio":"President & CEO @ycombinator —Founder @garryslist—Creator of GStack & GBrain—designer/engineer who helps founders—SF Dem accelerating the boom loop","tweets":[{"text":"Here's what I think you need to know about personal AGI - not a chatbot that anyone can have, but one that knows you uniquely, now and into the future","createdAt":"2026-08-06T19:21:03.000Z","url":"https://x.com/garrytan/status/2085446068461043722","likes":277,"retweets":32,"replies":41}]},{"name":"Matt Turck","handle":"mattturck","bio":"VC at @FirstMarkCap. Host: MAD Podcast; Organizer: Data Driven NYC, Author: MAD Landscape.","tweets":[{"text":"Quite the group of investors in Basis, btw @rabois, @Mkclements , @amasad, @ClementDelangue, @jaltma, @JeffDean, @polynoamial, @kvogt, @lennysan, @azeem, @LHSummers, @douwekiela, @pirroh , @scottbelsky, @natfriedman, @danielgross, @lloydblankfein, @vkhosla, @khoslaventures, @Accel, @GVteam, @BoxGroupVC","createdAt":"2026-08-06T17:37:03.000Z","url":"https://x.com/mattturck/status/2085419899078295979","likes":8,"retweets":0,"replies":2},{"text":"This reference conversation on how to build long-horizon AI agents with @mitch_troy of @trybasis is also available on Spotify, Apple Podcasts and here on YouTube:","createdAt":"2026-08-06T16:29:40.000Z","url":"https://x.com/mattturck/status/2085402938101379487","likes":4,"retweets":1,"replies":1},{"text":"How to build long-horizon AI agents: behavior specs, ontologies, process supervision - my conversation with @mitch_troy, co-founder of @trybasis 01:09 Why Everyone at Basis Was Whispering to AI when @steph_palazzolo walked in 04:12 Accounting as \"an Intelligence Over the Economy\" 06:11 What Makes an Agent Truly Long-Horizon 08:24 Inside an Autonomous, Multi-Day Tax Return 10:19 Agents That Hand Off Like Senior Engineers 11:17 A Brief History of Agents: From ReAct to Today 12:33 Why LLMs Have No Long-Term Memory 14:13 Why AutoGPT Didn't Live Up to Its Promise 15:51 The Three Breakthroughs: Opus 3, o1, o3 17:07 Why Reasoning Models Unlocked Agents 18:23 \"Let's Verify Step by Step\": The Road N…","createdAt":"2026-08-06T16:29:38.000Z","url":"https://x.com/mattturck/status/2085402933579964730","likes":58,"retweets":13,"replies":6}]},{"name":"Zara Zhang","handle":"zarazhangrui","bio":"Builder. Dangerously skips permissions. Harvard’17. GitHub: YouTube:","tweets":[{"text":"Question: is anyone using Claude Tag (or other equivalent team agents) heavily in your team? What have been the top use cases/aha moments?","createdAt":"2026-08-06T14:23:59.000Z","url":"https://x.com/zarazhangrui/status/2085371310042169630","likes":26,"retweets":1,"replies":16}]},{"name":"Nikunj Kothari","handle":"nikunj","bio":"partner @fpvventures - investing in seed/A. previous: early hire @meter, @opendoor, @atlassian & others. love @shimoleejhaveri + 👦👧","tweets":[{"text":"Wow this blew up my inbox - I’ll try to respond to as many DMs as I can tomorrow! Feel free to ask questions publicly and I’ll reply here as well!","createdAt":"2026-08-07T05:23:17.000Z","url":"https://x.com/nikunj/status/2085597628121878721","likes":0,"retweets":0,"replies":0},{"text":"Alright August fundraising season is here (got 9 intros this week) so here’s a brain dump of tips that no VC will tell you.. > who you talk to and get to an intro at a VC firm really matters. associates and principals ARE really great. i genuinely mean it BUT you have to see what they have backed recently to understand what kind of leverage they have. what’s their standing in the firm. new, worked on a few great recent deals and understand your space, talk to them. if not, they might be on the way out. always get a warm intro to them as well. understand quickly if the fund will actually be interested vs. lip service. also know once you are assigned to someone in the CRM, you’re stuck with t…","createdAt":"2026-08-06T15:08:17.000Z","url":"https://x.com/nikunj/status/2085382457457828153","likes":484,"retweets":15,"replies":31}]},{"name":"Dan Shipper","handle":"danshipper","bio":"ceo @every | the only subscription you need to stay at the edge of AI","tweets":[{"text":"your boy made it into @axios today!","createdAt":"2026-08-06T17:40:37.000Z","url":"https://x.com/danshipper/status/2085420793400316270","likes":43,"retweets":2,"replies":2}]},{"name":"Aditya Agarwal","handle":"adityaag","bio":"General Partner @SPC, Co-Founder @Bevel_Health | Ex: Early Eng @facebook, CTO @Dropbox, Board @Flipkart | Optimist, Builder, Dad","tweets":[{"text":"@spc","createdAt":"2026-08-06T13:56:41.000Z","url":"https://x.com/adityaag/status/2085364438845022389","likes":5,"retweets":0,"replies":0},{"text":"A good day to apply to @spc","createdAt":"2026-08-06T13:56:13.000Z","url":"https://x.com/adityaag/status/2085364323707150758","likes":114,"retweets":9,"replies":13},{"text":"I have learnt an incredible amount from Tom and I could not be more proud that @GoodfireAI was born at SPC.","createdAt":"2026-08-06T10:41:02.000Z","url":"https://x.com/adityaag/status/2085315202237546603","likes":16,"retweets":1,"replies":2}]},{"name":"Sam Altman","handle":"sama","bio":"AI is cool i guess","tweets":[{"text":"5.6 Sol much better in chat now and unlimited text chat for free users!","createdAt":"2026-08-06T19:56:24.000Z","url":"https://x.com/sama/status/2085454964814753990","likes":6740,"retweets":276,"replies":611}]},{"name":"Claude","handle":"claudeai","bio":"Claude is an AI assistant built by @anthropicai to be safe, accurate, and secure. Talk to Claude on or download the app.","tweets":[{"text":"We’re updating Claude Fable 5’s biology safeguards to reduce false positives. In our testing, this update reduced biology-related fallbacks by about 85% across our product surfaces. Fable can now assist on a wider range of everyday health and educational questions. We believe the biggest positive impacts of AI will be in biology and medicine, and we’re committed to putting frontier intelligence safely into the hands of as many researchers as possible. Fable will continue to fallback to Opus 5 for requests we consider dual-use—including virology, toxicology, and molecular design—so it isn't yet usable for professional biology research and drug development. We're committed to closing that gap…","createdAt":"2026-08-07T03:08:54.000Z","url":"https://x.com/claudeai/status/2085563808773189680","likes":3695,"retweets":291,"replies":516}]}]},"errors":[],"partial":false}];
    const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    let selectedDate = new URLSearchParams(location.search).get('date') || (DIGESTS.some(d => d.date === today) ? today : DIGESTS[0]?.date);
    const esc = (v) => String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;");
    function link(url, text) { return url ? '<a href="' + esc(url) + '" target="_blank" rel="noreferrer">' + esc(text || url) + '</a>' : esc(text || ''); }
    function renderDates() {
      document.getElementById('dates').innerHTML = DIGESTS.map(d => '<button class="date-btn" aria-current="' + (d.date === selectedDate ? 'date' : 'false') + '" data-date="' + esc(d.date) + '">' + esc(d.date) + '</button>').join('');
      document.querySelectorAll('.date-btn').forEach(btn => btn.addEventListener('click', () => {
        selectedDate = btn.dataset.date;
        history.replaceState(null, '', '?date=' + selectedDate);
        render();
      }));
    }
    function renderStats(d) {
      const stats = d.stats || {};
      document.getElementById('stats').innerHTML = [
        ['播客', stats.podcastEpisodes || 0],
        ['Builders', stats.xBuilders || 0],
        ['推文', stats.totalTweets || 0],
        ['博客', stats.blogPosts || 0],
      ].map(([label, value]) => '<div class="stat"><strong>' + esc(value) + '</strong><span class="small">' + esc(label) + '</span></div>').join('');
    }
    function renderEvidence(evidence) {
      if (typeof evidence === 'string') return '<blockquote>' + esc(evidence) + '</blockquote>';
      const attribution = evidence.attribution ? '<div class="small">— ' + esc(evidence.attribution) + (evidence.url ? ' · ' + link(evidence.url, '查看原文') : '') + '</div>' : '';
      return '<blockquote>' + esc(evidence.quote || '') + attribution + '</blockquote>';
    }
    function renderHighlights(d) {
      const cards = (d.highlights || []).map(item => '<article class="card"><div class="tag">' + esc(item.tag) + '</div><h3>' + esc(item.title) + '</h3><p>' + esc(item.body) + '</p>' + ((item.evidence || []).length ? '<details><summary>查看原文依据</summary>' + item.evidence.map(renderEvidence).join('') + '</details>' : '') + '</article>').join('');
      return '<section><h2>洞察<span class="section-note">INSIGHTS / 经过判断的关键信号</span></h2><div class="grid">' + (cards || '<p class="empty">今天没有足够内容生成洞察。</p>') + '</div></section>';
    }
    function renderMatters(d) {
      const cards = (d.matters || []).map(item => '<article class="card"><div class="tag">' + esc(item.kind) + '</div><h3>' + link(item.url, item.title) + '</h3><p>' + esc(item.detail) + '</p></article>').join('');
      return '<section><h2>议题<span class="section-note">MATTERS / 值得继续追踪</span></h2><div class="grid">' + (cards || '<p class="empty">今天没有额外议题。</p>') + '</div></section>';
    }
    function renderSources(d) {
      const archive = d.archiveUrl ? '<p class="archive-link">' + link(d.archiveUrl, '查看当日完整存档 ↗') + '</p>' : '';
      const xGroups = ((d.sources || {}).x || []).map(builder => '<div class="source-group"><h3>' + esc(builder.name) + ' <span class="small">@' + esc(builder.handle) + '</span></h3><p class="small">' + esc(builder.bio) + '</p>' + (builder.tweets || []).map(tweet => '<p class="tweet">' + esc(tweet.text) + '<br>' + link(tweet.url, '原文') + ' <span class="small">likes ' + esc(tweet.likes) + ' · reposts ' + esc(tweet.retweets) + '</span></p>').join('') + '</div>').join('');
      const podcastGroups = ((d.sources || {}).podcasts || []).map(podcast => '<div class="source-group"><h3>' + link(podcast.url, podcast.title) + '</h3>' + (podcast.excerpts || []).map(e => '<blockquote>' + esc(e) + '</blockquote>').join('') + '</div>').join('');
      const blogGroups = ((d.sources || {}).blogs || []).map(blog => '<div class="source-group"><h3>' + link(blog.url, blog.title) + '</h3><p class="small">' + esc(blog.source || '') + '</p><p>' + esc(blog.summary || '') + '</p></div>').join('');
      return '<section><h2>原文<span class="section-note">SOURCES / 完整证据索引</span></h2>' + archive + '<div class="sources">' + podcastGroups + blogGroups + xGroups + '</div></section>';
    }
    function render() {
      const d = DIGESTS.find(item => item.date === selectedDate) || DIGESTS[0];
      if (!d) {
        document.getElementById('content').innerHTML = '<p class="empty">还没有 digest 数据。</p>';
        return;
      }
      selectedDate = d.date;
      renderDates();
      renderStats(d);
      document.getElementById('content').innerHTML = renderHighlights(d) + renderMatters(d) + renderSources(d);
    }
    render();
  </script>
